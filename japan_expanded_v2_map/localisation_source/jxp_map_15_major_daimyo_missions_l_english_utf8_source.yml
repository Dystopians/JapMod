l_english:
 jxp_map_mission_ari_kuchinotsu_port_title:0 "口之津港"
 jxp_map_mission_ari_kuchinotsu_port_desc:0 "岛原半岛的港湾可迎接远方商船。先立港法，贸易才不会被私斗和走私吞噬。"
 jxp_map_mission_ari_nanban_ships_title:0 "南蛮船来"
 jxp_map_mission_ari_nanban_ships_desc:0 "丝绸、硝石与陌生书籍随黑船入港。有马家必须选择吸收，而非被新奇之物牵着走。"
 jxp_map_mission_ari_shimabara_leagues_title:0 "岛原诸众"
 jxp_map_mission_ari_shimabara_leagues_desc:0 "半岛豪族、渔村与寺社各有旧权。以共同防务收束他们，方能抵挡肥前强邻。"
 jxp_map_mission_ari_gunpowder_workshops_title:0 "铳炮作"
 jxp_map_mission_ari_gunpowder_workshops_desc:0 "火器需要工匠、硝石和操练。将进口奇物变成本地军制，岛原才有自卫之力。"
 jxp_map_mission_ari_church_towns_title:0 "教会町"
 jxp_map_mission_ari_church_towns_desc:0 "新教会与旧寺社并处一地，必须有清楚法度保护信徒也约束冲突。"
 jxp_map_mission_ari_counter_ryuzoji_title:0 "抗衡龙造寺"
 jxp_map_mission_ari_counter_ryuzoji_desc:0 "北肥前霸主步步进逼。山城、盟约与海上补给要比对手更快结合。"
 jxp_map_mission_ari_amakusa_sea_title:0 "天草海道"
 jxp_map_mission_ari_amakusa_sea_desc:0 "天草诸岛连接岛原与南九州。掌握海道便能联络盟友，也能避开陆上围困。"
 jxp_map_mission_ari_western_gateway_title:0 "海西门户"
 jxp_map_mission_ari_western_gateway_desc:0 "当港口、信仰与火器皆受一制，有马领便可成为日本西海最耀眼的门户。"
 jxp_map_15_ari_legacy:0 "岛原南蛮门户"
 jxp_map_15_ari_legacy_desc:0 "口之津商馆、教会町与火器工匠在有马法度下共存，使岛原成为九州面向外海的窗口。"
 jxp_map_mission_azi_northern_omi_title:0 "北近江国众"
 jxp_map_mission_azi_northern_omi_desc:0 "湖北诸众熟悉山道与湖湾。浅井家要以共同军役把他们从京极旧秩序中分离出来。"
 jxp_map_mission_azi_biwa_shipping_title:0 "琵琶湖舟运"
 jxp_map_mission_azi_biwa_shipping_desc:0 "湖上船运可绕开崎岖陆路。港津和舟役是北近江财富与动员的命脉。"
 jxp_map_mission_azi_kyogoku_legacy_title:0 "京极旧权"
 jxp_map_mission_azi_kyogoku_legacy_desc:0 "浅井崛起于旧守护权力的裂缝。吸收而非尽毁旧官僚，才能迅速治理湖北。"
 jxp_map_mission_azi_odani_castle_title:0 "小谷山城"
 jxp_map_mission_azi_odani_castle_desc:0 "小谷城控扼北国脇往还。强化曲轮、道路和兵粮，可令强敌止步湖北。"
 jxp_map_mission_azi_asakura_alliance_title:0 "朝仓之盟"
 jxp_map_mission_azi_asakura_alliance_desc:0 "越前盟友为浅井提供北方支援，却也可能束缚选择。盟约须建立在互利而非旧情上。"
 jxp_map_mission_azi_lake_markets_title:0 "湖国市镇"
 jxp_map_mission_azi_lake_markets_desc:0 "近江商人穿行京都、北陆与东国。保护市场可把地理优势转化为常年收入。"
 jxp_map_mission_azi_control_kyoto_road_title:0 "扼守京道"
 jxp_map_mission_azi_control_kyoto_road_desc:0 "任何上洛之军都难绕过近江。掌握道路便能左右天下诸侯的进退。"
 jxp_map_mission_azi_hegemon_of_omi_title:0 "近江霸权"
 jxp_map_mission_azi_hegemon_of_omi_desc:0 "湖北国众、湖运与京道同归一制，浅井家便有资格统合整个近江。"
 jxp_map_15_azi_legacy:0 "北近江湖国政权"
 jxp_map_15_azi_legacy_desc:0 "小谷城、琵琶湖舟运与朝仓盟约支撑浅井家，使北近江成为京道上的独立强权。"
 jxp_map_mission_hng_ishiyama_honganji_title:0 "石山本愿寺"
 jxp_map_mission_hng_ishiyama_honganji_desc:0 "石山据水陆要冲。寺院、城郭与町市结合，可成为门徒共同体的坚固中心。"
 jxp_map_mission_hng_monto_registers_title:0 "门徒名册"
 jxp_map_mission_hng_monto_registers_desc:0 "讲与坊记录信众、粮米和役务。名册使分散信仰拥有共同动员能力。"
 jxp_map_mission_hng_jinai_towns_title:0 "寺内町"
 jxp_map_mission_hng_jinai_towns_desc:0 "受保护的市镇吸引商人和工匠。自治须与法主权威相互支撑。"
 jxp_map_mission_hng_bokan_network_title:0 "坊官众"
 jxp_map_mission_hng_bokan_network_desc:0 "坊官在教义与俗务之间穿梭。明确职责可避免地方道场各自为政。"
 jxp_map_mission_hng_ko_village_compacts_title:0 "讲与惣村"
 jxp_map_mission_hng_ko_village_compacts_desc:0 "村落共同体是门徒军粮与情报的根。保护其自治也要防止私怨冒用佛法。"
 jxp_map_mission_hng_nagashima_bastion_title:0 "长岛砦"
 jxp_map_mission_hng_nagashima_bastion_desc:0 "水网与洲岛可阻强军。把天然险势与寺内互援结合，长岛便能久守。"
 jxp_map_mission_hng_abbots_proclamation_title:0 "法主檄文"
 jxp_map_mission_hng_abbots_proclamation_desc:0 "一纸法旨可越过国界召集信众。号召越强，越需节制其用途。"
 jxp_map_mission_hng_pure_land_realm_title:0 "净土之国"
 jxp_map_mission_hng_pure_land_realm_desc:0 "当信仰、町众与惣村形成稳定秩序，本愿寺便不再只是寺院，而成为一种国家。"
 jxp_map_15_hng_legacy:0 "本愿寺寺内共同体"
 jxp_map_15_hng_legacy_desc:0 "门徒名册、寺内町与讲组织把信仰化为军粮、自治和跨国动员。"
 jxp_map_mission_krd_chikuzen_service_title:0 "筑前黑田"
 jxp_map_mission_krd_chikuzen_service_desc:0 "新领需要比战场更耐心的经营。先安置旧臣与村落，军师之名才有根基。"
 jxp_map_mission_krd_kanbei_counsel_title:0 "官兵卫之策"
 jxp_map_mission_krd_kanbei_counsel_desc:0 "情报、谈判与时机同样属于兵法。将谋略变成评定流程，而非只依赖一人奇才。"
 jxp_map_mission_krd_nakatsu_castle_title:0 "中津城"
 jxp_map_mission_krd_nakatsu_castle_desc:0 "河口城郭连接丰前陆海。城下、港口与仓储应按同一规划建设。"
 jxp_map_mission_krd_provision_office_title:0 "兵粮奉行"
 jxp_map_mission_krd_provision_office_desc:0 "远征常败于粮道。统一度量、仓单和转运，可令军势持久。"
 jxp_map_mission_krd_siege_works_title:0 "攻城普请"
 jxp_map_mission_krd_siege_works_desc:0 "土木、火器与劝降须协同。围城不是蛮力，而是一套可重复的工程。"
 jxp_map_mission_krd_great_return_title:0 "中国大返"
 jxp_map_mission_krd_great_return_desc:0 "道路、驿马与预先筹粮使大军能出人意料地回师。速度来自准备。"
 jxp_map_mission_krd_kyushu_settlement_title:0 "九州仕置"
 jxp_map_mission_krd_kyushu_settlement_desc:0 "战后分封与旧族安置决定胜利能否长存。奉行应先于掠夺进入新领。"
 jxp_map_mission_krd_josui_strategy_title:0 "如水之策"
 jxp_map_mission_krd_josui_strategy_desc:0 "黑田家将谋略、攻城与行政熔为一体，以小势撬动天下大局。"
 jxp_map_15_krd_legacy:0 "黑田军师奉行制"
 jxp_map_15_krd_legacy_desc:0 "攻城术、兵粮账和筑前奉行相互配合，使黑田家以精密筹划放大有限兵力。"
 jxp_map_mission_mog_dewa_house_title:0 "出羽最上"
 jxp_map_mission_mog_dewa_house_desc:0 "最上盆地诸族各有根基。以宗族与家臣团重新编排出羽权力。"
 jxp_map_mission_mog_yamagata_castle_title:0 "山形城下"
 jxp_map_mission_mog_yamagata_castle_desc:0 "城下町汇集道路与年贡。山形应成为北国政务而非单一堡垒。"
 jxp_map_mission_mog_mogami_river_title:0 "最上川舟运"
 jxp_map_mission_mog_mogami_river_desc:0 "河流贯穿盆地与庄内。整治舟运可把内陆米谷送往日本海。"
 jxp_map_mission_mog_ushu_tandai_title:0 "羽州探题遗绪"
 jxp_map_mission_mog_ushu_tandai_desc:0 "旧官名能召集服从，也会招来竞争。以实政重新赋予名分意义。"
 jxp_map_mission_mog_marriage_intrigue_title:0 "婚姻与调略"
 jxp_map_mission_mog_marriage_intrigue_desc:0 "北国诸家犬牙交错。婚盟、离间和人质有时比冬季远征更有效。"
 jxp_map_mission_mog_shonai_fields_title:0 "庄内沃野"
 jxp_map_mission_mog_shonai_fields_desc:0 "庄内平野是出羽粮仓。水利与检地能支持更大军势。"
 jxp_map_mission_mog_northern_dewa_title:0 "北羽经略"
 jxp_map_mission_mog_northern_dewa_desc:0 "山道与雪期决定征服速度。分区设城，逐步消化北方新领。"
 jxp_map_mission_mog_hegemon_of_dewa_title:0 "出羽霸主"
 jxp_map_mission_mog_hegemon_of_dewa_desc:0 "河运、沃野与山形政厅合为一体，最上家便可号令全出羽。"
 jxp_map_15_mog_legacy:0 "最上川领国制"
 jxp_map_15_mog_legacy_desc:0 "山形城、最上川舟运与庄内沃野被纳入同一北国行政网络。"
 jxp_map_mission_mts_kakizaki_merchants_title:0 "蠣崎海商"
 jxp_map_mission_mts_kakizaki_merchants_desc:0 "北海领地依赖商船多于稻田。保护船团就是保护家中根本。"
 jxp_map_mission_mts_oshima_forts_title:0 "渡岛馆"
 jxp_map_mission_mts_oshima_forts_desc:0 "沿岸诸馆既是城砦也是交易站。明确隶属可避免各馆自立。"
 jxp_map_mission_mts_ezo_trade_title:0 "夷地互市"
 jxp_map_mission_mts_ezo_trade_desc:0 "与阿伊努诸部的贸易需要约定价格、季节与纠纷裁判。"
 jxp_map_mission_mts_northern_sea_routes_title:0 "北海船路"
 jxp_map_mission_mts_northern_sea_routes_desc:0 "雾、寒流与漫长海岸考验航海。记录航线可减少每年损失。"
 jxp_map_mission_mts_market_fiefs_title:0 "商场知行"
 jxp_map_mission_mts_market_fiefs_desc:0 "以交易场收入分配家臣，使边疆军役不必依赖贫薄石高。"
 jxp_map_mission_mts_matsumae_gateway_title:0 "松前口"
 jxp_map_mission_mts_matsumae_gateway_desc:0 "控制南端港口便能管理北海货物进入本州的门户。"
 jxp_map_mission_mts_northern_lock_title:0 "北边锁钥"
 jxp_map_mission_mts_northern_lock_desc:0 "沿岸烽火与巡船应对走私和外来船影，北境不可无人守望。"
 jxp_map_mission_mts_ezo_commission_title:0 "虾夷奉行"
 jxp_map_mission_mts_ezo_commission_desc:0 "贸易、交涉与防务归于常设奉行，松前家由海商领主成长为北疆政权。"
 jxp_map_15_mts_legacy:0 "松前北海奉行"
 jxp_map_15_mts_legacy_desc:0 "渡岛馆、夷地互市与北海航路被编入边疆奉行体系。"
 jxp_map_mission_mtu_matsuura_league_title:0 "松浦党"
 jxp_map_mission_mtu_matsuura_league_desc:0 "岛屿领主与船手以血缘和盟誓相连。把海党变成可调度的共同军役。"
 jxp_map_mission_mtu_hirado_port_title:0 "平户港"
 jxp_map_mission_mtu_hirado_port_desc:0 "平户可接纳唐船与南蛮船。仓库、税则与治安必须先行。"
 jxp_map_mission_mtu_sea_warriors_title:0 "海贼众"
 jxp_map_mission_mtu_sea_warriors_desc:0 "善战船手既能护航也能劫掠。许可制度决定他们服务谁。"
 jxp_map_mission_mtu_foreign_quarters_title:0 "唐船宿"
 jxp_map_mission_mtu_foreign_quarters_desc:0 "外商需要固定居所与翻译，减少冲突也便于征税。"
 jxp_map_mission_mtu_gun_trade_title:0 "铁炮商"
 jxp_map_mission_mtu_gun_trade_desc:0 "火器贸易带来利润和风险。登记买卖可保证军中优先供应。"
 jxp_map_mission_mtu_red_seal_fleet_title:0 "朱印船"
 jxp_map_mission_mtu_red_seal_fleet_desc:0 "以印状区分商船与海盗，让远洋船队以松浦名义航行。"
 jxp_map_mission_mtu_goto_routes_title:0 "五岛海道"
 jxp_map_mission_mtu_goto_routes_desc:0 "五岛列岛是通往大陆的踏脚石。灯标与补给点可延伸航程。"
 jxp_map_mission_mtu_genkai_fleet_title:0 "玄海水军"
 jxp_map_mission_mtu_genkai_fleet_desc:0 "平户、五岛与海党合为一军，松浦家便能支配玄海潮路。"
 jxp_map_15_mtu_legacy:0 "松浦海党法"
 jxp_map_15_mtu_legacy_desc:0 "平户港、松浦党与远洋贸易在朱印法下结合，形成玄海强韧水军。"
 jxp_map_mission_myo_awa_retainers_title:0 "阿波三好众"
 jxp_map_mission_myo_awa_retainers_desc:0 "三好家由阿波武士与细川被官中崛起。先使家臣团忠于本家。"
 jxp_map_mission_myo_hosokawa_stewardship_title:0 "细川旧务"
 jxp_map_mission_myo_hosokawa_stewardship_desc:0 "掌握管领家政务的经验可转化为自己的奉行体系。"
 jxp_map_mission_myo_sakai_council_title:0 "堺会合"
 jxp_map_mission_myo_sakai_council_desc:0 "堺町众掌握财富和船舶。与会合众合作胜过粗暴征发。"
 jxp_map_mission_myo_iimoriyama_title:0 "饭盛山城"
 jxp_map_mission_myo_iimoriyama_desc:0 "据守河内高地可控制京都与堺之间的道路。"
 jxp_map_mission_myo_kinai_government_title:0 "畿内政权"
 jxp_map_mission_myo_kinai_government_desc:0 "摄津、河内与阿波需由跨海政务网连接，而非临时军镇。"
 jxp_map_mission_myo_manage_the_shogun_title:0 "奉戴将军"
 jxp_map_mission_myo_manage_the_shogun_desc:0 "将军名号仍有价值，但不应反过来支配三好实权。"
 jxp_map_mission_myo_capital_hegemony_title:0 "京洛霸权"
 jxp_map_mission_myo_capital_hegemony_desc:0 "控制京都、堺和周边要塞，畿内诸家便只能在三好秩序内行动。"
 jxp_map_mission_myo_miyoshi_realm_title:0 "三好天下"
 jxp_map_mission_myo_miyoshi_realm_desc:0 "由被官而至天下执权，三好政权证明新秩序不必出自古老名门。"
 jxp_map_15_myo_legacy:0 "三好畿内政权"
 jxp_map_15_myo_legacy_desc:0 "阿波家臣、堺会合与京畿城郭构成不依赖旧幕府的畿内霸权。"
 jxp_map_mission_nbs_naoshige_council_title:0 "锅岛直茂之议"
 jxp_map_mission_nbs_naoshige_council_desc:0 "谨慎谋划和及时进言是锅岛崛起的根本。让评定容纳异议。"
 jxp_map_mission_nbs_saga_plain_title:0 "佐贺平野"
 jxp_map_mission_nbs_saga_plain_desc:0 "低湿平野需要水利与堤防，方能稳定产粮。"
 jxp_map_mission_nbs_survey_accounts_title:0 "检地算用"
 jxp_map_mission_nbs_survey_accounts_desc:0 "统一田亩与年贡账，旧豪族隐匿的资源才归公用。"
 jxp_map_mission_nbs_ryuzoji_retainers_title:0 "安置龙造寺旧臣"
 jxp_map_mission_nbs_ryuzoji_retainers_desc:0 "旧主家臣既危险也有用。分级安置可减少反乱。"
 jxp_map_mission_nbs_ariake_dikes_title:0 "有明海堤"
 jxp_map_mission_nbs_ariake_dikes_desc:0 "围海造田与港渠整治同时扩大农业和航运。"
 jxp_map_mission_nbs_pottery_and_ports_title:0 "陶器与港税"
 jxp_map_mission_nbs_pottery_and_ports_desc:0 "工匠产品和港口税收可使肥前经济不只依赖稻米。"
 jxp_map_mission_nbs_hizen_settlement_title:0 "肥前仕置"
 jxp_map_mission_nbs_hizen_settlement_desc:0 "城郭、代官和法度须覆盖肥前诸郡。"
 jxp_map_mission_nbs_nabeshima_code_title:0 "锅岛藩法"
 jxp_map_mission_nbs_nabeshima_code_desc:0 "务实节制成为家中常法，使佐贺政权经得起长期考验。"
 jxp_map_15_nbs_legacy:0 "锅岛佐贺仕置"
 jxp_map_15_nbs_legacy_desc:0 "检地、海堤与旧臣安置构成务实严密的肥前治理。"
 jxp_map_mission_rkk_kannonji_court_title:0 "观音寺评定"
 jxp_map_mission_rkk_kannonji_court_desc:0 "南近江诸家围绕观音寺汇集。评定必须平衡守护权与国人旧习。"
 jxp_map_mission_rkk_rokkaku_code_title:0 "六角氏式目"
 jxp_map_mission_rkk_rokkaku_code_desc:0 "家臣连署的分国法既约束臣下，也提醒当主不可任性。"
 jxp_map_mission_rkk_koka_networks_title:0 "甲贺众"
 jxp_map_mission_rkk_koka_networks_desc:0 "甲贺乡士熟悉山路与情报。以契约雇用他们，避免私斗失控。"
 jxp_map_mission_rkk_biwa_tolls_title:0 "琵琶湖关津"
 jxp_map_mission_rkk_biwa_tolls_desc:0 "湖岸关津和舟运税是南近江财源，税则必须统一。"
 jxp_map_mission_rkk_omi_merchants_title:0 "近江商人"
 jxp_map_mission_rkk_omi_merchants_desc:0 "行商遍及诸国。保护其信用网络可带回财富与消息。"
 jxp_map_mission_rkk_retainer_compact_title:0 "家臣连署"
 jxp_map_mission_rkk_retainer_compact_desc:0 "强臣参与法度制定，既能分享责任，也能限制内讧。"
