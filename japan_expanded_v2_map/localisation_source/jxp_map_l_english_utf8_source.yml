 ARI_ideas_bonus:0 "有马的抱负"
 jxp_map_ari_identity_1:0 "有马浦津名册"
 jxp_map_ari_identity_1_desc:0 "登记船头、问丸与泊税，使有马家看清沿岸财富的流向。"
 jxp_map_ari_identity_2:0 "有马水主役"
 jxp_map_ari_identity_2_desc:0 "以稳定役法召集水主和船匠，为有马舰队维持可靠人力。"
 jxp_map_ari_identity_3:0 "有马船厂法度"
 jxp_map_ari_identity_3_desc:0 "统一木料、铁钉和修造规制，扩大有马家的海上动员。"
 jxp_map_ari_identity_4:0 "有马港市仓屋"
 jxp_map_ari_identity_4_desc:0 "受保护的仓屋与市町把海贸收益留在有马领内。"
 jxp_map_ari_identity_5:0 "有马潮路众"
 jxp_map_ari_identity_5_desc:0 "熟悉暗礁和季风的潮路众替有马家控制海峡与远航通道。"
 jxp_map_ari_identity_6:0 "有马船盟誓约"
 jxp_map_ari_identity_6_desc:0 "浦众以共同誓约接受有马家的裁断，同时保留航海经验。"
 jxp_map_ari_identity_7:0 "有马海路公法"
 jxp_map_ari_identity_7_desc:0 "港札、救难与护航规则合为有马家可以公开执行的海法。"
