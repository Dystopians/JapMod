 jxp_map_azi_identity_1:0 "浅井家门谱"
 jxp_map_azi_identity_1_desc:0 "重修谱牒与公验，使浅井家在朝廷与旧国间获得可援引的名分。"
 jxp_map_azi_identity_2:0 "浅井奏请使节"
 jxp_map_azi_identity_2_desc:0 "常驻京都的使者以礼物、书状与斡旋经营浅井家的声望。"
 jxp_map_azi_identity_3:0 "浅井庄园奉行"
 jxp_map_azi_identity_3_desc:0 "厘清寺社、庄园与武家领之间的权利，充实浅井家财政。"
 jxp_map_azi_identity_4:0 "浅井奉公众"
 jxp_map_azi_identity_4_desc:0 "熟悉礼法与诉讼的奉公众将浅井命令落实到各地。"
 jxp_map_azi_identity_5:0 "浅井调停状"
 jxp_map_azi_identity_5_desc:0 "以调停和誓约终止争端，比无休止的私斗更能扩大浅井影响。"
 jxp_map_azi_identity_6:0 "浅井京畿学问"
 jxp_map_azi_identity_6_desc:0 "公家、僧侣与书吏带来的学问成为浅井治理领国的工具。"
 jxp_map_azi_identity_7:0 "浅井旧国公法"
 jxp_map_azi_identity_7_desc:0 "名分与实务合为公开法度，使浅井家支配不再依赖一时威望。"
