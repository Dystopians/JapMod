 jxp_map_castle_network:0 "山城连环"
 jxp_map_castle_network_desc:0 "依山据险的支城与狼烟台，使小国也能迟滞强敌。"
 jxp_map_land_survey:0 "检地丈量"
 jxp_map_land_survey_desc:0 "丈量田亩、厘清名田，令兵粮与年贡不再只见于旧账。"
 jxp_map_kokujin_compacts:0 "国人一揆"
 jxp_map_kokujin_compacts_desc:0 "以誓纸约束国人众，在共同利害下暂息家中争端。"
 jxp_map_market_towns:0 "城下町"
 jxp_map_market_towns_desc:0 "将寺社、市与武家町集中于城下，催生稳定的手工业与流通。"
 jxp_map_coastal_routes:0 "沿岸航路"
 jxp_map_coastal_routes_desc:0 "整顿浦、津与关所，让兵粮和商货沿日本海与濑户内海转运。"
 jxp_map_house_codes:0 "家法与奉行"
 jxp_map_house_codes_desc:0 "以家法划分军役，以奉行裁断诉讼，使当主的命令可以贯彻领内。"
 jxp_map_provincial_identity:0 "旧国之名"
 jxp_map_provincial_identity_desc:0 "旧国山川与社寺塑造共同归属，也为扩张提供了有力名分。"
