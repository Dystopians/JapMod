 jxp_map_ank_identity_1:0 "姊小路山城网"
 jxp_map_ank_identity_1_desc:0 "姊小路家把山城、狼烟台与谷口砦连成互相支援的防线。"
 jxp_map_ank_identity_2:0 "姊小路领国检地"
 jxp_map_ank_identity_2_desc:0 "田亩与军役一并登记，使姊小路家能准确掌握兵粮与年贡。"
 jxp_map_ank_identity_3:0 "姊小路国人军役"
 jxp_map_ank_identity_3_desc:0 "以誓纸重订国人众义务，把地方武力纳入姊小路家的旗本编制。"
 jxp_map_ank_identity_4:0 "姊小路城下兵站"
 jxp_map_ank_identity_4_desc:0 "道路、宿驿与城下仓储让姊小路军势能够持续远征。"
 jxp_map_ank_identity_5:0 "姊小路旗本誓纸"
 jxp_map_ank_identity_5_desc:0 "直属家臣以共同法度与恩赏维系对姊小路当主的忠诚。"
 jxp_map_ank_identity_6:0 "姊小路边路奉行"
 jxp_map_ank_identity_6_desc:0 "专任奉行巡察边路、渡口与支城，压缩敌军可乘之隙。"
 jxp_map_ank_identity_7:0 "姊小路一国法度"
 jxp_map_ank_identity_7_desc:0 "从诉讼到征发均依姊小路家法裁断，旧国遂成一体。"
