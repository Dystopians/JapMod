l_english:
 jxp_map_mission_warrior_muster_title:0 "整编国众旗本"
 jxp_map_mission_warrior_muster_desc:0 "将散居领内的国人、地侍与谱代编入统一军役，建立能够随时动员的旗本众。"
 jxp_map_mission_warrior_castle_roads_title:0 "贯通山城驿路"
 jxp_map_mission_warrior_castle_roads_desc:0 "山城若无道路与兵粮转运便只是孤垒。我们应把支城、渡口与驿站连成一体。"
 jxp_map_mission_warrior_provincial_banner_title:0 "掲起一国之旗"
 jxp_map_mission_warrior_provincial_banner_desc:0 "旧国的武士与百姓应当认得同一面旗帜，并接受同一套军令。"
 jxp_map_mission_warrior_retainer_census_title:0 "重编家臣军籍"
 jxp_map_mission_warrior_retainer_census_desc:0 "把直属旗本、国人众与足轻役重新登记，才能让领国的军令越过旧有家门边界。"
 jxp_map_mission_warrior_hostage_registers_title:0 "整顿人质誓书"
 jxp_map_mission_warrior_hostage_registers_desc:0 "誓书、人质与恩赏必须由同一奉行掌管，家臣的义务方能成为稳定制度。"
 jxp_map_mission_warrior_hegemon_oath_title:0 "会盟旧国诸将"
 jxp_map_mission_warrior_hegemon_oath_desc:0 "当诸将愿在同一面旗帜下立誓，我们便不再只是众多地方领主之一。"
 jxp_map_mission_court_genealogies_title:0 "校订家系谱牒"
 jxp_map_mission_court_genealogies_desc:0 "以寺社文书、旧券与公家证言重修谱牒，使领国支配获得足以服众的名分。"
 jxp_map_mission_court_capital_petitions_title:0 "经营京畿奏请"
 jxp_map_mission_court_capital_petitions_desc:0 "礼物、书状与使者同样是兵器。经营朝廷关系能把地方实力转化为天下名望。"
 jxp_map_mission_court_old_province_claim_title:0 "继承旧国名分"
 jxp_map_mission_court_old_province_claim_desc:0 "当旧国的社寺、庄园与武家都承认我们的裁断，名分便不再只是纸上的称号。"
 jxp_map_mission_court_shugo_archives_title:0 "汇编守护文库"
 jxp_map_mission_court_shugo_archives_desc:0 "将公验、寄进状和历代裁许汇入文库，让古老名分能够服务于当下的领国治理。"
 jxp_map_mission_court_kinri_embassies_title:0 "常驻禁里使节"
 jxp_map_mission_court_kinri_embassies_desc:0 "常驻京都的使节应熟悉礼法、馈赠与调停，使地方实力转化为朝廷认可。"
 jxp_map_mission_court_realm_arbitration_title:0 "裁断诸家争端"
 jxp_map_mission_court_realm_arbitration_desc:0 "当邻国与家臣都愿援引我们的裁断，谱牒上的名望便已化为真正的政治权威。"
 jxp_map_mission_sea_port_registers_title:0 "编制浦津名册"
 jxp_map_mission_sea_port_registers_desc:0 "逐一登记浦、津、船头与问丸，海上收入才不会消失在岛屿与湾澳之间。"
 jxp_map_mission_sea_shipwright_leagues_title:0 "联合船匠水主"
 jxp_map_mission_sea_shipwright_leagues_desc:0 "保障木料、铁钉与水主役的供给，使各港能够按统一规格建造和修理船只。"
 jxp_map_mission_sea_inner_routes_title:0 "掌握内海航路"
 jxp_map_mission_sea_inner_routes_desc:0 "熟悉潮汐与礁石的船队，能够把分散岛屿变成贯通领国的道路。"
 jxp_map_mission_sea_harbor_magistrates_title:0 "设置港务奉行"
 jxp_map_mission_sea_harbor_magistrates_desc:0 "统一港札、仓屋与泊税的裁断，使沿岸财富能够稳定支撑领国。"
 jxp_map_mission_sea_red_seal_networks_title:0 "编织朱印航网"
 jxp_map_mission_sea_red_seal_networks_desc:0 "以受承认的文书保护商舶，并让各港依同一尺度承担护航与税役。"
 jxp_map_mission_sea_strait_command_title:0 "号令诸海峡"
 jxp_map_mission_sea_strait_command_desc:0 "能够维护航路、惩治掠夺并召集水军的家门，才配主导群岛之间的秩序。"
 jxp_map_mission_frontier_passes_title:0 "设守山川关隘"
 jxp_map_mission_frontier_passes_desc:0 "边地的权力首先体现为谁能守住山口、河谷与冬季仍可通行的道路。"
 jxp_map_mission_frontier_new_fields_title:0 "开垦盆地新田"
 jxp_map_mission_frontier_new_fields_desc:0 "修堰、疏渠并安置流民，让狭窄盆地也能供养更多城兵与聚落。"
 jxp_map_mission_frontier_border_oaths_title:0 "重定边境誓约"
 jxp_map_mission_frontier_border_oaths_desc:0 "以界碑、婚盟和人质重订边界，使国人众知道战时应向何处集结。"
 jxp_map_mission_frontier_hostage_registers_title:0 "编订边众人质簿"
 jxp_map_mission_frontier_hostage_registers_desc:0 "把边境国人的誓书与人质统一登记，减少山川阻隔带来的反复背盟。"
 jxp_map_mission_frontier_winter_roads_title:0 "贯通冬季军道"
 jxp_map_mission_frontier_winter_roads_desc:0 "修整雪岭、渡口与兵粮宿，使军势在最恶劣的季节仍能抵达边境。"
 jxp_map_mission_frontier_march_law_title:0 "颁行边国军法"
 jxp_map_mission_frontier_march_law_desc:0 "守备、开垦与国人义务必须写入共同法度，边疆才会成为稳定领国。"
 jxp_map_mission_temple_ledgers_title:0 "清点寺社名田"
 jxp_map_mission_temple_ledgers_desc:0 "寺社、座与门前町掌握的土地和账目，是领国内不可忽视的财政网络。"
 jxp_map_mission_temple_market_towns_title:0 "营造寺内町市"
 jxp_map_mission_temple_market_towns_desc:0 "保护定期市、仓屋与手工业者，让香火、粮运与商税共同滋养城下。"
 jxp_map_mission_temple_public_law_title:0 "颁行领国公法"
 jxp_map_mission_temple_public_law_desc:0 "把寺社仲裁、商人惯例与武家法度整理为可公开援引的领国法。"
 jxp_map_mission_temple_debt_arbitration_title:0 "设立德政奉行"
 jxp_map_mission_temple_debt_arbitration_desc:0 "以公开尺度处理债务、质地与荒年减免，避免德政要求演变为无序冲突。"
 jxp_map_mission_temple_common_granaries_title:0 "联结寺町共同仓"
 jxp_map_mission_temple_common_granaries_desc:0 "让寺社、町众与村落共同维持粮仓，在歉收与战时守住领国根基。"
 jxp_map_mission_temple_realm_compact_title:0 "缔结寺市国约"
 jxp_map_mission_temple_realm_compact_desc:0 "当武家、寺社与商人都接受同一公法，领国秩序便获得长久支撑。"

 jxp_map_adopt_warrior_domain_code_title:0 "制定国众军役令"
 jxp_map_adopt_warrior_domain_code_desc:0 "在旗本与国人之间划定军役、兵粮和守城义务。"
 jxp_map_compile_court_genealogies_title:0 "汇编家门公验"
 jxp_map_compile_court_genealogies_desc:0 "收集朝廷、寺社和旧主留下的文书，确立家门在旧国中的法统。"
 jxp_map_register_coastal_leagues_title:0 "登记沿岸船盟"
 jxp_map_register_coastal_leagues_desc:0 "承认船头与浦众的旧约，同时把其船只、航路与税额纳入领国账册。"
 jxp_map_mark_frontier_boundaries_title:0 "丈量边境界线"
 jxp_map_mark_frontier_boundaries_desc:0 "勘定山谷、水源和冬道，以新的界碑结束国人之间反复发生的争执。"
 jxp_map_publish_market_statutes_title:0 "公布寺市法度"
 jxp_map_publish_market_statutes_desc:0 "统一座税、借贷、宿驿与寺社保护规则，稳定领国内的市场秩序。"

 jxp_map.1.t:0 "观音寺城下的账册"
 jxp_map.1.d:0 "近江交通四达，六角氏的权力却分散在众多国人和寺社手中。观音寺城下新汇集的账册，让我们第一次能把道路、年贡与军役放在同一张图上。"
 jxp_map.1.a:0 "以账册整顿近江"
 jxp_map.1.b:0 "先巩固山城与国人誓约"
 jxp_map.2.t:0 "加贺门徒的共同仓"
 jxp_map.2.d:0 "门徒众提议在寺内町设立共同仓，荒年放粮、战时供军。若能约束各坊的私账，这套网络将使加贺真正成为一体。"
 jxp_map.2.a:0 "让寺内町承担公用"
 jxp_map.2.b:0 "保留各坊自治以换取忠诚"
 jxp_map.3.t:0 "山形盆地的水争"
 jxp_map.3.d:0 "最上川支流的堰渠年久失修，各庄为争水屡起械斗。奉行提出统一丈量水程，并由山形城裁定灌溉次序。"
 jxp_map.3.a:0 "重修堰渠与新田"
 jxp_map.3.b:0 "把水役编入军役体系"
 jxp_map.4.t:0 "津轻平野的新检地"
 jxp_map.4.d:0 "新取得的津轻平野仍沿用旧主与寺社相互矛盾的账册。若不能确认田地和农户，独立就只是换了一面旗。"
 jxp_map.4.a:0 "派奉行逐村丈量"
 jxp_map.4.b:0 "先以军役换取国人服从"
 jxp_map.5.t:0 "平户与壹岐之间"
 jxp_map.5.d:0 "松浦水军熟悉每一处潮口，却也习惯各自收取泊税。商人请求一张能在平户、壹岐与西肥前通用的航行凭证。"
 jxp_map.5.a:0 "统一港札与泊税"
 jxp_map.5.b:0 "优先扩充水军编制"
 jxp_map.6.t:0 "岛原海岸的异国商舶"
 jxp_map.6.d:0 "自火绳枪传入之后，异国商舶开始更频繁地出现在岛原近海。奉行必须决定，是把贸易集中于受控港口，还是只收取礼物而避免过深介入。"
 jxp_map.6.a:0 "设港严管而不闭绝"
 jxp_map.6.b:0 "谨慎接待，暂不开放领内"
 jxp_map.7.t:0 "人吉盆地的相良法"
 jxp_map.7.d:0 "球磨川把领地连成狭长盆地，也让村落之间的水权、山权纠纷格外尖锐。家臣建议将历代判例整理为公开的相良法。"
 jxp_map.7.a:0 "以成文法安定村落"
 jxp_map.7.b:0 "以军役重申家臣秩序"
 jxp_map.8.t:0 "大隅隼人众的马场"
 jxp_map.8.d:0 "大隅山野适合放牧，隼人众也保留着强悍的地方传统。扩建马场可以增强军势，却需要承认其首领在乡里的地位。"
 jxp_map.8.a:0 "编成大隅骑马众"
 jxp_map.8.b:0 "以直属武士监督马场"
 jxp_map.9.t:0 "安房水军与里见海防"
 jxp_map.9.d:0 "房总半岛三面临海，海路既是补给线也是敌军的入口。里见家臣提出把渔浦、烽火台与水军船屋纳入统一海防。"
 jxp_map.9.a:0 "经营浦津与水军"
 jxp_map.9.b:0 "优先强化半岛山城"
 jxp_map.10.t:0 "小谷城与琵琶湖路"
 jxp_map.10.d:0 "湖北虽以小谷城为根本，却必须依赖琵琶湖航运和北国街道。控制渡口与市町，才能摆脱旧主留下的影子。"
 jxp_map.10.a:0 "整顿湖北渡口与市"
 jxp_map.10.b:0 "以朝廷与寺社承认巩固名分"

 jxp_map.20.t:0 "国众军役令的尺度"
 jxp_map.20.d:0 "新法应当把更多资源投入直属军势，还是先承认国人旧权，以换取迅速而可靠的动员？"
 jxp_map.20.a:0 "扩充直属旗本与城下"
 jxp_map.20.b:0 "以宽和军役换取国人效忠"
 jxp_map.21.t:0 "谱牒与现实"
 jxp_map.21.d:0 "谱牒可以证明古老名分，也可以成为吸纳新家臣的工具。我们应强调血统，还是把功绩写入家门记忆？"
 jxp_map.21.a:0 "以谱牒建设新的政治中心"
 jxp_map.21.b:0 "以恩赏和功绩扩大家门"
 jxp_map.22.t:0 "船盟的权利"
 jxp_map.22.d:0 "浦众愿意接受统一港札，但要求保留传统航路和自卫武装。完全收归直属会更整齐，也可能损害他们的经验。"
 jxp_map.22.a:0 "投资直属港务与船厂"
 jxp_map.22.b:0 "承认船盟自治与经验"
 jxp_map.23.t:0 "界碑之后"
 jxp_map.23.d:0 "重新丈量边界后，我们可以修筑直属关城，也可以让边境国人继续承担守备，以减少中央负担。"
 jxp_map.23.a:0 "修筑直属关城与兵站"
 jxp_map.23.b:0 "确认国人的边境守备权"
 jxp_map.24.t:0 "寺市法度的取舍"
 jxp_map.24.d:0 "统一规则能增加收入，却也会打破寺社与座商长期维持的平衡。法度应当直接介入市场，还是只负责调停？"
 jxp_map.24.a:0 "营造受法度保护的新市"
 jxp_map.24.b:0 "以调停换取寺社和商人合作"

 jxp_map.900.t:0 "八十八国地图核验簿"
 jxp_map.900.d:0 "伴生地图目标：日本区域共八十八省；新增省份编号为4942至4981；1444基础发展度总计500；所有省份至少具有二十二个地图像素。壹岐、隐岐、淡路与先岛采用受限的地图学放大，请结合地图模式检查点击、港口、海岸和部队位置。"
 jxp_map.900.a:0 "记录在案"

 jxp_map_debug_show_panel_title:0 "[地图调试]展开八十八国面板"
 jxp_map_debug_show_panel_desc:0 "显示伴生地图专用的核验、事件与重置决议。"
 jxp_map_debug_hide_panel_title:0 "[地图调试]收起八十八国面板"
 jxp_map_debug_hide_panel_desc:0 "隐藏伴生地图专用调试决议。"
 jxp_map_debug_open_ledger_title:0 "[地图调试]查看核验簿"
 jxp_map_debug_open_ledger_desc:0 "显示省份数量、编号和重点运行测试提示。"
 jxp_map_debug_initialize_origin_title:0 "[地图调试]重建当前家系出身"
 jxp_map_debug_initialize_origin_desc:0 "为当前新增大名补记家系出身并初始化主模组的大名机制。"
 jxp_map_debug_unify_88_title:0 "[地图调试]一键统一八十八国"
 jxp_map_debug_unify_88_desc:0 "调用主模组的一键统一效果；由于日本区域已更新，该效果应覆盖全部八十八省。"
 jxp_map_debug_clear_state_title:0 "[地图调试]清除伴生内容状态"
 jxp_map_debug_clear_state_desc:0 "清除伴生事件、决议、遗产和临时修正，并按当前标签重建出身。"
 jxp_map_debug_event_rkk_title:0 "[地图事件]六角：观音寺账册"
 jxp_map_debug_event_rkk_desc:0 "直接触发六角家事件。"
 jxp_map_debug_event_hng_title:0 "[地图事件]本愿寺：加贺共同仓"
 jxp_map_debug_event_hng_desc:0 "直接触发本愿寺事件。"
 jxp_map_debug_event_mog_title:0 "[地图事件]最上：山形水争"
 jxp_map_debug_event_mog_desc:0 "直接触发最上家事件。"
 jxp_map_debug_event_tgr_title:0 "[地图事件]津轻：平野检地"
 jxp_map_debug_event_tgr_desc:0 "直接触发津轻家事件。"
 jxp_map_debug_event_mtu_title:0 "[地图事件]松浦：平户壹岐航路"
 jxp_map_debug_event_mtu_desc:0 "直接触发松浦家事件。"
 jxp_map_debug_event_ari_title:0 "[地图事件]有马：岛原商舶"
 jxp_map_debug_event_ari_desc:0 "直接触发有马家事件。"
 jxp_map_debug_event_sgr_title:0 "[地图事件]相良：人吉法度"
 jxp_map_debug_event_sgr_desc:0 "直接触发相良家事件。"
 jxp_map_debug_event_kmp_title:0 "[地图事件]肝付：大隅马场"
 jxp_map_debug_event_kmp_desc:0 "直接触发肝付家事件。"
 jxp_map_debug_event_stm_title:0 "[地图事件]里见：安房海防"
 jxp_map_debug_event_stm_desc:0 "直接触发里见家事件。"
 jxp_map_debug_event_azi_title:0 "[地图事件]浅井：湖北湖路"
 jxp_map_debug_event_azi_desc:0 "直接触发浅井家事件。"
 jxp_map_debug_policy_warrior_title:0 "[地图决议]测试武家军役令"
 jxp_map_debug_policy_warrior_desc:0 "直接打开武家类领国决议事件。"
 jxp_map_debug_policy_court_title:0 "[地图决议]测试公家谱牒"
 jxp_map_debug_policy_court_desc:0 "直接打开公家类领国决议事件。"
 jxp_map_debug_policy_sea_title:0 "[地图决议]测试沿岸船盟"
 jxp_map_debug_policy_sea_desc:0 "直接打开海洋类领国决议事件。"
 jxp_map_debug_policy_frontier_title:0 "[地图决议]测试边境界碑"
 jxp_map_debug_policy_frontier_desc:0 "直接打开边疆类领国决议事件。"
 jxp_map_debug_policy_temple_title:0 "[地图决议]测试寺市法度"
 jxp_map_debug_policy_temple_desc:0 "直接打开寺市类领国决议事件。"

