 jxp_77_mission_tsushima_channel_council_title:0 "议定对马海峡"
 jxp_77_mission_tsushima_channel_council_desc:0 "掌握对马门户，并令通词、浦众和巡船共同接受一套跨海规则。"
 jxp_77_mission_setouchi_pilot_circuit_title:0 "联结濑户内水先"
