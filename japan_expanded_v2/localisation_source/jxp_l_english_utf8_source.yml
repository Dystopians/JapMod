l_english:
 KJP:0 "吉利支丹日本"
 KJP_ADJ:0 "吉利支丹日本"
 CJP:0 "朱子礼制日本"
 CJP_ADJ:0 "礼制日本"
 EJP:0 "大和朝廷"
 EJP_ADJ:0 "大和"
 RFJ:0 "改革宗日本"
 RFJ_ADJ:0 "改革宗日本"
 SJP:0 "和之苏丹国"
 SJP_ADJ:0 "和之苏丹国"

 jxp_tenka_order:0 "天下秩序"
 jxp_tenka_order_desc:0 "城下的法度、村中的账册与诸侯的誓纸共同维系天下。兵锋可以夺取京都，秩序却要在年贡、道路与人心之间慢慢生根。"
 jxp_imperial_sanction:0 "天皇裁可"
 jxp_imperial_sanction_desc:0 "禁里的灯火、宣旨的墨迹与朝仪的鼓声为新政权覆上一层古老名分。皇天无亲，惟德是辅。"
 jxp_oceanic_opening:0 "海门外学"
 jxp_oceanic_opening_desc:0 "从长崎、平户与堺出海的船只带回银、火器、医书、信仰和不安。海门一开，风也随之入座。"
 jxp_tenka_order_at_least_25:0 "天下渐定"
 jxp_tenka_order_at_least_50:0 "诸法可行"
 jxp_tenka_order_at_least_75:0 "天下大定"
 jxp_imperial_sanction_at_least_30:0 "禁里有望"
 jxp_imperial_sanction_at_least_50:0 "宣旨可凭"
 jxp_imperial_sanction_at_least_70:0 "王命昭然"
 jxp_oceanic_opening_at_least_20:0 "海门初启"
 jxp_oceanic_opening_at_least_35:0 "异风入港"
 jxp_oceanic_opening_at_least_50:0 "外学成流"
 jxp_oceanic_opening_at_least_60:0 "远洋可议"
 jxp_oceanic_opening_at_least_75:0 "沧溟可渡"

 jxp_shimabara_fire:0 "岛原之火"
 jxp_shimabara_fire_desc:0 "九州的饥馑、重赋与禁教把村落推向沉默的边缘。潜伏信徒在夜色中祈祷，奉行的文书却一日比一日严厉。"

 jxp_land_survey_momentum:0 "奉行检地"
 jxp_land_survey_momentum_desc:0 "田畴丈量、村账重修，年贡与劳役终于有了可循之册。战国遗民从刀影下回到田垄之间。"
 jxp_sword_hunt_order:0 "刀狩令"
 jxp_sword_hunt_order_desc:0 "铁刃离开村社，悬入官库。武士与百姓之间的界线因法度而清晰，旧日一揆的火种也被湿土覆盖。"
 jxp_relaxed_domains:0 "放宽诸藩"
 jxp_relaxed_domains_desc:0 "江户与京都的目光暂且移开，让诸藩在不失体面的余地中自行收拾家政。"
 jxp_restored_imperial_palace:0 "修缮禁里"
 jxp_restored_imperial_palace_desc:0 "禁里垣墙重整，朝仪器物再陈。朝廷的威仪不只属于京都，也照见诸国对名分的想象。"
 jxp_imperial_edict:0 "奉宣旨而行"
 jxp_imperial_edict_desc:0 "宣旨所到，刀兵便披上礼法的外衣。天下人可以争胜，却不能轻易无视禁里的名义。"
 jxp_kobu_gattai_rite:0 "公武合体仪"
 jxp_kobu_gattai_rite_desc:0 "朝廷与武家在同一席上重申边界。鼓声、笏板与太刀一同证明，新秩序仍能容纳旧礼。"
 jxp_foreign_factory:0 "开设商馆"
 jxp_foreign_factory_desc:0 "异国商人被安置在可见之处。丝货、银流与译书进入账册，传闻和信仰也随潮声靠岸。"
 jxp_expelled_padres:0 "驱逐伴天连"
 jxp_expelled_padres_desc:0 "伴天连被命令离港，寺社与奉行暂得安宁。只是海雾退去之后，仍有人在心中默念旧名。"
 jxp_dejima_window:0 "出岛窗口"
 jxp_dejima_window_desc:0 "一岛一桥之间，货物可入，书籍可译，人心却须细察。闭门不是失聪，而是把耳朵贴近门缝。"
 jxp_reviewed_translations:0 "译书审定"
 jxp_reviewed_translations_desc:0 "医书、炮术、天文与航海图被译官逐字校读。异国之学若要入国，先要过奉行的朱笔。"
 jxp_route_sakoku:0 "守护神国"
 jxp_route_sakoku_desc:0 "神国之名不是拒绝海风，而是令海风循门而入。寺请、海防与出岛共同守护一座谨慎的日本。"
 jxp_route_open_trade:0 "开国通商"
 jxp_route_open_trade_desc:0 "朱印船、译书局与远洋船厂接连成策。日本不再只等待黑船入港，而要把自己的旗帜送向外海。"
 jxp_route_kirishitan:0 "基督之日轮"
 jxp_route_kirishitan_desc:0 "十字与日轮并列，长崎钟声越过海峡。新的信仰若能被国家掌握，便会成为另一种天下名分。"
 jxp_route_confucian:0 "朱子礼制国家"
 jxp_route_confucian_desc:0 "礼者，天地之序也。讲院、藩校与名分把战国的锋刃磨成文治的笔画。"
 jxp_route_imperial:0 "王政复古"
 jxp_route_imperial_desc:0 "朝廷不再只是被保护的象征。大和王权从仪礼中起身，将武家与诸藩重新纳入皇命之下。"
 jxp_sengoku_negotiations:0 "国人众调停"
 jxp_sengoku_negotiations_desc:0 "国人众仍记得山城与村社的旧盟。以誓纸换取从属，比以刀刃逼迫更能久长。"
 jxp_tanegashima_foundries:0 "种子岛铁炮锻造"
 jxp_tanegashima_foundries_desc:0 "铁炮由奇物变成军阵之器。锻冶、火药与操典一同书写战国末年的新声。"
 jxp_namban_trade:0 "南蛮贸易"
 jxp_namban_trade_desc:0 "黑船带来丝、银、镜、枪与异国神名。港町因之繁盛，也因之夜夜难眠。"
 jxp_kirishitan_networks:0 "吉利支丹网络"
 jxp_kirishitan_networks_desc:0 "传教士、商人、受洗武士与港口妇孺在海路上彼此认得。信仰成为看不见的航线。"
 jxp_confucian_academies:0 "朱子学讲院"
 jxp_confucian_academies_desc:0 "讲院中，武士学习经义，也学习如何在太平之世成为官吏。"
 jxp_rangaku_bureau:0 "兰学局"
 jxp_rangaku_bureau_desc:0 "兰书不再只在私塾间传抄。译者、医师与炮术家被召入官署，使外学服务国用。"
 jxp_shimabara_mediation:0 "岛原调停"
 jxp_shimabara_mediation_desc:0 "百姓的饥苦、信徒的恐惧与奉行的威严被摆在同一张案上。和解不光彩，却能让土地重新呼吸。"
 jxp_shimabara_suppressed:0 "岛原镇压"
 jxp_shimabara_suppressed_desc:0 "城垣倾塌，旌旗归营。秩序得以恢复，然而海边的村落仍会在冬夜讲起那场火。"
 jxp_shimabara_disaster_modifier:0 "岛原动荡"
 jxp_shimabara_disaster_modifier_desc:0 "九州的怒潮尚未破岸，却已在田赋、信仰与饥馑之间反复回响。"
 jxp_mission_tenka_state:0 "天下国家"
 jxp_mission_tenka_state_desc:0 "昔日割据被收进法度、账册与街道。天下不再只是胜者的名号，而成为官府日复一日的工作。"
 jxp_mission_oceanic_ports:0 "海门诸港"
 jxp_mission_oceanic_ports_desc:0 "长崎、平户与堺的码头连成外洋的舌头。国家从这些港口听见远方。"
 jxp_mission_court_order:0 "朝廷秩序"
 jxp_mission_court_order_desc:0 "禁里的礼仪、武家的军令与地方的账册在同一套秩序下互相解释。"
 jxp_kyoto_renewed:0 "京都再兴"
 jxp_kyoto_renewed_desc:0 "荒草退去，町人归来。夏草や兵どもが夢の跡，旧梦之上又有新灯。"
 jxp_nagasaki_factory:0 "长崎商馆"
 jxp_nagasaki_factory_desc:0 "长崎的仓库里有丝绸、白银、圣像与兰书。每一件货物都要经过奉行的眼睛。"

 jxp_decision_initialize_polity_title:0 "整理日轮国体"
 jxp_decision_initialize_polity_desc:0 "召集奉行、译官与朝廷使者，重校国家账册与礼仪次第。若新政初立而诸道未明，此举可使政务归于可议。"
 jxp_decision_conduct_land_survey_title:0 "奉行检地"
 jxp_decision_conduct_land_survey_desc:0 "命奉行丈量田畴，重订村账。天下之治始于一垄一亩，亦始于百姓知道何者为役、何者为贡。"
 jxp_decision_issue_sword_hunt_title:0 "刀狩令"
 jxp_decision_issue_sword_hunt_desc:0 "收诸村之兵器，别武士与百姓之分。昔日一揆赖刀而起，太平之世则须令刀归于官府。"
 jxp_decision_relax_domains_title:0 "放宽诸藩"
 jxp_decision_relax_domains_desc:0 "暂缓对诸藩的逼迫，使地方得以整顿财赋、安抚家臣。太紧则断，稍缓则续。"
 jxp_decision_restore_imperial_palace_title:0 "修缮禁里"
 jxp_decision_restore_imperial_palace_desc:0 "修禁里垣墙，补朝仪器物，使京都再显王气。名分虽无形，却常借梁柱、御帘与诏书而立。"
 jxp_decision_request_imperial_edict_title:0 "请下宣旨"
 jxp_decision_request_imperial_edict_desc:0 "遣使入京，请朝廷以宣旨申明大义。以礼法行军，便使刀兵有了可向天下陈述的理由。"
 jxp_decision_kobu_gattai_rite_title:0 "公武合体仪"
 jxp_decision_kobu_gattai_rite_desc:0 "使公家与武家同席盟誓，以礼仪缝合权柄的裂处。太刀在侧，笏板在前，二者皆不可缺。"
 jxp_decision_open_foreign_factory_title:0 "开设商馆"
 jxp_decision_open_foreign_factory_desc:0 "许异国商人居于指定港町，令奉行管其货、译官审其书。开放若无边界，便不是政策而是潮水。"
 jxp_decision_expel_padres_title:0 "驱逐伴天连"
 jxp_decision_expel_padres_desc:0 "敕令伴天连离境，禁其私入乡村。此举可安寺社与旧俗，却也会让港口少一条通往外洋的耳目。"
 jxp_decision_dejima_window_title:0 "出岛窗口"
 jxp_decision_dejima_window_desc:0 "把外商、译书和医术安置在狭小而可察的窗口之内。门虽窄，风仍能入。"
 jxp_decision_review_translations_title:0 "译书审定"
 jxp_decision_review_translations_desc:0 "召译官、医师与儒者共校兰书。可用者录入官库，可疑者封存待议。"
 jxp_decision_settle_the_realm_title:0 "天下定分"
 jxp_decision_settle_the_realm_desc:0 "诸岛初定，兵火渐远。国家必须决定自己将以何种名义面对神国、朝廷、外洋与万民。"
 jxp_decision_debug_show_values_title:0 "巡览日轮国体"
 jxp_decision_debug_show_values_desc:0 "呈上奉行所所录国体略报。其文不言银米细数，只述天下、禁里与海门三道之大势。"

 jxp_realm.1.t:0 "天下定分"
 jxp_realm.1.d:0 "战国余烬渐熄，诸将的梦如夏草伏地。日本必须为新世选择根基：以锁国守护神国，以港口通向外洋，以基督信仰重塑日轮，以改革宗章程约束海门，以海峡港法连接南海，以朱子礼制治理万民，或使朝廷重归政治中心。"
 jxp_realm.1.a:0 "守护神国。"
 jxp_realm.1.b:0 "开国通商。"
 jxp_realm.1.c:0 "基督之日轮。"
 jxp_realm.1.e:0 "朱子礼制国家。"
 jxp_realm.1.f:0 "王政复古。"
 jxp_realm.1.g:0 "路线已定，不再更改。"
 jxp_realm.2.t:0 "日轮国体"
 jxp_realm.2.d:0 "奉行所呈上国体略报：\n\n天下之法已在城下町、村账与诸藩誓纸之间运行；禁里的裁可仍为国政添上古老名分；长崎与平户的海风则不断送来外学、货银与纷扰。\n\n三道互相牵引，过盛则生弊，过弱则失势。执政者所能做的，不过是在潮声与鼓声之间让日本不致倾覆。"
 jxp_realm.2.a:0 "记下。"

 jxp_sengoku.1.t:0 "花之御所的阴影"
 jxp_sengoku.1.d:0 "京都仍是名义的中心，花之御所却投下长长阴影。战国诸将都知道，谁能扶起朝廷的仪礼，谁便能把胜利说成天下的归心。"
 jxp_sengoku.1.a:0 "奉礼于京都。"
 jxp_sengoku.1.b:0 "先整顿地方。"
 jxp_sengoku.2.t:0 "国人众倒向何方"
 jxp_sengoku.2.d:0 "地方国人众在山城、寺社与村落之间经营多年。他们会向强者低头，却不会轻易忘记自己的旧权。"
 jxp_sengoku.2.a:0 "以调停换取兵力。"
 jxp_sengoku.2.b:0 "以法令压服他们。"
 jxp_sengoku.3.t:0 "上洛邀请"
 jxp_sengoku.3.d:0 "京都使者语气委婉，意思却清楚：天下若要有名分，便要有人入京维持朝仪。"
 jxp_sengoku.3.a:0 "接受朝廷的期待。"
 jxp_sengoku.3.b:0 "让宣称为我们开路。"
 jxp_sengoku.4.t:0 "本能寺之影"
 jxp_sengoku.4.d:0 "强权、火器与急速扩张使家臣团心生畏惧。夏草や兵どもが夢の跡，若忠诚只由恐惧维系，天下事业也可能毁于一夜。"
 jxp_sengoku.4.a:0 "裂痕已经爆发。"
 jxp_sengoku.4.b:0 "以军令压住异心。"

 jxp_namban.1.t:0 "种子岛铁炮"
 jxp_namban.1.d:0 "异国商船把雷鸣般的铁器带上种子岛。工匠们拆其机括，量其铳管，仿佛在一截黑铁中看见新时代的影子。"
 jxp_namban.1.a:0 "让铁炮改变战场。"
 jxp_namban.1.b:0 "保持谨慎。"
 jxp_namban.2.t:0 "南蛮船入港"
 jxp_namban.2.d:0 "黑船入港，货舱里有丝绸、火药、白银、玻璃与圣像。港町的欢声与寺社的钟声一同响起，却并不和谐。"
 jxp_namban.2.a:0 "开放受控交易。"
 jxp_namban.2.b:0 "港口必须收紧。"
 jxp_namban.3.t:0 "堺商人的请愿"
 jxp_namban.3.d:0 "堺商人呈上账簿与航海图，请求让朱印船驶向更远之地。他们说海上有银，也有国家应得的体面。"
 jxp_namban.3.a:0 "准许他们远航。"
 jxp_namban.3.b:0 "财富不能压过秩序。"
 jxp_namban.4.t:0 "兰书入库"
 jxp_namban.4.d:0 "医学、天文、炮术与航海书籍被带入港口。问题不在于读不读，而在于由谁来读，又由谁来解释。"
 jxp_namban.4.a:0 "设局翻译。"
 jxp_namban.4.b:0 "谨慎封存。"

 jxp_kirishitan.1.t:0 "传教士抵岸"
 jxp_kirishitan.1.d:0 "传教士与商船相伴而来，带着十字架、药方与新奇的世界图。他们请求庇护，也在寻找愿意倾听的大名。"
 jxp_kirishitan.1.a:0 "允许他们停留。"
 jxp_kirishitan.1.b:0 "限制他们活动。"
 jxp_kirishitan.2.t:0 "受洗的大名"
 jxp_kirishitan.2.d:0 "一位地方领主公开接受洗礼。港口商人欢欣，寺社疑惧，朝廷则沉默地等待武家给出解释。"
 jxp_kirishitan.2.a:0 "承认新的信仰网络。"
 jxp_kirishitan.2.b:0 "让朝廷秩序压过热情。"
 jxp_kirishitan.3.t:0 "潜伏信徒"
 jxp_kirishitan.3.d:0 "禁令之下，信徒并未消失。他们把圣名藏进渔网、灶台与家族记忆，像潮汐一样退去又回来。"
 jxp_kirishitan.3.a:0 "以调停避免仇恨。"
 jxp_kirishitan.3.b:0 "以禁令斩断根源。"
 jxp_kirishitan.4.t:0 "岛原之火"
 jxp_kirishitan.4.d:0 "赋役、饥荒、禁教与地方怨恨汇成烈焰。幕府必须决定，是以铁与血恢复秩序，还是承认地方伤口并寻求和解。"
 jxp_kirishitan.4.a:0 "镇压叛乱。"
 jxp_kirishitan.4.b:0 "以和解收束灾难。"

 jxp_sakoku.1.t:0 "锁国令之后"
 jxp_sakoku.1.d:0 "闭关并不意味着完全断绝。真正的问题是，怎样让少数窗口服从整体秩序，又不让国家在静默中失去听觉。"
 jxp_sakoku.1.a:0 "收紧法度。"
 jxp_sakoku.1.b:0 "保留出岛窗口。"
 jxp_rangaku.1.t:0 "兰学局"
 jxp_rangaku.1.d:0 "译者、医师与炮术家请求把外来知识编入官学。古池や蛙飛び込む水の音，一点涟漪也可能惊动旧水。"
 jxp_rangaku.1.a:0 "让外学为国家服务。"
 jxp_confucian.1.t:0 "朱子学讲院"
 jxp_confucian.1.d:0 "儒者提出以礼制、名分与学校治理战国之后的社会。礼不只是仪式，也是一张能把武士放回位置的网。"
 jxp_confucian.1.a:0 "设讲院而正名分。"

 KJP_ideas:0 "吉利支丹日本理念"
 KJP_ideas_desc:0 "港口、教会与受洗武士共同塑造新的日本。日轮仍照诸岛，只是其光芒被十字架、银船与远方使节重新解释。"
 KJP_ideas_start:0 "吉利支丹传统"
 KJP_ideas_bonus:0 "吉利支丹雄心"
 kjp_nagasaki_crossroads:0 "长崎十字港"
 kjp_nagasaki_crossroads_desc:0 "长崎码头上，十字架、银箱与译官的笔同时出现。此港既通向澳门与马尼拉，也通向一种新的日本想象。"
 kjp_baptized_daimyo:0 "受洗大名"
 kjp_baptized_daimyo_desc:0 "受洗领主以新的信仰名义凝聚家臣，旧的血缘忠诚由新的誓言重新书写。"
 kjp_tensho_embassy:0 "天正遣欧"
 kjp_tensho_embassy_desc:0 "少年使节越过大海，让远方宫廷第一次认真听见日本之名。"
 kjp_seminary_networks:0 "神学校网络"
 kjp_seminary_networks_desc:0 "神学校培养译者、医师、文书与传教助手，使信仰也有了可治理的骨架。"
 kjp_kirishitan_artillery:0 "基督炮术"
 kjp_kirishitan_artillery_desc:0 "南蛮铳炮与本土锻冶相遇，战场上的火光也染上了跨海而来的技艺。"
 kjp_church_ports:0 "教会港市"
 kjp_church_ports_desc:0 "港口教会为水手、商人和信徒提供庇护，也把信仰网络系在码头木桩上。"
 kjp_hidden_faiths_reconciled:0 "潜伏信徒和解"
 kjp_hidden_faiths_reconciled_desc:0 "旧禁令留下的裂痕被纳入新的国家叙事。那些曾在暗处祈祷的人，终于能在日光下开口。"

 CJP_ideas:0 "朱子礼制日本理念"
 CJP_ideas_desc:0 "礼制、学校与户籍把战国之后的诸岛纳入文治秩序。此道不废神祇旧仪，而以经义、名分与官学重写国家之形。"
 CJP_ideas_start:0 "礼制传统"
 CJP_ideas_bonus:0 "礼制雄心"
 cjp_zhu_xi_lectures:0 "朱子讲席"
 cjp_zhu_xi_lectures_desc:0 "朱子之学为君臣、父子与武家秩序提供语言。名分既定，政令才有可落脚之处。"
 cjp_hayashi_academy:0 "林家学问所"
 cjp_hayashi_academy_desc:0 "官学讲院把武家子弟训练成能书写法度、解释礼仪并管理太平的文治人才。"
 cjp_domain_schools:0 "藩校制度"
 cjp_domain_schools_desc:0 "各藩学校使地方武士共享同一种经义与行政语言。诸侯仍分土，学问却可同源。"
 cjp_ritual_bureaucracy:0 "礼制官僚"
 cjp_ritual_bureaucracy_desc:0 "官署不只处理账册，也处理名分。礼仪让权力变得可见，文书让权力得以久存。"
 cjp_merit_registers:0 "功名账册"
 cjp_merit_registers_desc:0 "功绩、俸禄与职责被录入清晰账册。太平之世的武士必须学会在纸面上立功。"
 cjp_ordered_status:0 "四民秩序"
 cjp_ordered_status_desc:0 "身份秩序让社会各安其位，也让国家知道该向谁征税、向谁发令、向谁讲礼。"
 cjp_korean_embassies:0 "朝鲜通信使"
 cjp_korean_embassies_desc:0 "朝鲜使节往来如镜，使礼制日本看见自己在东亚秩序中的姿态。"

 EJP_ideas:0 "大和朝廷理念"
 EJP_ideas_desc:0 "王政复古使京都重新成为政令之源。禁里、诏书与日轮军旗让地方强权服从更古老也更鲜明的合法性。"
 EJP_ideas_start:0 "大和传统"
 EJP_ideas_bonus:0 "大和雄心"
 ejp_restored_court:0 "朝廷复兴"
 ejp_restored_court_desc:0 "朝廷不再只是被供奉的象征。禁里之名重新进入政务，令诸藩在礼法前低头。"
 ejp_kinri_guard:0 "禁里卫队"
 ejp_kinri_guard_desc:0 "亲卫守护京都，也守护复古事业。太刀环列于御所之外，使诏书不至空悬。"
 ejp_court_provinces:0 "朝廷直辖"
 ejp_court_provinces_desc:0 "直辖账册让朝廷拥有可凭之财。没有米银供给，最庄严的礼仪也会变成空声。"
 ejp_yamato_liturgy:0 "大和礼仪"
 ejp_yamato_liturgy_desc:0 "神道、朝仪与国家叙事被重新连接。日出扶桑，旧礼化为新政。"
 ejp_imperial_rescripts:0 "王政诏书"
 ejp_imperial_rescripts_desc:0 "诏书把地方行政与武家军令纳入同一合法性。奉命而行者，不再只是强者。"
 ejp_central_registers:0 "中央户籍"
 ejp_central_registers_desc:0 "土地、人丁与军役被更直接地登记。朝廷要复兴，先要知道自己统治的是谁。"
 ejp_sun_banner_army:0 "日轮军旗"
 ejp_sun_banner_army_desc:0 "军队以朝廷名义出征。日轮旗升起之处，士卒相信自己不只是为家名而战。"

 jxp_mission_secure_home_domain_title:0 "固守本领"
 jxp_mission_secure_home_domain_desc:0 "诸道未定之前，先使本领安宁。城、田、港与家臣团若不稳固，天下只是空谈。"
 jxp_mission_road_to_kyoto_title:0 "上洛之路"
 jxp_mission_road_to_kyoto_desc:0 "京都仍是名分之都。踏上上洛之路，便是在向天下宣称我们不只求胜，也求承认。"
 jxp_mission_unite_the_isles_title:0 "统一诸岛"
 jxp_mission_unite_the_isles_desc:0 "九州、四国、本州与北国诸地必须归于同一法度。诸岛一统，天下定分才有根基。"
 jxp_mission_settle_the_realm_title:0 "天下定分"
 jxp_mission_settle_the_realm_desc:0 "统一之后，国家路线终于可以确立。此后每一项法令都将回答日本究竟要成为什么。"
 jxp_mission_land_survey_state_title:0 "太阁检地"
 jxp_mission_land_survey_state_desc:0 "土地账册是近世国家的骨架。丈量田地，就是把战国之后的混乱写成可治理的文字。"
 jxp_mission_modern_state_title:0 "近世国家"
 jxp_mission_modern_state_desc:0 "战国的胜利必须转化为制度的胜利。只有法度能把一代雄主的事业留给后世。"
 jxp_mission_capital_cities_title:0 "城下町"
 jxp_mission_capital_cities_desc:0 "繁荣的首都与城下町承载商人、工匠、武士与税粮。国家的心跳常在市声中显现。"
 jxp_mission_kyoto_and_edo_title:0 "京都与江户"
 jxp_mission_kyoto_and_edo_desc:0 "京都掌名分，江户掌政务。两座城市若能相互承认，天下便有了双重支柱。"
 jxp_mission_iwami_silver_title:0 "石见银山"
 jxp_mission_iwami_silver_desc:0 "银山的光泽照亮港口，也照亮奉行所的账册。财富若能入法度，才不只是诱惑。"
 jxp_mission_osaka_granary_title:0 "大阪粮仓"
 jxp_mission_osaka_granary_desc:0 "天下厨房汇聚米、银与商人。谁掌握大阪，谁便能听见日本经济的呼吸。"
 jxp_mission_tanegashima_firearms_title:0 "种子岛铁炮"
 jxp_mission_tanegashima_firearms_desc:0 "火器技术将改变军制。铁炮齐鸣时，旧日勇武也必须让位于操典。"
 jxp_mission_massed_volley_title:0 "齐射战法"
 jxp_mission_massed_volley_desc:0 "铁炮不再只是奇物，而成为军阵节奏的一部分。烟雾散尽后，战国也变了面貌。"

 jxp_mission_temple_registration_title:0 "寺请制度"
 jxp_mission_temple_registration_desc:0 "以寺院登记百姓，使信仰、户籍与地方责任彼此相连。神佛之门亦可成为国家之门。"
 jxp_mission_expel_padres_title:0 "驱逐伴天连"
 jxp_mission_expel_padres_desc:0 "锁国路线必须处理传教士问题。若异国信仰越过港町深入村落，法度便会失去边界。"
 jxp_mission_closed_country_edicts_title:0 "锁国令"
 jxp_mission_closed_country_edicts_desc:0 "闭关并非无知，而是制度化的选择。国家只允许自己能够看见、记录并约束的海风入境。"
 jxp_mission_dejima_window_title:0 "出岛窗口"
 jxp_mission_dejima_window_desc:0 "有限开放保留知识与贸易，也保留警惕。出岛虽小，却足以让世界在案牍上留下痕迹。"
 jxp_mission_warrior_house_laws_title:0 "武家诸法度"
 jxp_mission_warrior_house_laws_desc:0 "诸藩必须服从共同法度。武士可以守家名，却不能把家名置于天下之上。"
 jxp_mission_genroku_prosperity_title:0 "元禄繁荣"
 jxp_mission_genroku_prosperity_desc:0 "稳定的秩序孕育都市、文化与财富。歌舞伎、浮世绘与商账同属太平之声。"
 jxp_mission_repulse_foreign_ships_title:0 "异国船打払"
 jxp_mission_repulse_foreign_ships_desc:0 "即便锁国，海防也不能松懈。遥远帆影有时是商机，有时是试探。"

 jxp_mission_open_nagasaki_title:0 "开放长崎"
 jxp_mission_open_nagasaki_desc:0 "港口是开国的第一扇门。长崎若能被国家掌握，外洋便不再只是威胁。"
 jxp_mission_nanban_factory_title:0 "南蛮商馆"
 jxp_mission_nanban_factory_desc:0 "商馆把海外财富引入可见之处。货物入仓，传闻入耳，风险也随之入册。"
 jxp_mission_red_seal_ships_title:0 "朱印船"
 jxp_mission_red_seal_ships_desc:0 "带有许可的船队将日本商人送向外洋。印信虽小，却能把私冒之旅变为国家事业。"
 jxp_mission_translation_bureau_title:0 "译书局"
 jxp_mission_translation_bureau_desc:0 "知识必须被翻译，也必须被审定。译官的笔有时比水手的桨更能拓展世界。"
 jxp_mission_oceanic_shipyards_title:0 "远洋船厂"
 jxp_mission_oceanic_shipyards_desc:0 "面向海洋的国家需要能远航的船。木材、铁钉、帆布与星象共同决定航路。"
 jxp_mission_manila_route_title:0 "马尼拉航路"
 jxp_mission_manila_route_desc:0 "马尼拉、澳门与长崎之间的航路带来银与消息。日本若能接入其间，便能听见太平洋的回声。"
 jxp_mission_equal_treaties_title:0 "平等条约"
 jxp_mission_equal_treaties_desc:0 "开国日本要以主动姿态面对列强。条约若只由他人书写，海门便不是门，而是锁。"

 jxp_mission_welcome_missionaries_title:0 "迎接传教士"
 jxp_mission_welcome_missionaries_desc:0 "信仰与贸易常常乘同一艘船抵达。我们可以拒绝，也可以尝试让其服务国家。"
 jxp_mission_baptized_daimyo_title:0 "受洗大名"
 jxp_mission_baptized_daimyo_desc:0 "地方领主的洗礼会改变政治语言。新的神名进入家臣誓纸，也进入诸藩议论。"
 jxp_mission_nagasaki_church_port_title:0 "长崎教会港"
 jxp_mission_nagasaki_church_port_desc:0 "长崎将成为信仰与贸易的港口。钟声、银箱与帆影在此彼此辨认。"
 jxp_mission_kyushu_seminary_title:0 "九州神学校"
 jxp_mission_kyushu_seminary_desc:0 "神学校培养译者、文书与有学问的侍从。信仰若要长久，也须懂得治理。"
 jxp_mission_tensho_embassy_title:0 "天正遣欧"
 jxp_mission_tensho_embassy_desc:0 "让远方也知道日本的日轮。使节越海而行，带回的不只是礼物，还有世界如何看待我们。"
 jxp_mission_christian_sun_title:0 "基督之日轮"
 jxp_mission_christian_sun_desc:0 "信仰与国家终于合为新的旗帜。十字映入日轮，海风吹过长崎的钟楼。"
 jxp_mission_shimabara_reconciliation_title:0 "岛原和解"
 jxp_mission_shimabara_reconciliation_desc:0 "若不能处理旧伤，基督日本只会建在裂缝之上。真正的胜利是让村落愿意重新开门。"

 jxp_mission_zhu_xi_lectures_title:0 "朱子讲席"
 jxp_mission_zhu_xi_lectures_desc:0 "以礼制解释战国之后的统治。经书所言若能进入法度，刀剑便有了归鞘之处。"
 jxp_mission_domain_schools_title:0 "藩校制度"
 jxp_mission_domain_schools_desc:0 "地方武士必须学习同一种国家语言。诸藩各有家风，天下却需共通之理。"
 jxp_mission_kyoto_rites_title:0 "京都朝仪"
 jxp_mission_kyoto_rites_desc:0 "礼仪让政治秩序变得可见。衣冠、笏板与阶序告诉诸人何处为上，何处为下。"
 jxp_mission_merit_over_lineage_title:0 "功名胜于血统"
 jxp_mission_merit_over_lineage_desc:0 "新的官僚秩序需要能力，也需要名分。家门可贵，然而太平之世更重能吏。"
 jxp_mission_korean_envoys_title:0 "朝鲜通信使"
 jxp_mission_korean_envoys_desc:0 "东亚外交礼仪为日本提供镜子。使节的行列越过海峡，也把我们的体面展示给邻国。"
 jxp_mission_yamato_restoration_title:0 "大和复古"
 jxp_mission_yamato_restoration_desc:0 "朝廷重新站在政治中心。复古不是回到过去，而是借过去的名分重塑现在。"
 jxp_mission_ritual_state_title:0 "礼制国家"
 jxp_mission_ritual_state_desc:0 "当法度、裁可与礼制相互承认，日本便成为新的近世国家。天下有序，诸藩知位。"

 ability_jxp_japanese_polity_mechanic:0 "日轮国体"
 jxp_japanese_polity_mechanic:0 "日轮国体"
 jxp_japanese_polity_mechanic_desc:0 "日轮诸道的政体平衡。天下、禁里与海门彼此牵引，国家每一次选择都会在三者之间留下痕迹。"
 monthly_jxp_tenka_order:0 "天下秩序之流"
 jxp_tenka_order_gain_modifier:0 "天下秩序之势"
 monthly_jxp_imperial_sanction:0 "天皇裁可之流"
 jxp_imperial_sanction_gain_modifier:0 "天皇裁可之势"
 monthly_jxp_oceanic_opening:0 "海门外学之流"
 jxp_oceanic_opening_gain_modifier:0 "海门外学之势"
 jxp_japanese_polity_reform:0 "日轮国体"
 jxp_japanese_polity_reform_desc:0 "日本诸道并行于一国之内：天下须定，禁里须敬，海门须察。政体之妙，在于不令任何一道压倒其余。"
 jxp_reformed_japan_reform:0 "平户改革宗体制"
 jxp_reformed_japan_reform_desc:0 "以平户会议、港口教团与译书审定为基石，改革宗日本在信仰与国家之间立下谨慎章程。"
 jxp_kaikyo_japan_reform:0 "海峡港法体制"
 jxp_kaikyo_japan_reform_desc:0 "马来商馆、清真港法与朝觐船队使日本与南海诸港相连。港法维持秩序，航路带来声望。"

 jxp_gov_conduct_land_survey:0 "奉行检地"
 jxp_gov_conduct_land_survey_desc:0 "丈量田畴，重订村账，使年贡、劳役与土地权属重新归入奉行所文书。"
 jxp_gov_issue_sword_hunt:0 "刀狩令"
 jxp_gov_issue_sword_hunt_desc:0 "收缴村社兵器，申明武士与百姓之分。太平之世不能容许战国的旧刀随意出鞘。"
 jxp_gov_relax_domains:0 "放宽诸藩"
 jxp_gov_relax_domains_desc:0 "暂缓中央催逼，容诸藩自行安抚家臣与百姓。急政如急弦，久之必断。"
 jxp_gov_restore_imperial_palace:0 "修缮禁里"
 jxp_gov_restore_imperial_palace_desc:0 "修葺御所，重整朝仪，使京都之名分重新照入天下政务。"
 jxp_gov_request_imperial_edict:0 "请下宣旨"
 jxp_gov_request_imperial_edict_desc:0 "遣使请旨，以朝廷之名申明大义。凡奉宣旨而行者，皆须顾及天下耳目。"
 jxp_gov_kobu_gattai_rite:0 "公武合体仪"
 jxp_gov_kobu_gattai_rite_desc:0 "以礼仪调和公武，使禁里的言辞与武家的政务不再彼此抵牾。"
 jxp_gov_open_foreign_factory:0 "开设商馆"
 jxp_gov_open_foreign_factory_desc:0 "准异国商人居于指定港町，由奉行、译官与町年寄共同监管。"
 jxp_gov_expel_padres:0 "驱逐伴天连"
 jxp_gov_expel_padres_desc:0 "命传教士离境，收紧村落中的异国信仰活动，使旧寺社与乡村秩序暂得安宁。"
 jxp_gov_dejima_window:0 "出岛窗口"
 jxp_gov_dejima_window_desc:0 "以狭小窗口承接外洋货物与书籍。出入皆有记录，往来皆可查验。"
 jxp_gov_review_translations:0 "译书审定"
 jxp_gov_review_translations_desc:0 "召集译官校勘兰书，择其医学、天文与炮术之可用者，封存其扰乱人心之处。"

 jxp_route_reformed:0 "改革宗日轮"
 jxp_route_reformed_desc:0 "平户会议、港口教团与荷兰译书共同塑造新的日轮国家。信仰被写入章程，海门被置于法度。"
 jxp_route_kaikyo:0 "海峡日轮"
 jxp_route_kaikyo_desc:0 "日本通过马来、琉球与九州港口接入伊斯兰海上贸易网络。南海之风从此吹入和国。"
 jxp_hirado_synod:0 "平户会议"
 jxp_hirado_synod_desc:0 "港口商人、译者与改革宗传道人在平户确立谨慎的共存章程。每一条条款都在避免重演旧日禁教。"
 jxp_oranda_scriptures:0 "荷兰圣书"
 jxp_oranda_scriptures_desc:0 "译书局将改革宗文本、医学与航海知识编入可控的官学秩序。信仰之书也要经过朱笔。"
 jxp_reformed_court_covenant:0 "朝廷盟约"
 jxp_reformed_court_covenant_desc:0 "改革宗日本以朝廷名义约束港口教团，使信仰与国家不再彼此冲撞。"
 jxp_malay_factory:0 "马来商馆"
 jxp_malay_factory_desc:0 "马来、琉球与九州商人共同建立商馆，使日本听见南海诸港的市声。"
 jxp_halal_port_law:0 "清真港法"
 jxp_halal_port_law_desc:0 "港口法度承认穆斯林商人的饮食、礼拜与契约习惯，同时约束其政治影响。"
 jxp_hajj_fleet:0 "朝觐船队"
 jxp_hajj_fleet_desc:0 "来自日本的船队沿海峡通往更远的信仰世界。朝觐之路亦是航海之路。"
 jxp_hirado_congregation:0 "平户教团"
 jxp_hirado_congregation_desc:0 "受控教团服务译书、商贸与港口社群。祈祷与账册在同一座港町中并存。"
 jxp_muslim_port_quarter:0 "清真港町"
 jxp_muslim_port_quarter_desc:0 "商馆、清真厨房与契约公证人让港口贸易更加稳定，也让异乡人知道何处可安身。"

 jxp_decision_call_hirado_synod_title:0 "召集平户会议"
 jxp_decision_call_hirado_synod_desc:0 "请港口商人、译者与改革宗传道人在平户议定章程。信仰若要入港，便先要学会服从国家。"
 jxp_decision_invite_malay_factory_title:0 "邀请马来商馆"
 jxp_decision_invite_malay_factory_desc:0 "准许南海商人在受控港町设馆，以清晰契约、译官与港法连接马来诸港。"

 jxp_realm.1.h:0 "改革宗日本。"
 jxp_realm.1.i:0 "海峡日轮。"
 jxp_reformed.1.t:0 "平户会议"
 jxp_reformed.1.d:0 "平户港聚集了商人、译者与来自北海的改革宗传道人。他们不再像早期南蛮传教士那样急于扩张，而是提出由港口、译书与地方教团共同维系的章程。"
 jxp_reformed.1.a:0 "让会议成为受控窗口。"
 jxp_reformed.1.b:0 "听取他们，但不许越界。"
 jxp_reformed.2.t:0 "荷兰圣书"
 jxp_reformed.2.d:0 "新的译本从港口进入书库。它们既有神学，也有医学、炮术和航海术。若由官学审定，争论也许可以化为国用。"
 jxp_reformed.2.a:0 "以译书局审定。"
 jxp_reformed.3.t:0 "朝廷盟约"
 jxp_reformed.3.d:0 "改革宗教团要求清晰地位，朝廷则要求所有港口信仰服从国家名分。双方若能立约，日本便可避免重演禁教与叛乱的循环。"
 jxp_reformed.3.a:0 "以朝廷名义立约。"
 jxp_kaikyo.1.t:0 "马来商馆"
 jxp_kaikyo.1.d:0 "来自马六甲、亚齐、文莱与琉球的商人请求在九州港口设立商馆。他们带来香料、航海知识、清真契约与一条通向南海的道路。"
 jxp_kaikyo.1.a:0 "准许受控商馆。"
 jxp_kaikyo.1.b:0 "只许有限贸易。"
 jxp_kaikyo.2.t:0 "清真港法"
 jxp_kaikyo.2.d:0 "商馆扩大之后，饮食、礼拜、婚姻与契约纠纷都需要制度化处理。若港法明确，港口可以繁荣而不失控。"
 jxp_kaikyo.2.a:0 "颁行清真港法。"
 jxp_kaikyo.3.t:0 "朝觐船队"
 jxp_kaikyo.3.d:0 "日本船匠与南海舵手共同规划远航。朝觐船队不仅服务信仰，也会带回航海经验、港口声望与更辽阔的世界。"
 jxp_kaikyo.3.a:0 "让船队启航。"

 RFJ_ideas:0 "改革宗日本理念"
 RFJ_ideas_desc:0 "改革宗日本以港口会议、译本和协约调和外来信仰与本土名分。海门可以开启，但必须写入章程。"
 RFJ_ideas_start:0 "改革宗传统"
 RFJ_ideas_bonus:0 "改革宗雄心"
 rfj_hirado_synod:0 "平户会议"
 rfj_hirado_synod_desc:0 "改革宗日本以会议和章程管理港口信仰。争论可以激烈，边界必须清晰。"
 rfj_oranda_trade:0 "荷兰贸易"
 rfj_oranda_trade_desc:0 "荷兰商船与日本港町共同组织稳定的外贸网络。远方货物须先懂得本地规矩。"
 rfj_kana_scriptures:0 "假名圣书"
 rfj_kana_scriptures_desc:0 "译本以假名流通，使信仰、识字与知识输入彼此相连。新的经文进入町人的日常。"
 rfj_batavia_compacts:0 "巴达维亚协约"
 rfj_batavia_compacts_desc:0 "与东印度港口的协约让日本商人学会在更远的海图上议价。"
 rfj_port_congregations:0 "港口教团"
 rfj_port_congregations_desc:0 "教团既是信仰社群，也是水手、译者与商人的互助网络。"
 rfj_reformed_gunnery:0 "改革宗炮术"
 rfj_reformed_gunnery_desc:0 "北海炮术被日本工匠重新整理进军制。火炮的轰鸣来自远方，却要服从本国号令。"
 rfj_court_covenant:0 "朝廷盟约"
 rfj_court_covenant_desc:0 "教团承认朝廷名分，国家承认其受控地位。信仰以誓约换取立足之地。"

 SJP_ideas:0 "和之苏丹国理念"
 SJP_ideas_desc:0 "海峡商法、清真港町与南海航路为日本提供另一种开放形态。此国奉护禁里，也向更远的潮汐立约。"
 SJP_ideas_start:0 "海峡传统"
 SJP_ideas_bonus:0 "海峡雄心"
 sjp_malay_factory:0 "马来商馆"
 sjp_malay_factory_desc:0 "南海商馆让日本港口接入香料、银流与转口贸易。海峡世界从此不再遥远。"
 sjp_halal_port_law:0 "清真港法"
 sjp_halal_port_law_desc:0 "清晰的港法让穆斯林商人与本地官府各安其位。法度若能容人，港口便能聚财。"
 sjp_hajj_fleet:0 "朝觐船队"
 sjp_hajj_fleet_desc:0 "远航船队把信仰声望转化为航海经验。海上朝觐也是国家学习海洋的方式。"
 sjp_melaka_interpreters:0 "马六甲译官"
 sjp_melaka_interpreters_desc:0 "译官能让契约、贡使与商谈跨越语言边界。没有译者，海峡只是一片误会。"
 sjp_sakai_brokers:0 "堺港中介"
 sjp_sakai_brokers_desc:0 "堺商人善于把异国货物变成本土财政。算盘声有时比鼓声更能推动国家。"
 sjp_port_jurisprudence:0 "港町法学"
 sjp_port_jurisprudence_desc:0 "港口法学将贸易习惯、伊斯兰契约与日本行政折中为可执行规则。"
 sjp_oceanic_jihad:0 "海门奋进"
 sjp_oceanic_jihad_desc:0 "信仰热忱与海上利益共同推动船队远航。对海峡日轮而言，海门即是道路。"

 jxp_mission_hirado_synod_title:0 "平户会议"
 jxp_mission_hirado_synod_desc:0 "改革宗路线必须先把港口信仰纳入国家章程。未经立约的热情，终将变成纷争。"
 jxp_mission_oranda_scriptures_title:0 "荷兰圣书"
 jxp_mission_oranda_scriptures_desc:0 "译本、医学与航海术都需要审定之后才能服务国家。"
 jxp_mission_court_covenant_title:0 "朝廷盟约"
 jxp_mission_court_covenant_desc:0 "改革宗日本不能脱离朝廷名分。港口可以面海，国家仍要面向京都。"
 jxp_mission_oranda_ports_title:0 "荷兰诸港"
 jxp_mission_oranda_ports_desc:0 "港口、船队与译者共同支撑改革宗日轮。北海之风被纳入日本海图。"
 jxp_mission_reformed_sun_title:0 "改革宗日轮"
 jxp_mission_reformed_sun_desc:0 "当信仰、秩序与外学达成平衡，日本将走上新的日轮之道。"
 jxp_mission_malay_factory_title:0 "马来商馆"
 jxp_mission_malay_factory_desc:0 "南海商馆是海峡路线的第一根桩。桩入港泥，船路才有归处。"
 jxp_mission_halal_port_law_title:0 "清真港法"
 jxp_mission_halal_port_law_desc:0 "港口法度必须能容纳来自海峡的商人与信徒。只有可预期的规矩，才能留住远方的人。"
 jxp_mission_hajj_fleet_title:0 "朝觐船队"
 jxp_mission_hajj_fleet_desc:0 "远航船队让日本进入更广阔的信仰与贸易世界。"
 jxp_mission_melaka_interpreters_title:0 "马六甲译官"
 jxp_mission_melaka_interpreters_desc:0 "海峡世界的语言和契约需要专门人才。译官一笔，可免两国误会。"
 jxp_mission_sultanate_of_wa_title:0 "和之苏丹国"
 jxp_mission_sultanate_of_wa_desc:0 "当海门、信仰与天下秩序合流，新的和国将以苏丹之名面向南海。"

 jxp_daimyo_domain_accounts:0 "本领账册"
 jxp_daimyo_domain_accounts_desc:0 "村账、名寄与贡纳文书被重新誊定。纸上墨迹虽淡，却足以让一国知其田畴、人丁与旧例。"
 jxp_daimyo_castle_town:0 "城下町普请"
 jxp_daimyo_castle_town_desc:0 "武家宅第、町屋、寺社与市庭沿城郭铺展开来。兵粮入仓，匠人有籍，城下渐成一国之腹心。"
 jxp_daimyo_courtly_petition:0 "禁里奉书"
 jxp_daimyo_courtly_petition_desc:0 "献礼与书状送入京都。乱世诸侯各执兵刃，仍需从朝廷旧仪中寻得可以示人的名分。"
 jxp_daimyo_gun_foundries:0 "铁炮锻冶"
 jxp_daimyo_gun_foundries_desc:0 "铁匠拆看南蛮铳机，量管、试火、磨簧。雷声始于异国，终要在本国阵中听命。"
 jxp_daimyo_namban_letters:0 "南蛮往来书"
 jxp_daimyo_namban_letters_desc:0 "商人、译者与港町年寄把外来货物写成可查的账目。海风若要入国，须先化为文书。"
 jxp_daimyo_league_of_kin:0 "一门众盟约"
 jxp_daimyo_league_of_kin_desc:0 "亲族、谱代与国人众在神前重申起请。所谓家中，不只是血脉，也是临阵时愿意并肩的一纸誓文。"

 jxp_decision_daimyo_domain_survey_title:0 "重修本领账册"
 jxp_decision_daimyo_domain_survey_desc:0 "命代官巡行村里，重看田畠与年贡旧约。若账册明白，武家与百姓都能知道乱世中的尺度。"
 jxp_decision_daimyo_send_court_gifts_title:0 "遣使奉礼禁里"
 jxp_decision_daimyo_send_court_gifts_desc:0 "遣使携礼上洛，求得一纸可悬于堂上的奉书。兵威能夺土地，名分却仍要向京都叩门。"
 jxp_decision_daimyo_license_port_trade_title:0 "许港町通商"
 jxp_decision_daimyo_license_port_trade_desc:0 "令港町年寄与商人订立往来规约。海上之利不必尽拒，但每一艘来船都应被记入账中。"

 jxp_daimyo.1.t:0 "本领账册"
 jxp_daimyo.1.d:0 "代官从村到村核看名寄，旧豪族的朱印、寺社的免田与百姓的口分都被摆到案上。有人低声怨怼，有人松了一口气；但从此以后，家中终于能以同一本账册谈论本领。"
 jxp_daimyo.1.a:0 "一纸账册，胜过十句空言。"
 jxp_daimyo.2.t:0 "上洛之前的书状"
 jxp_daimyo.2.d:0 "京都仍在乱世烟尘之中，却仍是诸国礼法所归。使者呈上礼单与诉状，言辞谦卑，意在告诉天下：本家之兵不是无名之兵。"
 jxp_daimyo.2.a:0 "让书状进入禁里。"
 jxp_daimyo.3.t:0 "种子岛之闻"
 jxp_daimyo.3.d:0 "港口传来异国铁炮的消息：一扣机括，雷鸣破空。有人称其为奇技淫巧，有人却看见足轻阵列将因此改换形貌。"
 jxp_daimyo.3.a:0 "召集锻冶，细看其机。"
 jxp_daimyo.3.b:0 "先把消息收进武库。"
 jxp_daimyo.4.t:0 "堺与博多的商书"
 jxp_daimyo.4.d:0 "堺与博多的商人递来往来书，纸上写着银、绢、硝石、玻璃与异国文字。港町的算盘声很轻，却能越过战场传得很远。"
 jxp_daimyo.4.a:0 "让港町在规约之内开眼。"
 jxp_daimyo.4.b:0 "海风不可越过城门。"

 jxp_mission_daimyo_domain_accounts_title:0 "整饬本领"
 jxp_mission_daimyo_domain_accounts_desc:0 "大名若不能清楚知道自己掌中之地，所谓雄心只会停留在军议席上的豪言。先把田畠、贡纳与人丁写入可用之册。"
 jxp_mission_daimyo_castle_town_title:0 "修筑城下"
 jxp_mission_daimyo_castle_town_desc:0 "城下町是国人、商人、匠人和兵粮交会之处。使本城不只是一座堡垒，而是一国政务与市场的中心。"
 jxp_mission_daimyo_clan_league_title:0 "束合一门"
 jxp_mission_daimyo_clan_league_desc:0 "乱世中最危险的敌人往往坐在同一间军议所里。以起请文、婚姻与军役重新束合一门众。"
 jxp_mission_daimyo_petition_kyoto_title:0 "奉书上洛"
 jxp_mission_daimyo_petition_kyoto_desc:0 "《平家物语》有言，盛者必衰。越是乱世，越需把一门之名写入京都仍能承认的礼法。"
 jxp_mission_daimyo_sakai_hakata_merchants_title:0 "港町商书"
 jxp_mission_daimyo_sakai_hakata_merchants_desc:0 "堺、博多与濑户内诸港把战国诸侯同更远的海相连。掌握港町账册，才能让海利为本家所用。"
 jxp_mission_daimyo_tanegashima_rumors_title:0 "铁炮传闻"
 jxp_mission_daimyo_tanegashima_rumors_desc:0 "风从南海来，带来雷声一样的铁器。若能让工匠读懂它，足轻队列也许会改写合战之法。"
 jxp_mission_daimyo_foreign_letters_title:0 "译读异国书"
 jxp_mission_daimyo_foreign_letters_desc:0 "异国书信里有贸易，也有炮术、医方与天文。不是每一页都该流传，但每一页都值得被懂行之人读过。"
 jxp_mission_daimyo_path_to_kyoto_title:0 "问鼎京都"
 jxp_mission_daimyo_path_to_kyoto_desc:0 "本领已整，港市已开，一门亦有盟约。若大名真要走向天下，就必须把军旗指向京都的旧日中心。"

 jxp_no_active_long_investment_tt:0 "没有正在推行的长期国策"
 jxp_long_investment_tenka_tt:0 "此事将分年推行，使国法、账册与军役逐渐合为可用之制。"
 jxp_long_investment_court_tt:0 "此事将分年推行，使禁里旧仪与武家政务渐能彼此相照。"
 jxp_long_investment_oceanic_tt:0 "此事将分年推行，使译官、港町与书库慢慢连成外学之路。"

 jxp_gov_invest_domain_registers:0 "营造国法账局"
 jxp_gov_invest_domain_registers_desc:0 "设局汇整村账、检地簿、军役名册与诸藩旧例。国法若要行于天下，须先落在一册一牍之间。"
 jxp_gov_patronize_kinri_letters:0 "供奉禁里文事"
 jxp_gov_patronize_kinri_letters_desc:0 "以礼物、诗文、修缮与奉书维系京都旧仪。朝廷之名分不是一日可得，须在岁月往复中渐渐加厚。"
 jxp_gov_found_translation_house:0 "营建译书所"
 jxp_gov_found_translation_house_desc:0 "择港町通词、医师、炮术匠与书吏入局。异国文字若能被训读，海风便不只是传闻。"

 jxp_invest_domain_registers:0 "国法账局营造"
 jxp_invest_domain_registers_desc:0 "官吏、代官与书手被调入账局，政务一时变得迟重。纸墨堆成山，秩序也在其中缓慢成形。"
 jxp_invest_court_patronage:0 "禁里文事供奉"
 jxp_invest_court_patronage_desc:0 "使者、歌人、工匠与礼官往返京都。此举耗费不轻，却能让武家政务披上更古老的衣冠。"
 jxp_invest_translation_house:0 "译书所营建"
 jxp_invest_translation_house_desc:0 "港町事务被抽调给译书所，商人与寺社都在观望。异国书页被一行行拆开，新的知识也随之入座。"

 jxp_investment.10.t:0 "国法账局成书"
 jxp_investment.10.d:0 "数年之间，村账、军役、贡纳与旧例被反复誊校。官吏们终于能在同一张案上谈论国中之事；山川仍旧，纸上的天下却已清楚许多。"
 jxp_investment.10.a:0 "令诸奉行以此为准。"
 jxp_investment.11.t:0 "禁里文事有成"
 jxp_investment.11.d:0 "京都回信渐多，礼官的辞令也不再疏远。禁里的灯火照不亮每一处战场，却足以让武家知道，刀剑之外仍有可凭之名。"
 jxp_investment.11.a:0 "礼法自今日更重。"
 jxp_investment.12.t:0 "译书所开卷"
 jxp_investment.12.d:0 "译官在灯下校读异国文字，医方、炮术、天文与航海之说被谨慎分类。海上风声仍杂，书库中却已有了可以传给后人的句读。"
 jxp_investment.12.a:0 "收其所长，慎其所惑。"

 jxp_confucian_reform_center:0 "朱子礼教中心"
 jxp_confucian_reform_center_desc:0 "讲官、社家与藩校师儒在此共同编定礼仪、祭祀与乡约。神祇仍居其位，诸民则渐学以儒礼解释国中秩序。"
 jxp_confucian_newly_ordered:0 "新定礼教"
 jxp_confucian_newly_ordered_desc:0 "此地刚被纳入朱子礼教秩序。旧社祭并未废绝，只是被重新写入名分、学校与乡约之中。"
 jxp_ise_jingu_protected:0 "伊势神宫保留地"
 jxp_ise_jingu_protected_desc:0 "伊势神宫奉祀天照大神，是皇统与神国记忆的根本圣所。即使国家奉行儒教，此地亦不得改宗。"
 jxp_confucian_shinto_synthesis:0 "神儒合一"
 jxp_confucian_shinto_synthesis_desc:0 "朝廷祭祀、社家旧仪与朱子名分被并置于同一秩序之内。国教为儒，诸神仍有所安。"
 jxp_songming_kami_rites:0 "神祇礼制"
 jxp_songming_kami_rites_desc:0 "神祇官、儒者与奉行共同修定祭祀次第，使神社不再是礼制之外的遗存，而是天下秩序中的一环。"
 jxp_songming_academy_bureaucracy:0 "藩校官学"
 jxp_songming_academy_bureaucracy_desc:0 "讲席与藩校被纳入官学体系，武士子弟以经义、算学、法令与文书受训。"
 jxp_confucian_ordered_cities:0 "城下礼法"
 jxp_confucian_ordered_cities_desc:0 "町人、寺社、座商与武家屋敷被编入更明确的城下规约。市声仍盛，但已有章可循。"
 jxp_confucian_controlled_nanban:0 "礼部条规下的南蛮贸易"
 jxp_confucian_controlled_nanban_desc:0 "南蛮船得以入港，但通词、奉行与讲官共同审阅其货、书与教义。海门开启，却不许外学自成其政。"

 jxp_confucian.2.t:0 "神儒合一"
 jxp_confucian.2.d:0 "新朝奉朱子之学为国教，然日本自有神祇、社家与皇统旧仪。儒者进言：礼者，敬而已矣；若能使社祭、乡约、学校与官令各安其位，则诸神不必与经义相争。伊势神宫仍为日轮之本，其外诸国则可由讲院与奉行逐渐纳入礼教。"
 jxp_confucian.2.a:0 "以礼定神，以学导民。"
 jxp_confucian.4.t:0 "诸国礼教已定"
 jxp_confucian.4.d:0 "讲院文书、乡约誊本与神社祭式陆续传至各国。许多地方仍在旧日鸟居下祈愿，但祭祀旁多了讲席，村账旁多了礼书。伊势神宫独守其神道旧位，成为新秩序中刻意留下的古根。"
 jxp_confucian.4.a:0 "新礼不废古根。"
 jxp_confucian.5.t:0 "宋明理学与神国之礼"
 jxp_confucian.5.d:0 "宋明理学既入国中，诸儒争论神祇之位。有人主张以《礼》参定祭式，使天照与诸社皆入名分；也有人主张先立学校，以讲席、藩校与官学重塑武士之心。风动松声，殿上却是一场关于国本的静争。"
 jxp_confucian.5.a:0 "先正神祇之礼。"
 jxp_confucian.5.b:0 "先广学校之教。"
 jxp_confucian.6.t:0 "城下町与町人礼法"
 jxp_confucian.6.d:0 "城下町日益繁盛，町人、工匠、寺社与武士屋敷挤在同一条街上。旧例多出自口传，新市却要文书。奉行提议以乡约与町触整肃市井，使繁华不至于越出名分。"
 jxp_confucian.6.a:0 "以礼法整城下。"
 jxp_confucian.6.b:0 "让町人带来海门之利。"
 jxp_confucian.7.t:0 "南蛮船与礼部咨文"
 jxp_confucian.7.d:0 "南蛮船入港，货中有银、玻璃、火器与圣像。通词请开放交易，社家忧其异端，讲官则请设条规：货可入账，书可翻检，教义不可越过奉行与学校。"
 jxp_confucian.7.a:0 "准其贸易，立其条规。"
 jxp_confucian.7.b:0 "礼法不可让位于海利。"
