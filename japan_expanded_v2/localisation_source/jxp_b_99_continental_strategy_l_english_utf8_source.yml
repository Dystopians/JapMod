l_english:
 jxp_b_99_convene_ryukyu_strategy_title:0 "议定琉球经略"
 jxp_b_99_convene_ryukyu_strategy_desc:0 "琉球王国扼守南岛航路，却又周旋于日本与中华贡贸之间。我们可以遣使修好、为王国提供保护、租用港埠，或在具备足够兵船与国力后诉诸武力；吞并并非唯一、也未必是最有利的选择。"
 jxp_b_99_convene_korea_strategy_title:0 "议定海东交邻"
 jxp_b_99_convene_korea_strategy_desc:0 "朝鲜与日本之间已有通信使、倭馆和对马通事维系往来。大名只能从交聘与贸易着手；幕府与统一政权若欲越海用兵，则必须先负担舰船、兵粮、军役与天下秩序的代价。"
 jxp_b_99_convene_northern_strategy_title:0 "议定北海经略"
 jxp_b_99_convene_northern_strategy_desc:0 "虾夷、库页岛与满洲诸部之间的毛皮、海产和边闻依靠阿伊努与北方诸族传递。互市、边疆保护、寒港租约和直接进军各有所得，也各有必须承担的风险。"
 jxp_b_99_convene_taiwan_fujian_strategy_title:0 "议定台湾与闽海经略"
 jxp_b_99_convene_taiwan_fujian_strategy_desc:0 "台湾泊地、福建海商、倭寇与官府水师共同构成闽海秩序。我们可以以商约换取航路，以护航建立保护关系，以租界取得有限港权，或承担公开沿海战争的全部后果。"
 jxp_b_99_convene_china_strategy_title:0 "议定中华沿海经略"
 jxp_b_99_convene_china_strategy_desc:0 "对中华的经略不应只是一纸囊括万里的宣称。礼仪与贡贸、扶植沿海盟友、有限商埠和全面大陆战争是彼此不同的国策；后者只向拥有成熟国家机器、强大舰队和充足财赋的政权开放。"
 jxp_b_99_convene_southeast_asia_strategy_title:0 "议定吕宋与南洋经略"
 jxp_b_99_convene_southeast_asia_strategy_desc:0 "吕宋、交趾、海峡与香料群岛各有王法、商社和宗教网络。日本町、当地盟约、港口租约与军事征服必须被分别议定，欧洲来航也不能成为无视当地社会的借口。"
 jxp_b_99_settle_continental_conquests_title:0 "裁定海外新领治理"
 jxp_b_99_settle_continental_conquests_desc:0 "战争夺得港口与州县之后，军役、税粮、旧有王统和地方社会不会自行归顺。我们必须在军事奉行区、地方王朝保护、贡贸客户治理与直接国司统治之间作出选择，并承担相应的财政、自治与抵抗。"

 jxp_b_continental_strategy.1.t:0 "琉球海门的四策"
 jxp_b_continental_strategy.1.d:0 "评定众铺开由萨摩、博多和首里通事绘制的海图。有人主张恢复贡贸礼仪，有人希望以兵船保护王国，有人要求租用一座港埠，也有人声称只有直接控制群岛才能守住南海门户。"
 jxp_b_continental_strategy.2.t:0 "海东交邻的四策"
 jxp_b_continental_strategy.2.d:0 "通信使旧例、倭馆账册和海峡风信一并呈上。交聘可换得长久往来，保护之约可建立共同防务，港埠租约可保障商旅；若选择全面战争，则兵粮、运输和诸大名军役都必须由国家真实负担。"
 jxp_b_continental_strategy.3.t:0 "北海边闻的四策"
 jxp_b_continental_strategy.3.d:0 "阿伊努中介带来库页岛、黑龙江与满洲诸部的消息。互市最为稳妥，保护关系可以维系缓冲，寒港租约有助越冬；直接进军则意味着在严寒、长路与多族盟约之间维持一场昂贵战争。"
 jxp_b_continental_strategy.4.t:0 "台湾与闽海的四策"
 jxp_b_continental_strategy.4.d:0 "海商、通事与船奉行争论台湾泊地和福建海口的前途。平等商约、护航保护、有限港权与沿海战争皆可成策，但任何方案都不能把当地社会当作无人海岸。"
 jxp_b_continental_strategy.5.t:0 "中华沿海的四策"
 jxp_b_continental_strategy.5.d:0 "中华幅员广大，海疆又受礼制、商税、海禁与地方势力共同约束。使节建议从礼仪贸易开始；宿老讨论保护友好王朝；商人要求有限商埠；武将则提出一场代价高昂、毫无减免侵略责任的大陆战争。"
 jxp_b_continental_strategy.6.t:0 "吕宋与南洋的四策"
 jxp_b_continental_strategy.6.d:0 "日本町头人、季风商人、传教团与船奉行带来彼此矛盾的请求。与当地王国通商、缔结保护盟约、租用港区或直接出兵均可行，但航程、补给与地方抵抗会让强硬路线付出真实代价。"
 jxp_b_continental_strategy.mode_trade:0 "先遣使节与商舶（花费§Y75§!外交点、§Y100§!¤与§Y5§!威望）"
 jxp_b_continental_strategy.mode_protection:0 "提议保护与共同防务（花费§Y100§!外交点、§Y75§!军事点、§Y250§!¤与§Y10§!威望）"
 jxp_b_continental_strategy.mode_treaty_port:0 "请求一处限期港埠（花费§Y100§!行政点、§Y100§!外交点、§Y400§!¤及水手）"
 jxp_b_continental_strategy.mode_conquest:0 "筹备直接远征（花费§Y150§!行政点、§Y150§!军事点、§Y500§!¤、兵员与水手）"
 jxp_b_continental_strategy.no_target:0 "海图上的对象已经消失，暂且散会。"

 jxp_b_continental_strategy.101.t:0 "日轮之国的通商使节"
 jxp_b_continental_strategy.101.d:0 "[From.GetName]的使节携来礼物、货样与一份约束商旅的章程。他们承诺尊重我国法令，并希望互派通事、开放定期船期。准许此议可以带来贸易，也会让日本商人更深地进入本国港市。"
 jxp_b_continental_strategy.101.a:0 "依对等礼仪接纳来使。"
 jxp_b_continental_strategy.101.b:0 "婉拒章程，守住现有边界。"
 jxp_b_continental_strategy.102.t:0 "来自日本的保护提议"
 jxp_b_continental_strategy.102.d:0 "[From.GetName]提出以兵船与外交担保我国安全，并要求双方交换军情、互信和港口补给。此约不是立即臣属，却会让日本对本国安危承担公开责任，也使我们的外交逐渐受其影响。"
 jxp_b_continental_strategy.102.a:0 "接受保证，订立共同防务之约。"
 jxp_b_continental_strategy.102.b:0 "本国王统不需要外来保护。"
 jxp_b_continental_strategy.103.t:0 "限期港埠之议"
 jxp_b_continental_strategy.103.d:0 "[From.GetName]请求在一座沿海城市租用仓库、会所和泊位。港口仍由我国征税、审判并保有主权，租约期满亦应归还；然而外来商社聚集势必改变当地利益格局。"
 jxp_b_continental_strategy.103.a:0 "准其租用港区，主权仍归本国。"
 jxp_b_continental_strategy.103.b:0 "不让外来会所扎根海门。"
 jxp_b_continental_strategy.104.t:0 "日本远征的最后通告"
 jxp_b_continental_strategy.104.d:0 "[From.GetName]已经公开征发兵粮、船只和军役，并把矛头指向我国。其战争理由不会减轻夺土造成的恶名，也不会凭空赋予他们辽阔土地；我们仍须整顿城防与兵役，应对这场有限期限内的威胁。"
 jxp_b_continental_strategy.104.a:0 "整军守土，绝不屈服。"

 jxp_b_continental_strategy.20.t:0 "新领应由谁治理"
 jxp_b_continental_strategy.20.d:0 "新近取得的海外土地仍保有旧法、宗族、寺院、商路与王统。若设军事奉行区，驻军强而抵抗亦烈；若倚重地方王朝，则稳定却难以直接征税；若编为贡贸客户区，商利优先而兵役有限；若派国司直接统治，则行政投入与长期反抗最为沉重。"
 jxp_b_continental_strategy.20.a:0 "设军事奉行区，以驻军维持短期秩序。"
 jxp_b_continental_strategy.20.b:0 "安堵地方王统，以高度自治换取稳定。"
 jxp_b_continental_strategy.20.c:0 "编为贡贸客户区，让商税先于兵役。"
 jxp_b_continental_strategy.20.direct_governor:0 "派遣国司与代官，承担直接州县统治。"
 jxp_b_continental_strategy.20.e:0 "此议尚无定论，留待下一次评定。"

 cb_jxp_b_99_continental_campaign:0 "大陆经略远征"
 cb_jxp_b_99_continental_campaign_desc:0 "我国已为一个明确战区支付动员、兵粮与舰队成本，可在十年内对收到通告的对象发动远征。此战争不减免夺取土地的侵略扩张，和平条件也只承认所选战区内的省份。朝鲜与中华远征另由各自的完整战争剧本接续。"
 jxp_b_99_continental_campaign_wargoal:0 "夺取远征对象首府"
 jxp_b_99_continental_campaign_wargoal_desc:0 "控制敌方首府以迫使其议和。夺地仍需承担更高的战争分数与侵略扩张代价。"
 JXP_B_99_CONTINENTAL_CAMPAIGN_WAR_NAME:0 "$ORDER$$FIRST$对$SECOND_NAME$的大陆经略远征"
 JXP_B_99_CONTINENTAL_CAMPAIGN_COUNTRY_DESC:0 "远征仅在预先议定的对象与十年动员期内有效。"
 JXP_B_99_CONTINENTAL_CAMPAIGN_PROV_DESC:0 "只有六大战区内的土地可以被要求割让，且不享受侵略扩张减免。"

