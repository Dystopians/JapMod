 jxp_start_house_akm_chronicle:0 "论§Y赤松家§!今日之势，不可只数城郭与兵众：嘉吉之乱后守护权威破碎，播磨山城与浦上等被官各自坐大。旧牒之下，尚伏有浦上被官借再兴之功反噬旧主之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_akm_counsel:0 "衡其本末，§Y赤松再兴§!、§Y播磨山城网§!、§Y守护安堵§!乃本家三根柱石。可循此途转危为机：承认被官议席，以连署守护制重建播磨。终局所贵，在令§Y播磨山城奉行与旧家安堵法§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_akt_chronicle:0 "若翻§Y安东／秋田家§!旧牒，其兴衰皆系于一事：十三湊海商权与出羽内陆领主权并存，北海贸易依赖对虾夷诸群体的关系。而今最难裁断者，莫过于海岸商人、内陆家臣与强制贸易派争夺路线。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_akt_counsel:0 "执政之始，先令§Y十三湊§!、§Y北海互市§!、§Y海陆双权§!各得其序。以平等互市和港津议定取代单纯武力扩张。兵威用以开路，§Y北海互市奉行与冬季航路§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_ama_chronicle:0 "山川形胜之外，§Y尼子家§!另有一重难处：以月山富田城控制出云，夹在山阴国人、铁砂资源与大内毛利竞争之间。其根柢未稳，又遇国人盟众拒绝把矿利和军役交给本家，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_ama_counsel:0 "执政之柄，可从§Y月山富田城§!、§Y出云铁§!、§Y尼子再兴§!三端入手。失城后依靠山中众与铁山收入发动长期再兴。此策若成，便可将§Y山阴铁山奉行与再兴盟誓§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_asa_chronicle:0 "山川形胜之外，§Y朝仓家§!另有一重难处：一乘谷把越前经济与京都文化聚合，但家臣评议和北陆宗教势力限制当主。其根柢未稳，又遇文化城府、军务重臣与门徒村落争夺国政，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_asa_counsel:0 "执政之柄，可从§Y一乘谷§!、§Y越前町政§!、§Y宗滴军议§!三端入手。把家臣评议制度化为越前公议，而非依赖单一名将。此策若成，便可将§Y一乘谷町奉行与家臣评议席§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_ask_chronicle:0 "论§Y足利家§!今日之势，不可只数城郭与兵众：京都将军拥有名分却缺乏稳定直属军财，必须在管领、奉公众与守护之间恢复裁判力。旧牒之下，尚伏有管领对立足以再启京都大乱之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_ask_counsel:0 "衡其本末，§Y奉公众§!、§Y守护调停§!、§Y关东公方§!乃本家三根柱石。可循此途转危为机：把将军改造为公议首席或奉公众军政君主，而非必靠直辖吞并。终局所贵，在令§Y天下裁判所、守护连署与公方外交§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_cba_chronicle:0 "§Y千叶家§!之谱有云：下总旧武家受分家竞争和后北条扩张夹击，香取鹿岛的宗教网络仍提供地区名望。家门所倚，往往亦是家门所困；眼前最险的一结，正在本宗与分家争夺家督，外援会反过来吞噬自主权。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_cba_counsel:0 "今后用事，宜先察§Y下总名门§!、§Y香取鹿岛§!、§Y分家调停§!。以两社盟誓和关东均势外交维持独立。待内外有序，便把§Y关东社领调停与分家仲裁法§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_csk_chronicle:0 "山川形胜之外，§Y长宗我部家§!另有一重难处：土佐国人并立，一领具足提供快速动员却会在扩张后冲击中央行政。其根柢未稳，又遇农兵军役与奉行常备行政争夺资源和政治权，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_csk_counsel:0 "执政之柄，可从§Y一领具足§!、§Y土佐检地§!、§Y四国渡口§!三端入手。把国人军役改造成有土地登记和退役保障的地方兵制。此策若成，便可将§Y一领具足军役册与四国渡口奉行§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_dte_chronicle:0 "当此乱离，§Y伊达家§!的名分与实力并不总在一处：奥州婚姻网既能扩张也会引发稙宗—晴宗式家中分裂，北方城府尚待转向海岸开发。家中众议尤以婚姻同盟和家臣派系围绕继承与外戚爆发家中战争为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_dte_counsel:0 "可奉§Y奥州婚姻网§!、§Y天文之乱§!、§Y仙台开发§!为三项先务，再依时势行此策：以婚盟评议和新城府安置两派，保留外交网络。若能使§Y奥州婚盟院与仙台海路奉行§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_hjo_chronicle:0 "山川形胜之外，§Y后北条家§!另有一重难处：小田原新兴政权以评定、分国法、检地和支城网挑战关东旧名分。其根柢未稳，又遇支城城主与中央评定争夺税权，围城压力会放大矛盾，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_hjo_counsel:0 "执政之柄，可从§Y小田原评定§!、§Y支城网络§!、§Y段钱检地§!三端入手。以关东保护者身份保留旧家，换取军役与裁判承认。此策若成，便可将§Y小田原评定所、支城兵站和关东段钱册§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_hsk_chronicle:0 "若翻§Y细川家§!旧牒，其兴衰皆系于一事：管领名分仍重，但京兆家分裂、堺财政和三好被官崛起同时侵蚀控制。而今最难裁断者，莫过于两京兆与三好被官争夺将军和堺的控制。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_hsk_counsel:0 "执政之始，先令§Y管领政治§!、§Y堺财政§!、§Y京兆分裂§!各得其序。建立轮值管领与堺财务委员会，避免单派独占。兵威用以开路，§Y管领轮值与堺会计奉行§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_htk_chronicle:0 "山川形胜之外，§Y畠山家§!另有一重难处：河内与纪伊分支共用守护名分，若江政治和寺社网络使家督争夺长期化。其根柢未稳，又遇两分支的家督内战把寺社与国人卷入，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_htk_counsel:0 "执政之柄，可从§Y河纪分支§!、§Y若江政治§!、§Y寺社仲裁§!三端入手。以双府轮值和寺社仲裁承认分支权利。此策若成，便可将§Y分家轮值守护与寺社停战令§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_ike_chronicle:0 "论§Y池田家§!今日之势，不可只数城郭与兵众：被官出身的家族依赖军需运输和主君更替，在播磨城郭间寻找上升空间。旧牒之下，尚伏有旧主忠义与新政权安堵之间的选择撕裂家臣之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_ike_counsel:0 "衡其本末，§Y被官上升§!、§Y播磨运输§!、§Y转主存续§!乃本家三根柱石。可循此途转危为机：以军需契约和城郭管理证明不可替代性，而非反复背叛。终局所贵，在令§Y转封军需奉行与宿站运输网§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_img_chronicle:0 "当此乱离，§Y今川家§!的名分与实力并不总在一处：东海道守护大名正通过检地和分国法转为战国领国，并以武田北条婚盟稳定侧翼。家中众议尤以海道霸权、家臣军议和当主骤亡会使联盟网同时崩解为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_img_counsel:0 "可奉§Y假名目录§!、§Y寿桂尼朱印§!、§Y禅僧外交§!为三项先务，再依时势行此策：若遭桶狭间一类的挫败，可由氏真式文化法制国家或松平安堵网络重建。若能使§Y东海道法令院、禅僧使节团和人质安堵簿§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_isk_chronicle:0 "山川形胜之外，§Y一色家§!另有一重难处：丹后守护依赖港津和京都海路，在若狭、山阴与京畿势力之间维持名分。其根柢未稳，又遇守护被官要求封锁港税，海商则要求开放航路，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_isk_counsel:0 "执政之柄，可从§Y丹后守护§!、§Y京都海路§!、§Y港津安堵§!三端入手。建立受守护保护的港津自治议会。此策若成，便可将§Y京都海路奉行与丹后港津法§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_ito_chronicle:0 "若翻§Y伊东家§!旧牒，其兴衰皆系于一事：日向诸城和山地国人难以统一，岛津压力使失国与复归始终是现实可能。而今最难裁断者，莫过于诸城城主在岛津进攻时可能各自投降。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_ito_counsel:0 "执政之始，先令§Y日向诸城§!、§Y山地国人§!、§Y伊东再兴§!各得其序。失国后从港口流亡网络和山地盟誓发起复归。兵威用以开路，§Y日向城主盟约与流亡复归法§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_kkc_chronicle:0 "论§Y菊池家§!今日之势，不可只数城郭与兵众：肥后旧名门保有南朝记忆，却受阿苏与国人联盟分割实际权力。旧牒之下，尚伏有旧名分无法约束国人，宗教盟友也可能扶植旁支之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_kkc_counsel:0 "衡其本末，§Y南朝记忆§!、§Y肥后国人§!、§Y阿苏盟约§!乃本家三根柱石。可循此途转危为机：以守护裁判和阿苏祭祀盟约恢复区域仲裁权。终局所贵，在令§Y肥后国人裁判与南朝记忆礼制§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_kno_chronicle:0 "§Y河野家§!所守，不独是一国一郡，亦是一套尚待成形的约束：伊予国人和濑户内船手分散，村上水军既是盟友也是能独立议价的武装商团。其中最易使上下离心者，正是陆上国人拒绝为水军护航税承担军役。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_kno_counsel:0 "欲存家名，先整§Y伊予国人§!、§Y村上水军§!、§Y海峡保护§!三务。眼前并非只有一条胜路：以海峡保险和共同护航把两类势力绑定。所求不只是扩土，而是使§Y濑户内护航契约与伊予船役§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_ktb_chronicle:0 "山川形胜之外，§Y北畠家§!另有一重难处：伊势国司兼具公家与武家身份，南朝王统记忆和伊势贸易构成特殊合法性。其根柢未稳，又遇公家礼制派与武家扩张派争夺国司府，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_ktb_counsel:0 "执政之柄，可从§Y伊势国司§!、§Y南朝王统§!、§Y公武合体§!三端入手。形成公武双院，以官位裁判和剑术军役并行。此策若成，便可将§Y国司双院与伊势公武法§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_mae_chronicle:0 "论§Y前田家§!今日之势，不可只数城郭与兵众：家臣出身的家族要在一向旧地、寺社、文化赞助和强大主家之间取得可信地位。旧牒之下，尚伏有新封家臣与一向旧地村落互不信任之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_mae_counsel:0 "衡其本末，§Y加贺治理§!、§Y文化赞助§!、§Y两强存续§!乃本家三根柱石。可循此途转危为机：以寺社复产、文化庇护和旧地自治换取稳定。终局所贵，在令§Y加贺复产奉行与文化庇护院§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_mri_chronicle:0 "§Y毛利家§!所守，不独是一国一郡，亦是一套尚待成形的约束：安艺国人盟主在大内尼子夹缝中崛起，山城、银山和濑户内船手必须被整合而非单纯吞并。其中最易使上下离心者，正是三子与国人盟众在中央化后争夺分国权限。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_mri_counsel:0 "欲存家名，先整§Y国人起请§!、§Y三矢继承§!、§Y严岛奇谋§!三务。眼前并非只有一条胜路：维持分权盟誓或建立银山财政中央制，两路都可统一。所求不只是扩土，而是使§Y中国分国评定、银山会计与濑户内水军契约§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_oda_chronicle:0 "若翻§Y织田家§!旧牒，其兴衰皆系于一事：尾张分裂秩序中的守护代家要把国众、市场、方面军团、寺社和朝幕关系转成跨国领地政府。而今最难裁断者，莫过于军团自治、寺社政策和继承安排共同决定重臣乘隙弑逆的风险。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_oda_counsel:0 "执政之始，先令§Y清洲裁断§!、§Y乐市乐座§!、§Y方面军团§!各得其序。嫡系、重臣会议、丰臣接管或织田联邦化均可在不同代价下延续。兵威用以开路，§Y安土奉行政、军团分国政或奉戴公方体制三者各成一制§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_ogs_chronicle:0 "当此乱离，§Y小笠原家§!的名分与实力并不总在一处：信浓守护名分与弓马礼法仍有声望，但山地国人和诹访势力控制交通节点。家中众议尤以礼法名门的财政无法承担山地军役为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_ogs_counsel:0 "可奉§Y弓马礼法§!、§Y信浓守护§!、§Y山地宿路§!为三项先务，再依时势行此策：把武家礼法院转化为人质教育和宿路仲裁网络。若能使§Y弓马礼法院与信浓宿路奉行§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_otm_chronicle:0 "§Y大友家§!之谱有云：府内政权以九州守护名分、港商和海外火器扩张，却面临宗教选择与家臣反乱。家门所倚，往往亦是家门所困；眼前最险的一结，正在基督教保护、传统寺社和国人领主围绕土地与信仰冲突。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_otm_counsel:0 "今后用事，宜先察§Y府内政厅§!、§Y南蛮商馆§!、§Y国崩炮§!。可建设多宗教商馆国、基督教领邦或本土寺社海贸国。待内外有序，便把§Y府内海外奉行、火炮工坊和宗教裁定院§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_ouc_chronicle:0 "山川形胜之外，§Y大内家§!另有一重难处：山口西京、博多和勘合外交供养西国守护政权，但陶氏军权可能反客为主。其根柢未稳，又遇文化财政派与陶氏军事派在扩张失败后爆发夺权，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_ouc_counsel:0 "执政之柄，可从§Y山口西京§!、§Y博多财赋§!、§Y勘合外交§!三端入手。以商税供养文治公议，或把军权纳入轮值守护军府。此策若成，便可将§Y西京文化院、博多会计和勘合使节局§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_rfr_chronicle:0 "§Y南部家§!之谱有云：北奥诸分家分散于马产地和雪国道路，津轻分离与九户反抗威胁本宗。家门所倚，往往亦是家门所困；眼前最险的一结，正在分家与九户众拒绝中央军役，津轻可能乘隙脱离。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_rfr_counsel:0 "今后用事，宜先察§Y南部分家§!、§Y北奥马产§!、§Y九户危机§!。以马市、轮值军役和分家议席维持北奥联合。待内外有序，便把§Y北奥马政与分家轮值军役§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_sba_chronicle:0 "§Y斯波家§!所守，不独是一国一郡，亦是一套尚待成形的约束：武卫与管领旧职横跨尾张越前，但守护代和被官已经掌握地方财军。其中最易使上下离心者，正是守护代利用旧主授权建立独立领国。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_sba_counsel:0 "欲存家名，先整§Y武卫名分§!、§Y守护代§!、§Y两国档案§!三务。眼前并非只有一条胜路：把代理人改为有期限、可审计的国奉行。所求不只是扩土，而是使§Y守护代审计法与武卫档案院§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_shn_chronicle:0 "当此乱离，§Y少贰家§!的名分与实力并不总在一处：大宰府旧名分受到大内压力，博多、宗氏与朝鲜贸易决定九州外交空间。家中众议尤以依赖宗氏与博多商人会削弱本家对贸易收益的控制为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_shn_counsel:0 "可奉§Y大宰府§!、§Y反大内§!、§Y博多外交§!为三项先务，再依时势行此策：以大宰府仲裁和多港分税重建九州外交中心。若能使§Y大宰府外交局与博多分税契约§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_smz_chronicle:0 "§Y岛津家§!所守，不独是一国一郡，亦是一套尚待成形的约束：萨摩诸分家尚未统一，军役、伏击战、种子岛火器和琉球南海路线互相牵动。其中最易使上下离心者，正是分家安堵与中央军役冲突，过度动员会触发领民和家臣反弹。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_smz_counsel:0 "欲存家名，先整§Y分家统一§!、§Y钓野伏§!、§Y萨摩军役§!三务。眼前并非只有一条胜路：通过分家联邦或中央检地两种方式统一萨摩。所求不只是扩土，而是使§Y萨摩军役院、伏击军法与南海火器局§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_soo_chronicle:0 "论§Y宗氏家§!今日之势，不可只数城郭与兵众：对马资源有限，倭馆、朝鲜通信、通事和走私取缔决定家族生存。旧牒之下，尚伏有官方贸易额度与岛民私贸生计发生冲突之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_soo_counsel:0 "衡其本末，§Y倭馆§!、§Y通事制度§!、§Y朝鲜通信§!乃本家三根柱石。可循此途转危为机：可成为受约束的外交中介、自治海商共和国式家政或海防前哨。终局所贵，在令§Y对马通事院、倭馆条约局和海峡仲裁§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_stk_chronicle:0 "若翻§Y佐竹家§!旧牒，其兴衰皆系于一事：常陆国人尚待统一，后北条、伊达和北迁可能迫使家族重新选择领国中心。而今最难裁断者，莫过于关东旧臣与北迁新领家臣争夺安堵。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_stk_counsel:0 "执政之始，先令§Y常陆统一§!、§Y关东均势§!、§Y北迁重建§!各得其序。把北迁变为新田开发和双领档案整合，而非纯惩罚。兵威用以开路，§Y常陆—出羽双领安堵簿§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_tkd_chronicle:0 "当此乱离，§Y武田家§!的名分与实力并不总在一处：甲斐山国依靠分国法、堤防、金山和寄亲军役扩张，却受外交包围与继承不稳制约。家中众议尤以金山衰退、寄亲自主和继承争议会同时削弱军役为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_tkd_counsel:0 "可奉§Y甲州法度§!、§Y信玄堤§!、§Y金山会计§!为三项先务，再依时势行此策：由水利民政、寄亲联邦或中央旗本三路重建。若能使§Y甲州法度院、河川普请和寄亲军役簿§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_tkg_chronicle:0 "若翻§Y德川家§!旧牒，其兴衰皆系于一事：三河家族经历今川人质与独立，谱代武士、三河一向一揆和未来外样秩序决定国家形态。而今最难裁断者，莫过于门徒谱代与当主宗教政策冲突，胜利后外样安堵又造成新矛盾。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_tkg_counsel:0 "执政之始，先令§Y三河武士§!、§Y人质外交§!、§Y三河一向一揆§!各得其序。调和门徒谱代、建立旗本直辖或以外样公议稳定扩张。兵威用以开路，§Y江户幕府型谱代体系、旗本帐和外样安堵法§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_tki_chronicle:0 "§Y土岐家§!所守，不独是一国一郡，亦是一套尚待成形的约束：美浓守护兼具文化声望，却被斋藤被官控制地方财军。其中最易使上下离心者，正是恢复旧守护会触发被官军事反扑。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_tki_counsel:0 "欲存家名，先整§Y美浓守护§!、§Y绘画文化§!、§Y斋藤被官§!三务。眼前并非只有一条胜路：接受新兴武家官僚并保留文化仲裁权，形成双重政权。所求不只是扩土，而是使§Y美浓文化院与被官任期法§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_tti_chronicle:0 "论§Y筒井家§!今日之势，不可只数城郭与兵众：大和寺社领与国人交错，兴福寺关系及松永竞争使武家统一必须先调停宗教权利。旧牒之下，尚伏有寺社兵、国人和城主拒绝统一税役之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_tti_counsel:0 "衡其本末，§Y大和寺社§!、§Y奈良裁判§!、§Y松永竞争§!乃本家三根柱石。可循此途转危为机：建立奈良寺社—武家共同裁判所。终局所贵，在令§Y大和寺社仲裁院与社领登记§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_ues_chronicle:0 "山川形胜之外，§Y上杉家§!另有一重难处：越后守护代出身政权承接关东管领名分，家督继承、贸易和义战理念彼此拉扯。其根柢未稳，又遇家督继承和国人派系会把道义战争变为长期内乱，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_ues_counsel:0 "执政之柄，可从§Y关东管领§!、§Y越后府中§!、§Y毗沙门天§!三端入手。选择义战盟主、越后商政国或关东管领公议三种霸权。此策若成，便可将§Y管领裁判、越后商路与义战约束法§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_utn_chronicle:0 "论§Y宇都宫家§!今日之势，不可只数城郭与兵众：下野旧武家依靠日光与北关东外交，在那须、佐竹和后北条之间求生。旧牒之下，尚伏有社领保护与国人军费争夺有限收入之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_utn_counsel:0 "衡其本末，§Y下野武家§!、§Y日光社领§!、§Y北关东均势§!乃本家三根柱石。可循此途转危为机：以日光停战会盟成为北关东中立仲裁者。终局所贵，在令§Y日光会盟院与下野社领契约§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_ymn_chronicle:0 "§Y山名家§!所守，不独是一国一郡，亦是一套尚待成形的约束：应仁之乱后的多国守护政权失去统一中枢，山阴道路和分国代理人各行其是。其中最易使上下离心者，正是分国守护代拒绝为重建京都权势继续输送财军。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_ymn_counsel:0 "欲存家名，先整§Y六分一殿§!、§Y应仁遗产§!、§Y山阴分国§!三务。眼前并非只有一条胜路：建立山阴分国会议，以道路和轮值贡献替代旧式集权。所求不只是扩土，而是使§Y山阴分国会议与多国守护档案§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_rkk_chronicle:0 "§Y六角家§!所守，不独是一国一郡，亦是一套尚待成形的约束：南近江守护依靠观音寺评定、家臣连署、甲贺众与琵琶湖交通。其中最易使上下离心者，正是家臣连署既限制当主专断，也可能在败战后架空本家。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_rkk_counsel:0 "欲存家名，先整§Y六角氏式目§!、§Y观音寺评定§!、§Y甲贺众§!三务。眼前并非只有一条胜路：把连署转为有责任的领国评定，或建立甲贺情报政权。所求不只是扩土，而是使§Y近江连署评定与湖运法§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_kyo_chronicle:0 "山川形胜之外，§Y京极家§!另有一重难处：近江旧守护名分尚存，但浅井被官和湖东国人控制实权。其根柢未稳，又遇浅井被官要求自治，朝廷官位无法直接兑现军役，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_kyo_counsel:0 "执政之柄，可从§Y近江守护§!、§Y京极旧权§!、§Y湖东重建§!三端入手。以湖东安堵和朝廷仲裁建立守护共治。此策若成，便可将§Y湖东守护安堵院§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_wkt_chronicle:0 "§Y若狭武田家§!之谱有云：若狭守护连接京都文化与日本海路，受丹后和越前势力夹击。家门所倚，往往亦是家门所困；眼前最险的一结，正在文化赞助与海防开支争夺狭小领国财源。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_wkt_counsel:0 "今后用事，宜先察§Y若狭守护§!、§Y小滨海路§!、§Y京都文化§!。以小滨为京都的日本海门户，换取安全保证。待内外有序，便把§Y若狭海路馆与京都文化院§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_tgs_chronicle:0 "§Y富樫家§!所守，不独是一国一郡，亦是一套尚待成形的约束：加贺守护权正被国人和一向门徒自治侵蚀，仲裁失败会催生宗教共同体。其中最易使上下离心者，正是守护分裂与门徒惣村拒绝旧税役。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_tgs_counsel:0 "欲存家名，先整§Y加贺守护§!、§Y门徒自治§!、§Y国人仲裁§!三务。眼前并非只有一条胜路：承认宗教自治议席，形成守护—讲共同政权。所求不只是扩土，而是使§Y加贺宗门仲裁与惣村契约§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_nht_chronicle:0 "§Y能登畠山家§!之谱有云：七尾城与能登港支撑文化守护政权，家臣合议和继承争议削弱当主。家门所倚，往往亦是家门所困；眼前最险的一结，正在游佐等重臣借继承争议控制七尾评定。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_nht_counsel:0 "今后用事，宜先察§Y七尾城§!、§Y能登港§!、§Y家臣合议§!。把家臣合议公开化并以港税承担共同责任。待内外有序，便把§Y七尾合议所与能登港税簿§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_ank_chronicle:0 "若翻§Y姊小路家§!旧牒，其兴衰皆系于一事：飞驒山地诸家围绕矿山和交通竞争，外部强邻可封锁所有出路。而今最难裁断者，莫过于矿山领主与山道国人拒绝统一征收。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_ank_counsel:0 "执政之始，先令§Y飞驒统一§!、§Y山地矿山§!、§Y强邻平衡§!各得其序。以中立矿业联盟向武田、上杉或织田的继起的强邻开放。兵威用以开路，§Y飞驒矿山会计与山道中立令§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_hnm_chronicle:0 "当此乱离，§Y本间家§!的名分与实力并不总在一处：佐渡岛屿分家控制海运和矿权，本家必须在海商与矿业领国之间抉择。家中众议尤以矿山强制开发与船主自治争夺劳力为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_hnm_counsel:0 "可奉§Y佐渡海运§!、§Y岛屿分家§!、§Y金银开发§!为三项先务，再依时势行此策：选择合作矿业公会或海商联邦，两者各有不同输出。若能使§Y佐渡矿海双奉行§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_mog_chronicle:0 "当此乱离，§Y最上家§!的名分与实力并不总在一处：山形盆地与最上川商路尚未整合，婚姻外交和庄内争夺牵动伊达、大崎等邻国。家中众议尤以亲族婚盟可转成外戚派系和庄内叛乱为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_mog_counsel:0 "可奉§Y最上川§!、§Y婚姻调略§!、§Y庄内粮仓§!为三项先务，再依时势行此策：以河运议会和动态邻国婚盟建立出羽商业霸权。若能使§Y最上川运上所与出羽婚盟院§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_asn_chronicle:0 "§Y芦名家§!所守，不独是一国一郡，亦是一套尚待成形的约束：会津黑川连接北陆与关东，伊达竞争和国人关系决定盆地政权存续。其中最易使上下离心者，正是继承与外援可能把会津变成邻国代理战场。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_asn_counsel:0 "欲存家名，先整§Y会津黑川§!、§Y越关通路§!、§Y伊达竞争§!三务。眼前并非只有一条胜路：以会津中转关和中立盟约维持山间枢纽。所求不只是扩土，而是使§Y会津越关奉行与盆地防务议会§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_osk_chronicle:0 "山川形胜之外，§Y大崎家§!另有一重难处：奥州探题旧职仍有名分，实际依赖国人联盟并受伊达扩张压迫。其根柢未稳，又遇国人只愿借探题名义自保，不愿提供长期军役，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_osk_counsel:0 "执政之柄，可从§Y奥州探题§!、§Y国人联盟§!、§Y旧职复兴§!三端入手。把探题裁判转为跨国停战和轮值贡献制度。此策若成，便可将§Y奥州探题裁判院§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_sma_chronicle:0 "山川形胜之外，§Y相马家§!另有一重难处：沿海边疆和相马野马支撑骑兵传统，伊达压力迫使港口与内陆牧地协同。其根柢未稳，又遇牧地军役和港口复建争夺人口与土地，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_sma_counsel:0 "执政之柄，可从§Y相马野马§!、§Y沿海边疆§!、§Y北方骑兵§!三端入手。以季节轮牧和沿海堡港形成弹性防线。此策若成，便可将§Y相马马政与沿海堡港制§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_dho_chronicle:0 "山川形胜之外，§Y大宝寺家§!另有一重难处：庄内粮仓和港津夹在最上、安东及出羽寺社势力之间。其根柢未稳，又遇粮仓征收、寺社免税与港商输出相互冲突，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_dho_counsel:0 "执政之柄，可从§Y庄内粮仓§!、§Y酒田港津§!、§Y出羽寺社§!三端入手。建立庄内粮港联合账和当时最强的邻邦保护协定。此策若成，便可将§Y庄内粮港奉行§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_mkm_chronicle:0 "论§Y村上家§!今日之势，不可只数城郭与兵众：北信浓国人与山城抵抗武田，生存依赖上杉或其他当时最强的邻邦的援助。旧牒之下，尚伏有外援将领和本地国人争夺城防指挥之患。此患逢继承则争名，逢败阵则争责，逢饥馑则争粮；故善为国者，既须威服外敌，也须使奉行有簿、家臣有分、百姓知其所纳。"
 jxp_start_house_mkm_counsel:0 "衡其本末，§Y北信浓国人§!、§Y山城防御§!、§Y反武田同盟§!乃本家三根柱石。可循此途转危为机：建立山城共同防卫盟约，旧盟若亡，便转与同风俗的邻邦缔约。终局所贵，在令§Y北信浓山城盟约§!既能约束强臣，也能安顿在地旧族。倘舍本逐末，纵得京都一纸名位，也难使远国长久奉行。"
 jxp_start_house_sgr_chronicle:0 "若翻§Y相良家§!旧牒，其兴衰皆系于一事：人吉盆地以相良法度、球磨川与山地共同体维持长期统治。而今最难裁断者，莫过于河运商人与山地村落对劳役和司法有不同诉求。一纸安堵可暂息众议，却不能代替长久之法；一场大捷可振家名，却不能消解积年的利害。主君若能把军役、裁判和在地旧约编为成例，方可使家运不随一人而终。"
 jxp_start_house_sgr_counsel:0 "执政之始，先令§Y相良法度§!、§Y球磨川§!、§Y山地共同体§!各得其序。以流域裁判和村落代表把法度扩为共同治理。兵威用以开路，§Y球磨川流域法庭§!才是守成之器；二者相济，方能让盟誓经得起败阵、让法度经得起继承，也让本家的名声不只留在战场。"
 jxp_start_house_kmp_chronicle:0 "§Y肝付家§!所守，不独是一国一郡，亦是一套尚待成形的约束：大隅领主受岛津竞争与种子岛、南岛航路吸引，陆海资源必须取舍。其中最易使上下离心者，正是大隅城主要求陆防，船手要求投入南岛贸易。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_kmp_counsel:0 "欲存家名，先整§Y大隅国人§!、§Y种子岛航路§!、§Y抗岛津§!三务。眼前并非只有一条胜路：以岛链补给和海岸城网绕开岛津陆上优势。所求不只是扩土，而是使§Y大隅岛链兵站§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_ari_chronicle:0 "§Y有马家§!所守，不独是一国一郡，亦是一套尚待成形的约束：口之津与岛原连接南蛮贸易，小国必须在天主教、本土宗教和强邻之间保持自主。其中最易使上下离心者，正是领主改宗、寺社土地和港商利益可能激化宗教冲突。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_ari_counsel:0 "欲存家名，先整§Y口之津§!、§Y南蛮贸易§!、§Y岛原信仰§!三务。眼前并非只有一条胜路：可走受控改宗、多宗教自由港或本土海商保护国。所求不只是扩土，而是使§Y口之津宗教商法与自由港裁判§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_mtu_chronicle:0 "§Y松浦家§!之谱有云：平户与松浦党由海商、武装船团和南蛮港组成，官方贸易与倭寇活动界线模糊。家门所倚，往往亦是家门所困；眼前最险的一结，正在无牌劫掠可带来短利，却会摧毁港口条约。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_mtu_counsel:0 "今后用事，宜先察§Y平户港§!、§Y松浦党§!、§Y海商牌照§!。建立持照海商同盟、受约束私掠或官方南蛮港。待内外有序，便把§Y平户船牌院与海商公议§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_stm_chronicle:0 "§Y里见家§!所守，不独是一国一郡，亦是一套尚待成形的约束：安房政权以江户湾水军对抗后北条，并需整合房总半岛的海防与国人。其中最易使上下离心者，正是水军城主与内陆国人对进攻关东或固守湾口意见相左。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_stm_counsel:0 "欲存家名，先整§Y安房统一§!、§Y江户湾水军§!、§Y房总海防§!三务。眼前并非只有一条胜路：通过湾口堡垒和动态关东盟友建立海上均势。所求不只是扩土，而是使§Y江户湾海防院§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_hng_chronicle:0 "当此乱离，§Y本愿寺家§!的名分与实力并不总在一处：讲、寺内町、惣村和法主网络正在北陆扩张，一向一揆会把宗教共同体推向政治主权。家中众议尤以法主权威、武装门徒和惣村自治围绕武装动员与土地支配冲突为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_hng_counsel:0 "可奉§Y净土真宗§!、§Y讲组织§!、§Y寺内町§!为三项先务，再依时势行此策：可在法主国、惣村议会与世俗共同体之间择定国制。若能使§Y讲网络、寺内町法与受国法约束的宗门动员§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_azi_chronicle:0 "§Y浅井家§!之谱有云：北近江被官摆脱京极旧主，朝仓同盟、织田婚姻与琵琶湖利益构成三角选择。家门所倚，往往亦是家门所困；眼前最险的一结，正在旧主名分、姻亲与传统盟友在大战中要求相反忠诚。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_azi_counsel:0 "今后用事，宜先察§Y北近江§!、§Y被官独立§!、§Y朝仓盟约§!。可建立近江中立盟、守旧盟约或婚姻改革政权，旧盟若绝，仍可另结近国。待内外有序，便把§Y北近江盟誓院与湖运中立法§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_myo_chronicle:0 "当此乱离，§Y三好家§!的名分与实力并不总在一处：阿波被官通过堺财政和饭盛山进入畿内，既操控将军又受家臣合议与松永等重臣制约。家中众议尤以跨海军团和重臣在当主更替时瓜分畿内政权为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_myo_counsel:0 "可奉§Y堺财政§!、§Y饭盛山§!、§Y将军操控§!为三项先务，再依时势行此策：选择奉戴将军、堺商政或阿波—畿内双府联合。若能使§Y畿内家臣评定、堺财政院与双府军令§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_sto_chronicle:0 "§Y斋藤家§!之谱有云：美浓新兴政权挑战土岐旧主，三人众、两面外交与国盗传说塑造不稳定合法性。家门所倚，往往亦是家门所困；眼前最险的一结，正在三人众可能以拥立旧主或外敌为由倒戈。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_sto_counsel:0 "今后用事，宜先察§Y国盗§!、§Y美浓三人众§!、§Y两面外交§!。把国盗合法化为能力官僚制，或与土岐文化权威共治。待内外有序，便把§Y美浓三人众评定与新功安堵法§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_rzj_chronicle:0 "§Y龙造寺家§!之谱有云：肥前国人联盟迅速扩张，今山胜利和五州二岛野心会把锅岛辅政推向权力中心。家门所倚，往往亦是家门所困；眼前最险的一结，正在过度扩张、当主威望下降与锅岛辅政可能触发政权接管。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_rzj_counsel:0 "今后用事，宜先察§Y肥前国人§!、§Y今山§!、§Y五州二岛§!。限制扩张并制度化辅政，或以国人联邦延续龙造寺名号。待内外有序，便把§Y肥前辅政院与国人军议§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_ukt_chronicle:0 "§Y宇喜多家§!所守，不独是一国一郡，亦是一套尚待成形的约束：浦上被官凭谋略与备前港崛起，直家式家中和秀家式新政存在明显代际断层。其中最易使上下离心者，正是谋略家臣不适应公开法制和新式财政，可能在代际转换时反乱。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_ukt_counsel:0 "欲存家名，先整§Y浦上旧主§!、§Y直家谋略§!、§Y备前港§!三务。眼前并非只有一条胜路：将秘密盟约转为公开契约，或保留情报家政但接受声誉代价。所求不只是扩土，而是使§Y备前情报局与港政新法§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_tgr_chronicle:0 "山川形胜之外，§Y津轻家§!另有一重难处：津轻平野从南部体系中脱离，弘前城府、十三湊和雪国道路需要建立新合法性。其根柢未稳，又遇旧南部家臣与新独立派争夺土地，冬季交通会放大短缺，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_tgr_counsel:0 "执政之柄，可从§Y脱离南部§!、§Y弘前平野§!、§Y十三湊§!三端入手。以北海贸易和新田开发取得独立承认，或与南部议和成为自治分家。此策若成，便可将§Y津轻雪道奉行与独立安堵簿§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_hcs_chronicle:0 "§Y蜂须贺家§!之谱有云：川并众和工程军役使被官团体有机会从流动武装转为阿波大名。家门所倚，往往亦是家门所困；眼前最险的一结，正在佣兵式流动收益与定居治理责任冲突。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_hcs_counsel:0 "今后用事，宜先察§Y川并众§!、§Y军役工程§!、§Y被官升格§!。把工程队转成河川普请和城郭奉行，换取领民承认。待内外有序，便把§Y川并工程奉行与转封安置法§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_mts_chronicle:0 "§Y松前家§!所守，不独是一国一郡，亦是一套尚待成形的约束：渡岛馆与和人商场依赖阿伊努互市，贸易垄断、和人扩张和边疆暴力会决定北海政权性质。其中最易使上下离心者，正是商场垄断和土地扩张激化阿伊努反抗与和人商人争执。倘以私恩代替公议，以临时征发代替军役定额，盛时或可无事，衰时必然俱发。主君须把家法写进账册、道路与城制，令远国之命也能落到乡里。"
 jxp_start_house_mts_counsel:0 "欲存家名，先整§Y渡岛馆§!、§Y阿伊努互市§!、§Y商场知行§!三务。眼前并非只有一条胜路：选择平等互市联盟、受监管商场制或军事边疆，三途各有久远之报。所求不只是扩土，而是使§Y北海互市院、商场监管和边疆条约§!成为上下共守的旧例。如此纵有败阵，家政仍有凭据；纵遇强邻，也不至临事失序。"
 jxp_start_house_krd_chronicle:0 "山川形胜之外，§Y黑田家§!另有一重难处：谋臣家族靠攻城、兵粮和九州仕置从被官转为跨区领主，转封会考验旧新家臣整合。其根柢未稳，又遇谋臣网络、旧领家臣和新领国人争夺军政职位，外敌每可乘隙而入，近臣亦可能借名分相争。此时用兵固不可迟，用法更不可乱；应先辨谁守城、谁输粮、谁得议政，再以赏罚维系家中，使一次胜负不至于改易全部秩序。"
 jxp_start_house_krd_counsel:0 "执政之柄，可从§Y官兵卫谋略§!、§Y攻城兵粮§!、§Y中津筑前§!三端入手。以兵粮审计和旧臣录用建立专业仕置政权。此策若成，便可将§Y九州仕置院与攻城兵粮奉行§!写入日后的国法；若只恃一时兵威，则继承一变，今日受命之人仍可能各拥其城。"
 jxp_start_house_ymc_chronicle:0 "当此乱离，§Y山内家§!的名分与实力并不总在一处：被官升格后转封土佐，旧长宗我部家臣与新来的上士集团形成身份壁垒。家中众议尤以新上士垄断职位，引发旧乡士抵抗为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_ymc_counsel:0 "可奉§Y土佐转封§!、§Y上士乡士§!、§Y旧臣整合§!为三项先务，再依时势行此策：设立双籍军役和晋升通道，或强化上士但承担长期不稳。若能使§Y土佐双籍法与转封调解院§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_nbs_chronicle:0 "当此乱离，§Y锅岛家§!的名分与实力并不总在一处：辅政家族接收龙造寺旧臣和佐贺平野，在有明海水利、陶瓷和合法性之间建国。家中众议尤以旧主忠臣质疑接管，水利工程和新产业又需要集中资源为忧，若处置失宜，旧臣、新附与在地势力都会各执一辞。故今日之策，不应只问如何取胜，也须问胜后由谁裁判、由谁征收、由谁守土；能答此三问，方有资格把一时霸业化为长治。"
 jxp_start_house_nbs_counsel:0 "可奉§Y直茂辅政§!、§Y龙造寺旧臣§!、§Y有明海堤防§!为三项先务，再依时势行此策：保留龙造寺名义共治、和平禅让或公开新政三路合法化。若能使§Y佐贺水利院、旧臣安堵与陶业奉行§!不因主君更替而废，本家便有从分国走向天下的根基。反之，军令出于私恩、财赋不入公簿，所得越广，裂隙也越深。"
 jxp_start_house_toy_chronicle:0 "§Y丰臣家§!之谱有云：织田统一工程后的关白／太阁政权，以检地、刀狩、奉行与大老协调新旧领主。家门所倚，往往亦是家门所困；眼前最险的一结，正在继承合法性、奉行与大老对立以及外征负担会撕裂政权。若只争一城一战而不辨名分、知行与旧约，军势虽盛，也难使降服者久安。主君当在兵马未动之前，先定家中可守百年的次第。"
 jxp_start_house_toy_counsel:0 "今后用事，宜先察§Y关白宣下§!、§Y太阁检地§!、§Y奉行与大老§!。可完成关白官僚制、大老合议或朱印贸易型天下政权。待内外有序，便把§Y太阁检地、刀狩、奉行／大老治理容量与朱印贸易§!定为可传诸国的成法，使旧臣不失其所、新附不疑其命、百姓不困于无常征发；这才是本家真正的胜势。"
 jxp_start_house_generic_chronicle:0 "§Y[Root.GetName]§!已不再只是旧日一国一郡之名。今日所承者，是诸家法、寺社、町众与军役交织而成的天下；旧姓虽可更易，统治仍须回答如何把战时军令化为可传后世的法度。"
 jxp_start_house_generic_counsel:0 "先核田土与军役，再定朝廷、武家、寺社和町众之分。若能使征服者受法、降服者有席、百姓知所输纳，新天下方不至于随一代雄主而散。"
 jxp_start_doctrine_jodo_shinshu:0 "§Y净土真宗§!以阿弥陀佛本愿、念佛与信心为宗，讲、坊舍与寺内町既能施济乡里，也可能形成独立的政治力量。本宗沿用§Y业力§!：一味征伐会使业力偏低，一味退让则会使业力偏高；守其中道，方能得到最厚的教法助益。"
 jxp_start_doctrine_vanilla:0 "[Root.StartScreenUpRightDesc]"
 jxp_start_age_discovery_name:0 "群雄草创之世"
 jxp_start_age_discovery_lead:0 "旧守护之名分尚存，兵粮、年贡与城砦却渐归诸家之手。今日所选的每一道安堵与盟誓，都会写进本家此后的兴亡。"
 jxp_start_age_discovery_overview:0 "此时旧守护秩序将裂未裂。京都的御教书尚能裁定名分，却未必能越过山川，把军粮与年贡送到每一座山城；守护代、国人、寺社、惣村与港町各握一端。主君今日发下的安堵，明日便可能成为邻家举兵的口实。欲图天下，先须使家中奉行能记账、道路能通兵、盟誓能经得住一次败阵。"
 jxp_start_age_discovery_faith:0 "神社与佛寺共同护持国土，权门、山门和门徒却也各有庄园、兵众与诉讼。祭礼能聚民，勧进能兴工，宗论亦能焚城。治者若只问教义而不问寺领、町座与百姓负担，祈祷之声很快便会化作一揆的钟鼓。"
 jxp_start_age_discovery_role_shogunate:0 "§Y[Root.GetName]幕府§!居武家名分之上，然而将军御内书未必足以驱动远国。管领、奉公众、守护与寺社都能借公仪之名争夺裁断。应先重整侍所与政所，使上洛、安堵和停战皆有可执行的次第；否则幕府每一次调停，都会暴露一次虚弱。"
 jxp_start_age_discovery_role_daimyo:0 "§Y[Root.GetName]家§!虽受幕府名分，真正维持领国的却是城砦、军役账与家臣起请。你须在旧守护权、在地国人与新兴被官之间裁定知行，并判断何时奉公、何时上洛、何时以兵威改写公议。小国可因一纸盟约得生，也可因一次迟疑而亡。"
 jxp_start_age_discovery_role_realm:0 "§Y[Root.GetName]§!已越过一国一郡的旧限，却仍背负群雄时代的盟誓与私怨。若要使征服不在主君身后崩散，便须把临时军令改为奉行制度，把降服之众改编为可核算的军役，并让朝廷、武家与町众都在新秩序中看见自己的位置。"
 jxp_start_age_reformation_name:0 "法统改易之世"
 jxp_start_age_reformation_lead:0 "应仁余烬已化为诸国争衡，火器、异舶与新教说亦在这一时代渐次叩海。旧家格不再足恃，能治城、治军、治民者方能立国。"
 jxp_start_age_reformation_overview:0 "应仁余烬已化为诸国争衡，火器、异舶与天主教在这一时代渐次叩海：或已至港津，或尚在远方传闻，所到之处都令旧有权威重新估价。检地把隐田写进账册，城下町把商贾迁到大道，讲众与寺内町也显示信仰足以动员乡里。此世的强者不只善战，更须使铳炮、兵粮、商税和人质沿同一套命令运转。"
 jxp_start_age_reformation_faith:0 "净土真宗的讲、法华众的结社、旧寺社的门前町与南蛮传来的切支丹教门并立。改宗可以换来海外商路，也可能撕裂家臣团；护法可以安定乡里，也可能纵成门徒国。主君必须区分内心之信与公法之责，使寺社、教会和町众都不能越过军政。"
 jxp_start_age_reformation_role_shogunate:0 "§Y[Root.GetName]幕府§!面对的已非只求安堵的旧守护，而是掌握铁炮、商港和常备军的战国诸侯。将军若只凭先例，御所便会沦为强家挟持的印玺；若能把上洛诸军编入公仪、控制京都财赋并逐家奖惩，大乱反可成为重建幕政的机会。"
 jxp_start_age_reformation_role_daimyo:0 "§Y[Root.GetName]家§!必须从战时联盟变成能治民的领国。每下一城，都要回答旧臣如何安堵、军团如何得粮、宗教争端由谁裁断、市场由谁治理。你既可奉将军而争天下名分，也可另立权威；无论选择何路，都须先使家臣团不因继承而分裂。"
 jxp_start_age_reformation_role_realm:0 "§Y[Root.GetName]§!正把战国的动员力锻成统一政权。天下人的命令必须穿过奉行、检地册和城郭网络，而不能只依靠宿将私恩。朝廷名分、寺社处置、南蛮贸易与诸侯转封皆须纳入一套可继承的法度，方能使统一不止于一代威名。"
 jxp_start_age_absolutism_name:0 "公仪成法之世"
 jxp_start_age_absolutism_lead:0 "兵火多已收束，城郭、石高、军役、寺社与海路日益纳入公仪成法。盛世的胜负不只在阵前，更在仓廪、驿路、救荒与奉行账册之间。"
 jxp_start_age_absolutism_overview:0 "兵乱渐远，天下的胜负转入法度、仓廪与驿路。武家诸法度约束诸侯，城郭与参勤消耗藩力，朱印船、矿山和都市则把财富送入奉行账册。表面的太平并不等于静止：饥馑、浪人、米价和外样怨望都在考验公仪。能否把救荒、裁判与海防做成常制，将决定这份和平是盛世根基，还是下一场大乱的薄冰。"
 jxp_start_age_absolutism_faith:0 "寺请与宗门改把信仰写入户籍，朱子学为君臣名分提供言辞，寺社仍掌握教育、赈济与地方记忆。秩序若只靠禁令，隐秘教门与被压抑的乡村便会在灾年合流；若只图宽纵，公法又会被寺领和门阀掏空。敬神礼佛之外，更须使教门承担公共责任。"
 jxp_start_age_absolutism_role_shogunate:0 "§Y[Root.GetName]幕府§!须以公仪统摄诸藩，而非日日诉诸征伐。领地转封、武家法度、参勤、直辖财源和海路警固应彼此咬合；对亲藩、谱代与外样的尺度若失其平，太平便会养出新的割据。将军真正的威权，是让万事有例而仍能救急。"
 jxp_start_age_absolutism_role_daimyo:0 "在公仪成法之世，§Y[Root.GetName]家§!的生存不只靠兵数。藩政须经营新田、专卖、学问与救荒，同时在幕府役务和本国财计之间保存余力。过度积兵招来猜忌，只求恭顺又会使家中空虚；一藩之治，正是对天下秩序最严厉的试卷。"
 jxp_start_age_absolutism_role_realm:0 "§Y[Root.GetName]§!的权威已深入诸国，今后之难在于使广土众民不因例法繁密而窒息。中央奉行、地方代官、诸侯议席与商人资本必须互相制衡；盛世的国库既要供养海防与赈济，也要防止官僚把安定变成因循。"
 jxp_start_age_revolutions_name:0 "海国问政之世"
 jxp_start_age_revolutions_lead:0 "久安使城下町繁盛，也使石高旧制与货殖新势相龃龉。藩债、乡诉、饥馑、书院之论与北海异船，都在追问本家是否仍有应世之法。"
 jxp_start_age_revolutions_overview:0 "旧法外严而内弛，米价、百姓一揆与藩债不断追问谁应承担太平的代价。兰学、国学与实学争论天下之本，北海异船与外洋警讯又使海防不再只是边地之务。朝廷名分重新进入政治，町人财富却早已越过旧身分。此世的改革若只补一处账目，必在另一处裂开；唯有重订军政、财赋与对外之法，方能免于被时代推倒。"
 jxp_start_age_revolutions_faith:0 "国学重寻神代与王统，兰学打开异国知识，寺院教育和民间讲社仍维系乡里。信仰已不能只由禁制裁定：朝廷、幕府、藩校与町众都在争夺解释天下的语言。主君须容纳学问而守住公法，使尊王不沦为私斗，使开智不成为无根的仿效。"
 jxp_start_age_revolutions_role_shogunate:0 "§Y[Root.GetName]幕府§!面对的敌手不只在诸藩，也在债册、海防与日渐高涨的朝廷名分之中。沿用旧例可以延缓争端，却不能回答异国通商与全国军备。将军若不能让改革成为公议，任何一次饥馑或叩关都可能使诸藩与公仪渐生离心。"
 jxp_start_age_revolutions_role_daimyo:0 "§Y[Root.GetName]家§!可在一藩之内先行试法：整顿债务、兴办藩校、修习译书、整饬海岸军备，并与朝廷和幕府周旋。改革越快，旧臣反弹越烈；改革越迟，财政与外患越难挽回。你必须决定，本家要成为旧秩序的柱石，还是新天下的先声。"
 jxp_start_age_revolutions_role_realm:0 "§Y[Root.GetName]§!已站在海国与世界相接之处。中央集权若不能容纳地方议论，便会催生反叛；开放贸易若没有关税、海军与条法，又会使国门受制于人。此刻所定的成宪、军制与学政，将决定日轮之国以何种姿态面对外洋诸国。"
 jxp_start_age_fallback_name:0 "日轮流转之世"
 jxp_start_age_fallback_lead:0 "岁序虽越旧史，名分、财赋、军役与民生之问仍在眼前。"
 jxp_start_age_fallback_overview:0 "岁序虽越旧史，天下之务仍在名分、财赋、军役与民生。请从眼前国情出发，为[Root.GetName]另定一代之法。"
 jxp_start_age_fallback_faith:0 "祭政与教法须能安民而不越公议；敬畏传统，也要为当世之变留下余地。"
 jxp_start_age_fallback_role_realm:0 "[Root.GetName]须在旧例与新政之间作出自己的裁断。"
