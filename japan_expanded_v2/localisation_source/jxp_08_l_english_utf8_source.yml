 jxp_hakko_ichiu_reform:0 "八纮一宇"
 jxp_hakko_ichiu_reform_desc:0 "开拓万里波涛，布国威于四方。日轮既承天命，朝仪、军役与海路皆当归于同一王道。异俗不废其用，异邦不失其序；四海列国，皆可纳入新的天下尺度。"
