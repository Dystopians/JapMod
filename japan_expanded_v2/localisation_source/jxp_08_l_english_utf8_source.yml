l_english:
 jxp_hakko_ichiu_reform:0 "八纮一宇"
 jxp_hakko_ichiu_reform_title:0 "八纮一宇"
 jxp_hakko_ichiu_reform_emperor:0 "敕定八纮一宇"
 jxp_hakko_ichiu_reform_member:0 "奉行八纮一宇"
 jxp_hakko_ichiu_reform_desc:0 "开拓万里波涛，布国威于四方。日轮之国既承天命，欲使朝仪、贡舶、军役与海路各归其序，便须以天下财赋供养远方驿传，以国内官吏安抚异俗诸邦。此制是天朝扩张的偏锋，并非无代价的常道；诏旨所至之处若未获安堵与承认，抵抗、转运和治理之费皆由朝廷承担。"
 jxp_hakko_ichiu_reform_unlocked_tt:0 "「问鼎天命」之议既定，天朝改革「八纮一宇」可奏请施行。"
 jxp_hakko_ichiu_unlock_requirement_tt:0 "完成任务「问鼎天命」，使日本朝廷以天命所归昭告四方。"
 jxp_hakko_ichiu_celestial_exemption_tt:0 "颁行新制后，旧有的汉化抵触将按天朝新仪平息；但未获承认的东亚异俗领土仍会造成长期治理、维持与外交负担。"
 jxp_hakko_ichiu_cb_tt:0 "颁行新制后，获得对东亚沿海独立国家的「八纮一宇」战争借口。该借口以朝贡、释放国家、归还旧地、贸易和少数已有普通宣称的战略港为主，不降低普通大规模吞并的战争分数费用。"
 cb_jxp_hakko_ichiu:0 "八纮一宇"
 cb_jxp_hakko_ichiu_desc:0 "开拓万里波涛，布国威于四方。受命之朝廷以舟师与使节并行，要求沿海诸邦奉贡、归还旧地或开放有限港口；此诏不把整片东亚变成可廉价吞并的疆土。"
 jxp_hakko_ichiu_wargoal:0 "八纮一宇"
 jxp_hakko_ichiu_wargoal_desc:0 "战争目标是攻取敌国都城。朝贡、释放国家、归还核心与贸易和约居先；只有少数已有普通宣称的东亚港口获得有限侵略扩张优惠，战争分数费用保持通常水平，且不得借此吞并整个国家。"
 JXP_HAKKO_ICHIU_COUNTRY_DESC:0 "东亚诸国"
 JXP_HAKKO_ICHIU_PROV_DESC:0 "已有普通宣称的东亚战略港口"
 JXP_HAKKO_ICHIU_WAR_NAME:0 "$ORDER$$FIRST$-$SECOND$八纮一宇战争"
