 jxp_hakko_ichiu_unlock_requirement_tt:0 "完成任务「问鼎天命」，由日本朝廷确立对天命的主张。"
 jxp_hakko_ichiu_celestial_exemption_tt:0 "不再遭受非儒教国教与非东亚文化带来的天朝正统压力。"
 jxp_hakko_ichiu_cb_tt:0 "获得对东亚诸国的战争借口「八纮一宇」。"
