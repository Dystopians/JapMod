l_english:
 jxp_specific_route_house.16.t:0 "月山矿路与封境令"
 jxp_specific_route_house.16.d:0 "尼子旧臣熟悉月山富田的山道、银铁、关所与新宫党旧怨。锁国若只看海门，便会忘记山国也有自己的门户；若能收束矿路与家中军册，闭国之法便能从内陆生根。"
 jxp_specific_route_house.16.a:0 "以月山矿路供给封境"
 jxp_specific_route_house.16.b:0 "安抚新宫党旧名"
 jxp_specific_route_house.17.t:0 "细川管领与王政奏书"
 jxp_specific_route_house.17.d:0 "细川旧名牵连管领、堺商人、京都奉公众与畿内寺社。王政复古若承认这份旧日中介，便可借其熟悉的文书与市声，使朝命更顺利地抵达畿内。"
 jxp_specific_route_house.17.a:0 "使管领旧仪入王政内阁"
 jxp_specific_route_house.17.b:0 "留堺商人与公家调停"
 jxp_specific_route_house.18.t:0 "若江誓纸与长老会"
 jxp_specific_route_house.18.d:0 "畠山旧臣在河内、纪伊与若江之间久经内争，最懂得誓纸如何约束不安的家中。改革宗日本若要在城下市町立约，畿内旧法可成为长老会议之外的另一重保障。"
 jxp_specific_route_house.18.a:0 "以若江誓纸约束会众"
 jxp_specific_route_house.18.b:0 "以河内旧臣安定国中"
 jxp_specific_route_house.19.t:0 "姬路账册与远洋奉行"
 jxp_specific_route_house.19.d:0 "池田旧臣所记的播磨城下、姬路仓账与港口道路，足以为开国通商提供一套可靠的内地骨架。海船出港之前，粮米、木材与银钱早已在城下被数清。"
 jxp_specific_route_house.19.a:0 "使姬路奉行管领远洋账册"
 jxp_specific_route_house.19.b:0 "守播磨城下旧式会计"
 jxp_specific_route_house.20.t:0 "加贺百万石与礼学讲堂"
 jxp_specific_route_house.20.d:0 "前田旧臣以加贺百万石、金泽城下与文艺之风自重。朱子礼制若能纳此丰饶而谨慎的国风，讲堂便不只是训士之地，也会成为治理大藩财赋的书案。"
 jxp_specific_route_house.20.a:0 "以加贺学寮辅佐礼制"
 jxp_specific_route_house.20.b:0 "以百万石仓廪安民"
 jxp_specific_route_house.21.t:0 "武卫旧署与王政之门"
 jxp_specific_route_house.21.d:0 "斯波旧名虽历经衰落，仍携带武卫、尾张、越前诸旧署的记忆。王政复古若肯收容这类失势名门，便能使旧秩序中的碎片重新成为朝廷的砖石。"
 jxp_specific_route_house.21.a:0 "使武卫旧署奉还朝廷"
 jxp_specific_route_house.21.b:0 "以尾张家兵护持新制"
 jxp_specific_route_house.22.t:0 "六分一殿与山阴守护"
 jxp_specific_route_house.22.d:0 "山名旧称六分一殿，所余虽非昔日盛势，却仍懂得守护名分如何安放山阴诸国。王政若重编位阶，山名之名可作为旧守护归顺的范例。"
 jxp_specific_route_house.22.a:0 "以六分一旧名定诸侯位阶"
 jxp_specific_route_house.22.b:0 "留山阴守护所守边郡"
 jxp_specific_route_house.23.t:0 "陆奥九户与北境关防"
 jxp_specific_route_house.23.d:0 "陆奥旧臣看惯北地雪道、马市、虾夷商旅与边郡豪族。锁国若由北境解释，海禁便不只是长崎的事；远山之外的每一道关木，也都成为天下秩序的一部分。"
 jxp_specific_route_house.23.a:0 "以陆奥关防束北境"
 jxp_specific_route_house.23.b:0 "保九户马册以备边"
 jxp_specific_route_house.24.t:0 "伊势国司与朝仪复兴"
 jxp_specific_route_house.24.d:0 "北畠旧臣在伊势保存国司、神宫、歌道与公家武门之间的微妙旧法。王政复古若从此处取材，便会少些空疏名号，多些仍可触摸的古仪。"
 jxp_specific_route_house.24.a:0 "以伊势旧仪入朝"
 jxp_specific_route_house.24.b:0 "以北畠家法训诸司"
 jxp_specific_route_house.25.t:0 "播磨关路与赤松旧兵"
 jxp_specific_route_house.25.d:0 "赤松旧臣熟知播磨山路、驿站与西国军役。锁国之法若从关路推行，便可把西国通道纳入公仪视线；但旧家武士仍要求保留赤松法度的锋芒。"
 jxp_specific_route_house.25.a:0 "以播磨关路闭合西国"
 jxp_specific_route_house.25.b:0 "以赤松旧兵守新令"
 jxp_specific_route_house.26.t:0 "虾夷地商路与北海开门"
 jxp_specific_route_house.26.d:0 "安东旧臣在津轻、虾夷地与北海商旅之间充当经纪。开国通商若向北延展，便可使寒雾中的皮货、昆布与银砂也成为日本海门的一部分。"
 jxp_specific_route_house.26.a:0 "使虾夷地经纪入通商册"
 jxp_specific_route_house.26.b:0 "留北方番所守旧路"
 jxp_specific_route_house.27.t:0 "香取军册与下总关法"
 jxp_specific_route_house.27.d:0 "千叶旧臣倚香取、下总、东国武士与关路名册而立。锁国若要约束东国，不可只借京都和江户之名，也须使坂东旧族在新法中看见自己的席位。"
 jxp_specific_route_house.27.a:0 "以香取军册奉行闭国"
 jxp_specific_route_house.27.b:0 "以下总关法安东国"
 jxp_specific_route_house.28.t:0 "丹后水手与天桥立"
 jxp_specific_route_house.28.d:0 "一色旧臣守丹后海口，熟知若狭、但马、北国船路与天桥立外的风。开国通商若从此处纳入水手旧法，北海岸便不再只是边缘，而会成为另一扇海门。"
 jxp_specific_route_house.28.a:0 "任丹后港奉行开海路"
 jxp_specific_route_house.28.b:0 "以天桥立水先众守航"
 jxp_specific_route_house.29.t:0 "日向城砦与圣堂钟声"
 jxp_specific_route_house.29.d:0 "伊东旧臣在日向山海之间筑城、联姻、守土。吉利支丹日本若取道日向，圣堂不会只是港町奇观，也会在山城与乡社之间寻找自己的钟楼。"
 jxp_specific_route_house.29.a:0 "以日向学舍护持信仰"
 jxp_specific_route_house.29.b:0 "使伊东诸城容纳圣堂"
 jxp_specific_route_house.30.t:0 "阿苏祭礼与菊池旧法"
 jxp_specific_route_house.30.d:0 "菊池旧名与阿苏祭礼、肥后山国、古战记忆相连。朱子礼制若能敬慎处理这类旧仪，儒官便可不必毁神道而明礼，反能借山社旧名安抚乡里。"
 jxp_specific_route_house.30.a:0 "以阿苏祭礼入礼学"
 jxp_specific_route_house.30.b:0 "留菊池山国旧法"
 jxp_specific_route_house.31.t:0 "伊予水军与黑潮朱札"
 jxp_specific_route_house.31.d:0 "河野旧臣熟悉伊予、濑户内与村上水军的潮路。倭寇日本若借此旧法出海，私帆之勇可被朱札收束；若放任太过，也会使海上诸众重归旧习。"
 jxp_specific_route_house.31.a:0 "以伊予水先众导私掠"
 jxp_specific_route_house.31.b:0 "留濑户内旧誓约束海众"
 jxp_specific_route_house.32.t:0 "信浓马场与御旗弓法"
 jxp_specific_route_house.32.d:0 "小笠原旧臣以礼法、弓马、信浓山道与有职故实见长。王政复古若需要一支懂得仪式与战场的武家，御旗之下的弓马旧法正合其用。"
 jxp_specific_route_house.32.a:0 "以诏命重编小笠原弓马"
 jxp_specific_route_house.32.b:0 "守信浓马场旧法"
 jxp_specific_route_house.33.t:0 "大宰府经纪与海峡礼法"
 jxp_specific_route_house.33.d:0 "少贰旧臣记得大宰府、博多、对外文书与九州商旅的旧日格局。海峡日本若借此经纪南下西航，异俗商人便能在日本门户前找到熟悉的接待之所。"
 jxp_specific_route_house.33.a:0 "以大宰府经纪接纳海商"
 jxp_specific_route_house.33.b:0 "以九州门户守住旧礼"
 jxp_specific_route_house.34.t:0 "常陆军册与东国王师"
 jxp_specific_route_house.34.d:0 "佐竹旧臣长于常陆、奥州口与东国武士名册。王政复古若欲在东国立威，常陆军册可以把边郡诸士写入诏命之下，而非只留在旧家门第之间。"
 jxp_specific_route_house.34.a:0 "以常陆军册编入王师"
 jxp_specific_route_house.34.b:0 "留东国武士守边"
 jxp_specific_route_house.35.t:0 "美浓川筋与礼法账簿"
 jxp_specific_route_house.35.d:0 "土岐旧臣熟知美浓川筋、关口、纸墨与守护文书。朱子礼制若从山川与账册入手，便可使礼法不止停在讲堂，而流进水运、赋役与城下政务。"
 jxp_specific_route_house.35.a:0 "以美浓川筋入礼制"
 jxp_specific_route_house.35.b:0 "以土岐家法教诸司"
 jxp_specific_route_house.36.t:0 "日光关门与下野社家"
 jxp_specific_route_house.36.d:0 "宇都宫旧臣与下野社家、日光山道、坂东关门相互依存。锁国若要在东国深处生效，日光的神威与关门的账册可以共同守住内陆之门。"
 jxp_specific_route_house.36.a:0 "以日光关门闭合东国"
 jxp_specific_route_house.36.b:0 "以下野社家安抚乡里"
 jxp_specific_route_house.37.t:0 "大和寺社与门徒惣约"
 jxp_specific_route_house.37.d:0 "筒井旧臣生于大和寺社、奈良町与僧俗调停之间。一向路线若从大和取法，门徒惣约便会多一重古寺中介；但若过分放任，也会使寺社旧权重新缠住新国法。"
 jxp_specific_route_house.37.a:0 "以大和寺社调和门徒"
 jxp_specific_route_house.37.b:0 "使奈良调停保留旧仪"
 jxp_31_ama_gassan_closed_mines:0 "月山封境矿路"
 jxp_31_ama_gassan_closed_mines_desc:0 "月山富田的矿道与山路被纳入封境账册，尼子旧臣得以从内陆供给闭国之法。"
 jxp_31_ama_shingu_retainer_rolls:0 "新宫党旧册"
 jxp_31_ama_shingu_retainer_rolls_desc:0 "新宫党旧名与山国军册被谨慎重编，尼子家中旧怨因此化为可用的秩序。"
 jxp_31_hsk_kanrei_restoration_cabinet:0 "管领复古内阁"
 jxp_31_hsk_kanrei_restoration_cabinet_desc:0 "细川管领旧名被写入王政文书，畿内诸司因此更容易承认新朝廷的日常裁断。"
 jxp_31_hsk_sakai_court_brokers:0 "堺町公家经纪"
 jxp_31_hsk_sakai_court_brokers_desc:0 "堺商人与公家旧缘继续在朝廷和市町之间调停，使王政不至脱离畿内商路。"
 jxp_31_htk_wakae_synodic_oaths:0 "若江长老誓纸"
 jxp_31_htk_wakae_synodic_oaths_desc:0 "若江旧臣以誓纸约束城下会众，使改革宗会议更能落入地方秩序。"
 jxp_31_htk_kawachi_retainer_compact:0 "河内旧臣约"
 jxp_31_htk_kawachi_retainer_compact_desc:0 "畠山旧臣保留部分家中裁断，以安定河内、纪伊诸士。"
 jxp_31_ike_himeji_oceanic_stewards:0 "姬路远洋奉行"
 jxp_31_ike_himeji_oceanic_stewards_desc:0 "姬路城下账册被扩展为远洋供给簿，开国船队由此获得内地支撑。"
 jxp_31_ike_harima_castle_accounts:0 "播磨城下会计"
 jxp_31_ike_harima_castle_accounts_desc:0 "池田旧法继续管理播磨仓账，使海贸收益不脱离城下治理。"
 jxp_31_mae_kaga_confucian_academies:0 "加贺礼学馆"
 jxp_31_mae_kaga_confucian_academies_desc:0 "金泽学寮以丰厚藩政供养儒官，使礼制日本的讲堂更具实务根基。"
 jxp_31_mae_million_koku_granaries:0 "百万石公仓"
 jxp_31_mae_million_koku_granaries_desc:0 "加贺仓廪被用于安置民役与救荒，前田旧臣的宽厚成为新礼制的底气。"
 jxp_31_sba_buei_imperial_offices:0 "武卫奉还署"
 jxp_31_sba_buei_imperial_offices_desc:0 "斯波旧署重归朝廷名下，为王政复古补上一段失落的武家名分。"
 jxp_31_sba_owari_house_guards:0 "尾张旧家卫"
 jxp_31_sba_owari_house_guards_desc:0 "尾张旧臣与家兵被重新整编，护持新制而不尽失旧家体面。"
 jxp_31_ymn_roku_bun_ichi_rankings:0 "六分一位阶"
 jxp_31_ymn_roku_bun_ichi_rankings_desc:0 "山名旧名被用来示范旧守护如何接受王政新位阶。"
 jxp_31_ymn_sanin_guard_houses:0 "山阴守护番"
 jxp_31_ymn_sanin_guard_houses_desc:0 "山阴旧守护所继续巡守边郡，使远国武士在新朝廷下仍有可守之地。"
 jxp_31_rfr_mutsu_border_cordon:0 "陆奥北境关防"
 jxp_31_rfr_mutsu_border_cordon_desc:0 "北地关防与番所把锁国之法延伸到雪道和马市之间。"
 jxp_31_rfr_nine_gates_horse_rolls:0 "九户马册"
 jxp_31_rfr_nine_gates_horse_rolls_desc:0 "九户旧马册被保留下来，北地骑从因此仍能为新日本备边。"
 jxp_31_ktb_ise_imperial_rites:0 "伊势朝仪"
 jxp_31_ktb_ise_imperial_rites_desc:0 "北畠旧臣以伊势古仪辅佐王政，使复古不止停留于名号。"
 jxp_31_ktb_kitabatake_court_law:0 "北畠公家武门法"
 jxp_31_ktb_kitabatake_court_law_desc:0 "公家与武门之间的北畠旧法被保存为诸司裁断的参考。"
 jxp_31_akm_harima_closed_roads:0 "播磨闭关路"
 jxp_31_akm_harima_closed_roads_desc:0 "赤松旧臣把播磨驿路和山口纳入锁国检查，使西国通道更有法可循。"
 jxp_31_akm_akasaka_retainer_codes:0 "赤松旧兵法度"
 jxp_31_akm_akasaka_retainer_codes_desc:0 "赤松家中旧兵法被改写为新令的军役条目。"
 jxp_31_akt_ezochi_trade_brokers:0 "虾夷地贸易经纪"
 jxp_31_akt_ezochi_trade_brokers_desc:0 "安东旧经纪把北海货物和船路写入开国账册。"
 jxp_31_akt_northern_watch_posts:0 "北方番所"
 jxp_31_akt_northern_watch_posts_desc:0 "北地番所继续记录寒雾中的帆影，使开海不至失去边防。"
 jxp_31_cba_katori_closed_musters:0 "香取闭国军册"
 jxp_31_cba_katori_closed_musters_desc:0 "千叶旧臣以香取军册支撑东国闭国守备。"
 jxp_31_cba_shimosa_barrier_law:0 "下总关法"
 jxp_31_cba_shimosa_barrier_law_desc:0 "下总关门旧法被纳入国中账册，坂东诸士因此更易服从新令。"
 jxp_31_isk_tango_open_wardens:0 "丹后开港守"
 jxp_31_isk_tango_open_wardens_desc:0 "一色旧臣以丹后海口和北岸水手服务开国航路。"
 jxp_31_isk_amanohashidate_pilots:0 "天桥立水先众"
 jxp_31_isk_amanohashidate_pilots_desc:0 "天桥立外的水先众继续掌记潮汐、暗礁与北海风向。"
 jxp_31_ito_hyuga_seminary_castles:0 "日向城砦神学校"
 jxp_31_ito_hyuga_seminary_castles_desc:0 "伊东山城与神学校相互护持，使信仰深入日向内地。"
 jxp_31_ito_hyuga_clan_chapels:0 "伊东氏族小圣堂"
 jxp_31_ito_hyuga_clan_chapels_desc:0 "氏族旧社与圣堂在地方调停中并存，日向信众因此更安稳。"
 jxp_31_kkc_aso_rite_schools:0 "阿苏礼学所"
 jxp_31_kkc_aso_rite_schools_desc:0 "阿苏祭礼被谨慎纳入儒官讲学，使神道旧仪在礼制中获得新名分。"
 jxp_31_kkc_kikuchi_hill_codes:0 "菊池山国法"
 jxp_31_kkc_kikuchi_hill_codes_desc:0 "菊池旧法保留肥后山国的边地经验，避免新礼制离乡里太远。"
 jxp_31_kno_setouchi_corsair_pilots:0 "濑户内私掠水先"
 jxp_31_kno_setouchi_corsair_pilots_desc:0 "河野旧水军为朱札私掠提供潮路和港火。"
 jxp_31_kno_iyo_sea_oaths:0 "伊予海众誓纸"
 jxp_31_kno_iyo_sea_oaths_desc:0 "伊予海众旧誓纸被保留，用以约束倭寇路线中的水军诸头。"
 jxp_31_ogs_suwa_imperial_archers:0 "诏命诹访弓马"
 jxp_31_ogs_suwa_imperial_archers_desc:0 "小笠原弓马旧法被纳入王政军仪，使战阵与朝仪互相映照。"
 jxp_31_ogs_shinano_horse_law:0 "信浓马场法"
 jxp_31_ogs_shinano_horse_law_desc:0 "信浓马场旧规继续训练骑从，使复古军制不失武家筋骨。"
 jxp_31_shn_dazaifu_maritime_brokers:0 "大宰府海商经纪"
 jxp_31_shn_dazaifu_maritime_brokers_desc:0 "少贰旧臣以大宰府和博多旧缘接待南海商旅。"
 jxp_31_shn_kyushu_gateway_guards:0 "九州门户守"
 jxp_31_shn_kyushu_gateway_guards_desc:0 "九州门户守备在海峡礼法下重整，商路与防务因此并行。"
 jxp_31_stk_hitachi_imperial_musters:0 "常陆王师军册"
 jxp_31_stk_hitachi_imperial_musters_desc:0 "佐竹旧军册被写入王师名下，东国武士由此获得新的名分。"
 jxp_31_stk_eastern_warrior_rolls:0 "东国武士帐"
