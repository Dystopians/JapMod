l_english:
 jxp_route_house_resonance.1.t:0 "旗帐与新国体"
 jxp_route_house_resonance.1.d:0 "开府本家的旗头与谱代诸将仍以战阵席次自重，而新路线的奉行希望以统一后的法令重编诸役。刀枪曾收拾天下，文书如今也要收拾刀枪。"
 jxp_route_house_resonance.1.a:0 "令路线奉行重勘军役"
 jxp_route_house_resonance.1.b:0 "以武门誓纸调和新法"
 jxp_route_house_resonance.2.t:0 "京洛旧名与新路线"
 jxp_route_house_resonance.2.d:0 "来自京都的官途、旧谱与席次表被置于案上。新国体若无名分，诸国难免疑惧；然而旧名分若太重，也会拖慢新政的脚步。"
 jxp_route_house_resonance.2.a:0 "使路线官司统摄旧名"
 jxp_route_house_resonance.2.b:0 "以京洛家风润饰新政"
 jxp_route_house_resonance.3.t:0 "浦港旧例与诸道海风"
 jxp_route_house_resonance.3.d:0 "港町年寄、通事、水军头目与外海商人齐聚奉行所。潮汐知道旧航路，国家却需要新账册。"
 jxp_route_house_resonance.3.a:0 "让路线法度重编海门"
 jxp_route_house_resonance.3.b:0 "以海国家风调和外海"
 jxp_route_house_resonance.4.t:0 "境目誓纸与远方关门"
 jxp_route_house_resonance.4.d:0 "山口、渡口、马市与边地诸众递来旧誓。新国体的文书可以抵达京都与港町，却仍需穿过雾雪、山道与远境人心。"
 jxp_route_house_resonance.4.a:0 "以路线奉行巡视边地"
 jxp_route_house_resonance.4.b:0 "以境目旧誓安置远方"
 jxp_route_house_resonance.5.t:0 "社寺市座与诸道公法"
 jxp_route_house_resonance.5.d:0 "寺社香火、门前町、市座账册与新路线的法度彼此碰撞。人心依旧在钟声、祭礼和市声中流动，国家却要把这一切写成可奉行的条目。"
 jxp_route_house_resonance.5.a:0 "以诸道公法重录市座"
 jxp_route_house_resonance.5.b:0 "以社寺市座调和新政"
 jxp_30_route_over_warrior_houses:0 "路线奉行重勘军役"
 jxp_30_route_over_warrior_houses_desc:0 "统一后的路线官司开始重编军役、知行与旗帐，使武门旧例服从新国体。"
 jxp_30_warrior_houses_temper_route:0 "武门誓纸调和新法"
 jxp_30_warrior_houses_temper_route_desc:0 "开府本家的武门誓纸被保留下来，新路线因此获得战阵诸家的承认。"
 jxp_30_route_over_court_houses:0 "路线官司统摄旧名"
 jxp_30_route_over_court_houses_desc:0 "官途、旧谱与席次被重新解释为新国体的附属名分。"
 jxp_30_court_houses_temper_route:0 "京洛家风润饰新政"
 jxp_30_court_houses_temper_route_desc:0 "京洛旧礼为新政添上可被诸国理解的名分与辞令。"
 jxp_30_route_over_maritime_houses:0 "路线法度重编海门"
 jxp_30_route_over_maritime_houses_desc:0 "外海航路、浦港旧例与船籍账册被新国体重新编排。"
 jxp_30_maritime_houses_temper_route:0 "海国家风调和外海"
 jxp_30_maritime_houses_temper_route_desc:0 "水军、通事与港町年寄的旧经验使新路线更懂得海风。"
 jxp_30_route_over_frontier_houses:0 "路线奉行巡视边地"
 jxp_30_route_over_frontier_houses_desc:0 "新路线的奉行深入山道、渡口与边地关门，把远境纳入可查的制度。"
 jxp_30_frontier_houses_temper_route:0 "境目旧誓安置远方"
 jxp_30_frontier_houses_temper_route_desc:0 "边地诸众的旧誓被新国体承认，远方因此更愿听命。"
 jxp_30_route_over_temple_market_houses:0 "诸道公法重录市座"
 jxp_30_route_over_temple_market_houses_desc:0 "社寺、市座与门前町账册被改写为新路线的公法条目。"
 jxp_30_temple_market_houses_temper_route:0 "社寺市座调和新政"
 jxp_30_temple_market_houses_temper_route_desc:0 "旧日香火、市声与町座账册为新政留下地方可接受的面貌。"
