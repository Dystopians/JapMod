l_english:
 TKG_ideas_start:0 "三河谱代传统"
 jxp_tkd_kurokawa_gold:0 "黑川金山"
 jxp_tkd_kurokawa_gold_desc:0 "山腹矿脉支撑骑马武者、治水堤防与甲州军役。金银若只用于馈赠，终会散尽；若纳入法度，便能成为山国之根。"
 jxp_ues_agakita_shu:0 "扬北众"
 jxp_ues_agakita_shu_desc:0 "北越豪族虽多桀骜，却熟悉山川、渡口与本地兵源。以上杉之名约束其锋芒，便能把不驯之力纳入军阵。"
 jxp_hjo_odawara_administration:0 "小田原仕置"
 jxp_hjo_odawara_administration_desc:0 "诉讼、年贡、军役与村账由小田原评定众细审。关东广土并非只凭刀枪维系，亦凭账册、判物与可巡可查的城下行政。"
 jxp_smz_tsurinobuse:0 "钓野伏"
 jxp_smz_tsurinobuse_desc:0 "佯退引敌，伏兵合围。岛津之阵不以整齐队列争名，而以山野、诱敌与突击折断敌军锋芒。"
 jxp_otm_brave_retainers:0 "勇烈家臣"
 jxp_otm_brave_retainers_desc:0 "大友家臣在九州战阵中反复磨砺，败局之中仍能守住本阵。其勇不在空言，而在每一次重新整队。"
 jxp_dte_oshu_shugo:0 "奥州守护"
 jxp_dte_oshu_shugo_desc:0 "东北广土需要强名、强兵与能越过山河的政令。伊达以守护之名重整边郡，使松散豪族逐渐归于本家账下。"
 jxp_dte_marriage_expansion:0 "婚姻扩张"
 jxp_dte_marriage_expansion_desc:0 "姻亲可开城门，也可止干戈。伊达的扩张常先由婚书试探边界，再由盟誓、养子与亲族网络稳固所得。"
 jxp_dte_renga_circle:0 "连歌会座"
 jxp_dte_renga_circle_desc:0 "歌会与文事使边地武家不失风雅，也给诸豪族提供同席相谈的机会。能以诗句开口时，未必立刻拔刀。"
 jxp_csk_hundred_article_code:0 "百箇条"
 jxp_csk_hundred_article_code_desc:0 "法律将军役、田地、诉讼和家中名分写成条目，使新兴之国有章可循。土佐诸人若知边界所在，争端便少一分兵刃。"
 IMG_ideas_start:0 "东海道名门"
 jxp_img_march_to_kyoto:0 "上洛军"
 jxp_img_march_to_kyoto_desc:0 "若要成就天下之志，就必须把东海道诸军带向京都。今川并非只为土地而战，更为通往将军之位的道路而战。"
 AMA_ideas_bonus:0 "月山余韧"
 jxp_akt_oshu_shogun:0 "奥州将军"
 jxp_akt_oshu_shogun_desc:0 "北方边郡离京都甚远，却仍需有人维持军威与名分。秋田若能召集海岸、山地与虾夷地往来的兵粮，便可在北奥自成屏障。"
 ASA_ideas_start:0 "一乘谷文武"
 MAE_ideas_bonus:0 "加贺百万石"
 YMN_ideas_bonus:0 "西国守护之望"
 jxp_stk_fidelity:0 "佐竹忠义"
 jxp_stk_fidelity_desc:0 "常陆武家以旧名、旧誓与累世军役自持。忠义若只作口号便易空泛，若写入军记与家法，便能成为长久的纪律。"
 jxp_utn_oyama_annexation:0 "小山并合"
 jxp_utn_oyama_annexation_desc:0 "关东旧族之间的并合并非单纯征服。宇都宫若能以名分、判物与边界调停吸纳邻邦，便可少动刀兵而拓展版图。"
