l_english:
 jxp_decision_convene_nagasaki_church_council_title:0 "召开长崎教会会议"
 jxp_decision_convene_nagasaki_church_council_desc:0 "长崎的钟声、港町的银箱与京都的名分必须写进同一套章程。教会若要成为国家的一部分，就必须学会在法度之内说话。"
 jxp_decision_hold_hirado_consistory_title:0 "召集平户长老会议"
 jxp_decision_hold_hirado_consistory_desc:0 "平户的商馆、讲坛与译书桌已经形成新的公共秩序。将其纳入国法，可使外来信仰不再只是港口私议。"
 jxp_decision_codify_kaikyo_port_law_title:0 "编定海教港法"
 jxp_decision_codify_kaikyo_port_law_desc:0 "南海商人、船主与信徒需要可预期的法度。港口若能容纳异域礼法，海门便不只是贸易之门，也是制度之门。"

 jxp_kirishitan_reform_center:0 "吉利支丹教化中心"
 jxp_kirishitan_reform_center_desc:0 "钟楼、教舍、译者与港町商人共同支撑一处新的信仰中心。其影响沿海道与书信缓慢扩散。"
 jxp_kirishitan_newly_baptized:0 "新受洗之地"
 jxp_kirishitan_newly_baptized_desc:0 "新旧礼俗暂时并行。地方有惊疑，也有谨慎的热情，奉行所必须让秩序先于争论抵达。"
 jxp_kirishitan_state_church:0 "日轮教会法度"
 jxp_kirishitan_state_church_desc:0 "教会被纳入国家章程，神职、译者、港务与地方领主各有其位。信仰不再只是海风带来的传闻。"
 jxp_nagasaki_bishopric:0 "长崎主教座"
 jxp_nagasaki_bishopric_desc:0 "长崎以钟声、仓库与文书连接外洋。这里既是教区，也是日本面向远方的眼睛。"
 jxp_kirishitan_roman_embassy:0 "罗马京都使节"
 jxp_kirishitan_roman_embassy_desc:0 "使节往来于罗马与京都之间，带回圣物、海图与谨慎的承认。远方名分被折入日本礼法。"
 jxp_kirishitan_oceanic_orders:0 "海上骑士团"
 jxp_kirishitan_oceanic_orders_desc:0 "信仰、武士与水手在海上结成新的纪律。十字与日轮并悬于船尾，随潮声远去。"
 jxp_kirishitan_shimabara_compact:0 "岛原和解誓约"
 jxp_kirishitan_shimabara_compact_desc:0 "旧日烈火被写成誓纸与宽宥令。伤口不能被忘却，但可以被纳入新的太平。"

 jxp_reformed_reform_center:0 "改革宗信约中心"
 jxp_reformed_reform_center_desc:0 "讲坛、商馆与译书桌共同形成新的信约中心。它不以华丽仪式取胜，而以规约和文字持久。"
 jxp_reformed_newly_ordered:0 "新立信约之地"
 jxp_reformed_newly_ordered_desc:0 "地方教会与奉行所共同登记誓约。信仰被写成账册、家法与港町公议。"
 jxp_reformed_consistory:0 "平户长老会议"
 jxp_reformed_consistory_desc:0 "长老、译官、商人和武家代表在平户议定章程。港口的信仰从此有了可诉诸的制度。"
 jxp_reformed_oranda_schools:0 "兰学书院"
 jxp_reformed_oranda_schools_desc:0 "医学、炮术、天文与神学在译书桌上相互照面。书院将外来知识磨成可用的国家技艺。"
 jxp_reformed_elder_ports:0 "港口长老会"
 jxp_reformed_elder_ports_desc:0 "诸港以长老会、商约和译官相连。远方商船不再只寻一处避风港，而是进入一张日本网络。"
 jxp_reformed_gunnery_bureau:0 "铁炮操典所"
 jxp_reformed_gunnery_bureau_desc:0 "荷兰式操典、足轻队列与国内铁炮匠被收进同一军制。纪律使火器不再只是奇物。"
 jxp_reformed_commonwealth:0 "信约国家"
 jxp_reformed_commonwealth_desc:0 "改革宗日轮不以一时热情为根基，而以誓约、账册、港口和操典维持自身。"

 jxp_kaikyo_reform_center:0 "海教教法中心"
 jxp_kaikyo_reform_center_desc:0 "清真寺、港法署、通词和船主会馆共同构成新的信仰中心。海峡礼法在日本港町扎根。"
 jxp_kaikyo_newly_ordered:0 "新归海教之地"
 jxp_kaikyo_newly_ordered_desc:0 "地方礼俗尚在调整，港口商人与村社长老都在学习新的节奏。国法必须让争论慢慢变成规矩。"
 jxp_kaikyo_qadi_courts:0 "卡迪法庭"
 jxp_kaikyo_qadi_courts_desc:0 "港市争讼、婚约、贸易契书与信仰事务由熟悉教法的法庭处理。远人因此愿意久留。"
 jxp_sakai_malay_brokers:0 "堺町马来通词"
 jxp_sakai_malay_brokers_desc:0 "堺、博多与长崎的通词学会海峡诸语。所谓远方，有时只差一位能把契约读准的人。"
 jxp_kaikyo_hajj_registry:0 "朝觐名册"
 jxp_kaikyo_hajj_registry_desc:0 "远航者的姓名、船只、誓愿与归期皆入名册。信仰之旅也成为国家理解海路的方式。"
 jxp_kaikyo_south_sea_compact:0 "南海商约"
 jxp_kaikyo_south_sea_compact_desc:0 "马六甲、爪哇、琉球与日本诸港在契书中相连。商约让海风有了方向。"
 jxp_kaikyo_sea_law:0 "苏丹海法"
 jxp_kaikyo_sea_law_desc:0 "和之苏丹国以港法、船队和誓约治理海门。日轮照在南海水面，亦照在法庭案牍之上。"

 jxp_kirishitan.5.t:0 "日轮与十字的国法"
 jxp_kirishitan.5.d:0 "新国家不能只把信仰留给港口和私宅。诸司提出章程：神父须登记，教舍须纳入城下秩序，京都名分亦不得被外来权威轻忽。有人低声念道：汝等当顺服在上有权柄者。日本必须为这句话写出自己的解释。"
 jxp_kirishitan.5.a:0 "让十字进入国法。"
 jxp_kirishitan.7.t:0 "诸国受洗"
 jxp_kirishitan.7.d:0 "从九州港町到内地城下，新的信仰已经不再只是外船传闻。钟声与起请文并行，地方领主在国法之下承认新的共同体。"
 jxp_kirishitan.7.a:0 "愿此光照诸岛。"
 jxp_kirishitan.8.t:0 "长崎主教座"
 jxp_kirishitan.8.d:0 "长崎的港口既听见潮声，也听见钟声。商人请求更稳定的管辖，神职请求明确的座次，奉行所则要求所有文书仍须经过日本官署。"
 jxp_kirishitan.8.a:0 "在长崎安置主教座。"
 jxp_kirishitan.9.t:0 "罗马与京都之间"
 jxp_kirishitan.9.d:0 "使节带回远方的问候、圣物、仪礼书与海图。京都公卿惊讶于万里之外仍有礼法，武家奉行则提醒众人：承认可以来自远方，主权必须留在日本。"
 jxp_kirishitan.9.a:0 "让使节通向更远的海。"
 jxp_kirishitan.9.b:0 "让国法先于远方承认。"
 jxp_kirishitan.10.t:0 "海路圣徒与铳炮师"
 jxp_kirishitan.10.d:0 "水手、铁炮师与信徒在远航中形成新的纪律。他们护送商船、守卫教舍，也把外洋战法带回日本。荒海や佐渡によこたふ天河，万里海路亦可成为国法之路。"
 jxp_kirishitan.10.a:0 "让他们守护日轮之海。"

 jxp_reformed.4.t:0 "平户信约与国法"
 jxp_reformed.4.d:0 "改革宗信仰不倚重华丽圣像，而重视讲坛、誓约和共同体的纪律。平户商人与译官请求国家承认他们的章程，使港口信仰不再游离于法度之外。"
 jxp_reformed.4.a:0 "以信约安置诸港。"
 jxp_reformed.6.t:0 "诸国立约"
 jxp_reformed.6.d:0 "地方教会、商馆与奉行所已经形成稳定联系。新信仰以书册和誓纸扩散，在城下町留下谨慎而清晰的痕迹。"
 jxp_reformed.6.a:0 "让誓约成为太平之文。"
 jxp_reformed.7.t:0 "兰学书院"
 jxp_reformed.7.d:0 "译官递上荷兰书籍，医者争论解剖图，炮术师要求试铸新炮。书院的门并不宽敞，却让日本看见另一种求知秩序。"
 jxp_reformed.7.a:0 "准其设院译书。"
 jxp_reformed.8.t:0 "港口长老会"
 jxp_reformed.8.d:0 "长崎、平户与堺的商人希望用共同章程处理贸易纠纷、船员纪律与信仰事务。港口若能彼此承认，海门便不会因一地风波而关闭。"
 jxp_reformed.8.a:0 "让诸港以长老会议约。"

 jxp_kaikyo.4.t:0 "清真港法与国法"
 jxp_kaikyo.4.d:0 "南海商人带来契书、礼拜、饮食法与航海知识。若只把他们视为暂住之客，日本将错失海峡世界；若纳入国法，港口就必须学会新的礼俗。"
 jxp_kaikyo.4.a:0 "使海教入港法。"
 jxp_kaikyo.6.t:0 "诸港归礼"
 jxp_kaikyo.6.d:0 "清真寺、港法署和船主会馆在诸港立稳。旧村社与新礼法仍有摩擦，但海路带来的秩序已经不再陌生。"
 jxp_kaikyo.6.a:0 "海门自此有新法。"
 jxp_kaikyo.7.t:0 "南海法学者"
 jxp_kaikyo.7.d:0 "来自海峡的法学者解释契约、继承、婚约与贸易誓词。奉行所发现，远方礼法并非混乱的异俗，而是一套可被翻译、审定和利用的秩序。"
 jxp_kaikyo.7.a:0 "请他们协助港务。"
 jxp_kaikyo.8.t:0 "马六甲商约"
 jxp_kaikyo.8.d:0 "马六甲诸商提议互保航路、承认契书，并在日本港口设立稳定的中介。潮声从南海带来新的盟约，也带来更复杂的世界。"
 jxp_kaikyo.8.a:0 "让商约越过海峡。"

 jxp_mission_kirishitan_settlement_title:0 "教化诸国"
 jxp_mission_kirishitan_settlement_desc:0 "受洗不能只停留在一二港町。若日轮与十字要共同支撑国家，诸国必须在国法内找到新的信仰位置。"
 jxp_mission_church_and_court_title:0 "教会与朝廷"
 jxp_mission_church_and_court_desc:0 "京都名分不可被外来权威吞没，教会也不应被地方私议撕裂。让二者在同一法度中互相承认。"
 jxp_mission_nagasaki_bishopric_title:0 "长崎主教座"
 jxp_mission_nagasaki_bishopric_desc:0 "长崎将成为日本教会与外洋世界之间最重要的门枢。钟声须由国法看守，银箱亦须由账册约束。"
 jxp_mission_roman_kyoto_embassy_title:0 "罗马京都使节"
 jxp_mission_roman_kyoto_embassy_desc:0 "万里之外的礼法不必削弱日本，反可成为日轮国家的新叙事。使节往来，将远方承认纳入京都礼仪。"
 jxp_mission_shimabara_healed_title:0 "岛原伤痕"
 jxp_mission_shimabara_healed_desc:0 "灾难留下的不只是尸骨，还有不信任。以誓约、赦免与登记收束地方伤口，让新信仰不再被旧怨拖回火中。"
 jxp_mission_oceanic_church_state_title:0 "海上教会国家"
 jxp_mission_oceanic_church_state_desc:0 "信仰、船队与武备已经一同面向外洋。日本不再只是接待传教士的岛屿，而是能派出自己使节与护航者的日轮国家。"

 jxp_mission_reformed_settlement_title:0 "信约诸国"
 jxp_mission_reformed_settlement_desc:0 "改革宗日本要以誓纸、讲坛与公议安置诸国。信仰若无章程，终将被港口风波吹散。"
 jxp_mission_consistory_registers_title:0 "长老会登记"
 jxp_mission_consistory_registers_desc:0 "地方教会、商馆、奉行所与城下町须在同一登记体系内彼此承认。文字有时比刀更能维持秩序。"
 jxp_mission_oranda_colleges_title:0 "兰学诸院"
 jxp_mission_oranda_colleges_desc:0 "从荷兰书籍中取医学、炮术、航海与算学，使外学不再只是奇谈，而成为可传授的国家技艺。"
 jxp_mission_batavia_compacts_title:0 "巴达维亚商约"
 jxp_mission_batavia_compacts_desc:0 "改革宗日轮若要立于海上，必须理解巴达维亚、平户与长崎之间的商约语言。契书也是海图。"
 jxp_mission_reformed_volley_title:0 "信约齐射"
 jxp_mission_reformed_volley_desc:0 "操典、军纪与铁炮一同塑造新的战阵。改革宗日本的军队要像书册一样清楚，像齐射一样冷静。"
 jxp_mission_covenant_commonwealth_title:0 "信约公国"
 jxp_mission_covenant_commonwealth_desc:0 "当诸港、诸藩与诸院皆能以誓约相连，日本便可用一种清醒而近世的秩序面对世界。"

 jxp_mission_kaikyo_settlement_title:0 "海教诸港"
 jxp_mission_kaikyo_settlement_desc:0 "海教路线始于港口，却不能止于港口。清真寺、船主会馆与奉行所必须把新礼法带入诸国秩序。"
 jxp_mission_qadi_courts_title:0 "卡迪法庭"
 jxp_mission_qadi_courts_desc:0 "贸易纠纷、婚约、继承与信仰事务需要可信赖的裁断。卡迪法庭让远人知道日本港法并非一时恩许。"
 jxp_mission_sakai_malay_brokers_title:0 "堺町马来通词"
 jxp_mission_sakai_malay_brokers_desc:0 "堺町通词读懂海峡契书，也读懂商人沉默中的顾虑。语言通，则航路通。"
 jxp_mission_hajj_registry_title:0 "朝觐名册"
 jxp_mission_hajj_registry_desc:0 "朝觐船队把日本带进更辽阔的信仰地图。名册记录的不只是人名，也是一条条可反复航行的海路。"
 jxp_mission_south_sea_compact_title:0 "南海商约"
 jxp_mission_south_sea_compact_desc:0 "马六甲、爪哇与琉球诸港有自己的秩序。日本若要成为其一员，就必须用契书而非传闻进入南海。"
 jxp_mission_sultanate_sea_law_title:0 "苏丹海法"
 jxp_mission_sultanate_sea_law_desc:0 "和之苏丹国以海门为朝堂，以港法为梁柱。日轮照临之处，船队、法庭与誓约共同维持太平。"
