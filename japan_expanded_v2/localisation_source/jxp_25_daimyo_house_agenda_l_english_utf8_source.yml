l_english:
 jxp_daimyo_agenda.1.t:0 "军法与家中众"
 jxp_daimyo_agenda.1.d:0 "家中诸将奉上新军役帐，请以主君朱印定其番役、知行与出阵次第。老臣说，兵农未分之世，名册若太硬，勇士便成役夫；年轻奉行则说，乱世之兵若无账册，胜利也不过是偶然。"
 jxp_daimyo_agenda.1.a:0 "以军役帐约束诸将。"
 jxp_daimyo_agenda.1.b:0 "让旗头以誓纸自统其众。"
 jxp_daimyo_agenda.2.t:0 "官途与家名"
 jxp_daimyo_agenda.2.d:0 "京都来信称，若奉上合宜的礼物与文书，本家可望重申旧职或求得新的官途。国人众对此颇有微词：京中一纸官符固然光彩，城下米仓与地侍誓约也同样要紧。"
 jxp_daimyo_agenda.2.a:0 "修书入京，重明家名。"
 jxp_daimyo_agenda.2.b:0 "先整城下，再谈京职。"
 jxp_daimyo_agenda.3.t:0 "浦役与商帆"
 jxp_daimyo_agenda.3.d:0 "浦方有船主请愿，愿以固定役银换取通航凭证；水军头领却提醒我们，海上获利越盛，越容易让私帆与异邦消息脱离掌握。潮声之中，财富与风险一并拍上岸来。"
 jxp_daimyo_agenda.3.a:0 "给商帆登记，令其纳役通航。"
 jxp_daimyo_agenda.3.b:0 "先编船籍，再许远航。"
 jxp_daimyo_agenda.4.t:0 "境目之地"
 jxp_daimyo_agenda.4.d:0 "境目山口的土豪、马商与寺社使者齐聚城下。他们愿为本家守路、通市、送信，却也要求保留旧例。边地之治从来不是单纯的军令，而是关隘、市场与人情的细密交织。"
 jxp_daimyo_agenda.4.a:0 "设番所，令境目先知军法。"
 jxp_daimyo_agenda.4.b:0 "开市口，令边人先知利害。"
 jxp_daimyo_agenda.5.t:0 "社寺与町座"
 jxp_daimyo_agenda.5.d:0 "社家、寺僧与町座年寄为座役、祭礼与仓敷之事争论不休。若顺其旧例，地方安宁而账册未必清楚；若尽入奉行检核，又恐伤及香火与市声。"
 jxp_daimyo_agenda.5.a:0 "确认旧例，借香火安人心。"
 jxp_daimyo_agenda.5.b:0 "重写账册，使町座归于法度。"
 jxp_25_warrior_muster_rolls:0 "家中军役帐"
 jxp_25_warrior_muster_rolls_desc:0 "家臣与国人众的军役、知行与番役被重列为可查之帐，出阵之声由纸上先起。"
 jxp_25_warrior_captain_oaths:0 "旗头誓纸"
 jxp_25_warrior_captain_oaths_desc:0 "各旗头以誓纸约束麾下，主君保留他们在战场上的机断与颜面。"
 jxp_25_court_rank_petitions:0 "入京官途文书"
 jxp_25_court_rank_petitions_desc:0 "献礼、奉书与旧谱被送往京都，本家名分因此更容易被诸国听见。"
 jxp_25_court_local_stewards:0 "城下代官整备"
 jxp_25_court_local_stewards_desc:0 "国中代官与城下奉行先行整备租税、夫役与仓敷，使京中名望有本国根基可依。"
 jxp_25_maritime_port_registers:0 "浦方通航凭证"
 jxp_25_maritime_port_registers_desc:0 "船主得以凭证通航纳役，港口的消息、货物与银钱随账册归入本家视野。"
 jxp_25_maritime_ship_rolls:0 "船籍水军帐"
 jxp_25_maritime_ship_rolls_desc:0 "水军、渔船与商帆被列入船籍，海上之利不再完全托付给潮汐与胆量。"
 jxp_25_frontier_pass_wardens:0 "境目番所"
 jxp_25_frontier_pass_wardens_desc:0 "山口、渡口与城砦设下番所，边地诸族在军法灯火下进出。"
 jxp_25_frontier_market_brokers:0 "境目市口取次"
 jxp_25_frontier_market_brokers_desc:0 "马商、猎户、寺社使者与土豪由取次众调停，边地市场成为本家伸向远方的手。"
 jxp_25_temple_market_privileges:0 "社寺旧例安堵"
 jxp_25_temple_market_privileges_desc:0 "社寺香火与町座旧例得以安堵，地方人心借熟悉的钟声与祭礼安定下来。"
 jxp_25_temple_market_account_books:0 "町座公账"
 jxp_25_temple_market_account_books_desc:0 "座役、仓敷与祭礼支出被重写为公账，市声仍在，只是多了奉行的墨迹。"
