l_english:
 jxp_japanese_reform_track_requirement_tt:0 "属于日本武家政体、日本文化共同体或已经确立的日本统一路线"
 jxp_japanese_overseas_reform_requirement_tt:0 "未奉行锁国，并已具备经营渡海垦殖与远洋商馆的国策"
 jxp_japanese_tier_ten_fallback_requirement_tt:0 "尚未确立路线专属的终局国制，仍可从日本公仪的通用结构中择一施行"

 jxp_reform_japanese_fudai_service_rolls:0 "谱代奉公帐"
 jxp_reform_japanese_fudai_service_rolls_desc:0 "将累世奉公的家臣、马回与旗本编入定期勘核的奉公帐，依知行高低明定出阵、宿卫和使番之役。"
 jxp_reform_japanese_direct_investiture:0 "当主直裁与知行改"
 jxp_reform_japanese_direct_investiture_desc:0 "重勘旧有知行并收回名实不副之地，使军役与年贡直接系于当主裁许，抑制国人借旧贯坐大。"

 jxp_reform_japanese_gundai_daikan_partition:0 "郡代·代官分治"
 jxp_reform_japanese_gundai_daikan_partition_desc:0 "以郡代统辖广域军政，以代官经办年贡、诉讼与村落事务，使远近诸郡各有可追责的奉公人。"
 jxp_reform_japanese_branch_castle_cadasters:0 "支城奉行与检地帐"
 jxp_reform_japanese_branch_castle_cadasters_desc:0 "在要冲支城设置奉行，并以检地帐核定田畠、屋敷与军役，使城砦网络同时成为领国行政的骨架。"

 jxp_reform_japanese_religious_arbitration:0 "宗门奉行与宗论裁许"
 jxp_reform_japanese_religious_arbitration_desc:0 "由奉行受理寺社、宗派与门徒之间的争论，确认本末次第和境内法度，以裁许代替无休止的宗论与私斗。"
 jxp_reform_japanese_temple_land_settlement:0 "寺社领处分与兵僧改制"
 jxp_reform_japanese_temple_land_settlement_desc:0 "重申寺社领的朱印边界，禁绝擅设关津与私聚兵众；愿守法度者仍受护持，抗拒者则收其土地与武备。"

 jxp_reform_japanese_ashigaru_muster_rolls:0 "足轻军役帐"
 jxp_reform_japanese_ashigaru_muster_rolls_desc:0 "按村乡、知行与城下町编制足轻军役帐，统一长枪、弓铁炮与兵粮负担，使临时征发逐渐成为可持续的常备军役。"
 jxp_reform_japanese_kyuba_hatamoto:0 "弓马故实与旗本备"
 jxp_reform_japanese_kyuba_hatamoto_desc:0 "以弓马故实整饬近侍武士的礼法、队列与临阵职责，并从家中精锐编成护卫当主、维系军心的旗本备。"
 jxp_reform_japanese_castle_artillery_office:0 "城割普请与国崩奉行"
 jxp_reform_japanese_castle_artillery_office_desc:0 "令普请奉行勘定石垣、堀切与破城之法，又设国崩奉行统筹大筒、火药和铸造，将攻守城术纳入同一军令。"
 jxp_reform_japanese_funade_ura_service:0 "船手众与浦役"
 jxp_reform_japanese_funade_ura_service_desc:0 "将沿海浦方、水主与船手众编入浦役，平时护送粮船、巡查港湾，战时则负责渡海、登陆和海上联络。"

 jxp_reform_japanese_lordly_arbitration:0 "当主直裁"
 jxp_reform_japanese_lordly_arbitration_desc:0 "大事由当主亲断，奉行只据法度陈述成案；这一体制决断迅速，却也要求当主承担家中成败的全部声望。"
 jxp_reform_japanese_elder_countersignature:0 "宿老连署与奏者番"
 jxp_reform_japanese_elder_countersignature_desc:0 "军国要务由宿老连署确认，奏者番负责传达命令、接待使者与核对回报，使重臣合议不致化为彼此推诿。"
 jxp_reform_japanese_domain_assembly:0 "国人·寺社·町众惣议"
 jxp_reform_japanese_domain_assembly_desc:0 "在赋役、用水、道路和城下法度等大事上召集国人、寺社与町众代表惣议，以公开起请换取各身分共同承担。"

 jxp_reform_japanese_court_temple_service:0 "寺社·公家出仕"
 jxp_reform_japanese_court_temple_service_desc:0 "延揽熟悉文书、礼仪和古典的社家、僧侣与公家出仕，使武家政务兼得朝仪、寺社网络与教化之助。"
 jxp_reform_japanese_yuhitsu_accountants:0 "右笔众与算用者登用"
 jxp_reform_japanese_yuhitsu_accountants_desc:0 "不拘门第选用善书算者，令右笔掌文案、算用者核钱粮；家中奉行由此能凭账目和成案办事。"
 jxp_reform_japanese_fudai_magistracy:0 "谱代奉行制"
 jxp_reform_japanese_fudai_magistracy_desc:0 "从久经考验的谱代家臣中任命奉行，以家门忠诚压低诸役掣肘；其代价是政务更依赖当主识人和近臣自律。"
 jxp_reform_japanese_public_authority:0 "公仪高于诸役"
 jxp_reform_japanese_public_authority_desc:0 "宣布军役、夫役、寺社役与町役皆受公仪法度节制，任何身分不得凭旧例拒绝共同承担领国之务。"

 jxp_reform_japanese_townsmen_guild_charters:0 "町众与座众特许"
 jxp_reform_japanese_townsmen_guild_charters_desc:0 "向有力町众和座众颁给营业、仓储与自治特许，以稳定商路和税源，并使城下町愿意为领国繁荣出资。"
 jxp_reform_japanese_checkpoint_red_seals:0 "关津直辖与朱印状"
 jxp_reform_japanese_checkpoint_red_seals_desc:0 "收回私设关津，统一由奉行核验朱印状和商船往来；商人少受层层盘剥，公仪则掌握货流与征税。"
 jxp_reform_japanese_rakuichi_rakuza:0 "乐市乐座"
 jxp_reform_japanese_rakuichi_rakuza_desc:0 "在受特许的城下町与门前町撤除部分座役和市场禁限，招徕商工定居。此令并非全国放任贸易，而是以个别市场营造领国中心。"
 jxp_reform_japanese_war_provisioning:0 "兵粮奉行与军役段钱"
 jxp_reform_japanese_war_provisioning_desc:0 "由兵粮奉行统筹米、盐、马匹与船车，并按土地和军役临时征收段钱，使长期出阵不再全靠沿途掠取。"
 jxp_reform_japanese_coinage_edicts:0 "撰钱令与金银改役"
 jxp_reform_japanese_coinage_edicts_desc:0 "以撰钱令约束恶钱拒收和任意折价，同时整顿金银山、吹屋与兑换之役，维持年贡折纳和市场信用。"
 jxp_reform_japanese_new_field_works:0 "新田检地与水利普请"
 jxp_reform_japanese_new_field_works_desc:0 "以检地确认新田收益，组织堤防、井堰与河道普请；受益村落分担工役，公仪则保障水利与耕作秩序。"
 jxp_reform_japanese_overseas_settlement_office:0 "渡海垦殖与商馆奉行"
 jxp_reform_japanese_overseas_settlement_office_desc:0 "为获准远航的船队设置商馆奉行，统筹移民、补给、贸易与当地交涉，使渡海据点不致沦为无人约束的私营巢穴。"

 jxp_reform_japanese_rule_by_arms:0 "以武威定天下"
 jxp_reform_japanese_rule_by_arms_desc:0 "天下离乱之际，法度若无武威便难以施行。公仪以迅速出兵和严明军令压服违命者，也须承受诸国对强势征伐的戒惧。"
 jxp_reform_japanese_general_peace:0 "天下惣无事之公仪"
 jxp_reform_japanese_general_peace_desc:0 "公仪连续颁下停战令、裁断书与禁止私战之命，将领主间争端纳入统一裁许；这是一套逐步形成的和平原则，而非一纸虚构的法典。"
 jxp_reform_japanese_service_compact:0 "旧贯安堵与御恩奉公"
 jxp_reform_japanese_service_compact_desc:0 "承认愿意奉公者的旧贯和所领，以安堵状换取军役、普请与朝觐。公仪由此把多样地域纳入可治理而不必尽数改易的秩序。"
 jxp_reform_japanese_quarrel_suppression:0 "喧哗停止与强制裁断"
 jxp_reform_japanese_quarrel_suppression_desc:0 "禁止家臣、村落和寺社以私斗解决争端，违者不问先后皆受处分；重大纠纷由公仪差遣使者强制裁断。"
 jxp_reform_japanese_common_security:0 "万民安堵与宗门宽宥"
 jxp_reform_japanese_common_security_desc:0 "只要遵守公仪法度并按额纳役，各宗门、町村与来住之民皆可获得安堵，使信仰差异不再自动成为征伐和骚乱的理由。"

 jxp_reform_japanese_unitary_investiture:0 "一圆知行与公仪直辖"
 jxp_reform_japanese_unitary_investiture_desc:0 "将分散权利收束为一圆知行，扩大直辖藏入地与奉行支配，使全国财赋和裁判逐渐归于同一公仪。"
 jxp_reform_japanese_domain_federation:0 "国郡代与诸藩分治"
 jxp_reform_japanese_domain_federation_desc:0 "中央掌握外交、军令与总法度，国郡代和诸藩则依地域旧贯治理民政；分治并非割据，而是受监督的层级秩序。"
 jxp_reform_japanese_benevolent_government:0 "万民安堵之政"
 jxp_reform_japanese_benevolent_government_desc:0 "以减轻滥役、赈济饥馑和保障诉讼为公仪正当性的根本，使统一后的国家不只凭战功，也凭百姓得所而长久。"
 jxp_reform_japanese_divine_law:0 "神国护持与王法佛法"
 jxp_reform_japanese_divine_law_desc:0 "公仪奉护朝廷与神宫，并调和王法、佛法和诸社本仪，以共同祭祀和宗教秩序阐明统一天下的天命。"

 jxp_reform_japanese_buke_laws_inspectors:0 "武家诸法度与监察使"
 jxp_reform_japanese_buke_laws_inspectors_desc:0 "以武家诸法度约束城郭、婚姻、军备和交往，派遣目付与巡见使核察诸家，使成熟公仪能够在乱事发生之前纠正违失。"
 jxp_reform_japanese_hyojosho_collegial_offices:0 "评定所与奉行连署"
 jxp_reform_japanese_hyojosho_collegial_offices_desc:0 "设评定所会审大案，寺社、町、勘定等奉行依分掌连署裁许；政务因职掌清楚而不再只系于一位权臣。"
 jxp_reform_japanese_petition_direct_appeal:0 "目安与直诉之制"
 jxp_reform_japanese_petition_direct_appeal_desc:0 "准许百姓和家臣递交目安，地方裁断失当时可越级直诉；公仪借此察知积弊，也以严格程式防止诬告扰政。"
