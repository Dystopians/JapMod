l_english:
 AMA_ideas:0 "尼子理念"
 AMA_ideas_start:0 "尼子传统"
 AMA_ideas_bonus:0 "尼子野心"
 jxp_ama_omi_genji:0 "近江源氏"
 jxp_ama_omi_genji_desc:0 "尼子家以源氏旧名为荣。谱系虽不能独守山城，却能在军议席上凝聚诸臣。"
 jxp_ama_izumo_shugo:0 "出云守护"
 jxp_ama_izumo_shugo_desc:0 "出云山川分隔，国人倚城自立。守护若要号令诸郡，必须先让兵役重新听命。"
 jxp_ama_gassan_toda_castle:0 "月山富田城"
 jxp_ama_gassan_toda_castle_desc:0 "坚城盘踞山间，溪谷与石垣相互护持。敌军入出云，先要仰望这座城。"
 jxp_ama_ten_brave_warriors:0 "尼子十勇士"
 jxp_ama_ten_brave_warriors_desc:0 "忠勇之名在家中传诵，成为败势中仍能振作军心的故事。"
 jxp_ama_coastal_trade:0 "山阴沿岸贸易"
 jxp_ama_coastal_trade_desc:0 "山阴港津将铁、米、木材与银货送入出云。海路让山国也听得见远方市声。"
 jxp_ama_kizuki_shrine:0 "杵筑大社"
 jxp_ama_kizuki_shrine_desc:0 "出云大社的古老祭礼为尼子治下添上神国名分。"
 jxp_ama_iwami_ginzan:0 "石见银山"
 jxp_ama_iwami_ginzan_desc:0 "石见山腹中的银脉足以供养兵甲、外交与城郭。银光使山阴不再偏远。"

 HSK_ideas:0 "细川理念"
 HSK_ideas_start:0 "细川传统"
 HSK_ideas_bonus:0 "细川野心"
 jxp_hsk_kanrei:0 "管领家"
 jxp_hsk_kanrei_desc:0 "细川之名久列幕府中枢。即使京都纷乱，旧职仍能给兵威披上制度外衣。"
 jxp_hsk_branches_and_retainers:0 "分家与重臣"
 jxp_hsk_branches_and_retainers_desc:0 "分枝、被官与国人众常相角力。若能调停其利害，庞大家中便可再次运转。"
 jxp_hsk_sakai_city:0 "堺町"
 jxp_hsk_sakai_city_desc:0 "堺商人熟知铜钱、火器、茶器与海外货。控制堺，便掌握畿内的银声。"
 jxp_hsk_eastern_army:0 "东军之主"
 jxp_hsk_eastern_army_desc:0 "应仁之乱的旧名仍在诸家记忆中回响。细川可凭此号召畿内武士。"
 jxp_hsk_ashigaru_contracts:0 "足轻雇约"
 jxp_hsk_ashigaru_contracts_desc:0 "町人与乡村供给兵源，契约与军法把散兵编为可用之阵。"
 jxp_hsk_yamabushi:0 "山伏行者"
 jxp_hsk_yamabushi_desc:0 "山伏往来寺社、山路与城下。其行踪难测，消息也随脚步流动。"
 jxp_hsk_horeki_reform:0 "宝历改革"
 jxp_hsk_horeki_reform_desc:0 "账册、町政与家中诸役被重新检点。旧家若要延续，也须学会整顿。"

 SHN_ideas:0 "少贰理念"
 SHN_ideas_start:0 "少贰传统"
 SHN_ideas_bonus:0 "少贰野心"
 jxp_shn_dazaifu_office:0 "大宰少贰"
 jxp_shn_dazaifu_office_desc:0 "大宰府旧职使少贰家在九州北门仍有名分。官名虽古，仍能被用来召集诸豪。"
 jxp_shn_defender_against_mongols:0 "抗元旧功"
 jxp_shn_defender_against_mongols_desc:0 "蒙古袭来之记忆留在博多湾风声里。守土之名让家中武士不忘海防。"
 jxp_shn_tsushima_diplomacy:0 "对马通交"
 jxp_shn_tsushima_diplomacy_desc:0 "对马航路连接朝鲜与九州。书状、礼物与商船往返其间。"
 jxp_shn_nagasaki_city:0 "长崎町"
 jxp_shn_nagasaki_city_desc:0 "长崎港逐渐汇聚商人、译者与异国货物，成为九州面向远海的窗口。"
 jxp_shn_bear_of_hizen:0 "肥前之熊"
 jxp_shn_bear_of_hizen_desc:0 "猛将之名足以压住迟疑。肥前武士在冲锋中更愿相信主君的胆气。"
 jxp_shn_hagakure:0 "叶隐之风"
 jxp_shn_hagakure_desc:0 "忠义并不总写在法令中，有时藏在家臣日常的沉默与决断里。"
 jxp_shn_nabeshima_reform:0 "锅岛仕置"
 jxp_shn_nabeshima_reform_desc:0 "新兴重臣重整军政与财政，使肥前旧家在变局中仍能学习新法。"

 OGS_ideas:0 "小笠原理念"
 OGS_ideas_start:0 "小笠原传统"
 OGS_ideas_bonus:0 "小笠原野心"
 jxp_ogs_shinano_shugo:0 "信浓守护"
 jxp_ogs_shinano_shugo_desc:0 "信浓山谷众多，城寨相望。守护之权必须沿山路一城一城地重建。"
 jxp_ogs_suwa_taisha:0 "诹访大社"
 jxp_ogs_suwa_taisha_desc:0 "诹访之神护持山国武士，祭礼、弓马与古社记忆使小笠原家名不易随战火磨灭。"
 jxp_ogs_kiso_uma:0 "木曾马"
 jxp_ogs_kiso_uma_desc:0 "山地牧场养出坚忍马匹。它们不以壮丽闻名，却适合信浓的坡道与雪泥。"
 jxp_ogs_ten_kori:0 "十郡一统"
 jxp_ogs_ten_kori_desc:0 "信浓诸郡若能暂息内斗，山路、关所与郡中账册便能合为一套可治理的山国秩序。"
 jxp_ogs_ogasawara_ryu:0 "小笠原流"
 jxp_ogs_ogasawara_ryu_desc:0 "弓马礼法不只是技艺，也是一套教武士如何举止、列阵与服从的规矩。"
 jxp_ogs_nakasendo:0 "中山道整备"
 jxp_ogs_nakasendo_desc:0 "山路、宿驿与关所被修整后，信浓不再只是阻隔，也成为通路。"
 jxp_ogs_zenkoji:0 "善光寺"
 jxp_ogs_zenkoji_desc:0 "善光寺香火跨越国境而来，使山中之国也能迎接四方信众。"

 KTB_ideas:0 "北畠理念"
 KTB_ideas_start:0 "北畠传统"
 KTB_ideas_bonus:0 "北畠野心"
 jxp_ktb_ise_unification:0 "伊势一统"
 jxp_ktb_ise_unification_desc:0 "伊势的田畠、港津与神领需要同一套法度。北畠若能整合诸郡，便可稳住畿内东门。"
 jxp_ktb_amaterasu_blessing:0 "天照大神之佑"
 jxp_ktb_amaterasu_blessing_desc:0 "伊势神宫近在治下，神国名分因此格外厚重。"
 jxp_ktb_southern_court:0 "南朝余绪"
 jxp_ktb_southern_court_desc:0 "南朝旧臣的记忆仍被珍藏在文书、祭仪与家谱之间。它使北畠之名带有不寻常的朝廷色彩。"
 jxp_ktb_kuki_suigun:0 "九鬼水军"
 jxp_ktb_kuki_suigun_desc:0 "志摩水手熟知湾口、潮汐与岛影。九鬼之船能护送，也能突袭；海上家名由船手一代代撑起。"
 jxp_ktb_men_of_quality:0 "清华之士"
 jxp_ktb_men_of_quality_desc:0 "武家若要与公卿旧仪相接，便需要懂礼法、懂文书的家臣。"
 jxp_ktb_iga_ryu:0 "伊贺流"
 jxp_ktb_iga_ryu_desc:0 "伊贺山中众往来无声。侦察、潜入与传信皆可成为战国之术。"
 jxp_ktb_akitae_march:0 "显能进军"
 jxp_ktb_akitae_march_desc:0 "北畠显能旧事提醒家中：名分若要保全，也必须能迅速出兵。"

 AKT_ideas:0 "秋田理念"
 AKT_ideas_start:0 "秋田传统"
 AKT_ideas_bonus:0 "秋田野心"
 jxp_akt_march_of_akita:0 "秋田边备"
 jxp_akt_march_of_akita_desc:0 "北地严寒与崎岖道路磨练军心。敌军深入秋田时，先要与山雪争斗。"
 jxp_akt_hokkaido_foothold:0 "虾夷地据点"
 jxp_akt_hokkaido_foothold_desc:0 "北方海岸的交易据点把毛皮、鱼货与远方消息送回本家，也让秋田家学会依靠通译、水手与潮路。"
 jxp_akt_clan_unification:0 "秋田诸族一统"
 jxp_akt_clan_unification_desc:0 "边地豪族若各据山川，便只能自保。统一之后，北奥也可聚成军势。"
 jxp_akt_trade_posts:0 "北贸场所"
 jxp_akt_trade_posts_desc:0 "商站、港津与译者维系着本州北端的细长贸易。"
 jxp_akt_ainu_campaigns:0 "阿伊努交涉与征讨"
 jxp_akt_ainu_campaigns_desc:0 "北方关系既有互市，也有兵威。能在交易、通婚、盟誓与征讨之间取舍者，方能守住边境。"
 jxp_akt_oshu_shogun:0 "奥州真将军"
 jxp_akt_oshu_shogun_desc:0 "北奥诸家竞逐名号。秋田若能胜出，便可自称奥羽武威之主。"
 jxp_akt_adoption_system:0 "养子相续"
 jxp_akt_adoption_system_desc:0 "以养子续家，可使血脉、盟约与政治需要在同一屋檐下相安。"

 CBA_ideas:0 "千叶理念"
 CBA_ideas_start:0 "千叶传统"
 CBA_ideas_bonus:0 "千叶野心"
 jxp_cba_taira_lineage:0 "平氏流胄"
 jxp_cba_taira_lineage_desc:0 "千叶家以平氏旧名为凭，借古老谱系稳固关东声望。"
 jxp_cba_masakado_dream:0 "将门之梦"
 jxp_cba_masakado_dream_desc:0 "平将门的传说在坂东仍有火色。它提醒关东武士，东国自有雄心。"
 jxp_cba_kamakura_kubo:0 "镰仓公方之盟"
 jxp_cba_kamakura_kubo_desc:0 "与镰仓公方相合，可使千叶在关东纷争中取得可用名分。"
 jxp_cba_sakura_kadan:0 "佐仓歌坛"
 jxp_cba_sakura_kadan_desc:0 "和歌与文会让武家之间多了一条不必拔刀的道路。"
 jxp_cba_katori_jingu:0 "香取神宫"
 jxp_cba_katori_jingu_desc:0 "香取神宫护佑武艺。其名足以让下总武士相信刀枪有神明见证。"
 jxp_cba_southern_kanto_irrigation:0 "南关东水利"
 jxp_cba_southern_kanto_irrigation_desc:0 "低地与河川被疏浚后，稻田、军粮与城下町才能稳定增长。"
 jxp_cba_naval_reform:0 "坂东水军改革"
 jxp_cba_naval_reform_desc:0 "江户湾与太平洋岸的船手被重新编组，关东之国也可向海上伸手。"

 ISK_ideas:0 "一色理念"
 ISK_ideas_start:0 "一色传统"
 ISK_ideas_bonus:0 "一色野心"
 jxp_isk_tango_shugo:0 "丹后守护"
 jxp_isk_tango_shugo_desc:0 "丹后海岸虽窄，却有港津与山城相互倚托。守护权威必须同时面向海与山。"
 jxp_isk_samurai_dokoro:0 "侍所之臣"
 jxp_isk_samurai_dokoro_desc:0 "一色家曾列幕府武门要职，因而熟悉裁断争端与约束武士的旧法。"
 jxp_isk_amanohashidate:0 "天桥立"
 jxp_isk_amanohashidate_desc:0 "海上松桥引来旅人、僧侣与歌人，也让丹后之名进入天下名胜。"
 jxp_isk_reclaim_old_territories:0 "旧领回收"
 jxp_isk_reclaim_old_territories_desc:0 "失地若有文书与记忆为凭，便可在合适时机重新成为军议议题。"
 jxp_isk_inadome_gunnery:0 "稻富炮术"
 jxp_isk_inadome_gunnery_desc:0 "铁炮术被家传化、规程化，枪声从奇技变为可训练的战法。"
 jxp_isk_road_wardens:0 "丹后路奉行"
 jxp_isk_road_wardens_desc:0 "山路与港道需要同样严密的巡察。道路通畅，军势与商货才能迅速转移。"
 jxp_isk_port_development:0 "宫津港普请"
 jxp_isk_port_development_desc:0 "仓库、泊地与町屋沿港湾展开，使丹后小国也能聚积海利。"

 ITO_ideas:0 "伊东理念"
 ITO_ideas_start:0 "伊东传统"
 ITO_ideas_bonus:0 "伊东野心"
 jxp_ito_gokenin_family:0 "御家人之门"
 jxp_ito_gokenin_family_desc:0 "伊东家以镰仓以来的御家人传统自居，旧名分仍可约束日向国人。"
 jxp_ito_tsuchimochi_alliance:0 "土持盟约"
 jxp_ito_tsuchimochi_alliance_desc:0 "与地方豪族订盟，比一味征讨更能长久安定山河。"
 jxp_ito_gods_landing:0 "神降之地"
 jxp_ito_gods_landing_desc:0 "日向神话为土地添上古老光辉，也使征服披上守护神土的外衣。"
 jxp_ito_anti_shugo:0 "反守护运动"
 jxp_ito_anti_shugo_desc:0 "当旧守护失其人望，地方武家便能以整顿之名夺取实权。"
 jxp_ito_forty_eight_forts:0 "四十八城网"
 jxp_ito_forty_eight_forts_desc:0 "山城、支城与寨砦交错成网。敌人进入日向，便会被层层拖慢。"
 jxp_ito_christian_sympathy:0 "宽待吉利支丹"
 jxp_ito_christian_sympathy_desc:0 "外来信仰与商路一同抵达九州。谨慎宽待，或能换来新的联系。"
 jxp_ito_forest_development:0 "日向林政"
 jxp_ito_forest_development_desc:0 "山林供给木材、薪炭与船料。良好林政足以养活城下与港津。"

 KNO_ideas:0 "河野理念"
 KNO_ideas_start:0 "河野传统"
 KNO_ideas_bonus:0 "河野野心"
 jxp_kno_iyo_shugo:0 "伊予守护"
 jxp_kno_iyo_shugo_desc:0 "伊予海岸线漫长，岛屿与港湾众多。守护权威必须由船桨、潮候与听命的水手支撑。"
 jxp_kno_cadet_branches:0 "分家整合"
 jxp_kno_cadet_branches_desc:0 "诸分家各掌岛浦，若能合为一体，船籍、军役与港务便可从同一本账册发令。"
 jxp_kno_oyamazumi_shrine:0 "大山祇神社"
 jxp_kno_oyamazumi_shrine_desc:0 "海武士向大山祇献甲祈胜，刀剑与船旗都在神前获得名分。"
 jxp_kno_yuzuki_castle:0 "汤筑城"
 jxp_kno_yuzuki_castle_desc:0 "汤筑城控制伊予腹地，使河野家不只依靠海上诸岛。"
 jxp_kno_inland_sea:0 "濑户内之主"
 jxp_kno_inland_sea_desc:0 "狭海、潮流与岛影构成天然战场。熟悉者可以少胜多。"
 jxp_kno_asian_trade:0 "大陆通商"
 jxp_kno_asian_trade_desc:0 "濑户内商船可继续西行，带回朝鲜、中国与南海的货物传闻。"
 jxp_kno_murakami_suigun:0 "村上水军"
 jxp_kno_murakami_suigun_desc:0 "村上船手既能护航，也能私掠。海上秩序往往由最熟悉海的人书写。"

 TTI_ideas:0 "筒井理念"
 TTI_ideas_start:0 "筒井传统"
 TTI_ideas_bonus:0 "筒井野心"
 jxp_tti_warrior_monk:0 "僧兵之国"
 jxp_tti_warrior_monk_desc:0 "大和寺社与武家交错，僧兵熟知山门、城砦与乡村道路。"
 jxp_tti_eikyo_victor:0 "永享乱之胜者"
 jxp_tti_eikyo_victor_desc:0 "内乱中幸存的家名更懂得忍耐。胜利不是终点，而是恢复国中的契机。"
 jxp_tti_kasuga_shrine:0 "春日大社"
 jxp_tti_kasuga_shrine_desc:0 "春日社的祭礼与威仪使大和武家时刻记得寺社势力的目光。"
 jxp_tti_mountainous_province:0 "大和山国"
 jxp_tti_mountainous_province_desc:0 "山间道路狭窄，城寨相连。进攻者在抵达奈良前便已疲惫。"
 jxp_tti_nara_city:0 "奈良町"
 jxp_tti_nara_city_desc:0 "奈良不只是旧都，也是寺社、町人和武士交会的复杂都市。"
 jxp_tti_wise_opportunist:0 "审时之智"
 jxp_tti_wise_opportunist_desc:0 "在强邻之间生存，需要知道何时结盟、何时退让、何时忽然出兵。"
 jxp_tti_kofukuji_temple:0 "兴福寺"
 jxp_tti_kofukuji_temple_desc:0 "兴福寺的学问、僧众与庄园网络仍能影响大和政局。"

 RFR_ideas:0 "南部理念"
 RFR_ideas_start:0 "南部传统"
 RFR_ideas_bonus:0 "南部野心"
 jxp_rfr_genji_in_the_north:0 "北方源氏"
 jxp_rfr_genji_in_the_north_desc:0 "南部家在奥羽北端守着源氏旧名。寒地边疆也有可传的武家谱系。"
 jxp_rfr_nine_gates:0 "九户之主"
 jxp_rfr_nine_gates_desc:0 "九户诸族与马产地支撑北奥骑兵。若能约束其豪强，便能化边地为锋刃。"
 jxp_rfr_kyoto_connection:0 "京都往来"
 jxp_rfr_kyoto_connection_desc:0 "远在北奥，仍须与京都保持书状与礼物往来，方能让家名进入天下耳目。"
 jxp_rfr_rebellious_vassals:0 "平定叛臣"
 jxp_rfr_rebellious_vassals_desc:0 "边地分族一旦坐大，便会威胁本家。镇抚与裁断必须同样迅速。"
 jxp_rfr_morioka_castle:0 "盛冈城"
 jxp_rfr_morioka_castle_desc:0 "新城与城下町使北奥政务有了固定中心，也使税粮不再四散。"
 jxp_rfr_chusonji_temple:0 "中尊寺"
 jxp_rfr_chusonji_temple_desc:0 "奥州藤原的金色余光仍照在北方寺院。它让边疆武家也有古老文化可依。"
 jxp_rfr_famine_relief:0 "饥馑赈济"
 jxp_rfr_famine_relief_desc:0 "北地歉收尤其残酷。仓廪、驿路与移垦文书若能预先安排，寒年也不至于把人心一并冻裂。"
