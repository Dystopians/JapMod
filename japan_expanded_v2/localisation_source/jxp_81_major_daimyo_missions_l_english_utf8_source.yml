l_english:
 jxp_mission_ask_genji_headship_title:0 "源氏栋梁"
 jxp_mission_ask_genji_headship_desc:0 "足利家以清和源氏栋梁自居。谱牒、官位与御教书必须重新成为诸国武家的共同语言。"
 jxp_mission_ask_hokoshu_rolls_title:0 "整编奉公众"
 jxp_mission_ask_hokoshu_rolls_desc:0 "直属将军的奉公众若只存于旧册，幕府便只剩空名。重新核定其知行与军役，方能在京中立足。"
 jxp_mission_ask_higashiyama_court_title:0 "东山殿余晖"
 jxp_mission_ask_higashiyama_court_desc:0 "连歌、茶汤、庭园与唐物并非无用奢华。文化威望能把离散公家、寺社与守护再次聚到花之御所。"
 jxp_mission_ask_tosen_bugyo_title:0 "唐船奉行"
 jxp_mission_ask_tosen_bugyo_desc:0 "渡海船、勘合与港税须由可信的奉行统摄。海贸所得可为衰微的幕府重新筹措奉公之资。"
 jxp_mission_ask_shugo_order_title:0 "重申守护秩序"
 jxp_mission_ask_shugo_order_desc:0 "守护并非各自为政的国主，而应是幕府在诸国的手足。以旧职约束新势力，方可使名分赶上现实。"
 jxp_mission_ask_realm_mediation_title:0 "调停诸国"
 jxp_mission_ask_realm_mediation_desc:0 "一纸停战令未必胜过铁炮，却能让敌对诸家在御前承认共同裁判。幕府的力量正在于使战争也有名义。"
 jxp_mission_ask_restore_bakufu_service_title:0 "再兴幕府奉公"
 jxp_mission_ask_restore_bakufu_service_desc:0 "奉行、评定与近习被纳入稳定官署，不再只依赖将军个人恩宠。旧幕府由此获得新的筋骨。"
 jxp_mission_ask_tenka_kubo_title:0 "天下公方"
 jxp_mission_ask_tenka_kubo_desc:0 "当诸国再次以公方之命为天下尺度，京都便不只是被争夺的城池，而成为武家秩序的中枢。"
 jxp_81_ask_legacy:0 "公方奉公体制"
 jxp_81_ask_legacy_desc:0 "奉公众、奉行人和守护家门再次围绕将军权威运转，使足利家得以用名分调停刀兵。"
 jxp_mission_csk_ichiryo_gusoku_title:0 "一领具足"
 jxp_mission_csk_ichiryo_gusoku_desc:0 "土佐乡士披一领具足便可离田赴阵。若将这种迅捷军役写入名册，贫瘠之国也能聚起可畏兵势。"
 jxp_mission_csk_tosa_seven_clans_title:0 "调伏土佐七雄"
 jxp_mission_csk_tosa_seven_clans_desc:0 "本山、安芸与津野等旧族各据山川。以盟约、婚姻和战阵逐一收束，长宗我部方能号令全土佐。"
 jxp_mission_csk_okoh_castle_law_title:0 "冈丰城法"
 jxp_mission_csk_okoh_castle_law_desc:0 "山城道路、兵粮仓与家臣屋敷围绕冈丰整饬，临时军势由此转为可以持久经营的家中。"
 jxp_mission_csk_shikoku_crossings_title:0 "四国渡海"
 jxp_mission_csk_shikoku_crossings_desc:0 "吉野川与濑户内诸渡口决定四国征伐的节奏。掌握舟梁，山地便不再阻隔军令。"
 jxp_mission_csk_hundred_article_code_title:0 "百箇条掟书"
 jxp_mission_csk_hundred_article_code_desc:0 "从喧哗口论到军役赋课，家法必须能落到村里与阵中。法度使一领具足不致沦为无纪之众。"
 jxp_mission_csk_urahado_fleet_title:0 "浦户水军"
 jxp_mission_csk_urahado_fleet_desc:0 "浦户与土佐湾的船手为陆军打开外海。海陆相济，四国诸城便难以彼此声援。"
 jxp_mission_csk_shikoku_board_title:0 "四国之棋"
 jxp_mission_csk_shikoku_board_desc:0 "阿波、赞岐、伊予和土佐如同一局棋。与其逐城纠缠，不如先断粮道、渡口与诸家盟约。"
 jxp_mission_csk_tosa_unified_title:0 "土佐一统"
 jxp_mission_csk_tosa_unified_desc:0 "从田畴中起身的军役制度如今足以统辖一国乃至四国。土佐之旗不再是边陲小邦的旗号。"
 jxp_81_csk_legacy:0 "一领具足军役"
 jxp_81_csk_legacy_desc:0 "农兵、地侍与浦户船手按土佐家法编为一体，平时耕作，战时随旗而出。"
 jxp_mission_dte_oshu_tandai_title:0 "奥州探题之名"
 jxp_mission_dte_oshu_tandai_desc:0 "伊达家旧有奥州探题的名分。将古老官职与现实兵权结合，才能令北方诸家信服。"
 jxp_mission_dte_marriage_web_title:0 "伊达婚姻网"
 jxp_mission_dte_marriage_web_desc:0 "女婿、外甥和养子遍布奥羽。婚书有时比军令更快打开城门，也可能把纷争引入家中。"
 jxp_mission_dte_black_armor_corps_title:0 "黑具足先阵"
 jxp_mission_dte_black_armor_corps_desc:0 "整齐甲胄与火器队列塑造新的伊达军容。军势既要迅猛，也要让敌人在交锋前先知畏惧。"
 jxp_mission_dte_yonezawa_sendai_title:0 "米泽与仙台"
 jxp_mission_dte_yonezawa_sendai_desc:0 "山间旧领与海滨新府各有所长。道路、町割和河运将奥州腹地接入更广阔的商路。"
 jxp_mission_dte_red_seal_ships_title:0 "北国朱印船"
 jxp_mission_dte_red_seal_ships_desc:0 "奥州亦可面向太平洋。为商船颁朱印、整修港泊，北方物产便能越过关东而达远海。"
 jxp_mission_dte_keicho_embassy_title:0 "庆长遣欧"
 jxp_mission_dte_keicho_embassy_desc:0 "遣使横渡万里波涛，不只为奇观。使节带回的航海、铸炮与外交知识足以改变北国眼界。"
 jxp_mission_dte_one_eyed_dragon_title:0 "独眼龙之旗"
 jxp_mission_dte_one_eyed_dragon_desc:0 "险峻奥羽不容软弱之主。谋略、威仪与果断被编入家法，令诸将知道伊达军令不可轻侮。"
 jxp_mission_dte_lord_of_oshu_title:0 "奥州之主"
 jxp_mission_dte_lord_of_oshu_desc:0 "当山道、海港与诸家盟书皆归一手，奥州便不再是天下边缘，而是足以参与天下之争的一极。"
 jxp_81_dte_legacy:0 "奥州伊达仕置"
 jxp_81_dte_legacy_desc:0 "婚姻、城下经营与远洋使节共同服务于奥州霸权，使北国不再远离天下与海洋。"
 jxp_mission_hjo_odawara_council_title:0 "小田原评定"
 jxp_mission_hjo_odawara_council_desc:0 "后北条家以小田原为政务中枢。诉讼、军役与年贡由评定裁断，扩张才不致使家中失序。"
 jxp_mission_hjo_night_battle_title:0 "夜战之胜"
 jxp_mission_hjo_night_battle_desc:0 "河越夜战的记忆提醒诸将，机动与情报可胜过数量。夜色不应只是危险，也可成为兵法。"
 jxp_mission_hjo_soji_code_title:0 "早云寺殿廿一箇条"
 jxp_mission_hjo_soji_code_desc:0 "节俭、忠勤与慎言被写成家中日用之法。能约束近臣的小法度，往往比空泛大令更有力量。"
 jxp_mission_hjo_kanto_castle_ring_title:0 "关东支城网"
 jxp_mission_hjo_kanto_castle_ring_desc:0 "玉绳、八王子与诸支城互为犄角。道路、烽火和兵粮使敌军难以直抵小田原。"
 jxp_mission_hjo_kamakura_legacy_title:0 "镰仓旧绪"
 jxp_mission_hjo_kamakura_legacy_desc:0 "关东武家仍记得镰仓公方与执权旧名。后北条必须把新兴实力包装为关东秩序的继承。"
 jxp_mission_hjo_five_colored_corps_title:0 "五色备"
 jxp_mission_hjo_five_colored_corps_desc:0 "以颜色区分军阵与职责，使大军在尘土和号角中仍能辨认命令。军制由此超越临时集结。"
 jxp_mission_hjo_hakone_lock_title:0 "箱根锁钥"
 jxp_mission_hjo_hakone_lock_desc:0 "箱根山路是关东门户。关所、宿驿与山城若能协同，东海道上的每一次进退都将受我节制。"
 jxp_mission_hjo_lord_of_kanto_title:0 "关八州之主"
 jxp_mission_hjo_lord_of_kanto_desc:0 "支城与法度已经覆盖关东平野。后北条不再只是小田原之主，而要以关八州为一个领国来治理。"
 jxp_81_hjo_legacy:0 "小田原领国制"
 jxp_81_hjo_legacy_desc:0 "支城、评定与分国法贯通关八州，使后北条的扩张拥有远胜寻常战国大名的行政骨架。"
 jxp_mission_img_suruga_residence_title:0 "骏河今川馆"
 jxp_mission_img_suruga_residence_desc:0 "骏府的馆舍、寺院与市町汇聚东海道人流。今川家必须令此处既像武家政厅，也像一座小京都。"
 jxp_mission_img_kana_catalogue_title:0 "今川假名目录"
 jxp_mission_img_kana_catalogue_desc:0 "诉讼、土地与军役不可只凭旧例口传。寿桂尼增补法条之后，领民与家臣都应知何事可为、何事必禁。"
 jxp_mission_img_triple_alliance_title:0 "甲相骏三国同盟"
 jxp_mission_img_triple_alliance_desc:0 "与武田、北条的婚盟可以暂时锁住背后；若两家已经消亡，也须以相邻日本诸侯织成同等坚实的东方均势。"
 jxp_mission_img_tokaido_markets_title:0 "东海道诸国评定"
 jxp_mission_img_tokaido_markets_desc:0 "骏河、远江与三河的奉行、宿场和盟约必须进入同一评定。海道秩序不是一条商路，而是一套跨国治理。"
 jxp_mission_img_fuji_sengen_title:0 "松平家安堵"
 jxp_mission_img_fuji_sengen_desc:0 "三河松平既可成为东海道前锋，也可能倒向尾张。以安堵、婚姻与人质重写双方关系。"
 jxp_mission_img_firearm_retinue_title:0 "东海道人质网络"
 jxp_mission_img_firearm_retinue_desc:0 "人质并非只为威吓；妥善教育、婚配与归还，能把海道诸家的继承人变成今川秩序的共同语言。"
 jxp_mission_img_road_to_kyoto_title:0 "奉公上洛"
 jxp_mission_img_road_to_kyoto_desc:0 "上洛不是一次豪赌，而是道路、兵粮、朝廷礼仪与后方治理的总和。今川军应以奉公与秩序之名西进。"
 jxp_mission_img_command_kinai_title:0 "桶狭间之日"
 jxp_mission_img_command_kinai_desc:0 "狭窄谷地与骤雨足以颠倒大军胜负。无论大捷、撤退还是转向东海道联盟，今川家都必须为这一天留下制度答案。"
 jxp_81_img_legacy:0 "东海道今川秩序"
 jxp_81_img_legacy_desc:0 "分国法、海道商路与公家礼仪相互支撑，使骏河政权得以把上洛野心建立在稳固领国之上。"
 jxp_mission_mri_aki_kokujin_league_title:0 "安艺国人盟誓"
 jxp_mission_mri_aki_kokujin_league_desc:0 "安艺山谷间的国人众各守旧盟。毛利家若能以起请文约束诸家，便可把松散同盟化为持久军役。"
 jxp_mission_mri_koriyama_defense_title:0 "吉田郡山守城"
 jxp_mission_mri_koriyama_defense_desc:0 "郡山城并非巨郭，却能借山势、村落与援军消磨强敌。守城之胜应被整理成西国山城的共同法度。"
 jxp_mission_mri_itsukushima_stratagem_title:0 "严岛奇谋"
 jxp_mission_mri_itsukushima_stratagem_desc:0 "潮汐、风雨与狭窄岛岸可以把众寡之势颠倒。熟悉濑户内者，能把海水本身纳入军议。"
 jxp_mission_mri_three_arrows_title:0 "三矢之训"
 jxp_mission_mri_three_arrows_desc:0 "一矢易折，三矢难摧。将兄弟团结的训诫扩为家臣与国人众的共同誓约，西国霸业方能长久。"
 jxp_mission_mri_iwami_silver_title:0 "石见银山"
 jxp_mission_mri_iwami_silver_desc:0 "银山的坑道、吹屋与运上账足以供养军船和使节。矿利必须进入公账，不能任由山师与豪族瓜分。"
 jxp_mission_mri_murakami_fleets_title:0 "村上水军"
 jxp_mission_mri_murakami_fleets_desc:0 "能岛、因岛与来岛船手熟悉每一道潮门。以朱印和船役收束水军，濑户内便成为毛利的内海。"
 jxp_mission_mri_chugoku_governance_title:0 "中国经营"
 jxp_mission_mri_chugoku_governance_desc:0 "山阳商路与山阴山道需要不同治理。毛利奉行必须让银、米、兵与书信越过中国山地而不断绝。"
 jxp_mission_mri_lord_of_saigoku_title:0 "西国之主"
 jxp_mission_mri_lord_of_saigoku_desc:0 "当国人盟誓、严岛潮路与石见银脉同归一制，毛利旗帜便足以代表整个西国参与天下之争。"
 jxp_81_mri_legacy:0 "三矢与濑户内军制"
 jxp_81_mri_legacy_desc:0 "国人盟誓、银山财赋和村上水军被编入同一西国体制，山城与海路由此互相支援。"
 jxp_mission_otm_bungo_funai_title:0 "丰后府内"
 jxp_mission_otm_bungo_funai_desc:0 "府内的馆、港与寺社构成大友统治核心。先整饬本领，方能让海外财富真正服务于领国。"
 jxp_mission_otm_kyushu_tandai_title:0 "九州探题遗绪"
 jxp_mission_otm_kyushu_tandai_desc:0 "大友家以守护与探题名分介入九州诸国。古老官职须由现实军力和调停能力重新支撑。"
 jxp_mission_otm_nanban_factory_title:0 "南蛮商馆"
 jxp_mission_otm_nanban_factory_desc:0 "葡萄牙商船带来丝绸、硝石与陌生信仰。商馆需要法度，使贸易不致变成港町争端。"
 jxp_mission_otm_kunikuzushi_foundry_title:0 "国崩铸炮"
 jxp_mission_otm_kunikuzushi_foundry_desc:0 "大筒之威可摧城门，却需铜铁、火药与工匠长期供给。将铸炮纳入奉行体系，才能使奇器成为军制。"
 jxp_mission_otm_kirishitan_lords_title:0 "吉利支丹大名"
 jxp_mission_otm_kirishitan_lords_desc:0 "新的信仰既能联络海外，也会触动寺社与家臣。国家必须决定保护、限制或调和其传播。"
 jxp_mission_otm_tensho_embassy_title:0 "天正遣欧"
 jxp_mission_otm_tensho_embassy_desc:0 "少年使节越海而去，向遥远宫廷展示日本诸侯之名。归国者也将带回世界远比九州辽阔的证据。"
 jxp_mission_otm_northern_kyushu_title:0 "九州北镇"
 jxp_mission_otm_northern_kyushu_desc:0 "筑前、肥前与丰前是港口、寺社和强族交错之地。大友必须用军政并举的方式守住北九州。"
 jxp_mission_otm_kingdom_of_bungo_title:0 "丰后王国"
 jxp_mission_otm_kingdom_of_bungo_desc:0 "当府内、商馆、铸炮场和九州诸将皆听同一号令，丰后便能以海上王国之姿面向天下。"
 jxp_81_otm_legacy:0 "丰后南蛮政厅"
 jxp_81_otm_legacy_desc:0 "府内奉行、海外商馆与火器工匠在审慎保护下共存，使丰后成为九州最开放而有力的门户。"
 jxp_mission_ouc_western_kyoto_title:0 "西京山口"
 jxp_mission_ouc_western_kyoto_desc:0 "公家、僧侣与工匠在山口营造西国京都。保护他们，文化威望便能转化为大内统治的正当性。"
 jxp_mission_ouc_hakata_tally_trade_title:0 "博多与勘合"
 jxp_mission_ouc_hakata_tally_trade_desc:0 "博多商人熟悉明、朝鲜与琉球航路。勘合、仓库和市舶之税须被纳入一套可信账册。"
 jxp_mission_ouc_missions_to_ming_title:0 "遣明船"
 jxp_mission_ouc_missions_to_ming_desc:0 "渡海使团既是贸易，也是外交仪礼。船队的名分、货单与护卫必须在出港前便无可争议。"
 jxp_mission_ouc_anti_wokou_fleet_title:0 "靖海水军"
 jxp_mission_ouc_anti_wokou_fleet_desc:0 "海商与倭寇常只隔一纸许可。以护航和缉私区分合法船队，才能维持海外信任。"
 jxp_mission_ouc_ouchi_culture_title:0 "大内文化"
 jxp_mission_ouc_ouchi_culture_desc:0 "连歌、禅林与唐物为山口带来声望。让文化赞助服务于官僚教育，大内家便可兼具文治与武威。"
 jxp_mission_ouc_retainer_balance_title:0 "陶与内藤之衡"
 jxp_mission_ouc_retainer_balance_desc:0 "强大重臣能支撑远征，也能倾覆主家。军权、奉行与知行必须彼此牵制。"
 jxp_mission_ouc_gate_of_kyushu_title:0 "九州门户"
 jxp_mission_ouc_gate_of_kyushu_desc:0 "长门、周防与博多之间的海峡是西国门户。掌握此处，便能在九州和本州之间调兵理财。"
 jxp_mission_ouc_capital_of_the_west_title:0 "西国之京"
 jxp_mission_ouc_capital_of_the_west_desc:0 "当山口文化与博多海贸同受一政，大内家便能以西国之京号令山阳、北九州与海外航路。"
 jxp_81_ouc_legacy:0 "西京勘合体制"
 jxp_81_ouc_legacy_desc:0 "山口文化、博多商权与遣明船务共同构成大内家的西国秩序。"
 jxp_mission_smz_satsuma_hayato_title:0 "萨摩隼人"
 jxp_mission_smz_satsuma_hayato_desc:0 "南九州武士以坚忍和乡党闻名。将地方武风纳入家中军役，勇猛才不会流于私斗。"
 jxp_mission_smz_iroha_song_title:0 "伊吕波歌"
 jxp_mission_smz_iroha_song_desc:0 "以歌诀训示忠孝、节制与处世，使家法进入武士日常。能自律的家臣方能承受长久征战。"
 jxp_mission_smz_tsurinobuse_title:0 "钓野伏"
 jxp_mission_smz_tsurinobuse_desc:0 "佯退、伏兵与地形配合可诱强敌入围。此法须由严密号令维系，稍有躁进便会反噬。"
 jxp_mission_smz_tanegashima_foundries_title:0 "种子岛制铳"
 jxp_mission_smz_tanegashima_foundries_desc:0 "传来的火绳枪应在本地仿制、修理并配给。工匠、硝石与训练共同决定火器能否成为常制。"
 jxp_mission_smz_three_provinces_title:0 "萨隅日三州"
 jxp_mission_smz_three_provinces_desc:0 "萨摩、大隅与日向各有旧族和险路。将三州置于同一检地与军役之下，是九州征伐的根本。"
 jxp_mission_smz_ryukyu_gateway_title:0 "琉球口"
 jxp_mission_smz_ryukyu_gateway_desc:0 "琉球航路通往明与南海。保护商船并掌握贡舶消息，可为岛津带来远方财富与技术。"
 jxp_mission_smz_kyushu_campaign_title:0 "九州征"
 jxp_mission_smz_kyushu_campaign_desc:0 "九州山川破碎、强族林立。岛津军必须以分进合击和快速围城摧毁敌方联盟。"
 jxp_mission_smz_demon_shimazu_title:0 "鬼岛津"
 jxp_mission_smz_demon_shimazu_desc:0 "当南九州兵法、火器和三州军役融为一体，鬼岛津之名便足以令九州诸军先闻而惧。"
 jxp_81_smz_legacy:0 "萨隅日军国法"
 jxp_81_smz_legacy_desc:0 "乡中武风、钓野伏与种子岛火器被纳入严整军役，使岛津足以横扫南九州。"
 jxp_mission_soo_tsushima_house_title:0 "对马宗氏"
 jxp_mission_soo_tsushima_house_desc:0 "岛地贫瘠却居海峡中央。宗氏的生存依赖把地理位置转化为两国都需要的秩序。"
 jxp_mission_soo_waegwan_trade_title:0 "倭馆与岁遣船"
 jxp_mission_soo_waegwan_trade_desc:0 "入港名册、贸易限额和使船节次若无凭据，边贸便会迅速变成争端。旧约必须整理为常制。"
 jxp_mission_soo_korean_communications_title:0 "朝鲜通信"
 jxp_mission_soo_korean_communications_desc:0 "礼仪、文书与译官是海峡和平的第一道防线。一次措辞失当，足以抵消多年经营。"
 jxp_mission_soo_strait_ship_service_title:0 "海峡船役"
 jxp_mission_soo_strait_ship_service_desc:0 "潮急雾重的对马海峡需要熟练船头。将领航、救难与巡检编为船役，商旅才敢按季渡海。"
 jxp_mission_soo_bridle_wokou_title:0 "羁縻倭寇"
 jxp_mission_soo_bridle_wokou_desc:0 "无法消灭的海上武装必须被许可与惩罚同时约束。合法护航和非法劫掠之间要划出清晰界线。"
 jxp_mission_soo_interpreters_office_title:0 "边界译官"
 jxp_mission_soo_interpreters_office_desc:0 "通晓汉文、朝鲜语与港市习例的译官，比一支临时军队更能维护长期利益。"
 jxp_mission_soo_bridge_of_two_realms_title:0 "两国之津梁"
 jxp_mission_soo_bridge_of_two_realms_desc:0 "宗氏既不应只是日本前哨，也不应沦为朝鲜附庸。中介者的价值在于维持双方都不愿失去的桥梁。"
 jxp_mission_soo_gate_of_genkai_title:0 "玄海之门"
 jxp_mission_soo_gate_of_genkai_desc:0 "当使船、译官和巡检皆受一制，对马便能以玄海门户之名，支配远超其土地大小的事务。"
 jxp_81_soo_legacy:0 "对马两国津梁"
 jxp_81_soo_legacy_desc:0 "翻译、岁遣船与海峡巡检共同维系日朝之间的贸易与和平，使宗氏以小岛周旋两国。"
 jxp_mission_tkd_kai_genji_title:0 "甲斐源氏"
 jxp_mission_tkd_kai_genji_desc:0 "武田家以甲斐源氏名门自许。古老血统要由守护领国、约束家臣的现实能力来证明。"
 jxp_mission_tkd_shingen_dikes_title:0 "信玄堤"
 jxp_mission_tkd_shingen_dikes_desc:0 "釜无川洪水决定甲斐农田的丰歉。堤防、分水与村役是军粮和民心共同的根基。"
 jxp_mission_tkd_koshu_code_title:0 "甲州法度之次第"
 jxp_mission_tkd_koshu_code_desc:0 "主从争讼、土地边界与军役义务应有明文。法度约束家臣，也约束武田当主自身。"
 jxp_mission_tkd_kurokawa_gold_title:0 "黑川金山"
 jxp_mission_tkd_kurokawa_gold_desc:0 "甲斐金脉为军马、兵粮与外交提供现金。矿山奉行必须防止私采和成色混乱。"
 jxp_mission_tkd_furin_kazan_title:0 "风林火山"
 jxp_mission_tkd_furin_kazan_desc:0 "疾如风，徐如林，侵掠如火，不动如山。军旗上的古语必须落实为行军、阵法与纪律。"
 jxp_mission_tkd_twenty_four_generals_title:0 "武田二十四将"
 jxp_mission_tkd_twenty_four_generals_desc:0 "名将并非只靠传说。明确军团职责和知行赏罚，诸将之勇才能服务同一战策。"
 jxp_mission_tkd_shinano_strategy_title:0 "信浓经略"
 jxp_mission_tkd_shinano_strategy_desc:0 "信浓盆地被山脉分割，逐谷经营胜过一次会战。城砦、道路与人质共同稳固新领。"
 jxp_mission_tkd_banner_to_kyoto_title:0 "上洛旗"
 jxp_mission_tkd_banner_to_kyoto_desc:0 "甲信军制若已跨越山岭，武田菱便可沿东海道或中山道直指京都，争夺天下名分。"
 jxp_81_tkd_legacy:0 "甲州军法"
 jxp_81_tkd_legacy_desc:0 "信玄堤、分国法、金山与骑马军役共同支撑武田军，使甲斐山国拥有争夺天下的力量。"
 jxp_mission_tkg_mikawa_bushi_title:0 "三河武士"
 jxp_mission_tkg_mikawa_bushi_desc:0 "松平旧臣在贫瘠三河相互扶持。忠诚不应只靠情谊，还要有知行、军役和申诉的制度。"
 jxp_mission_tkg_hostage_years_title:0 "人质岁月"
 jxp_mission_tkg_hostage_years_desc:0 "幼年辗转于今川与织田之间的经验说明，忍耐、情报与等待时机同样是君主之术。"
 jxp_mission_tkg_mikawa_ikko_title:0 "平定三河一揆"
 jxp_mission_tkg_mikawa_ikko_desc:0 "门徒、寺社与家臣亲族彼此交错。胜利之后若不重建信任，领国仍会从内部裂开。"
 jxp_mission_tkg_hatamoto_vanguard_title:0 "旗本先手"
 jxp_mission_tkg_hatamoto_vanguard_desc:0 "直属旗本和先手役必须有稳定编制，方能在诸侯军势混杂时守住主将与军令。"
 jxp_mission_tkg_five_province_rule_title:0 "五国经营"
 jxp_mission_tkg_five_province_rule_desc:0 "三河之外的新领不能只靠旧臣分封。检地、代官和城郭配置要随版图扩张而更新。"
 jxp_mission_tkg_kanto_entry_title:0 "关东入国"
 jxp_mission_tkg_kanto_entry_desc:0 "辽阔关东既是赏赐也是考验。迁封、城下与河川工程必须同时推进，才能把陌生土地变为根本。"
 jxp_mission_tkg_edo_works_title:0 "江户普请"
 jxp_mission_tkg_edo_works_desc:0 "湿地小城可因水路、町割和天下普请成为大府。建设本身便是在重排诸侯与商人的力量。"
 jxp_mission_tkg_toshogu_realm_title:0 "东照天下"
 jxp_mission_tkg_toshogu_realm_desc:0 "能忍人所不能忍者，方能把战国胜利化作百年秩序。德川政权要以法度而非不停征战维持天下。"
 jxp_81_tkg_legacy:0 "三河旗本政权"
 jxp_81_tkg_legacy_desc:0 "三河武士、检使与关东新府被编成耐久政权，令德川家善于把苦战所得转化为长治。"
 jxp_mission_ues_echigo_kokujin_title:0 "越后国人众"
 jxp_mission_ues_echigo_kokujin_desc:0 "越后豪族习于自立。上杉家必须以盟誓、裁判和共同军役，把雪国诸众凝成一军。"
 jxp_mission_ues_bishamonten_banner_title:0 "毗沙门天之旗"
 jxp_mission_ues_bishamonten_banner_desc:0 "毗沙门天的信仰给予军势共同象征。敬神之名也要求将领克制私欲、维护军纪。"
 jxp_mission_ues_kawanakajima_title:0 "川中岛"
 jxp_mission_ues_kawanakajima_desc:0 "信浓北部的反复会战磨炼侦察、渡河与阵法。胜负之外，持续投送与撤军同样决定强弱。"
 jxp_mission_ues_kanto_kanrei_title:0 "关东管领"
 jxp_mission_ues_kanto_kanrei_desc:0 "山内上杉旧职把越后军带入关东纷争。名分可召集旧臣，但必须由实际保护与裁判来维持。"
 jxp_mission_ues_kasugayama_council_title:0 "春日山评定"
 jxp_mission_ues_kasugayama_council_desc:0 "山城之下聚集奉行、国人和寺社。将军议常制化，义理便不再只是当主个人判断。"
 jxp_mission_ues_ramie_revenues_title:0 "青苎之利"
 jxp_mission_ues_ramie_revenues_desc:0 "越后青苎沿北国海道贩运。规范市场与运上，可让雪国商利供养远征。"
 jxp_mission_ues_cross_the_mountains_title:0 "越山"
 jxp_mission_ues_cross_the_mountains_desc:0 "每次越山都考验积雪、驿路与兵粮。建立固定行军体系，关东便不再是季节性的远方战场。"
 jxp_mission_ues_god_of_war_title:0 "义之军神"
 jxp_mission_ues_god_of_war_desc:0 "当道义名分、越后财赋与百战军势相互支撑，上杉家便能以军神之名号召天下武士。"
 jxp_81_ues_legacy:0 "越后义军体制"
 jxp_81_ues_legacy_desc:0 "国人众、青苎财赋与关东管领名分环绕春日山结合，使上杉军兼具道义与战力。"
