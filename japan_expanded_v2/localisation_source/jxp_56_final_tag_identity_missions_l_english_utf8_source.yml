l_english:
 jxp_mission_uncommitted_hear_domain_memorials:0 "遍听诸藩奏议"
 jxp_mission_uncommitted_hear_domain_memorials_desc:0 "天下既定而国是未决，正宜听取诸藩、禁里与港市的奏议。众言虽杂，却能让未来之路不出于一时意气。"
 jxp_mission_uncommitted_draft_realm_program:0 "草拟治国纲目"
 jxp_mission_uncommitted_draft_realm_program_desc:0 "将军议、朝议与民生之策汇为纲目，先定何者不可废，再议闭关、通商与礼制之取舍。国家由此有了选择道路的尺度。"
 jxp_mission_uncommitted_compare_foreign_models:0 "参校异国成法"
 jxp_mission_uncommitted_compare_foreign_models_desc:0 "明、朝鲜、南蛮与和兰各有可观之处。命译官与学者辨其利害，不以新奇尽取，也不以夷夏之名尽拒。"
 jxp_mission_uncommitted_keep_all_courses_open:0 "四途并陈"
 jxp_mission_uncommitted_keep_all_courses_open_desc:0 "海禁、互市、王政与新教诸策皆已具文。最后的抉择尚未作出，但国家已不再被无知与仓促逼入唯一道路。"

 jxp_mission_cjp_three_teachings_register:0 "三教籍帐"
 jxp_mission_cjp_three_teachings_register_desc:0 "礼制之国并非尽弃旧俗。社寺、学宫与乡里祭礼须各载于册，使名分有序，而百姓不至因朝廷更制而失其所奉。"
 jxp_mission_cjp_ise_ritual_academy:0 "伊势礼学寮"
 jxp_mission_cjp_ise_ritual_academy_desc:0 "神宫之祀关乎王土本源。择通经而知国俗者讲习礼仪，使朱子之义与皇大神宫的旧典各得其位。"
 jxp_mission_cjp_jingu_exemption:0 "神宫不入改祀"
 jxp_mission_cjp_jingu_exemption_desc:0 "天下郡县可以易教，唯神宫不可与寻常祠社同例。以敕令明定其祭田、神职与仪轨，方能使新礼不绝旧统。"
 jxp_mission_cjp_kami_classics:0 "纂修神典"
 jxp_mission_cjp_kami_classics_desc:0 "诸家旧记散见于神社缘起、歌集与家传。命学者校雠成书，以经义辨其名分，以国史存其风土。"
 jxp_mission_cjp_rites_without_severance:0 "礼新而统不绝"
 jxp_mission_cjp_rites_without_severance_desc:0 "所谓教化，不在尽毁前代，而在使万民知所从。今儒礼行于官府，神祀安于社稷，二者终于可以共守一国之纲纪。"

 jxp_mission_ejp_restore_daijokan:0 "再建太政官"
 jxp_mission_ejp_restore_daijokan_desc:0 "王政复古不能只靠一纸诏书。太政官、弁官与诸省须重新有其职掌，使政令真正自禁里出而行于天下。"
 jxp_mission_ejp_rank_the_provinces:0 "列国定等"
 jxp_mission_ejp_rank_the_provinces_desc:0 "旧日诸侯各以家法治其领国。朝廷将诸国按户口、贡赋与军役列为等第，方可把武家领地化为王土行政。"
 jxp_mission_ejp_kokushi_circuit:0 "国司巡察"
 jxp_mission_ejp_kokushi_circuit_desc:0 "任命国司只是名义，巡行诸道方见其实。使敕使按察仓廪、驿路与刑狱，让远国也知王命非止于京都。"
 jxp_mission_ejp_restoration_army:0 "王师新练"
 jxp_mission_ejp_restoration_army_desc:0 "禁军不可再是仪仗。采诸藩精锐、火器诸队与新式操典编成王师，使天皇的军令有足以护持天下的锋刃。"
 jxp_mission_ejp_imperial_constitution:0 "宸断国宪"
 jxp_mission_ejp_imperial_constitution_desc:0 "公卿之议、武门之功与万民之生计，皆须归于一套可久行的国宪。复古至此，已不只是返回往昔，而是再造国家。"

 jxp_mission_ejp_repair_kinri:0 "修葺禁里"
 jxp_mission_ejp_repair_kinri_desc:0 "墙垣、紫宸殿与诸门久经兵燹。修复禁里既是营造，也是向天下宣示：朝廷不再寄身于武家的庇护之下。"
 jxp_mission_ejp_jingikan_register:0 "神祇官社簿"
 jxp_mission_ejp_jingikan_register_desc:0 "由神祇官校定官社、祭田与神职传承，使地方祭祀与国家大典相互贯通，而不沦为诸家争夺名位的私器。"
 jxp_mission_ejp_court_rank_rolls:0 "重定位阶"
 jxp_mission_ejp_court_rank_rolls_desc:0 "位阶不应只酬旧族门第。将军功、政绩与学识纳入叙位，既收武士之心，也使朝廷官秩重新具有实用。"
 jxp_mission_ejp_shrine_envoys:0 "奉币使四出"
 jxp_mission_ejp_shrine_envoys_desc:0 "奉币使循海道与山道遍诣名社，传达宸意并察地方情形。祭礼所至，亦成为朝廷耳目所及。"
 jxp_mission_ejp_rites_of_restoration:0 "复古大典"
 jxp_mission_ejp_rites_of_restoration_desc:0 "钟鼓既陈，百官就列。大典不是复述古礼，而是为新王政赋予可见的秩序，使天下共同见证旧统的新生。"

 jxp_mission_ejp_guard_four_seas:0 "镇抚四海"
 jxp_mission_ejp_guard_four_seas_desc:0 "王土以海为垣。整饬水军、港务与烽堠，使海寇与外船皆知沿岸已有统一号令。"
 jxp_mission_ejp_ryukyu_envoys:0 "琉球来聘"
 jxp_mission_ejp_ryukyu_envoys_desc:0 "琉球舟楫往来中日，其礼聘最能显王化于海表。以厚礼相接，也以明文厘定彼此名分。"
 jxp_mission_ejp_ezo_commission:0 "虾夷地经略使"
 jxp_mission_ejp_ezo_commission_desc:0 "北海辽阔，不可只委一门世守。遣经略使勘界、通商并约束移民，使边陲渐入国家制度。"
 jxp_mission_ejp_korean_mission:0 "通信使复途"
 jxp_mission_ejp_korean_mission_desc:0 "对马海峡既可载兵，也可载书。恢复与朝鲜的正式使节往还，使礼仪、学问与贸易取代无休的猜忌。"
 jxp_mission_ejp_sun_over_eastern_seas:0 "日出东海"
 jxp_mission_ejp_sun_over_eastern_seas_desc:0 "开拓万里波涛，布国威于四方。舰队奉日章而行，所到之处不只见兵威，也见朝廷的法度与信义。"

 jxp_mission_rfj_oranda_factors:0 "和兰商馆"
 jxp_mission_rfj_oranda_factors_desc:0 "同信仰的商人与牧师自西海而来。准其在港口设馆，同时令长老会与奉行共同约束贸易与教务。"
 jxp_mission_rfj_printed_navigation:0 "刊行航海书"
 jxp_mission_rfj_printed_navigation_desc:0 "罗盘针路、潮汐表与远洋图不应锁在少数船主箱中。借活字印刷广为刊行，使知识成为国家的共同器用。"
 jxp_mission_rfj_covenant_ports:0 "盟约港市"
 jxp_mission_rfj_covenant_ports_desc:0 "港市居民在上帝与国法之前立约，推举长老协理赈济、治安与学校。商利由此不再与公共秩序相悖。"
 jxp_mission_rfj_chartered_companies:0 "特许会社"
 jxp_mission_rfj_chartered_companies_desc:0 "远洋事业非一家之财可办。以特许状聚合商本、船匠与炮手，并令会社承担明确的税赋与国用。"
 jxp_mission_rfj_free_seas_commonwealth:0 "自由海上共和国"
 jxp_mission_rfj_free_seas_commonwealth_desc:0 "信仰须经良知，贸易须有公约，舰队须受国法。列岛终于将宗教共同体、港市自治与国家权威结为一体。"

 jxp_mission_wak_letters_of_black_current:0 "黑潮朱印状"
 jxp_mission_wak_letters_of_black_current_desc:0 "昔日海商与海寇只隔一纸文书。以朱印状定其航路、分润与敌我，让黑潮上的勇悍之士成为国家可用之锋。"
 jxp_mission_wak_boarding_schools:0 "接舷众练所"
 jxp_mission_wak_boarding_schools_desc:0 "登舷一瞬决定胜负。于诸岛设练所，教习钩索、火铳与甲板阵法，使水手不再只凭血气。"
 jxp_mission_wak_island_courts:0 "岛屿公所"
 jxp_mission_wak_island_courts_desc:0 "海上纠纷牵涉船主、牙人与异国商客。设岛屿公所按海法断事，方能让自由港不至沦为强者私斗之地。"
 jxp_mission_wak_tidewater_arsenals:0 "潮汐火器藏"
 jxp_mission_wak_tidewater_arsenals_desc:0 "将火药、船炮与修造木料分藏于潮港，依季风调运。即使一港受袭，舰队仍可从别处迅速整补。"
 jxp_mission_wak_black_tide_code:0 "黑潮法度"
 jxp_mission_wak_black_tide_code_desc:0 "海上豪杰也须有共同的法。议定战利、护航、赎俘与港税之制，使诸船团由逐利之众成为东海一国。"

