l_english:
 jxp_founder_reform_pulse.1.t:0 "开府武家法的归处"
 jxp_founder_reform_pulse.1.d:0 "创始家留下的军令、誓纸与知行账册，如今已不再只是旧臣怀中的故纸。诸将请求将其编入全国军役，谱第家臣则希望保留开府以来的座次与特权。刀枪收束于何处，便预示新日本的武威从何处发声。"
 jxp_founder_reform_pulse.1.a:0 "编为天下军役之法。"
 jxp_founder_reform_pulse.1.b:0 "许旧臣守其座次。"
 jxp_founder_reform_pulse.2.t:0 "开府文书与朝班"
 jxp_founder_reform_pulse.2.d:0 "创始家曾以官位、奉书和家中评议维系诸国。如今京都与城下的文吏争论这些旧例的归属：是收进新官署，成为全国政务的先例；还是允许地方旧臣以此为据，向朝廷陈请。纸上墨痕虽淡，牵动的却是天下名分。"
 jxp_founder_reform_pulse.2.a:0 "纳入朝廷官署。"
 jxp_founder_reform_pulse.2.b:0 "保留诸家陈请之路。"
 jxp_founder_reform_pulse.3.t:0 "创始家的海路账册"
 jxp_founder_reform_pulse.3.d:0 "开府之初依靠海港、船手或商馆起家的家风，仍在诸浦之间留下账册与人脉。港町豪商请求承认旧约，水军头目则主张把船手重新编入国家军制。潮声不问旧新，然而执掌潮路者必须有所选择。"
 jxp_founder_reform_pulse.3.a:0 "以港约织成商路。"
 jxp_founder_reform_pulse.3.b:0 "把船手编入海军。"
 jxp_founder_reform_pulse.4.t:0 "边地家法的转用"
 jxp_founder_reform_pulse.4.d:0 "边境、山道与外岛曾塑造创始家的目光。关隘守将主张延续严密的防卫法度，商旅与通事则认为旧边地网络可以成为通向远方的门径。边界并非地图上的墨线，而是人、货与军令往来的活口。"
 jxp_founder_reform_pulse.4.a:0 "使关隘成为国法之牙。"
 jxp_founder_reform_pulse.4.b:0 "让山海通道开向远方。"
 jxp_founder_reform_pulse.5.t:0 "寺社、町市与开府旧约"
 jxp_founder_reform_pulse.5.d:0 "若创始家的根基曾在寺社、市场或学问之地，旧约便不只属于武家。社家、町年寄与账房各执文书，争论这些权利应被纳入国家祭祀，还是化作町市治理的常法。香火与算盘同在案上，天下也要在二者之间寻得秩序。"
 jxp_founder_reform_pulse.5.a:0 "以寺社旧约护持名分。"
 jxp_founder_reform_pulse.5.b:0 "令町市账法通行诸国。"
 jxp_38_warrior_founder_military_codes:0 "开府军役法"
 jxp_38_warrior_founder_military_codes_desc:0 "创始家的军令被编入全国军役，旧日家法由此化为天下武备。"
 jxp_38_warrior_founder_retainer_privileges:0 "谱第席次"
 jxp_38_warrior_founder_retainer_privileges_desc:0 "开府旧臣的席次被谨慎保留，使军中服从与家中情分暂得并行。"
 jxp_38_court_founder_office_precedents:0 "开府官署先例"
 jxp_38_court_founder_office_precedents_desc:0 "创始家文书被纳入朝廷官署，成为处理诸国政务的可循旧例。"
 jxp_38_court_founder_domain_petitions:0 "诸家陈请路"
 jxp_38_court_founder_domain_petitions_desc:0 "地方旧臣仍可凭开府旧例向朝廷陈请，名分因此有了缓冲之道。"
 jxp_38_maritime_founder_port_compacts:0 "开府港约"
 jxp_38_maritime_founder_port_compacts_desc:0 "创始家遗留的港口人脉与商约被重新承认，诸浦由此更易连成网络。"
 jxp_38_maritime_founder_admiralty_rolls:0 "船手编籍"
 jxp_38_maritime_founder_admiralty_rolls_desc:0 "旧水军与港町船手被编入海军名簿，使海上军令不再散落诸浦。"
 jxp_38_frontier_founder_barrier_offices:0 "边关奉行所"
 jxp_38_frontier_founder_barrier_offices_desc:0 "边地旧法被整理为关隘与要害的常设奉行制度。"
 jxp_38_frontier_founder_open_passes:0 "山海道通事"
 jxp_38_frontier_founder_open_passes_desc:0 "边地家法被转用于商旅、外岛与远方通事，使旧边界成为新的门路。"
 jxp_38_temple_founder_shrine_compact:0 "寺社开府约"
 jxp_38_temple_founder_shrine_compact_desc:0 "创始家与寺社市场的旧约被纳入国家名分，香火、祭礼与法度相互支撑。"
 jxp_38_temple_founder_market_accounting:0 "町市账法"
 jxp_38_temple_founder_market_accounting_desc:0 "市场账册与寺内町公议被整理为可通行诸国的治理手段。"
