l_english:
 jxp_route_institution_high_offices:0 "诸道高阶政务"
 jxp_reform_sakoku_terauke_inquest_office:0 "寺请穿凿役所"
 jxp_reform_sakoku_terauke_inquest_office_desc:0 "寺请册籍不再只是户口文书，而成为追索流民、异端与无籍浪人的细密网目。闭门之国欲久安，须先知门内每一盏灯火归于何处。"
 jxp_reform_sakoku_alternate_attendance_treasury:0 "参勤国役金藏"
 jxp_reform_sakoku_alternate_attendance_treasury_desc:0 "诸藩往返江户，车马、米仓与国役皆可转化为公仪财源。道路上的疲惫若能入账，便可化为天下静谧的代价。"
 jxp_reform_sakoku_rangaku_observatory_license:0 "内许兰学天文寮"
 jxp_reform_sakoku_rangaku_observatory_license_desc:0 "少数译官、医师与历算家得以内许读书。海门虽闭，星辰与药石仍可在严密许可之下越过国界。"
 jxp_reform_open_transpacific_company_board:0 "太平洋商社局"
 jxp_reform_open_transpacific_company_board_desc:0 "朱印商人、船主与海外奉行共同出资远航。太平洋不再只是传闻中的大水，而是可被股份、仓库与护航丈量的道路。"
 jxp_reform_open_treaty_port_circuit_courts:0 "通商口岸巡回裁判"
 jxp_reform_open_treaty_port_circuit_courts_desc:0 "异国商人、町众与武家官吏同处一港，争讼不可只凭旧例。巡回裁判将条约、关税与地方礼法缝合为可执行的秩序。"
 jxp_reform_open_blue_water_gunnery_colleges:0 "远洋炮术学寮"
 jxp_reform_open_blue_water_gunnery_colleges_desc:0 "水手学风信，炮手学测距，船匠学龙骨与桅索。开国之路若要不受外人牵制，必须让海军也懂得远洋的语言。"
 jxp_reform_kirishitan_apostolic_land_registers:0 "宗徒地籍簿"
 jxp_reform_kirishitan_apostolic_land_registers_desc:0 "教区、村落与武家知行被录入同一套地籍。日轮与十字同照之地，既有祈祷的钟声，也有国家印信的红泥。"
 jxp_reform_kirishitan_misericordia_state_hospitals:0 "慈悲院国役"
 jxp_reform_kirishitan_misericordia_state_hospitals_desc:0 "慈悲院收容病者、伤兵与孤儿，也替国家缝合战乱留下的裂口。救济若能成制，信仰便不只是祭坛之事。"
 jxp_reform_kirishitan_sun_cross_overseas_orders:0 "日轮十字海外修会"
 jxp_reform_kirishitan_sun_cross_overseas_orders_desc:0 "传教、航海与武家奉公被置于同一誓愿之下。海外修会不是流浪的热忱，而是受国法约束的远方之手。"
 jxp_reform_confucian_classics_examination_ministry:0 "经学取士省"
 jxp_reform_confucian_classics_examination_ministry_desc:0 "诸藩学校、博士家与幕府儒官共定经义。士人以经典入仕，武家国家由此学会用笔墨甄别才能。"
 jxp_reform_confucian_shinbutsu_rite_courts:0 "神儒礼讼院"
 jxp_reform_confucian_shinbutsu_rite_courts_desc:0 "社家、寺门与儒官同署审理祭祀与乡约。神明不必退入荒草，礼法也不必压断旧俗；二者皆可在文书中找到名分。"
 jxp_reform_confucian_east_asian_prefectures:0 "东亚礼藩府"
 jxp_reform_confucian_east_asian_prefectures_desc:0 "朝鲜通信、明清文书与琉球礼仪被置入专署。日本若要以礼立国，也须明白邻邦如何读懂我们的仪轨。"
 jxp_reform_imperial_jingikan_state_network:0 "神祇官国中网络"
 jxp_reform_imperial_jingikan_state_network_desc:0 "神祇官的札文传入诸国，社家、国司与地方官吏共同维护祭祀秩序。王政复古不只在京都，也在每一处乡社的灯火中。"
 jxp_reform_imperial_restoration_command_school:0 "复古军制学馆"
 jxp_reform_imperial_restoration_command_school_desc:0 "近卫、诸藩兵学与新式操练同入学馆。奉诏而战若要胜过旧日私斗，必须有能被全国理解的军制。"
 jxp_reform_imperial_court_land_revenue_board:0 "朝廷地租局"
 jxp_reform_imperial_court_land_revenue_board_desc:0 "旧国司名义、社寺领与武家知行被重新核问。朝廷不只颁布名分，也须掌握支撑名分的米、钱与土地。"
 jxp_reform_reformed_printed_public_law:0 "活字公法局"
 jxp_reform_reformed_printed_public_law_desc:0 "印刷所刊行成文法、议约与教理问答。共和国的根基不是众声喧哗，而是每个人都能读到的公共规则。"
 jxp_reform_reformed_burgher_militia_commissions:0 "町人市民军委员会"
 jxp_reform_reformed_burgher_militia_commissions_desc:0 "港町、商社与改革派教会共同点检民兵。市民若要守住自由，也须知晓枪矛、仓廪与轮值的分寸。"
 jxp_reform_reformed_dutch_exchange_engineers:0 "荷兰交换技师团"
 jxp_reform_reformed_dutch_exchange_engineers_desc:0 "测量、炮垒、排水与筑城之术经由荷兰语文书进入国政。实学不是异国奇技，而是共和国用以自强的工具。"
 jxp_reform_kaikyo_harbor_qadi_high_courts:0 "港市卡迪高等院"
 jxp_reform_kaikyo_harbor_qadi_high_courts_desc:0 "卡迪、奉行与商人长老共同裁断港市争讼。季风带来货物，也带来需要被理解与裁判的契约。"
 jxp_reform_kaikyo_monsoon_pilgrim_fleet:0 "季风朝觐护航队"
 jxp_reform_kaikyo_monsoon_pilgrim_fleet_desc:0 "朝觐、贸易与护航共享航期。南海风信有时，国家船队便须在风起之前备好帆、粮与印信。"
 jxp_reform_kaikyo_madrasa_cast_foundries:0 "学塾铸炮城"
 jxp_reform_kaikyo_madrasa_cast_foundries_desc:0 "经学、数学与铸炮技艺在港城学塾相遇。火器若只来自军匠，终究浅薄；若能入学，便可代代相传。"
 jxp_reform_ikko_somon_equal_field_boards:0 "惣村均田评定"
 jxp_reform_ikko_somon_equal_field_boards_desc:0 "惣村代表、寺内町与门徒长老共议田役。田畴不只是领主的册页，也是共同体维持誓约的根本。"
 jxp_reform_ikko_temple_market_mutual_aid:0 "寺内町相济法"
 jxp_reform_ikko_temple_market_mutual_aid_desc:0 "市庭、仓廪与讲中相互救济。钟声所召集的不只是信众，也是能在歉收与战乱中彼此支撑的町人。"
 jxp_reform_ikko_monto_defense_compacts:0 "门徒守备盟约"
 jxp_reform_ikko_monto_defense_compacts_desc:0 "寺内町、农兵与地方讲社以盟约守城。信心若不能保全仓廪与家门，便无法成为国家之基。"
 jxp_reform_wokou_black_current_letter_office:0 "黑潮朱札奉行"
 jxp_reform_wokou_black_current_letter_office_desc:0 "出海朱札、侦查书状与分赃契约皆入奉行所。黑潮上的自由并未消失，只是被国家印信套上可控的缰绳。"
 jxp_reform_wokou_island_broker_federation:0 "岛屿中介联邦"
 jxp_reform_wokou_island_broker_federation_desc:0 "诸岛船主、译官、商人牙人与水军头目结成联邦。海岛不是边角，而是连接远方市声的节点。"
 jxp_reform_wokou_red_seal_raider_admiralty:0 "朱印袭掠海军府"
 jxp_reform_wokou_red_seal_raider_admiralty_desc:0 "袭掠、护航与通商在同一海军府中获得名分。国家若要借浪人之勇，就必须让勇气知道何处可以拔刀。"
