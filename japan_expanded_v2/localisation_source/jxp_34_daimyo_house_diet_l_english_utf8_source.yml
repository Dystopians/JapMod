l_english:
 jxp_decision_convene_house_diet_title:0 "召开家法评定"
 jxp_decision_convene_house_diet_desc:0 "家中谱代、国人、奉行、社寺与町座齐集城下，请主君以朱印定下本家的根本法度。此后本家的名分、军役、港市或边境之治，都将由这场评定留下长久痕迹。"
 jxp_house_diet.1.t:0 "家法评定"
 jxp_house_diet.1.d:0 "城中廊下灯火通明。年老的宿将按刀而坐，奉行展开旧账，寺社使者低声诵念先例，远浦与境目的取次众也带来了各自的请愿。所谓家法，并非一纸空文；它会告诉家臣何以奉公，告诉百姓何以纳役，也告诉邻国本家究竟要走向何处。"
 jxp_house_diet.1.warrior_a:0 "以军役帐重列知行与番役。"
 jxp_house_diet.1.warrior_b:0 "准旗头以誓纸统御其众。"
 jxp_house_diet.1.court_a:0 "以官途旧谱重明家名。"
 jxp_house_diet.1.court_b:0 "先立本国代官与城下法度。"
 jxp_house_diet.1.maritime_a:0 "给浦方商帆发给通航符。"
 jxp_house_diet.1.maritime_b:0 "先编水军船籍与海番。"
 jxp_house_diet.1.frontier_a:0 "令关隘番所奉行军法。"
 jxp_house_diet.1.frontier_b:0 "以市口取次安抚境目诸族。"
 jxp_house_diet.1.temple_market_a:0 "安堵社寺旧例与门前町。"
 jxp_house_diet.1.temple_market_b:0 "重写町座、公界与寺社账册。"
 jxp_house_diet.1.fallback:0 "先令奉行整理城下旧例。"
 jxp_34_warrior_muster_law:0 "家法军役帐"
 jxp_34_warrior_muster_law_desc:0 "知行、番役与出阵次第被写入家法。诸将仍各领其众，却要先在同一册账中听见主君的朱印。"
 jxp_34_warrior_captain_privileges:0 "旗头机断安堵"
 jxp_34_warrior_captain_privileges_desc:0 "旗头以誓纸担保忠勤，主君则承认他们在战场上临机裁断的旧权。军势不尽归于纸上，也不再只是私斗之勇。"
 jxp_34_court_rank_law:0 "官途家名法"
 jxp_34_court_rank_law_desc:0 "旧谱、奉书与朝廷官途被整理为本家名分的一部分。城下使者往返京都，家名在礼法之中重新发声。"
 jxp_34_court_domain_law:0 "本国代官法"
 jxp_34_court_domain_law_desc:0 "国中代官、仓敷奉行与城下年寄被纳入更清楚的法度。京中名望固然可贵，田畴与米仓同样要有根基。"
 jxp_34_maritime_port_law:0 "浦方法度"
 jxp_34_maritime_port_law_desc:0 "港市、船主与商帆以通航符纳入本家视野。潮水带来货物，也带来可以被记入账册的远方消息。"
 jxp_34_maritime_admiral_rolls:0 "船籍海番帐"
 jxp_34_maritime_admiral_rolls_desc:0 "水军、商船与浦方人夫被编入船籍海番。出海不再只凭胆量，归港也不再只看风向。"
 jxp_34_frontier_barrier_law:0 "境目番所法"
 jxp_34_frontier_barrier_law_desc:0 "山口、渡口与边城置番所，使国人众、马商与旅僧皆知本家的边境规矩。"
 jxp_34_frontier_market_charter:0 "境目市口宪"
 jxp_34_frontier_market_charter_desc:0 "边地市场由取次众调停，猎户、马商、寺社使者与土豪在市声中归入本家秩序。"
 jxp_34_temple_privilege_law:0 "社寺旧例安堵状"
 jxp_34_temple_privilege_law_desc:0 "社寺香火、祭礼与门前町旧例得以承认。钟声不必与朱印相争，而可成为本家安民的另一种语言。"
 jxp_34_temple_accounting_law:0 "町座公账法"
 jxp_34_temple_accounting_law_desc:0 "座役、仓敷、祭礼支出与寺社地被重写为公账。市声仍然喧闹，只是奉行的墨迹已落在纸上。"
