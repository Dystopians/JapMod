l_english:
 jxp_reform_final_uncommitted_consensus:0 "天下评议政治"
 jxp_reform_final_uncommitted_consensus_desc:0 "朝廷、武家、诸藩与町众在天下评议中共同议定国策。国家尚未锁定终局道路，因而以可修订的成文程序维持团结，并为未来的转向保留合法出口。"
 jxp_reform_final_sakoku_constitution:0 "幕藩国宪政治"
 jxp_reform_final_sakoku_constitution_desc:0 "海禁、参勤、寺请与沿海警备被纳入幕藩国宪。中央以法度约束诸藩，诸藩则以定期奏报和共同海防换取其地方行政的延续。"
 jxp_reform_final_open_cabinet:0 "海洋政务院政治"
 jxp_reform_final_open_cabinet_desc:0 "港奉行、译官、商社与海军代表组成常设政务院。对外条约、航路特许和技术引进必须经过公开议程，使开国不再只是少数港口的私利。"
 jxp_reform_final_kirishitan_estates:0 "吉利支丹三级会议"
 jxp_reform_final_kirishitan_estates_desc:0 "教会、武家与港市各成一院，共同议定税役、军务和海外传教。三级会议奉戴禁里，也以成文协约限制任何单一等级独占国家。"
 jxp_reform_final_confucian_censorate:0 "经世监察政治"
 jxp_reform_final_confucian_censorate_desc:0 "监察院以经典、律令与实绩考核百官，并允许神官和地方代表驳正失当奏议。礼制由此成为约束统治者的公共法，而非只约束臣民的训条。"
 jxp_reform_final_imperial_daijokan:0 "太政官国家体制"
 jxp_reform_final_imperial_daijokan_desc:0 "复兴的太政官统辖预算、任官、巡察与军令，宫廷位阶被转化为中央行政责任。王政复古因此获得一套能够贯彻全国的国家机器。"
 jxp_reform_final_reformed_synod:0 "御言总会宪政"
 jxp_reform_final_reformed_synod_desc:0 "长老总会、港市议席与诸藩代表共同解释国家盟约。印刷、教育和公共军役接受定期审议，使信仰纪律与商业自治彼此制衡。"
 jxp_reform_final_kaikyo_diwan:0 "港务迪万宪政"
 jxp_reform_final_kaikyo_diwan_desc:0 "卡迪、船主、港奉行与朝廷使者共同组成迪万。日本旧法与海上商法在成文程序中并行，维系从列岛到南海的贸易共同体。"
 jxp_reform_final_ikko_somon:0 "惣门公议政治"
 jxp_reform_final_ikko_somon_desc:0 "寺内町、门徒村社与共同军役各派代表参加惣门公议。赋役和防务由盟约承担，禁里则作为超越各门徒团体的天下名分受到护持。"
 jxp_reform_final_wokou_admiralty:0 "海军府联邦政治"
 jxp_reform_final_wokou_admiralty_desc:0 "岛主、船团与港市依海军府约法组成联邦。私掠、关税和海事裁判受共同账册约束，黑潮上的武力由此成为国家秩序而非私人劫掠。"
 jxp_debug_80_refresh_final_state_reforms_title:0 "调试：刷新并验收终局改革"
 jxp_debug_80_refresh_final_state_reforms_desc:0 "清理与当前终局状态不符的政治改革，提供足够的政府改革进度并重建候选。验收时仍须在政府界面中亲自查看并选择改革，以验证图标、层级、条件与效果。"
