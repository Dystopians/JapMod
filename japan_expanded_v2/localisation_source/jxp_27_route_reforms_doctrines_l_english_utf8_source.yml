l_english:
 jxp_route_institution_state_doctrine:0 "日轮国制终纲"
 jxp_reform_sakoku_kanei_border_cordon:0 "宽永海陆封疆"
 jxp_reform_sakoku_kanei_border_cordon_desc:0 "外浦远见、街道关所与诸藩番役连成一张细密的网。闭国之法若只写在纸上，不过是空文；若能立在潮头与山口，方可称为天下之门。"
 jxp_reform_sakoku_inner_almanacs:0 "内证历算局"
 jxp_reform_sakoku_inner_almanacs_desc:0 "历学、医方、炮术与测量书由少数可信译官校读。海门虽闭，星辰仍在移动；谨慎之国亦须懂得天与数。"
 jxp_reform_open_pacific_custom_houses:0 "太平洋海关会所"
 jxp_reform_open_pacific_custom_houses_desc:0 "长崎、堺、博多与更远诸港按统一税簿验船、封货、给照。万里波涛若入账册，便不再只是险阻，而是国家可计算的边疆。"
 jxp_reform_open_foreign_drill_mission:0 "异式调练使团"
 jxp_reform_open_foreign_drill_mission_desc:0 "炮术师、通词、船匠与足轻头在城下同场操练。异邦之法须经日本号令重铸，方能从奇技化作军制。"
 jxp_reform_kirishitan_order_of_the_sun:0 "日轮骑士团"
 jxp_reform_kirishitan_order_of_the_sun_desc:0 "受洗武士以十字与日轮共同立誓，守教区、护商路、奉王命。信仰不只是心中火焰，也成为可召集、可检阅的军役。"
 jxp_reform_kirishitan_nagasaki_crown_admiralty:0 "长崎王冠海军院"
 jxp_reform_kirishitan_nagasaki_crown_admiralty_desc:0 "长崎船手、通词与教会港务归于王冠海军院。钟声送别远帆，炮声守护航路，海图边缘写着新的日本。"
 jxp_reform_confucian_taigaku_censors:0 "太学监察使"
 jxp_reform_confucian_taigaku_censors_desc:0 "太学不只讲章句，也出监察诸藩学政与官箴之使。礼若不能巡行地方，便只能停在京都纸面；学若能入政，天下自有纲纪。"
 jxp_reform_confucian_rites_and_tenka_code:0 "礼法天下令"
 jxp_reform_confucian_rites_and_tenka_code_desc:0 "以礼定名分，以法整田册，以学校驯诸藩。日本不必全然效中华，却可借王化之名把战国余波收束于一国制度。"
 jxp_reform_imperial_jingi_chancery:0 "神祇官太政厅"
 jxp_reform_imperial_jingi_chancery_desc:0 "神祇官与太政官重开旧署，祭礼、敕命与政务互为表里。复古并非沉睡于旧纸，而是让旧名重新握住现实之柄。"
 jxp_reform_imperial_restoration_banners:0 "王政维新诸旗"
 jxp_reform_imperial_restoration_banners_desc:0 "禁里亲卫、勤王诸藩与新式足轻在日轮旗帜下合编。军旗所向，不只是武家胜负，亦是朝命临处。"
 jxp_reform_reformed_printed_oaths:0 "印行信约法"
 jxp_reform_reformed_printed_oaths_desc:0 "誓约、教义、航海术与医方以活字广布。信仰不只靠讲坛，也靠每一页可校验、可传抄、可入账的文字。"
 jxp_reform_reformed_port_consistories:0 "港町长老会"
 jxp_reform_reformed_port_consistories_desc:0 "港町长老、奉行与商会共审契约、婚姻与海事纠纷。会众之国若要远航，必须让港口也懂得秩序。"
 jxp_reform_kaikyo_monsoon_sultanate:0 "季风苏丹厅"
 jxp_reform_kaikyo_monsoon_sultanate_desc:0 "季风航期、香料税、朝觐船与南海使节皆由苏丹厅裁定。海峡之国以星盘观天，也以账簿治世。"
 jxp_reform_kaikyo_qadi_shipyards:0 "卡迪船坞法"
 jxp_reform_kaikyo_qadi_shipyards_desc:0 "卡迪、港奉行与船匠共同裁断造船契约、工资与海上赔偿。公正若能立于船坞，远航者便愿把性命托付给国家。"
 jxp_reform_ikko_sovereign_somon:0 "惣门主权誓"
 jxp_reform_ikko_sovereign_somon_desc:0 "村落、寺内町、讲众与足轻同在誓纸下承认共同国法。一向之国的主权不只在殿阁，也在钟声召集的众人之间。"
 jxp_reform_ikko_monto_war_leagues:0 "门徒战盟"
 jxp_reform_ikko_monto_war_leagues_desc:0 "讲中按村社分番操练，农闲习枪，战时守土。其勇气来自信念，也来自彼此熟知的田垄与仓门。"
 jxp_reform_wokou_black_current_domain:0 "黑潮海域令"
 jxp_reform_wokou_black_current_domain_desc:0 "黑潮诸港以同一掟法分赃、审债、给照与巡海。浪潮上的自由若被国家写入法度，便不再只是私帆之勇。"
 jxp_reform_wokou_free_captains:0 "自由船头众"
 jxp_reform_wokou_free_captains_desc:0 "熟潮水、识船型、知诸港暗语的船头受敕许远行。国家不必亲握每一支橹，却须知道每一面帆为何而升。"
