l_english:
 ASA_ideas:0 "朝仓理念"
 ASA_ideas_start:0 "朝仓传统"
 ASA_ideas_bonus:0 "朝仓野心"
 jxp_asa_hidden_diplomacy:0 "越前密议"
 jxp_asa_hidden_diplomacy_desc:0 "一乘谷的书札常在山路与寺门之间往还。朝仓家懂得在明面兵威之外，以婚姻、誓纸与沉默的允诺维系畿内诸势。"
 jxp_asa_echizen_paper:0 "越前和纸"
 jxp_asa_echizen_paper_desc:0 "越前纸质坚韧，足供文书、账册与佛典。纸坊的细响，使山国政令得以写成可传之物。"
 jxp_asa_ichijodani_city:0 "一乘谷城下"
 jxp_asa_ichijodani_city_desc:0 "馆第、庭园、町屋与寺社沿谷铺陈，似小京都隐于雪国。城下繁荣，便是朝仓权威的另一种甲胄。"
 jxp_asa_soteki_teachings:0 "宗滴之训"
 jxp_asa_soteki_teachings_desc:0 "老将朝仓宗滴的兵论不尚浮夸，重在持久、军纪与审势。后辈武士仍在阵前背诵他的言辞。"
 jxp_asa_seventeen_articles:0 "十七箇条家法"
 jxp_asa_seventeen_articles_desc:0 "家法把国人、奉行与家臣各置其位。乱世难免动荡，至少可以让诸人知道何事不可逾越。"
 jxp_asa_buddhist_settlements:0 "寺社调停"
 jxp_asa_buddhist_settlements_desc:0 "越前近邻一向与天台势力，若只以兵刃相向，终会使谷地遍燃。朝仓家学会在香烟与城垒之间求取秩序。"
 jxp_asa_keitai_legacy:0 "继体帝旧闻"
 jxp_asa_keitai_legacy_desc:0 "越前关于继体天皇的旧传，使朝仓家能把地方统治镶入更古老的王统叙事之中。"

 HTK_ideas:0 "畠山理念"
 HTK_ideas_start:0 "畠山传统"
 HTK_ideas_bonus:0 "畠山野心"
 jxp_htk_kanrei_claim:0 "管领之名"
 jxp_htk_kanrei_claim_desc:0 "畠山家名列三管领。即使京洛权威日渐倾圮，这一旧名仍足以召来怀念幕府秩序的武士。"
 jxp_htk_indomitable_generals:0 "不屈诸将"
 jxp_htk_indomitable_generals_desc:0 "河内、纪伊、能登诸地的战事锻炼了畠山家臣。败北不会立即毁掉一家，只会迫使将领更懂得重整旗鼓。"
 jxp_htk_mount_koya:0 "高野山关系"
 jxp_htk_mount_koya_desc:0 "高野山的灯火照见武家誓愿，也照见亡者名册。畠山家借寺社网络安抚领内与家中。"
 jxp_htk_retainers:0 "国人被官"
 jxp_htk_retainers_desc:0 "若能使散处各郡的国人与被官重新听命，畠山的旧领便不会只是谱牒上的影子；雇兵与乡兵也能归入同一面旗。"
 jxp_htk_wakae_castle:0 "若江城"
 jxp_htk_wakae_castle_desc:0 "若江城控制河内要冲，城垒虽不夺目，却足以让畠山家在畿内争局中保有支点。"
 jxp_htk_clan_unification:0 "两畠山归一"
 jxp_htk_clan_unification_desc:0 "分裂的家名会把旧望耗尽。若能使两支重归一体，畠山便可再度以一家之名发令。"
 jxp_htk_saika_shu:0 "杂贺众火器"
 jxp_htk_saika_shu_desc:0 "纪伊杂贺的铁炮声穿过山谷与海雾。善用其术者，能把地方众的桀骜与火器匠人的手艺化作战阵锐气。"

 IKE_ideas:0 "池田理念"
 IKE_ideas_start:0 "池田传统"
 IKE_ideas_bonus:0 "池田野心"
 jxp_ike_himeji_castle:0 "姬路天守"
 jxp_ike_himeji_castle_desc:0 "白壁层叠，曲轮相绕。姬路之城不只是防御工事，也是池田家治理播磨、备前与西国门户的象征。"
 jxp_ike_bizen_transfer:0 "备前转封"
 jxp_ike_bizen_transfer_desc:0 "转封使一家必须重新丈量田亩、安置旧臣、收束新领。池田家由此习得不依赖一地一姓的统治术。"
 jxp_ike_terumasa_governance:0 "辉政之治"
 jxp_ike_terumasa_governance_desc:0 "池田辉政以谨慎的城郭经营与家臣配置巩固新领。乱世之后，武威也须化为可长久运行的政务。"
 jxp_ike_domain_schools:0 "藩校文教"
 jxp_ike_domain_schools_desc:0 "读书之声进入武家屋敷，账册与经义并置案头。池田家以学问训练能办事的家臣。"
 jxp_ike_cadet_houses:0 "支流相续"
 jxp_ike_cadet_houses_desc:0 "分家、养子与婚姻把池田血脉系成一张稳固之网，使家名能渡过嗣续未定的风浪。"
 jxp_ike_setouchi_accounts:0 "濑户内账目"
 jxp_ike_setouchi_accounts_desc:0 "米、盐、木材与船货沿濑户内往来。会计清楚，港町、庄屋与城下才会把海上的利润送入同一本账。"
 jxp_ike_tokugawa_ties:0 "东照姻亲"
 jxp_ike_tokugawa_ties_desc:0 "与强权保持近缘并非怯懦，而是乱世大名的生存技艺。池田家善于把亲缘、礼物与书状化作可用的名分。"

 MAE_ideas:0 "前田理念"
 MAE_ideas_start:0 "前田传统"
 MAE_ideas_bonus:0 "前田野心"
 jxp_mae_kaga_million_koku:0 "加贺百万石"
 jxp_mae_kaga_million_koku_desc:0 "加贺、能登、越中诸地田畴丰厚，仓廪相连。百万石之名，使前田家成为北陆最沉重的一枚棋子。"
 jxp_mae_kanazawa_castle:0 "金泽城"
 jxp_mae_kanazawa_castle_desc:0 "金泽城下汇聚武士、町人、工匠与学僧。城池越稳，城下的繁华越能转化为统治的根基。"
 jxp_mae_toshiie_retinue:0 "利家赤母衣"
 jxp_mae_toshiie_retinue_desc:0 "前田利家的武名来自枪锋与近侍之列。家中武士以此为荣，愿在阵前守住主家的声望。"
 jxp_mae_hokuriku_gold:0 "北陆金银"
 jxp_mae_hokuriku_gold_desc:0 "山间矿脉与港町商路相互供养。金银若能入账而不入私囊，便可支撑一国宏图。"
 jxp_mae_domain_schools:0 "加贺学规"
 jxp_mae_domain_schools_desc:0 "前田家以文事驯服庞大家中。武士若能读礼、算赋、识法，百万石才不会被粗暴挥霍。"
 jxp_mae_tea_and_noh:0 "茶与能"
 jxp_mae_tea_and_noh_desc:0 "茶席与能舞并非奢靡余兴。它们让武家学会节制、礼仪与展示富贵而不露锋芒的方式，余香可久留堂中。"
 jxp_mae_outer_daimyo_balance:0 "外样之衡"
 jxp_mae_outer_daimyo_balance_desc:0 "强大而不轻举，富庶而能自抑。前田家的处世之道，在强邻、中枢与诸侯目光之间寻找安稳距离。"

 SBA_ideas:0 "斯波理念"
 SBA_ideas_start:0 "斯波传统"
 SBA_ideas_bonus:0 "斯波野心"
 jxp_sba_military_office:0 "武卫家声"
 jxp_sba_military_office_desc:0 "斯波氏旧称武卫，家名与幕府军职相连。旧称号不只唤起秩序记忆，也要求家臣熟悉军阵旧法。"
 jxp_sba_three_provinces:0 "三国守护"
 jxp_sba_three_provinces_desc:0 "越前、尾张、远江的旧领散落四方。斯波家若要复兴，必须学会以制度系住相隔甚远的土地。"
 jxp_sba_kanrei_consolidation:0 "管领职权"
 jxp_sba_kanrei_consolidation_desc:0 "管领不只是荣誉称谓，更是调停诸家、传达将军意志的旧制度。斯波家可以借此重塑名分。"
 jxp_sba_atsuta_shrine:0 "热田神宫"
 jxp_sba_atsuta_shrine_desc:0 "热田神宫的草薙旧闻为尾张披上神话之衣。斯波家以祭礼联结武威与神国记忆。"
 jxp_sba_northern_access:0 "北国通路"
 jxp_sba_northern_access_desc:0 "沿海与山道把尾张、越前和北陆连为商路。道路畅通，旧领之间的货物、军令与传闻才会再次流动。"
 jxp_sba_retainers:0 "重臣诸流"
 jxp_sba_retainers_desc:0 "织田、朝仓、甲斐诸流曾在斯波旧秩序下起落。若能约束重臣，家名便不再只是被人挟持的旗帜。"
 jxp_sba_mogami_branch:0 "最上分流"
 jxp_sba_mogami_branch_desc:0 "分流远在奥羽，却仍保存斯波血脉的另一种可能。广布的亲族也能成为复兴时的凭借。"

 YMN_ideas:0 "山名理念"
 YMN_ideas_start:0 "山名传统"
 YMN_ideas_bonus:0 "山名野心"
 jxp_ymn_nitta_descent:0 "新田之裔"
 jxp_ymn_nitta_descent_desc:0 "山名氏自称承袭新田源氏。血统叙事未必能直接赢得战役，却能在诸家会盟时添上一层旧望。"
 jxp_ymn_grand_shugo:0 "六分一殿"
 jxp_ymn_grand_shugo_desc:0 "昔日山名领国广大，号称六分之一殿。旧梦虽远，仍足以激励家臣追索失地。"
 jxp_ymn_succession_mediation:0 "相续调停"
 jxp_ymn_succession_mediation_desc:0 "山名家长于在诸支、姻亲与邻国之间调停继承纷争。会调停者，也能在纷争中找到机会。"
 jxp_ymn_western_army:0 "西军旗帜"
 jxp_ymn_western_army_desc:0 "应仁之乱的旧影仍在京洛街巷回响。西军之名提醒山名武士，畿内秩序也曾因他们而改写。"
 jxp_ymn_torinin:0 "东林院所藏"
 jxp_ymn_torinin_desc:0 "寺院文书与旧宝保存着山名兴衰的证据。掌握记忆，便能掌握何者为正统的说法。"
 jxp_ymn_isolated_heartland:0 "但马山国"
 jxp_ymn_isolated_heartland_desc:0 "但马山深路窄，易守难攻。孤绝未必只是困境，有时也是保存家名的屏障。"
 jxp_ymn_branch_reunion:0 "诸支再合"
 jxp_ymn_branch_reunion_desc:0 "山名诸支若各守私怨，旧家只会日渐稀薄。若能合议共立，则西国旧望尚可再振。"

 AKM_ideas:0 "赤松理念"
 AKM_ideas_start:0 "赤松传统"
 AKM_ideas_bonus:0 "赤松野心"
 jxp_akm_harima_shugo:0 "播磨守护"
 jxp_akm_harima_shugo_desc:0 "播磨介于山阳与畿内之间，田亩、港津与山城相互支撑。赤松家以此守望西国门户。"
 jxp_akm_enshin_standard:0 "圆心旗印"
 jxp_akm_enshin_standard_desc:0 "赤松圆心的旧功仍为家臣所传。旗印升起时，播磨武士记得本家曾在天下大乱中立身。"
 jxp_akm_kakitsu_shadow:0 "嘉吉余影"
 jxp_akm_kakitsu_shadow_desc:0 "嘉吉之变既是污名，也是警告。赤松家比旁人更懂宫廷、幕府与阴谋之间的危险距离。"
 jxp_akm_banshu_roads:0 "播州山道"
 jxp_akm_banshu_roads_desc:0 "山阳道、街驿与关所连缀播磨内外。道路掌握在手，兵粮与文书便不会误期。"
 jxp_akm_castle_network:0 "西播城网"
 jxp_akm_castle_network_desc:0 "支城与砦垒环护山河。赤松家宁愿让敌人一步一步撞上石垣，也不把命运押给一座孤城。"
 jxp_akm_red_pine_retainers:0 "赤松被官"
 jxp_akm_red_pine_retainers_desc:0 "旧臣、国人与分家共同支撑播磨秩序。能让他们各得其位，赤松家便可重聚兵力。"
 jxp_akm_western_kinai_claims:0 "西畿旧望"
 jxp_akm_western_kinai_claims_desc:0 "赤松的野心从不止于播磨。只要畿内仍乱，旧守护便能把西国门户说成进取京洛的凭据。"

 KKC_ideas:0 "菊池理念"
 KKC_ideas_start:0 "菊池传统"
 KKC_ideas_bonus:0 "菊池野心"
 jxp_kkc_kyushu_lineage:0 "九州名门"
 jxp_kkc_kyushu_lineage_desc:0 "菊池家在肥后旧望甚高，忠义传说与南朝记忆交织，使家名带有不同寻常的道义色彩。"
 jxp_kkc_land_of_fire:0 "火国武士"
 jxp_kkc_land_of_fire_desc:0 "肥后旧称火国，山野峻烈，人心刚毅。菊池武士在火山与平原之间磨练筋骨。"
 jxp_kkc_aso_shrine:0 "阿苏神社"
 jxp_kkc_aso_shrine_desc:0 "阿苏社的祭礼牵连豪族与百姓。神前盟誓能把肥后诸势暂时聚在同一面旗帜下。"
 jxp_kkc_foreign_resistance:0 "御敌旧义"
 jxp_kkc_foreign_resistance_desc:0 "九州记得异国船影与海防警讯。菊池家以守土之名整饬堡垒与乡兵。"
 jxp_kkc_religious_coexistence:0 "诸信并存"
 jxp_kkc_religious_coexistence_desc:0 "山社、佛寺与外来信仰在九州相遇。强行一律未必可行，谨慎调停反而能使地方安宁不因祭坛纷争而碎裂。"
 jxp_kkc_three_retainers:0 "三重臣"
 jxp_kkc_three_retainers_desc:0 "重臣若能辅政而不专权，便可在家名衰微时维持政务与军令。"
 jxp_kkc_kumamoto_castle:0 "隈本城"
 jxp_kkc_kumamoto_castle_desc:0 "肥后要冲需有坚城镇守。隈本城垣越厚，菊池家越能在九州角逐中保有喘息之地。"

 STK_ideas:0 "佐竹理念"
 STK_ideas_start:0 "佐竹传统"
 STK_ideas_bonus:0 "佐竹野心"
 jxp_stk_hitachi_genji:0 "常陆源氏"
 jxp_stk_hitachi_genji_desc:0 "佐竹家以源氏旧名自重，在关东诸豪之间保有古老声望。名门血脉能使号令更易入耳。"
 jxp_stk_dual_administration:0 "两头政治"
 jxp_stk_dual_administration_desc:0 "本家与分支、城主与奉行并行理政。若能调和两头，广阔常陆便不至于散成碎片。"
 jxp_stk_ikki_suppression:0 "镇抚一揆"
 jxp_stk_ikki_suppression_desc:0 "村社与寺门一旦结众，便足以动摇城下。佐竹家以威令与怀柔并用，求得领内不乱。"
 jxp_stk_kashima_jingu:0 "鹿岛神宫"
 jxp_stk_kashima_jingu_desc:0 "鹿岛之神护持武艺，武士在神前祈胜，也在神名下学习纪律与节制。"
 jxp_stk_eastern_coalitions:0 "东方合纵"
 jxp_stk_eastern_coalitions_desc:0 "关东局势从无孤立胜者。佐竹家善于在小田、宇都宫、结城与奥羽诸势间寻求可用同盟。"
 jxp_stk_mito_castle:0 "水户城"
 jxp_stk_mito_castle_desc:0 "水户扼常陆交通，背山面海。谁掌水户，谁便能把关东北路纳入一套军政秩序。"
 jxp_stk_fidelity:0 "义重之节"
 jxp_stk_fidelity_desc:0 "忠义之名在乱世常被嘲笑，却仍能凝聚一批愿为家名死战的武士。"

 TKI_ideas:0 "土岐理念"
 TKI_ideas_start:0 "土岐传统"
 TKI_ideas_bonus:0 "土岐野心"
 jxp_tki_genji_mino:0 "美浓源氏"
 jxp_tki_genji_mino_desc:0 "土岐家以美浓源氏为荣。纵然旧权被侵夺，血统与守护旧职仍可成为复兴的凭依。"
 jxp_tki_ranjatai:0 "兰奢待之誉"
 jxp_tki_ranjatai_desc:0 "名香、宝物与朝廷记忆交织成高贵的象征。土岐家以风雅证明自身不只是地方武门，雅名亦可传诸后世。"
 jxp_tki_balloonflower_banner:0 "桔梗旗"
 jxp_tki_balloonflower_banner_desc:0 "桔梗纹在美浓军阵中飘扬，提醒武士旧家尚未被斋藤阴影完全吞没。"
 jxp_tki_inabayama_castle:0 "稻叶山城"
 jxp_tki_inabayama_castle_desc:0 "稻叶山俯瞰浓尾平野，是美浓权力的要石。得其城者，方能号令诸郡。"
 jxp_tki_manor_audits:0 "庄园检核"
 jxp_tki_manor_audits_desc:0 "寺社、贵族与武家旧领交错如乱麻。重新检核文书，才能把流失的收益收回国中。"
 jxp_tki_saito_house:0 "斋藤旧臣"
 jxp_tki_saito_house_desc:0 "敌对者亦可成为可用之才。土岐家若能收编斋藤旧臣，便可把篡夺、密谋与政务经验反用为复兴之术。"
 jxp_tki_three_rivers:0 "三川治水"
 jxp_tki_three_rivers_desc:0 "木曾、长良、揖斐三川滋养美浓，也常以洪水警告人心。治水既是民政，也是军粮之源。"

 UTN_ideas:0 "宇都宫理念"
 UTN_ideas_start:0 "宇都宫传统"
 UTN_ideas_bonus:0 "宇都宫野心"
 jxp_utn_fujiwara_descent:0 "藤原之胄"
 jxp_utn_fujiwara_descent_desc:0 "宇都宫家以藤原旧流自居，兼具武家与公家叙事的余光。名门故事使关东谈判多一分分量。"
 jxp_utn_yoichi_legacy:0 "那须与一遗风"
 jxp_utn_yoichi_legacy_desc:0 "扇之的的传说仍在弓马之士间流传。箭矢所向，不只是敌阵，也是武家荣耀。"
 jxp_utn_shirakawa_barrier:0 "白河关"
 jxp_utn_shirakawa_barrier_desc:0 "白河关是奥羽与关东之间的古老门槛。守住关隘，便能守住南北往来的节奏。"
 jxp_utn_western_branches:0 "西国分支"
 jxp_utn_western_branches_desc:0 "远方分支维系着家名的旁脉。即使山河阻隔，亲族书札仍可成为外交与继嗣的纽带。"
 jxp_utn_oyama_annexation:0 "小山并吞"
 jxp_utn_oyama_annexation_desc:0 "并吞邻近豪族需要名分、武力与耐心。宇都宫家从关东纷争中学会把胜利写进谱牒。"
 jxp_utn_kanto_mediator:0 "关东调人"
 jxp_utn_kanto_mediator_desc:0 "镰仓公方、古河公方与诸豪之间争端不断。懂得调停者，往往能在战场之外获得土地。"
 jxp_utn_mount_nikko:0 "日光山"
 jxp_utn_mount_nikko_desc:0 "日光山的神佛光芒照及下野。朝山、祭礼与僧众网络使宇都宫统治更具庄严名分。"
