l_english:
 jxp_b_decision_revise_colonial_charter_title:0 "重议海外殖民章程"
 jxp_b_decision_revise_colonial_charter_desc:0 "既有章程塑造了土地、税役、军备与信仰的利益。若要改变海外社会的根本方向，国家必须补偿旧有特许、重新登记权利，并承受多年争执；过去采用过的章程不会再次带来开创时的额外收益。"

 jxp_colonial_charter.1.t:0 "海外聚落应奉何种章程"
 jxp_colonial_charter.1.d:0 "泊地已出现常住家庭、法庭与自卫组织。商人要求以朱印状保障市场，当地盟友要求把旧约写入港规，军役众、教团和水军各自提出另一套秩序。章程不会只是奖赏：它也决定谁能征税、持兵、任命神职和代表聚落。"
 jxp_colonial_charter.1.a:0 "颁给御朱印日本町章程。"
 jxp_colonial_charter.1.b:0 "把聚落编为军役开拓地。"
 jxp_colonial_charter.1.c:0 "承认寺院与教会共同体。"
 jxp_colonial_charter.1.free_port:0 "允许自由港与私帆会所自治。"
 jxp_colonial_charter.1.e:0 "设立国家海军屯驻地。"

 jxp_colonial_charter.2.t:0 "重议海外殖民章程"
 jxp_colonial_charter.2.d:0 "旧章程的受益者带着契书、债券和武装随从来到评议席。重新定向或许能解决眼前失衡，却不可能抹去已形成的土地、信仰与自治权；任何选择都将留下二十年的制度冷却期。"
 jxp_colonial_charter.2.a:0 "改行御朱印日本町章程。"
 jxp_colonial_charter.2.b:0 "改编为军役开拓地。"
 jxp_colonial_charter.2.c:0 "改组为寺院与教会共同体。"
 jxp_colonial_charter.2.free_port:0 "改设自由港与私帆会所。"
 jxp_colonial_charter.2.e:0 "改由国家海军屯驻。"
 jxp_colonial_charter.2.f:0 "维持现行权利，不在此时激起争讼。"

 jxp_b_91_charter_red_seal_town:0 "御朱印日本町"
 jxp_b_91_charter_red_seal_town_desc:0 "商人、通事与当地统治者依朱印状和港区许可维持共同市场；贸易与外交兴盛，本土却难以逐项控制。"
 jxp_b_91_charter_military_settlement:0 "军役开拓地"
 jxp_b_91_charter_military_settlement_desc:0 "浪人、武士与家属以土地换取守备和民兵义务；边疆更坚固，土地冲突与军人自立的风险也更高。"
 jxp_b_91_charter_faith_community:0 "寺院与教会共同体"
 jxp_b_91_charter_faith_community_desc:0 "寺院、教会、会众或清真港区承担教育、救济和共同生活，也会争取独立于本土官员的任命权。"
 jxp_b_91_charter_free_port:0 "自由港与私帆殖民地"
 jxp_b_91_charter_free_port_desc:0 "港商、移民与私帆船主以宽松港规吸引人员和货物；财富迅速聚集，宗主控制则日渐稀薄。"
 jxp_b_91_charter_naval_station:0 "海军屯驻地"
 jxp_b_91_charter_naval_station_desc:0 "国家船厂、粮仓和常驻水军保障远洋补给，也把高额军费与强硬任命带到当地社会。"
 jxp_b_91_charter_reform_cooldown:0 "殖民章程定制期"
 jxp_b_91_charter_reform_cooldown_desc:0 "新旧权利正在重新登记；在这一代人的契约履行完毕前，章程不能再次整体改写。"
 jxp_b_91_charter_reform_strain:0 "章程改制争讼"
 jxp_b_91_charter_reform_strain_desc:0 "失去旧特许的行会、神职与军役众正在索取补偿，殖民财政暂时承压。"

 jxp_b_91_red_seal_charter_tt:0 "贸易与地方盟约将受重视；本土对日常港务的控制会略有放松。"
 jxp_b_91_military_charter_tt:0 "防御与军役将受重视；军屯扩张可能损害地方盟约。"
 jxp_b_91_faith_charter_tt:0 "教团将组织教育与救济，同时获得更大的地方自主。"
 jxp_b_91_free_port_charter_tt:0 "贸易、私帆和移民将迅速发展，本土控制会显著下降。"
 jxp_b_91_naval_station_charter_tt:0 "舰队与补给将由国家直接经营，地方社会可能反感军事官僚。"
 jxp_b_91_keep_current_charter_tt:0 "保留现行章程，已经支付的评议费用不会退还。"
