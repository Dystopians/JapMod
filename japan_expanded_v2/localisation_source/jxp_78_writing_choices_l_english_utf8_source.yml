l_english:
 jxp_ikko.2.b:0 "把寺内町编入领国法度"
 jxp_ikko.3.b:0 "让门徒卸甲守业"
 jxp_ikko.4.b:0 "以石山仓廪赈济近畿"
 jxp_ikko.5.b:0 "令门徒远守禁里之外"
 jxp_ikko.7.b:0 "由坊官统摄共同体"
 jxp_wokou.2.b:0 "改授护航朱印"
 jxp_wokou.3.b:0 "把对马牙人纳入关津"
 jxp_wokou.4.b:0 "由奉行绘定强制航路"
 jxp_wokou.5.b:0 "以贡舶条约约束琉球海门"
 jxp_wokou.6.b:0 "招安海商，设关征税"
 jxp_rangaku.1.b:0 "准许私塾分译兰书"
 jxp_confucian.1.b:0 "令乡校兼守社祭"
 jxp_kaikyo.2.b:0 "保留港町诸教旧例"
 jxp_kaikyo.3.b:0 "让朝觐船兼载学者"
 jxp_kaikyo.7.b:0 "以国司法庭节制卡迪"
 jxp_kaikyo.8.b:0 "只订商约，不纳南洋习俗"
 jxp_reformed.2.b:0 "只准士林传抄译经"
 jxp_reformed.3.b:0 "让各港长老共署盟约"
 jxp_reformed.7.b:0 "将兰学并入藩校课业"
 jxp_reformed.8.b:0 "令港口长老服从町奉行"
 jxp_kirishitan.8.b:0 "保留长崎教区的王权监护"
 jxp_kirishitan.10.b:0 "将海上修会编入军令"
