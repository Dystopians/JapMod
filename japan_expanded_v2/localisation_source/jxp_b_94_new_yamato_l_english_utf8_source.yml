 jxp_b_94_form_new_yamato_title:0 "缔造新大和合众国"
 jxp_b_94_form_new_yamato_desc:0 "彼岸诸港已不再只是本土官署的临时出张所。八座城市、三处港埠与成文盟约足以支撑一个扎根西岸的共同国家；惟有在居民认同成熟、本土控制衰退或殖民地已经独立之后，诸城方可共同封存旧总督之印，召开制宪会议。"
 jxp_b_94_agent_a_refresh_interface_tt:0 "新国家的任务、理念与一级政体登记将向整合端发出刷新请求；在整合完成前，现有内容仍可独立运行。"

 jxp_iface_colonial_self_rule:0 "海外自治已经确立"
 jxp_iface_colonial_independence:0 "海外独立已经获致"
