 jxp_b_94_blue_water_fleet:0 "蓝水守备舰队"
 jxp_b_94_two_shores_program:0 "两岸经略纲领"
 jxp_b_94_frontier_muster_strain:0 "边地动员负担"
 jxp_b_94_merchant_concessions:0 "海商特许负担"
 jxp_b_94_constitutional_deadlock:0 "制宪僵局"

 jxp_b_94_mission_pacific_shore_foundation_title:0 "立足太平洋岸"
 jxp_b_94_mission_pacific_shore_foundation_desc:0 "从北方多雾的海湾到南方干燥的岬角，诸聚落必须承认彼此属于同一条海岸。测绘、灯标和共同航路将把零散港口连成国土。"
 jxp_b_94_mission_harbor_survey_office_title:0 "设海岸测绘所"
 jxp_b_94_mission_harbor_survey_office_desc:0 "熟知潮汐的船头、丈量田界的书吏与本地向导应在同一张图上工作。国家将承担首批测绘费用，以换取可靠的港图。"
 jxp_b_94_mission_mountain_pass_roads_title:0 "开山口驿路"
 jxp_b_94_mission_mountain_pass_roads_desc:0 "海岸城市若被山脉彼此隔断，盟约便只是纸面文章。修通驿路和桥梁虽耗费官费，却能让政令、民兵与货物穿越内陆。"
 jxp_b_94_mission_northern_frontier_watch_title:0 "巡守北方边疆"
 jxp_b_94_mission_northern_frontier_watch_desc:0 "北方航路以海雾、寒潮和漫长补给线考验国家。番所与巡逻队必须既能保护居民，也不把边疆变成无尽的军费黑洞。"
 jxp_b_94_mission_coastal_defense_circuit_title:0 "连结海岸守备"
 jxp_b_94_mission_coastal_defense_circuit_desc:0 "单个港口的炮台抵挡不了沿岸机动的舰队。统一信号、补给尺度和巡航时刻，方可构成真正的海岸防线。"
 jxp_b_94_mission_continental_horizon_title:0 "越过大陆地平线"
 jxp_b_94_mission_continental_horizon_desc:0 "新大和已从登陆点成长为大陆国家。扩展边疆必须以新的地方盟约为伴，否则拓殖只会把旧世界的命令复制到更远之处。"

 jxp_b_94_mission_first_local_compact_title:0 "订立首份地方盟约"
 jxp_b_94_mission_first_local_compact_desc:0 "渔村、农垦地、寺堂与港町必须共同约定税役、道路和守备。盟约赋予居民发言权，也使远方官署的直接命令逐渐失去效力。"
 jxp_b_94_mission_township_rolls_title:0 "编定乡镇名册"
 jxp_b_94_mission_township_rolls_desc:0 "名册不只记录纳税户，也记录谁有权参加会议、承担救济和服边地公役。它将移民社会从临时营地变成有责任的共同体。"
 jxp_b_94_mission_assembly_halls_title:0 "遍设公议会所"
 jxp_b_94_mission_assembly_halls_desc:0 "国家宪制不能只存在于首都。各地会所应按公开程式保存议案、账册与请愿，让地方之声进入联邦政务。"
 jxp_b_94_mission_religious_concord_title:0 "缔结信仰和约"
 jxp_b_94_mission_religious_concord_desc:0 "神社、佛寺、教会与本地礼俗同处一座港城。与其让旧大陆的宗门争端漂洋而来，不如以公共治安和信仰自守划定共同底线。"
 jxp_b_94_mission_frontier_citizenship_title:0 "授予边地公民权"
 jxp_b_94_mission_frontier_citizenship_desc:0 "守卫山口、开垦土地和维护驿路者不应永远只是临时住民。公民权将权利与役务相连，也令边疆真正进入国家。"
 jxp_b_94_mission_union_fulfilled_title:0 "成全合众之约"
 jxp_b_94_mission_union_fulfilled_desc:0 "当居民首先以新大和自称，而各地仍愿依盟约合作，合众便不再是权宜安排。长久国约可以由此经受战争与政争。"

 jxp_b_94_mission_red_seal_inheritance_title:0 "承继朱印航路"
 jxp_b_94_mission_red_seal_inheritance_desc:0 "先辈携来的朱印状已经褪色，航海知识与商人信用却仍可使用。新国家将把私人关系改造成受公共法约束的跨洋贸易。"
 jxp_b_94_mission_harbor_warehouses_title:0 "建立港埠公仓"
 jxp_b_94_mission_harbor_warehouses_desc:0 "跨洋货物不能只靠船主的私库周转。由诸港共同出资的公仓可平抑缺粮和船期波动，但建设费用必须由本代承担。"
 jxp_b_94_mission_oceanic_shipyards_title:0 "扩建大洋船渠"
 jxp_b_94_mission_oceanic_shipyards_desc:0 "适应内海的船只未必能横越大洋。船渠必须融合日本木作、当地木材和远洋帆装，并付出重新训练匠人的代价。"
 jxp_b_94_mission_oceanic_public_credit_title:0 "创设公共信用"
 jxp_b_94_mission_oceanic_public_credit_desc:0 "长程航运需要跨越数季的信用。公开税账和偿付次序能够降低借贷成本，但政府必须先以真金白银证明承诺。"
 jxp_b_94_mission_two_ocean_exchange_title:0 "贯通两洋交换"
 jxp_b_94_mission_two_ocean_exchange_desc:0 "西岸港市面向太平洋，也通过陆路接近另一片大洋。商路、使节和章程若能彼此承认，新大和即可成为两洋之间的经纪人。"
 jxp_b_94_mission_pacific_common_market_title:0 "太平洋共同市场"
 jxp_b_94_mission_pacific_common_market_desc:0 "共同尺度、仲裁规则和港税上限将扩大贸易，却也要求中央放弃随意征敛。繁荣应来自可预期的制度，而非一次性的特许。"

 jxp_b_94_mission_foundation_convention_title:0 "完成建国会议"
 jxp_b_94_mission_foundation_convention_desc:0 "新大和必须在议会、军务、商社与王统之间作出根本选择。任何道路都有维护者，也都有必须公开承担的代价。"
 jxp_b_94_mission_elected_offices_title:0 "厘定公职任期"
 jxp_b_94_mission_elected_offices_desc:0 "不论执政者由选举还是王统产生，地方官署都应按任期述职。稳定的权威来自程式和信用，而非不断更换的私恩。"
 jxp_b_94_mission_separated_ledgers_title:0 "分置政财账册"
 jxp_b_94_mission_separated_ledgers_desc:0 "军费、港税与地方工程若混在一本账中，任何监督都无从谈起。分署记账会增加文书成本，却能减少挪用和权臣垄断。"
 jxp_b_94_mission_civilian_command_title:0 "文官节制军务"
 jxp_b_94_mission_civilian_command_desc:0 "边疆国家离不开军队，也不能让每一次危机都成为军头扩权的借口。预算、任命和动员期限必须接受公共机关审议。"
 jxp_b_94_mission_harbor_petitions_title:0 "听取诸港请愿"
 jxp_b_94_mission_harbor_petitions_desc:0 "港町带来税收，也承担封锁、瘟疫与船难。让他们以成文请愿进入中央议程，是检验合众制度是否真实的尺度。"
 jxp_b_94_mission_enduring_constitution_title:0 "铸成长久国约"
 jxp_b_94_mission_enduring_constitution_desc:0 "宪制必须经得住派系轮替和边疆扩张。若公职、财政和请愿均已有常法，新大和便可把建国时的妥协变为国家传统。"

 jxp_b_94_mission_self_rule_proclaimed_title:0 "宣告海外自治"
 jxp_b_94_mission_self_rule_proclaimed_desc:0 "本土旧印仍可被尊重，却不再能越过大洋支配每一项地方事务。自治是居民承担责任的开始，而非免除义务的借口。"
 jxp_b_94_mission_severed_governor_seals_title:0 "封存总督旧印"
 jxp_b_94_mission_severed_governor_seals_desc:0 "当旧总督之印被收进档案库，国家才真正以自己的名义行事。此举会带来庆典，也会留下外交与财政上的沉重余波。"
 jxp_b_94_mission_pacific_embassy_title:0 "派遣太平洋使团"
 jxp_b_94_mission_pacific_embassy_desc:0 "独立不等于遗忘来处。使团应以平等国书重访日本诸政权，并说明新大和既非失土，也非叛乱者的临时营寨。"
 jxp_b_94_mission_blue_water_guard_title:0 "编成蓝水守备舰队"
 jxp_b_94_mission_blue_water_guard_desc:0 "跨洋国家必须保护商船、使节和补给，而非只在近岸展示旗帜。远洋训练昂贵，却是独立外交不可替代的基础。"
 jxp_b_94_mission_eastward_delegation_title:0 "筹备东归代表团"
 jxp_b_94_mission_eastward_delegation_desc:0 "东归不是重受本土统治，而是带着新制度、新贸易与新身份重返太平洋西岸。代表团必须拥有足够财力与航海保障。"
 jxp_b_94_mission_commonwealth_of_two_shores_title:0 "两岸共同体"
 jxp_b_94_mission_commonwealth_of_two_shores_desc:0 "一个成熟的新大陆国家如今可以选择把力量投向太平洋彼岸，或先完成本大陆的共和国事业。两种雄心都需支付真实成本，也都不应以免费征服代替政治。"

 jxp_new_yamato.1.t:0 "新大和建国会议"
 jxp_new_yamato.1.d:0 "诸城的代表、边疆守备队、朱印商与旧武家齐聚会所。旧总督之印已经封存，但新国家究竟由谁执政、如何分配港税与兵权，仍须在今夜写入根本国约。"
 jxp_new_yamato.1.a:0 "诸港与诸州共组联邦议会。"
 jxp_new_yamato.1.b:0 "让边疆军务共和国守住自由。"
 jxp_new_yamato.1.c:0 "以海商合众维系大洋航路。"
 jxp_new_yamato.1.e:0 "拥立能调和两岸传统的大洋王统。"

 jxp_new_yamato.2.t:0 "两种文字的乡镇名册"
 jxp_new_yamato.2.d:0 "书吏发现，同一条河流、山口和聚落在移民口述与本地语言中各有名称。若名册只采旧国格式，官署便难以理解脚下土地；若全面改写，又有人担心与祖先的记忆断绝。"
 jxp_new_yamato.2.a:0 "让两片土地的名称并列入册。"
 jxp_new_yamato.2.b:0 "保持本土书式，以免政令失序。"

 jxp_new_yamato.3.t:0 "边疆土地该授予谁"
 jxp_new_yamato.3.d:0 "新开道路两侧出现大片可垦之地。乡镇请求把土地分给自耕户，守备官则主张设屯田，以军役换取地权。任何选择都会塑造数代人的边疆社会。"
 jxp_new_yamato.3.a:0 "支持承担公共役务的自耕户。"
 jxp_new_yamato.3.b:0 "以军役屯垦确保边防。"

 jxp_new_yamato.4.t:0 "港商请求新的特许"
 jxp_new_yamato.4.d:0 "海商愿意扩大跨洋信用，却要求免除若干地方税并自设仲裁。财政官认为国家应直接经营公仓，以免公共航路沦为几家商号的私产。"
 jxp_new_yamato.4.a:0 "准许有限自治，但撤去一项重商壁垒。"
 jxp_new_yamato.4.b:0 "由公共仓库和官定账册掌握航路。"

 jxp_new_yamato.5.t:0 "诸信仰共守一座港"
 jxp_new_yamato.5.d:0 "祭礼路线与礼拜时刻在港区发生冲突。各宗门愿意签署治安和约，但保守官员要求由国家指定唯一公共仪式。"
 jxp_new_yamato.5.a:0 "以宽容换取共同守法。"
 jxp_new_yamato.5.b:0 "确立统一仪式，即使议会为此争执。"

 jxp_new_yamato.6.t:0 "谁来掌握边疆民兵"
 jxp_new_yamato.6.d:0 "边境警报使民兵迅速集结。将军请求建立常设指挥权，议员则坚持预算和动员期限必须由文官机关批准。"
 jxp_new_yamato.6.a:0 "授予军务机关更稳定的动员权。"
 jxp_new_yamato.6.b:0 "让军队受公议与年度预算节制。"

 jxp_new_yamato.7.t:0 "港口请愿与制宪僵局"
 jxp_new_yamato.7.d:0 "诸港联合反对一项临时附加税，中央官署则称舰队急需经费。若退回议会重议，改革会被延误；若强行维持，地方盟约将留下裂痕。"
 jxp_new_yamato.7.a:0 "撤回法案，依国约重新审议。"
 jxp_new_yamato.7.b:0 "维持紧急征收，尽快结束争执。"

 jxp_new_yamato.8.t:0 "来自日本的使节"
 jxp_new_yamato.8.d:0 "一艘悬挂旧式家纹的船驶入港湾。使节带来本土政权的国书，却仍以昔日殖民地口吻称呼我们。议会须决定以何种身份回应。"
 jxp_new_yamato.8.a:0 "以平等国书开启东归使路。"
 jxp_new_yamato.8.b:0 "先巩固大陆，不接受含混的旧称。"

 jxp_new_yamato.9.t:0 "封存最后一枚总督印"
 jxp_new_yamato.9.d:0 "旧总督府的最后一枚印章被送到议会。有人主张公开宣布独立完成，以此终结一切争议；也有人认为应低调归档，避免让庆典压过制度建设。"
 jxp_new_yamato.9.a:0 "向诸港宣告独立已经完成。"
 jxp_new_yamato.9.b:0 "将它归档，让国约而非仪式说话。"

 jxp_new_yamato.10.t:0 "面向两岸的国家"
 jxp_new_yamato.10.d:0 "舰队、信用与使路都已成熟。议会面前有两份纲领：一份主张以长期投资建立跨太平洋共同体，另一份要求先在新大陆完成自由而稳固的共和国。"
 jxp_new_yamato.10.a:0 "投资东归航路，准备两岸经略。"
 jxp_new_yamato.10.b:0 "先完善本大陆的合众事业。"

 NYA_ideas:0 "新大和理念"
 NYA_ideas_desc:0 "新大和由跨洋记忆、地方盟约和边疆生活共同塑造。它既不复制本土旧制，也不否认来自太平洋彼岸的语言、工艺与政治遗产。"
 NYA_ideas_start:0 "新大和传统"
 NYA_ideas_bonus:0 "新大和雄心"
 nya_two_shores_memory:0 "两岸记忆"
 nya_two_shores_memory_desc:0 "学校同时讲述渡海先民和脚下大陆的历史，使新身份不必依赖遗忘任何一岸。"
 nya_harbor_compacts:0 "诸港盟约"
 nya_harbor_compacts_desc:0 "港町以共同税则、救难责任和仲裁程式维系长程贸易。"
 nya_frontier_smallholders:0 "边疆自耕户"
