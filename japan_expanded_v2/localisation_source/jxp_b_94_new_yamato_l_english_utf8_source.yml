 jxp_iface_b_nya_eastward_contact:0 "新大和东归使路已经建立"
 jxp_iface_b_nya_eastward_capstone_ready:0 "两岸共同体议程已经成熟"

 jxp_b_94_federal_assembly_reform:0 "诸港联邦议会"
 jxp_b_94_federal_assembly_reform_desc:0 "各港、各郡与边疆聚落按约派出议员，中央只掌共同防务、关税与对外使节。此制能够容纳辽阔边地，却要求任何重大法令都经过漫长的协商。"
 jxp_b_94_frontier_military_republic_reform:0 "边疆军务共和国"
 jxp_b_94_frontier_military_republic_reform_desc:0 "海岸守备队、屯垦村与船手众共同推举执政官。国家以迅速动员换取生存，但军役负担也会不断挤压地方自治。"
 jxp_b_94_merchant_commonwealth_reform:0 "海商合众国"
 jxp_b_94_merchant_commonwealth_reform_desc:0 "朱印商、港町年寄与远洋船主以认股和盟誓维系国家。贸易因此畅达，然而边远州郡必须警惕公共权力被账房所吞没。"
 jxp_b_94_oceanic_monarchy_reform:0 "大洋王政"
 jxp_b_94_oceanic_monarchy_reform_desc:0 "漂洋而来的武家谱系与本地盟约结合为新的王统。王冠为诸港提供连续的外交人格，却须以更高的礼制成本调和世袭权威和移民社会。"

