l_english:
 jxp_route_institution_capstone:0 "日轮国制枢机"
 jxp_reform_sakoku_gosanke_council:0 "御三家评定"
 jxp_reform_sakoku_gosanke_council_desc:0 "亲藩、谱代与老中同列评席，诸侯之名分、江户之威仪、国中之册籍皆由公仪收束。闭门之国若要久安，先须使门内诸声归于一处。"
 jxp_reform_sakoku_kaikin_watchtowers:0 "海禁远见番"
 jxp_reform_sakoku_kaikin_watchtowers_desc:0 "浦役、船手与番士轮值远见，记录异帆、潮汐与海雾。海门不开时，海防反而要看得更远；国法的灯火须先照见黑潮。"
 jxp_reform_open_oceanic_cabinet:0 "远洋参议局"
 jxp_reform_open_oceanic_cabinet_desc:0 "港奉行、豪商、通词与船将同入参议，航路、税簿、商馆与外交不再分属各衙。万里波涛若成国策，便须有一座能听懂风向的朝堂。"
 jxp_reform_open_treaty_port_commission:0 "条约港会审司"
 jxp_reform_open_treaty_port_commission_desc:0 "各国商馆、町年寄与奉行在会审司前校验契纸。海门既开，争端亦随帆影而来；新日本须学会以印信、译词与账册治理远人。"
 jxp_reform_kirishitan_crown_patronage:0 "日轮圣座护持"
 jxp_reform_kirishitan_crown_patronage_desc:0 "王权护持教会，教会见证王权。圣堂钟声与御所鼓声相互应答，诸侯在十字与日轮之前立誓效忠。"
 jxp_reform_kirishitan_deus_vult_council:0 "圣战评议会"
 jxp_reform_kirishitan_deus_vult_council_desc:0 "传教士、武家与港町信众会合议军役，远方的信仰被铸入本土的兵册。拔刀之时，祈祷与号令同在一阵风中。"
 jxp_reform_confucian_rites_ministry:0 "礼部省"
 jxp_reform_confucian_rites_ministry_desc:0 "朝仪、学寮、祭祀、册封与学校归入礼部。朱子之学不只在书案上明理，也在官牒、乡约与朝班之中定天下名分。"
 jxp_reform_confucian_harmonious_codes:0 "三教和同律"
 jxp_reform_confucian_harmonious_codes_desc:0 "神社守其旧仪，佛寺安其香火，儒官正其名分。礼不必毁旧而后立新；能使诸道各得其所，方是王化之深。"
 jxp_reform_imperial_daijokan_cabinets:0 "太政官内阁"
 jxp_reform_imperial_daijokan_cabinets_desc:0 "古官名号与新式合议相并而行，诏书、财政、外交与军令各有卿辅署押。王政复古不是回到旧纸堆里，而是使旧名重获治理之力。"
 jxp_reform_imperial_restoration_guard:0 "王政亲兵府"
 jxp_reform_imperial_restoration_guard_desc:0 "禁里亲卫、诸藩精兵与新式足轻编入亲兵府，奉诏而战，受朝命而赏罚。御所之门后，甲胄声已不再只是仪仗。"
 jxp_reform_reformed_synodic_estates:0 "长老诸身分会"
 jxp_reform_reformed_synodic_estates_desc:0 "武家、町人、港商与会众长老同列议席，以誓约约束赋役与信仰。活字印出的规条，比密室里的口约更能传到远国。"
 jxp_reform_reformed_print_capital:0 "印书都监"
 jxp_reform_reformed_print_capital_desc:0 "经义、医方、航海术与兵书由都监校刻发行。纸页轻薄，却能越过山海，把同一种纪律带给远方的读者。"
 jxp_reform_kaikyo_maritime_diwan:0 "海洋迪万"
 jxp_reform_kaikyo_maritime_diwan_desc:0 "港奉行、卡迪、船主与商旅代表同入海洋迪万，依季风、法学与账册议定航路。日本若向西开门，便须听懂印度洋的语言。"
 jxp_reform_kaikyo_qadi_kanrei_court:0 "卡迪管领裁判所"
 jxp_reform_kaikyo_qadi_kanrei_court_desc:0 "武家管领与卡迪同坐裁判，既问国法，亦问商约与信义。习俗各异，争讼却须有一处能让各方低头的公庭。"
 jxp_reform_ikko_somon_diet:0 "惣中大评定"
 jxp_reform_ikko_somon_diet_desc:0 "寺内町、乡中、讲众与武家旧臣同列大评定。钟声召集的不只是信徒，也是纳粮者、守城者与愿意为共同国法发声的人。"
 jxp_reform_ikko_monto_levy_charter:0 "门徒军役约书"
 jxp_reform_ikko_monto_levy_charter_desc:0 "讲中按村社、町组与寺内账册承担军役。百姓持枪并非乱世余波，而是被誓纸、仓廪与钟楼约束起来的共同责任。"
 jxp_reform_wokou_corsair_council:0 "朱札海寇会"
 jxp_reform_wokou_corsair_council_desc:0 "船主、浪人与水军头目受朱札约束，出海、分赃、换俘、侦查皆有成规。海上自由若被印信拴住，便成国家手中最难预料的利刃。"
 jxp_reform_wokou_tidewater_customs:0 "潮汐关市司"
 jxp_reform_wokou_tidewater_customs_desc:0 "岛港按潮汐开关、验货、修船与征税。黑潮来去无常，关市司却能把无常之水变成可数的船、银与帆。"
