l_english:
 jxp_route_institution_branch_programs:0 "诸道国策"
 jxp_reform_sakoku_fudai_roju_conference:0 "谱代老中评定"
 jxp_reform_sakoku_fudai_roju_conference_desc:0 "以谱代重臣轮值评定诸藩诉讼、边防与年贡。天下既定，政务便要像城郭石垣一样，一层压住一层。"
 jxp_reform_sakoku_terauke_neighborhood_grids:0 "寺请五人组网"
 jxp_reform_sakoku_terauke_neighborhood_grids_desc:0 "寺请、町触与五人组互为表里，令信仰、户籍与邻里责任皆有据可查。门前的名簿，比刀鞘更能维持静谧。"
 jxp_reform_sakoku_namban_cordon_commissions:0 "南蛮禁防奉行"
 jxp_reform_sakoku_namban_cordon_commissions_desc:0 "沿海炮台、番船稽查与译官问讯合为一职。海门可以半开，但守门之人不可打盹。"
 jxp_reform_sakoku_private_learning_license:0 "私塾许可制"
 jxp_reform_sakoku_private_learning_license_desc:0 "在禁令之外保留学问的窄门，许可医术、天文、炮术与舆地之书谨慎流通。纸窗虽薄，也能筛去风浪。"
 jxp_reform_open_red_seal_stock_companies:0 "朱印合本商社"
 jxp_reform_open_red_seal_stock_companies_desc:0 "町众、船头与藩库共同出资远航，以朱印状约束风险与分利。海上获利不再只是豪商私事，也成为国家的账目。"
 jxp_reform_open_translator_state_college:0 "译书国学寮"
 jxp_reform_open_translator_state_college_desc:0 "译者、医师、炮术师与天文生同居一寮，逐句校勘异国文字。世界先成为书页，随后才成为航路。"
 jxp_reform_open_ocean_arsenal_contracts:0 "外洋军船契约"
 jxp_reform_open_ocean_arsenal_contracts_desc:0 "以国家契约督造远洋船、铸炮与缆索，令港町工匠服务于更辽阔的海图。"
 jxp_reform_open_pacific_settlement_board:0 "太平洋屯垦局"
 jxp_reform_open_pacific_settlement_board_desc:0 "把移民、商馆、屯田与护航编入同一套公文。浪头之外也许还有岛屿，岛屿之外仍有可以丈量的天涯。"
 jxp_reform_kirishitan_court_of_patronage:0 "宫廷保教院"
 jxp_reform_kirishitan_court_of_patronage_desc:0 "以宫廷名义授予教团合法庇护，同时要求神父、修会与商馆服从国法。十字若要照耀日轮，须先受国家之印。"
 jxp_reform_kirishitan_confraternity_charities:0 "慈悲兄弟会"
 jxp_reform_kirishitan_confraternity_charities_desc:0 "港町与城下设兄弟会，收容伤病、孤儿与贫民。祈祷声若能安抚街巷，国家便少一分暗火。"
 jxp_reform_kirishitan_missionary_admiralty:0 "传教水师奉行"
 jxp_reform_kirishitan_missionary_admiralty_desc:0 "往来传教船、商船与护航舰队统一登记。钟声沿海而行，舰桅也随之成列。"
 jxp_reform_kirishitan_sun_cross_crusade_council:0 "日轮十字军议"
 jxp_reform_kirishitan_sun_cross_crusade_council_desc:0 "把武家效忠、教团热忱与海外使命置于同一议席。信仰的火不可任其蔓延，却可锻成国家之刃。"
 jxp_reform_confucian_rite_law_ministry:0 "礼法律令省"
 jxp_reform_confucian_rite_law_ministry_desc:0 "礼与法同署，祭祀、乡约、学令与刑名彼此呼应。所谓治国，先使名分可书，然后使政令可行。"
 jxp_reform_confucian_shinto_harmonization_chamber:0 "神儒调和院"
 jxp_reform_confucian_shinto_harmonization_chamber_desc:0 "讲官与社家共定祀典，以儒礼解释神祇之位。神宫仍在清风之中，天下则渐入礼序。"
 jxp_reform_confucian_tenka_examination_routes:0 "天下科举驿路"
 jxp_reform_confucian_tenka_examination_routes_desc:0 "从藩校、驿路到太学，才俊凭书卷入仕。战国旧姓仍可显贵，但要在朱批之前低头。"
 jxp_reform_confucian_east_asian_mandate_commission:0 "东亚王化委员会"
 jxp_reform_confucian_east_asian_mandate_commission_desc:0 "以礼文、册封与军府合办东亚事务。若天下有序，则远方诸邦也应知道何处是朝仪的上座。"
 jxp_reform_imperial_daijokan_ministries:0 "太政官诸省"
 jxp_reform_imperial_daijokan_ministries_desc:0 "复设诸省名目，将旧幕府与诸藩公事并入朝廷文书。王政不只是旗帜更换，而是官署重新发声。"
 jxp_reform_imperial_shrine_constellation:0 "神祇星列制"
 jxp_reform_imperial_shrine_constellation_desc:0 "以伊势、石清水、春日、贺茂等社为星列，编定祭祀与使节往来。神路所至，国威亦至。"
 jxp_reform_imperial_restoration_general_staff:0 "复古参谋本部"
 jxp_reform_imperial_restoration_general_staff_desc:0 "以皇命统合诸藩兵学、炮术与军令。复古不是回到旧日，而是从旧名分中抽出新的军法。"
 jxp_reform_imperial_subject_rank_order:0 "臣籍官位令"
 jxp_reform_imperial_subject_rank_order_desc:0 "把武家、堂上、公卿与地方名族纳入官位秩序。受位之人既得荣耀，也被写进国家的册页。"
 jxp_reform_reformed_hirado_synod_court:0 "平户长老法庭"
 jxp_reform_reformed_hirado_synod_court_desc:0 "港口长老、町年寄与官吏同席裁断教团事务。信仰可有会众，但会众不可脱离国法。"
 jxp_reform_reformed_printed_catechism_bureau:0 "印行教义局"
 jxp_reform_reformed_printed_catechism_bureau_desc:0 "译印教义、海图、炮术与商法，先经审定，再入港町。铅字排列成行，也排列出新的秩序。"
 jxp_reform_reformed_dutch_drill_admiralty:0 "荷兰操练水师"
 jxp_reform_reformed_dutch_drill_admiralty_desc:0 "以北海操练法改造舰炮、棱堡与水师号令。远方寒港的技艺，在日本潮声中重获形状。"
 jxp_reform_reformed_covenant_militia_estates:0 "盟约民兵诸身分"
 jxp_reform_reformed_covenant_militia_estates_desc:0 "以盟约约束城町、乡兵与港口会众，使武装共同体服从国家而非私会。"
 jxp_reform_kaikyo_maritime_shura_council:0 "海上舒拉评定"
 jxp_reform_kaikyo_maritime_shura_council_desc:0 "商人、卡迪、船头与奉行共同议定港法。季风带来的不只是货物，也有可被日本吸纳的商议之道。"
 jxp_reform_kaikyo_waqf_port_endowments:0 "港町瓦合甫"
 jxp_reform_kaikyo_waqf_port_endowments_desc:0 "以港町捐产维持仓廪、桥梁、学校与救济。海贸之利若能回到街市，远航便有了根。"
 jxp_reform_kaikyo_monsoon_ship_register:0 "季风船籍帐"
 jxp_reform_kaikyo_monsoon_ship_register_desc:0 "依季风航期登记船籍、货契与护航责任。南海风信有时，国家文书也须赶上风向。"
 jxp_reform_kaikyo_madrasa_navigation_corps:0 "经学院航海师团"
 jxp_reform_kaikyo_madrasa_navigation_corps_desc:0 "几何、天文、经学与炮术并列授课。朝向麦加的星图，也能指引驶向外洋的船队。"
 jxp_reform_ikko_somon_public_council:0 "惣村公议所"
 jxp_reform_ikko_somon_public_council_desc:0 "寺内町、惣村与门徒代表入堂议事，国政从堂前草鞋声中获得新的根基。"
 jxp_reform_ikko_terauchi_market_law:0 "寺内市法"
 jxp_reform_ikko_terauchi_market_law_desc:0 "寺内町的市座、仓廪与匠户受共同法约束。念佛声旁也有算盘，香烟之下也有税契。"
 jxp_reform_ikko_monto_defense_leagues:0 "门徒防卫讲"
 jxp_reform_ikko_monto_defense_leagues_desc:0 "以讲盟组织乡兵、堀与警钟，使门徒武装从一揆之势转为国家守备。"
 jxp_reform_ikko_equal_oath_commons:0 "平等起请众"
 jxp_reform_ikko_equal_oath_commons_desc:0 "以起请文约束土地、军役与贡纳。平等不是无主，而是众人共同承担一国之责。"
 jxp_reform_wokou_letters_of_black_current:0 "黑潮朱印状"
 jxp_reform_wokou_letters_of_black_current_desc:0 "以朱印特许熟悉黑潮的船头众，令袭扰、护航与远贸各有边界。浪人旧术，终于写上国名。"
 jxp_reform_wokou_island_trade_courts:0 "岛港牙行法庭"
 jxp_reform_wokou_island_trade_courts_desc:0 "岛港法庭调停货契、赎船、私贸与番商争讼。灰色海路不必全被焚毁，也可被收进账册。"
 jxp_reform_wokou_privateering_admiralty:0 "私掠水师奉行"
 jxp_reform_wokou_privateering_admiralty_desc:0 "把私掠、封锁与护航置于水师奉行管辖。刀在浪上出鞘，仍要听见岸上的号令。"
 jxp_reform_wokou_sea_lord_compacts:0 "海主盟约"
 jxp_reform_wokou_sea_lord_compacts_desc:0 "岛主、船头与港町豪商立约效忠，换取海上自治与国家承认。海上诸侯若受盟约束缚，也可成为国力。"
