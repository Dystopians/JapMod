 jxp_a_nobles_kokujin_oaths:0 "国人众起请"
 jxp_a_nobles_kokujin_oaths_desc:0 "以连署起请确认国人与被官的旧知行及守城军役。誓纸能使新附诸众暂安，却也承认地方武家的议价之权。"
 jxp_a_nobles_chigyo_confirmation:0 "知行安堵"
 jxp_a_nobles_chigyo_confirmation_desc:0 "对旧臣、降将与在地武士逐一发给安堵状，使征服后的土地关系有案可循。国家由此少一分纷争，也少一分任意转封的余地。"
 jxp_a_nobles_yorioya_yoriko:0 "寄亲—寄子认可"
 jxp_a_nobles_yorioya_yoriko_desc:0 "承认寄亲统率寄子的军役链条，并令奉行定期核验名簿。此制便于动员，却使陪臣政治更为盘根错节。"
 jxp_a_nobles_castle_town_residences:0 "城下屋敷"
 jxp_a_nobles_castle_town_residences_desc:0 "命主要家臣在城下营造屋敷，使人质、消费与政务都聚于主城。城下因之兴盛，营造负担亦随之加重。"
 jxp_a_nobles_war_levy_assessment:0 "军役段钱"
 jxp_a_nobles_war_levy_assessment_desc:0 "按田段预定战时军役与段钱，免去临阵逐家催征。动员更为迅捷，但乡里与国库都须供养这套常备名簿。"
 jxp_a_nobles_fudai_magistrates:0 "谱代奉行制"
 jxp_a_nobles_fudai_magistrates_desc:0 "以谱代家臣充任常设奉行，专理诉讼、军粮与转封账册。政令较能贯彻，外样与新附诸家却难免疑惧。"
 jxp_a_nobles_tozama_transfer_guarantees:0 "外样转封保障"
 jxp_a_nobles_tozama_transfer_guarantees_desc:0 "约定无大罪不夺外样旧领，以换取他们承认天下裁定。地方因此安静，中央收回土地的手段却受成文约束。"
 jxp_a_nobles_overseas_service_rolls:0 "海外军役名簿"
 jxp_a_nobles_overseas_service_rolls_desc:0 "把船手、铁炮众与诸家远征份额编入专册，为越海军役预置次第。海军动员得益，国内兵役负担亦更为沉重。"
 jxp_a_nobles_hatamoto_direct_service:0 "旗本直臣化"
 jxp_a_nobles_hatamoto_direct_service_desc:0 "从诸家枝族与旧国人中选取旗本，令其越过地方家门直接奉公。直属军势由此精强，俸禄与家中摩擦也一并增加。"
 jxp_a_nobles_monetised_stipends:0 "武家俸禄货币化"
 jxp_a_nobles_monetised_stipends_desc:0 "以金银和定期兑付替代部分实米俸禄，使武家不再完全受一时米价牵制。新制倚赖国家信用，也会把利息风险带入家中。"
 jxp_a_nobles_branch_castle_cadasters:0 "支城与军役检册"
 jxp_a_nobles_branch_castle_cadasters_desc:0 "将支城、兵粮库与守备知行一并登记，令地方防线不再只凭旧家传说。要塞更坚，维持诸城的费用也更高。"
 jxp_a_nobles_house_council_seats:0 "家中评定常席"
 jxp_a_nobles_house_council_seats_desc:0 "准许重臣按席次参与家中评定，以共同背书继承、转封和大战。决策较为稳妥，却不能再由主君独断速行。"
 jxp_a_church_temple_land_confirmation:0 "寺社领安堵"
 jxp_a_church_temple_land_confirmation_desc:0 "确认旧寺社领、祭田与门前役免，使祈祷和地方救济不因战火中断。免税地扩大，也会削弱公仪直接财源。"
 jxp_a_church_kanjin_exemptions:0 "勧进免税"
 jxp_a_church_kanjin_exemptions_desc:0 "准许寺社为桥梁、堂塔与赈济募集勧进，并免除部分关津课役。公共营造得以兴办，征收体系却留下例外。"
 jxp_a_church_doctrinal_arbitration:0 "宗论裁许"
 jxp_a_church_doctrinal_arbitration_desc:0 "由公仪召集宗论并裁定传教界限，使教义争端不至先诉诸兵火。裁判可安人心，也会让宗门更深介入政务。"
 jxp_a_church_jinaimachi_autonomy:0 "寺内町自治"
 jxp_a_church_jinaimachi_autonomy_desc:0 "承认寺内町在市法、夜警与仓廪上的旧例，以换取按期输纳和不开兵门。门前商业繁荣，地方自治也更难收回。"
 jxp_a_church_academies_and_terakoya:0 "学寮与寺子教育"
 jxp_a_church_academies_and_terakoya_desc:0 "令寺院学寮和乡里寺子承担书算教习，为奉行与町役培养能读账册之人。教育渐广，国家须容纳宗门的解释之权。"
 jxp_a_church_charity_hospitals:0 "施药院与义仓"
 jxp_a_church_charity_hospitals_desc:0 "以寺社网络经营施药、义仓与灾年粥场，使饥病不至立刻化为流民。维持此举需要稳定的免役和施入。"
 jxp_a_church_warrior_monks:0 "僧兵保有"
 jxp_a_church_warrior_monks_desc:0 "准许诸山保留有限僧兵，担负山门、道路与圣地守备。其兵可助国防，也可能在宗门不满时反噬公仪。"
 jxp_a_church_overseas_dharma:0 "海外法灯许可"
 jxp_a_church_overseas_dharma_desc:0 "准许受册僧侣和教士随商舶往来，并由奉行核验书信与财货。远方知识由此流入，异端争论也更频繁。"
 jxp_a_church_temple_credit_offices:0 "寺院信用会所"
 jxp_a_church_temple_credit_offices_desc:0 "允许富寺以寄进米、祠堂金和町中存银周转短期信用。国用得一缓手，免税资产却会乘机增长。"
 jxp_a_church_state_appointed_abbots:0 "国家任命住持"
 jxp_a_church_state_appointed_abbots_desc:0 "由公仪确认大寺住持与神职首座，阻止山门私斗和世袭。任命权加强控制，也会伤及宗门自治。"
 jxp_a_church_sect_council_seats:0 "诸宗公议席"
 jxp_a_church_sect_council_seats_desc:0 "按宗派、寺格和地方贡献分配公议席，使教门争端先在席上裁定。诸宗有言路，国家也必须承认他们的集体地位。"
 jxp_a_church_confessional_schools:0 "宗门会众学校"
 jxp_a_church_confessional_schools_desc:0 "准许受国家承认的教门设立会众学校，教授经义、书算和外语。人才来源扩大，宗派界线也随之凝固。"
 jxp_a_burghers_free_markets:0 "乐市乐座"
 jxp_a_burghers_free_markets_desc:0 "废除旧座对若干市日与货物的专断，让来往商贩凭公仪法度交易。市税更广，旧商权的忠诚却会受损。"
 jxp_a_burghers_town_council_autonomy:0 "会合众自治"
 jxp_a_burghers_town_council_autonomy_desc:0 "承认主要都市会合众处理街区、水火与夜警，以定额税换取自治。城町活力上升，中央命令则须先经过商议。"
 jxp_a_burghers_guild_charters:0 "株仲间特许"
 jxp_a_burghers_guild_charters_desc:0 "为同业株仲间发给期限章程，责令其保质、输税并备荒。经营更有秩序，垄断价格也可能随之出现。"
 jxp_a_burghers_mint_management:0 "金座与银座经营"
 jxp_a_burghers_mint_management_desc:0 "委任受审计的金银座收购矿料、铸造货币并公布成色。币制更稳，座商却会要求优先经营权。"
 jxp_a_burghers_warehouse_rice_notes:0 "藏屋敷与米切手"
 jxp_a_burghers_warehouse_rice_notes_desc:0 "认可藏屋敷凭入仓年贡米签发可转让的米切手，使诸藩不必尽待实米售出。周转加快，也放大了米价与信用的牵连。"
 jxp_a_burghers_red_seal_trade:0 "朱印贸易"
 jxp_a_burghers_red_seal_trade_desc:0 "以朱印状登记船主、船员与航路，使海外交易受公仪保护和约束。远洋收益增加，护航与外交开支也随之而来。"
 jxp_a_burghers_company_incorporation:0 "会社发起权"
 jxp_a_burghers_company_incorporation_desc:0 "允许豪商依章程合本经营，明确出资、分红与审计期限。大业得以聚资，町众也会要求在国政中有更重的声音。"
 jxp_a_burghers_port_militias:0 "港口民兵"
 jxp_a_burghers_port_militias_desc:0 "授权港町组织夜警、火消与有限民兵，守护仓库和泊地。海岸防备增强，商人私兵也更难完全裁撤。"
 jxp_a_burghers_courier_houses:0 "飞脚问屋"
 jxp_a_burghers_courier_houses_desc:0 "让飞脚问屋承揽公文、汇兑和行情传递，并按驿程接受检查。价格消息流通更快，维持全国线路亦非无费。"
 jxp_a_burghers_marine_insurance:0 "海运保险"
 jxp_a_burghers_marine_insurance_desc:0 "许可廻船问屋共同分担海难、劫掠与货损，以账簿和见证确定赔付。航运更敢远行，欺诈与串谋也须严查。"
 jxp_a_burghers_public_bond_subscription:0 "国家公债认购"
 jxp_a_burghers_public_bond_subscription_desc:0 "允许町众以定期公债承接军费与营造，换取明确兑付次第。国库获得缓冲，债权人也会要求稳定的政策。"
 jxp_a_burghers_commercial_courts:0 "商事法庭"
 jxp_a_burghers_commercial_courts_desc:0 "由奉行、町年寄与通晓账法者合议商债、海损和合本纠纷。契约更可信，商人自治则进一步制度化。"
 jxp_a_villages_village_tax_compacts:0 "惣村请负"
 jxp_a_villages_village_tax_compacts_desc:0 "以村为单位承诺年贡、治安与失踪户追补，由惣代在内部摊派。征收趋稳，国家却不易直接触及每一户。"
 jxp_a_villages_fixed_land_tax:0 "年贡定免"
 jxp_a_villages_fixed_land_tax_desc:0 "按数年平均收成固定年贡率，免去代官临时增派。农户更敢积蓄，丰年时公仪所得也不会随产量尽增。"
 jxp_a_villages_irrigation_works:0 "灌溉普请"
 jxp_a_villages_irrigation_works_desc:0 "由数村共同修堤、开渠并分担水利役，奉行只核工程与账目。田地收成提高，营造费也要由国家补助。"
 jxp_a_villages_relief_granaries:0 "常平义仓"
 jxp_a_villages_relief_granaries_desc:0 "准许乡村在丰年积谷、灾年平粜，由寺社与惣代共同封验仓门。饥荒冲击减轻，平日可征之粮亦有所减少。"
 jxp_a_villages_separate_soldiers_farmers:0 "兵农分离"
 jxp_a_villages_separate_soldiers_farmers_desc:0 "逐步解除农户常备军役，以专职足轻和俸禄武士承担征战。耕作更加稳定，征兵来源则不如旧时宽广。"
 jxp_a_villages_village_militias:0 "乡兵动员"
 jxp_a_villages_village_militias_desc:0 "保留由惣村编组的乡兵，仅用于守堤、护仓和本国防御。地方守备增强，农时与治安却可能受武装化拖累。"
 jxp_a_villages_debt_relief_petitions:0 "德政请求"
 jxp_a_villages_debt_relief_petitions_desc:0 "承认灾年由惣代呈请延期、减息或重订旧债，但须经奉行逐案核验。乡里可免崩散，债权信用也会受损。"
 jxp_a_villages_new_field_reclamation:0 "新田开拓"
 jxp_a_villages_new_field_reclamation_desc:0 "把荒地、水边与山麓新田交由数村合力开垦，并给予限期减免。土地利用提高，国家短期税入有所让渡。"
 jxp_a_villages_rural_industry:0 "农村手工业"
 jxp_a_villages_rural_industry_desc:0 "允许农闲纺织、制纸与小规模加工由村落共同承揽，使乡里分享城市市场。货物增加，也会冲击旧座与年贡秩序。"
 jxp_a_villages_village_charters:0 "村落自治文书"
 jxp_a_villages_village_charters_desc:0 "把入会地、水利、山林与惣代选任写成公认文书，使代官裁断有例可循。乡里争讼减少，自治权也更加牢固。"
 jxp_a_villages_common_workshops:0 "共同工场"
 jxp_a_villages_common_workshops_desc:0 "由数村合资设置织场、窑场或作事小屋，按出工与原料分配收益。原工业更成规模，国家须防止新豪强垄断。"
 jxp_a_villages_overseas_service_exemption:0 "免除海外军役"
 jxp_a_villages_overseas_service_exemption_desc:0 "约定惣村不承担越海远征的人丁征发，只供应有定额的粮秣与船具。乡里得以保全劳力，远征军的人力来源因而收窄。"
 jxp_a_nobles_agenda_compile_land_rolls:0 "编制知行账"
