l_english:
 jxp_b_decision_review_colonial_leadership_title:0 "决定由谁领导海外社会"
 jxp_b_decision_review_colonial_leadership_desc:0 "海外出生者、地方议席与独立财政已经使殖民地成为另一处政治共同体。玩家可以继续领导日本，也可以在固定殖民国家中转而领导海外；普通殖民国则必须使用游戏原有的“释放殖民地并扮演”按钮。"

 jxp_colonial_switch.1.t:0 "海那一边的政治人生"
 jxp_colonial_switch.1.d:0 "殖民议席请求我们明确未来由谁承担它的政治选择。转往海外不会搬空日本国库、转移日本军队、顾问、债务、核心或其他属国；殖民国家只保留自身资产，并获得一笔有限的行政启动金。日本将交由人工智能继续治理。"
 jxp_colonial_switch.1.a:0 "继续领导日本，十年后再议。"
 jxp_colonial_switch.1.b:0 "转而领导新大和。"
 jxp_colonial_switch.1.c:0 "转而领导北辰海国。"
 jxp_colonial_switch.1.njf:0 "转而领导南洋日本町联邦。"
 jxp_colonial_switch.1.e:0 "转而领导大洋诸岛盟。"
 jxp_colonial_switch.1.f:0 "暂缓十年，不作承诺。"
 jxp_colonial_switch.1.g:0 "查看普通殖民国的原版切换办法。"
 jxp_colonial_switch.1.h:0 "永不再提出此事。"

 jxp_b_95_colonial_switch_deferred:0 "殖民领导权暂缓"
 jxp_b_95_colonial_switch_deferred_desc:0 "本土与海外约定十年后再讨论由谁承担殖民社会的政治选择。"
 jxp_b_95_continue_metropole_tt:0 "继续扮演当前日本国家；不会转移资产。十年后可以再次审议。"
 jxp_b_95_switch_nya_tt:0 "玩家将改为控制§Y新大和§!，日本由AI接管。新大和维持现有军队、舰队、领土、债务与属国，仅获得§Y100§!金币启动金；不会取得日本本土核心或其他殖民地。若它仍是属国，切换后仍须自行争取自治或独立。"
 jxp_b_95_switch_hkk_tt:0 "玩家将改为控制§Y北辰海国§!，日本由AI接管。北辰海国仅获得§Y100§!金币启动金，其他资产关系保持现状。"
 jxp_b_95_switch_njf_tt:0 "玩家将改为控制§Y南洋日本町联邦§!，日本由AI接管。联邦仅获得§Y100§!金币启动金，其他资产关系保持现状。"
 jxp_b_95_switch_oia_tt:0 "玩家将改为控制§Y大洋诸岛盟§!，日本由AI接管。诸岛盟仅获得§Y100§!金币启动金，其他资产关系保持现状。"
 jxp_b_95_defer_switch_tt:0 "十年后可以再次审议；当前国家与资产均不改变。"
 jxp_b_95_release_and_play_fallback_tt:0 "脚本不能安全地把玩家动态切换到随机生成的殖民国。请在属国界面使用原版§Y释放殖民地并扮演§!功能；本选项不会伪装成已经切换。"
 jxp_b_95_never_switch_tt:0 "此国家此后不再显示殖民领导权审议。"
