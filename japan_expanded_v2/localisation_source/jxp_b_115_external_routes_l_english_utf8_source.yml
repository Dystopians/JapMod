 jxp_b_115_open_naval_charter_title:0 "议定制海奉行章程"
 jxp_b_115_open_naval_charter_desc:0 "以既有东亚制海任务为制度基础，为远洋舰队、海峡护航和海外补给写定二十年章程；海军主线不另挤占第三条任务列。"
 jxp_b_115_open_naval_patrol_title:0 "派遣有限制海巡检"
 jxp_b_115_open_naval_patrol_desc:0 "以有限副线的资格派出十年巡检，护送商船并核查海峡补给；它不会取代既定主线，也不会授予总章。"
 jxp_b_115_toyotomi_external_charter_title:0 "颁布东亚总和议章程"
 jxp_b_115_toyotomi_external_charter_desc:0 "在太阁遗命与天下静谧两条既有任务支柱之上，结清军役、遣返和战后交涉，形成二十年有效的东亚总和议。"
