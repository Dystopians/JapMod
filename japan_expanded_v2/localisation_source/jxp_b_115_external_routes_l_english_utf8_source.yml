l_english:
 jxp_b_115_uncommitted_mainland_01_title:0 "对马议使与通事"
 jxp_b_115_uncommitted_mainland_01_desc:0 "以“对马议使与通事”发出首批训令。先查明港市、社群与邻国的真实条件，再决定如何推进公议与锁国都可继承、但会作出不同裁断的神道海疆制度。"
 jxp_b_115_uncommitted_mainland_02_title:0 "琉球观察与保护"
 jxp_b_115_uncommitted_mainland_02_desc:0 "当地使者对“琉球观察与保护”提出了条件。我们可以继续推进公议与锁国都可继承、但会作出不同裁断的神道海疆制度，但必须把税则、司法与代表权逐项写清。"
 jxp_b_115_uncommitted_mainland_03_title:0 "海东公议与缓冲"
 jxp_b_115_uncommitted_mainland_03_desc:0 "围绕“海东公议与缓冲”建立常设账册和年度复议，让公议与锁国都可继承、但会作出不同裁断的神道海疆制度从临时使团变成能被地方检验的制度。"
 jxp_b_115_uncommitted_mainland_04_title:0 "通商约与四口船籍"
 jxp_b_115_uncommitted_mainland_04_desc:0 "“通商约与四口船籍”进入最昂贵的一段：港务、护航和地方补偿都要有稳定财源；若不接受这一代价，计划便应及时收束。"
 jxp_b_115_uncommitted_mainland_05_title:0 "海疆共同守护"
 jxp_b_115_uncommitted_mainland_05_desc:0 "“海疆共同守护”将前述试行汇为可复议的总章程。其收益属于整个航路，但代价同样明载：使团必须尊重海东各地既有法统，不能把会盟偷换成无期限占领。"
 jxp_b_115_uncommitted_overseas_01_title:0 "诸州共同商馆"
 jxp_b_115_uncommitted_overseas_01_desc:0 "以“诸州共同商馆”发出首批训令。先查明港市、社群与邻国的真实条件，再决定如何推进殖民代表权与共同财政。"
 jxp_b_115_uncommitted_overseas_02_title:0 "海外代表请愿"
 jxp_b_115_uncommitted_overseas_02_desc:0 "当地使者对“海外代表请愿”提出了条件。我们可以继续推进殖民代表权与共同财政，但必须把税则、司法与代表权逐项写清。"
