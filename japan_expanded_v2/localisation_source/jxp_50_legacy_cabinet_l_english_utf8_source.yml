l_english:
 jxp_decision_convene_legacy_cabinet_title:0 "召集遗绪议定"
 jxp_decision_convene_legacy_cabinet_desc:0 "诸家旧章、统一前的约束、诸道国体与家法遗文，皆可一并呈入枢臣之席。自今以后，不必使朝野文书各立门户；宜择其要者，付诸议定。"
 jxp_legacy_cabinet.1.t:0 "遗绪议定"
 jxp_legacy_cabinet.1.d:0 "统一之后，天下并非白纸。诸侯旧法、家中誓约、町人与寺社的陈情、以及建国之初的路线争议，仍在政所案牍之间往复。枢臣们请求御前裁断：哪些旧绪应写入新国法，哪些只当存于记室。"
 jxp_legacy_cabinet.1.a:0 "稽考建国之家的旧章"
 jxp_legacy_cabinet.1.b:0 "编定始祖家风"
 jxp_legacy_cabinet.1.c:0 "追录统一前的政令"
 jxp_legacy_cabinet.1.d_option:0 "纳入诸家评定法"
 jxp_legacy_cabinet.1.e:0 "调和国体与家门"
 jxp_legacy_cabinet.1.f:0 "暂且封存此案"
 jxp_legacy_cabinet_founder_legacy_dispatch_tt:0 "将召开与建国家门相符的旧章评议。"
 jxp_legacy_cabinet_founder_idea_dispatch_tt:0 "将依据建国家门传统，开启相符的国策编纂议案。"
 jxp_legacy_cabinet_preunification_dispatch_tt:0 "将追录统一前已经选定的家法与政令。"
 jxp_legacy_cabinet_house_diet_dispatch_tt:0 "将召开诸家评定，议定藩家议政遗产。"
 jxp_legacy_cabinet_route_house_dispatch_tt:0 "将依据当前国体路线与建国家门，开启相应的调和议案。"
