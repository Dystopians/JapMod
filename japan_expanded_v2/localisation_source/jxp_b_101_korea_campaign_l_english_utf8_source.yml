l_english:
 cb_jxp_b_101_korean_expedition:0 "渡海役"
 cb_jxp_b_101_korean_expedition_desc:0 "在通事、粮道、运输船与诸家军役均已编定之后，日本可对朝鲜发动一次代价高昂的渡海远征。此战争并不减免吞并土地的恶名与和约代价；通商、保护、臣属或直接统治，均须以实际战果换取。"
 jxp_b_101_korean_expedition_wargoal:0 "攻取朝鲜王京"
 jxp_b_101_korean_expedition_wargoal_desc:0 "以朝鲜王京为军事目标。夺地与臣服仍按正常和约计算，且大规模吞并将承担更高恶名与战分。"
 JXP_B_101_KOREAN_EXPEDITION_WAR_NAME:0 "$ORDER$$FIRST$渡海役"

 jxp_b_101_prepare_tsushima_interpreters_decision_title:0 "编置对马通事"
 jxp_b_101_prepare_tsushima_interpreters_decision_desc:0 "远征若连海峡彼岸的书札都读不明白，兵船再多也只会驶入迷雾。先从对马、博多与倭馆召集通事，整理朝鲜官称、道路、港湾和礼仪。"
 jxp_b_101_dispatch_korean_envoys_decision_title:0 "遣朝鲜通信使"
 jxp_b_101_dispatch_korean_envoys_decision_desc:0 "在拔刀以前，先以国书试探王京。使节既要传达要求，也要带回朝鲜朝廷、地方官与边将对日本意图的判断。"
 jxp_b_101_demand_passage_or_tribute_decision_title:0 "索取假道与朝贡"
 jxp_b_101_demand_passage_or_tribute_decision_desc:0 "向朝鲜提出通往大陆的假道、军粮与礼仪承认。无论对方答应还是拒绝，这封国书都会使海峡外交越过难以回头的界线。"
 jxp_b_101_build_nagoya_logistics_decision_title:0 "筑名护屋兵站"
 jxp_b_101_build_nagoya_logistics_decision_desc:0 "在肥前名护屋或足以替代它的西国港津修筑仓廪、船坞、营地与军议所。远征大军必须先在日本一侧学会如何吃饭。"
 jxp_b_101_register_transport_fleet_decision_title:0 "编造运输船名簿"
 jxp_b_101_register_transport_fleet_decision_desc:0 "征发船主、舵手和水夫，把军船、粮船与马船逐一登记。渡海役的规模，最终受制于能在风浪中往返多少次。"
 jxp_b_101_stockpile_campaign_grain_decision_title:0 "积贮渡海军粮"
 jxp_b_101_stockpile_campaign_grain_decision_desc:0 "从诸国买集米、盐、干鱼、药材和绳索，再按船队与军势分仓。仓廪中的每一石米，都是本土百姓和国库先行承担的战争。"
 jxp_b_101_assemble_siege_train_decision_title:0 "整备攻城器械"
 jxp_b_101_assemble_siege_train_decision_desc:0 "火炮、铁炮、工匠和掘夫必须随船渡海。朝鲜山城不会因一纸檄文开门，攻城队也不能靠临阵搜刮凭空出现。"
 jxp_b_101_muster_daimyo_levies_decision_title:0 "点集诸大名军役"
 jxp_b_101_muster_daimyo_levies_decision_desc:0 "把诸家应出的兵额、船只、军粮与轮换期限写入军役帐。每一支军势都带着本家的荣誉，也带着争功、拖延和保存实力的算盘。"
 jxp_b_101_organize_naval_escort_decision_title:0 "编成海峡护航"
 jxp_b_101_organize_naval_escort_decision_desc:0 "运输船若无战船护送，釜山以北的每一袋米都可能沉入海中。水军须巡守对马海峡，并预备面对朝鲜水师的反击。"
 jxp_b_101_assess_ming_response_decision_title:0 "评估明朝反应"
 jxp_b_101_assess_ming_response_decision_desc:0 "朝鲜并非孤悬海外的小国。北京或盛京如何看待半岛战火，可能决定远征面对的是一国，还是整个大陆的援军与外交压力。"

 jxp_b_101_prepare_tsushima_interpreters_effect_tt:0 "通事将把海峡语言、道路与外交礼仪整理成远征所需的第一批情报。"
 jxp_b_101_dispatch_korean_envoys_effect_tt:0 "使节将提高远征的外交准备，并促使诸家认真看待国书往返。"
 jxp_b_101_demand_passage_or_tribute_effect_tt:0 "对朝鲜的正式要求将确定开战叙事，同时使退让变得更为困难。"
 jxp_b_101_build_nagoya_logistics_effect_tt:0 "西国兵站将改善运输与粮秣组织，并在选定港津留下长期军需负担。"
 jxp_b_101_register_transport_fleet_effect_tt:0 "运输船、水夫与船主将被纳入统一名簿，渡海能力显著增强。"
 jxp_b_101_stockpile_campaign_grain_effect_tt:0 "国库购入的军粮将支持远征纵深，但本土财政已经为此付出高昂代价。"
 jxp_b_101_assemble_siege_train_effect_tt:0 "火炮、工匠和攻城器具将随军渡海，代价由军费与运输共同承担。"
 jxp_b_101_muster_daimyo_levies_effect_tt:0 "诸家军势将依军役帐集结；兵力增加的同时，统帅必须维持大名服从。"
 jxp_b_101_organize_naval_escort_effect_tt:0 "水军护航将加强海峡控制，也会消耗大量水手与船费。"
 jxp_b_101_assess_ming_response_effect_tt:0 "完成大陆反应评估后，十年内可发动渡海役；若迟迟不开战，兵站与军役将自行解散。"

 jxp_korea_campaign.940.t:0 "渡海役监理"
 jxp_korea_campaign.940.d:0 "兵站奉行继续核对海峡战况。"
 jxp_korea_campaign.940.a:0 "照既定军令办理。"
 jxp_korea_campaign.941.t:0 "停战监理"
 jxp_korea_campaign.941.d:0 "奉行众等待朝鲜战事的最终和约。"
 jxp_korea_campaign.941.a:0 "待战火停息再议善后。"

 jxp_korea_campaign.100.t:0 "朝鲜的答复"
 jxp_korea_campaign.100.d:0 "王京拒绝以日本所要求的方式开放道路与朝贡。朝鲜官员指责我方国书僭越礼制，边将封锁港津，民间则开始转移粮食。外交破裂已经化作战火，但军中仍在争论：我们究竟要迫使对方重开通交，还是以兵锋改写半岛秩序？"
 jxp_korea_campaign.100.a:0 "重申有限要求，严禁军士扰民。"
 jxp_korea_campaign.100.b:0 "既已渡海，便让兵锋作答。"
 jxp_korea_campaign.101.t:0 "釜山登陆"
 jxp_korea_campaign.101.d:0 "先头船队在釜山外海放下小舟，铁炮足轻、马匹和粮袋挤满滩头。谨慎卸载可以保全军资，却会给守军更多时间；急攻港城则可能抢得先机，也可能把士兵和辎重留在潮水里。"
 jxp_korea_campaign.101.a:0 "分批卸载，先固滩头与仓场。"
 jxp_korea_campaign.101.b:0 "趁守军未集，立即突入港城。"
 jxp_korea_campaign.102.t:0 "粮道向北延伸"
 jxp_korea_campaign.102.d:0 "军势离釜山越远，每一石米就要经过更多船只、驮马与民夫。道路被雨水冲毁，仓场需要守兵，地方抵抗也开始袭击小队运输。名护屋的满仓不能自动变成汉城城下的晚饭。"
 jxp_korea_campaign.102.a:0 "增设仓站，以国库维持粮道。"
 jxp_korea_campaign.102.b:0 "催军就地筹措，先保推进速度。"
 jxp_korea_campaign.103.t:0 "朝鲜地方抵抗"
 jxp_korea_campaign.103.d:0 "地方官、义兵、僧侣与乡民在山道间组织抵抗。他们熟悉渡口和粮仓，也知道何时向我军示弱、何时截杀落单士卒。若以谈判、收买和纪律争取合作，进军会更慢；若以报复压服乡里，仇恨将比任何城墙更长久。"
 jxp_korea_campaign.103.a:0 "约束军队，与地方官民订立护民条款。"
 jxp_korea_campaign.103.b:0 "以严酷报复震慑沿途抵抗。"
 jxp_korea_campaign.104.t:0 "朝鲜水军反击"
 jxp_korea_campaign.104.d:0 "朝鲜水师避开陆军锋芒，转而袭击海峡粮船与散开的护航队。熟悉岛屿、潮汐和狭水道的舰队足以让一场陆上胜利在饥饿中失去意义。"
 jxp_korea_campaign.104.a:0 "集中护航舰队，与之争夺近海。"
 jxp_korea_campaign.104.b:0 "分散航线，承受船损以保陆军推进。"
 jxp_korea_campaign.105.t:0 "大陆援军的阴影"
 jxp_korea_campaign.105.d:0 "半岛急使已将战报送往大陆。无论来援者悬明旗还是清旗，一个强大的大陆朝廷都不会轻易容忍日本军队长期驻在朝鲜。援军、粮饷和新的战争借口正在北方集结。"
 jxp_korea_campaign.105.a:0 "以使节和礼物分化大陆与朝鲜。"
 jxp_korea_campaign.105.b:0 "增派军势，准备迎战大陆援军。"
 jxp_korea_campaign.106.t:0 "朝鲜之冬"
 jxp_korea_campaign.106.d:0 "北风冻结道路，士卒的草鞋、帐篷与薄衣无法抵御半岛寒冬。若动用储粮和银钱修筑冬营，攻势便须暂缓；若继续催军，冻伤与逃亡将填满军役帐。"
 jxp_korea_campaign.106.a:0 "发放储粮，修筑坚固冬营。"
 jxp_korea_campaign.106.b:0 "不许停步，损失由各军自理。"
 jxp_korea_campaign.107.t:0 "营中疫病"
 jxp_korea_campaign.107.d:0 "拥挤营地、污水、腐败粮食与长途运输共同滋生疫病。医师要求隔离病营并焚毁受染物资，诸将却担心停军会让敌人重新集结。"
 jxp_korea_campaign.107.a:0 "拨药设营，严格隔离病患。"
 jxp_korea_campaign.107.b:0 "保持行军，不能因病弃置战机。"
 jxp_korea_campaign.108.t:0 "诸大名争功"
 jxp_korea_campaign.108.d:0 "各家军势争夺先锋、城池与战功，却把危险差事推给别家。旧怨在异国军议中重新燃起，若总奉行不能公正分配粮秣与军令，联合远征会变成彼此牵制的竞赛。"
 jxp_korea_campaign.108.a:0 "依军役帐裁定先后，不许私争。"
 jxp_korea_campaign.108.b:0 "让诸家自争功名，胜者自有道理。"
 jxp_korea_campaign.109.t:0 "军纪与暴行"
 jxp_korea_campaign.109.d:0 "有人主张以严整军纪换取沿途合作，也有人要求纵兵掳掠，以战利品补偿欠饷。后者能立刻填充军库，却会使日本之名与焚村、俘虏和复仇相连数十年。"
 jxp_korea_campaign.109.a:0 "重申军法，违令者无论家格皆治罪。"
 jxp_korea_campaign.109.b:0 "准许掳掠，以战利品养兵。"
 jxp_korea_campaign.110.t:0 "工匠、学者与俘虏"
 jxp_korea_campaign.110.d:0 "军中押来陶工、印刷匠、医者、学者和普通百姓。有人把他们视为可以带回日本的技艺，也有人警告：强迁之利不能洗去俘虏与家人分离的事实。"
 jxp_korea_campaign.110.a:0 "登记并遣返非战斗人员。"
 jxp_korea_campaign.110.b:0 "把有用之人迁往日本诸城。"
 jxp_korea_campaign.111.t:0 "海峡间的和谈"
 jxp_korea_campaign.111.d:0 "通事带来试探性的停战条件：恢复通信、开放有限港口、交换俘虏，并让双方各自宣称守住体面。继续战争或许能索取更多，却也可能只换来更多空仓与坟冢。"
 jxp_korea_campaign.111.a:0 "允许使节商议有限条件。"
 jxp_korea_campaign.111.b:0 "现在谈和，只会让此前牺牲白费。"
 jxp_korea_campaign.112.t:0 "再度远征"
 jxp_korea_campaign.112.d:0 "前线要求新的士卒、火药、船只与银钱。追加一轮远征可能挽回战局，也可能把已经疲惫的日本诸国再次抽空；转入守势则保存国力，却会让最初目标逐渐缩小。"
 jxp_korea_campaign.112.a:0 "再征兵粮，维持远征规模。"
 jxp_korea_campaign.112.b:0 "固守现有据点，不再盲目深入。"
 jxp_korea_campaign.113.t:0 "远征压垮国内财政"
 jxp_korea_campaign.113.d:0 "海峡两岸的军费没有尽头。奉行众提出加征临时段钱，商人则愿意承购国债，却要求利息和特许。无论选哪一条路，战争都将从朝鲜营地回到日本村町。"
 jxp_korea_campaign.113.a:0 "向诸国追加军役与段钱。"
 jxp_korea_campaign.113.b:0 "向商人举债，保全眼前秩序。"
 jxp_korea_campaign.114.t:0 "阵中讣告"
 jxp_korea_campaign.114.d:0 "死讯越过海峡传入军营。若远征发起者已至暮年，这可能就是主君之死；若国主尚壮，则是总大将或最重要的军奉行倒下。无论死者是谁，诸家都开始重新计算继续战争对自己的意义。"
 jxp_korea_campaign.114.a:0 "国主已逝，先稳住继承与军令。"
 jxp_korea_campaign.114.b:0 "总大将身故，另择一人统军。"
 jxp_korea_campaign.115.t:0 "撤军之议"
 jxp_korea_campaign.115.d:0 "水军、奉行和部分诸将建议趁海路尚通，制定分批撤军计划。强硬派则坚持继续增兵，担心任何退却都会摧毁威信。撤退不是免费脱身，继续也不是没有尽头的勇武。"
 jxp_korea_campaign.115.a:0 "先拟撤军次序，保全船队与伤兵。"
 jxp_korea_campaign.115.b:0 "追加兵粮，拒绝在此时后退。"
 jxp_korea_campaign.116.t:0 "漫长的占领"
 jxp_korea_campaign.116.d:0 "战争拖延后，占领不再只是插旗与驻军。田赋由谁征收、诉讼由谁裁决、寺院和书院是否受保护，都决定城门外的乡里会提供粮食还是掩护抵抗者。"
 jxp_korea_campaign.116.a:0 "设军政区，以驻军维持道路。"
 jxp_korea_campaign.116.b:0 "留用地方官，承认乡约与旧法。"
 jxp_korea_campaign.117.t:0 "海峡船队疲敝"
 jxp_korea_campaign.117.d:0 "多年往返使船底腐朽、水手逃亡、保险与粮价齐涨。要维持远征，必须再次拨银征夫；若缩减船队，前线便只能收缩目标并准备撤离。"
 jxp_korea_campaign.117.a:0 "修船募水手，维持最后一条粮道。"
 jxp_korea_campaign.117.b:0 "缩减船队，为有限撤军留出余地。"

 jxp_korea_campaign.180.t:0 "朝鲜战后之局"
 jxp_korea_campaign.180.d:0 "和约已经落笔，军船陆续回港。纸面战果不能替我们回答如何处理通信、港口、臣属、占领地与战争债务。新的秩序只能建立在实际取得的土地和关系之上；没有任何一道诏令能够凭空把整个半岛变成安稳国土。"
 jxp_korea_campaign.180.a:0 "以通信、通商与有限港务结束战争。"
 jxp_korea_campaign.180.b:0 "建立南部保护与军港秩序。"
 jxp_korea_campaign.180.c:0 "扶持臣属王朝，并承担其存续。"
 jxp_korea_campaign.180.direct_rule:0 "把实际占领地编入直接统治。"
 jxp_korea_campaign.180.e:0 "实行战略撤退，保留远征教训。"
 jxp_korea_campaign.180.f:0 "承认远征已经成为灾难。"

 jxp_b_101_korea_trade_outcome_tt:0 "不转移土地；十五年内以恢复通信、海峡贸易和外交信誉为主要收益。"
 jxp_b_101_korea_southern_protectorate_outcome_tt:0 "只承认和约中已经取得的南部据点或臣属关系；当地获得较高自治，并由日本长期负担军港与保护费用。"
 jxp_b_101_korea_puppet_outcome_tt:0 "仅在朝鲜已经通过正常和约成为我国属国时可选；不会凭空建立臣属关系，且二十年内必须承担重建与扶持费用。"
 jxp_b_101_korea_direct_rule_outcome_tt:0 "仅作用于已经由我国实际拥有的朝鲜土地；不授予核心，所有相关省份提高自治并承受二十年抵抗与治理成本。"
 jxp_b_101_korea_strategic_retreat_outcome_tt:0 "放弃把有限战果包装成全面胜利；支付撤军与欠饷，换取较低厌战和十五年的海陆后勤经验。"
 jxp_b_101_korea_disaster_outcome_tt:0 "承认远征失败并承担财政、稳定、腐败与国内反对的二十年代价。"

 jxp_b_101_korea_preparation_burden:0 "渡海备役"
 jxp_b_101_korea_preparation_burden_desc:0 "运输船、兵站、军役和国书正在同时准备，本土税赋与军费因而承受长期压力。"
 jxp_b_101_nagoya_logistics_depot:0 "名护屋兵站"
 jxp_b_101_nagoya_logistics_depot_desc:0 "港津被改造成渡海军的仓廪、船坞和军议所，地方税收让位于水手、粮秣与防务。"
 jxp_b_101_korea_expedition_ready:0 "渡海军待发"
 jxp_b_101_korea_expedition_ready_desc:0 "海陆军势已经编成，但维持待命本身便是一笔昂贵开支。"
 jxp_b_101_secure_landing:0 "稳固登陆场"
 jxp_b_101_secure_landing_desc:0 "辎重、火炮与先头军依序上岸，使后续攻城和补员更为顺畅。"
 jxp_b_101_stretched_supply:0 "过度延伸的粮道"
 jxp_b_101_stretched_supply_desc:0 "道路、船队与仓站无法跟上进军速度，损耗和补员费用不断增加。"
 jxp_b_101_korean_resistance:0 "朝鲜地方抵抗"
 jxp_b_101_korean_resistance_desc:0 "义兵、地方官民和山地网络抵制占领，税赋与征兵皆难以推行。"
 jxp_b_101_korean_reprisals:0 "报复循环"
 jxp_b_101_korean_reprisals_desc:0 "掳掠与报复使抵抗扩散到乡里，短期恐惧转化为长期仇恨。"
 jxp_b_101_korean_accommodation:0 "地方安堵"
 jxp_b_101_korean_accommodation_desc:0 "占领军承认乡约、旧法与地方官的有限职权，以财政让步换取道路和民生稳定。"
 jxp_b_101_korean_naval_pressure:0 "朝鲜水师压力"
 jxp_b_101_korean_naval_pressure_desc:0 "熟悉潮汐和岛屿的敌军舰队不断威胁运输船与水手。"
 jxp_b_101_ming_warning:0 "大陆朝廷警告"
 jxp_b_101_ming_warning_desc:0 "大陆援军与外交威胁迫使我们分散军费，并损害在东亚诸国间的信誉。"
 jxp_b_101_ming_intervention_force:0 "援朝动员"
 jxp_b_101_ming_intervention_force_desc:0 "大陆朝廷为援助朝鲜动员兵粮，军事力量增强的同时也承担沉重国费。"
 jxp_b_101_korean_ming_relief:0 "大陆援朝粮饷"
 jxp_b_101_korean_ming_relief_desc:0 "援军、粮秣与火器抵达半岛，增强朝鲜守备与恢复能力。"
 jxp_b_101_winter_quarters:0 "朝鲜冬营"
 jxp_b_101_winter_quarters_desc:0 "坚固营舍和额外粮饷降低寒冬损失，却提高军队维持成本。"
 jxp_b_101_epidemic_camps:0 "营中疫病"
 jxp_b_101_epidemic_camps_desc:0 "疾病削弱兵源恢复，隔离与恐慌也扰乱军营秩序。"
 jxp_b_101_daimyo_rivalry:0 "诸将争功"
 jxp_b_101_daimyo_rivalry_desc:0 "各家军势争夺功名、粮秣和安全差事，联合指挥因此受损。"
 jxp_b_101_strict_field_code:0 "渡海军法"
 jxp_b_101_strict_field_code_desc:0 "军令不因家格而屈曲，严整纪律同时约束掳掠和私斗。"
 jxp_b_101_atrocity_stain:0 "渡海暴行之名"
 jxp_b_101_atrocity_stain_desc:0 "掳掠、焚毁与报复使邻国长期怀疑日本的每一封国书，国内秩序亦受恶习反噬。"
 jxp_b_101_captive_artisans_stain:0 "强迁工匠争议"
 jxp_b_101_captive_artisans_stain_desc:0 "被强行迁走的工匠带来技艺，也使日本的外交声誉背负俘虏之名。"
 jxp_b_101_peace_feelers:0 "海峡和谈"
 jxp_b_101_peace_feelers_desc:0 "通事与使节在双方都能保留体面的前提下试探停战条件。"
 jxp_b_101_second_expedition:0 "再度远征"
 jxp_b_101_second_expedition_desc:0 "新一轮士卒与军资补充前线，也持续推高军队维持费用。"
 jxp_b_101_home_finance_strain:0 "渡海役财用"
 jxp_b_101_home_finance_strain_desc:0 "临时段钱、国债和商人特许把海峡彼岸的战争带回日本村町。"
 jxp_b_101_succession_shock:0 "远征中的继承震荡"
 jxp_b_101_succession_shock_desc:0 "远征发起者或总大将身故，使诸家重新审视对政权和战争的服从。"
 jxp_b_101_orderly_withdrawal_plan:0 "分批撤军计划"
 jxp_b_101_orderly_withdrawal_plan_desc:0 "船队优先保全伤兵、辎重与水手，陆上进攻则必须为撤离让路。"
 jxp_b_101_long_occupation_burden:0 "半岛长期驻军"
 jxp_b_101_long_occupation_burden_desc:0 "占领已从战场问题变成税赋、司法、道路和地方抵抗的治理难题。"
 jxp_b_101_korea_trade_settlement:0 "海峡通商和约"
 jxp_b_101_korea_trade_settlement_desc:0 "通信、俘虏交换和有限港务恢复，使战争以外交与贸易而非吞并收尾。"
 jxp_b_101_korea_southern_protectorate_burden:0 "朝鲜南部保护负担"
 jxp_b_101_korea_southern_protectorate_burden_desc:0 "有限据点和保护关系需要舰队、港务与长期财政支持。"
 jxp_b_101_korea_protected_south:0 "南部保护港区"
 jxp_b_101_korea_protected_south_desc:0 "地方保留较高自治，日本驻军守护港口和道路，但税赋与征发受到限制。"
 jxp_b_101_korea_protectorate_reconstruction:0 "保护国重建"
 jxp_b_101_korea_protectorate_reconstruction_desc:0 "在保留朝鲜官制的前提下修复城防和乡里，稳定优先于立即榨取税收。"
 jxp_b_101_korea_puppet_support_cost:0 "扶持亲日王朝"
 jxp_b_101_korea_puppet_support_cost_desc:0 "臣属王朝需要持续金援、海防和外交背书，不能凭一次和约自行稳固。"
 jxp_b_101_korea_puppet_reconstruction:0 "臣属王朝重建"
 jxp_b_101_korea_puppet_reconstruction_desc:0 "新政权以减税、复员与恢复地方秩序争取存续。"
 jxp_b_101_korea_direct_rule_burden:0 "朝鲜直辖之重"
 jxp_b_101_korea_direct_rule_burden_desc:0 "跨海州县需要大批官吏、驻军与运输经费，国家治理能力长期受压。"
 jxp_b_101_korea_direct_rule_resistance:0 "直辖地抵抗"
 jxp_b_101_korea_direct_rule_resistance_desc:0 "没有地方合法性的直接统治面对高自治、低税收和持续抵抗。"
 jxp_b_101_korea_strategic_lessons:0 "渡海役之鉴"
 jxp_b_101_korea_strategic_lessons_desc:0 "撤军保留了海陆协同、攻城与运输经验，却无法收回已经耗尽的国库。"
 jxp_b_101_korea_expedition_disaster:0 "渡海役崩溃"
 jxp_b_101_korea_expedition_disaster_desc:0 "空仓、败兵、债务和诸家不满共同撼动国内政权，远征失败的代价将延续一代人。"
