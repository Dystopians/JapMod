l_english:
 jxp_specific_route_house.1.t:0 "府内圣堂与丰后旧臣"
 jxp_specific_route_house.1.d:0 "大友旧臣仍记得府内城下的南蛮钟声、病院与学院。吉利支丹日本若由丰后之门开国，圣堂可以成为国政的外向面孔；但国中武士也担心旧知行与社寺秩序在钟声中失去位置。"
 jxp_specific_route_house.1.a:0 "使府内圣堂入于国政"
 jxp_specific_route_house.1.b:0 "以丰后旧臣安置圣教"
 jxp_specific_route_house.2.t:0 "濑户内朱印船议"
 jxp_specific_route_house.2.d:0 "毛利旧水军、国人众与港町年寄聚于评定之间。开国通商需要朱印、海图与远洋船队，濑户内诸家却更信任旧日盟书与潮汐。"
 jxp_specific_route_house.2.a:0 "让朱印船越过濑户内"
 jxp_specific_route_house.2.b:0 "以国人水军护持海路"
 jxp_specific_route_house.3.t:0 "公方旧名奉还"
 jxp_specific_route_house.3.d:0 "若由足利旧名重整日本，王政复古并非单纯抹去武家记忆。奉公众、幕府旧札与将军家谱都被摆在禁里文书旁，等待新的解释。"
 jxp_specific_route_house.3.a:0 "将公方旧名奉还于朝"
 jxp_specific_route_house.3.b:0 "保留奉公众为朝廷护卫"
 jxp_specific_route_house.4.t:0 "一乘谷讲学"
 jxp_specific_route_house.4.d:0 "朝仓旧臣在一乘谷遗风中重修讲堂，越前纸、庭园与书札为朱子礼制提供了安静而坚韧的根。然地方诸役仍需以本国旧仪安置，不可只凭讲官之言。"
 jxp_specific_route_house.4.a:0 "令一乘谷讲官入仕"
 jxp_specific_route_house.4.b:0 "以越前旧仪调和礼制"
 jxp_specific_route_house.5.t:0 "庆长使节再议"
 jxp_specific_route_house.5.d:0 "伊达旧臣呈上海外使节的旧闻，奥州骑马武士与通事同席而坐。开国通商可以借远洋使节扩张名望，也可以让奥州诸士守住本家体面。"
 jxp_specific_route_house.5.a:0 "重开庆长使节之路"
 jxp_specific_route_house.5.b:0 "以奥州誓纸约束远使"
 jxp_specific_route_house.6.t:0 "对马海峡诸札"
 jxp_specific_route_house.6.d:0 "宗氏旧臣熟悉朝鲜海峡的风向、译官、倭馆与私商暗语。倭寇日本若由对马旧法调停，海上书札可以成为国家之器，也可能重新放纵诸海众。"
 jxp_specific_route_house.6.a:0 "以对马文书统摄海峡"
 jxp_specific_route_house.6.b:0 "放手倭馆海众自谋"
 jxp_31_otm_funai_bishopric_court:0 "府内圣堂国政"
 jxp_31_otm_funai_bishopric_court_desc:0 "府内的圣堂、学院与南蛮医事被纳入国政，吉利支丹日本因此更能组织传教与外海往来。"
 jxp_31_otm_bungo_retainer_compromise:0 "丰后旧臣调停"
 jxp_31_otm_bungo_retainer_compromise_desc:0 "大友旧臣以知行、社寺与城下旧例安置圣教，使新信仰不致立即撕裂地方秩序。"
 jxp_31_mri_setouchi_red_seals:0 "濑户内朱印航路"
 jxp_31_mri_setouchi_red_seals_desc:0 "毛利旧水军与港町年寄被纳入朱印船册，濑户内成为开国通商的内海学校。"
 jxp_31_mri_kokujin_sea_oaths:0 "国人水军誓纸"
 jxp_31_mri_kokujin_sea_oaths_desc:0 "濑户内国人众与船头重新立誓，国家承认他们的旧日海路，以换取更稳固的水军役。"
 jxp_31_ask_imperial_restoration_letters:0 "公方旧名奉还"
 jxp_31_ask_imperial_restoration_letters_desc:0 "足利旧名被写入王政复古的奉还文书，旧幕府的名分转化为朝廷新政的证明。"
 jxp_31_ask_hokoshu_court_guard:0 "奉公众禁里守护"
 jxp_31_ask_hokoshu_court_guard_desc:0 "奉公众残余被改编为禁里与京都诸门的守护役，武家记忆因而不至被完全逐出新政。"
 jxp_31_asa_ichijodani_academies:0 "一乘谷讲官"
 jxp_31_asa_ichijodani_academies_desc:0 "一乘谷遗风化作朱子礼制的讲学网络，越前纸与书札将礼经送入奉行所。"
 jxp_31_asa_echizen_house_rites:0 "越前旧仪调礼"
 jxp_31_asa_echizen_house_rites_desc:0 "朝仓旧仪、庭园礼法与国中夫役账册共同调和新礼制，使讲堂之法更能落地。"
 jxp_31_dte_keicho_embassy_routes:0 "庆长远使航路"
 jxp_31_dte_keicho_embassy_routes_desc:0 "伊达旧日远使传闻被重新整理为国家外交资产，奥州之外的海路重新进入诸臣想象。"
 jxp_31_dte_oshu_envoy_oaths:0 "奥州远使誓纸"
 jxp_31_dte_oshu_envoy_oaths_desc:0 "奥州诸士以誓纸约束远洋使节，开国不再只是港町商人的事业。"
 jxp_31_soo_tsushima_channel_writs:0 "对马海峡文书"
 jxp_31_soo_tsushima_channel_writs_desc:0 "宗氏旧有的译官、倭馆与海峡书札被国家重用，倭寇路线获得更精巧的外交外衣。"
 jxp_31_soo_wakan_sea_wardens:0 "倭馆海众守役"
 jxp_31_soo_wakan_sea_wardens_desc:0 "对马海众与倭馆商旅得以保留更大自主，海峡因而更有利，也更难完全写入法度。"
 jxp_specific_route_house.7.t:0 "安土乐市与朱印海路"
 jxp_specific_route_house.7.d:0 "织田旧臣把乐市乐座的旧令摆在朱印船册旁。若天下布武的刀笔曾打开城下市场，那么开国通商也可以被安土的市声重新解释。"
 jxp_specific_route_house.7.a:0 "让安土市声通向外海"
 jxp_specific_route_house.7.b:0 "以天下奉行约束商路"
 jxp_specific_route_house.8.t:0 "三河谱代与锁国令"
 jxp_specific_route_house.8.d:0 "德川旧臣熟悉人质、谱代与关所的秩序。锁国法度若由三河之法整理，海门之闭便不只是恐惧外海，而是一整套家中纪律的外延。"
 jxp_specific_route_house.8.a:0 "以谱代奉行守海门"
 jxp_specific_route_house.8.b:0 "以三河旧法人质诸藩"
 jxp_specific_route_house.9.t:0 "甲州法度与朱子讲官"
 jxp_specific_route_house.9.d:0 "武田旧法重军役、山道与家中分限；朱子讲官则重名分、礼序与百司。若二者相合，甲斐山国的严法也能穿上礼制衣冠。"
 jxp_specific_route_house.9.a:0 "以甲州法度入礼制"
 jxp_specific_route_house.9.b:0 "保留山国旧法为根"
 jxp_specific_route_house.10.t:0 "关东管领与王政文书"
 jxp_specific_route_house.10.d:0 "上杉旧名曾以关东管领自任，讲求义、名分与兵威。王政复古若承认此一旧职，越后武名便能成为朝廷新政的东国凭据。"
 jxp_specific_route_house.10.a:0 "以管领旧名奉还东国"
 jxp_specific_route_house.10.b:0 "以越后义战守护王政"
 jxp_specific_route_house.11.t:0 "小田原总构与国禁"
 jxp_specific_route_house.11.d:0 "北条旧臣呈上检地账册、城郭图与关东诸宿的登记。锁国之法若借小田原总构推行，海门、街道与城下都将成为同一座大城的门。"
 jxp_specific_route_house.11.a:0 "以小田原账册闭合国中"
 jxp_specific_route_house.11.b:0 "以总构守望诸藩"
 jxp_specific_route_house.12.t:0 "萨南商港与海峡礼法"
 jxp_specific_route_house.12.d:0 "岛津旧臣熟悉琉球、南海与铁炮匠人的来路。海峡日本若借萨南诸港接纳异俗商旅，外海之利与萨摩之武便会在港口相遇。"
 jxp_specific_route_house.12.a:0 "开萨南清真市舶"
 jxp_specific_route_house.12.b:0 "以萨摩铁炮众守诸港"
 jxp_specific_route_house.13.t:0 "一领具足与门徒公仪"
 jxp_specific_route_house.13.d:0 "长宗我部旧制使农兵同负田畴与甲胄。若一向宗路线承认这种半农半武的秩序，门徒公仪便会在土佐山野间获得可征召的筋骨。"
 jxp_specific_route_house.13.a:0 "编一领具足为门徒军役"
 jxp_specific_route_house.13.b:0 "以土佐百姓誓纸安定坊市"
 jxp_specific_route_house.14.t:0 "山口商都与开国文书"
 jxp_specific_route_house.14.d:0 "大内旧臣记得山口的小京都、勘合贸易与朝鲜使节。开国通商若从周防旧法取径，外海商路便不只是南蛮新事，也是一段西国旧学。"
 jxp_specific_route_house.14.a:0 "以山口文书开海路"
 jxp_specific_route_house.14.b:0 "以周防商议稳住诸港"
 jxp_specific_route_house.15.t:0 "东海道法书与朱子礼制"
 jxp_specific_route_house.15.d:0 "今川旧法书沿东海道流传，既有守护家格式，也有城下实际政务。朱子礼制若能吸收这份法书，讲堂与街道之间便少一层隔膜。"
 jxp_specific_route_house.15.a:0 "以东海道法书入礼制"
 jxp_specific_route_house.15.b:0 "以骏河家法调和诸司"
 jxp_31_oda_azuchi_red_seal_markets:0 "安土朱印市"
 jxp_31_oda_azuchi_red_seal_markets_desc:0 "乐市乐座的精神被写入朱印商路，城下市场与外海贸易彼此照亮。"
 jxp_31_oda_tenka_market_officers:0 "天下市奉行"
 jxp_31_oda_tenka_market_officers_desc:0 "织田旧法中的市场奉行被赋予更大权力，使通商不至脱离天下法度。"
 jxp_31_tkg_fudai_closed_country:0 "谱代锁国奉行"
 jxp_31_tkg_fudai_closed_country_desc:0 "三河谱代被安置在海门、关所与港町要害，锁国令因此更有可执行的筋骨。"
 jxp_31_tkg_mikawa_hostage_order:0 "三河人质秩序"
 jxp_31_tkg_mikawa_hostage_order_desc:0 "德川旧日人质与谱代制度被转化为约束诸藩的国中秩序。"
 jxp_31_tkd_koshu_confucian_law:0 "甲州礼法"
 jxp_31_tkd_koshu_confucian_law_desc:0 "甲州法度的严整被朱子讲官重新解释，军役、分限与礼序得以相互支撑。"
 jxp_31_tkd_mountain_house_codes:0 "山国旧法"
 jxp_31_tkd_mountain_house_codes_desc:0 "武田旧臣保留山道、马场与家中分限之法，使新礼制不至离地太远。"
 jxp_31_ues_imperial_kanrei_letters:0 "管领奉还文书"
 jxp_31_ues_imperial_kanrei_letters_desc:0 "上杉关东管领旧名被奉还于朝廷文书之下，东国武名成为王政的支柱。"
 jxp_31_ues_echigo_justice_oaths:0 "越后义战誓纸"
 jxp_31_ues_echigo_justice_oaths_desc:0 "越后武士以义战之名守护新政，使王政复古在东国拥有可动员的武德。"
 jxp_31_hjo_odawara_closed_cadasters:0 "小田原国禁账册"
 jxp_31_hjo_odawara_closed_cadasters_desc:0 "北条检地与关东宿驿登记被纳入锁国法度，国中进出皆有账可查。"
 jxp_31_hjo_sogamae_domain_watch:0 "总构诸藩番"
 jxp_31_hjo_sogamae_domain_watch_desc:0 "小田原总构的守望经验扩展到诸藩要地，国禁由城防变成国家习惯。"
 jxp_31_smz_satsunan_halal_ports:0 "萨南清真市舶"
 jxp_31_smz_satsunan_halal_ports_desc:0 "琉球与南海旧路被岛津奉行重开，异俗商旅在萨南诸港获得可遵循的条目。"
 jxp_31_smz_satsuma_gunfounder_compact:0 "萨摩铁炮港约"
 jxp_31_smz_satsuma_gunfounder_compact_desc:0 "铁炮匠、水军与港町年寄共同立约，使外海贸易仍服从萨摩武备。"
 jxp_31_csk_ichiryo_monto_muster:0 "一领具足门徒军役"
 jxp_31_csk_ichiryo_monto_muster_desc:0 "土佐的一领具足被编入门徒公仪的军役册，田畴与甲胄再次写在同一张纸上。"
 jxp_31_csk_tosa_peasant_oaths:0 "土佐百姓誓纸"
 jxp_31_csk_tosa_peasant_oaths_desc:0 "长宗我部旧法承认百姓、地侍与门徒之间的复杂身份，使坊市秩序更稳。"
 jxp_31_ouc_yamaguchi_sea_tribute:0 "山口海贡文书"
 jxp_31_ouc_yamaguchi_sea_tribute_desc:0 "大内旧日的西国商路、勘合记忆与朝鲜往来被重新整理为开国文书。"
 jxp_31_ouc_suofu_merchant_council:0 "周防商议众"
 jxp_31_ouc_suofu_merchant_council_desc:0 "周防商人、寺社与旧臣共同议定港町条目，使外海商路保持西国旧礼。"
 jxp_31_img_tokaido_confucian_codes:0 "东海道礼制法书"
 jxp_31_img_tokaido_confucian_codes_desc:0 "今川旧法书被朱子讲官吸收，东海道政务与礼制名分相互衔接。"
 jxp_31_img_suruga_house_law:0 "骏河家法诸司"
 jxp_31_img_suruga_house_law_desc:0 "骏河旧法保留守护家格式与城下政务经验，使新礼制更容易被奉行执行。"
