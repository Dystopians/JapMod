l_english:
 ODA_ideas:0 "织田理念"
 ODA_ideas_start:0 "织田传统"
 ODA_ideas_bonus:0 "织田野心"
 jxp_oda_rakuichi_rakuza:0 "乐市乐座"
 jxp_oda_rakuichi_rakuza_desc:0 "撤去座商旧权，令町人与货物流向城下。市声越盛，本家兵粮与财用便越充实。"
 jxp_oda_tenka_fubu:0 "天下布武"
 jxp_oda_tenka_fubu_desc:0 "天下不再只是京都旧语，而是可以由军旗、印判与新法重新写成的秩序。"
 jxp_oda_kurohoro_generals:0 "黑母衣众"
 jxp_oda_kurohoro_generals_desc:0 "精选近习随主君突入战阵，传令、护卫与决断皆在马前完成。"
 jxp_oda_azuchi_court:0 "安土御殿"
 jxp_oda_azuchi_court_desc:0 "湖畔高城以金碧与石垣显示新权威，使战国诸侯不得不仰视织田之政。"
 jxp_oda_sandansei_fire:0 "三段击"
 jxp_oda_sandansei_fire_desc:0 "铁炮不再是奇物，而是被编入足轻队列的雷声。轮番装填，轮番射击，敌阵因之迟疑。"
 jxp_oda_namban_patrons:0 "南蛮庇护"
 jxp_oda_namban_patrons_desc:0 "传教士、商人和铁炮匠被安置在可用之处。外来之术若能服务国用，便不必被拒于门外。"
 jxp_oda_kenchi_registers:0 "太阁检地之先"
 jxp_oda_kenchi_registers_desc:0 "田畠、石高与军役被重新计入账册。天下的尺度，先从一村一町的墨线开始。"

 TKG_ideas:0 "德川理念"
 TKG_ideas_start:0 "德川传统"
 TKG_ideas_bonus:0 "德川野心"
 jxp_tkg_mikawa_bushi:0 "三河武士"
 jxp_tkg_mikawa_bushi_desc:0 "三河家臣以寡言与坚忍闻名。败阵之后仍能整队，困厄之中仍知所从。"
 jxp_tkg_sekisho_network:0 "关所耳目"
 jxp_tkg_sekisho_network_desc:0 "道路、渡口与关所皆有记录。来往诸人留下姓名，消息便随文书进入城中。"
 jxp_tkg_hatamoto_banners:0 "旗本番队"
 jxp_tkg_hatamoto_banners_desc:0 "直属旗本被编为可倚重的常备武力，既护卫主君，也维持家中军纪。"
 jxp_tkg_metsuke_records:0 "目付账簿"
 jxp_tkg_metsuke_records_desc:0 "目付巡察诸役，账簿核对仓廪与军役。家法越清，纷争越难藏身。"
 jxp_tkg_matsudaira_branches:0 "松平一门"
 jxp_tkg_matsudaira_branches_desc:0 "一门分枝既是屏障，也是约束。亲族被安置于要地，使本家之名延入诸郡。"
 jxp_tkg_toshogu_cult:0 "东照宫崇敬"
 jxp_tkg_toshogu_cult_desc:0 "祖灵被奉为守护家国的光辉。武家忠诚与社殿礼法由此合为一体。"
 jxp_tkg_famine_granaries:0 "饥馑赈仓"
 jxp_tkg_famine_granaries_desc:0 "仓廪按季核看，荒年开仓赈给。能让百姓活过冬日的政令，比军令更能安定一国。"

 TKD_ideas:0 "武田理念"
 TKD_ideas_start:0 "武田传统"
 TKD_ideas_bonus:0 "武田野心"
 jxp_tkd_kai_genji:0 "甲斐源氏"
 jxp_tkd_kai_genji_desc:0 "源氏名门与山国武威相互支撑。旗帜展开时，甲斐武士知晓自己为何而战。"
 jxp_tkd_shingen_dams:0 "信玄堤"
 jxp_tkd_shingen_dams_desc:0 "治水不是文吏小事。驯服河川，便是把荒年、洪水与田税一并纳入家法。"
 jxp_tkd_nokizaru_network:0 "轩猿之网"
 jxp_tkd_nokizaru_network_desc:0 "山路、宿场与敌城之间都有无名眼线。军议之前，情报已先行抵达。"
 jxp_tkd_kurokawa_gold:0 "黑川金山"
 jxp_tkd_kurokawa_gold_desc:0 "山腹之金供养骑兵、筑城与外交馈赠。甲斐的贫瘠因矿脉而有锋芒。"
 jxp_tkd_koshu_hatto:0 "甲州法度"
 jxp_tkd_koshu_hatto_desc:0 "国法将军役、诉讼与家臣义务写成可循之例，使强兵有了同样强硬的秩序。"
 jxp_tkd_twentyfour_generals:0 "二十四将"
 jxp_tkd_twentyfour_generals_desc:0 "重臣各掌一方，合则为军。名将之名不只为传说，也为军制所依。"
 jxp_tkd_koyo_gunkan:0 "甲阳军鉴"
 jxp_tkd_koyo_gunkan_desc:0 "战阵经验被整理为可传授的军学。败与胜都留在书中，供后人反复校读。"

 UES_ideas:0 "上杉理念"
 UES_ideas_start:0 "上杉传统"
 UES_ideas_bonus:0 "上杉野心"
 jxp_ues_kanto_kanrei:0 "关东管领"
 jxp_ues_kanto_kanrei_desc:0 "旧职名仍有号召之力。以上杉之名进入关东，诸家便不得不回应其礼法。"
 jxp_ues_yamanouchi_branches:0 "山内与扇谷"
 jxp_ues_yamanouchi_branches_desc:0 "分支虽常相争，却也保留了家名的余威。争执被调入军阵，便能成为经验。"
 jxp_ues_kamakura_office:0 "镰仓公方旧馆"
 jxp_ues_kamakura_office_desc:0 "镰仓的旧政所仍可修复。军役和补给沿旧日道路重归秩序。"
 jxp_ues_dragon_of_echigo:0 "越后之龙"
 jxp_ues_dragon_of_echigo_desc:0 "主君亲临战场，军势如雪岭奔流。其威名足以让敌军在交锋前便已动摇。"
 jxp_ues_nokizaru:0 "轩猿众"
 jxp_ues_nokizaru_desc:0 "轻捷斥候穿行山径，传回敌营火光与粮道去向。"
 jxp_ues_agakita_shu:0 "扬北众"
 jxp_ues_agakita_shu_desc:0 "北越豪族被纳入军役，桀骜之气经誓约与恩赏化为阵中坚锋。"
 jxp_ues_denkoku_no_ji:0 "传国之辞"
 jxp_ues_denkoku_no_ji_desc:0 "家训与文书使继承不只凭血脉，也凭可被诸臣承认的名分。"

 HJO_ideas:0 "北条理念"
 HJO_ideas_start:0 "北条传统"
 HJO_ideas_bonus:0 "北条野心"
 jxp_hjo_kamakura_legacy:0 "镰仓旧威"
 jxp_hjo_kamakura_legacy_desc:0 "关东记得镰仓的名号。北条借其余光，使新兴之家披上古老权威。"
 jxp_hjo_night_combat:0 "夜袭之法"
 jxp_hjo_night_combat_desc:0 "小田原武士善用夜色、山径与潮声。敌军未及整列，刀光已入营栅。"
 jxp_hjo_odawara_administration:0 "小田原仕置"
 jxp_hjo_odawara_administration_desc:0 "诉讼、年贡与军役由城中评定众细审。关东广土因文书而被连缀。"
 jxp_hjo_tokusei:0 "德政调停"
 jxp_hjo_tokusei_desc:0 "债务与旧怨若不调停，便会在战后重新燃起。宽免有度，方能使新领归心。"
 jxp_hjo_castle_ring:0 "北条支城网"
 jxp_hjo_castle_ring_desc:0 "本城、支城与山城彼此照应。敌人即使夺下一门，也仍要面对下一道石垣。"
 jxp_hjo_kanto_unification:0 "关东一圆"
 jxp_hjo_kanto_unification_desc:0 "坂东诸郡被逐一纳入家中。道路、城砦与人质使关东从地图变为可治之地。"
 jxp_hjo_odawara_council:0 "小田原评定"
 jxp_hjo_odawara_council_desc:0 "宿老与奉行共议国政，地方旧例也被带入城中裁决。"

 MRI_ideas:0 "毛利理念"
 MRI_ideas_start:0 "毛利传统"
 MRI_ideas_bonus:0 "毛利野心"
 jxp_mri_oe_lineage:0 "大江之裔"
 jxp_mri_oe_lineage_desc:0 "文武之名皆可追溯旧家。毛利以谱系证明自己不只是山中豪族。"
 jxp_mri_kokujin_ikki:0 "国人一揆之长"
 jxp_mri_kokujin_ikki_desc:0 "安艺国人习惯盟约与合议。将其束为一体，便能从小领中聚出大军。"
 jxp_mri_diplomatic_web:0 "谋略外交"
 jxp_mri_diplomatic_web_desc:0 "盟书、婚姻、离间与密约都是战国兵器。毛利之刀常在书信之后出鞘。"
 jxp_mri_three_arrows:0 "三矢之训"
 jxp_mri_three_arrows_desc:0 "一矢易折，三矢难摧。家中诸枝因共同训诫而知团结之重。"
 jxp_mri_hiroshima_castle:0 "广岛筑城"
 jxp_mri_hiroshima_castle_desc:0 "城下町与河港并起，使山阴山阳的军政财用有了新的枢纽。"
 jxp_mri_itsukushima_fleet:0 "严岛水军"
 jxp_mri_itsukushima_fleet_desc:0 "濑户内潮流与岛影皆为友军。毛利水军能在狭海中把敌船逼入死地。"
 jxp_mri_hagi_ware:0 "萩烧与茶汤"
 jxp_mri_hagi_ware_desc:0 "陶土、茶器与礼法让武家威仪不只显于甲胄，也显于客座之间。"

 SMZ_ideas:0 "岛津理念"
 SMZ_ideas_start:0 "岛津传统"
 SMZ_ideas_bonus:0 "岛津野心"
 jxp_smz_satsuma_hayato:0 "萨摩隼人"
 jxp_smz_satsuma_hayato_desc:0 "南九州武士以刚烈闻名。阵前一声呐喊，常比鼓声更能催动军心。"
 jxp_smz_satsunan_school:0 "萨南学统"
 jxp_smz_satsunan_school_desc:0 "家中教育兼重武艺与经学，使地方豪族在严苛军纪中找到共同语言。"
 jxp_smz_three_provinces:0 "三州再合"
 jxp_smz_three_provinces_desc:0 "萨摩、大隅、日向被重新束入一门。山川虽险，政令却可由本城传达。"
 jxp_smz_tsurinobuse:0 "钓野伏"
 jxp_smz_tsurinobuse_desc:0 "佯退引敌，伏兵合围。岛津之阵不求声势浩大，只求一击折锋。"
 jxp_smz_tanegashima_foundries:0 "种子岛锻冶"
 jxp_smz_tanegashima_foundries_desc:0 "南海传来的铁炮在九州炉火中被拆解、仿制并改良。"
 jxp_smz_ryukyu_trade:0 "琉球航路"
 jxp_smz_ryukyu_trade_desc:0 "琉球与南岛航线把萨摩同更远海域相连。风帆带回货物，也带回消息。"
 jxp_smz_early_westernization:0 "早期外学"
 jxp_smz_early_westernization_desc:0 "南蛮船、铁炮术与异国书卷先至九州。善学者能在天下变局前先闻潮声。"

 OTM_ideas:0 "大友理念"
 OTM_ideas_start:0 "大友传统"
 OTM_ideas_bonus:0 "大友野心"
 jxp_otm_northern_kyushu:0 "北九州霸权"
 jxp_otm_northern_kyushu_desc:0 "筑前、丰前与丰后诸路相连，兵粮和军势皆可向九州腹地推进。"
 jxp_otm_bungo_ports:0 "丰后港市"
 jxp_otm_bungo_ports_desc:0 "港口、银货与外来商船为大友带来远超山城的财源。"
 jxp_otm_brave_retainers:0 "勇烈家臣"
 jxp_otm_brave_retainers_desc:0 "大友家臣在九州战阵中反复磨砺，败局之中仍能守住本阵。"
 jxp_otm_nanban_trade:0 "南蛮贸易"
 jxp_otm_nanban_trade_desc:0 "黑船入港，丝、铅、镜与铁炮皆入账册。丰后因此能与远海相谈。"
 jxp_otm_christian_lords:0 "吉利支丹诸侯"
 jxp_otm_christian_lords_desc:0 "洗礼使一部分武士获得新的誓言语言，也让丰后成为传教士眼中的门户。"
 jxp_otm_tensho_embassy:0 "天正遣欧"
 jxp_otm_tensho_embassy_desc:0 "少年使节远赴西海之外，将日本诸侯的名号带入陌生宫廷。"
 jxp_otm_kunikuzushi:0 "国崩"
 jxp_otm_kunikuzushi_desc:0 "沉重大炮被拖向城下，石垣与木栅在雷鸣中显出裂缝。"

 DTE_ideas:0 "伊达理念"
 DTE_ideas_start:0 "伊达传统"
 DTE_ideas_bonus:0 "伊达野心"
 jxp_dte_oshu_shugo:0 "奥州守护"
 jxp_dte_oshu_shugo_desc:0 "东北广土需要强名与强兵。伊达以守护之名把山河重新纳入家中。"
 jxp_dte_marriage_expansion:0 "婚姻扩张"
 jxp_dte_marriage_expansion_desc:0 "姻亲可开城门，也可止干戈。伊达的扩张常先由婚书试探边界。"
 jxp_dte_renga_circle:0 "连歌会座"
 jxp_dte_renga_circle_desc:0 "歌会与文事使边地武家不失风雅，也给诸豪族提供同席相谈的机会。"
 jxp_dte_dragon_corps:0 "独眼龙之军"
 jxp_dte_dragon_corps_desc:0 "主君的威名鼓动锐兵向前。火器与突击合用，令奥州军势声势顿变。"
 jxp_dte_red_seal_ships:0 "朱印船"
 jxp_dte_red_seal_ships_desc:0 "远洋许可让伊达不止面向陆奥山河，也把目光投向太平洋彼岸。"
 jxp_dte_keicho_embassy:0 "庆长遣使"
 jxp_dte_keicho_embassy_desc:0 "使节越海而行，带着东北大名的书信进入遥远王庭。"
 jxp_dte_domain_development:0 "仙台开府"
 jxp_dte_domain_development_desc:0 "新城、新田与河港一并兴筑，使奥州雄心有了可积蓄的根基。"

 ASK_ideas:0 "足利理念"
 ASK_ideas_start:0 "足利传统"
 ASK_ideas_bonus:0 "足利野心"
 jxp_ask_genji_headship:0 "源氏棟梁"
 jxp_ask_genji_headship_desc:0 "足利之名承接源氏余绪。即使幕府衰微，旧日谱系仍能召来敬畏。"
 jxp_ask_court_defenders:0 "禁里守护"
 jxp_ask_court_defenders_desc:0 "将军家以护持朝仪自任。京都的礼法虽弱，却仍能授予兵威以名分。"
 jxp_ask_higashiyama_culture:0 "东山文化"
 jxp_ask_higashiyama_culture_desc:0 "茶、能、庭园与书院在乱世中延续风雅，使武家威仪显于细节。"
 jxp_ask_tosen_bugyo:0 "唐船奉行"
 jxp_ask_tosen_bugyo_desc:0 "外来船舶与港町贸易由奉行审理，朝贡、商利与规约因此不致混乱。"
 jxp_ask_bugyoshu_hokushu:0 "奉公众与奉行众"
 jxp_ask_bugyoshu_hokushu_desc:0 "幕府旧吏仍懂文书、诉讼与礼法。善用其才，便能使旧制度再度运转。"
 jxp_ask_bakufu_domains:0 "幕府直辖地"
 jxp_ask_bakufu_domains_desc:0 "直辖地供养京都政务，也提醒诸侯将军家仍有自己的土地与仓廪。"
 jxp_ask_shugo_system:0 "重整守护制"
 jxp_ask_shugo_system_desc:0 "守护不应只拥兵自重。若能重订役责，诸国之力可再次汇入幕府名下。"

 CSK_ideas:0 "长宗我部理念"
 CSK_ideas_start:0 "长宗我部传统"
 CSK_ideas_bonus:0 "长宗我部野心"
 jxp_csk_ichiryo_gusoku:0 "一领具足"
 jxp_csk_ichiryo_gusoku_desc:0 "农兵自备甲具，平时耕作，战时应召。土佐贫瘠，却能由此聚兵。"
 jxp_csk_tosa_seven_clans:0 "土佐七雄"
 jxp_csk_tosa_seven_clans_desc:0 "旧豪族或敌或友，最终都要被纳入土佐的新秩序。"
 jxp_csk_shikoku_unification:0 "四国一统"
 jxp_csk_shikoku_unification_desc:0 "山海隔开的诸国被军道与誓约连起。四国不再只是岛上诸敌。"
 jxp_csk_hundred_article_code:0 "百箇条"
 jxp_csk_hundred_article_code_desc:0 "法律将军役、田地和家中名分写成条目，使新兴之国有章可循。"
 jxp_csk_ura_do_navy:0 "浦户水军"
 jxp_csk_ura_do_navy_desc:0 "浦户湾内的船手熟知潮流与岛影，足以护送兵粮并威胁海峡。"
 jxp_csk_god_of_arts:0 "艺能之神"
 jxp_csk_god_of_arts_desc:0 "武家若能护持文艺，便能让征服显得不只是刀锋之事。"
 jxp_csk_temple_patronage:0 "寺社扶持"
 jxp_csk_temple_patronage_desc:0 "寺社被安置于国法之内，祭礼和文书共同稳定乡村人心。"

 OUC_ideas:0 "大内理念"
 OUC_ideas_start:0 "大内传统"
 OUC_ideas_bonus:0 "大内野心"
 jxp_ouc_baekje_lineage:0 "百济后裔"
 jxp_ouc_baekje_lineage_desc:0 "渡来传说使大内同朝鲜半岛的礼法与贸易相连，成为外交席上的谈资。"
 jxp_ouc_korea_trade:0 "朝鲜贸易"
 jxp_ouc_korea_trade_desc:0 "对马、博多与朝鲜航路将货物和使节带入山口。"
 jxp_ouc_anti_wokou_fleet:0 "讨倭水军"
 jxp_ouc_anti_wokou_fleet_desc:0 "海盗若不受约束，贸易便会断绝。大内水军以秩序之名巡行海上。"
 jxp_ouc_hakata_city:0 "博多町"
 jxp_ouc_hakata_city_desc:0 "博多商人懂得海路、银价与异国规矩。掌握此城，便掌握九州北门。"
 jxp_ouc_mercantile_diplomacy:0 "商贸外交"
 jxp_ouc_mercantile_diplomacy_desc:0 "馈赠、许可证与商约能抵达刀兵难达之处。大内外交常随货船同行。"
 jxp_ouc_missionary_harbors:0 "迎纳传教士"
 jxp_ouc_missionary_harbors_desc:0 "异国僧侣被允许在港町停留。新信仰未必入心，却能带来远方消息。"
 jxp_ouc_retainer_factions:0 "家中派阀"
 jxp_ouc_retainer_factions_desc:0 "派阀若被善加平衡，便能互相牵制，使权力不至落入一门私手。"

 IMG_ideas:0 "今川理念"
 IMG_ideas_start:0 "今川传统"
 IMG_ideas_bonus:0 "今川野心"
 jxp_img_claim_to_shogunate:0 "问鼎将军家"
 jxp_img_claim_to_shogunate_desc:0 "今川自视足以入主京都。通往将军之位的道路，先由名分和宣称铺成。"
 jxp_img_tokaido_mastery:0 "东海道之主"
 jxp_img_tokaido_mastery_desc:0 "东海道连通关东与畿内，商旅、使者和军势皆可在今川关照下往来。"
 jxp_img_imagawa_house_law:0 "今川假名目录"
 jxp_img_imagawa_house_law_desc:0 "家法以通俗文字颁示诸臣，使国人和百姓都能知道边界所在。"
 jxp_img_revised_clan_code:0 "追加法度"
 jxp_img_revised_clan_code_desc:0 "旧法经战国乱局重新增补，家中纠纷因成例而少了刀兵。"
 jxp_img_triple_alliance:0 "三国同盟"
 jxp_img_triple_alliance_desc:0 "骏河、甲斐与相模的盟约一度让东国安定，也让今川得以西望京都。"
 jxp_img_mount_fuji:0 "富士之望"
 jxp_img_mount_fuji_desc:0 "富士山映照今川治下的骏河。自然之威与武家名望在此相互加冕。"
 jxp_img_march_to_kyoto:0 "上洛军"
 jxp_img_march_to_kyoto_desc:0 "若要成就天下之志，就必须把东海道诸军带向京都。"

 SOO_ideas:0 "宗氏理念"
 SOO_ideas_start:0 "宗氏传统"
 SOO_ideas_bonus:0 "宗氏野心"
 jxp_soo_wakan_trade:0 "倭馆贸易"
 jxp_soo_wakan_trade_desc:0 "釜山倭馆使对马成为日本与朝鲜之间的窄门。门虽窄，利却长流。"
 jxp_soo_wakou_tradition:0 "倭寇旧习"
 jxp_soo_wakou_tradition_desc:0 "海上豪强既可为盗，也可为兵。宗氏懂得把浪潮中的人手纳入旗帜。"
 jxp_soo_tsushima_waters:0 "对马海峡"
 jxp_soo_tsushima_waters_desc:0 "潮汐、暗礁与海雾皆在本地船手心中。外来舰队难以在此从容列阵。"
 jxp_soo_bahan_ships:0 "波半船"
 jxp_soo_bahan_ships_desc:0 "轻快船只适于巡航、私掠与传递消息。海峡政治从来离不开速度。"
 jxp_soo_tough_negotiators:0 "强硬通交"
 jxp_soo_tough_negotiators_desc:0 "宗氏在幕府、朝鲜与海商之间周旋，言辞必须柔软，底线却不能轻移。"
 jxp_soo_port_improvements:0 "港津修筑"
 jxp_soo_port_improvements_desc:0 "泊地、仓库与船坞被逐步整修，使狭小对马足以支撑更大的海上往来。"
 jxp_soo_elementary_school:0 "乡校启蒙"
 jxp_soo_elementary_school_desc:0 "读写与算术使通交文书不再只依赖少数译者。海上之国也需要纸笔。"
