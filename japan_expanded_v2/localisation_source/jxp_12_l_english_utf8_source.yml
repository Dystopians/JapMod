l_english:
 jxp_mission_shrine_land_registers_title:0 "社领账册"
 jxp_mission_shrine_land_registers_desc:0 "战乱之后，神社的旧领、村社的祭田与奉行所的年贡账常常彼此牴牾。若能重校社领，使神事不废、民役有据，神国之名便不只在祝词之间。"
 jxp_mission_ise_pilgrim_roads_title:0 "伊势参宫道"
 jxp_mission_ise_pilgrim_roads_desc:0 "伊势之路通向神宫，也通向诸国民心。旅人、御师、町人与奉行沿道相会，一条参宫道便是一条把天下缝合起来的细线。"
 jxp_mission_kami_castle_towns_title:0 "神社与城下"
 jxp_mission_kami_castle_towns_desc:0 "城下町不可只听见商贾与武士的声音。社寺、祭礼与市日同在一地运行，才使新城不忘旧俗，使旧俗不拒新政。"
 jxp_mission_incident_order_title:0 "裁定神国异闻"
 jxp_mission_incident_order_desc:0 "异国之风、民间之祈与神社之议屡屡触动国法。国家必须学会裁断这些异闻，而不是任其化作谣言或恐惧。"
 jxp_mission_sacred_isles_title:0 "神州诸岛"
 jxp_mission_sacred_isles_desc:0 "京都有礼，伊势有神，诸岛有民。三者若能各得其所，日本便可称神州，而非仅凭刀剑守住旧名。"
 jxp_mission_port_congregation_registers_title:0 "港町信徒簿"
 jxp_mission_port_congregation_registers_desc:0 "长崎、平户与诸港的信徒不再只是传闻中的影子。将其记入公开账簿，既能保护商路，也能使教会明白自己受国家之法约束。"
 jxp_mission_kana_doctrine_title:0 "假名教义书"
 jxp_mission_kana_doctrine_desc:0 "若信仰只以异国文字传行，便永远像停泊港外的船。以假名译经讲道，使其进入日本人的耳朵，也进入官府可审之文。"
 jxp_mission_church_court_compact_title:0 "教会与朝仪"
 jxp_mission_church_court_compact_desc:0 "十字架不可自行成为王法，朝仪也不可假装港口没有钟声。二者在京都之前重定边界，方能共处而不互相吞没。"
 jxp_mission_martyrs_and_merchants_title:0 "殉道者与商人"
 jxp_mission_martyrs_and_merchants_desc:0 "血与银常沿同一条海路抵达。若国家能将苦难记忆、港口利益与公共秩序安放在同一张案上，吉利支丹日本便不只是热忱，也是一种制度。"
 jxp_mission_cross_sun_commonwealth_title:0 "十字日轮国"
 jxp_mission_cross_sun_commonwealth_desc:0 "海上钟声与日轮旗帜同时升起。此国既向外洋开门，也要求外来信仰承认日本的名分与法度。"
 jxp_mission_domain_school_exams_title:0 "藩校考课"
 jxp_mission_domain_school_exams_desc:0 "武士若只知拔刀，太平便无所凭依。讲堂之中，诸生读经、习礼、治算，使一国之士从战阵走向官箴。"
 jxp_mission_ritual_census_title:0 "礼制户籍"
 jxp_mission_ritual_census_desc:0 "户籍、宗门、人别与年贡不该各自为政。以礼法统其名分，以账册明其役分，天下便有了可日用而不觉的秩序。"
 jxp_mission_harmonize_kami_rites_title:0 "神儒合礼"
 jxp_mission_harmonize_kami_rites_desc:0 "神宫不可废，孔庙亦不可轻。以祭祀之礼解释神明之尊，使神道被纳入国家礼制，而非被新学粗暴抹去。"
 jxp_mission_embassies_of_rite_title:0 "礼使往还"
 jxp_mission_embassies_of_rite_desc:0 "朝鲜、明清与诸邻皆有礼文。日本若以儒礼自立，便需在往来书契与宾礼坐次之间证明自己并非只学其名。"
 jxp_mission_ordered_rite_state_title:0 "礼制国家"
 jxp_mission_ordered_rite_state_desc:0 "《中庸》曰：致中和，天地位焉，万物育焉。礼制若能落入官署、学校与乡里，日本便能以文治收束战国余波。"
 jxp_mission_harbor_mosque_registers_title:0 "港町清真簿"
 jxp_mission_harbor_mosque_registers_desc:0 "香料、丝货与朝拜者带来新的礼拜声。将清真寺与商团纳入港町账册，使海门的信仰不再游离于国法之外。"
 jxp_mission_qadi_port_courts_title:0 "港市法官"
 jxp_mission_qadi_port_courts_desc:0 "商争、婚契与遗产随海船而来。设港市法官，使外洋的习惯法在日本法度之下获得可诉之处。"
 jxp_mission_south_sea_brokers_title:0 "南海经纪"
 jxp_mission_south_sea_brokers_desc:0 "马来、爪哇与吕宋的经纪人熟知季风与货价。国家若能任用这些耳目，便可让海门外学伸向更远的南海。"
 jxp_mission_halal_granary_law_title:0 "洁食仓法"
 jxp_mission_halal_granary_law_desc:0 "粮仓不只供应军旅，也安顿信仰与日常。洁食之法若能与年贡、仓储和市易相容，海峡日本便能避免把宗教变成饥荒时的裂痕。"
 jxp_mission_south_sea_maritime_law_title:0 "南海海法"
 jxp_mission_south_sea_maritime_law_desc:0 "海上国家不能只靠港口得利，也要能在风暴、商约与信仰之间立法。日轮照向南海时，也须有自己的海法。"
 jxp_mission_monto_rolls_title:0 "门徒名帐"
 jxp_mission_monto_rolls_desc:0 "门徒既是信众，也是村社、町人和兵员。将其名帐公开于法度之下，方能使一向宗的热忱成为国家骨肉，而非无形的骚动。"
 jxp_mission_terauchi_market_charters_title:0 "寺内町市令"
 jxp_mission_terauchi_market_charters_desc:0 "寺内町以信仰聚民，也以市易养民。给商人、工匠与讲众定下市令，便能让念佛声与算盘声在同一街巷中相安。"
 jxp_mission_village_militia_oaths_title:0 "惣村誓纸"
 jxp_mission_village_militia_oaths_desc:0 "乡村可以执枪，也可以守约。以誓纸约束村兵，使其护田、护寺、护路，而不轻易化作一揆之火。"
 jxp_mission_kinri_monto_compact_title:0 "禁里与门徒"
 jxp_mission_kinri_monto_compact_desc:0 "朝廷与门徒之间未必只能互疑。若能以护持京都为誓，一向宗的民众国家也可在古老名分前找到自己的位置。"
 jxp_mission_commonwealth_covenant_title:0 "万民盟约"
 jxp_mission_commonwealth_covenant_desc:0 "此国不以一门一姓为根，而以村社、寺内町与讲众互立誓约为本。念佛者与武士同守国法，便是另一种天下。"
 jxp_mission_osaka_rice_ledger_title:0 "大坂米账"
 jxp_mission_osaka_rice_ledger_desc:0 "大坂仓廪连通诸藩财政。米价、年贡与汇兑若能入同一套账册，城下町的喧声便会成为国家的脉搏。"
 jxp_mission_castle_town_markets_title:0 "城下诸市"
 jxp_mission_castle_town_markets_desc:0 "太平不只由城墙证明，也由市日、座商和工匠证明。城下诸市兴盛，武家政权才有可持续的粮与银。"
 jxp_mission_domain_school_network_title:0 "诸藩学网"
 jxp_mission_domain_school_network_desc:0 "江户、京都与各藩讲堂彼此传抄书籍、考试与训令。学问若能成网，国家便不再只倚赖少数名臣的记忆。"
 jxp_mission_nagasaki_translation_house_title:0 "长崎译馆"
 jxp_mission_nagasaki_translation_house_desc:0 "译官在长崎逐字校读医书、炮术与航海图。外学不必像野火，也可像灯火：有罩，有芯，有人守夜。"
 jxp_mission_silver_silk_routing_title:0 "银丝航路"
 jxp_mission_silver_silk_routing_desc:0 "白银、丝绸、铜与书籍在海路上互相寻找。若国家能把这些流向纳入规则，日本便能从贸易中得到秩序而不只是财富。"
 jxp_mission_three_capitals_ledgers_title:0 "三都账法"
 jxp_mission_three_capitals_ledgers_desc:0 "京都掌名分，大坂掌米银，长崎掌外洋。三都账法相通，国家的眼睛便同时望向朝廷、市场与海门。"
 jxp_mission_northern_sea_office_title:0 "北海奉行"
 jxp_mission_northern_sea_office_desc:0 "松前以北，寒潮、夷地与渔场皆不可只听地方自理。设北海奉行，使北方边境进入国家的视野。"
 jxp_mission_matsumae_treaties_title:0 "松前约书"
 jxp_mission_matsumae_treaties_desc:0 "与虾夷诸社的往来既有交易，也有边防。约书若能定下互市、贡礼与禁暴之法，北方就不只是边陲。"
 jxp_mission_coastal_beacon_chain_title:0 "海岸烽燧"
 jxp_mission_coastal_beacon_chain_desc:0 "外船、海盗与风暴都先抵达海岸。烽燧、番所与水军若能连成一线，诸港便不再各自惊惶。"
 jxp_mission_tsushima_interpreters_title:0 "对马译官"
 jxp_mission_tsushima_interpreters_desc:0 "对马向来听得见朝鲜海峡两岸的低语。译官、书契与商约在此汇聚，使边岛成为外交之门。"
 jxp_mission_ryukyu_embassy_records_title:0 "琉球使录"
 jxp_mission_ryukyu_embassy_records_desc:0 "琉球往来南北，熟悉朝贡、商舶与季风。记录其使节与货路，日本便能从群岛之间理解东海。"
 jxp_mission_east_sea_protocol_title:0 "东海约法"
 jxp_mission_east_sea_protocol_desc:0 "北有松前，西有对马，南有琉球。若三路皆有章程，日本便能以约法而非偶然控制东海。"
 jxp_shrine_land_registers:0 "社领账册"
 jxp_shrine_land_registers_desc:0 "神社旧领、祭田与村账被重新校定，神事与民役各安其位。"
 jxp_ise_pilgrim_roads:0 "伊势参宫道"
 jxp_ise_pilgrim_roads_desc:0 "旅人、御师与奉行共同维护参宫道路，伊势的灯火沿道路照向诸国。"
 jxp_kami_castle_towns:0 "神社城下町"
 jxp_kami_castle_towns_desc:0 "祭礼、市日与城下町政务被安置在同一套秩序之中。"
 jxp_incident_order:0 "异闻裁定"
 jxp_incident_order_desc:0 "国家以法度裁断宗教异闻，使谣言不至于变成恐惧。"
 jxp_sacred_isles_settlement:0 "神州诸岛"
 jxp_sacred_isles_settlement_desc:0 "京都、伊势与诸岛民心被同一神国叙事温和地联结起来。"
 jxp_port_congregation_registers:0 "港町信徒簿"
 jxp_port_congregation_registers_desc:0 "港口信徒被纳入公开登记，商路与信仰皆不再完全游离。"
 jxp_translated_doctrine:0 "译定教义"
 jxp_translated_doctrine_desc:0 "以假名译定教义，使异国信仰进入可审、可讲、可辩的文字之中。"
 jxp_church_court_compact:0 "教会朝仪协约"
 jxp_church_court_compact_desc:0 "教会与朝廷各守边界，在同一国家礼法之下共存。"
 jxp_martyrs_and_merchants:0 "殉道者与商人"
 jxp_martyrs_and_merchants_desc:0 "苦难记忆与港口利益被重新缝合，使信仰不再只是危机之名。"
 jxp_cross_sun_commonwealth:0 "十字日轮国"
 jxp_cross_sun_commonwealth_desc:0 "日轮旗下，海上教会、商港与国家法度共同构成新的共同体。"
 jxp_confucian_exam_system:0 "藩校考课"
 jxp_confucian_exam_system_desc:0 "经义、算学与官箴被纳入藩校考课，武士渐成太平之吏。"
 jxp_ritual_census_state:0 "礼制户籍"
 jxp_ritual_census_state_desc:0 "户籍、宗门与年贡被礼制统摄，国家秩序有了清晰的文字。"
 jxp_kami_harmony_register:0 "神儒合礼"
 jxp_kami_harmony_register_desc:0 "神宫祭祀被纳入儒礼解释之中，新学不再轻毁旧俗。"
 jxp_embassies_of_rite:0 "礼使往还"
 jxp_embassies_of_rite_desc:0 "书契、宾礼与使节往来证明日本的礼制并非空名。"
 jxp_ordered_rite_state:0 "礼制国家"
 jxp_ordered_rite_state_desc:0 "讲堂、官署与乡里共同服从礼法，文治成为国家真正的刀鞘。"
 jxp_harbor_mosque_registers:0 "港町清真簿"
 jxp_harbor_mosque_registers_desc:0 "清真寺与商团进入港町账册，外洋信仰有了可见的位置。"
 jxp_qadi_port_courts_expanded:0 "港市法官"
 jxp_qadi_port_courts_expanded_desc:0 "港市法官调和海商习惯与日本法度，使争讼不至于撕裂港口。"
 jxp_south_sea_brokers:0 "南海经纪"
 jxp_south_sea_brokers_desc:0 "熟知季风与货价的经纪人被纳入国用，南海不再只是传闻。"
 jxp_south_sea_brokerage_port:0 "南海经纪港"
 jxp_south_sea_brokerage_port_desc:0 "南海经纪人在港中结账、验货与译价，使这座港口懂得远洋市场的节拍。"
 jxp_halal_granary_law:0 "洁食仓法"
 jxp_halal_granary_law_desc:0 "粮仓、市易与宗教习俗被谨慎协调，使日常生活少生裂痕。"
 jxp_sultanate_sea_law:0 "苏丹海法"
 jxp_sultanate_sea_law_desc:0 "海峡国家以自己的法度管理航路、商约与信仰。"
 jxp_monto_rolls:0 "门徒名帐"
 jxp_monto_rolls_desc:0 "门徒名帐公开于法度之下，使讲众热忱化作可治理的力量。"
 jxp_terauchi_market_charters:0 "寺内町市令"
 jxp_terauchi_market_charters_desc:0 "寺内町的市易、工坊与讲众被同一套市令保护并约束。"
 jxp_monto_militia_oaths:0 "惣村誓纸"
 jxp_monto_militia_oaths_desc:0 "村兵以誓纸受约，护田护路而不轻启一揆。"
 jxp_kinri_monto_compact:0 "禁里门徒协约"
 jxp_kinri_monto_compact_desc:0 "门徒以护持京都为誓，民众国家因此获得古老名分的承认。"
 jxp_commonwealth_covenant:0 "万民盟约"
 jxp_commonwealth_covenant_desc:0 "村社、寺内町与讲众互立誓约，构成不同于一门一姓的天下。"
 jxp_osaka_rice_ledger:0 "大坂米账"
 jxp_osaka_rice_ledger_desc:0 "米价、年贡与汇兑被纳入大坂账法，诸藩财政有了共同语言。"
 jxp_sakai_merchant_quarter:0 "堺商人町"
 jxp_sakai_merchant_quarter_desc:0 "堺商人在市町中议价、筹资与分担风险，使民间贸易变得可见也可管。"
 jxp_osaka_ledger_city:0 "大坂账所町"
 jxp_osaka_ledger_city_desc:0 "账所、仓廪与米市连成一体，城市因可计算的财政而继续生长。"
 jxp_castle_town_markets:0 "城下诸市"
 jxp_castle_town_markets_desc:0 "市日、座商与工坊在城下繁盛，太平由市声证明。"
 jxp_domain_school_network:0 "诸藩学网"
 jxp_domain_school_network_desc:0 "各藩讲堂互通书籍、考课与训令，学问成为国家之网。"
 jxp_domain_school_city:0 "藩校书院町"
 jxp_domain_school_city_desc:0 "讲堂、书库与宿舍围绕城下扩展，年轻官吏在这里学习治理的尺度。"
 jxp_translation_house:0 "长崎译馆"
 jxp_translation_house_desc:0 "译官校读外书，使外学有罩、有芯，也有人守夜。"
 jxp_translation_port_quarter:0 "译馆港町"
 jxp_translation_port_quarter_desc:0 "译馆、药铺与书肆在港町中相邻而立，外学被纳入可审读的日常。"
 jxp_silver_silk_routing:0 "银丝航路"
 jxp_silver_silk_routing_desc:0 "银、丝、铜与书籍的流向被纳入规则，财富不再只是诱惑。"
 jxp_three_capitals_ledgers:0 "三都账法"
 jxp_three_capitals_ledgers_desc:0 "京都、大坂与长崎的账法互通，国家同时看见名分、市场与海门。"
 jxp_northern_sea_office:0 "北海奉行"
 jxp_northern_sea_office_desc:0 "松前以北的渔场、互市与边防被纳入国家视野。"
 jxp_northern_sea_port_office:0 "北海港务所"
 jxp_northern_sea_port_office_desc:0 "港务所登记船只、渔税与边防粮秣，使北方港口不再只靠旧习维系。"
 jxp_matsumae_treaties:0 "松前约书"
 jxp_matsumae_treaties_desc:0 "约书定下互市、贡礼与禁暴之法，使北方不再只是边陲。"
 jxp_coastal_beacon_chain:0 "海岸烽燧"
 jxp_coastal_beacon_chain_desc:0 "烽燧、番所与水军连成一线，使诸港不再各自惊惶。"
 jxp_tsushima_interpreters:0 "对马译官"
 jxp_tsushima_interpreters_desc:0 "对马译官管理朝鲜海峡的书契、商约与风声。"
 jxp_ryukyu_embassy_records:0 "琉球使录"
 jxp_ryukyu_embassy_records_desc:0 "琉球使录整理朝贡、季风与货路，使群岛经验进入国政。"
 jxp_east_sea_protocol:0 "东海约法"
 jxp_east_sea_protocol_desc:0 "松前、对马与琉球三路皆有章程，东海因此成为可治理的海。"
 jxp_mission_expansion.1.t:0 "社领重校"
 jxp_mission_expansion.1.d:0 "奉行所取出旧券，御师呈上祭田账，村役人则陈说战乱以来的实际耕作。笔墨之间，神事与民役终于不再互相遮蔽。"
 jxp_mission_expansion.1.a:0 "使神事与民役各得其所。"
 jxp_mission_expansion.2.t:0 "异闻入案"
 jxp_mission_expansion.2.d:0 "诸国传来关于外来学问、民间祈祷与神社旧例的争议。朝廷、公家与武家各执一辞，然而国家若不裁断，谣言便会替国家裁断。"
 jxp_mission_expansion.2.a:0 "以法度定其边界。"
 jxp_mission_expansion.3.t:0 "港町信徒簿"
 jxp_mission_expansion.3.d:0 "港口教会将信众名册交给奉行。钟声仍从海雾中传来，但它现在有了账册、印判与可追问的责任。"
 jxp_mission_expansion.3.a:0 "钟声亦须入账。"
 jxp_mission_expansion.4.t:0 "京都协约"
 jxp_mission_expansion.4.d:0 "教士、武家使者与朝廷官人同坐一席。十字架与笏板并不天然相容，但它们可以共同承认国家法度高于一时热忱。"
 jxp_mission_expansion.4.a:0 "让信仰在礼法之内安身。"
 jxp_mission_expansion.5.t:0 "讲堂考课"
 jxp_mission_expansion.5.d:0 "诸藩讲堂送来试卷与名簿。有人善经义，有人精算学，也有人仍怀念马上功名；但太平之世需要他们学会另一种武勇。"
 jxp_mission_expansion.5.a:0 "以笔砚收束刀锋。"
 jxp_mission_expansion.6.t:0 "神儒同案"
 jxp_mission_expansion.6.d:0 "儒者在神宫祭礼前谨慎措辞，神官也承认礼制并非敌人。旧神与新学互不屈服，却开始共享同一套国家语言。"
 jxp_mission_expansion.6.a:0 "神明亦可入礼。"
 jxp_mission_expansion.7.t:0 "海门礼拜"
 jxp_mission_expansion.7.d:0 "港町清真寺的礼拜声与市声相杂。商团愿意登记，法官愿意受命，外洋习俗由此从传闻变为制度。"
 jxp_mission_expansion.7.a:0 "使海门诸礼有籍可循。"
 jxp_mission_expansion.8.t:0 "南海经纪人"
 jxp_mission_expansion.8.d:0 "来自马来与爪哇的经纪人摊开航海日记，讲述季风、浅滩与货价。他们的口音陌生，消息却极为实用。"
 jxp_mission_expansion.8.a:0 "让季风为国所用。"
 jxp_mission_expansion.9.t:0 "门徒名帐"
 jxp_mission_expansion.9.d:0 "讲众长老呈上名帐，村社代表按下手印。被看见的信众不再只是潜伏力量，也成为可受约束、可被保护的臣民。"
 jxp_mission_expansion.9.a:0 "以誓纸安顿众心。"
 jxp_mission_expansion.10.t:0 "禁里与门徒"
 jxp_mission_expansion.10.d:0 "门徒使者入京，誓以守护禁里为义。朝廷未必完全信任这股民众力量，却愿意承认其护持京都的诚意。"
 jxp_mission_expansion.10.a:0 "使念佛声护持王城。"
 jxp_mission_expansion.20.t:0 "大坂米账"
 jxp_mission_expansion.20.d:0 "大坂仓廪的账册摊满案头，米、银、汇兑与诸藩债务在同一处交织。这里的市声有时比军鼓更能决定国家的安危。"
 jxp_mission_expansion.20.a:0 "让天下听见仓廪的声音。"
 jxp_mission_expansion.21.t:0 "诸藩学网"
 jxp_mission_expansion.21.d:0 "藩校之间开始互寄书籍、考题与讲义。知识沿驿路传递，像缓慢却可靠的灯火，一站一站照亮官署。"
 jxp_mission_expansion.21.a:0 "使学问成为国家之网。"
 jxp_mission_expansion.22.t:0 "长崎译馆"
 jxp_mission_expansion.22.d:0 "译官在长崎伏案校读，医师争论药名，炮术家辨认图样。外学在这里不再只是惊奇，而是一项日复一日的公事。"
 jxp_mission_expansion.22.a:0 "灯火可以入港，但须有人守夜。"
 jxp_mission_expansion.30.t:0 "北海奉行"
 jxp_mission_expansion.30.d:0 "松前送来关于渔场、互市与北方诸社的报告。寒潮之外并非空白，那里也有可交易、可结约、可失去的国家利益。"
 jxp_mission_expansion.30.a:0 "把北海写入国政。"
