l_english:
 jxp_19_asa_ichijodani_council_desc:0 "朝仓家将谷城、寺社、町屋与家臣评议整为一体，使越前山谷之政更能抵达每一道门前。"
 jxp_19_htk_wakae_retainer_oaths_desc:0 "畠山家以若江旧臣誓纸重聚河内武门，令衰落名家仍可用忠义与名分支撑军政。"
 jxp_19_ike_himeji_accounts_desc:0 "池田家整理姬路城下账册，使白墙之下的仓廪、町屋与武备皆可长久运行。"
 jxp_19_mae_kanazawa_patronage_desc:0 "前田家以金泽城下的茶、能、工匠与仓账装点国政，令富庶不止入库，也入礼乐。"
 jxp_19_sba_buei_restoration_desc:0 "斯波家重修武卫旧名，以官途、家格与诸臣连判重新束缚离散的门第。"
 jxp_19_ymn_sixth_share_registers_desc:0 "山名家以六分一殿旧望清点诸支，使山阴武门在破碎名分中仍可寻得秩序。"
 jxp_19_akm_banshu_castle_chain_desc:0 "赤松家重整播磨城链与关隘，使赤松旧名从山路、城砦与通行文书中复生。"
 jxp_19_kkc_aso_fire_rites_desc:0 "菊池家借阿苏火国之礼联络肥后诸姓，令山野豪族在同一旗帜下动员。"
 jxp_19_stk_kashima_muster_desc:0 "佐竹家以鹿岛誓刀和源氏名望整饬常陆武门，使关东东陲更听国法号令。"
 jxp_19_tki_mino_river_works_desc:0 "土岐家整治美浓河道、工匠与商路，使纸、刀与货物沿水网流入家政。"
 jxp_19_utn_nikko_barrier_guard_desc:0 "宇都宫家以日光山门与下野道路为屏障，守住北关东的礼书与兵路。"
 jxp_20_ama_gassan_toda_registers_desc:0 "尼子家以月山富田城账联结银山、山阴海岸与港口商书，使城砦阴影之外亦有海路收益。"
 jxp_20_hsk_sakai_kanrei_council_desc:0 "细川家以管领旧职和堺町商议重塑声望，使京洛席次与港町财富彼此支撑。"
 jxp_20_shn_dazaifu_brokers_desc:0 "少贰家借大宰府旧名联络博多、对马与朝鲜海路，九州北门因而更早听见潮声。"
 jxp_20_ogs_suwa_horse_masters_desc:0 "小笠原家以诹访神礼与弓马之名整饬山国，令马场、社坛与家法互为表里。"
 jxp_20_ktb_ise_court_petition_desc:0 "北畠家以伊势神郡与朝廷请文维系本领，使王统叙事有了粮账与户籍支撑。"
 jxp_20_akt_ezochi_trade_brokers_desc:0 "安东家以虾夷地互市、鱼货与毛皮贸易维系北方边地，使雪路与港口不再相隔。"
 jxp_20_cba_katori_muster_desc:0 "千叶家以香取誓刀与关东旧名召集军役，使下总武门在刀枪之外也有名分。"
 jxp_20_isk_tango_port_wardens_desc:0 "一色家整理丹后港口、山路与关所，使小海国的耳目更为灵便。"
 jxp_20_ito_hyuga_fort_network_desc:0 "伊东家以日向山中支城联络豪族、寺社与道路，令南九州的山海之间更有秩序。"
 jxp_20_kno_inland_sea_pilots_desc:0 "河野家将濑户内潮汐知识与岛众誓约写入家政，使伊予海路更听国家调遣。"
 jxp_20_tti_yamato_temple_compact_desc:0 "筒井家在大和寺社、町人和武家之间立约，使奈良旧地的日常秩序可被国家承认。"
 jxp_20_rfr_mutsu_nine_gates_desc:0 "南部家以陆奥九户、雪路与北海番所维持边地，使远郡不再只凭武力相连。"
