l_english:
 cb_jxp_b_eastward_revolution:0 "东归革命"
 cb_jxp_b_eastward_revolution_desc:0 "一个成熟、独立且控制跨太平洋中继点的殖民国家，可以在日本遭遇破产、内乱或政治崩解时发动东归革命。战争要求击败旧宗主的政治中心，却不允许借特殊条款吞并全日本。"
 jxp_b_eastward_revolution_wargoal:0 "迫使日本承认跨洋新秩序"
 jxp_b_eastward_revolution_wargoal_desc:0 "占领日本的政治中心，以决定海外解放、旧大陆成员国、两洋联邦或有限迁都。"
 JXP_B_EASTWARD_REVOLUTION_WAR_NAME:0 "$ORDER$$FIRST$东归革命战争"
 po_jxp_b_liberate_overseas:0 "解放海外诸邦"
 po_jxp_b_liberate_overseas_desc:0 "迫使日本放弃新大陆与太平洋殖民统治，严格筛选的殖民属国各自独立；胜利者不统治日本，也不取得本土核心。"
 po_jxp_b_old_world_member:0 "接纳旧大陆成员国"
 po_jxp_b_old_world_member_desc:0 "日本成为胜利国家的高度自治成员。游戏中使用高自由倾向的附庸关系表现共同外交与海防，日本保留本土土地、文化和政府。"
 po_jxp_b_two_ocean_federation:0 "成立两洋联邦"
 po_jxp_b_two_ocean_federation_desc:0 "胜利国家改组为两洋联邦，日本作为高自治旧大陆成员加入。不会免费获得日本省份或核心；联邦承受长期治理、海军维护和跨洋议事成本。"
 po_jxp_b_eastward_capital:0 "迁都东归"
 po_jxp_b_eastward_capital_desc:0 "仅割让京都作为殖民统治集团的新首都，日本其余国土仍独立。海外地区保留原有领土与自治，国家承受二十年合法性危机。"

 jxp_transpacific_state.1.t:0 "解放海外而不统治日本"
 jxp_transpacific_state.1.d:0 "舰队带回的不是日本王冠，而是承认书。海外诸邦获得自由，日本保留本土政府；胜利者以拒绝换一位宗主的方式结束战争。"
 jxp_transpacific_state.1.a:0 "让太平洋诸国自行决定彼此关系。"
 jxp_transpacific_state.2.t:0 "旧大陆成员国"
 jxp_transpacific_state.2.d:0 "日本接受共同外交与海防，却保留本土政治。它在游戏中仍是高自由倾向成员，必须靠持续协商而非一次胜利维系。"
 jxp_transpacific_state.2.a:0 "成员关系必须容纳真实自治。"
 jxp_transpacific_state.3.t:0 "两个海岸，一部联邦"
 jxp_transpacific_state.3.d:0 "海外议席与旧大陆代表签署联邦约章。新国家没有获得免费的日本核心：日本仍作为自治成员，舰队预算、关税、文化席位和首都之争将定期回到议席。"
 jxp_transpacific_state.3.a:0 "联邦从承担分歧开始。"
 jxp_transpacific_state.4.t:0 "殖民革命者迁都京都"
 jxp_transpacific_state.4.d:0 "殖民统治集团接管京都，却没有吞并日本其余国土。海外居民担忧自己再次被本土支配，日本旧家也拒绝把远航胜利等同于合法统治。"
 jxp_transpacific_state.4.a:0 "一座首都不能自动解决两片社会。"
 jxp_transpacific_state.10.t:0 "两洋联邦的三年预算"
 jxp_transpacific_state.10.d:0 "旧大陆成员要求道路、军备和灾后重建，海外诸州要求舰队、港税与移民经费。议席可以偏向一岸，也可以用更高财政成本维持折中；没有一个选项能免费消除太平洋距离。"
 jxp_transpacific_state.10.a:0 "本期优先旧大陆成员。"
 jxp_transpacific_state.10.b:0 "本期优先海外诸州。"
 jxp_transpacific_state.10.c:0 "追加预算，维持两岸折中。"

 jxp_b_two_ocean_federation_reform:0 "两洋联邦约章"
 jxp_b_two_ocean_federation_reform_desc:0 "旧大陆与海外诸州共享外交和海防，却分别保留土地、文化与地方政治。联邦以代表制连接两岸，并以较低治理容量换取跨洋国家的存续。"
 jxp_b_98_old_world_member_autonomy:0 "旧大陆自治成员"
 jxp_b_98_old_world_member_autonomy_desc:0 "日本保留本土政府与社会秩序，只把共同外交和海防交给跨洋胜利者；高自由倾向要求持续协商。"
 jxp_b_98_two_ocean_federal_burdens:0 "两洋联邦负担"
 jxp_b_98_two_ocean_federal_burdens_desc:0 "跨洋通讯、双重预算、舰队维护和代表席位使这个国家远比单一大陆国家昂贵。"
 jxp_b_98_eastward_legitimacy_crisis:0 "东归合法性危机"
 jxp_b_98_eastward_legitimacy_crisis_desc:0 "海外革命者在京都建立首都，却同时面对日本旧家与海外自治派的质疑。"
 jxp_b_98_old_world_appropriation:0 "旧大陆优先预算"
 jxp_b_98_old_world_appropriation_desc:0 "资金和兵员优先流向日本成员，海外关税负担因此加重。"
 jxp_b_98_overseas_appropriation:0 "海外优先预算"
 jxp_b_98_overseas_appropriation_desc:0 "舰队与海外港务获得资金，旧大陆成员对联邦的疑虑上升。"
 jxp_b_98_federal_compromise:0 "两岸折中预算"
 jxp_b_98_federal_compromise_desc:0 "高额共同拨款换取暂时妥协，财政不会因此轻松。"
 jxp_iface_b_tpf_needs_mission_refresh:0 "两洋联邦任务待刷新"
 jxp_iface_b_tpf_needs_idea_refresh:0 "两洋联邦理念待同步"
 jxp_iface_b_tpf_needs_government_registry:0 "两洋联邦政体待登记"
 TPF:0 "两洋联邦"
 TPF_ADJ:0 "两洋联邦"
 TPF_ideas:0 "两洋联邦理念"
 TPF_ideas_desc:0 "两洋联邦既不是海外诸州重新臣服于日本，也不是旧大陆被殖民胜利者吞并。它以平等成员、共同海防和反复协商维持两岸联合，并长期承担跨洋通讯与双重财政的代价。"
 TPF_ideas_start:0 "两洋联邦传统"
 TPF_ideas_bonus:0 "两洋联邦雄心"
 tpf_two_shores_compact:0 "两岸盟约"
 tpf_two_shores_compact_desc:0 "旧大陆与海外诸州各自保留地方制度，再把共同外交、海防与跨洋商法写入同一盟约。"
 tpf_dual_ocean_budget:0 "双洋预算"
 tpf_dual_ocean_budget_desc:0 "分别核算两岸税入与舰队开支，使联邦不必靠掏空一方来维持另一方。"
 tpf_equal_membership:0 "平等成员之约"
 tpf_equal_membership_desc:0 "联邦承认成员不是战利品；异议须由代表、请愿与地方自治化解，而非一纸征服令。"
 tpf_transpacific_relays:0 "跨洋驿港"
 tpf_transpacific_relays_desc:0 "从日本列岛到中继岛屿再到美洲西岸，驿港按季风和洋流共同维护航路。"
 tpf_federal_admiralty:0 "联邦海军奉行"
 tpf_federal_admiralty_desc:0 "各成员分摊水手、船材和军港，舰队则承担守护整条跨洋通讯线的责任。"
 tpf_bilingual_chanceries:0 "两岸通事院"
 tpf_bilingual_chanceries_desc:0 "通事与书吏在多种语言、习惯法和外交礼仪之间建立可供双方信赖的公文体系。"
 tpf_perpetual_federal_council:0 "常设联邦评议"
 tpf_perpetual_federal_council_desc:0 "跨洋国家没有一次制宪便可永逸的安定；预算、首都和代表权必须在常设评议中反复谈判。"
