l_english:
 jxp_a_105_progress_market_0_tt:0 "当前尚未形成正式市场阶段；本任务只建立下一阶段所需机构。"
 jxp_a_105_progress_market_1_tt:0 "当前为第一市场阶段：城町与关津已开始联网。"
 jxp_a_105_progress_market_2_tt:0 "当前至少为第二市场阶段：米市、票据与公共信用已经接线。"
 jxp_a_105_progress_market_3_tt:0 "当前至少为第三市场阶段：工场网络与公司核心已经建立。"
 jxp_a_105_progress_market_4_tt:0 "当前为第四市场阶段：公司国家资格已经开放。"
 jxp_a_105_progress_companies_0_tt:0 "当前没有活跃会社。"
 jxp_a_105_progress_companies_1_tt:0 "当前至少有一家活跃会社。"
 jxp_a_105_progress_companies_2_tt:0 "当前至少有两家活跃会社。"
 jxp_a_105_progress_companies_3_tt:0 "当前至少有三家活跃会社。"
 jxp_a_105_progress_companies_4_tt:0 "当前至少有四家活跃会社；这是会社国家才能稳定承受的规模。"
 jxp_a_105_progress_companies_5_tt:0 "当前五类国内会社均已进入国家账册。"
 jxp_mission_iwami_silver_title:0 "山金与海银"
 jxp_mission_iwami_silver_desc:0 "山中金银、海滨砂铁与诸国矿利，若仍听豪族私分，便不能成为天下之财。先清丈矿口、冶所与运路，再议官营、承包或地方经营。"
 jxp_mission_iwami_silver_reward_tt:0 "实际解锁：登记矿口、冶所与运路，并开放矿山奉行的治理议案；矿利不再只是无主收入。支持阶层：町众；反对或承担代价者：武家。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_mountain_sea_bullion_unlocked:0 "业务成例：山金与海银"
 jxp_mission_secure_home_domain_title:0 "矿山奉行"
 jxp_mission_secure_home_domain_desc:0 "矿山奉行须在直辖、豪商承包与地方经营之间立下成法；每一路都带来税入，也都要承担腐败、自治或町众势力增长的代价。"
 jxp_mission_secure_home_domain_reward_tt:0 "实际解锁：在国家直辖、豪商承包与地方经营之间择一，选择会留下可迁移的矿政成例。支持阶层：町众；反对或承担代价者：武家。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_mine_magistrates_unlocked:0 "业务成例：矿山奉行"
 jxp_mission_capital_cities_title:0 "金座与银座"
 jxp_mission_capital_cities_desc:0 "城下货币若无统一铸所，诸州成色便各自为政。设金座、银座与验极所，使改铸不再只是临时敛财。"
 jxp_mission_capital_cities_reward_tt:0 "实际解锁：建立金座、银座与验极所，并立即召开金银成色之议。支持阶层：町众；反对或承担代价者：武家。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_gold_silver_mints_unlocked:0 "业务成例：金座与银座"
 jxp_a_105_cap_coin_assay_title:0 "撰钱与成色"
 jxp_a_105_cap_coin_assay_desc:0 "严禁恶钱可稳信用，却会骤减流通；增铸可救市，却会推高物价。朝廷、武家与町众必须共同承认一套成色。"
 jxp_a_105_cap_coin_assay_reward_tt:0 "实际解锁：在严统一、增发与容忍地方货币之间择一；通胀、流动性与地方忠诚各有代价。支持阶层：町众；反对或承担代价者：武家。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_coin_assay_unlocked:0 "业务成例：撰钱与成色"
 jxp_a_105_cap_exchange_houses_title:0 "兑换会所"
 jxp_a_105_cap_exchange_houses_desc:0 "令兑换商以公定账簿往来诸城，把异地钱币、汇票与欠账纳入可追索的结算秩序。"
 jxp_a_105_cap_exchange_houses_reward_tt:0 "实际解锁：开放兑换会所与跨城结算，并触发兑换商罢市的首次压力测试。支持阶层：町众；反对或承担代价者：武家。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_exchange_houses_unlocked:0 "业务成例：兑换会所"
 jxp_a_105_cap_domain_notes_title:0 "私札与藩札"
 jxp_a_105_cap_domain_notes_desc:0 "地方票札可以纾解钱荒，也可能把一国信用变成一纸空言。国家须决定禁止、许可或广泛发行，并预备违约处置。"
 jxp_a_105_cap_domain_notes_reward_tt:0 "实际解锁：决定禁止、许可或广泛发行藩札；所选信用制度会在后续债务节点保留。支持阶层：町众；反对或承担代价者：武家。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_domain_notes_unlocked:0 "业务成例：私札与藩札"
 jxp_mission_settle_the_realm_title:0 "全国信用公仪"
 jxp_mission_settle_the_realm_desc:0 "以公开账目、共同担保和定期偿付建立天下信用。公债不再是战时强借，而成为受审计的国家契约。"
 jxp_mission_settle_the_realm_reward_tt:0 "实际解锁：发布公共信用接口、复核市场阶段，并以国家担保危机检验偿付能力。支持阶层：町众；反对或承担代价者：武家。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_public_credit_unlocked:0 "业务成例：全国信用公仪"
 jxp_mission_kyoto_and_edo_title:0 "城下町人口"
 jxp_mission_kyoto_and_edo_desc:0 "把分散的工匠、商人和奉公人安置于城下，须同时修水路、街町与防火制度，不能只以数字衡量繁荣。"
 jxp_mission_kyoto_and_edo_reward_tt:0 "实际解锁：拨款整顿城下水路、防火与人口账，形成城下町建设成例。支持阶层：町众；反对或承担代价者：地方诸侯。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_castle_town_population_unlocked:0 "业务成例：城下町人口"
 jxp_mission_road_to_kyoto_title:0 "关津整理"
 jxp_mission_road_to_kyoto_desc:0 "关所与津料既养地方，也割裂市场。废除、统一或保留地方关税，都应写入全国可执行的通行法。"
 jxp_mission_road_to_kyoto_reward_tt:0 "实际解锁：在废除关津、中央统一或保留地方津料之间择一，重写全国通行规则。支持阶层：町众；反对或承担代价者：地方诸侯。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_barrier_reform_unlocked:0 "业务成例：关津整理"
 jxp_a_105_cap_town_councils_title:0 "会合众与町奉行"
 jxp_a_105_cap_town_councils_desc:0 "会合众熟悉市中生计，町奉行代表国家裁判。二者若能分权而相互稽核，自治便不等于放任。"
 jxp_a_105_cap_town_councils_reward_tt:0 "实际解锁：让会合众与町奉行共同承担账目，并触发豪商要求入国议的政治代价。支持阶层：町众；反对或承担代价者：地方诸侯。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_town_councils_unlocked:0 "业务成例：会合众与町奉行"
 jxp_a_105_cap_couriers_prices_title:0 "飞脚与价格通信"
 jxp_a_105_cap_couriers_prices_desc:0 "驿传飞脚应按期传递米价、汇率与灾情，让远方价格不再只由囤积者和谣言支配。"
 jxp_a_105_cap_couriers_prices_reward_tt:0 "实际解锁：把飞脚米价与灾情通信纳入公仪，开放价格传播事件。支持阶层：町众；反对或承担代价者：地方诸侯。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_couriers_prices_unlocked:0 "业务成例：飞脚与价格通信"
 jxp_mission_osaka_granary_title:0 "藏屋敷网络"
 jxp_mission_osaka_granary_desc:0 "连接大坂、江户与替代商业中心的藏屋敷，使税米、票据和诸藩债务进入同一账网。"
 jxp_mission_osaka_granary_reward_tt:0 "实际解锁：把大坂、江户及替代商业中心纳入藏屋敷账网，并承受火灾与藩债风险。支持阶层：町众；反对或承担代价者：地方诸侯。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_warehouse_network_unlocked:0 "业务成例：藏屋敷网络"
 jxp_a_105_cap_coastal_inland_shipping_title:0 "海陆廻船"
 jxp_a_105_cap_coastal_inland_shipping_desc:0 "北海、濑户内、太平洋沿岸与内陆驿传各有季候和风险。国家最多主修两路，并为其护航、仓储和救难。"
 jxp_a_105_cap_coastal_inland_shipping_reward_tt:0 "实际解锁：从北海、濑户内、太平洋与内陆驿传中主修一线、可再辅修一线，绝不超过两线。支持阶层：町众；反对或承担代价者：地方诸侯。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_coastal_inland_shipping_unlocked:0 "业务成例：海陆廻船"
 jxp_mission_unite_the_isles_title:0 "天下商品市场"
 jxp_mission_unite_the_isles_desc:0 "当城下、关津、飞脚与廻船成网，天下才有共同商品市场；豪商也将因此要求更大的政治发言权。"
 jxp_mission_unite_the_isles_reward_tt:0 "实际解锁：确认第一市场阶段并让豪商正式要求预算发言权。支持阶层：町众；反对或承担代价者：地方诸侯。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_realm_goods_market_unlocked:0 "业务成例：天下商品市场"
 jxp_mission_land_survey_state_title:0 "年贡米拍卖"
 jxp_mission_land_survey_state_desc:0 "将税米公开拍卖，既能让国家预知岁入，也会把百姓收成暴露于价格波动。必须留下赈济和最低收购之法。"
 jxp_mission_land_survey_state_reward_tt:0 "实际解锁：开放年贡米拍卖及米价暴涨事件，国家必须同时承担赈济责任。支持阶层：町众与百姓；反对或承担代价者：武家债权人。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_tribute_rice_auction_unlocked:0 "业务成例：年贡米拍卖"
 jxp_a_105_cap_rice_notes_title:0 "米切手"
 jxp_a_105_cap_rice_notes_desc:0 "藏屋敷凭米开具切手，使未到之米也能融资。票据的发行、兑付和伪造须由公仪裁判。"
 jxp_a_105_cap_rice_notes_reward_tt:0 "实际解锁：建立米切手融资，并以未到米风险检验仓单兑付。支持阶层：町众与百姓；反对或承担代价者：武家债权人。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_rice_notes_unlocked:0 "业务成例：米切手"
 jxp_a_105_cap_osaka_rice_market_title:0 "大坂米市"
 jxp_a_105_cap_osaka_rice_market_desc:0 "统一后的大坂应成为全国米价的公开场所，而非少数御用商人的私议。藩债、俸禄与仓储由此相连。"
 jxp_a_105_cap_osaka_rice_market_reward_tt:0 "实际解锁：把统一后的米价公开化，同时面对囤积与百姓议价。支持阶层：町众与百姓；反对或承担代价者：武家债权人。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_osaka_rice_market_unlocked:0 "业务成例：大坂米市"
 jxp_a_105_cap_dojima_clearing_title:0 "堂岛帐合"
 jxp_a_105_cap_dojima_clearing_desc:0 "堂岛在十八世纪方获正式公认。待一七三〇年后，以帐合清算和远期约束投机，让后期金融不越时代而生。"
 jxp_a_105_cap_dojima_clearing_reward_tt:0 "实际解锁：开放一七三〇年后的堂岛帐合与清算危机，不提前赠送现代金融收益。支持阶层：町众与百姓；反对或承担代价者：武家债权人。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_dojima_clearing_unlocked:0 "业务成例：堂岛帐合"
 jxp_a_105_cap_marine_insurance_title:0 "海运保险"
 jxp_a_105_cap_marine_insurance_desc:0 "廻船、港浦与海外商馆需要共同分担风灾、海盗和失火风险；保险不得成为无本套利。"
 jxp_a_105_cap_marine_insurance_reward_tt:0 "实际解锁：建立海运保险争议程序，拒赔与救助成本由船主、商人和国家重新分担。支持阶层：町众与百姓；反对或承担代价者：武家债权人。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_marine_insurance_unlocked:0 "业务成例：海运保险"
 jxp_a_105_cap_national_bonds_title:0 "全国公债"
 jxp_a_105_cap_national_bonds_desc:0 "武家、豪商、寺社与地方藩国都可认购公债，却也会据此要求预算发言权。选择认购主体，就是选择国家的债权人。"
 jxp_a_105_cap_national_bonds_reward_tt:0 "实际解锁：在武家、豪商、寺社或地方藩国认购者中择一，决定全国公债的政治债权人。支持阶层：町众与百姓；反对或承担代价者：武家债权人。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_national_bonds_unlocked:0 "业务成例：全国公债"
 jxp_a_105_cap_clearing_house_title:0 "清算会所"
 jxp_a_105_cap_clearing_house_desc:0 "以全国清算会所隔离公司破产、重组国债并核销相互欠账，使一处违约不致拖倒天下市场。"
 jxp_a_105_cap_clearing_house_reward_tt:0 "实际解锁：确认第二市场阶段，开放德政、救市与破产隔离的清算规则。支持阶层：町众与百姓；反对或承担代价者：武家债权人。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_clearing_house_unlocked:0 "业务成例：清算会所"
 jxp_a_105_cap_artisan_guilds_title:0 "工匠诸座"
 jxp_a_105_cap_artisan_guilds_desc:0 "旧座、乐座与国家工场各有技艺和弊病。改革应保护工匠传承，同时打破妨碍生产的世袭垄断。"
 jxp_a_105_cap_artisan_guilds_reward_tt:0 "实际解锁：在旧座、乐座和国家工场之间择一，技艺保护与垄断成本同时生效。支持阶层：工匠与乡社；反对或承担代价者：垄断商人与军需奉行。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_artisan_guilds_unlocked:0 "业务成例：工匠诸座"
 jxp_a_105_cap_textiles_cotton_title:0 "织物与棉业"
 jxp_a_105_cap_textiles_cotton_desc:0 "西阵、丹后、关东、九州与农村外包各有原料和工法。国家应让地方变体竞争，而非强令一式。"
 jxp_a_105_cap_textiles_cotton_reward_tt:0 "实际解锁：择定西阵丹后、关东、九州、农村外包或多地竞作的织物主轴。支持阶层：工匠与乡社；反对或承担代价者：垄断商人与军需奉行。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_textiles_cotton_unlocked:0 "业务成例：织物与棉业"
 jxp_a_105_cap_ceramic_kilns_title:0 "陶瓷窑场"
 jxp_a_105_cap_ceramic_kilns_desc:0 "九州、备前与美浓的窑场须靠燃料、土脉和工匠维系；迁入技术者必须获得俸给与安置，而非化作无代价奖励。"
 jxp_a_105_cap_ceramic_kilns_reward_tt:0 "实际解锁：择定九州、备前或美浓窑场，安置工匠并支付燃料与迁居成本。支持阶层：工匠与乡社；反对或承担代价者：垄断商人与军需奉行。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_ceramic_kilns_unlocked:0 "业务成例：陶瓷窑场"
 jxp_mission_tanegashima_firearms_title:0 "炮铸与军需"
 jxp_mission_tanegashima_firearms_desc:0 "火器、炮铸和军需工场能支撑统一，也会挤压民业。织田、丰臣与九州诸家之经验须转为有预算的制度。"
 jxp_mission_tanegashima_firearms_reward_tt:0 "实际解锁：在近畿奉行、九州渡来技术或地方铁炮众之间配置军需预算。支持阶层：工匠与乡社；反对或承担代价者：垄断商人与军需奉行。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_guns_supply_unlocked:0 "业务成例：炮铸与军需"
 jxp_a_105_cap_shipyards_title:0 "造船工场"
 jxp_a_105_cap_shipyards_desc:0 "濑户内、九州与江户湾的船匠应按商船、军船和远洋船分工，并与港务、木料和水手训练相连。"
 jxp_a_105_cap_shipyards_reward_tt:0 "实际解锁：在濑户内、九州、江户湾或地方港浦择定造船主轴，并支付船材与船匠费用。支持阶层：工匠与乡社；反对或承担代价者：垄断商人与军需奉行。当前市场阶段与活跃会社数量会在本条下方动态列出。"
 jxp_a_105_business_shipyards_unlocked:0 "业务成例：造船工场"
 jxp_a_105_cap_rural_putting_out_title:0 "农村外包生产"
 jxp_a_105_cap_rural_putting_out_desc:0 "商人包买、惣村合作与国家工场会把不同风险压到乡里。订立工资、原料和赈济规则，方能避免逐利毁农。"
