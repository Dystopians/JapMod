 jxp_a_105_model_commercial_council_desc:0 "武家、町众、宗门与乡社共同审议市场和公司；顾问与贸易更有效率，但所有重大章程都须接受公议。"
 jxp_a_105_unification_blade_desc:0 "以军锋统一者迅速重整财产和税源，收入上升，却留下更高的地方不安。"
 jxp_a_105_unification_edict_desc:0 "奉朝廷名分完成统一者更易维持信用与顾问体系，但改革须尊重既有安堵。"
 jxp_a_105_unification_league_desc:0 "会盟统一保留地方市场和藩札，贸易活跃，却压缩中央可直接支配的行政容量。"
 jxp_a_105_estate_merchant_compact_desc:0 "町众承担更多账目并取得有限议席；贸易得益，而国家直接税收须向商议让步。"
 jxp_a_105_estate_warrior_compact_desc:0 "武家奉行强化监督和行政容量；贸易自主性因审计与许可受到限制。"
 jxp_a_105_route_local_investment_desc:0 "地方自行筹措章程资金，建设成本下降，但全国维持费用因制度差异而增加。"
 jxp_a_105_route_state_investment_desc:0 "国家直接拨款统一机构，税收与维持费用改善，却消耗中央财力。"
 jxp_a_105_crisis_concession_desc:0 "国家以救济和让步重开谈判，安定民心，却暂时牺牲税收。"
 jxp_a_105_crisis_coercion_desc:0 "国家以强制审计维持国令，短期税收增加，却加剧地方不安。"
 jxp_a_105_crisis_warrior_restoration_desc:0 "危机以恢复武家主导告终；行政容量上升，商业效率受到压制。"
 jxp_a_105_crisis_merchant_franchise_desc:0 "危机以承认商人议政权告终；贸易增长，非商人阶层的不满也随之上升。"
 jxp_a_105_crisis_nationalisation_desc:0 "主要公司被国家接管；生产秩序得到维持，官营成本随之增加。"
 jxp_a_105_crisis_four_estates_desc:0 "武家、宗门、町众与乡社达成妥协；社会安定，但审议程序更为昂贵。"
 jxp_a_105_crisis_company_oligarchy_desc:0 "公司寡头赢得危机，全球贸易力量增强，国家正统性持续受损。"
 jxp_a_105_crisis_civil_conflict_desc:0 "拒绝妥协引发长期余波；税基受损，国内不安显著增加。"
