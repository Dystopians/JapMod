 jxp_commercial_council.1.t:0 "商议日本立国宣言"
 jxp_commercial_council.1.d:0 "武家已经统一列岛，然而市场、信用和会社也已成为国家柱石。新政权必须公开承认这种共同治理。"
 jxp_commercial_council.1.a:0 "以“商议日本”昭告天下"
 jxp_commercial_council.1.b:0 "以“日本商议联邦”示诸州共治"
 jxp_commercial_council.2.t:0 "谁来监督会社"
 jxp_commercial_council.2.d:0 "幕府奉行、城市议席或海外董事会，三者只能有一个成为一级政体的主轴。"
 jxp_commercial_council.2.a:0 "幕府监督会社国"
 jxp_commercial_council.2.b:0 "町众商议共和国"
 jxp_commercial_council.2.c:0 "海外会社帝国"
 jxp_commercial_council.3.t:0 "四阶层公议"
 jxp_commercial_council.3.d:0 "武家、宗门、町众与乡社都要求以承担义务换取预算席位。"
 jxp_commercial_council.3.a:0 "先调和武家与町众"
 jxp_commercial_council.3.b:0 "先安顿宗门与乡社"
 jxp_commercial_council.4.t:0 "国家与会社的股权"
 jxp_commercial_council.4.d:0 "国家持股能约束公司，也可能让亏损变成全民债务。"
 jxp_commercial_council.4.a:0 "保留国家股份与审计席"
 jxp_commercial_council.4.b:0 "让公司自负盈亏"
 jxp_commercial_council.5.t:0 "商本与武家俸禄危机"
 jxp_commercial_council.5.d:0 "旧武家、公司奉行、町众股东、百姓惣村与调停者都拒绝独自承担债务。国家宪制将在此定型。"
 jxp_commercial_council.5.a:0 "恢复武家主导"
 jxp_commercial_council.5.b:0 "给予商人议政权"
 jxp_commercial_council.5.c:0 "国有化主要公司"
 jxp_commercial_council.5.d:0 "达成四阶层妥协"
 jxp_commercial_council.5.e:0 "让公司寡头掌权"
 jxp_commercial_council.5.f:0 "拒绝妥协，冒内战之险"
 jxp_commercial_council.6.t:0 "天下公司国家"
 jxp_commercial_council.6.d:0 "危机既定，商议国家必须选择最后的公共名号，并向海外模块公布国内治理准备度。"
 jxp_commercial_council.6.a:0 "称天下会社国"
 jxp_commercial_council.6.b:0 "称诸市公议国"
 jxp_commercial_council.6.c:0 "称日本商议联邦"
 jxp_commercial_council.8.t:0 "商本与俸禄的裂痕"
 jxp_commercial_council.8.d:0 "公司债、武家俸禄、町众股权与百姓田契同时告急。各方尚未决裂，却已拒绝让任何一方独断账目；国家必须先承认危机，再用至少一年重订契约。"
 jxp_commercial_council.8.a:0 "先由奉行冻结争议账目"
 jxp_commercial_council.8.b:0 "先由公议会接纳各方陈情"
 jxp_a_105_commercial_council_state_reform:0 "商议国家暂行章程"
 jxp_a_105_commercial_council_state_reform_desc:0 "在武家完成统一后，以奉行、豪商、宗门与乡社共同审议公司和公债；待全国公议择定后，再转入三种正式国体之一。"
 jxp_a_105_commercial_shogunate_reform:0 "幕府监督会社国"
 jxp_a_105_commercial_shogunate_reform_desc:0 "幕府任命主要董事并稳定收益，以较低自治和较慢创新换取国家审计。"
 jxp_a_105_commercial_merchant_council_reform:0 "町众商议共和国"
 jxp_a_105_commercial_merchant_council_reform_desc:0 "港市和公司获得正式议席，贸易活跃，却必须承受武家不满与寡头风险。"
 jxp_a_105_commercial_company_empire_reform:0 "海外会社帝国"
 jxp_a_105_commercial_company_empire_reform_desc:0 "会社承担海外行政与护航，扩张迅速，也会显著放大公司寡头和殖民独立压力。"
 jxp_a_105_form_commercial_council_title:0 "成立商议日本"
 jxp_a_105_form_commercial_council_desc:0 "在统一日本、全国市场、公共信用、工场网络和至少两家公司之上，以武家、町众、宗门与乡社共同治理国家。这是极难出现的架空终局。"
 jxp_a_105_can_enter_commercial_council_tt:0 "已统一日本；处于未定或开国路线；一六〇〇年后接受全球贸易；达到第三市场阶段；具有公共信用、公司核心、至少两家活跃公司、三个贸易中心、高收入、高町众忠诚与影响，且武家影响未压倒全国公议。"
 jxp_a_105_form_commercial_council_effect_tt:0 "旧路线将被事务式清理，商议日本三章会立即刷新并在次日复核；既有神社与海域篇章仍作为统一后的历史承接。"
