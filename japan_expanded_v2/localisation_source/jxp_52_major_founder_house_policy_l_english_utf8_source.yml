l_english:
 jxp_major_founder_house_policy.1.t:0 "安土旧令的归处"
 jxp_major_founder_house_policy.1.d:0 "安土城下仍流传着布武时节的旧令。诸奉行请求将那些关于街衢、座役、市税与武家役法的法度重抄成册，使新朝的法度不只承袭胜者的威名，也能约束胜者的家臣。"
 jxp_major_founder_house_policy.1.a:0 "以安土奉行所统摄诸令"
 jxp_major_founder_house_policy.1.b:0 "让乐市之法流入诸港"
 jxp_major_founder_house_policy.2.t:0 "三河谱代的座次"
 jxp_major_founder_house_policy.2.d:0 "三河以来的譜代家臣自称为国家骨肉。他们熟知战阵，也熟知诉讼、仓廪与道路。若让其列席中枢，则天下的静谧将以古老奉公之名重新排定座次。"
 jxp_major_founder_house_policy.2.a:0 "设谱代老中以镇诸司"
 jxp_major_founder_house_policy.2.b:0 "重修海道关所与宿驿"
 jxp_major_founder_house_policy.3.t:0 "甲州法度之影"
 jxp_major_founder_house_policy.3.d:0 "甲斐山国的法度曾将骑马武者、矿山收入与国人众一并纳入军役。旧臣请愿说，山川险阻虽已归于一统，甲州之法仍可成为武家国家的筋骨。"
 jxp_major_founder_house_policy.3.a:0 "重编甲州旗本与骑马役"
 jxp_major_founder_house_policy.3.b:0 "以山国法度守关隘"
 jxp_major_founder_house_policy.4.t:0 "关东管领的义名"
 jxp_major_founder_house_policy.4.d:0 "越后旧臣仍以关东义名自持，称政道若无名分，兵锋也会失其所向。朝廷、寺社与地方领主都在观望：新政权究竟要以强力，还是以义理来说明其统治？"
 jxp_major_founder_house_policy.4.a:0 "以关东裁断昭示公义"
 jxp_major_founder_house_policy.4.b:0 "让越后军役重入国制"
 jxp_major_founder_house_policy.5.t:0 "小田原帐簿与总构"
 jxp_major_founder_house_policy.5.d:0 "后北条的检地帐、贯高制与小田原总构仍被地方官奉为范本。城郭、田畴与町屋相互支撑，仿佛一座大城伸展为一国的形体。"
 jxp_major_founder_house_policy.5.a:0 "复核小田原检地帐"
 jxp_major_founder_house_policy.5.b:0 "以总构之法整备城下"
 jxp_major_founder_house_policy.6.t:0 "濑户内军船的名簿"
 jxp_major_founder_house_policy.6.d:0 "毛利家旧有海贼众、水军衆与国人盟约错综相连。濑户内的潮汐不容空言，若要守住天下的西门，必须决定海上名簿究竟服务商道，还是服务国制。"
 jxp_major_founder_house_policy.6.a:0 "立濑户内海军奉行"
 jxp_major_founder_house_policy.6.b:0 "承认国人盟约的旧分"
 jxp_major_founder_house_policy.7.t:0 "萨南铁炮与外学"
 jxp_major_founder_house_policy.7.d:0 "萨摩旧地既有铁炮匠，也有通晓琉球、明国与南蛮风闻之人。岛津旧臣争论不休：应将海门外学铸成枪炮，还是把远方书籍与贸易话语纳入国策？"
 jxp_major_founder_house_policy.7.a:0 "聚铁炮匠于藩炉"
 jxp_major_founder_house_policy.7.b:0 "开萨南译学与渡海馆"
 jxp_major_founder_house_policy.8.t:0 "府内火器与异国街"
 jxp_major_founder_house_policy.8.d:0 "丰后府内曾有教士、商人、炮匠与远航水手往来。大友旧臣请将这段记忆写成制度：一面可开外商街市，一面可把国崩大筒纳入军府。"
 jxp_major_founder_house_policy.8.a:0 "给府内外商街以官符"
 jxp_major_founder_house_policy.8.b:0 "设国崩炮局"
 jxp_major_founder_house_policy.9.t:0 "奥州骑马与庆长遣使"
 jxp_major_founder_house_policy.9.d:0 "伊达旧臣谈起奥州马场，也谈起渡海遣使的故事。北国的豪勇与远方的书信似乎并不矛盾，只要国家愿意将边地的气魄纳入中枢。"
 jxp_major_founder_house_policy.9.a:0 "重整奥州骑马衆"
 jxp_major_founder_house_policy.9.b:0 "续修庆长遣使之录"
 jxp_major_founder_house_policy.10.t:0 "室町故府的余响"
 jxp_major_founder_house_policy.10.d:0 "足利旧府虽已成旧事，奉公众、奉行人、连歌师与寺社门迹仍记得室町的语言。新政权若能驯服这些余响，便可把衰世的旧仪化为太平的文书。"
 jxp_major_founder_house_policy.10.a:0 "复置奉公众的役次"
 jxp_major_founder_house_policy.10.b:0 "以东山文雅润饰新朝"
 jxp_major_founder_house_policy.11.t:0 "土佐一领具足"
 jxp_major_founder_house_policy.11.d:0 "长宗我部旧制将乡士、足轻与农兵结入一领具足。土佐山海之间，耕作与军役本就相邻。国家必须决定这种旧制是成为军籍，还是成为海岸与郡村的自治法。"
 jxp_major_founder_house_policy.11.a:0 "编土佐一领具足为军籍"
 jxp_major_founder_house_policy.11.b:0 "让浦方与乡士共守海岸"
 jxp_major_founder_house_policy.12.t:0 "山口公界与朝鲜通信"
 jxp_major_founder_house_policy.12.d:0 "大内旧都山口曾仿京都风雅，又以博多、对马与朝鲜通信维系海上秩序。旧臣认为，若能重建这种公界之礼，西国贸易与外交都将有其名分。"
 jxp_major_founder_house_policy.12.a:0 "重开山口商庭"
 jxp_major_founder_house_policy.12.b:0 "续修朝鲜通信之仪"
 jxp_major_founder_house_policy.13.t:0 "东海道法书"
 jxp_major_founder_house_policy.13.d:0 "今川家的东海道法书曾试图在战国道路上安放秩序。旧臣把泛黄卷轴呈上殿中，称其不只适合骏远三，也足以教导新朝如何约束豪族、同盟与街道。"
 jxp_major_founder_house_policy.13.a:0 "以东海道法书为裁判范本"
 jxp_major_founder_house_policy.13.b:0 "采三国同盟之术"
 jxp_major_founder_house_policy.14.t:0 "对马倭馆的潮声"
 jxp_major_founder_house_policy.14.d:0 "宗氏旧臣说，对马不是边缘，而是潮路的门钥。倭馆、译官、船改与海防本是一体；若国家要面向半岛与大海，便不能忘记海峡之国的旧知。"
 jxp_major_founder_house_policy.14.a:0 "立倭馆通事所"
 jxp_major_founder_house_policy.14.b:0 "任海峡守护衆巡诸浦"

 jxp_52_oda_azuchi_bureau:0 "安土奉行所"
 jxp_52_oda_azuchi_bureau_desc:0 "安土旧令被整理为可复制的行政成法，城下、街道、座役与武家役法皆有章可循。"
 jxp_52_oda_rakuichi_markets:0 "乐市乐座诸港"
 jxp_52_oda_rakuichi_markets_desc:0 "乐市乐座的记忆被移入港町，旧日城下的开放市声越过海湾与关津。"
 jxp_52_tkg_fudai_roju:0 "三河谱代老中"
 jxp_52_tkg_fudai_roju_desc:0 "谱代家臣以世代奉公为凭，承担殿中议政与地方监察的枢纽职责。"
 jxp_52_tkg_road_barriers:0 "海道关所与宿驿"
 jxp_52_tkg_road_barriers_desc:0 "关所、宿驿与道路文书被统一校核，使旅行、检断与军需皆有凭籍。"
 jxp_52_tkd_koshu_banners:0 "甲州旗本"
 jxp_52_tkd_koshu_banners_desc:0 "甲州骑马与旗本军役被重新编列，山国旧法成为武家国家的劲弦。"
 jxp_52_tkd_mountain_codes:0 "山国法度"
 jxp_52_tkd_mountain_codes_desc:0 "矿山、关隘与山地郡村纳入同一套法度，险阻之地不再只是边缘。"
 jxp_52_ues_kanto_justice:0 "关东裁断"
 jxp_52_ues_kanto_justice_desc:0 "关东义名与裁判权被重新阐释，使武威披上公义之衣。"
 jxp_52_ues_echigo_muster:0 "越后军役帐"
 jxp_52_ues_echigo_muster_desc:0 "越后的国人、旗本与乡兵被编入军役帐，雪国的坚忍成为国家的储力。"
 jxp_52_hjo_odawara_cadaster_review:0 "小田原检地帐"
 jxp_52_hjo_odawara_cadaster_review_desc:0 "贯高、田畴与村役被重新核验，旧日关东的账簿成为新政的尺规。"
 jxp_52_hjo_sogamae_watch:0 "总构守备"
 jxp_52_hjo_sogamae_watch_desc:0 "小田原总构的思想被用于诸城下，城郭、町屋与水路合为一体。"
 jxp_52_mri_setouchi_admiralty:0 "濑户内海军奉行"
 jxp_52_mri_setouchi_admiralty_desc:0 "海军奉行统辖水夫、船手与商路，濑户内诸潮被写进国家名簿。"
 jxp_52_mri_kokujin_compacts:0 "国人盟约再编"
 jxp_52_mri_kokujin_compacts_desc:0 "旧有国人盟约不再只是战国权宜，而被改造成地方军役与调停的制度。"
 jxp_52_smz_teppo_foundries:0 "萨摩铁炮炉"
 jxp_52_smz_teppo_foundries_desc:0 "铁炮匠、火药役与铸炉被聚于萨南，远来的技术在本土化的火光中成形。"
 jxp_52_smz_satsunan_learning:0 "萨南译学"
 jxp_52_smz_satsunan_learning_desc:0 "琉球、明国与南蛮的书信被译入官藏，外学不再只是港口私语。"
 jxp_52_otm_funai_foreign_quarter:0 "府内外商街"
 jxp_52_otm_funai_foreign_quarter_desc:0 "府内的异国街市受官府保护，商人、译官与学徒在同一牌坊下往来。"
 jxp_52_otm_kunikuzushi_bureau:0 "国崩炮局"
 jxp_52_otm_kunikuzushi_bureau_desc:0 "大筒与炮匠被纳入军府，旧日奇技转化为围城与守备的官学。"
 jxp_52_dte_oshu_cavalry:0 "奥州骑马衆"
 jxp_52_dte_oshu_cavalry_desc:0 "奥州马场与边地武士被重新点检，北国风骨进入国家军制。"
 jxp_52_dte_keicho_embassy:0 "庆长遣使录"
 jxp_52_dte_keicho_embassy_desc:0 "渡海书信、异国礼法与旧使节文书被编入外交通鉴。"
 jxp_52_ask_hokoshu_order:0 "奉公众役次"
 jxp_52_ask_hokoshu_order_desc:0 "室町奉公众的座次被重新安排，使旧府从衰败记忆转为新朝秩序。"
 jxp_52_ask_higashiyama_culture:0 "东山文雅"
 jxp_52_ask_higashiyama_culture_desc:0 "茶、连歌、寺社与书院之雅被用于国家礼仪，旧都余韵润饰新政。"
 jxp_52_csk_ichiryo_gusoku_rolls:0 "一领具足军籍"
 jxp_52_csk_ichiryo_gusoku_rolls_desc:0 "土佐乡士与农兵被编入军籍，耕作与武备之间有了新的法度。"
 jxp_52_csk_tosa_sea_law:0 "土佐浦方法"
 jxp_52_csk_tosa_sea_law_desc:0 "浦方、乡士与船手共同承担海岸秩序，使山海之国的经验转为公法。"
 jxp_52_ouc_yamaguchi_mercantile_court:0 "山口商庭"
 jxp_52_ouc_yamaguchi_mercantile_court_desc:0 "山口旧都的公界传统被重启，商旅与寺社在礼法之下安置其利。"
 jxp_52_ouc_korean_envoys:0 "朝鲜通信之仪"
 jxp_52_ouc_korean_envoys_desc:0 "通信使、译官与馈赠文书皆按礼制重修，海上外交因仪轨而稳固。"
 jxp_52_img_tokaido_lawbooks:0 "东海道法书"
 jxp_52_img_tokaido_lawbooks_desc:0 "今川旧法被整理为裁判范本，街道、豪族与同盟皆受其约束。"
 jxp_52_img_triple_alliance_model:0 "三国同盟范式"
 jxp_52_img_triple_alliance_model_desc:0 "东海道旧日同盟经验被重新审视，婚姻、誓书与边界调停各得其位。"
 jxp_52_soo_wakan_office:0 "倭馆通事所"
 jxp_52_soo_wakan_office_desc:0 "倭馆与通事被置于官府名下，海峡往来的语言、礼物与关税皆有归处。"
 jxp_52_soo_tsushima_sea_wardens:0 "海峡守护衆"
 jxp_52_soo_tsushima_sea_wardens_desc:0 "对马旧知被扩为海峡巡防制度，船改、浦役与边贸不再各行其是。"
 jxp_major_founder_house_policy.15.t:0 "月山富田的山阴法"
 jxp_major_founder_house_policy.15.d:0 "尼子旧臣把月山富田的城法、矿山账与山阴海路文书呈上。山国与海路在出云相遇，若善用其旧制，西北诸国便不会只是边远之地。"
 jxp_major_founder_house_policy.15.a:0 "重订月山矿山帐"
 jxp_major_founder_house_policy.15.b:0 "录山阴海路凭据"
 jxp_major_founder_house_policy.16.t:0 "一乘谷纸帐"
 jxp_major_founder_house_policy.16.d:0 "朝仓旧都一乘谷虽经兵火，越前纸、奉书与城下町账册仍存于旧臣箱底。文书若能复活，北陆便可重新学会以笔墨承载政令。"
 jxp_major_founder_house_policy.16.a:0 "以越前纸重刊奉书"
 jxp_major_founder_house_policy.16.b:0 "整顿北陆关仓"
 jxp_major_founder_house_policy.17.t:0 "堺与管领的旧约"
 jxp_major_founder_house_policy.17.d:0 "细川旧臣熟知管领座次，堺町众则熟知银钱与海货。二者都声称自己曾支撑过畿内秩序，如今也能为新朝贡献一套更精细的制度。"
 jxp_major_founder_house_policy.17.a:0 "设管领奏事所"
 jxp_major_founder_house_policy.17.b:0 "承认堺町众会所"
 jxp_major_founder_house_policy.18.t:0 "若江家臣法"
 jxp_major_founder_house_policy.18.d:0 "河内若江的被官名簿与畿内裁断条目交织着旧幕府的影子。畠山旧臣请求让这些残卷进入新国制，使近畿不再只靠威名维系。"
 jxp_major_founder_house_policy.18.a:0 "清查河内被官名簿"
 jxp_major_founder_house_policy.18.b:0 "重订畿内裁断条目"
 jxp_major_founder_house_policy.19.t:0 "姬路执事与播磨账簿"
 jxp_major_founder_house_policy.19.d:0 "池田旧臣以姬路城代与播磨诸仓自豪。山阳道上的城、港与仓廪本可彼此支撑，只待国家为其安排一条清晰的文书脉络。"
 jxp_major_founder_house_policy.19.a:0 "命姬路城代校核播磨"
 jxp_major_founder_house_policy.19.b:0 "开姬路港仓"
 jxp_major_founder_house_policy.20.t:0 "加贺百万石"
 jxp_major_founder_house_policy.20.d:0 "前田旧臣称，加贺百万石不仅是富庶之名，更是仓廪、工匠、茶会与学问相互牵连的国制。若要取其精华，必须决定米仓与文治何者居先。"
 jxp_major_founder_house_policy.20.a:0 "立百万石仓法"
 jxp_major_founder_house_policy.20.b:0 "推金泽文治"
 jxp_major_founder_house_policy.21.t:0 "武卫旧府"
 jxp_major_founder_house_policy.21.d:0 "斯波旧府的名分虽已褪色，尾张武卫的文书与军役记忆仍可被重新使用。旧名若被新政吸收，便不只是衰世余响。"
 jxp_major_founder_house_policy.21.a:0 "复尾张武卫役所"
 jxp_major_founder_house_policy.21.b:0 "重编武家军役簿"
 jxp_major_founder_house_policy.22.t:0 "六分一殿的余威"
 jxp_major_founder_house_policy.22.d:0 "山名旧臣谈起六分一殿时，语气里仍带着守护大名时代的阔大。昔日山阴山阳诸国的联络网虽已残缺，却可转化为今日调藩与军役的材料。"
 jxp_major_founder_house_policy.22.a:0 "修山阴守护联络"
 jxp_major_founder_house_policy.22.b:0 "重列六分一军役"
 jxp_major_founder_house_policy.23.t:0 "陆奥九门"
 jxp_major_founder_house_policy.23.d:0 "芦名旧臣把会津、陆奥诸门与北地马市写成一册。东北的道路往往比诏令更慢，若要使其归心，关防与市场都须被认真经营。"
 jxp_major_founder_house_policy.23.a:0 "修陆奥九门关防"
 jxp_major_founder_house_policy.23.b:0 "许北海马市"
 jxp_major_founder_house_policy.24.t:0 "伊势北畠家法"
 jxp_major_founder_house_policy.24.d:0 "北畠旧臣以伊势国司与神宫近缘为荣。神国旧仪、南伊势港津与地方家法彼此缠绕，如何裁取，关乎朝廷威仪也关乎海口实利。"
 jxp_major_founder_house_policy.24.a:0 "由伊势神宫奏闻诸法"
 jxp_major_founder_house_policy.24.b:0 "清理南伊势关津"
 jxp_major_founder_house_policy.25.t:0 "播磨城路"
 jxp_major_founder_house_policy.25.d:0 "赤松旧臣呈上播磨城路与银山街道的账册。山城之间的道路不只是行军之途，也是税粮、矿石与文书流转的脉络。"
 jxp_major_founder_house_policy.25.a:0 "设播磨城路奉行"
 jxp_major_founder_house_policy.25.b:0 "核银山街道诸账"
 jxp_major_founder_house_policy.26.t:0 "虾夷地仲介"
 jxp_major_founder_house_policy.26.d:0 "安东旧臣熟悉北海风雪与虾夷地贸易。渡岛、津轻与更北之地的皮货、昆布、船头与夷人首领，都需要一个既能交涉也能守备的制度。"
 jxp_major_founder_house_policy.26.a:0 "任北方交易役"
 jxp_major_founder_house_policy.26.b:0 "置渡岛守备"
 jxp_major_founder_house_policy.27.t:0 "香取军役"
 jxp_major_founder_house_policy.27.d:0 "千叶旧臣言及香取神事与坂东武者时，仍把军役看作神前誓约的延伸。若要整理东国，旧武名与书状调停都不可轻弃。"
 jxp_major_founder_house_policy.27.a:0 "校香取武者卷"
 jxp_major_founder_house_policy.27.b:0 "续下总书状裁断"
 jxp_major_founder_house_policy.28.t:0 "丹后港守"
 jxp_major_founder_house_policy.28.d:0 "一色旧臣仍记得丹后诸浦、船改与天桥立周边的关津账册。北近畿虽不如堺与博多显赫，却自有联通山海的细密门路。"
 jxp_major_founder_house_policy.28.a:0 "立丹后船改所"
 jxp_major_founder_house_policy.28.b:0 "录天桥立关帐"
 jxp_major_founder_house_policy.29.t:0 "日向城网"
 jxp_major_founder_house_policy.29.d:0 "伊东旧臣呈上日向山城网与南九州社家调停文书。火山、山路、海风与神社之间，藏着一种适合边境国土的坚韧秩序。"
 jxp_major_founder_house_policy.29.a:0 "修日向山城网"
 jxp_major_founder_house_policy.29.b:0 "调停南九州社家"
 jxp_major_founder_house_policy.30.t:0 "阿苏礼议"
 jxp_major_founder_house_policy.30.d:0 "菊池旧臣把阿苏社家、肥后国人誓纸与火国旧仪一并呈上。礼与兵在九州山野并不分明，能调和二者者，方能安抚西南。"
 jxp_major_founder_house_policy.30.a:0 "召阿苏社家入礼议"
 jxp_major_founder_house_policy.30.b:0 "重立肥后国人誓纸"
 jxp_major_founder_house_policy.31.t:0 "濑户内水先法"
 jxp_major_founder_house_policy.31.d:0 "河野旧臣熟知伊予水先、岛浦誓约与濑户内潮汐。船只若要听命于国家，先要让国家懂得潮路如何说话。"
 jxp_major_founder_house_policy.31.a:0 "许伊予水先座"
 jxp_major_founder_house_policy.31.b:0 "编岛浦誓约船队"
 jxp_major_founder_house_policy.32.t:0 "诹访流镝马"
 jxp_major_founder_house_policy.32.d:0 "小笠原旧臣把诹访马场、弓马礼法与山国道路并列陈述。骑射若只为仪礼，便会衰败；若只为战阵，又会失去名分。"
 jxp_major_founder_house_policy.32.a:0 "重开诹访马场"
 jxp_major_founder_house_policy.32.b:0 "以神事弓马入礼"
 jxp_major_founder_house_policy.33.t:0 "大宰府中介"
 jxp_major_founder_house_policy.33.d:0 "少贰旧臣以大宰府旧名、博多商路与九州贡使座自居。这里既是西门，也是记忆里的官府；若重加整理，海风与礼仪可同入一册。"
 jxp_major_founder_house_policy.33.a:0 "编博多风信簿"
 jxp_major_founder_house_policy.33.b:0 "复大宰府贡使座"
 jxp_major_founder_house_policy.34.t:0 "常陆武者帐"
 jxp_major_founder_house_policy.34.d:0 "佐竹旧臣呈上常陆武者帐与东国调停文书。坂东之地从不缺武名，难的是把武名转为安定的地方秩序。"
 jxp_major_founder_house_policy.34.a:0 "点检常陆军役帐"
 jxp_major_founder_house_policy.34.b:0 "任东国调停人"
 jxp_major_founder_house_policy.35.t:0 "美浓川役"
 jxp_major_founder_house_policy.35.d:0 "土岐旧臣谈起美浓河川、纸座与工匠时，仿佛谈论一张流动的政务地图。河流能毁田，也能运货；文书能束缚，也能开路。"
 jxp_major_founder_house_policy.35.a:0 "设美浓川普请"
 jxp_major_founder_house_policy.35.b:0 "护土岐纸座"
 jxp_major_founder_house_policy.36.t:0 "日光关守"
 jxp_major_founder_house_policy.36.d:0 "宇都宫旧臣把日光山门、下野关防与社家守护连为一体。东山道的关隘不只是栅栏，也是通往神圣中心的门槛。"
 jxp_major_founder_house_policy.36.a:0 "命日光山门禁卫"
 jxp_major_founder_house_policy.36.b:0 "整下野关防"
 jxp_major_founder_house_policy.37.t:0 "大和寺社契约"
 jxp_major_founder_house_policy.37.d:0 "筒井旧臣熟知南都寺社、大和庄园与国人争讼。古都附近的每一份旧契约都牵动神佛、田租与武家面子，轻率裁断只会招来更深的怨言。"
 jxp_major_founder_house_policy.37.a:0 "委南都寺社调停"
 jxp_major_founder_house_policy.37.b:0 "核大和庄园诸账"

 jxp_52_ama_gassan_mine_registers:0 "月山矿山帐"
 jxp_52_ama_gassan_mine_registers_desc:0 "出云山城与矿山收入被重新登记，山阴旧法由此获得坚实的财政骨架。"
 jxp_52_ama_sanin_sea_ledgers:0 "山阴海路凭据"
 jxp_52_ama_sanin_sea_ledgers_desc:0 "山阴诸浦的船头、盐货与关津凭据被收归官府，使海路不再游离于山城之外。"
 jxp_52_asa_echizen_paper_edicts:0 "越前纸奉书"
 jxp_52_asa_echizen_paper_edicts_desc:0 "越前纸与旧奉书格式被用于新政，温和的文治重新找到可复制的形体。"
 jxp_52_asa_hokuriku_storehouses:0 "北陆关仓"
 jxp_52_asa_hokuriku_storehouses_desc:0 "北陆关所与仓廪被编入同一账册，山路、雪国与米藏之间有了清晰的秩序。"
 jxp_52_hsk_kanrei_audience_office:0 "管领奏事所"
 jxp_52_hsk_kanrei_audience_office_desc:0 "管领旧职被改造为奏事与调藩机构，畿内旧名分在新朝获得实用位置。"
 jxp_52_hsk_sakai_machishu_council:0 "堺町众会所"
 jxp_52_hsk_sakai_machishu_council_desc:0 "堺町众以会所议定市法与海货，银钱和誓书同在一张案上。"
 jxp_52_htk_kawachi_retainer_rolls:0 "河内被官名簿"
 jxp_52_htk_kawachi_retainer_rolls_desc:0 "河内被官与乡侍重新点入名簿，畿内边缘的旧纷争逐渐归于制度。"
 jxp_52_htk_kinai_lawbooks:0 "畿内裁断条目"
 jxp_52_htk_kinai_lawbooks_desc:0 "近畿诉讼、关津与武家面子的旧例被写成条目，使裁断不必每次重新开战。"
 jxp_52_ike_harima_castle_accounts:0 "播磨城代账"
 jxp_52_ike_harima_castle_accounts_desc:0 "姬路城代核问播磨诸城、仓廪与道路账册，山阳道由此更像一条国家筋脉。"
 jxp_52_ike_himeji_port_granaries:0 "姬路港仓"
 jxp_52_ike_himeji_port_granaries_desc:0 "港仓与城仓彼此勾连，播磨米谷、工料与海货可以在同一体系中流动。"
 jxp_52_mae_million_koku_granaries:0 "百万石仓法"
 jxp_52_mae_million_koku_granaries_desc:0 "加贺百万石的名声被转化为仓法、郡村账与工匠供给。"
 jxp_52_mae_kanazawa_civil_letters:0 "金泽文治"
 jxp_52_mae_kanazawa_civil_letters_desc:0 "茶、学问、书状与奉行制度共同支撑金泽式文治，使富庶不只表现为米数。"
 jxp_52_sba_owari_buei_offices:0 "尾张武卫役所"
 jxp_52_sba_owari_buei_offices_desc:0 "斯波旧府的名分被改造成役所制度，旧日武卫声望重新服务新政。"
 jxp_52_sba_warrior_muster_books:0 "武家军役簿"
 jxp_52_sba_warrior_muster_books_desc:0 "尾张、越前与畿内旧武家的军役记忆被重编入册。"
 jxp_52_ymn_sanin_guardian_links:0 "山阴守护联络"
 jxp_52_ymn_sanin_guardian_links_desc:0 "山名旧有守护联络网被整理为调藩文书，辽阔旧领的记忆不再只是夸耀。"
 jxp_52_ymn_roku_bun_ichi_musters:0 "六分一军役"
 jxp_52_ymn_roku_bun_ichi_musters_desc:0 "六分一殿的旧称被转译为军役编制，诸国名望与实际动员重新扣合。"
 jxp_52_rfr_mutsu_barrier_gates:0 "陆奥九门关防"
 jxp_52_rfr_mutsu_barrier_gates_desc:0 "陆奥诸门与会津关防被修成一体，北国道路终于有了可追溯的门钥。"
 jxp_52_rfr_northern_horse_markets:0 "北海马市"
 jxp_52_rfr_northern_horse_markets_desc:0 "马匹、皮货与边地商人被引入市法，东北边陲不再只是军报上的风雪。"
 jxp_52_ktb_ise_jingu_petitions:0 "伊势神宫奏闻"
 jxp_52_ktb_ise_jingu_petitions_desc:0 "神宫奏闻与国司旧法彼此呼应，使伊势的神圣名分成为新朝礼制的一角。"
 jxp_52_ktb_south_ise_ports:0 "南伊势关津"
 jxp_52_ktb_south_ise_ports_desc:0 "南伊势诸浦与关津得以清理，朝廷礼法之外也保留了海口实际。"
 jxp_52_akm_harima_road_wardens:0 "播磨城路奉行"
 jxp_52_akm_harima_road_wardens_desc:0 "播磨城路被置于奉行监管之下，山城之间的道路成为军政与财计共用的骨架。"
 jxp_52_akm_silver_road_accounts:0 "银山街道账"
 jxp_52_akm_silver_road_accounts_desc:0 "银山、驿路与仓廪账册被统一校核，矿石和粮秣终于在同一张纸上相遇。"
 jxp_52_akt_ezochi_trade_brokers:0 "北方交易役"
 jxp_52_akt_ezochi_trade_brokers_desc:0 "北方交易役调停虾夷地皮货、昆布与船头誓约，使风雪外的交易不再全凭私议。"
 jxp_52_akt_oshima_watch_posts:0 "渡岛守备"
 jxp_52_akt_oshima_watch_posts_desc:0 "渡岛守备把北方商路与边防系在一起，远岛也有了国家视线。"
 jxp_52_cba_katori_warrior_rolls:0 "香取武者卷"
 jxp_52_cba_katori_warrior_rolls_desc:0 "香取神前的武者誓约被点入军役卷册，坂东武名重新获得制度边界。"
 jxp_52_cba_shimosa_letters:0 "下总书状"
 jxp_52_cba_shimosa_letters_desc:0 "下总旧书状被用于东国调停，神前誓言与武家裁判同入文书。"
 jxp_52_isk_tango_ship_checks:0 "丹后船改所"
 jxp_52_isk_tango_ship_checks_desc:0 "丹后诸浦的船改、船籍与海货被收束于一所，北近畿的海口有了规矩。"
 jxp_52_isk_amanohashidate_ledgers:0 "天桥立关帐"
 jxp_52_isk_amanohashidate_ledgers_desc:0 "天桥立周边关津账册被重新登记，使山海往来的小路也能入国法。"
 jxp_52_ito_hyuga_mountain_castles:0 "日向山城网"
 jxp_52_ito_hyuga_mountain_castles_desc:0 "日向山城彼此联络，火山与山路之间形成坚韧的地方守备。"
 jxp_52_ito_southern_kyushu_rites:0 "南九州社家调停"
 jxp_52_ito_southern_kyushu_rites_desc:0 "南九州社家与国人争讼由官府调停，边地旧俗被温和纳入新政。"
 jxp_52_kkc_aso_rite_council:0 "阿苏社家礼议"
 jxp_52_kkc_aso_rite_council_desc:0 "阿苏社家进入礼议，火国旧仪由此不再只是地方记忆。"
 jxp_52_kkc_higo_kokujin_oaths:0 "肥后国人誓纸"
 jxp_52_kkc_higo_kokujin_oaths_desc:0 "肥后国人以誓纸约束军役与争端，九州山野里的旧盟被重新安置。"
 jxp_52_kno_iyo_pilot_guilds:0 "伊予水先座"
 jxp_52_kno_iyo_pilot_guilds_desc:0 "伊予水先人以座法登记航路、潮汐与船头责任。"
 jxp_52_kno_island_oath_fleet:0 "岛浦誓约船队"
 jxp_52_kno_island_oath_fleet_desc:0 "岛浦誓约被转化为船队编制，濑户内的碎浪也能听见国家号令。"
 jxp_52_ogs_suwa_horse_fields:0 "诹访马场"
 jxp_52_ogs_suwa_horse_fields_desc:0 "诹访马场重开，山国骑射不再只是旧仪，而可成为实用军制。"
 jxp_52_ogs_ritual_archery:0 "神事弓马"
 jxp_52_ogs_ritual_archery_desc:0 "弓马礼法被纳入国家礼仪，使武艺仍保有神前肃穆。"
 jxp_52_shn_hakata_wind_books:0 "博多风信簿"
 jxp_52_shn_hakata_wind_books_desc:0 "博多商路、季风与海货被写入风信簿，九州西门有了可靠的海上历书。"
 jxp_52_shn_dazaifu_envoy_seats:0 "大宰府贡使座"
 jxp_52_shn_dazaifu_envoy_seats_desc:0 "大宰府旧名被用于贡使与礼物往来，西国外交重获一个可被识别的座席。"
 jxp_52_stk_hitachi_warrior_rolls:0 "常陆军役帐"
 jxp_52_stk_hitachi_warrior_rolls_desc:0 "常陆武者被点入军役帐，坂东兵势不再只是家名的夸耀。"
 jxp_52_stk_eastern_arbiters:0 "东国调停人"
 jxp_52_stk_eastern_arbiters_desc:0 "东国调停人游走于豪族、寺社与郡村之间，把争斗折入可判的文书。"
 jxp_52_tki_mino_river_works:0 "美浓川普请"
 jxp_52_tki_mino_river_works_desc:0 "美浓河川与堤防普请有了常设官署，水患与水运同入国家计算。"
 jxp_52_tki_toki_paper_offices:0 "土岐纸座"
 jxp_52_tki_toki_paper_offices_desc:0 "土岐旧文书与美浓纸座相互支撑，纸面上的秩序开始改变河谷里的生活。"
 jxp_52_utn_nikko_gate_guard:0 "日光山门禁卫"
 jxp_52_utn_nikko_gate_guard_desc:0 "日光山门禁卫守护神圣门户，也替东山道的关防赋予更庄严的名分。"
 jxp_52_utn_shimotsuke_barriers:0 "下野关防"
 jxp_52_utn_shimotsuke_barriers_desc:0 "下野关防被重新整顿，山道、社家与边郡不再各守其旧。"
 jxp_52_tti_nanto_temple_mediation:0 "南都寺社调停"
 jxp_52_tti_nanto_temple_mediation_desc:0 "南都寺社争讼经由专门调停，古都附近的每一份旧契约都得以谨慎处理。"
 jxp_52_tti_yamato_manor_ledgers:0 "大和庄园账"
 jxp_52_tti_yamato_manor_ledgers_desc:0 "大和庄园、田租与国人诉讼被重新登记，使古老土地不再只由旧习支配。"
