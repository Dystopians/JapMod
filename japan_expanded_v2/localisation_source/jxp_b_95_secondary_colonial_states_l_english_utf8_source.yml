 jxp_b_95_hkk_company_republic_reform:0 "北洋商社共和国"
 jxp_b_95_hkk_company_republic_reform_desc:0 "寒港商社、毛皮拍卖所和船主共同推举执政者。账簿与信用能够支撑漫长补给线，却也使人口稀少的国家格外依赖商人资本。"
 jxp_b_95_hkk_frontier_bakufu_reform:0 "北辰边疆军府"
 jxp_b_95_hkk_frontier_bakufu_reform_desc:0 "守备头人以军屯、冬仓和季节船队统辖辽阔边地。军府能够在严寒和外敌面前迅速动员，但强制役务会不断考验地方盟约。"
 jxp_b_95_hkk_northern_peoples_assembly_reform:0 "北方多民族议会"
 jxp_b_95_hkk_northern_peoples_assembly_reform_desc:0 "阿伊努首领、港町年寄、混合船队与边地聚落各派代表进入议会。国家以承认不同习惯法换取广泛合作，将北方社会视为共同体成员而非无名阻力。"
 jxp_b_95_njf_japan_town_league_reform:0 "日本町联盟"
 jxp_b_95_njf_japan_town_league_reform_desc:0 "各港日本町保留本地章程，以共同使节、船队和仲裁所维系联盟。此制尊重当地王权的旧有特许，也避免任何单一港市独占联邦。"
 jxp_b_95_njf_red_seal_company_state_reform:0 "朱印商社国"
 jxp_b_95_njf_red_seal_company_state_reform_desc:0 "朱印船主和大商社以认股方式承办航路、仓储与防务。商业决策迅速而有力，但公共权力可能被少数账房和债权人把持。"
 jxp_b_95_njf_southern_military_diaspora_reform:0 "南洋军事侨团"
 jxp_b_95_njf_southern_military_diaspora_reform_desc:0 "浪人、佣兵头人与港口守备构成国家骨架，以军功和屯驻换取市民资格。其兵锋足以保护分散的侨港，却常与町众自治发生冲突。"
 jxp_b_95_njf_plural_port_federation_reform:0 "多宗教港市联邦"
 jxp_b_95_njf_plural_port_federation_reform_desc:0 "神社、佛寺、教会、清真寺与本地礼俗共同接受港市公约。信仰不再决定居民能否经商、请愿与守城，多元社会因而成为联邦根基。"
 jxp_b_95_oia_island_kingdom_reform:0 "诸岛王国"
 jxp_b_95_oia_island_kingdom_reform_desc:0 "本地王统与漂洋而来的武家谱系以婚盟和航路誓约结合。王权为分散诸岛提供连续的外交人格，也必须尊重各岛土地与礁海习惯。"
 jxp_b_95_oia_harbor_assembly_reform:0 "港口议会"
 jxp_b_95_oia_harbor_assembly_reform_desc:0 "各岛港口按船只、人口和公役推举议员。议会掌理共同税则、救难和航标，岛内土地事务仍由地方议事会处置。"
 jxp_b_95_oia_oceanic_naval_league_reform:0 "大洋海军联盟"
 jxp_b_95_oia_oceanic_naval_league_reform_desc:0 "诸岛以舰船、船员和中继港配额维持共同海军。联盟可以保护漫长航线，但常备舰队的负担要求每一座港市持续让步。"

