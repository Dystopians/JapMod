 jxp_b_95_form_hkk_title:0 "缔造北辰海国"
 jxp_b_95_form_hkk_desc:0 "北方寒港、阿留申航路和毛皮集市已形成相互依存的社会。惟有拥有足够城市、港埠与地方盟约，且海外居民的共同身份已经成熟，诸港方可承担建国所需的仓储、船队和官署成本。随机新大陆中，此决议只向已经承继北太平洋探索传统的沿海殖民社会开放。"
 jxp_b_95_form_njf_title:0 "结成南洋日本町联邦"
 jxp_b_95_form_njf_desc:0 "南洋各港的日本町并非连续领土，而是由王权特许、通事、商人和侨民守备维系的海上网络。只有在东南亚拥有成熟港网、足够人口与地方盟约时，诸町才能共同承担联邦政务。"
 jxp_b_95_form_oia_title:0 "缔结大洋诸岛盟"
 jxp_b_95_form_oia_desc:0 "岛屿之间的海面不是边界，而是道路。拥有一串成熟港市、可靠航海家与得到各岛社会认可的盟约之后，移民共同体和本地王权方能建立横跨大洋的共同国家。"
 jxp_b_95_agent_a_refresh_interface_tt:0 "新国家已向整合端登记任务、理念与一级政体刷新请求；在中央接线完成前，本地建国、事件和任务内容仍保持独立。"

