 HKK_ideas:0 "北辰理念"
 HKK_ideas_start:0 "北辰传统"
 HKK_ideas_bonus:0 "北辰雄心"
 hkk_cold_harbor_storehouses:0 "寒港冬仓"
 hkk_cold_harbor_storehouses_desc:0 "严寒使补给本身成为国政。由各港共担的冬仓既储粮也储帆布、盐和修船木料。"
 hkk_ainu_brokerage_councils:0 "阿伊努通事评议"
 hkk_ainu_brokerage_councils_desc:0 "熟悉北方语言、亲族与季节市场的通事进入评议，使外交不再只依靠外来官吏的臆测。"
 hkk_fur_auction_ledgers:0 "毛皮竞市账"
 hkk_fur_auction_ledgers_desc:0 "公开竞价和统一成色标准能抑制私下盘剥，也让寒地贸易成为可靠的公共收入。"
 hkk_aleutian_pilot_houses:0 "阿留申水先家"
 hkk_aleutian_pilot_houses_desc:0 "代代记录风向、海雾与避风湾的水先家，将散落岛链连成一条可重复航行的道路。"
 hkk_northern_mixed_crews:0 "北方混合船员"
 hkk_northern_mixed_crews_desc:0 "移民船手、本地猎手与海岛舵手共列一册，依技艺而非出身分配船上职役。"
 hkk_frontier_diet:0 "边地议政会"
 hkk_frontier_diet_desc:0 "每一处寒港与边地聚落都可派员议定税役、冬粮和守备，使辽阔疆域仍有共同法度。"
 hkk_seasonal_convoys:0 "季节船团"
 hkk_seasonal_convoys_desc:0 "舰船依冰期和洋流集中出航，互相护送并共用补给，减少单船失踪造成的灾难。"

 NJF_ideas:0 "南洋日本町理念"
 NJF_ideas_start:0 "日本町传统"
 NJF_ideas_bonus:0 "南洋联邦雄心"
 njf_japan_town_registers:0 "日本町连署册"
 njf_japan_town_registers_desc:0 "分散各国的町年寄以同式名册记录居民、商社和公役，让联邦政令跨越不同王权。"
 njf_interpreter_guilds:0 "通事行会"
 njf_interpreter_guilds_desc:0 "精通多种语言与礼法的通事负责翻译契约，也调解商人、当地官府与宗教团体的争端。"
 njf_royal_port_patents:0 "王权港市特许"
 njf_royal_port_patents_desc:0 "联邦承认当地君主授予的旧特许，并以贡礼、军需和关税回报，从而避免把侨港变成无主飞地。"
 njf_plural_harbor_wards:0 "多宗教港区"
 njf_plural_harbor_wards_desc:0 "各信仰可在遵守公共治安的前提下建立会所、寺堂与墓地，港市因此吸引四方人才。"
 njf_red_seal_credit:0 "朱印信用"
 njf_red_seal_credit_desc:0 "旧朱印状不再具有宗主命令之力，却仍能作为家族声誉和跨港债务的共同记忆。"
 njf_monsoon_convoys:0 "季风船团"
 njf_monsoon_convoys_desc:0 "诸港依季风共同安排出航、护卫与仓储，使分散航线汇成稳定的贸易循环。"
 njf_port_federation_compact:0 "港市联邦约"
 njf_port_federation_compact_desc:0 "联邦只掌共同关税、外交和防务，各町仍依当地章程处理民政，权力因而保持平衡。"

 OIA_ideas:0 "大洋诸岛理念"
 OIA_ideas_start:0 "诸岛航海传统"
 OIA_ideas_bonus:0 "大洋同盟雄心"
 oia_star_path_houses:0 "星路传习家"
 oia_star_path_houses_desc:0 "航海家以星辰、涌浪、云形和鸟群辨认方向，将知识传给下一代水手。"
 oia_chiefly_compacts:0 "诸酋盟誓"
 oia_chiefly_compacts_desc:0 "各岛王权与移民代表以互赠、婚盟和共同守备确立关系，而非以一纸命令抹去地方权威。"
 oia_land_and_reef_customs:0 "土地与礁海习惯"
 oia_land_and_reef_customs_desc:0 "耕地、渔场和礁海各有传统权利。国家承认这些规则，才能使新旧居民共同经营岛屿。"
 oia_harbor_gardens:0 "港湾园圃"
 oia_harbor_gardens_desc:0 "中继港必须自给淡水与食粮。梯田、芋圃和公共水池让远洋船队不再掏空岛民储备。"
 oia_island_squadrons:0 "诸岛分舰队"
 oia_island_squadrons_desc:0 "每座港口按能力提供船只与船员，在共同旗号下巡护岛链而不摧毁地方船队。"
 oia_mixed_ocean_crews:0 "大洋混合船员"
 oia_mixed_ocean_crews_desc:0 "来自不同岛屿和远方港町的船员按航海技艺编组，在共同服役中形成新的海洋身份。"
 oia_equal_seas_council:0 "平等海域评议"
 oia_equal_seas_council_desc:0 "无论岛屿大小，涉及航标、救难和共同防务的决议都必须听取其代表意见。"

 jxp_b_95_hkk_cold_harbors_title:0 "联结北方寒港"
 jxp_b_95_hkk_cold_harbors_desc:0 "散落在雾海与冰岸之间的港埠必须共用航标、补给尺度和救难信号，才能构成真正的国土。"
 jxp_b_95_hkk_seasonal_storehouses_title:0 "建立季节公仓"
 jxp_b_95_hkk_seasonal_storehouses_desc:0 "寒地的丰歉以月计算。各港按人口和船数分担储粮，能让边民与船队熬过漫长封冻。"
 jxp_b_95_hkk_northern_shipyards_title:0 "整备北方船渠"
 jxp_b_95_hkk_northern_shipyards_desc:0 "能在短暂暖季内修复远洋船只的船渠，是北方国家维持贸易和守备的生命线。"
 jxp_b_95_hkk_ainu_compacts_title:0 "订立阿伊努盟约"
 jxp_b_95_hkk_ainu_compacts_desc:0 "北方社会拥有自己的亲族、渔猎与互市规则。让通事和首领进入议政，远比把他们视为障碍更能维持边地和平。"
 jxp_b_95_hkk_fur_ledger_title:0 "编定毛皮竞市账"
 jxp_b_95_hkk_fur_ledger_desc:0 "统一成色、度量与竞价记录，使毛皮收益不再被少数私商隐匿，也保护猎户免受任意压价。"
 jxp_b_95_hkk_northern_citizenship_title:0 "确立北方市民籍"
 jxp_b_95_hkk_northern_citizenship_desc:0 "守仓、领航、狩猎和巡海者皆在国家生存中承担职责，也应在法庭与议会拥有相应权利。"
 jxp_b_95_hkk_aleutian_chain_title:0 "贯通阿留申岛链"
 jxp_b_95_hkk_aleutian_chain_desc:0 "每一座避风湾都是下一段航程的起点。水先记录和中继仓将群岛连成可重复航行的通道。"
 jxp_b_95_hkk_storm_routes_title:0 "绘定风暴航路"
 jxp_b_95_hkk_storm_routes_desc:0 "海雾与暴风不会服从疆界。船头们应公开危险海域、漂流规律与救援泊地的知识。"
 jxp_b_95_hkk_north_pacific_convoys_title:0 "编组北太平洋船团"
 jxp_b_95_hkk_north_pacific_convoys_desc:0 "依冰期集中出航的船团可以共担护卫和修缮，让小人口国家仍具备远洋运输能力。"
 jxp_b_95_hkk_watch_russian_advance_title:0 "监视俄人东进"
 jxp_b_95_hkk_watch_russian_advance_desc:0 "来自西方陆路的猎队、商站和军堡正在逼近太平洋。我们必须区分可谈判的商人和不可放任的扩张。"
 jxp_b_95_hkk_fortified_sound_title:0 "设防海峡要津"
 jxp_b_95_hkk_fortified_sound_desc:0 "少数控制航道的寒港足以决定北海安全。炮台、信号所和混合船员必须协同守卫它们。"
 jxp_b_95_hkk_northern_balance_title:0 "维持北方均势"
 jxp_b_95_hkk_northern_balance_desc:0 "强邻既可互市也可为敌。以可靠舰队和审慎条约同时维持威慑与往来，才是长久之道。"
 jxp_b_95_hkk_founders_diet_title:0 "召开开国评议"
 jxp_b_95_hkk_founders_diet_desc:0 "商社、军府与各族议席必须决定谁有权征税、宣战和调动冬仓，临时统治方能化为宪制。"
 jxp_b_95_hkk_choose_northern_order_title:0 "定北方国制"
 jxp_b_95_hkk_choose_northern_order_desc:0 "国家已经超出几个港町的规模。如今必须让所选国制能够约束执政者，也能在危急时有效行动。"
 jxp_b_95_hkk_northern_self_rule_title:0 "宣示北洋自理"
 jxp_b_95_hkk_northern_self_rule_desc:0 "北辰既非本土官署的临时支站，也不是无根商社。我们将以条约或自主宣言，确定与日本的平等关系。"

 jxp_b_95_njf_japan_town_registers_title:0 "汇编日本町名册"
 jxp_b_95_njf_japan_town_registers_desc:0 "从会安到马尼拉，各町名册必须记录居民、商社、公役和当地特许，方能成为联邦行政的共同底本。"
 jxp_b_95_njf_harbor_magistrates_title:0 "分设港津奉行"
 jxp_b_95_njf_harbor_magistrates_desc:0 "每座侨港都处于不同王权与法俗之下。熟悉当地条款的奉行能够处理税务、诉讼和突发纠纷。"
 jxp_b_95_njf_interport_couriers_title:0 "贯通诸港飞脚"
 jxp_b_95_njf_interport_couriers_desc:0 "季风会切断海路数月，联邦因此需要定期船信和多语文书，使远方港町仍能遵循共同决议。"
 jxp_b_95_njf_royal_licenses_title:0 "重申王权特许"
 jxp_b_95_njf_royal_licenses_desc:0 "日本町的立足之本是当地君主授予的贸易与居住许可。重申贡礼和义务可避免联邦沦为强占港区。"
 jxp_b_95_njf_interpreters_guild_title:0 "整编通事行会"
 jxp_b_95_njf_interpreters_guild_desc:0 "通事不仅翻译言语，也解释礼法、币制与契约。公开考核和轮任可防止知识被少数家族垄断。"
 jxp_b_95_njf_plural_wards_title:0 "缔结多宗教町约"
 jxp_b_95_njf_plural_wards_desc:0 "多种信仰共享同一港市。让各会堂在公共治安下自理礼仪，比强迫整齐划一更能维持繁荣。"
 jxp_b_95_njf_red_seal_consortium_title:0 "重组朱印商盟"
 jxp_b_95_njf_red_seal_consortium_desc:0 "褪色的朱印状仍承载跨港信用。国家将把私家债务和船队关系纳入公开审计。"
 jxp_b_95_njf_tropical_warehouses_title:0 "建立热带公仓"
 jxp_b_95_njf_tropical_warehouses_desc:0 "季风、疫病与歉收常同时袭来。公共粮仓和船材储备能阻止一处灾荒拖垮整个港网。"
 jxp_b_95_njf_monsoon_exchange_title:0 "统合季风互市"
 jxp_b_95_njf_monsoon_exchange_desc:0 "按季风安排仓储、保险与护航，可使分散商路形成稳定循环，并降低对日本单一市场的依赖。"
 jxp_b_95_njf_ronin_companies_title:0 "约束浪人奉公众"
 jxp_b_95_njf_ronin_companies_desc:0 "无主武士曾为各地王权和商社效力。成文契约、军纪和退役安置必须取代临时掠夺。"
 jxp_b_95_njf_convoy_law_title:0 "颁行护航掟"
 jxp_b_95_njf_convoy_law_desc:0 "每座港市按贸易额分担护航船、补给和信号，商船也须服从共同出航时刻。"
 jxp_b_95_njf_maritime_militia_title:0 "编成港市民兵"
 jxp_b_95_njf_maritime_militia_desc:0 "分散侨港不能永远依赖雇佣兵。居民民兵与联邦船队应共同守卫仓库、会所和城门。"
 jxp_b_95_njf_port_congress_title:0 "召开诸港大会"
 jxp_b_95_njf_port_congress_desc:0 "各港所处国度、信仰和商路不同，唯有正式大会能划定共同税则、外交与防务的权限。"
 jxp_b_95_njf_federation_compact_title:0 "签署联邦盟约"
 jxp_b_95_njf_federation_compact_desc:0 "盟约保障各町章程与当地王权条款，同时授予联邦处理跨港事务所需的有限权力。"
 jxp_b_95_njf_terms_with_japan_title:0 "议定对日条款"
 jxp_b_95_njf_terms_with_japan_desc:0 "我们与日本仍有亲族、信仰和贸易联系，却不再接受单方面号令。互惠盟约或自由港宣言将决定未来关系。"

 jxp_b_95_oia_star_paths_title:0 "整理星路传承"
 jxp_b_95_oia_star_paths_desc:0 "星辰、涌浪、云形和鸟群共同指示航路。航海家应将口传知识纳入公共传习，而非锁在一家船舱。"
 jxp_b_95_oia_waystations_title:0 "布设岛链中继"
 jxp_b_95_oia_waystations_desc:0 "淡水、修船木料和避风锚地让群岛成为道路。每处中继也必须保护当地居民的储备。"
 jxp_b_95_oia_blue_water_hulls_title:0 "建造蓝水船队"
 jxp_b_95_oia_blue_water_hulls_desc:0 "跨越大洋需要能承受长浪的船体和熟悉远海的船员，不能只依靠沿岸巡舟。"
 jxp_b_95_oia_chiefly_compacts_title:0 "缔结诸酋盟誓"
 jxp_b_95_oia_chiefly_compacts_desc:0 "本地王权与移民会所应以婚盟、互赠和共同防务相连，而非让一方吞没另一方。"
 jxp_b_95_oia_land_and_reef_customs_title:0 "承认土地礁海习惯"
 jxp_b_95_oia_land_and_reef_customs_desc:0 "岛民对园圃、渔场和礁海的权利有长久规则。国家承认并记录它们，才能避免拓殖演为掠夺。"
 jxp_b_95_oia_common_council_title:0 "建立诸岛共同评议"
 jxp_b_95_oia_common_council_desc:0 "无论岛屿大小，涉及航标、救难与共同税则时都应有席位，使联盟名副其实。"
 jxp_b_95_oia_harbor_gardens_title:0 "扩建港湾园圃"
 jxp_b_95_oia_harbor_gardens_desc:0 "公共水池、芋圃和梯田为中继船队提供食粮，也防止远洋贸易夺走岛民口粮。"
 jxp_b_95_oia_sandalwood_exchange_title:0 "规范香木互市"
 jxp_b_95_oia_sandalwood_exchange_desc:0 "珍贵香木和海产不应被一次掠尽。公开税则与采伐约束能让贸易收益长久。"
 jxp_b_95_oia_ocean_entrepot_title:0 "营造大洋互市港"
 jxp_b_95_oia_ocean_entrepot_desc:0 "当航路、仓储和信用汇集于诸岛，中继港便能连接两岸，而非只是被路过舰队取用。"
 jxp_b_95_oia_reef_watch_title:0 "设置礁海守望"
 jxp_b_95_oia_reef_watch_desc:0 "熟悉浅滩与潮口的守望者比外来大舰更早发现威胁，也负责引导遇险船只。"
 jxp_b_95_oia_island_squadrons_title:0 "合编诸岛分舰队"
 jxp_b_95_oia_island_squadrons_desc:0 "各港按能力提供船只和船员，在共同号令下巡航，同时保留维持本地生计的舟船。"
 jxp_b_95_oia_oceanic_defense_pact_title:0 "缔结大洋防务约"
 jxp_b_95_oia_oceanic_defense_pact_desc:0 "共同舰队、补给配额和救难义务应写入盟约，让最远的岛屿也不被独自放弃。"
 jxp_b_95_oia_island_congress_title:0 "召开诸岛大会"
 jxp_b_95_oia_island_congress_desc:0 "本地王统、港口议员和舰队代表必须共同决定联盟的权力边界。"
 jxp_b_95_oia_choose_constitution_title:0 "定诸岛国制"
 jxp_b_95_oia_choose_constitution_desc:0 "王国、议会或海军联盟皆可维系群岛，但所选制度必须受到土地习惯和共同盟约约束。"
 jxp_b_95_oia_equal_seas_compact_title:0 "宣示平等海域"
 jxp_b_95_oia_equal_seas_compact_desc:0 "大洋不再是日本通往远方的空白，而是诸岛人民共同生活的疆域。我们将以平等条约决定跨洋关系。"

 jxp_secondary_colonies.1.t:0 "北辰开国评议"
 jxp_secondary_colonies.1.d:0 "寒港商社要求以认股和账簿治国，守备头人主张军府统辖，而阿伊努通事、混合船员和各地年寄则要求共同议席。国家的第一道印必须在三者之间作出选择。"
 jxp_secondary_colonies.1.a:0 "建立北洋商社共和国"
 jxp_secondary_colonies.1.b:0 "拥立北辰边疆军府"
 jxp_secondary_colonies.1.c:0 "召开北方多民族议会"
 jxp_secondary_colonies.2.t:0 "阿伊努通事的席位"
 jxp_secondary_colonies.2.d:0 "通事与首领要求在毛皮价格、渔猎边界和刑事裁断中拥有固定席位。商社反对让旧有专卖受到审查。"
 jxp_secondary_colonies.2.a:0 "让通事进入评议"
 jxp_secondary_colonies.2.b:0 "仍由官营商站定价"
 jxp_secondary_colonies.3.t:0 "封冻前的公仓"
 jxp_secondary_colonies.3.d:0 "今年冰期来得格外早。各港请求国家收购粮食和燃料，商人则愿意供应，但坚持按短缺后的高价出售。"
 jxp_secondary_colonies.3.a:0 "动用国库充实公仓"
 jxp_secondary_colonies.3.b:0 "让市场承担风险"
 jxp_secondary_colonies.4.t:0 "俄人商队越过山脉"
 jxp_secondary_colonies.4.d:0 "俄国猎人与商人抵达西侧港湾。他们既可能带来陆路货源，也可能成为堡垒和征税官的先声。"
 jxp_secondary_colonies.4.a:0 "订立限期互市休争"
 jxp_secondary_colonies.4.b:0 "以守备显示边界"
 jxp_secondary_colonies.5.t:0 "谁可列入船员册"
 jxp_secondary_colonies.5.d:0 "本地舵手熟悉潮汐，移民船匠掌握远洋船体，猎手能在冰岸补给。旧船头却坚持按出身分配职役。"
 jxp_secondary_colonies.5.a:0 "依技艺编成混合船员"
 jxp_secondary_colonies.5.b:0 "维持分列名册"
 jxp_secondary_colonies.6.t:0 "毛皮专卖之争"
 jxp_secondary_colonies.6.d:0 "官营专卖承诺稳定收入，却压低猎户所得；公开竞市收益较慢，却能扩大共同体对国家的信任。"
 jxp_secondary_colonies.6.a:0 "维持官营专卖"
 jxp_secondary_colonies.6.b:0 "改行公开竞市"
 jxp_secondary_colonies.7.t:0 "雾海中的遇难船"
 jxp_secondary_colonies.7.d:0 "一艘外港船在风暴中失事。救援要消耗宝贵粮材，若按无主漂流物处置，国库和船主都能获利。"
 jxp_secondary_colonies.7.a:0 "救人优先，颁行救难掟"
 jxp_secondary_colonies.7.b:0 "依旧例分配漂流物"
 jxp_secondary_colonies.8.t:0 "北辰与日本"
 jxp_secondary_colonies.8.d:0 "两岸仍由亲族、宗教和商路相连，但北方人民不愿再接受临时总督的号令。使节可缔结互市盟约，也可宣示完全自主。"
 jxp_secondary_colonies.8.a:0 "缔结平等互市盟约"
 jxp_secondary_colonies.8.b:0 "发表北辰自主宣言"

 jxp_secondary_colonies.101.t:0 "诸港合邦大会"
 jxp_secondary_colonies.101.d:0 "各日本町的年寄、朱印商、浪人头目和宗教会所齐聚一堂。他们同意共同防务，却对谁应支配这张港网争论不休。"
 jxp_secondary_colonies.101.a:0 "结成日本町联盟"
 jxp_secondary_colonies.101.b:0 "建立朱印商社国"
 jxp_secondary_colonies.101.c:0 "组织南洋军事侨团"
 jxp_secondary_colonies.101.e:0 "缔造多宗教港市联邦"
 jxp_secondary_colonies.102.t:0 "通事是否也是官员"
 jxp_secondary_colonies.102.d:0 "通事掌握语言、契约和各国宫廷礼法，权力远超普通翻译。有人要求公开考核，也有人主张继续由本土出身者垄断机密。"
 jxp_secondary_colonies.102.a:0 "建立公开通事行会"
 jxp_secondary_colonies.102.b:0 "保留官署专用通事"
 jxp_secondary_colonies.103.t:0 "当地王权的旧特许"
 jxp_secondary_colonies.103.d:0 "联邦建立后，旧有居住和贸易许可是否仍有效成为争端。无视当地君主固然直接，却会使日本町失去合法立足点。"
 jxp_secondary_colonies.103.a:0 "重申特许与相应义务"
 jxp_secondary_colonies.103.b:0 "赎买不受干预的权利"
 jxp_secondary_colonies.104.t:0 "同一条街上的诸神"
 jxp_secondary_colonies.104.d:0 "神社、佛寺、教会与清真寺的节日挤在同一条港街。町奉行必须决定公共法如何面对不同礼俗。"
 jxp_secondary_colonies.104.a:0 "以共同治安保障各自礼仪"
 jxp_secondary_colonies.104.b:0 "由官署统一街区规制"
 jxp_secondary_colonies.105.t:0 "朱印信用的归属"
 jxp_secondary_colonies.105.d:0 "商人要求国家承认旧朱印家族的债权优先，町众则担心联邦被少数船主永久把持。"
 jxp_secondary_colonies.105.a:0 "以旧信用支撑远洋借贷"
 jxp_secondary_colonies.105.b:0 "削弱商社特权"
 jxp_secondary_colonies.106.t:0 "浪人的奉公契约"
 jxp_secondary_colonies.106.d:0 "受雇武士要求以战利和特许港税支付军饷。公议员主张改用固定俸给，并让其家属进入普通市民籍。"
 jxp_secondary_colonies.106.a:0 "承认限期军务契约"
 jxp_secondary_colonies.106.b:0 "用公费改编为联邦民兵"
 jxp_secondary_colonies.107.t:0 "季风后的饥馑"
 jxp_secondary_colonies.107.d:0 "暴风延误粮船，数座港市出现短缺。公仓可按居民名册发粮，投机商也愿意立即收购余粮再高价转运。"
 jxp_secondary_colonies.107.a:0 "开启联邦救济仓"
 jxp_secondary_colonies.107.b:0 "准许商人自由调粮"
 jxp_secondary_colonies.108.t:0 "日本町与故国"
 jxp_secondary_colonies.108.d:0 "故国使节希望恢复对朱印、关税和任官的最终裁可。诸港愿保留亲缘航路，却坚持自己的盟约已经成为最高法。"
 jxp_secondary_colonies.108.a:0 "缔结日本町互惠盟约"
 jxp_secondary_colonies.108.b:0 "宣告南洋自由港共同体"

 jxp_secondary_colonies.201.t:0 "大洋合盟会"
 jxp_secondary_colonies.201.d:0 "各岛王统、港市年寄与舰队船头同意共享航标和防务，却对联盟的最高权威意见不一。"
 jxp_secondary_colonies.201.a:0 "拥立诸岛王国"
 jxp_secondary_colonies.201.b:0 "建立港口议会"
 jxp_secondary_colonies.201.c:0 "组成大洋海军联盟"
 jxp_secondary_colonies.202.t:0 "王统与港市的盟誓"
 jxp_secondary_colonies.202.d:0 "本地首领要求确认土地与礼仪权，港市代表则要求所有共同税役必须经过公开议决。"
 jxp_secondary_colonies.202.a:0 "以诸酋盟誓维系共同体"
 jxp_secondary_colonies.202.b:0 "把共同事务交给议会"
 jxp_secondary_colonies.203.t:0 "航海知识属于谁"
 jxp_secondary_colonies.203.d:0 "老船头以家传星路为荣，年轻水手则希望建立学舍，让各岛共享航海知识。"
 jxp_secondary_colonies.203.a:0 "资助公共航海学舍"
 jxp_secondary_colonies.203.b:0 "尊重船头家传"
 jxp_secondary_colonies.204.t:0 "礁海上的界线"
 jxp_secondary_colonies.204.d:0 "移民渔船进入传统礁海，引发与岛民的冲突。旧习惯可被记录进国家法，也可由港税官重新划分。"
 jxp_secondary_colonies.204.a:0 "承认并记录礁海习惯"
 jxp_secondary_colonies.204.b:0 "由官署统一发给许可"
 jxp_secondary_colonies.205.t:0 "共同舰队的船员"
 jxp_secondary_colonies.205.d:0 "远洋舰需要各岛舵手、移民船匠和港市炮手共同服役。军官争论是否应打破出身分列。"
 jxp_secondary_colonies.205.a:0 "依航海技艺混合编组"
 jxp_secondary_colonies.205.b:0 "维持各岛分队"
 jxp_secondary_colonies.206.t:0 "香木与港税"
 jxp_secondary_colonies.206.d:0 "短期专卖可以迅速充实国库，开放互市则更能照顾小岛和本地商贩。"
 jxp_secondary_colonies.206.a:0 "征收统一港税"
 jxp_secondary_colonies.206.b:0 "降低壁垒，让各岛自行互市"
 jxp_secondary_colonies.207.t:0 "风暴中的互救"
 jxp_secondary_colonies.207.d:0 "飓风同时袭击数岛。富港不愿为遥远聚落承担费用，但联盟若在灾难中袖手旁观便名存实亡。"
 jxp_secondary_colonies.207.a:0 "动用盟库实施共同救援"
 jxp_secondary_colonies.207.b:0 "允许各岛自行处置漂流物"
 jxp_secondary_colonies.208.t:0 "谁拥有大洋"
 jxp_secondary_colonies.208.d:0 "日本使节仍把群岛视作跨洋航路的中继站。诸岛代表则坚持，大洋首先是这里居民的家园。"
 jxp_secondary_colonies.208.a:0 "缔结平等航路盟约"
 jxp_secondary_colonies.208.b:0 "宣示诸岛与海域同权"
