l_english:
 jxp_shinshu.1.t:0 "莲如的御文章"
 jxp_shinshu.1.d:0 "法主的书信以日常语言解释信心与念佛，并沿商路传入新的讲。"
 jxp_shinshu.1.a:0 "派遣抄写人，先稳固教义"
 jxp_shinshu.1.b:0 "让各讲自行传抄"
 jxp_shinshu.2.t:0 "吉崎坊舍"
 jxp_shinshu.2.d:0 "吉崎的坊舍吸引北陆门徒，也让领主担忧一个不受守护控制的新中心。"
 jxp_shinshu.2.a:0 "出资修筑并登记坊舍"
 jxp_shinshu.2.b:0 "依靠门徒自筹"
 jxp_shinshu.3.t:0 "门徒讲的扩张"
 jxp_shinshu.3.d:0 "讲把信仰、互助和地方议事结合起来，其网络已经越过一国边界。"
 jxp_shinshu.3.a:0 "承认讲长并建立名册"
 jxp_shinshu.3.b:0 "鼓励讲众自行组织"
 jxp_shinshu.4.t:0 "寺内町市场"
 jxp_shinshu.4.d:0 "围绕坊舍形成的寺内町要求市场特权与安全保证。"
 jxp_shinshu.4.a:0 "颁给有期限的市场朱印"
 jxp_shinshu.4.b:0 "由町众承担防务与税收"
 jxp_shinshu.5.t:0 "惣村与年贡"
 jxp_shinshu.5.d:0 "惣村愿意按共同体分摊年贡，但拒绝层层加派。"
 jxp_shinshu.5.a:0 "接受惣村的集体契约"
 jxp_shinshu.5.b:0 "坚持逐户征收"
 jxp_shinshu.6.t:0 "共同粮仓"
 jxp_shinshu.6.d:0 "门徒与村众提议建立粮仓，在歉收时赈济信众。"
 jxp_shinshu.6.a:0 "国主与讲众共同出资"
 jxp_shinshu.6.b:0 "允许讲众独自经营"
 jxp_shinshu.7.t:0 "本愿寺坊官"
 jxp_shinshu.7.d:0 "坊官希望把分散的末寺、讲与寺内町纳入统一文书网络。"
 jxp_shinshu.7.a:0 "让坊官接受国法审计"
 jxp_shinshu.7.b:0 "授权坊官整顿门徒"
 jxp_shinshu.8.t:0 "加贺门徒的政治要求"
 jxp_shinshu.8.d:0 "加贺门徒要求在守护裁判和年贡安排中拥有正式席位。"
 jxp_shinshu.8.a:0 "召开守护、国人与门徒会议"
 jxp_shinshu.8.b:0 "以法主权威支持请愿"
 jxp_shinshu.9.t:0 "三河一向一揆"
 jxp_shinshu.9.d:0 "三河门徒拒绝检地与军役，地方武士也被卷入冲突。"
 jxp_shinshu.9.a:0 "由寺社奉行调停"
 jxp_shinshu.9.b:0 "动员忠实门徒自卫"
 jxp_shinshu.10.t:0 "长岛轮中与防御"
 jxp_shinshu.10.d:0 "长岛的堤防、河道和轮中聚落既抵御洪水，也构成难攻的共同防线。"
 jxp_shinshu.10.a:0 "把防务纳入国主军役"
 jxp_shinshu.10.b:0 "保持民政优先"
 jxp_shinshu.11.t:0 "石山本愿寺"
 jxp_shinshu.11.d:0 "石山的地势与商路足以承载一座宏伟坊舍，也足以成为长期围攻的焦点。"
 jxp_shinshu.11.a:0 "建设城塞化坊舍"
 jxp_shinshu.11.b:0 "建设开放的讲学与市场中心"
 jxp_shinshu.12.t:0 "杂贺铁炮众"
 jxp_shinshu.12.d:0 "纪伊的门徒与地侍愿以铁炮守卫寺内町，但他们坚持保留地方议事权。"
 jxp_shinshu.12.a:0 "签订有期限的防卫契约"
 jxp_shinshu.12.b:0 "优先维持町众自治"
 jxp_shinshu.13.t:0 "参诣道路"
 jxp_shinshu.13.d:0 "朝圣道路带来旅人、工匠和布施，也使教义传播更快。"
 jxp_shinshu.13.a:0 "修路并设公共宿坊"
 jxp_shinshu.13.b:0 "交给沿路讲众维护"
 jxp_shinshu.14.t:0 "寺院印刷"
 jxp_shinshu.14.d:0 "木版印刷能让御文章与劝化文本迅速流通，也会削弱坊官对解释权的控制。"
 jxp_shinshu.14.a:0 "刊行经过校定的版本"
 jxp_shinshu.14.b:0 "允许地方讲众自行刊刻"
 jxp_shinshu.15.t:0 "法主与地方讲众"
 jxp_shinshu.15.d:0 "地方讲众认为坊官不了解村社负担，法主则担心网络分裂。"
 jxp_shinshu.15.a:0 "让双方在惣门公议中申辩"
 jxp_shinshu.15.b:0 "确认法主最终裁断权"
 jxp_shinshu.16.t:0 "和平信仰还是武装动员"
 jxp_shinshu.16.d:0 "外敌逼近时，门徒争论念佛共同体是否应承担常备军役。"
 jxp_shinshu.16.a:0 "限制武装，只守寺内町"
 jxp_shinshu.16.b:0 "敲响战钟，全面动员"
 jxp_shinshu.17.t:0 "大名要求寺领检地"
 jxp_shinshu.17.d:0 "领主要求把寺领纳入检地，而末寺担心赈济与布施土地被征收。"
 jxp_shinshu.17.a:0 "由寺社奉行联合丈量"
 jxp_shinshu.17.b:0 "强制执行统一检地"
 jxp_shinshu.18.t:0 "町众要求自治"
 jxp_shinshu.18.d:0 "寺内町的商人与工匠要求自行选举年寄并审理市场纠纷。"
 jxp_shinshu.18.a:0 "批准受监督的町法"
 jxp_shinshu.18.b:0 "派奉行接管市场"
 jxp_shinshu.19.t:0 "门徒拒绝外征"
 jxp_shinshu.19.d:0 "门徒认为战钟只应用于保卫讲众，不应为远方领土扩张而敲响。"
 jxp_shinshu.19.a:0 "承诺限制外征军役"
 jxp_shinshu.19.b:0 "坚持国主拥有征发权"
 jxp_shinshu.20.t:0 "本愿寺继承与派系"
 jxp_shinshu.20.d:0 "新法主继承使坊官、亲族与地方讲众重新争夺网络的方向。"
 jxp_shinshu.20.a:0 "召开公开继承会议"
 jxp_shinshu.20.b:0 "由内廷坊官迅速裁定"
 jodo_shinshu:0 "净土真宗"
 jodo_shinshu_religion_desc:0 "净土真宗以阿弥陀佛本愿、念佛与信心为中心。亲鸾奠立的教团经莲如的御文章、讲与坊舍扩展，并在寺内町、惣村和本愿寺网络中形成多样的社会组织；日常门徒共同体并不等同于武装一揆。"
 jodo_shinshu_rebels_demand:0 "承认$RELIGION$"
 jodo_shinshu_rebels_demand_desc:0 "这些门徒要求停止强迫改宗，并承认净土真宗共同体的信仰空间。"
 jodo_shinshu_rebels_title:0 "净土真宗门徒"
 jodo_shinshu_rebels_name:0 "$RELIGION$门徒"
 jodo_shinshu_rebels_desc:0 "受压迫的讲众和门徒可能结成宗教反抗，但净土真宗省份并不会自动成为武装一揆。"
 jodo_shinshu_rebels_army:0 "$RELIGION$门徒军"
 jxp_a_shinshu_peaceful_congregations:0 "和平讲众"
 jxp_a_shinshu_peaceful_congregations_desc:0 "讲众以互助、施济和日常念佛为重，社会稳定而军事动员有限。"
 jxp_a_shinshu_temple_town_community:0 "寺内町共同体"
 jxp_a_shinshu_temple_town_community_desc:0 "讲、惣村、坊舍和市场在自治与国法之间形成平衡。"
 jxp_a_shinshu_armed_followers:0 "武装门徒"
 jxp_a_shinshu_armed_followers_desc:0 "战钟能够迅速动员门徒并固守坊舍，但会损害税收、服从与对外信誉。"
 jxp_a_shinshu_petition_compromise:0 "德政请愿的调停"
 jxp_a_shinshu_temple_town_charter:0 "寺内町特许"
 jxp_a_shinshu_armed_oath:0 "武装起请"
 jxp_a_shinshu_reconciled_order:0 "国法保障的和议"
 jxp_a_shinshu_reconciled_order_desc:0 "寺内町、惣村与门徒组织获得有限保障，同时接受国法审计与共同军役。"
 jxp_a_shinshu_suppression_aftershock:0 "镇压后的余波"
 jxp_a_shinshu_suppression_aftershock_desc:0 "武装组织已经解体，但强制检地与寺领处置仍在地方留下不满。"
 jxp_a_ijp_hoshu_state:0 "法主国家"
 jxp_a_ijp_somon_council:0 "惣门公议"
 jxp_a_ijp_secular_commonwealth:0 "世俗共同体"
 jxp_a_95_decision_hoshu_state_title:0 "确立法主国家"
 jxp_a_95_decision_hoshu_state_desc:0 "让法主、坊官与本愿寺网络成为共同体国家的中枢。"
 jxp_a_95_decision_somon_council_title:0 "召开惣门公议"
 jxp_a_95_decision_somon_council_desc:0 "把寺内町、惣村、町众与讲众代表纳入常设议事。"
 jxp_a_95_decision_secular_commonwealth_title:0 "建立世俗共同体"
 jxp_a_95_decision_secular_commonwealth_desc:0 "保留净土真宗国教，同时解除法主与武装门徒的政治垄断。"
 jxp_a_shinshu_terminal_exclusive_tt:0 "这将固定一项互斥的共同体终局，并清理其他终局与一向危机状态。"
 jxp_a_shinshu_militancy_rises_5_tt:0 "门徒武装化提高§R5§!。"
 jxp_a_shinshu_militancy_rises_10_tt:0 "门徒武装化提高§R10§!。"
 jxp_a_shinshu_militancy_falls_5_tt:0 "门徒武装化降低§G5§!。"
 jxp_a_shinshu_militancy_falls_10_tt:0 "门徒武装化降低§G10§!。"
 jxp_shinshu.100.t:0 "讲众增长"
 jxp_shinshu.100.d:0 "越来越多的讲把念佛、互助与地方议事联系起来。一向危机已经进入第一阶段。"
 jxp_shinshu.100.a:0 "记录讲长并承认日常信仰"
 jxp_shinshu.100.b:0 "先观察这些新讲"
 jxp_shinshu.101.t:0 "德政、税役与寺领请愿"
 jxp_shinshu.101.d:0 "门徒要求减轻加派、确认寺领并限制军役，一向危机进入第二阶段。"
 jxp_shinshu.101.a:0 "由寺社奉行调停"
 jxp_shinshu.101.b:0 "拒绝集体请愿"
 jxp_shinshu.102.t:0 "寺内町自治"
 jxp_shinshu.102.d:0 "坊舍周围的町众要求市场、警备和裁判自治，一向危机进入第三阶段。"
 jxp_shinshu.102.a:0 "颁给受监督的町法"
 jxp_shinshu.102.b:0 "把寺内町纳入检地"
 jxp_shinshu.103.t:0 "武装起请"
 jxp_shinshu.103.d:0 "门徒在佛前立誓并敲响战钟，一向危机进入第四阶段。"
 jxp_shinshu.103.a:0 "以和议约束战钟"
 jxp_shinshu.103.b:0 "认可共同防卫"
 jxp_shinshu.104.t:0 "大规模一揆与政权抉择"
 jxp_shinshu.104.d:0 "国主、法主、坊官、町众与惣村必须决定共同体的最终秩序。"
 jxp_shinshu.104.a:0 "达成受国法保障的和议"
 jxp_shinshu.104.b:0 "镇压武装组织"
 jxp_shinshu.104.c:0 "让共同体接管政权"
