 jxp_colonial_society.101.t:0 "海外出生者的学舍"
 jxp_colonial_society.101.d:0 "第一批在此地出生的孩子已经到了入学之年。他们听得懂父母故乡的言语，也熟悉港外村社的道路与风俗。教师们请求编写一部兼收两地故事、律令与地理的课本；本土派奉行则坚持学舍只能照抄宗主国的课程。"
 jxp_colonial_society.101.a:0 "让他们从两片土地的故事中识字。"
 jxp_colonial_society.101.b:0 "课本必须由本土学官核定。"

 jxp_colonial_society.102.t:0 "回航船票"
 jxp_colonial_society.102.d:0 "远航契约届满后，一批老水手与工匠要求公费送他们返回日本；另一些人已经在此成家，愿意把回航钱改作宅地和码头的股份。究竟把海外看作轮换任所，还是可以传给子孙的家园，将由这次拨款显露端倪。"
 jxp_colonial_society.102.a:0 "为愿归者安排体面的回航。"
 jxp_colonial_society.102.b:0 "把船票折作永久定居的本钱。"

 jxp_colonial_society.103.t:0 "混合家庭的户籍"
 jxp_colonial_society.103.d:0 "通事、船员与当地家庭之间的婚姻早已越过最初的商馆围墙。如今他们的子女要求继承土地、加入行会并在法庭作证。若继续把这些家庭记在附册，殖民地的法律终将与生活本身相背。"
 jxp_colonial_society.103.a:0 "将混合家庭编入共同公民户籍。"
 jxp_colonial_society.103.b:0 "维持本土人与当地人的分册。"

 jxp_colonial_society.104.t:0 "双语公牍"
 jxp_colonial_society.104.d:0 "港口诉讼常因译词不同而迁延数月。通事与当地书吏提出并列书写两种文字，让税单、地契和判词都能由双方核读；奉行衙门担心这会使本土法令失去唯一解释。"
 jxp_colonial_society.104.a:0 "令公牍并列两种文字。"
 jxp_colonial_society.104.b:0 "官府只承认宗主国的文书。"

 jxp_colonial_society.105.t:0 "两种岁时"
 jxp_colonial_society.105.d:0 "春祭、盂兰盆与当地庆典在同一条街上接连举行。青年人希望把彼此的乐舞和食物编入共同节期，老移民却担心故乡的岁时会在海风中失去原貌。"
 jxp_colonial_society.105.a:0 "让港町共同庆祝两地的节日。"
 jxp_colonial_society.105.b:0 "官定节期仍以本土历例为准。"

 jxp_colonial_society.106.t:0 "生于此地的同业"
 jxp_colonial_society.106.d:0 "本地出生的木匠、船匠和账房已经足以自成行会。他们要求承包公共工程，不再由每一班新到的本土商人垄断差事。移民头人则声称，只有与宗主商社保持密切往来的人才值得信任。"
 jxp_colonial_society.106.a:0 "准许本地出生者成立同业。"
 jxp_colonial_society.106.b:0 "官差仍优先交给新到移民。"

 jxp_colonial_society.107.t:0 "殖民地报章"
 jxp_colonial_society.107.d:0 "一座小印刷所开始刊载船期、粮价、议会辩论和来自日本的消息。报章让相隔遥远的聚落第一次讨论同一件事，也让总管的失误难以遮掩。衙门要求所有版样在付印前送审。"
 jxp_colonial_society.107.a:0 "允许报章公开议论地方事务。"
 jxp_colonial_society.107.b:0 "每一期都须先盖奉行印。"

 jxp_colonial_society.108.t:0 "土地条约"
 jxp_colonial_society.108.d:0 "聚落准备沿河扩展，而河岸村社拿出了早年商馆签署的许可书：泊船和设仓并不等同于永久占地。双方长老愿意重新勘定租金、渔场与通行权，军役开拓者却主张既成田亩应归持刀者所有。"
 jxp_colonial_society.108.a:0 "赔偿旧有权利并重订土地条约。"
 jxp_colonial_society.108.b:0 "确认开拓者对既成田亩的占有。"

 jxp_colonial_society.109.t:0 "山川界标"
 jxp_colonial_society.109.d:0 "同一片林地在日本式检地册和当地村社口传中有两套边界。若由双方见证人共同踏查，界标或能长久有效；若由军屯测量队径直划线，登记会快得多，却可能把季节牧场和圣地切在界外。"
 jxp_colonial_society.109.a:0 "让双方见证人共同踏查。"
 jxp_colonial_society.109.b:0 "由军屯测量队迅速定界。"

 jxp_colonial_society.110.t:0 "共同市场"
 jxp_colonial_society.110.d:0 "港外农户带来粮食、木材与药草，町内商人则出售铁器、布匹和远洋货物。双方请求取消隔离市日，设立一座受共同规约保护的市场；商社希望保留只准持朱印者交易的内场。"
 jxp_colonial_society.110.a:0 "设立由双方行会共管的市场。"
 jxp_colonial_society.110.b:0 "把厚利留在敕许商场之内。"

 jxp_colonial_society.111.t:0 "共同防御"
 jxp_colonial_society.111.d:0 "海盗与敌对远征队逼近海湾。当地村社熟悉潮汐和山径，移民民兵拥有火器与堡垒；若把两者编成共同守备，战后他们也必将要求平等议事。军屯武士则愿独自承担防务，以保留指挥权。"
 jxp_colonial_society.111.a:0 "以共同誓约编成海湾守备。"
 jxp_colonial_society.111.b:0 "武器与指挥权只归军屯。"

 jxp_colonial_society.112.t:0 "被逐的村落"
 jxp_colonial_society.112.d:0 "新渠开成后，数个被迫迁离的村落在总管门前搭起草棚。他们不要求殖民地撤走，只要求返还墓地、补偿果园，并在新水道中保留份额。开拓头人警告，承认旧案会动摇许多已经颁出的地契。"
 jxp_colonial_society.112.a:0 "设立返地与赔偿委员会。"
 jxp_colonial_society.112.b:0 "维护所有已经颁出的地契。"

 jxp_colonial_society.113.t:0 "劳役簿"
 jxp_colonial_society.113.d:0 "道路、码头与堡垒需要劳力，但旧章只写着含混的“协助开拓”。村社代表要求把工日、报酬和免役人群写入共同劳役簿；承包商则希望继续按户强征，以免工程停顿。"
 jxp_colonial_society.113.a:0 "以工钱和定额重订劳役簿。"
 jxp_colonial_society.113.b:0 "维持按户征发的旧例。"

 jxp_colonial_society.114.t:0 "地方席位"
 jxp_colonial_society.114.d:0 "港町长老、当地村社与混合家庭共同递交请愿，要求在土地、税收和治安议事中各有固定席位。他们愿意承担公共费用，却不再接受只能在门外等候传唤的地位。"
 jxp_colonial_society.114.a:0 "让地方代表带着表决权入席。"
 jxp_colonial_society.114.b:0 "可以陈情，但裁断仍归奉行。"

 jxp_colonial_society.115.t:0 "稻种与灌渠"
 jxp_colonial_society.115.d:0 "日本农户带来的水稻在旱季枯萎，当地耕作者的耐旱作物却能越过炎热月份；与此同时，移民修筑的引水木闸也令村社惊叹。双方愿交换种子、渠法和轮作经验，商社则想把新技术圈作自己的产业秘密。"
 jxp_colonial_society.115.a:0 "让两种农法在田间彼此改良。"
 jxp_colonial_society.115.b:0 "把试验成果登记为商社专用。"

 jxp_colonial_society.116.t:0 "同街异堂"
 jxp_colonial_society.116.d:0 "寺院、教堂、清真礼拜所、神社与当地圣所沿着同一条港街建立。各教团愿意共用水井、学舍和避难仓，却要求彼此不得借官兵拆毁祭坛。总管担心这种并立会削弱宗主国教门的威仪。"
 jxp_colonial_society.116.a:0 "以共同街约保护各处礼拜。"
 jxp_colonial_society.116.b:0 "公共土地只授予受认可的教门。"

 jxp_colonial_society.117.t:0 "旧俗的保护"
 jxp_colonial_society.117.d:0 "当地长老请求把祖灵地、葬礼和季节仪式写入土地条约。他们愿服从港法、缴纳市税，也愿协助救助海难者，只是不肯让旧俗由陌生的审查官裁断。"
 jxp_colonial_society.117.a:0 "在条约中明定旧俗不受侵扰。"
 jxp_colonial_society.117.b:0 "所有仪式都须接受宗主教门审查。"

 jxp_colonial_society.118.t:0 "神职任命权"
 jxp_colonial_society.118.d:0 "海外教团已经能够自行培养僧侣、牧者、阿訇或神职。会众希望从本地推举熟悉语言的人，再请宗主教门确认；本土高阶神职坚持，任命权不可随海程遥远而旁落。"
 jxp_colonial_society.118.a:0 "准许会众推举，再由上级确认。"
 jxp_colonial_society.118.b:0 "所有神职仍从本土派遣。"

 jxp_colonial_society.119.t:0 "混合礼仪"
 jxp_colonial_society.119.d:0 "婚礼中同时出现本土誓词与当地赠礼，葬仪也把两种歌谣编在一处。许多家庭认为这不是背弃信仰，而是让共同生活有了自己的表达；严格派则要求立即统一礼式。"
 jxp_colonial_society.119.a:0 "承认不违背根本教义的混合礼仪。"
 jxp_colonial_society.119.b:0 "依本土仪轨逐项整顿。"

 jxp_colonial_society.120.t:0 "饥年义仓"
 jxp_colonial_society.120.d:0 "风灾毁坏收成，各教团都打开了自己的仓门，却有人因信仰和出身被拒之门外。町众建议把捐粮汇入共同义仓，由寺院、教会、清真团体和村社轮值发放。"
 jxp_colonial_society.120.a:0 "设立不问出身的共同义仓。"
 jxp_colonial_society.120.b:0 "由各教团先救济自己的信众。"

 jxp_colonial_society.121.t:0 "改宗队伍"
 jxp_colonial_society.121.d:0 "一批热心神职带着官差前往内地，要求村社接受宗主国信仰后才能继续使用市场和水渠。商人、通事与温和神职警告，胁迫会把数十年建立的信任化为仇恨。"
 jxp_colonial_society.121.a:0 "让官差为改宗队伍开路。"
 jxp_colonial_society.121.b:0 "禁止以税、土地和武力胁迫改宗。"

 jxp_colonial_society.122.t:0 "共同历日"
 jxp_colonial_society.122.d:0 "港口同时使用航海历、本土历与当地农时，误工和争执由此不断。书吏提出一份并列节期、潮汐和耕作节点的共同历日；保守派则希望所有公共仪式严格追随宗主国。"
 jxp_colonial_society.122.a:0 "刊行兼容航海与地方农时的历日。"
 jxp_colonial_society.122.b:0 "公共岁时必须与本土一致。"

 jxp_colonial_society.123.t:0 "商社垄断"
 jxp_colonial_society.123.d:0 "敕许商社要求独占远洋货物，以稳定船期并按时向宗主缴纳份额。小商人和当地行会反驳说，垄断压低了收购价，也把殖民地的命运绑在少数账房手中。"
 jxp_colonial_society.123.a:0 "以垄断换取稳定上缴。"
 jxp_colonial_society.123.b:0 "向合格的本地商人开放执照。"

 jxp_colonial_society.124.t:0 "走私船与港役"
 jxp_colonial_society.124.d:0 "夜潮中卸货的小船有本地渔民，也有日本船头。港役主张联合行会清点仓单，以赦免旧案换取今后纳税；自由港商人则要求承认小额私贸本就是边远港市的生计。"
 jxp_colonial_society.124.a:0 "与码头行会合办缉私和登记。"
 jxp_colonial_society.124.b:0 "赦免小额私贸并降低港口检查。"

 jxp_colonial_society.125.t:0 "港口税簿"
 jxp_colonial_society.125.d:0 "总管、商社与港町各自留有一套税簿，数字从来不能相合。町众愿意派账房参与公开核算，使每一笔港税都能查到用途；承包人则提议一次缴清定额，余下收入不再过问。"
 jxp_colonial_society.125.a:0 "建立由官府与町众共同核读的税簿。"
 jxp_colonial_society.125.b:0 "把港税包给出价最高的商人。"

 jxp_colonial_society.126.t:0 "海外银票"
 jxp_colonial_society.126.d:0 "长途运银既危险又迟缓，港商开始用可在数座港口兑付的票据结算。让本地信用扎根会使殖民经济更独立；坚持把白银按季送回日本，则能牢牢维持宗主财政的脐带。"
 jxp_colonial_society.126.a:0 "承认由多港商人共同担保的银票。"
 jxp_colonial_society.126.b:0 "贵金属必须按季汇回本土。"

 jxp_colonial_society.127.t:0 "商社债务"
 jxp_colonial_society.127.d:0 "连续两次失船令敕许商社濒临破产。宗主国可以注资并清查旧账，也可以让本地债权人以债换股；后者能保住船队，却会让港市的财富拥有自己的政治声音。"
 jxp_colonial_society.127.a:0 "由官府注资并重整账目。"
 jxp_colonial_society.127.b:0 "让本地债权人接掌股份。"

 jxp_colonial_society.128.t:0 "总管账房"
 jxp_colonial_society.128.d:0 "失踪的关税被追到总管亲信经营的仓库。公开调查会损伤官府体面，却能证明法庭并非只惩罚小民；掩护总管可以迅速收回一部分银钱，也会让地方社会认定权力可以买断罪责。"
 jxp_colonial_society.128.a:0 "公开审理总管及其亲信。"
 jxp_colonial_society.128.b:0 "追回银钱，案卷就此封存。"

 jxp_colonial_society.129.t:0 "疫病封港"
 jxp_colonial_society.129.d:0 "一艘远洋船上出现不明热病。医师和当地药师共同请求设检疫岛、补偿停航者并公开病例；船主则担心错过季风会让整个港口破产。"
 jxp_colonial_society.129.a:0 "由医师、药师与港役共组检疫所。"
 jxp_colonial_society.129.b:0 "检查船员后维持港口开放。"

 jxp_colonial_society.130.t:0 "聚落议会"
 jxp_colonial_society.130.d:0 "原本只讨论水井和道路的聚落会议，如今开始审议预算、民兵和税率。本地出生者、当地代表与商人都把它视为共同生活的中枢；总管认为这座议会正在越过敕许状赋予的边界。"
 jxp_colonial_society.130.a:0 "承认议会对地方预算的权限。"
 jxp_colonial_society.130.b:0 "解散未经宗主批准的常设会议。"

 jxp_colonial_society.131.t:0 "总管之印"
 jxp_colonial_society.131.d:0 "上一任总管病逝于漫长海程之中。地方议会推举了一位熟悉港法与多种语言的候选人，希望由宗主确认；本土奉行则已经为自己的家臣准备了任命书。"
 jxp_colonial_society.131.a:0 "确认地方推举的人选。"
 jxp_colonial_society.131.b:0 "总管只能由本土直接任命。"

 jxp_colonial_society.132.t:0 "无席位之税"
 jxp_colonial_society.132.d:0 "宗主要求加征舰队与堡垒费用，纳税人却指出他们既不能查阅预算，也无权决定兵力部署。地方代表愿意接受一项有期限的税，只要能够在议事中拥有席位。"
 jxp_colonial_society.132.a:0 "以代表席位换取定期军费。"
 jxp_colonial_society.132.b:0 "海外防务是臣民应尽的义务。"

 jxp_colonial_society.133.t:0 "民兵指挥"
 jxp_colonial_society.133.d:0 "殖民民兵由日本浪人、当地猎手、混合家庭与港口工匠组成。他们要求从熟悉地形者中推举下级军官，再向总管宣誓；军屯武士坚持所有指挥都应由本土俸禄人担任。"
 jxp_colonial_society.133.a:0 "允许各队推举军官并共同宣誓。"
 jxp_colonial_society.133.b:0 "把军权集中在任命武士手中。"

 jxp_colonial_society.134.t:0 "请愿书与印刷所"
 jxp_colonial_society.134.d:0 "关于土地、税收和神职任命的请愿书被印成数百份，在各港之间流传。公开争论可能尖锐，却也让不满进入文字和会议；若先行查禁，批评者便会转入码头与酒馆的密谈。"
 jxp_colonial_society.134.a:0 "接受联署，并公开答复其条款。"
 jxp_colonial_society.134.b:0 "印刷政治请愿必须领取许可。"

 jxp_colonial_society.135.t:0 "商人席"
 jxp_colonial_society.135.d:0 "资助船队的几家商号要求在议事中拥有永久席位，声称风险与贡献理应得到发言权。小商人、工匠和村社代表则警告，殖民地不能变成一座由债券统治的会所。"
 jxp_colonial_society.135.a:0 "以固定商人席换取稳定资财。"
 jxp_colonial_society.135.b:0 "把席位分给町众、村社与小商人。"

 jxp_colonial_society.136.t:0 "海外约法"
 jxp_colonial_society.136.d:0 "散见于敕许状、港法、土地条约和会众誓纸中的权利已经彼此冲突。各方代表请求汇编一部海外约法，列明宗主、总管、议会、教团与当地社会的权限。宗主官员则希望保留可以随时解释和收回的模糊条款。"
 jxp_colonial_society.136.a:0 "召集各方，把共同权利写成约法。"
 jxp_colonial_society.136.b:0 "宗主的保留权不得写死。"

 jxp_b_93_identity_school:0 "海外共同学舍"
 jxp_b_93_identity_school_desc:0 "本地出生者在同一课堂中学习两地的语言、律例与历史。"
 jxp_b_93_return_passage:0 "有序回航"
 jxp_b_93_return_passage_desc:0 "届满移民可以返乡，轮换船期也因此更加稳定。"
 jxp_b_93_equal_households:0 "同籍家庭"
 jxp_b_93_equal_households_desc:0 "混合家庭获得继承、作证与加入行会的共同资格。"
 jxp_b_93_bilingual_offices:0 "双语官署"
 jxp_b_93_bilingual_offices_desc:0 "通事与当地书吏共同核读税单、地契和判词。"
 jxp_b_93_shared_festivals:0 "共同岁时"
 jxp_b_93_shared_festivals_desc:0 "两地节日沿港街相继举行，逐渐成为共同生活的记忆。"
 jxp_b_93_settlers_guild:0 "本地同业"
 jxp_b_93_settlers_guild_desc:0 "本地出生的工匠与账房能够承接公共工程和商事。"
 jxp_b_93_colonial_gazette:0 "殖民地报章"
 jxp_b_93_colonial_gazette_desc:0 "船期、粮价和公共辩论被定期印行，连接起分散聚落。"
 jxp_b_93_land_treaty:0 "重订土地条约"
 jxp_b_93_land_treaty_desc:0 "旧有许可、渔场与通行权经赔偿和共同见证重新确认。"
 jxp_b_93_surveyed_boundaries:0 "共同勘界"
 jxp_b_93_surveyed_boundaries_desc:0 "测量者与地方见证人一同踏查山川、林地和村界。"
 jxp_b_93_common_market:0 "共同市场"
 jxp_b_93_common_market_desc:0 "港町行会与当地商贩依共同规约交换粮食、工具与远洋货物。"
 jxp_b_93_joint_defense:0 "海湾共同守备"
 jxp_b_93_joint_defense_desc:0 "熟悉地形的地方队伍与拥有火器的移民民兵协同防御。"
 jxp_b_93_restitution_commission:0 "返地与赔偿委员会"
 jxp_b_93_restitution_commission_desc:0 "被逐村落的墓地、果园与水权得到逐案清理。"
 jxp_b_93_labor_compact:0 "成文劳役簿"
 jxp_b_93_labor_compact_desc:0 "公共工程的工日、报酬与免役资格都有明确记录。"
 jxp_b_93_representative_council:0 "地方代表入席"
 jxp_b_93_representative_council_desc:0 "港町、村社与混合家庭能够参与土地、税收和治安议事。"
 jxp_b_93_exchanged_husbandry:0 "互授农法"
 jxp_b_93_exchanged_husbandry_desc:0 "移民与当地耕作者交换种子、渠法和季节经验。"
 jxp_b_93_joint_sanctuaries:0 "同街礼拜公约"
 jxp_b_93_joint_sanctuaries_desc:0 "不同教团共用学舍、水井和避难仓，并承诺不侵扰彼此圣所。"
 jxp_b_93_protected_rites:0 "旧俗保护条款"
 jxp_b_93_protected_rites_desc:0 "地方信仰、葬礼与祖灵地受到成文条约保障。"
 jxp_b_93_clerical_concordat:0 "地方神职协约"
 jxp_b_93_clerical_concordat_desc:0 "会众推举熟悉语言的神职，再由上级教门确认。"
 jxp_b_93_mixed_liturgy:0 "混合礼仪"
 jxp_b_93_mixed_liturgy_desc:0 "两地的誓词、赠礼与歌谣在共同生活中形成新的仪式。"
 jxp_b_93_relief_granaries:0 "共同义仓"
 jxp_b_93_relief_granaries_desc:0 "各教团与村社轮值发粮，救济不再以出身划界。"
 jxp_b_93_confessional_campaign:0 "官护改宗"
 jxp_b_93_confessional_campaign_desc:0 "官差为热心神职开路，宗主教门扩张的同时也激起不安。"
 jxp_b_93_common_calendar:0 "港市共同历日"
 jxp_b_93_common_calendar_desc:0 "航海潮汐、本土节期与地方农时被编入同一历书。"
 jxp_b_93_charter_monopoly:0 "敕许商社垄断"
 jxp_b_93_charter_monopoly_desc:0 "少数商社以稳定船期和上缴为代价，控制远洋货物。"
 jxp_b_93_customs_watch:0 "行会协同缉私"
 jxp_b_93_customs_watch_desc:0 "港役与码头行会共同核验仓单和夜间卸货。"
 jxp_b_93_port_ledger:0 "公开港税簿"
 jxp_b_93_port_ledger_desc:0 "官府与町众账房共同核读港口税收及其用途。"
 jxp_b_93_silver_credit:0 "多港银票"
 jxp_b_93_silver_credit_desc:0 "由多座港市商人共同担保的票据减少了远洋运银风险。"
 jxp_b_93_company_restructuring:0 "商社重整"
 jxp_b_93_company_restructuring_desc:0 "官府注资、核销坏账并暂时收紧高风险远洋交易。"
 jxp_b_93_clean_governorship:0 "清廉总管衙门"
 jxp_b_93_clean_governorship_desc:0 "公开审理权贵侵吞使港税账目重新获得信任。"
 jxp_b_93_quarantine_board:0 "联合检疫所"
 jxp_b_93_quarantine_board_desc:0 "医师、当地药师与港役共同隔离病船并补偿停航者。"
 jxp_b_93_assembly_session:0 "常设聚落议会"
 jxp_b_93_assembly_session_desc:0 "地方代表得以持续审议预算、道路、民兵和税率。"
 jxp_b_93_governor_commission:0 "地方推举总管"
 jxp_b_93_governor_commission_desc:0 "熟悉港法与多种语言的地方候选人获得宗主确认。"
 jxp_b_93_represented_revenue:0 "有代表的军费"
 jxp_b_93_represented_revenue_desc:0 "纳税代表能够核读预算并参与决定防务用途。"
 jxp_b_93_local_militia:0 "地方民兵军官"
 jxp_b_93_local_militia_desc:0 "各队推举熟悉地形的军官，再向共同当局宣誓。"
 jxp_b_93_petition_press:0 "公开请愿"
 jxp_b_93_petition_press_desc:0 "土地、税收和任命争议通过联署、印刷与公开答复进入议事。"
 jxp_b_93_merchant_council:0 "永久商人席"
 jxp_b_93_merchant_council_desc:0 "资助船队的大商号以资本换取稳定的议事席位。"
 jxp_b_93_written_charter:0 "海外约法"
 jxp_b_93_written_charter_desc:0 "宗主、总管、议会、教团与地方社会的权限被汇编为共同法度。"
