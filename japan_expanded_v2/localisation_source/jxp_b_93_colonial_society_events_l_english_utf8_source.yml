 jxp_b_93_society_event_recess:0 "殖民社会议事间歇"
 jxp_b_93_society_event_recess_desc:0 "上一轮关于人口、土地、信仰、贸易或代表权的争议尚在落实，新的总议题不会立即接踵而来。"
