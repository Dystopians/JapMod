l_english:
 jxp_continue_shinto_incident_records_title:0 "续修神祇事变录"
 jxp_continue_shinto_incident_records_desc:0 "改奉儒学并不意味着抹去神国旧事。礼官可从尚未结案的神祇、町人、海防与异国诸案中择取一卷，依新礼制续修其始末。"
 jxp_continue_shinto_incident_records_tt:0 "触发下一条满足条件且尚未完成的神道遗绪事件链。"
 jxp_confucian_incident_review_recent:0 "神祇事变录修纂中"
 jxp_confucian_incident_review_recent_desc:0 "礼官正在整理刚刚续修的神道旧案；下一卷须待本轮校勘告一段落。"
 confucianism_center_of_reformation:0 "儒学教化中心"
 jxp_confucian_firearms_registry:0 "铁炮匠籍"
 jxp_confucian_firearms_registry_desc:0 "国友、堺与根来诸匠依样制铳，奉行则录其师承、炉场与交付之数。"
 jxp_confucian_standard_calibers:0 "定装药之法"
 jxp_confucian_standard_calibers_desc:0 "铳身、弹丸与药包皆按官样制造，诸队操练遂有成法。"
 jxp_confucian_guarded_arsenals:0 "封识诸藏"
 jxp_confucian_guarded_arsenals_desc:0 "诸藩火器皆须登记封识，非奉行朱印不得移出兵库。"
 jxp_confucian_rites_supervision:0 "礼官察教"
 jxp_confucian_rites_supervision_desc:0 "异国僧侣的讲说须经通词译录，再由礼官辨其可容与不可容者。"
 jxp_confucian_registered_churches:0 "教会名籍"
 jxp_confucian_registered_churches_desc:0 "奉行将信众、会堂与慈善院编入名籍，使其在法度之内存续。"
 jxp_confucian_proscribed_missions:0 "禁教高札"
 jxp_confucian_proscribed_missions_desc:0 "高札立于道路与港町，严禁私传异说，责成五人组互相稽察。"
 jxp_confucian_domain_memorials:0 "诸侯奉书"
 jxp_confucian_domain_memorials_desc:0 "诸侯以奉书陈政，朝廷与幕府按名分裁答，地方之议由此汇入中枢。"
 jxp_confucian_court_domain_compact:0 "公武定议"
 jxp_confucian_court_domain_compact_desc:0 "禁里定其名，武家行其实，诸藩守其分；三者共成天下之法。"
 jxp_confucian_royal_rescripts:0 "王命宣布"
 jxp_confucian_royal_rescripts_desc:0 "诏书由京都颁行诸国，国主奉读而后施政，以明政出一统。"
 jxp_confucian_temple_land_register:0 "寺领检注"
 jxp_confucian_temple_land_register_desc:0 "寺领、门徒与兵粮皆载于册，讲和与征发从此有所凭据。"
 jxp_confucian_registered_congregations:0 "门徒乡约"
 jxp_confucian_registered_congregations_desc:0 "门徒依乡约自守，寺院代官向奉行具结，不复轻聚兵众。"
 jxp_confucian_suppressed_leagues:0 "破却惣村盟约"
 jxp_confucian_suppressed_leagues_desc:0 "寺内町之垒被撤，兵具入库，地方武士奉命监视旧日盟众。"
 jxp_confucian_licensed_sea_guard:0 "朱印海防众"
 jxp_confucian_licensed_sea_guard_desc:0 "熟悉潮汐与岛路的海众领受朱印，缉盗、护商并为国家引水。"
 jxp_confucian_coastal_patrols:0 "沿海巡检"
 jxp_confucian_coastal_patrols_desc:0 "巡检船按季更番，港簿、烽火与海图由诸国共同校验。"
 jxp_confucian_closed_coast_edict:0 "海岸肃清令"
 jxp_confucian_closed_coast_edict_desc:0 "无印船只不得下海，私港与隐澳皆由奉行封查。"

 jxp_confucian_incident.1.t:0 "铁炮入礼"
 jxp_confucian_incident.1.d:0 "种子岛传来的铁炮早已不是异国奇物。国友与堺的炉火昼夜不息，诸侯争聘名匠，乡兵亦学会列队放铳。讲官说器可制而人心不可纵；奉行则请定匠籍、官样与兵库之法，使雷火亦服从名分。"
 jxp_confucian_incident.1.a:0 "收诸匠于作事奉行。"
 jxp_confucian_incident.1.b:0 "许诸藩自铸，以战阵验其成色。"
 jxp_confucian_incident.2.t:0 "铳声遍于诸国"
 jxp_confucian_incident.2.d:0 "数年之间，火绳、弹丸与药包已有一定之式。有人请统一口径与操典，以便天下调发；也有人忧官样流出，将使乡兵与海贼同得利器。铁炮既已遍国，禁绝不如善制。"
 jxp_confucian_incident.2.a:0 "颁定装药、轮射与校阅之法。"
 jxp_confucian_incident.2.b:0 "封识兵库，严察火器流转。"

 jxp_confucian_incident.10.t:0 "天主之教与圣贤之礼"
 jxp_confucian_incident.10.d:0 "伴天连以天主之名讲说灵魂与救赎，又以医药、学校和贫院济人。港町民众多有趋附，社家忧其毁神，讲官则争论此说究竟可纳入祭礼秩序，还是会另立一座不奉王命的天下。"
 jxp_confucian_incident.10.a:0 "令通词译其书，礼官察其行。"
 jxp_confucian_incident.10.b:0 "先禁私会，勿使异说潜滋。"
 jxp_confucian_incident.11.t:0 "十字架下的名籍"
 jxp_confucian_incident.11.d:0 "稽察之后，官府已知会堂、信众与传教者所在。宽容者说，入籍则可治，绝之反使其潜伏；严禁者说，名分不可有二，若容其自立教门，终将动摇社稷。"
 jxp_confucian_incident.11.a:0 "许其登记存续，不得越礼犯禁。"
 jxp_confucian_incident.11.b:0 "立禁教高札，逐其传教之人。"

 jxp_confucian_incident.20.t:0 "公武名分之辩"
 jxp_confucian_incident.20.d:0 "新礼制尊王而不废武家，然而诏命、奉书与藩政之间仍多龃龉。诸侯问：政令究竟出自禁里，还是出自执掌兵马之府？讲官答曰，名与器不可偏废，正名之后方可责实。"
 jxp_confucian_incident.20.a:0 "使诸侯奉书，由公武合议裁答。"
 jxp_confucian_incident.20.b:0 "尊王命为纲，使武家奉行其事。"
 jxp_confucian_incident.21.t:0 "天下之政出于一"
 jxp_confucian_incident.21.d:0 "反复议定之后，朝廷、执政府与诸藩的文书格式终于相互衔接。古人云：名不正，则言不顺。如今每一道命令皆知其所自，每一位诸侯亦知其所守。"
 jxp_confucian_incident.21.a:0 "公武并立，诸藩奉法。"
 jxp_confucian_incident.21.b:0 "王命为本，百司承流。"

 jxp_confucian_incident.30.t:0 "门徒与寺内町"
 jxp_confucian_incident.30.d:0 "净土真宗门徒仍在北陆、近畿与三河结成讲众。寺内町有仓、有钟、有武具，也有济贫与乡约。奉行担心其复成国中之国，地方父老却说，若尽毁其讲，饥年里谁来开仓？"
 jxp_confucian_incident.30.a:0 "检注寺领，使讲众入籍。"
 jxp_confucian_incident.30.b:0 "承认其乡约，以教化换取兵具。"
 jxp_confucian_incident.31.t:0 "钟声之后"
 jxp_confucian_incident.31.d:0 "寺钟再响时，聚来的不再只是披甲门徒，也有奉行与里正。旧日盟约可以被改写为乡约，也可以被刀兵彻底破却。两条路都能得一时之静，却会留下不同的天下。"
 jxp_confucian_incident.31.a:0 "存其讲而禁其兵。"
 jxp_confucian_incident.31.b:0 "撤其垒，散其众。"

 jxp_confucian_incident.40.t:0 "海上之民"
 jxp_confucian_incident.40.d:0 "九州、对马与濑户内海的船主往往既商且盗。官府称其倭寇，沿海诸村却赖其引水、护航与贩运。若尽数讨灭，海路将无人可用；若授以朱印，又恐盗名转为官名。"
 jxp_confucian_incident.40.a:0 "授可信海众以朱印，责其缉盗护商。"
 jxp_confucian_incident.40.b:0 "封私港，禁无印船下海。"
 jxp_confucian_incident.41.t:0 "海防成规"
 jxp_confucian_incident.41.d:0 "数载之后，岛路、烽火与港簿渐成一体。海众可以成为国家的水军与引航者，也可以被逐出港湾，让沿岸在严密巡检下归于寂静。海不曾闭，闭合的只是人所立之门。"
 jxp_confucian_incident.41.a:0 "编海众为巡检与水军。"
 jxp_confucian_incident.41.b:0 "申明海禁，以岸防守国。"
