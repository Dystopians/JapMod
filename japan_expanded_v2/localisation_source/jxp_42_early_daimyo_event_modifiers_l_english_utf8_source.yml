l_english:
 jxp_42_oda_teppo_muster:0 "尾张铁炮调练"
 jxp_42_oda_teppo_muster_desc:0 "铁炮匠、足轻番队与城下仓屋被织田家臣重新编排。火器不再只是奇物，而是尾张军役的尖声。"
 jxp_42_oda_court_notice:0 "禁里闻名"
 jxp_42_oda_court_notice_desc:0 "尾张之名被送入京都文书与传闻。新兴武家若能被旧礼看见，便多一层可用的名分。"
 jxp_42_tkg_fudai_oaths:0 "三河谱代誓纸"
 jxp_42_tkg_fudai_oaths_desc:0 "谱代家臣在神前重申旧誓，忍耐、勤谨与互保成为德川家中秩序的根。"
 jxp_42_tkg_prudent_petitions:0 "温顺请文"
 jxp_42_tkg_prudent_petitions_desc:0 "德川使者以谨慎措辞向京都与邻国递交请文。柔软的笔锋有时比急躁的刀锋更能保全家名。"
 jxp_42_tkd_cavalry_registers:0 "甲州马籍"
 jxp_42_tkd_cavalry_registers_desc:0 "马匹、骑手、矿山与山路补给被写入同一套军籍。武田骑阵因账册而更有秩序。"
 jxp_42_tkd_mountain_accounts:0 "山国金账"
 jxp_42_tkd_mountain_accounts_desc:0 "甲斐山中的金、米与堤防工役被细细清点。山国贫瘠，却可因账目明晰而聚成军资。"
 jxp_42_ues_echigo_muster:0 "越后义军"
 jxp_42_ues_echigo_muster_desc:0 "上杉以义名召集越后武士。雪路崎岖，军令却能因共同名分而抵达。"
 jxp_42_ues_justice_petition:0 "义名请文"
 jxp_42_ues_justice_petition_desc:0 "旧官途、寺社与京都礼法共同为上杉之义作证。义并非空言，也是一套可承认的秩序。"
 jxp_42_hjo_castle_net:0 "小田原支城网"
 jxp_42_hjo_castle_net_desc:0 "本城、支城、山城与海边砦彼此照应。北条的防线不是一堵墙，而是一张难以割裂的网。"
 jxp_42_hjo_cadastral_review:0 "关东检地评定"
 jxp_42_hjo_cadastral_review_desc:0 "村账、年贡与诉讼经由小田原评定众重新核看，使关东广土逐渐进入可治理的格式。"
 jxp_42_mri_setouchi_tides:0 "濑户内潮汐令"
 jxp_42_mri_setouchi_tides_desc:0 "岛屿、潮汐与水军头领被纳入毛利家法。熟悉海路者，方能在狭海中迫敌入险。"
 jxp_42_mri_kokujin_oaths:0 "安艺国人誓约"
 jxp_42_mri_kokujin_oaths_desc:0 "国人众以誓纸约束彼此，既保留地方根基，也将兵力汇入毛利旗帜之下。"
 jxp_42_smz_tanegashima_trials:0 "种子岛试铳"
 jxp_42_smz_tanegashima_trials_desc:0 "南海传来的铁炮在九州炉火中被拆解、仿制并改良。岛津将异物变成家中武器。"
 jxp_42_smz_ichimon_fire:0 "一门火候"
 jxp_42_smz_ichimon_fire_desc:0 "岛津一门众掌握火器与伏击之法。亲族若能共守火候，战阵便更难被外敌撼动。"
 jxp_42_otm_funai_quarter:0 "府内异人町"
 jxp_42_otm_funai_quarter_desc:0 "商人、译者与传教士被安置在可管可用的町区。异风若入账册，便可转为大友的力量。"
 jxp_42_otm_ritual_boundary:0 "丰后礼界"
 jxp_42_otm_ritual_boundary_desc:0 "朝仪旧礼为外来风俗划下边界，使大友既能开海门，又不至让家中秩序失语。"
 jxp_42_dte_oshu_warband:0 "奥州鹰书"
 jxp_42_dte_oshu_warband_desc:0 "猎场、马市、婚盟与边地习俗被伊达写入家中军政。远国之兵由此更快响应。"
 jxp_42_dte_distant_letters:0 "远国礼书"
 jxp_42_dte_distant_letters_desc:0 "伊达使者将奥州书信送往京都与邻国。边地若能言礼，便不只是边地。"
 jxp_42_ask_kuban_restoration:0 "公方御判再兴"
 jxp_42_ask_kuban_restoration_desc:0 "足利御判仍能唤起旧幕府名分。衰微之名若重新发声，仍足以调停诸侯。"
 jxp_42_ask_bakufu_ledgers:0 "幕府直辖账"
 jxp_42_ask_bakufu_ledgers_desc:0 "将军家重新整理直辖地、奉公众与守护责务，使残存幕府制度仍可支撑政务。"
 jxp_42_csk_ichiryo_muster:0 "一领具足军役"
 jxp_42_csk_ichiryo_muster_desc:0 "土佐乡士平时耕作，战时披甲。长宗我部由此在贫瘠山海间聚成兵力。"
 jxp_42_csk_urado_sails:0 "浦户帆影"
 jxp_42_csk_urado_sails_desc:0 "浦户湾内的船手熟悉潮流与岛影，足以护送兵粮并威胁海峡。"
 jxp_42_ouc_yamaguchi_rites:0 "山口礼法"
 jxp_42_ouc_yamaguchi_rites_desc:0 "大内以京都风仪装点西国，也以礼法、书札与贸易显示自身非寻常边镇。"
 jxp_42_ouc_tang_goods:0 "唐物商路"
 jxp_42_ouc_tang_goods_desc:0 "唐物、书籍、香料与远方文书进入山口账册，成为大内权威的可见形状。"
 jxp_42_img_kana_code:0 "假名目规式"
 jxp_42_img_kana_code_desc:0 "今川家法以通俗文字颁示诸臣，使国人和百姓都能知道边界所在。"
 jxp_42_img_tokaido_prestige:0 "东海道礼威"
 jxp_42_img_tokaido_prestige_desc:0 "海道诸国看重今川的旧名、礼仪与京都道路。东海道的声望本身就是一种武器。"
 jxp_42_soo_wakan_books:0 "倭馆账书"
 jxp_42_soo_wakan_books_desc:0 "釜山倭馆的货物、通事与船籍被宗氏整理成册，对马由此掌握窄门之利。"
 jxp_42_soo_channel_protocols:0 "海峡通交礼"
 jxp_42_soo_channel_protocols_desc:0 "宗氏在幕府、朝鲜与海商之间周旋，言辞须柔软，底线却不可轻移。"
 jxp_42_kinai_old_letters:0 "畿内旧家书札"
 jxp_42_kinai_old_letters_desc:0 "管领、守护与京都旧礼虽已褪色，仍能为畿内旧家提供调停与发言之凭。"
 jxp_42_kinai_domain_ledgers:0 "畿内代官账"
 jxp_42_kinai_domain_ledgers_desc:0 "小领国若能清点仓屋、代官与商路，便可在大国夹缝间保有余力。"
 jxp_42_western_sea_writs:0 "西国海路文书"
 jxp_42_western_sea_writs_desc:0 "狭海诸家以文书约束船主、港津与渡海商人，使细帆也能成为家政之力。"
 jxp_42_western_kin_compact:0 "西海亲族盟"
 jxp_42_western_kin_compact_desc:0 "亲族、岛屿与水军头领以誓纸互保，松散海边势力得以暂时合心。"
 jxp_42_eastern_kokujin_muster:0 "东国国人军役"
 jxp_42_eastern_kokujin_muster_desc:0 "关东小家仰赖国人众、神社与山野城砦。军役若能重列，东国兵力便更可依凭。"
 jxp_42_eastern_ritual_pacification:0 "东国礼法安抚"
 jxp_42_eastern_ritual_pacification_desc:0 "古社、旧族与关东礼仪被重新修复，地方武士得以看见共同名分。"
 jxp_42_northern_horse_roads:0 "北奥马市道"
 jxp_42_northern_horse_roads_desc:0 "雪路、马市与山地驿传连成北方军政的骨架。北奥诸家由此能在遥远边地调兵。"
 jxp_42_northern_sea_posts:0 "北海交易所"
 jxp_42_northern_sea_posts_desc:0 "马匹、毛皮、鱼货与虾夷地消息在海边交易所汇集，使边地贸易进入家中。"
 jxp_42_crossroads_petitions:0 "关路请文"
 jxp_42_crossroads_petitions_desc:0 "美浓、伊势、大和靠近京畿和神社旧仪。请文能为道路小国披上名分外衣。"
 jxp_42_crossroads_castle_roads:0 "关路城道"
 jxp_42_crossroads_castle_roads_desc:0 "守住山口、驿站与城下道路，小家也能在大国之间保留转圜余地。"
 jxp_42_kyushu_mountain_oaths:0 "九州山中誓纸"
 jxp_42_kyushu_mountain_oaths_desc:0 "日向、肥后与筑前山中诸众以誓纸归约，地方旧例暂时纳入家中军政。"
 jxp_42_kyushu_sea_books:0 "九州海边商书"
 jxp_42_kyushu_sea_books_desc:0 "港口商书带来货物、外闻与海上规矩，使九州小家不只仰望山城。"
 jxp_42_hokuriku_court_seats:0 "北陆旧席"
 jxp_42_hokuriku_court_seats_desc:0 "北陆旧家以奉公、礼法与文化声望保留席次，等待乱世的缝隙。"
 jxp_42_hokuriku_storehouse_books:0 "北陆仓账"
 jxp_42_hokuriku_storehouse_books_desc:0 "粮仓、商人和代官账簿被重新整理，小家财政因此更有余裕。"
