l_english:
 jxp_major_daimyo.1.t:0 "尾张鸣铳"
 jxp_major_daimyo.1.d:0 "尾张的市町与寺内町传来新式铁炮的回声。织田家臣中有人赞成把匠人、足轻与仓廪一并纳入军役，也有人主张先用京都的名分压住近邻的轻侮。火器尚未成为天下之器，却已经改变了家中说话的声音。"
 jxp_major_daimyo.1.a:0 "让铁炮为家中开路。"
 jxp_major_daimyo.1.b:0 "先让禁里听见尾张之名。"
 jxp_major_daimyo.2.t:0 "三河起请"
 jxp_major_daimyo.2.d:0 "三河的谱代与国人众在神前重申誓文。松平旧臣熟知忍耐，也熟知在夹缝中保全家名的技艺。若能把这些誓言整理成家法，德川家便可从旧日人质与盟约的阴影中生出稳固的根。"
 jxp_major_daimyo.2.a:0 "把谱代之心结成一门。"
 jxp_major_daimyo.2.b:0 "以温顺辞令换取名分。"
 jxp_major_daimyo.3.t:0 "甲斐马籍"
 jxp_major_daimyo.3.d:0 "甲斐山谷间的马匹、矿山与武士名簿被重新清点。武田家中诸将多以骑阵自负，但胜利并不只在冲锋一刻，亦在粮秣、道路与起请文能否按时抵达阵前。"
 jxp_major_daimyo.3.a:0 "让骑阵服从军法。"
 jxp_major_daimyo.3.b:0 "先把山国账册誊明。"
 jxp_major_daimyo.4.t:0 "越后义名"
 jxp_major_daimyo.4.d:0 "越后的雪路将使者、僧侣与国人众隔在漫长山岭之间。上杉家若要以义名号令诸郡，便须让城下、寺社与家臣席次皆有可循之礼。义不是空言，也是一套可被众人承认的秩序。"
 jxp_major_daimyo.4.a:0 "让城下町承载义名。"
 jxp_major_daimyo.4.b:0 "让京都旧仪为义名作证。"
 jxp_major_daimyo.5.t:0 "小田原惣构"
 jxp_major_daimyo.5.d:0 "相模平野的道路、宿场与町屋向小田原城汇聚。北条家臣议论的不只是石垣与堀切，而是如何让城下成为关东诸郡的腹心。守城之法若能化为治国之法，外敌便难以拆开这张网。"
 jxp_major_daimyo.5.a:0 "以城郭编织关东。"
 jxp_major_daimyo.5.b:0 "让账册先稳住诸郡。"
 jxp_major_daimyo.6.t:0 "濑户内水军"
 jxp_major_daimyo.6.d:0 "濑户内海的潮汐不只属于渔夫，也属于使船、商船与水军头领。毛利家若要在安艺之外说话，就必须让岛屿、渡口与舵手成为家中制度的一部分。"
 jxp_major_daimyo.6.a:0 "把潮汐写入家法。"
 jxp_major_daimyo.6.b:0 "先安抚岛屿众。"
 jxp_major_daimyo.7.t:0 "萨摩铁炮"
 jxp_major_daimyo.7.d:0 "南国海风把铁炮、硝石与异国传闻送到萨摩。岛津家臣知道，外来器物若只停在港町，便只是奇货；若能进入锻冶、军役与一门众的誓文，才会成为岛津之器。"
 jxp_major_daimyo.7.a:0 "让铁炮随南风入阵。"
 jxp_major_daimyo.7.b:0 "让一门众先掌住火候。"
 jxp_major_daimyo.8.t:0 "丰后异风"
 jxp_major_daimyo.8.d:0 "丰后港町里，商人、译者与远来僧侣带来陌生的词语和器物。大友家可以把这些来客纳入文书与礼遇，也可以先用禁里旧礼为外风划下界线。无论选择何路，海门已经传来新的声息。"
 jxp_major_daimyo.8.a:0 "让港町试读异风。"
 jxp_major_daimyo.8.b:0 "以朝仪约束来客。"
 jxp_major_daimyo.9.t:0 "奥州鹰书"
 jxp_major_daimyo.9.d:0 "奥州道路遥远，鹰狩、马市与婚盟常比京都书信更快抵达边郡。伊达家若要使北方诸族听命，就要把豪勇写成誓文，把边地习俗接入家中秩序。"
 jxp_major_daimyo.9.a:0 "让北方武名归于家中。"
 jxp_major_daimyo.9.b:0 "让远国也知礼仪。"
 jxp_major_daimyo.10.t:0 "公方御判"
 jxp_major_daimyo.10.d:0 "足利公方的御判仍能在诸侯文书中留下余响。纵使天下纷乱，名分并未完全失语。若能重新整理奉书、守护职与诸家席次，幕府残存的威望或许仍能化为一套可用的政治语言。"
 jxp_major_daimyo.10.a:0 "让御判重新发声。"
 jxp_major_daimyo.10.b:0 "先把诸家账目收束。"
 jxp_major_daimyo.11.t:0 "土佐一领具足"
 jxp_major_daimyo.11.d:0 "土佐山海之间，半农半兵的国人众背负一领具足来往于田垄与阵列。长宗我部家若能把这些乡士纳入誓文与军役，偏远海国也能生出坚韧的家中骨架。"
 jxp_major_daimyo.11.a:0 "让乡士成为家中骨架。"
 jxp_major_daimyo.11.b:0 "让浦户海风带来新路。"
 jxp_major_daimyo.12.t:0 "山口唐物"
 jxp_major_daimyo.12.d:0 "山口的馆舍里摆着唐物、书籍、香料与远方书信。大内家既能以京样礼仪装点西国，也能借港町商路触摸明国与南海。华美并非空耗，若能入册，便会成为权威的形状。"
 jxp_major_daimyo.12.a:0 "以山口礼法照耀西国。"
 jxp_major_daimyo.12.b:0 "让唐物商路说话。"
 jxp_major_daimyo.13.t:0 "骏河假名目"
 jxp_major_daimyo.13.d:0 "骏河、远江与三河之间的边界常被婚盟、质子与军势反复改写。今川家法若要压住海道诸郡，就必须把旧例、贡纳和武家礼仪写成众人都能援引的条文。"
 jxp_major_daimyo.13.a:0 "把海道旧例写成家法。"
 jxp_major_daimyo.13.b:0 "让礼仪替海道作证。"
