l_english:
 jxp_route_institution_secretariats:0 "国体枢机"
 jxp_route_institution_grand_design:0 "国家大策"
 jxp_reform_sakoku_fudai_inspectorate:0 "谱代目付制"
 jxp_reform_sakoku_fudai_inspectorate_desc:0 "将谱代重臣、巡见使与寺社奉行合为一体，使封国、港津与寺院账册皆入幕府之目。海道虽远，政令仍能抵达。"
 jxp_reform_sakoku_coastal_gun_commissions:0 "海防炮台奉行"
 jxp_reform_sakoku_coastal_gun_commissions_desc:0 "沿海诸浦修筑台场，铸炮、火药与船番由专职奉行统筹。海雾之中，异国船影先见于炮垒之前。"
 jxp_reform_sakoku_ancestral_domain_compact:0 "祖法藩屏之约"
 jxp_reform_sakoku_ancestral_domain_compact_desc:0 "重申武家诸法度，以祖宗旧章维系亲藩、谱代与外样之间的名分。诸侯仍有其地，天下则有其纲。"
 jxp_reform_sakoku_controlled_knowledge_corridor:0 "御用外学回廊"
 jxp_reform_sakoku_controlled_knowledge_corridor_desc:0 "外书、药方、测量术与炮术可经御用译馆流入，但不得越过幕府设置的闸门。此非开国，而是择其可用。"
 jxp_reform_open_red_seal_company_council:0 "朱印商社评议"
 jxp_reform_open_red_seal_company_council_desc:0 "赐商船朱印，召町众、船主与奉行为评议。远海航路不再只是冒险，而成为国家认可的财富之道。"
 jxp_reform_open_navy_contract_office:0 "御船手承包局"
 jxp_reform_open_navy_contract_office_desc:0 "以港町、船匠与藩库共同承包造船、修船与水夫征募。太平洋的风不等人，舰队也不应只靠临时征发。"
 jxp_reform_open_pacific_exchange_standard:0 "太平洋汇兑法"
 jxp_reform_open_pacific_exchange_standard_desc:0 "银、铜、米票与海外票据并行清算，长崎、堺与江户的账本连通诸海。商贾知其利，官府知其数。"
 jxp_reform_open_transoceanic_colony_board:0 "渡海殖民会所"
 jxp_reform_open_transoceanic_colony_board_desc:0 "将移民、船团、商馆与守备合为一局，令远岸据点不再只是孤悬木栅，而是通向新海疆的根。"
 jxp_reform_kirishitan_sun_cross_chancery:0 "日轮十字官房"
 jxp_reform_kirishitan_sun_cross_chancery_desc:0 "教会文书、王权诏令与港口账册同入官房。十字与日轮并悬，既为信仰之印，也为国家之玺。"
 jxp_reform_kirishitan_nagasaki_order_fleet:0 "长崎骑士舰队"
 jxp_reform_kirishitan_nagasaki_order_fleet_desc:0 "由归信武士、海商与修会庇护者组成的舰队守卫海门。祷声在甲板上响起，炮声在浪尖上回答。"
 jxp_reform_kirishitan_martyr_levy_estates:0 "殉教士军役庄"
 jxp_reform_kirishitan_martyr_levy_estates_desc:0 "承认忠信村社的军役与自治权，使曾被迫潜伏的信徒成为王国军役的核心。以血立誓者，亦以枪守国。"
 jxp_reform_kirishitan_roman_embassy_cabinet:0 "罗马使节内阁"
 jxp_reform_kirishitan_roman_embassy_cabinet_desc:0 "将天正遣欧少年使节的记忆制度化，令远西诸国、传教会与日本朝廷之间有常设的言路与礼仪。"
 jxp_reform_confucian_shinbutsu_harmonizers:0 "神儒调和博士"
 jxp_reform_confucian_shinbutsu_harmonizers_desc:0 "以朱子礼法整理神社缘起、祭祀名分与乡约礼仪。神明仍在社中，秩序则归于礼经。"
 jxp_reform_confucian_censorate_granaries:0 "御史常平仓"
 jxp_reform_confucian_censorate_granaries_desc:0 "仿宋明常平、社仓与风宪之制，以监察官校正仓廪、赋役与地方豪右。民有积谷，官有畏名。"
 jxp_reform_confucian_ritual_core_commission:0 "礼制版籍局"
 jxp_reform_confucian_ritual_core_commission_desc:0 "以礼部、户籍与寺社改编一体办理，名分既定，版图乃安。征服之地必须先成为可祭、可税、可教之地。"
 jxp_reform_confucian_tenka_school_network:0 "天下学校网"
 jxp_reform_confucian_tenka_school_network_desc:0 "府学、藩校、乡校与书院相互授受，训诂、兵法与算学并行不悖。读书声起处，政令亦能生根。"
 jxp_reform_imperial_jingikan_cabinet:0 "神祇官内阁"
 jxp_reform_imperial_jingikan_cabinet_desc:0 "复兴神祇官与太政官旧名，以祭政一体重塑朝廷权威。诏命不只在京都宣读，也在诸国社头回响。"
 jxp_reform_imperial_restoration_planning_board:0 "维新筹画局"
 jxp_reform_imperial_restoration_planning_board_desc:0 "将公卿、武士与新式官僚纳入筹画局，审定兵制、财制与学校制度。王政复古不是回头，而是借古开新。"
 jxp_reform_imperial_sacred_envoy_system:0 "敕使巡国制"
 jxp_reform_imperial_sacred_envoy_system_desc:0 "由敕使巡按诸国，宣诏、祭社、调停藩政。天皇之名不再仅在殿上，而随队仗行于山海之间。"
 jxp_reform_imperial_solar_guard_bureaus:0 "日章亲卫局"
 jxp_reform_imperial_solar_guard_bureaus_desc:0 "亲卫军不只是宫城守备，也是新国家的仪仗与锋刃。旗上日章照耀，军律与忠节同列。"
 jxp_reform_reformed_scripture_printing_office:0 "圣书印刷所"
 jxp_reform_reformed_scripture_printing_office_desc:0 "活字版、译经所与学校合署，令教义、法令与商约在同一张纸上流布。文字成为信仰与国家共同的工具。"
 jxp_reform_reformed_burgher_synod_chambers:0 "町众长老院"
 jxp_reform_reformed_burgher_synod_chambers_desc:0 "让港町富商、工匠行会与教会长老共同承担地方治理。市声与圣歌并不冲突，只要账册清明。"
 jxp_reform_reformed_civic_militia_covenant:0 "盟约市民军"
 jxp_reform_reformed_civic_militia_covenant_desc:0 "以城市盟约征召市民军，使信众、商人和武士在同一誓词下守城出阵。"
 jxp_reform_reformed_dutch_engineer_corps:0 "荷兰工兵团"
 jxp_reform_reformed_dutch_engineer_corps_desc:0 "聘用低地工匠与炮术教师，改良棱堡、铸炮与测量。海风带来异国书卷，也带来攻城之法。"
 jxp_reform_kaikyo_harbor_qadi_bureau:0 "港町卡迪局"
 jxp_reform_kaikyo_harbor_qadi_bureau_desc:0 "在港町设卡迪与町奉行并署，商事、婚约与海贸争讼各依其法而归于国法之下。"
 jxp_reform_kaikyo_monsoon_custom_house:0 "季风海关"
 jxp_reform_kaikyo_monsoon_custom_house_desc:0 "以季风航期编排税关、护航与仓储，使九州、琉球、马六甲与印度洋之间的贸易有法可循。"
 jxp_reform_kaikyo_pilgrim_embassy_network:0 "朝觐使节网"
 jxp_reform_kaikyo_pilgrim_embassy_network_desc:0 "保护朝觐与求学之路，令使节、学者和商团同享海上驿传。远方圣城也可成为外交之门。"
 jxp_reform_kaikyo_cannon_foundry_madrasas:0 "铸炮经学院"
 jxp_reform_kaikyo_cannon_foundry_madrasas_desc:0 "将经学、几何与铸炮术并置于学院。礼拜之后，学生量角、算重、校炮。"
 jxp_reform_ikko_somon_assembly_halls:0 "惣门众议堂"
 jxp_reform_ikko_somon_assembly_halls_desc:0 "以惣村、寺内町与门徒代表组成众议堂，处理地役、仓廪与军役。草鞋踏入堂前，也可发言于国政。"
 jxp_reform_ikko_monto_watch_bells:0 "门徒警钟制"
 jxp_reform_ikko_monto_watch_bells_desc:0 "寺钟既为法会而鸣，也为警戒而鸣。钟声传过堀与田畴，百姓与门徒便各执其役。"
 jxp_reform_ikko_public_granary_leagues:0 "公仓讲盟"
 jxp_reform_ikko_public_granary_leagues_desc:0 "寺院、町众与农村共同经营公仓，以讲盟互保荒年与战时供给。米仓之门开合，关系一国安危。"
 jxp_reform_ikko_equal_field_compact:0 "平田起请文"
 jxp_reform_ikko_equal_field_compact_desc:0 "以起请文约束土地、军役与贡纳，使门徒共同体在平等名义下承担国家责任。"
 jxp_reform_wokou_black_current_captains:0 "黑潮船头众"
 jxp_reform_wokou_black_current_captains_desc:0 "承认熟悉黑潮、礁线与暗港的船头众，以其经验编入国家舰队。海贼旧术，亦可为国用。"
 jxp_reform_wokou_island_broker_courts:0 "岛港牙行裁许所"
 jxp_reform_wokou_island_broker_courts_desc:0 "在岛屿港市设牙行法庭，调停走私、赎船、货契与番商争端。灰色海贸被引入官府账册。"
 jxp_reform_wokou_tidewater_admiralty_charters:0 "潮汐水师特许"
 jxp_reform_wokou_tidewater_admiralty_charters_desc:0 "以特许状约束水师、私掠与商船护航，使浪人之勇转化为可征可税的海权。"
 jxp_reform_wokou_red_seal_raiding_law:0 "朱印袭扰法"
 jxp_reform_wokou_red_seal_raiding_law_desc:0 "将袭扰敌商、截获船货与海上封锁纳入朱印许可之下。刀在鞘中亦有法度，船在浪上亦有国名。"
