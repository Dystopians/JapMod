l_english:
 jxp_decision_recall_preunification_edicts_title:0 "追录创业旧令"
 jxp_decision_recall_preunification_edicts_desc:0 "天下既定，旧日一国一城之法不可尽废。将创业时的军书、礼状、船籍与町法重加誊录，择其可行者入于天下制度，便能使开国之初的经验不随旧家臣老去而散佚。"

 jxp_preunification_memory.1.t:0 "安土旧令"
 jxp_preunification_memory.1.d:0 "织田家旧臣捧出尘封的朱印状、乐市乐座禁制与铁炮役账。昔日“天下布武”四字曾是战国檄文，如今却必须被翻译成可在诸国施行的成文法。"
 jxp_preunification_memory.1.a:0 "以安土法度整顿天下"
 jxp_preunification_memory.1.b:0 "保留乐市的自由风气"
 jxp_preunification_memory.2.t:0 "三河谱代之籍"
 jxp_preunification_memory.2.d:0 "三河旧臣以发黄的誓纸和军役册证明，忍耐、互保与家中秩序曾如何支撑弱小国人度过乱世。新朝若能理解这种谨慎，便能少用兵而多得人心。"
 jxp_preunification_memory.2.a:0 "将谱代誓纸编入家政"
 jxp_preunification_memory.2.b:0 "以街道与宿驿维系诸臣"
 jxp_preunification_memory.3.t:0 "甲州旗头"
 jxp_preunification_memory.3.d:0 "甲斐山国的马籍、金山账与旗头名簿仍保存完好。它们不只是武田旧闻，而是一套能把贫瘠山谷化为军资的纪律。"
 jxp_preunification_memory.3.a:0 "保留甲州军役册"
 jxp_preunification_memory.3.b:0 "整顿山国补给法"
 jxp_preunification_memory.4.t:0 "关东管领之请文"
 jxp_preunification_memory.4.d:0 "上杉家旧文书陈列于殿中，管领之名、义兵之辞与越后雪国的军令相互映照。所谓大义，若能被制度承认，便不只是诗句。"
 jxp_preunification_memory.4.a:0 "以义名约束诸将"
 jxp_preunification_memory.4.b:0 "重设管领裁断之席"
 jxp_preunification_memory.5.t:0 "小田原总构"
 jxp_preunification_memory.5.d:0 "北条旧吏呈上小田原总构的图籍：本城、支城、村账与海边砦台彼此照应。坚城不只在石垣，也在能将人丁田亩逐条写下的笔墨。"
 jxp_preunification_memory.5.a:0 "推广小田原检地格式"
 jxp_preunification_memory.5.b:0 "以支城网络护卫关东"
 jxp_preunification_memory.6.t:0 "濑户内水军之籍"
 jxp_preunification_memory.6.d:0 "毛利船头与国人众一同献上岛屿潮路、船役誓纸和关津账簿。善用狭海者，知天下之门未必只在陆上。"
 jxp_preunification_memory.6.a:0 "设立水军奉行"
 jxp_preunification_memory.6.b:0 "整顿濑户内关津"
 jxp_preunification_memory.7.t:0 "萨摩试铳"
 jxp_preunification_memory.7.d:0 "岛津旧匠仍记得南海异物初至种子岛的火光。铁炮、亲族军法与九州山海之险交织成一门苛烈而有用的学问。"
 jxp_preunification_memory.7.a:0 "以萨摩铳匠充实火器局"
 jxp_preunification_memory.7.b:0 "令一门众守火候之法"
 jxp_preunification_memory.8.t:0 "府内异人町"
 jxp_preunification_memory.8.d:0 "大友家旧账载有商人、译者、传教士与铳匠的姓名。异风曾使人疑惧，也曾带来书籍、火器与海商。取舍之间，正是新朝的器量。"
 jxp_preunification_memory.8.a:0 "保留府内町法"
 jxp_preunification_memory.8.b:0 "收编异国铳匠"
 jxp_preunification_memory.9.t:0 "奥州骑马武者"
 jxp_preunification_memory.9.d:0 "伊达旧臣呈上鹰书、马市约与北国边地的婚盟记录。远国之兵若只被视为边鄙，便会散落；若被纳入制度，便能成为新朝的前驱。"
 jxp_preunification_memory.9.a:0 "保留奥州骑马役"
 jxp_preunification_memory.9.b:0 "以远国礼书开外交通道"
 jxp_preunification_memory.10.t:0 "奉公众再录"
 jxp_preunification_memory.10.d:0 "足利旧幕府的奉公众名簿仍有可用之处。旧公方的威名或许已经褪色，但调停诸侯、辨析名分的技艺尚未全然无用。"
 jxp_preunification_memory.10.a:0 "重编奉公众秩序"
 jxp_preunification_memory.10.b:0 "恢复公方裁断先例"
 jxp_preunification_memory.11.t:0 "土佐一领具足"
 jxp_preunification_memory.11.d:0 "长宗我部旧令记录着乡士平时耕作、战时披甲的法度。贫瘠山海中形成的动员之术，若用于天下，亦足以补充常备军之不足。"
 jxp_preunification_memory.11.a:0 "编定一领具足名册"
 jxp_preunification_memory.11.b:0 "以浦户船役补给诸军"
 jxp_preunification_memory.12.t:0 "山口勘合"
 jxp_preunification_memory.12.d:0 "大内故府留有唐物清单、朝鲜通信文书与山口礼法。西国一隅曾以书籍、礼仪与远方货物装点自身，如今这些账册足可成为新朝的外交通道。"
 jxp_preunification_memory.12.a:0 "设勘合贸易局"
 jxp_preunification_memory.12.b:0 "以山口文雅补朝仪"
 jxp_preunification_memory.13.t:0 "东海道假名目"
 jxp_preunification_memory.13.d:0 "今川家法以假名写就，使武士、国人和百姓都能理解边界所在。明白的法，未必柔弱；它常常比含混的威严更能约束人心。"
 jxp_preunification_memory.13.a:0 "推广假名法度"
 jxp_preunification_memory.13.b:0 "保留东海道调停格式"
 jxp_preunification_memory.14.t:0 "倭馆通交"
 jxp_preunification_memory.14.d:0 "宗氏旧吏带来釜山倭馆账、译官名簿与海峡通交礼。对马所学不是大海的豪迈，而是在幕府、朝鲜与海商之间不失寸分的分寸。"
 jxp_preunification_memory.14.a:0 "设倭馆通事所"
 jxp_preunification_memory.14.b:0 "以海峡礼法约束诸港"
 jxp_preunification_memory.15.t:0 "一乘谷评定"
 jxp_preunification_memory.15.d:0 "朝仓旧臣呈上一乘谷的评定记录、连歌会帖与越前纸役簿。山城之中的文治并非闲雅装饰，而是旧家能在乱世保全名分的技艺。"
 jxp_preunification_memory.15.a:0 "保留一乘谷评定众"
 jxp_preunification_memory.15.b:0 "设越前纸与文书所"
 jxp_preunification_memory.16.t:0 "月山富田之账"
 jxp_preunification_memory.16.d:0 "尼子家旧册记录着月山富田的山城、出云矿山与国人众誓纸。深山旧城的石垣早已斑驳，账册却仍说明如何把山谷守成根基。"
 jxp_preunification_memory.16.a:0 "采用月山山城法"
 jxp_preunification_memory.16.b:0 "重核出云矿山账"
 jxp_preunification_memory.17.t:0 "堺会合"
 jxp_preunification_memory.17.d:0 "细川旧臣与堺商人共同献上会合记录。港市、管领名分与町众自治曾彼此牵制，也彼此成就；若能纳入新朝，商市便不只是钱箱。"
 jxp_preunification_memory.17.a:0 "设堺管领会合"
 jxp_preunification_memory.17.b:0 "用町众裁断商争"
 jxp_preunification_memory.18.t:0 "伊势请文"
 jxp_preunification_memory.18.d:0 "北畠旧文书将伊势神宫、国司家名分与熊野水军旧路联在一处。神国之门不只通向内廷，也通向风浪中的舟师。"
 jxp_preunification_memory.18.a:0 "以神宫礼法补朝仪"
 jxp_preunification_memory.18.b:0 "收编九鬼水先"
 jxp_preunification_memory.19.t:0 "虾夷地市口"
 jxp_preunification_memory.19.d:0 "秋田旧吏带来虾夷地交易约、北海船籍与边境守备名册。北方不是世界尽头，而是一处需要懂得等待、交换与警戒的门槛。"
 jxp_preunification_memory.19.a:0 "开虾夷地交易所"
 jxp_preunification_memory.19.b:0 "设北方守护役"
 jxp_preunification_memory.20.t:0 "陆奥九门"
 jxp_preunification_memory.20.d:0 "九户旧账写着陆奥山口、城栅和谷仓。北国风雪能使军令迟滞，也能使谨慎的守备者获得天然屏障。"
 jxp_preunification_memory.20.a:0 "设陆奥关门守"
 jxp_preunification_memory.20.b:0 "修盛冈谷仓法"
 jxp_preunification_memory.21.t:0 "若江誓纸"
 jxp_preunification_memory.21.d:0 "畠山旧臣呈上若江城下的誓纸、佣兵契书与纪伊铁炮众往来记录。旧管领家已多风波，但在分裂中维系家名的术法，仍可被新朝吸纳。"
 jxp_preunification_memory.21.a:0 "整理若江家臣誓纸"
 jxp_preunification_memory.21.b:0 "收录杂贺铁炮契书"
 jxp_preunification_memory.22.t:0 "姬路账册"
 jxp_preunification_memory.22.d:0 "池田家旧账将姬路城修造、播磨年贡与濑户内粮运一并记下。城郭若只有石垣，仍不足以立国；要有账册，方能使石垣长久。"
 jxp_preunification_memory.22.a:0 "采用姬路会计法"
 jxp_preunification_memory.22.b:0 "保存濑户内转运账"
 jxp_preunification_memory.23.t:0 "金泽文物"
 jxp_preunification_memory.23.d:0 "前田旧臣陈列金泽仓账、茶会记、能乐传书与工匠名簿。富国不只是米石之数，亦在于愿以文艺驯服武家的耐心。"
 jxp_preunification_memory.23.a:0 "以金泽仓法入官"
 jxp_preunification_memory.23.b:0 "延续茶与能的家风"
 jxp_preunification_memory.24.t:0 "武卫旧名"
 jxp_preunification_memory.24.d:0 "斯波家旧籍仍称武卫之名。名分残破，却能证明旧族如何凭官途、道路和军役在北陆维持一线秩序。"
 jxp_preunification_memory.24.a:0 "重录武卫军政所"
 jxp_preunification_memory.24.b:0 "修北陆道路旧法"
 jxp_preunification_memory.25.t:0 "六分一殿"
 jxp_preunification_memory.25.d:0 "山名旧谱以“六分一殿”自称，载有但马、因幡与山阴诸国的分封与军役。盛名已成往事，分散诸家的调停术却并非毫无用处。"
 jxp_preunification_memory.25.a:0 "保存六分一分封账"
 jxp_preunification_memory.25.b:0 "重编西军盟誓"
 jxp_preunification_memory.26.t:0 "播州城路"
 jxp_preunification_memory.26.d:0 "赤松旧臣献上播磨诸城、赤松家臣誓纸与山阳道路图。山城与街道互为骨骼，只有知道何处可守，何处可行，国才不会散。"
 jxp_preunification_memory.26.a:0 "修播州城路"
 jxp_preunification_memory.26.b:0 "誊录赤松誓纸"
 jxp_preunification_memory.27.t:0 "阿苏火祭"
 jxp_preunification_memory.27.d:0 "菊池旧册将阿苏火祭、肥后忠义文书与山社神领并置。火山与神社的威仪能安人心，忠义旧卷亦能约束武士。"
 jxp_preunification_memory.27.a:0 "以阿苏火祭入礼"
 jxp_preunification_memory.27.b:0 "保存菊池忠义卷"
 jxp_preunification_memory.28.t:0 "鹿岛军役"
 jxp_preunification_memory.28.d:0 "佐竹旧臣携鹿岛社誓纸、常陆军役册与铁炮名簿入见。坂东之兵素称强悍，但若有社誓约束，强悍便可转为法度。"
 jxp_preunification_memory.28.a:0 "重编鹿岛军役"
 jxp_preunification_memory.28.b:0 "保留常陆誓约"
 jxp_preunification_memory.29.t:0 "美浓水工"
 jxp_preunification_memory.29.d:0 "土岐旧账多写河工、水田、纸役和馆阁往来。美浓不只出刀兵，也出能使水患化为田亩的匠法。"
 jxp_preunification_memory.29.a:0 "推广美浓水工"
 jxp_preunification_memory.29.b:0 "设土岐纸役所"
 jxp_preunification_memory.30.t:0 "日光关守"
 jxp_preunification_memory.30.d:0 "宇都宫旧籍将日光山、下野军役与坂东交通一并保存。神山之路若无人守望，朝仪也会在边地失声。"
 jxp_preunification_memory.30.a:0 "设日光关守"
 jxp_preunification_memory.30.b:0 "整下野军役"
 jxp_preunification_memory.31.t:0 "大宰府通事"
 jxp_preunification_memory.31.d:0 "少贰旧臣仍握有大宰府往来文书、九州港商账与朝鲜使船记。西门之地不应只归军法，也应归礼文与通事。"
 jxp_preunification_memory.31.a:0 "设大宰府通事局"
 jxp_preunification_memory.31.b:0 "修九州贡使账"
 jxp_preunification_memory.32.t:0 "诹访马师"
 jxp_preunification_memory.32.d:0 "小笠原旧册将诹访马师、弓马礼法与信浓关口列为一体。马术既是武艺，也是通行山国的语言。"
 jxp_preunification_memory.32.a:0 "收录诹访马师"
 jxp_preunification_memory.32.b:0 "设信浓关口守"
 jxp_preunification_memory.33.t:0 "香取誓约"
 jxp_preunification_memory.33.d:0 "千叶旧臣献上香取社誓约、下总军役与通往坂东诸家的礼路。社前之誓若入官书，地方武士便较少以私怨行事。"
 jxp_preunification_memory.33.a:0 "重录香取军役"
 jxp_preunification_memory.33.b:0 "整下总礼路"
 jxp_preunification_memory.34.t:0 "丹后港守"
 jxp_preunification_memory.34.d:0 "一色旧籍列出丹后港守、若狭往来和守护家法。海边旧族的衰落未必说明其制度无用，只说明制度需要更大的屋宇。"
 jxp_preunification_memory.34.a:0 "设丹后港守"
 jxp_preunification_memory.34.b:0 "保存守护家法"
 jxp_preunification_memory.35.t:0 "日向城栅"
 jxp_preunification_memory.35.d:0 "伊东旧册记录日向诸城、神社寺院盟约与南九州山路。边境诸城不必只作拒敌之垣，也可成为安抚山海的钉子。"
 jxp_preunification_memory.35.a:0 "编入日向城栅"
 jxp_preunification_memory.35.b:0 "重订社寺盟约"
 jxp_preunification_memory.36.t:0 "伊予水先"
 jxp_preunification_memory.36.d:0 "河野旧吏献上濑户内水先名簿、伊予港法与船头誓纸。熟潮之人，知浅濑与暗流；新朝若善用之，海门自会多一层眼目。"
 jxp_preunification_memory.36.a:0 "设濑户内水先役"
 jxp_preunification_memory.36.b:0 "修伊予港法"
 jxp_preunification_memory.37.t:0 "大和寺社契"
 jxp_preunification_memory.37.d:0 "筒井旧籍将兴福寺、国人城下町与大和寺社契约并列。僧兵与国人曾相互牵制，如今可转为一套约束寺社与町场的成法。"
 jxp_preunification_memory.37.a:0 "整理大和寺社契"
 jxp_preunification_memory.37.b:0 "修兴福寺城下町法"

 jxp_43_oda_azuchi_edicts_memory:0 "安土法度追录"
 jxp_43_oda_azuchi_edicts_memory_desc:0 "织田旧令被誊入新朝法籍，开拓、征税与城下秩序皆从战国火中得来。"
 jxp_43_oda_market_law_memory:0 "乐市遗法"
 jxp_43_oda_market_law_memory_desc:0 "乐市乐座的记忆被保存下来，商贾仍可在新制度下寻得余地。"
 jxp_43_tkg_fudai_cadasters_memory:0 "谱代检地账"
 jxp_43_tkg_fudai_cadasters_memory_desc:0 "三河谱代的誓纸与村账被编入家政，诸臣各安其分。"
 jxp_43_tkg_road_oaths_memory:0 "街道誓约"
 jxp_43_tkg_road_oaths_memory_desc:0 "宿驿、街道与谱代誓纸互相支撑，使远近诸臣皆知归路。"
 jxp_43_tkd_koshu_muster_memory:0 "甲州旗头册"
 jxp_43_tkd_koshu_muster_memory_desc:0 "甲州旧军籍被纳入新军制，骑马武者仍以山国纪律为荣。"
 jxp_43_tkd_mountain_supply_memory:0 "山国补给法"
 jxp_43_tkd_mountain_supply_memory_desc:0 "金山、谷仓与山路砦台一并入账，贫国旧术成为全国军需。"
 jxp_43_ues_righteous_petitions_memory:0 "义名请文"
 jxp_43_ues_righteous_petitions_memory_desc:0 "上杉旧请文被保存于官库，诸将仍须在大义之前自省。"
 jxp_43_ues_kanrei_arbiter_memory:0 "管领裁断席"
 jxp_43_ues_kanrei_arbiter_memory_desc:0 "旧管领名分化为新朝调停格式，使礼法与军威并行。"
 jxp_43_hjo_odawara_cadasters_memory:0 "小田原村账"
 jxp_43_hjo_odawara_cadasters_memory_desc:0 "北条检地格式被推广到新领，村落、年贡和诉讼皆可追查。"
 jxp_43_hjo_sogamae_barriers_memory:0 "总构支城网"
 jxp_43_hjo_sogamae_barriers_memory_desc:0 "小田原总构之术被改作关东防务制度，支城如网，动静相闻。"
 jxp_43_mri_suigun_admiralty_memory:0 "濑户内水军奉行"
 jxp_43_mri_suigun_admiralty_memory_desc:0 "毛利水军旧籍成为海军奉行的根本，潮路与船役皆入官书。"
 jxp_43_mri_setouchi_toll_memory:0 "濑户内关津账"
 jxp_43_mri_setouchi_toll_memory_desc:0 "关津、岛港和海商税册被重新核定，狭海成为可治理的道路。"
 jxp_43_smz_satsuma_foundries_memory:0 "萨摩火器局"
 jxp_43_smz_satsuma_foundries_memory_desc:0 "岛津铳匠与试射法被收编，南海火光照进新朝军库。"
 jxp_43_smz_ichimon_fire_memory:0 "一门火候法"
