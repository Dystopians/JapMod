l_english:
 jxp_keian_ronin_crisis:0 "庆安浪人危机"
 jxp_keian_ronin_crisis_desc:0 "太平之世裁撤了无数家臣，却没有为持刀之人安排新的生计。江户、骏府与上方流传着密约；若幕府的军费与威信同时动摇，失所浪人便可能把怨望写成讨幕檄文。"
 jxp_tenmei_famine:0 "天明饥馑"
 jxp_tenmei_famine_desc:0 "连年的歉收已经耗尽村仓，借粮与移粟又拖垮了藩库。饥民涌向城下，米价与流言一同上涨；只有持续的赈济和恢复生产，才能使天下重新有粮可食。"

 jxp_disasters.1.t:0 "庆安密约"
 jxp_disasters.1.d:0 "江户的军学塾、骏府的旅宿与京都的长屋之间，出现了相互呼应的浪人书札。他们宣称太平只惠及有禄之人，并以救济牢人为名谋划举事。阴谋尚未成熟，但驱散一处聚会无法消除遍布天下的失所武士。"
 jxp_disasters.1.a:0 "登记技艺，为浪人安排仕官与公役。"
 jxp_disasters.1.b:0 "封锁关津，严查军学塾与旅宿。"
 jxp_disasters.2.t:0 "天明无禾"
 jxp_disasters.2.d:0 "北国送来的稻穗空瘪，江户米市的牌价却日日改写。村落典尽农具，流民沿驿路南下；若国家仍把赈济视作一时施舍，这场饥馑就会变成遍及诸国的动荡。"
 jxp_disasters.2.a:0 "开常平仓，并从各藩调运救济粮。"
 jxp_disasters.2.b:0 "实行配给，优先维持城町与军粮。"

 jxp_kirishitan.11.t:0 "岛原善后"
 jxp_kirishitan.11.d:0 "一年以来的封锁、谈判与赈济终于使火势退去。如今必须确定善后原则：以国法震慑后来者，还是以减免与宽容缝合九州的伤口。"
 jxp_kirishitan.11.a:0 "整顿奉行所，以国法完成平定。"
 jxp_kirishitan.11.b:0 "减免旧欠，以和解完成善后。"
 jxp_ikko.9.t:0 "一揆的最终裁断"
 jxp_ikko.9.d:0 "经过一年的战守与交涉，寺内町愿意把誓纸送到议席，诸将也已掌握进军道路。天下可以容纳门徒旧约、强令其服从，或干脆承认一种新的门徒国秩序。"
 jxp_ikko.9.a:0 "承认寺内町自治，换取归顺。"
 jxp_ikko.9.b:0 "解除武装，使诸众复归国法。"
 jxp_ikko.9.c:0 "承认门徒国，改写天下之约。"

 jxp_decision_settle_shimabara_fire_title:0 "议定岛原善后"
 jxp_decision_settle_shimabara_fire_desc:0 "危机已经持续足够久，封锁或调停也开始见效。召集九州奉行与村町代表，为岛原之火作出最终裁断。"
 jxp_decision_settle_ikko_rising_title:0 "议定一揆之约"
 jxp_decision_settle_ikko_rising_desc:0 "寺内町与诸军都已承受一年的危机。现在可以召开最后评议，在调停、镇压与门徒国之间决定天下的答案。"
 jxp_decision_resolve_keian_ronin_crisis_title:0 "安置天下浪人"
 jxp_decision_resolve_keian_ronin_crisis_desc:0 "清查密约只是第一步。待局势稳定后，以仕官、公役与新的文治法度吸纳失所武士，才能真正终结浪人危机。"
 jxp_decision_resolve_tenmei_famine_title:0 "重建诸国粮仓"
 jxp_decision_resolve_tenmei_famine_desc:0 "赈济必须延续到村仓复储、军民恢复生产之时。整顿转运和常平仓，使饥馑不再因下一次歉收重燃。"

 jxp_keian_ronin_reemployment:0 "浪人仕官登记"
 jxp_keian_ronin_patrols:0 "庆安关津巡查"
 jxp_keian_civil_governance:0 "由武断转向文治"
 jxp_tenmei_relief_granaries:0 "天明赈济粮仓"
 jxp_tenmei_rationing:0 "天明配给法"
 jxp_tenmei_recovery:0 "饥馑后的复耕"
