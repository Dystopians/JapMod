 jxp_companies.102.t:0 "全国廻船会所募集本钱"
 jxp_companies.102.d:0 "章程草案已列明调度粮船、沿岸港津、价格书信与救难船，也承认海难、船主垄断、港口拒税与地方航路争夺。最后一项未决之事，是由谁主持董事评议并向国家呈报账目。"
 jxp_companies.202.t:0 "全国廻船会所章程届期"
