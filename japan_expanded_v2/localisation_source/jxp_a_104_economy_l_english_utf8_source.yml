 jxp_a_company_shipping_director_warrior_desc:0 "有力家臣主持护运与征发，军用便利而私兵之患随之而来。"
 jxp_companies.102.warrior:0 "武家主导"
 jxp_a_company_shipping_director_religious:0 "全国廻船会所：宗教组织主导"
 jxp_a_company_shipping_director_religious_desc:0 "寺社与宗门以信用、慈善和学寮入股，亦要求财产自治。"
