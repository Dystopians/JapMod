l_english:
 jxp_a_market_stage_1:0 "商市成网"
 jxp_a_market_stage_1_desc:0 "城下町、市庭、关津、港口与廻船已连成可持续的国内交换网络。"
 jxp_iface_a_market_stage_1:0 "商市成网"
 jxp_iface_a_market_stage_1_desc:0 "城下町、市庭、关津、港口与廻船已连成可持续的国内交换网络。"
 jxp_a_market_stage_1_rewarded:0 "商市成网一次性整顿已完成"
 jxp_a_market_stage_1_transition:0 "商市成网之整顿"
 jxp_a_market_stage_1_transition_desc:0 "新制度初行的十年内，奉行与各阶层正把“商市成网”落实为日常成例。"
 jxp_a_market_stage_2:0 "信用成制"
 jxp_a_market_stage_2_desc:0 "兑换、札券、仓单与公债开始由成文规则维持，不再只靠一地私约。"
 jxp_iface_a_market_stage_2:0 "信用成制"
 jxp_iface_a_market_stage_2_desc:0 "兑换、札券、仓单与公债开始由成文规则维持，不再只靠一地私约。"
 jxp_a_market_stage_2_rewarded:0 "信用成制一次性整顿已完成"
 jxp_a_market_stage_2_transition:0 "信用成制之整顿"
 jxp_a_market_stage_2_transition_desc:0 "新制度初行的十年内，奉行与各阶层正把“信用成制”落实为日常成例。"
 jxp_a_market_stage_3:0 "工场成业"
 jxp_a_market_stage_3_desc:0 "城乡工场、问屋包买、军需和造船形成有分工的原工业网络。"
 jxp_iface_a_market_stage_3:0 "工场成业"
 jxp_iface_a_market_stage_3_desc:0 "城乡工场、问屋包买、军需和造船形成有分工的原工业网络。"
 jxp_a_market_stage_3_rewarded:0 "工场成业一次性整顿已完成"
 jxp_a_market_stage_3_transition:0 "工场成业之整顿"
 jxp_a_market_stage_3_transition_desc:0 "新制度初行的十年内，奉行与各阶层正把“工场成业”落实为日常成例。"
 jxp_a_market_stage_4:0 "会社成国"
 jxp_a_market_stage_4_desc:0 "章程、董事、审计与国家持股把合本商号纳入国体，但公司亦会争夺政权。"
 jxp_iface_a_market_stage_4:0 "会社成国"
 jxp_iface_a_market_stage_4_desc:0 "章程、董事、审计与国家持股把合本商号纳入国体，但公司亦会争夺政权。"
 jxp_a_market_stage_4_rewarded:0 "会社成国一次性整顿已完成"
 jxp_a_market_stage_4_transition:0 "会社成国之整顿"
 jxp_a_market_stage_4_transition_desc:0 "新制度初行的十年内，奉行与各阶层正把“会社成国”落实为日常成例。"
 jxp_a_market_high_tenka_order:0 "天下一统之商法"
 jxp_a_market_high_tenka_order_desc:0 "统一法令使审计、关津与账簿更易推行，却也让异术与新知较难突破成例。"
 jxp_a_market_low_tenka_order:0 "群雄竞市"
 jxp_a_market_low_tenka_order_desc:0 "诸侯竞逐令商路更活跃，但彼此不相保信，借贷利息随之升高。"
 jxp_a_market_high_imperial_sanction:0 "敕许信用"
 jxp_a_market_high_imperial_sanction_desc:0 "朝廷裁可为公债与章程增信，维持公卿、使节和典礼却增加顾问开支。"
 jxp_a_market_low_imperial_sanction:0 "无敕之营造"
 jxp_a_market_low_imperial_sanction_desc:0 "地方工场少受朝仪拘束而更敢增产，国家名分与对外交涉却显得单薄。"
 jxp_a_market_high_oceanic_opening:0 "海门万商"
 jxp_a_market_high_oceanic_opening_desc:0 "海外知识与商路提高交易效率，异域依赖和宗教摩擦也进入本国社会。"
 jxp_a_market_low_oceanic_opening:0 "内海自给"
 jxp_a_market_low_oceanic_opening_desc:0 "受保护的国内工场维持稳产，却因闭塞而更难吸收海外制度与新知。"
 jxp_a_public_credit_instituted:0 "全国信用公仪"
 jxp_a_market_factory_network_complete:0 "全国工场网已成"
 jxp_a_advance_market_stage_1_title:0 "整顿市庭与关津"
 jxp_a_advance_market_stage_1_desc:0 "清点城下市庭、关津税则与廻船航路，使各地货物可依同一套凭据通行。"
 jxp_a_advance_market_stage_2_title:0 "建立兑换与信用成例"
 jxp_a_advance_market_stage_2_desc:0 "在札券、仓单与借贷之间建立兑付次第；此举要求稳定政局和真实财力，破产国家不可强行推进。"
 jxp_a_advance_market_stage_3_title:0 "编成全国工场网络"
 jxp_a_advance_market_stage_3_desc:0 "把工匠诸座、农村外包、军需和造船纳入分工网络。工场会带来产能，也会带来工资、原料与水利争端。"
 jxp_a_advance_market_stage_4_title:0 "颁行合本会社章程"
 jxp_a_advance_market_stage_4_desc:0 "统一日本的国家可把章程、董事、审计与公共信用写入国法。此举不是无偿增益：会社越多，豪商专政和国家担保危机越近。"
 jxp_a_institute_public_credit_title:0 "召开全国信用公仪"
 jxp_a_institute_public_credit_desc:0 "召集奉行、寺社、武家与豪商议定公债担保和债务重组。国库须先出资证明自己并非只求借新还旧。"
 jxp_a_market_sound_coinage:0 "成色与兑付成例"
 jxp_a_market_sound_coinage_desc:0 "铸座与兑换商依统一成色办事，信用稳固而流通稍显拘谨。"
 jxp_a_market_abundant_liquidity:0 "宽给市用"
 jxp_a_market_abundant_liquidity_desc:0 "增发和宽兑暂解钱荒，也把通胀风险留给日后的奉行。"
 jxp_a_market_price_relief:0 "仓廪平粜"
 jxp_a_market_price_relief_desc:0 "国库承担亏损，以开仓和运粮缓和米价与民怨。"
 jxp_a_market_free_bargaining:0 "问屋自由议价"
 jxp_a_market_free_bargaining_desc:0 "商人维持流通并自行承担风险，垄断与账外馈赠亦随之滋长。"
 jxp_a_market_public_workshop_contract:0 "公仪工场契约"
 jxp_a_market_public_workshop_contract_desc:0 "国家以明确订单与工价统筹军需和民业，代价是占用人力。"
 jxp_a_market_communal_workshop_compact:0 "町村合作工场"
 jxp_a_market_communal_workshop_compact_desc:0 "町众出资、惣村出工，共同分担器械、水利与销路。"
 jxp_a_company_registry_audit:0 "会社清册审计"
 jxp_a_company_registry_audit_desc:0 "奉行逐项核对资本、承包、分红和护运开支。"
 jxp_a_company_charter_autonomy:0 "董事自治章程"
 jxp_a_company_charter_autonomy_desc:0 "国家换取贡金并容许董事自行经营，豪商权势因而上升。"
 jxp_a_company_public_settlement:0 "公共财用和解"
 jxp_a_company_public_settlement_desc:0 "国库承担眼前代价，以赈济、展期和公开账目保全信用。"
 jxp_a_company_private_bargain:0 "董事私议契约"
 jxp_a_company_private_bargain_desc:0 "由出资人和行业内部解决争端，效率较高而公议较弱。"
 jxp_a_company_audit_regime:0 "会社特别审计"
 jxp_a_company_audit_regime_desc:0 "特别审计压低舞弊，却也增加书役和奉行成本。"
 jxp_a_company_distress_relief:0 "会社纾困"
 jxp_a_company_distress_relief_desc:0 "国家以五年纾困换取重组；救助若成为常例，下一次投机只会更大胆。"
 jxp_a_market_event_cooldown:0 "经世议题歇期"
 jxp_a_market_event_cooldown_desc:0 "同一批市场争端已经裁断，奉行暂不重复上奏。"
 jxp_a_company_event_cooldown:0 "会社评议歇期"
 jxp_a_company_event_cooldown_desc:0 "董事与奉行正在执行最近一次评议，不会立刻重复争讼。"
 jxp_a_company_director_state_structure:0 "会社董事：国家奉行主导"
 jxp_a_company_director_state_structure_desc:0 "奉行署按季核账，收益稳健而手续繁密。"
 jxp_a_company_director_merchant_structure:0 "会社董事：豪商主导"
 jxp_a_company_director_merchant_structure_desc:0 "大坂、堺与博多的出资人掌握日常经营，利润丰厚而势力渐重。"
 jxp_a_company_director_warrior_structure:0 "会社董事：武家主导"
 jxp_a_company_director_warrior_structure_desc:0 "有力家臣主持护运与征发，军用便利而私兵之患随之而来。"
 jxp_a_company_director_religious_structure:0 "会社董事：宗教组织主导"
 jxp_a_company_director_religious_structure_desc:0 "寺社与宗门以信用、慈善和学寮入股，亦要求财产自治。"
 jxp_a_company_director_mixed_structure:0 "会社董事：混合评议"
 jxp_a_company_director_mixed_structure_desc:0 "奉行、豪商、武家与宗门共同署押，稳妥但容易相持不决。"
 jxp_a_company_mining_chartered:0 "金银山会所已特许"
 jxp_a_company_mining_chartered_desc:0 "业务：统筹矿山、冶炼、铸币与沿路运输。风险：坑道事故、矿工争讼、承包舞弊与白银外流。章程到期后必须续约、改革、国有化或清算。"
 jxp_a_charter_company_mining_title:0 "特许金银山会所"
 jxp_a_charter_company_mining_desc:0 "准许金银山会所统筹矿山、冶炼、铸币与沿路运输。须掌握金、银、铜或铁矿山，并具备足以核算坑冶的行政技术；同时须由忠诚町众出资，国库无重债且国内安定。国小者至多一社，中等国家两社，统一日本三社；只有会社国家可容四社。"
 jxp_a_company_mining_nationalized:0 "金银山会所已国有化"
 jxp_a_company_mining_bankrupt_cleanup:0 "金银山会所破产清理中"
 jxp_a_company_mining_charter:0 "金银山会所章程"
 jxp_a_company_mining_charter_desc:0 "十年章程容许其统筹矿山、冶炼、铸币与沿路运输；届期必须重新议定，期间始终伴随坑道事故、矿工争讼、承包舞弊与白银外流的风险。"
 jxp_a_company_mining_nationalized_modifier:0 "国营金银山会所"
 jxp_a_company_mining_nationalized_modifier_desc:0 "国家买断民间持股后保留部分业务收益，控制更强而经营效率不及原章程。"
 jxp_a_company_mining_bankruptcy_modifier:0 "金银山会所破产余波"
 jxp_a_company_mining_bankruptcy_modifier_desc:0 "欠债、失业和未履行契约仍在清理；五年后方可重新讨论同类章程。"
 jxp_a_company_mining_state_expanding:0 "金银山会所：募集资本"
 jxp_a_company_mining_state_stable:0 "金银山会所：稳定经营"
 jxp_a_company_mining_state_distressed:0 "金银山会所：财政困难"
 jxp_a_company_mining_state_audited:0 "金银山会所：接受审计"
 jxp_a_company_mining_state_reformed:0 "金银山会所：改革后章程"
 jxp_a_company_mining_director_state:0 "金银山会所：国家奉行主导"
 jxp_a_company_mining_director_state_desc:0 "奉行署按季核账，收益稳健而手续繁密。"
 jxp_companies.101.state:0 "国家奉行主导"
 jxp_a_company_mining_director_merchant:0 "金银山会所：豪商主导"
 jxp_a_company_mining_director_merchant_desc:0 "大坂、堺与博多的出资人掌握日常经营，利润丰厚而势力渐重。"
 jxp_companies.101.merchant:0 "豪商主导"
 jxp_a_company_mining_director_warrior:0 "金银山会所：武家主导"
 jxp_a_company_mining_director_warrior_desc:0 "有力家臣主持护运与征发，军用便利而私兵之患随之而来。"
 jxp_companies.101.warrior:0 "武家主导"
 jxp_a_company_mining_director_religious:0 "金银山会所：宗教组织主导"
 jxp_a_company_mining_director_religious_desc:0 "寺社与宗门以信用、慈善和学寮入股，亦要求财产自治。"
 jxp_companies.101.religious:0 "宗教组织主导"
 jxp_a_company_mining_director_mixed:0 "金银山会所：混合评议"
 jxp_a_company_mining_director_mixed_desc:0 "奉行、豪商、武家与宗门共同署押，稳妥但容易相持不决。"
 jxp_companies.101.mixed:0 "混合评议"
 jxp_companies.101.t:0 "金银山会所募集本钱"
 jxp_companies.101.d:0 "章程草案已列明统筹矿山、冶炼、铸币与沿路运输，也承认坑道事故、矿工争讼、承包舞弊与白银外流。最后一项未决之事，是由谁主持董事评议并向国家呈报账目。"
 jxp_companies.201.t:0 "金银山会所章程届期"
 jxp_companies.201.d:0 "十年特许已经届满。旧账显示统筹矿山、冶炼、铸币与沿路运输确有所得，但坑道事故、矿工争讼、承包舞弊与白银外流也未消失。国家必须续约、拆分重组、买断或容其破产。拆分重组将支付100杜卡特与75行政点，撤换全体旧董事，并令新章程接受五年特别审计。"
 jxp_companies.201.renew:0 "照旧续约十年"
 jxp_companies.201.split_reorganize:0 "支付100¤与75行政点，拆分专营并撤换全体董事"
 jxp_companies.201.nationalize:0 "由国家买断并接管业务"
 jxp_companies.201.bankrupt:0 "拒绝担保，按破产清理"
 jxp_companies.301.t:0 "金银山会所经营初成"
 jxp_companies.301.d:0 "募集期已过，首批账目出现盈余。股东要求分红，经营者则希望继续扩充仓库、器械和航路。"
 jxp_companies.301.dividend:0 "按股分红，先安出资人之心"
 jxp_companies.301.reinvest:0 "把盈余留作后续经营"
 jxp_companies.401.t:0 "金银山会所濒临挤兑"
 jxp_companies.401.d:0 "国债和短期票据同时到期，坑道事故、矿工争讼、承包舞弊与白银外流又使现金流骤减。若国家不出手，章程只能进入破产清理。"
 jxp_companies.401.rescue:0 "以国库纾困并强制重组"
 jxp_companies.401.audit:0 "冻结分红，派奉行查账"
 jxp_companies.401.bankrupt:0 "不以天下税赋替董事偿债"
 jxp_a_company_shipping_chartered:0 "全国廻船会所已特许"
 jxp_a_company_shipping_chartered_desc:0 "业务：调度粮船、沿岸港津、价格书信与救难船。风险：海难、船主垄断、港口拒税与地方航路争夺。章程到期后必须续约、改革、国有化或清算。"
 jxp_a_charter_company_shipping_title:0 "特许全国廻船会所"
 jxp_a_charter_company_shipping_desc:0 "准许全国廻船会所调度粮船、沿岸港津、价格书信与救难船。须拥有五座港口和一支成规模的海军，以廻船与港津为业务根基；同时须由忠诚町众出资，国库无重债且国内安定。国小者至多一社，中等国家两社，统一日本三社；只有会社国家可容四社。"
 jxp_a_company_shipping_nationalized:0 "全国廻船会所已国有化"
 jxp_a_company_shipping_bankrupt_cleanup:0 "全国廻船会所破产清理中"
 jxp_a_company_shipping_charter:0 "全国廻船会所章程"
 jxp_a_company_shipping_charter_desc:0 "十年章程容许其调度粮船、沿岸港津、价格书信与救难船；届期必须重新议定，期间始终伴随海难、船主垄断、港口拒税与地方航路争夺的风险。"
 jxp_a_company_shipping_nationalized_modifier:0 "国营全国廻船会所"
 jxp_a_company_shipping_nationalized_modifier_desc:0 "国家买断民间持股后保留部分业务收益，控制更强而经营效率不及原章程。"
 jxp_a_company_shipping_bankruptcy_modifier:0 "全国廻船会所破产余波"
 jxp_a_company_shipping_bankruptcy_modifier_desc:0 "欠债、失业和未履行契约仍在清理；五年后方可重新讨论同类章程。"
 jxp_a_company_shipping_state_expanding:0 "全国廻船会所：募集资本"
