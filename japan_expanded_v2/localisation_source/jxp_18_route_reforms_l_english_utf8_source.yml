l_english:
 jxp_route_institution_foundations:0 "日轮国制根本"
 jxp_route_institution_administration:0 "日轮国制行政"
 jxp_route_institution_command:0 "日轮国制军政"
 jxp_reform_sakoku_sankin_kotai_roads:0 "参勤交代道中"
 jxp_reform_sakoku_sankin_kotai_roads_desc:0 "诸侯往还江户与本领，驿站、宿场、桥梁与役夫皆入公仪账册。道路不只搬运人马，也搬运服从。"
 jxp_reform_sakoku_coastal_barriers:0 "海岸番所"
 jxp_reform_sakoku_coastal_barriers_desc:0 "沿海番所被编成常设地方行政网，浦役登记渔户与船籍，代官检核烽火、仓粮和来帆。海雾深处的来客，须先看见国法的灯火。"
 jxp_reform_sakoku_hidden_learning:0 "秘传洋书会"
 jxp_reform_sakoku_hidden_learning_desc:0 "异邦之书不许妄传，却可由医师、译官与炮术家密议校读。闭门并非闭眼，谨慎亦可生出学问。"
 jxp_reform_open_silver_exchange:0 "银座会计所"
 jxp_reform_open_silver_exchange_desc:0 "石见与诸港之银被铸为可信的账簿与汇兑，海商以此度量远方，奉行以此度量国用。"
 jxp_reform_open_foreign_artillery_contracts:0 "异国炮术契约"
 jxp_reform_open_foreign_artillery_contracts_desc:0 "铸炮师、船匠与翻译随商船而来，契约把技艺留在日本。火器不再是南蛮奇物，而成新军制的一部分。"
 jxp_reform_open_chartered_factories:0 "敕许商馆网"
 jxp_reform_open_chartered_factories_desc:0 "堺、长崎、博多诸商馆受敕许而通航，印章、税簿与通词把海路织成可治理的网络。"
 jxp_reform_kirishitan_seminaries:0 "神学校与译馆"
 jxp_reform_kirishitan_seminaries_desc:0 "青年武士与港町子弟在神学校习拉丁、医术、算学与教义。钟声之后，也有笔墨与账册之声。"
 jxp_reform_kirishitan_misericordia_hospitals:0 "慈悲会病院"
 jxp_reform_kirishitan_misericordia_hospitals_desc:0 "信众会照看病者、孤儿与漂泊水手。仁慈若能被制度收束，便可在动荡港町中化作安宁。"
 jxp_reform_kirishitan_nagasaki_admiralty:0 "长崎护教水军"
 jxp_reform_kirishitan_nagasaki_admiralty_desc:0 "长崎船手、炮手与港务通词被编为常备护教水军，在十字与日轮旗下巡海护商。传教士需要航路，国家也需要受军令、操典与补给约束的舰队。"
 jxp_reform_confucian_examination_domains:0 "诸藩讲学试"
 jxp_reform_confucian_examination_domains_desc:0 "藩校讲义、城下学寮与官学试问连为一体。武家子弟须知弓马，也须知礼义。"
 jxp_reform_confucian_sinicized_codes:0 "王化律令"
 jxp_reform_confucian_sinicized_codes_desc:0 "诸国法度以礼制重编，刑名、田制与官箴彼此相承。日本不必变成中国，却可借华礼度量天下。"
 jxp_reform_confucian_three_teachings_board:0 "三教评议所"
 jxp_reform_confucian_three_teachings_board_desc:0 "儒者、社家与僧侣同入评议，辨名分，定祭礼，裁地方争端。神宫守其古仪，诸教各得其位。"
 jxp_reform_imperial_kokugaku_office:0 "国学寮"
 jxp_reform_imperial_kokugaku_office_desc:0 "古歌、神典与朝仪被重新校订。所谓复古，并非沉睡于旧纸，而是以旧名唤醒新国。"
 jxp_reform_imperial_kokushi_governors:0 "国司再任制"
 jxp_reform_imperial_kokushi_governors_desc:0 "国司之名复见文书，地方奉行受朝命检核。旧官名从仪礼中走出，再次触及田亩与城郭。"
 jxp_reform_imperial_restoration_army:0 "王政亲征军"
 jxp_reform_imperial_restoration_army_desc:0 "禁里亲卫、诸藩精兵与新式足轻合编为王师。军旗所向，不只是武家胜负，亦是朝命所临。"
 jxp_reform_reformed_printing_synods:0 "印书会院"
 jxp_reform_reformed_printing_synods_desc:0 "长老、译官与刻工共同校订书册。誓约、航海术、医方与火器图谱，皆可由印板传向诸国。"
 jxp_reform_reformed_civic_compacts:0 "町会信约"
 jxp_reform_reformed_civic_compacts_desc:0 "港町以会众、商约与奉行法度互相约束。信仰不倚华丽仪式，而倚可执行的誓纸。"
 jxp_reform_reformed_contract_fleet:0 "契约商船队"
 jxp_reform_reformed_contract_fleet_desc:0 "荷兰船主、日本水军与港町长老按契约分担风险。船队因信约而远行，信约因远行而得利。"
 jxp_reform_kaikyo_monsoon_diwan:0 "季风迪万"
 jxp_reform_kaikyo_monsoon_diwan_desc:0 "港奉行、卡迪与南海商人按季风议定航期、仓储与税则。星盘所指之处，亦有账簿相随。"
 jxp_reform_kaikyo_wakf_granaries:0 "瓦合甫仓廪"
 jxp_reform_kaikyo_wakf_granaries_desc:0 "港町粮仓以施舍、税粮与军需三途并行。远客见其法，百姓见其食，军船见其补给。"
 jxp_reform_kaikyo_spice_guard:0 "香料护航众"
 jxp_reform_kaikyo_spice_guard_desc:0 "护航船队往返南海与日本诸港，守货亦守信。香料、丝绸与祈祷在同一甲板上渡海。"
 jxp_reform_ikko_somon_councils:0 "惣门评定"
 jxp_reform_ikko_somon_councils_desc:0 "村落、讲众与寺内町共入评定。钟声召集的并非乌合之众，而是知道自身份额与义务的共同体。"
 jxp_reform_ikko_granary_communes:0 "门徒义仓"
 jxp_reform_ikko_granary_communes_desc:0 "义仓收纳米谷、盐铁与军需，平时赈济，战时供给。一向之国的根，不只在寺门，也在仓门。"
 jxp_reform_ikko_ashigaru_congregations:0 "讲中足轻"
 jxp_reform_ikko_ashigaru_congregations_desc:0 "讲中按村社分番操练，农闲习枪，战时守土。其勇气来自信念，也来自彼此熟知的田垄。"
 jxp_reform_wokou_black_tide_law:0 "黑潮掟法"
 jxp_reform_wokou_black_tide_law_desc:0 "海主之权不只来自刀锋，也来自众船承认的掟法。分赃、仲裁、奉表与护航皆有定例，黑潮诸众因共同遵法而承认中枢，海上政权由此取得可传承的名分。"
 jxp_reform_wokou_island_freeports:0 "列岛自由港"
 jxp_reform_wokou_island_freeports_desc:0 "对马、五岛、琉球与濑户内诸港各守其码头规约，收纳来帆，也收纳消息。岛屿由此变成国家的眼耳。"
 jxp_reform_wokou_boarding_companies:0 "跳帮船手众"
 jxp_reform_wokou_boarding_companies_desc:0 "熟潮水、识船型、惯白刃的船手被编入国家名册。私帆的凶悍，经法度束缚后便成可用之兵。"
