l_english:
 jxp_a_mission_oda_kiyosu_judgment_title:0 "清洲裁断"
 jxp_a_mission_oda_kiyosu_judgment_desc:0 "尾张守护、守护代与国众的旧权利盘根错节。清洲的裁断必须决定，织田家是以安堵聚众，还是以奉行重写国法。"
 jxp_a_mission_oda_owari_kokujin_oath_title:0 "尾张国众起请"
 jxp_a_mission_oda_owari_kokujin_oath_desc:0 "国众的城砦与村落构成尾张军力。让盟誓成为可追责的军役契约，才不会在每次出阵时重新讨价还价。"
 jxp_a_mission_oda_household_magistrate_register_title:0 "家中奉行册"
 jxp_a_mission_oda_household_magistrate_register_desc:0 "战功、知行、诉讼和仓储应由常设奉行记录。跨国领地不能只依靠当主记忆与临阵口令。"
 jxp_a_mission_oda_abolish_checkpoints_title:0 "撤除关所"
 jxp_a_mission_oda_abolish_checkpoints_desc:0 "领内私设关卡割裂市镇和军路。统一关津、废除重复征收，乐市乐座才会从单城特许扩展为领国制度。"
 jxp_a_mission_oda_front_commands_title:0 "方面军团"
 jxp_a_mission_oda_front_commands_desc:0 "东面、北面与畿内战线同时延伸。把兵将分成有明确目标的方面军团，才能使远方攻势不待清洲逐令。"
 jxp_a_mission_oda_legion_domains_title:0 "军团分国"
 jxp_a_mission_oda_legion_domains_desc:0 "强将必须获得足以维持远征的权力，却不能把征服地变成私国。织田家要在速度与监督之间立下长期规则。"
 jxp_a_mission_oda_provisions_post_horses_title:0 "兵粮与传马"
 jxp_a_mission_oda_provisions_post_horses_desc:0 "宿站、传马、兵粮仓和船运共同决定大军能走多远。方面军团的速度必须建立在可审计的后勤上。"
 jxp_a_mission_oda_rename_gifu_title:0 "岐阜号令"
 jxp_a_mission_oda_rename_gifu_desc:0 "从尾张一隅走向天下，新的城府也应宣告新的尺度。岐阜将成为连接东山道与畿内的军政中枢。"
 jxp_a_mission_oda_gun_foundry_guild_title:0 "铁炮锻冶座"
 jxp_a_mission_oda_gun_foundry_guild_desc:0 "火器的威力依赖硝石、铁料、工匠和统一口径。把锻冶座纳入军需奉行，铁炮才不是偶然购得的奇物。"
 jxp_a_mission_oda_surrendered_lords_assurance_title:0 "降将安堵"
 jxp_a_mission_oda_surrendered_lords_assurance_desc:0 "迅速扩张会带来大量旧主与降将。安堵、没收或转封的规则必须先于私怨，否则每次胜利都会制造下一场叛乱。"
 jxp_a_mission_oda_kyoto_sakai_dual_hub_title:0 "京都堺双府"
 jxp_a_mission_oda_kyoto_sakai_dual_hub_desc:0 "京都提供名分与人材，堺提供财赋与海路。让两座城市分别承担朝廷政务和商贸军需，可避免天下事业困于一城。"
 jxp_a_mission_oda_court_petition_title:0 "奏请朝廷"
 jxp_a_mission_oda_court_petition_desc:0 "武力可以开路，却不能独自解释天下秩序。以修缮、献金与奏请换取朝廷名分，使征服成为可被承认的政权。"
 jxp_a_mission_oda_disposition_of_shogun_title:0 "处置公方"
 jxp_a_mission_oda_disposition_of_shogun_desc:0 "足利将军既是旧秩序的象征，也是可能号召反织田势力的中心。安土奉行政、军团分国或奉戴公方，必须择一而行。"
 jxp_a_mission_oda_sect_adjudication_title:0 "寺社裁定"
 jxp_a_mission_oda_sect_adjudication_desc:0 "寺社、门徒与町众拥有土地、武装和跨国联系。调和、规制或镇压都要成为公开政策，而非任由前线将领各自处置。"
 jxp_a_mission_oda_honnoji_shadow_title:0 "本能寺之影"
 jxp_a_mission_oda_honnoji_shadow_desc:0 "扩张越快，军团自治、近臣竞争与无休远征越可能汇成政变。历史风险应由制度和选择处理，而不是强制夺走当主。"
 jxp_a_mission_oda_succession_settlement_title:0 "天下继承议定"
 jxp_a_mission_oda_succession_settlement_desc:0 "织田政权可以交给嫡系、重臣会议、丰臣接管者或分国联邦。每条道路都保留不同的统一遗产，也承担不同代价。"
 jxp_a_mission_img_additional_laws_title:0 "追加法条"
 jxp_a_mission_img_additional_laws_desc:0 "今川假名目录必须随领国扩大而增补。土地、债务、军役与诉讼的明文规则，正是守护转为战国领主的根基。"
 jxp_a_mission_img_suruga_cadastral_survey_title:0 "骏河检地"
 jxp_a_mission_img_suruga_cadastral_survey_desc:0 "寺社领、家臣知行与村落田亩若无统一账册，军役便无从公平分配。检地应先从骏河本领做起。"
 jxp_a_mission_img_regular_markets_title:0 "定期市与关津"
 jxp_a_mission_img_regular_markets_desc:0 "东海道市镇需要固定日期、统一税则与安全宿站。商路的繁荣也是军粮和使节得以畅通的条件。"
 jxp_a_mission_img_jukeini_seal_title:0 "寿桂尼朱印"
 jxp_a_mission_img_jukeini_seal_desc:0 "寿桂尼以朱印裁断家中与领国事务。今川家应决定，这枚印是协调诸臣的公议凭证，还是集中命令的权威。"
 jxp_a_mission_img_sumpu_cultural_court_title:0 "骏府小京都"
 jxp_a_mission_img_sumpu_cultural_court_desc:0 "公家、禅僧、连歌师与武士汇聚骏府。文化威仪并非装饰，而是训练使节、书吏和继承人的政治设施。"
 jxp_a_mission_img_sessai_envoys_title:0 "雪斋使节团"
 jxp_a_mission_img_sessai_envoys_desc:0 "太原雪斋把禅林人脉、军事判断与婚盟外交合为一体。常设使节团可使这套本领不随一位名僧逝去。"
 jxp_a_mission_img_eastern_arbitration_title:0 "甲相骏仲裁"
 jxp_a_mission_img_eastern_arbitration_desc:0 "三方同盟的价值不只是不战，还在于为边境、婚约和共同敌人提供仲裁。历史伙伴不存时，也应建立相邻诸家的替代均势。"
 jxp_a_mission_img_matsudaira_assurance_title:0 "松平安堵"
 jxp_a_mission_img_matsudaira_assurance_desc:0 "三河松平处在尾张与骏河之间。以领地安堵和军役契约换取可靠前锋，胜过把他们永远当作可弃人质。"
 jxp_a_mission_img_marriage_adoption_registers_title:0 "婚姻养子簿"
 jxp_a_mission_img_marriage_adoption_registers_desc:0 "婚盟、养子与人质塑造东海道继承。把约定、教育和归还条件记录成册，才能让亲族外交经得起当主更替。"

 jxp_a_oda_azuchi_magistracy_reform:0 "安土奉行政"
 jxp_a_oda_azuchi_magistracy_reform_desc:0 "以安土为中枢，常设奉行统一账册、裁判和军需，将迅速征服转化为直接而可审计的领国行政。"
 jxp_a_oda_legion_domains_reform:0 "军团分国政"
 jxp_a_oda_legion_domains_reform_desc:0 "方面军团在分国获得广泛军政权限，以速度和动员换取中央监督减弱、地方摩擦增加的风险。"
 jxp_a_oda_ashikaga_protectorate_reform:0 "奉戴公方体制"
 jxp_a_oda_ashikaga_protectorate_reform_desc:0 "织田家保留足利公方的礼制名分，自居保护与执行者，以朝幕关系换取诸侯承认和更温和的统合。"

 jxp_daimyo_depth.1.t:0 "清洲的裁断"
 jxp_daimyo_depth.1.d:0 "守护旧臣、国众与新进奉行齐集清洲。若继续承认旧有权利，尾张能够较平稳地团结；若重建中央文书机构，则可更快调动财赋，却会刺痛旧族。"
 jxp_daimyo_depth.1.a:0 "以安堵换取起请"
 jxp_daimyo_depth.1.b:0 "由清洲奉行重写旧例"
 jxp_daimyo_depth.2.t:0 "尾张国众的誓纸"
 jxp_daimyo_depth.2.d:0 "国众愿意交出军役名册，却要求本领与村落裁判得到保证。另一派主张趁军威正盛，直接编列其兵粮和人质。"
 jxp_daimyo_depth.2.a:0 "让盟誓约束双方"
 jxp_daimyo_depth.2.b:0 "强制编入军役册"
 jxp_daimyo_depth.3.t:0 "军团应当拥有多少分国权"
 jxp_daimyo_depth.3.d:0 "远方将领要求自行分配知行、征粮和谈判降伏。授予自治能保持攻势，改由中央奉行随军则更慢，却能阻止征服地成为私国。"
 jxp_daimyo_depth.3.a:0 "以分国权维持方面军速度"
 jxp_daimyo_depth.3.b:0 "派遣直属奉行监督军团"
 jxp_daimyo_depth.4.t:0 "如何安置降将"
 jxp_daimyo_depth.4.d:0 "新降诸将熟悉地方，却也保留旧有关系。织田家可以安堵其本领、没收财产补充国用，或把他们转封到需要军役的新地。"
 jxp_daimyo_depth.4.a:0 "安堵旧领，登记军役"
 jxp_daimyo_depth.4.b:0 "没收逆产，充实公库"
 jxp_daimyo_depth.4.c:0 "转封并纳入奉行监督"
 jxp_daimyo_depth.5.t:0 "公方之后的天下体制"
 jxp_daimyo_depth.5.d:0 "旧幕府已无法约束诸国。我们必须决定，是由安土奉行直接行政，让方面军团分掌征服地，还是保留足利公方作为名分中心。"
 jxp_daimyo_depth.5.a:0 "建立安土奉行政"
 jxp_daimyo_depth.5.b:0 "承认军团分国政"
 jxp_daimyo_depth.5.c:0 "奉戴公方，由织田执行政令"
 jxp_daimyo_depth.6.t:0 "寺社与门徒的裁定"
 jxp_daimyo_depth.6.d:0 "寺社势力既能维持地方救济，也可能阻断军路。调和可减少长期反抗，规制能把土地纳入法度，全面镇压则见效迅速而代价沉重。"
 jxp_daimyo_depth.6.a:0 "以町与惣村契约调和"
 jxp_daimyo_depth.6.b:0 "登记寺领并限制武装"
 jxp_daimyo_depth.6.c:0 "彻底摧毁抗命据点"
 jxp_daimyo_depth.7.t:0 "本能寺之影"
 jxp_daimyo_depth.7.d:0 "无休远征、军团自治与近臣竞争使家中暗流涌动。风险并不注定夺去当主性命；公开评定、轮换宿卫与付出真金白银的整顿都能改变结局。"
 jxp_daimyo_depth.7.a:0 "以评定和宿卫轮换控制风险"
 jxp_daimyo_depth.7.b:0 "暂停远征，重金重组近卫"
 jxp_daimyo_depth.8.t:0 "天下继承议定"
 jxp_daimyo_depth.8.d:0 "织田体制已超出一国之家督安排。嫡系、重臣会议、丰臣接管与军团联邦都有人支持；选择将决定此后谁继承征服的名义与制度。"
 jxp_daimyo_depth.8.a:0 "确立织田嫡系"
 jxp_daimyo_depth.8.b:0 "由重臣会议辅政"
 jxp_daimyo_depth.8.c:0 "承认丰臣接管方案"
 jxp_daimyo_depth.8.d:0 "把军团改造成织田联邦"

 jxp_daimyo_depth.101.t:0 "寿桂尼的朱印"
 jxp_daimyo_depth.101.d:0 "新的法条需要得到家臣、寺社与村落承认。寿桂尼可以让朱印成为各方共同遵守的裁断，也可以借此强化骏府直接命令。"
 jxp_daimyo_depth.101.a:0 "以朱印确认合议裁断"
 jxp_daimyo_depth.101.b:0 "让朱印代表骏府直令"
 jxp_daimyo_depth.102.t:0 "雪斋之后的使节团"
 jxp_daimyo_depth.102.d:0 "禅僧熟悉文字、礼仪与诸国寺院网络。将雪斋式外交制度化需要长期供养，但能避免盟约只依赖一位能人。"
 jxp_daimyo_depth.102.a:0 "供养常设禅僧使节团"
 jxp_daimyo_depth.102.b:0 "把资源留给边境军备"
 jxp_daimyo_depth.103.t:0 "东方三方的仲裁席"
 jxp_daimyo_depth.103.d:0 "两位伙伴都要求今川支持各自的边境主张。若骏府愿意承担仲裁成本，三方均势会更稳；若偏向武力，短期军备更强却会损伤信用。"
 jxp_daimyo_depth.103.a:0 "以共同条款裁断争端"
 jxp_daimyo_depth.103.b:0 "让实力决定边界"
 jxp_daimyo_depth.104.t:0 "松平家的安堵"
 jxp_daimyo_depth.104.d:0 "三河诸松平希望得到继承和领地保证。真诚安堵会培养可靠盟属，继续以强制军役相待则能立即抽取更多兵力。"
 jxp_daimyo_depth.104.a:0 "以法书保证领地与继承"
 jxp_daimyo_depth.104.b:0 "他们首先是海道前锋"
 jxp_daimyo_depth.105.t:0 "骏府的人质教育"
 jxp_daimyo_depth.105.d:0 "来自海道诸家的年轻继承人在骏府共同学习礼法、兵学与文书。把他们当作未来伙伴会织成持久关系，只作抵押则更直接却难获真心。"
 jxp_daimyo_depth.105.a:0 "让人质成为共同秩序的成员"
 jxp_daimyo_depth.105.b:0 "严守质券，不谈情分"
 jxp_daimyo_depth.106.t:0 "婚姻与养子的档案"
 jxp_daimyo_depth.106.d:0 "数十年的亲族安排已经彼此交错。建立公开档案能减少继承争议；保留当主裁量，则可在危机时更灵活地改变承诺。"
 jxp_daimyo_depth.106.a:0 "登记婚约、养子与归还条件"
 jxp_daimyo_depth.106.b:0 "家督仍应保留最终裁量"
 jxp_daimyo_depth.107.t:0 "同盟中的裂缝"
 jxp_daimyo_depth.107.d:0 "三方均势并不会自行维持。边境争端与外敌诱惑不断考验盟约，我们可以投入使节修补条款，或把资源转为应对破盟的军备。"
 jxp_daimyo_depth.107.a:0 "修补条款并准备共同评定"
 jxp_daimyo_depth.107.b:0 "盟书之外更需甲兵"
 jxp_daimyo_depth.108.t:0 "桶狭间之日"
 jxp_daimyo_depth.108.d:0 "海道大军走入狭窄地形，骤雨与敌袭改变了上洛计划。胜利、秩序撤退、以氏真式法制文化重建，或放弃京都转建东海道联盟，都是由当前国势决定的道路。"
 jxp_daimyo_depth.108.a:0 "反击并赢得桶狭间"
 jxp_daimyo_depth.108.b:0 "保存当主与军令，有序撤退"
 jxp_daimyo_depth.108.c:0 "以氏真式文治重建骏府"
 jxp_daimyo_depth.108.d:0 "放弃豪赌，建立东海道联盟"

