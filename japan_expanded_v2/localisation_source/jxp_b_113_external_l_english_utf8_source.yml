l_english:
 jxp_b_113_open_ryukyu_compact_title:0 "议定琉球两属之约"
 jxp_b_113_open_ryukyu_compact_desc:0 "遣使首里，与琉球王府、唐商和那霸町众逐项议定册封、贡舶、港税与海防。此约须经当地王府承认，不会凭空吞并琉球。"
 jxp_b_113_open_tsushima_mediation_title:0 "重整对马通交"
 jxp_b_113_open_tsushima_mediation_desc:0 "请宗氏、朝鲜译官与我方奉行共定岁遣船、倭馆、市舶和漂流民处置，使对马继续担当两国之间的门径。"
 jxp_b_113_open_northern_compact_title:0 "召集北海互市会盟"
 jxp_b_113_open_northern_compact_desc:0 "邀请虾夷、桦太与北海诸首领商议渔场、山丹贸易、越冬港和劳役边界。强索贡赋虽有眼前之利，却会留下长久怨恨。"
 jxp_b_113_open_taiwan_maritime_compact_title:0 "议定台湾海上公约"
 jxp_b_113_open_taiwan_maritime_compact_desc:0 "让台湾社众、闽海商帮、船主与我方通事共同议定港市、垦殖、缉盗和税契。当地社会将以自己的选择回应我们的提案。"

 jxp_b_governance.100.t:0 "五年巡察：新领初定"
 jxp_b_governance.100.d:0 "战后五年，军粮、赋役与地方官吏的账册已经足够显露新制的得失。若只取一时之财，二十年之约必难善终。"
 jxp_b_governance.100.military:0 "整饬军府与营伍"
 jxp_b_governance.100.dynasty:0 "让旧族举荐能吏"
 jxp_b_governance.100.trade:0 "公开贡舶与关税账册"
 jxp_b_governance.100.direct:0 "派勘定奉行核查州县"
 jxp_b_governance.101.t:0 "十年巡察：官民之间"
 jxp_b_governance.101.d:0 "第二次巡察不再只看仓廪盈亏。乡绅、商人、军户与普通百姓都在追问：新秩序究竟由谁作主，又向谁申诉？"
 jxp_b_governance.101.military:0 "以军费换取乡勇协守"
 jxp_b_governance.101.dynasty:0 "召开地方名望之会"
 jxp_b_governance.101.trade:0 "让港市代表参与议价"
 jxp_b_governance.101.direct:0 "扩充通判与巡按衙署"
 jxp_b_governance.102.t:0 "十五年巡察：积弊浮现"
 jxp_b_governance.102.d:0 "旧日的临时安排已经长成利益与习惯。第三次巡察必须承担真正的代价，否则终期来临时将只剩强兵与空文。"
 jxp_b_governance.102.military:0 "再立军纪，不惜疲敝"
 jxp_b_governance.102.dynasty:0 "以合议约束世家"
 jxp_b_governance.102.trade:0 "彻查包税与贡舶"
 jxp_b_governance.102.direct:0 "清丈重编，惩办贪墨"
 jxp_b_governance.103.t:0 "二十年之议"
 jxp_b_governance.103.d:0 "二十年已经过去。战时建立的权宜体制不能永久悬置：或将其纳入常制，或承认地方自理，或付出巨资另起一轮治理。"
 jxp_b_governance.103.normalize:0 "归入常制，罢去临时衙门"
 jxp_b_governance.103.autonomy:0 "以自治和约安定地方"
 jxp_b_governance.103.to_military:0 "重建军府，再行二十年"
 jxp_b_governance.103.to_dynasty:0 "扶立地方家门，再行二十年"
 jxp_b_governance.103.to_trade:0 "改为贡市共治，再行二十年"
 jxp_b_governance.103.to_direct:0 "改设直辖奉行，再行二十年"

 jxp_b_regional_depth.201.t:0 "首里朝议：册封与两属"
 jxp_b_regional_depth.201.d:0 "琉球王府先须决定，新的海约应如何安放中国册封与日本保护之间的旧有平衡。"
 jxp_b_regional_depth.201.a:0 "以中国册封为礼制之首"
 jxp_b_regional_depth.201.b:0 "在两方之间谨慎持衡"
 jxp_b_regional_depth.202.t:0 "首里朝议：海防之请"
 jxp_b_regional_depth.202.d:0 "海寇与强邻逼近诸岛，王府必须衡量接受外援会否反使琉球失去回旋余地。"
 jxp_b_regional_depth.202.a:0 "请日本承担护航之责"
 jxp_b_regional_depth.202.b:0 "仍以本国舟师守海"
 jxp_b_regional_depth.203.t:0 "那霸唐营与贡舶"
 jxp_b_regional_depth.203.d:0 "唐商、通事与贡舶役人要求把既有权利写入新约，免受临时征发。"
 jxp_b_regional_depth.203.a:0 "保全唐营与贡舶旧例"
 jxp_b_regional_depth.203.b:0 "让王府保留临机裁量"
 jxp_b_regional_depth.204.t:0 "久米村通事之席"
 jxp_b_regional_depth.204.d:0 "没有熟悉两国礼法与航路的通事，任何条约都只是一纸空文。"
 jxp_b_regional_depth.204.a:0 "出资扩充通事学馆"
 jxp_b_regional_depth.204.b:0 "将席位包给有力商家"
 jxp_b_regional_depth.205.t:0 "诸岛港税之争"
 jxp_b_regional_depth.205.d:0 "宫古、八重山与冲绳本岛对港税分配各有诉求，统一税契必须作出让步。"
 jxp_b_regional_depth.205.a:0 "逐岛议定税额"
 jxp_b_regional_depth.205.b:0 "先充王府之库"
 jxp_b_regional_depth.206.t:0 "王统与按司"
 jxp_b_regional_depth.206.d:0 "地方按司担心新海约使首里权势过重；王府也不愿让旧族阻挠每一项港务。"
 jxp_b_regional_depth.206.a:0 "重申王府裁断"
 jxp_b_regional_depth.206.b:0 "给按司留下议事之席"
 jxp_b_regional_depth.207.t:0 "两属文书"
 jxp_b_regional_depth.207.d:0 "最后的文书必须说明琉球如何同时维持朝贡礼仪与日本海防关系。"
 jxp_b_regional_depth.207.a:0 "以含混而灵活的措辞成约"
 jxp_b_regional_depth.207.b:0 "只承认首里王府的主权"
 jxp_b_regional_depth.208.t:0 "琉球之约"
 jxp_b_regional_depth.208.d:0 "八次朝议已毕。琉球可以接受互保通商、进一步缔结王统联合之约，或保留独行之路。"
 jxp_b_regional_depth.208.a:0 "签署互保通商之约"
 jxp_b_regional_depth.208.b:0 "缔结更紧密的王统联合"
 jxp_b_regional_depth.208.c:0 "婉拒此约，维持旧制"

 jxp_b_regional_depth.301.t:0 "宗氏之门"
 jxp_b_regional_depth.301.d:0 "对马宗氏以数代积累的书契、译官和人脉维系朝鲜通交；绕过他们只会让海峡失去可信的中介。"
 jxp_b_regional_depth.301.a:0 "承认宗氏的中介之职"
 jxp_b_regional_depth.301.b:0 "以厚赏换取直接听命"
 jxp_b_regional_depth.302.t:0 "书契与印信"
 jxp_b_regional_depth.302.d:0 "伪使与伪书契曾损害海峡信用。新约须决定如何核验印信与使团。"
 jxp_b_regional_depth.302.a:0 "由双方译官共同勘验"
 jxp_b_regional_depth.302.b:0 "让宗氏自行查察"
 jxp_b_regional_depth.303.t:0 "漂流民之归还"
 jxp_b_regional_depth.303.d:0 "海难不应自动成为战争借口。漂流民的讯问、供给与遣返需要稳定规程。"
 jxp_b_regional_depth.303.a:0 "由公库负担遣返"
 jxp_b_regional_depth.303.b:0 "让商船自行筹资"
 jxp_b_regional_depth.304.t:0 "倭馆市舶"
 jxp_b_regional_depth.304.d:0 "釜山倭馆既是贸易场所，也是最容易引发争端的边界。"
 jxp_b_regional_depth.304.a:0 "依定额开放岁遣船"
 jxp_b_regional_depth.304.b:0 "将船额售予豪商"
 jxp_b_regional_depth.305.t:0 "海峡纠纷的裁断"
 jxp_b_regional_depth.305.d:0 "商债、斗殴与扣船若都上升为国争，任何通交都不能持久。"
 jxp_b_regional_depth.305.a:0 "设三方会审之席"
 jxp_b_regional_depth.305.b:0 "以赔款迅速了结"
 jxp_b_regional_depth.306.t:0 "对马调停约成"
 jxp_b_regional_depth.306.d:0 "宗氏可以继续充当日本与朝鲜之间的双向中介，也可以退回一岛自守。"
 jxp_b_regional_depth.306.a:0 "维持海峡双向调停"
 jxp_b_regional_depth.306.b:0 "不再承担两国之争"

 jxp_b_regional_depth.401.t:0 "北海诸首领之会"
 jxp_b_regional_depth.401.d:0 "虾夷与北海诸首领要求先承认各自的渔场、猎地和交易权，才肯谈论更大的互市秩序。"
 jxp_b_regional_depth.401.a:0 "让诸首领入席议事"
 jxp_b_regional_depth.401.b:0 "只与最有力者交涉"
 jxp_b_regional_depth.402.t:0 "渔场与越冬港"
 jxp_b_regional_depth.402.d:0 "鲑场、海兽与越冬港是北海生计根本。税契若不顾季节与旧界，冲突必将蔓延。"
 jxp_b_regional_depth.402.a:0 "以分成承认旧有渔场"
 jxp_b_regional_depth.402.b:0 "先取公仪应得之利"
 jxp_b_regional_depth.403.t:0 "劳役的界限"
 jxp_b_regional_depth.403.d:0 "商人要求以债役保证供货，诸首领则称这会把互市变作拘役。"
 jxp_b_regional_depth.403.a:0 "禁止强制债役"
 jxp_b_regional_depth.403.b:0 "准许商家征发劳力"
 jxp_b_regional_depth.404.t:0 "山丹来路"
 jxp_b_regional_depth.404.d:0 "桦太以北的山丹贸易连接毛皮、丝绸与金属器，不能只靠一座南方会所支配。"
 jxp_b_regional_depth.404.a:0 "保护北方中介商路"
 jxp_b_regional_depth.404.b:0 "派武装船队控制转运"
 jxp_b_regional_depth.405.t:0 "俄人与北海边界"
 jxp_b_regional_depth.405.d:0 "更北方的势力正在逼近。共同传递消息与救助船难，或许比仓促划界更为实际。"
 jxp_b_regional_depth.405.a:0 "建立共同瞭望与通报"
 jxp_b_regional_depth.405.b:0 "以武威宣示海疆"
 jxp_b_regional_depth.406.t:0 "北海互市之约"
 jxp_b_regional_depth.406.d:0 "条款已齐。我们可以接受互市与首领合议，也可以用强制劳动换取更多货物与更深怨恨。"
 jxp_b_regional_depth.406.a:0 "签署北海互市盟约"
 jxp_b_regional_depth.406.b:0 "以贡役制度统辖北海"

 jxp_b_regional_depth.501.t:0 "台湾社众之席"
 jxp_b_regional_depth.501.d:0 "港市与垦地不能只由远来的船主决定。当地社众要求在契约、猎场和水源事务中保留发言之权。"
 jxp_b_regional_depth.501.a:0 "召集社众与头目议事"
 jxp_b_regional_depth.501.b:0 "先与熟悉行情的包税人议定"
 jxp_b_regional_depth.502.t:0 "闽海商帮"
 jxp_b_regional_depth.502.d:0 "泉漳商人掌握海路、银钱与移民网络；他们既能使港市兴盛，也能架空公约。"
 jxp_b_regional_depth.502.a:0 "以公开牌照约束商帮"
 jxp_b_regional_depth.502.b:0 "让大商承包港税"
 jxp_b_regional_depth.503.t:0 "垦殖与水土"
 jxp_b_regional_depth.503.d:0 "新垦户需要土地，社众依赖猎场与水源。若不划清边界，每一条水圳都会成为兵争。"
 jxp_b_regional_depth.503.a:0 "逐社勘界并补偿"
 jxp_b_regional_depth.503.b:0 "以垦照优先招徕移民"
 jxp_b_regional_depth.504.t:0 "海盗与护航"
 jxp_b_regional_depth.504.d:0 "海盗、私商与受雇水手往往出自同一群人。公约须决定以水师清剿，还是以赎买分化。"
 jxp_b_regional_depth.504.a:0 "编练护航水师"
 jxp_b_regional_depth.504.b:0 "招抚可用的船主"
 jxp_b_regional_depth.505.t:0 "荷兰与西班牙遗产"
 jxp_b_regional_depth.505.d:0 "旧堡、教众与洋商契约仍影响岛上诸港。全盘抹去只会制造新的地下网络。"
 jxp_b_regional_depth.505.a:0 "审定旧约，择善沿用"
 jxp_b_regional_depth.505.b:0 "以军令重编诸港"
 jxp_b_regional_depth.506.t:0 "台湾海上公约"
 jxp_b_regional_depth.506.d:0 "社众、闽商与外来船主已经表态。台湾可以成为受约束的海上伙伴，也可以成为二十年军镇。"
 jxp_b_regional_depth.506.a:0 "签署社港共议之约"
 jxp_b_regional_depth.506.b:0 "设立二十年海防军镇"

 jxp_b_china_depth.601.t:0 "奉天第一议：朝贡与礼制"
 jxp_b_china_depth.601.d:0 "既欲承受天下之名，便须回答四方使节如何入贡、何者称臣、何者只行互市。礼仪不能只在庆典当日存在。"
 jxp_b_china_depth.601.a:0 "以厚赐和明文重建朝贡"
 jxp_b_china_depth.601.b:0 "先以武威定其名分"
 jxp_b_china_depth.602.t:0 "奉天第二议：驿路与贡道"
 jxp_b_china_depth.602.d:0 "自港口至京师的驿路、馆驿与仓场决定贡使能否抵达，也决定地方是否借机侵扰百姓。"
 jxp_b_china_depth.602.a:0 "整修贡道与馆驿"
 jxp_b_china_depth.602.b:0 "沿用地方承办旧例"
 jxp_b_china_depth.603.t:0 "奉天第三议：选官与监察"
 jxp_b_china_depth.603.d:0 "辽阔疆土不能只靠征服者亲信治理。旧臣、新进与地方士人之间必须建立可以追责的官僚秩序。"
 jxp_b_china_depth.603.a:0 "公开考核并遣巡察使"
 jxp_b_china_depth.603.b:0 "以捐纳填补官缺"
 jxp_b_china_depth.604.t:0 "奉天第四议：文教之争"
 jxp_b_china_depth.604.d:0 "日本武家传统与中国士大夫礼学既可相成，也可能彼此指斥为夷俗。朝廷必须给出容纳与裁断之法。"
 jxp_b_china_depth.604.a:0 "兼采两邦学统"
 jxp_b_china_depth.604.b:0 "以胜者之法压服异议"
 jxp_b_china_depth.605.t:0 "奉天第五议：边疆之治"
 jxp_b_china_depth.605.d:0 "贡道、官僚与文教既定，最后须为边疆军府、土官和互市划定常制。至此，天命不再只是战场上的宣称。"
 jxp_b_china_depth.605.a:0 "设边务院，终成奉天之制"

 jxp_b_china_depth.611.t:0 "礼仪第一议：四海诸使"
 jxp_b_china_depth.611.d:0 "琉球、朝鲜、对马与台湾各有自己的王统、通交和港市。礼仪共同体若要成立，必须先承认这些差异。"
 jxp_b_china_depth.611.a:0 "分别遣使，承认各邦旧例"
 jxp_b_china_depth.611.b:0 "只邀有力者赴会"
 jxp_b_china_depth.612.t:0 "礼仪第二议：港口与护航"
 jxp_b_china_depth.612.d:0 "使节与商舶共走一条海路。没有约定的停泊港、信牌和护航，礼仪很快会被海盗与缉私所吞没。"
 jxp_b_china_depth.612.a:0 "共同出资护航与馆驿"
 jxp_b_china_depth.612.b:0 "将通行牌照售予商帮"
 jxp_b_china_depth.613.t:0 "礼仪第三议：通事与书契"
 jxp_b_china_depth.613.d:0 "不同文字、历法与称谓会让善意变成侮辱。各国通事要求常设席位，而非临时听命于武官。"
 jxp_b_china_depth.613.a:0 "设四海通事馆"
 jxp_b_china_depth.613.b:0 "由私商自行翻译"
 jxp_b_china_depth.614.t:0 "礼仪第四议：海东大会"
 jxp_b_china_depth.614.d:0 "诸使齐集，却对座次、贡额和漂流民争执不休。会议能否延续，取决于我们是否愿意接受共同裁断。"
 jxp_b_china_depth.614.a:0 "以轮席之法维持大会"
 jxp_b_china_depth.614.b:0 "暗中收买反对者"
 jxp_b_china_depth.615.t:0 "礼仪第五议：海上仲裁"
 jxp_b_china_depth.615.d:0 "各邦同意把商债、扣船与漂流民交给常设会议裁断。一个不依赖单一王朝册封的海东礼仪圈由此成形。"
 jxp_b_china_depth.615.a:0 "立海东公议，终成礼仪之盟"

 jxp_b_china_depth.621.t:0 "破局第一议：远洋水师"
 jxp_b_china_depth.621.d:0 "若要打破大陆旧秩序，我们首先需要能越季风、守商路而非只在近岸决战的水师。"
 jxp_b_china_depth.621.a:0 "重金建造远洋船队"
 jxp_b_china_depth.621.b:0 "以旧船权充新军"
 jxp_b_china_depth.622.t:0 "破局第二议：自由港"
 jxp_b_china_depth.622.d:0 "海禁下的私商既是走私者，也是最熟悉航路的人。开放受监管的自由港将冲击旧有专卖。"
 jxp_b_china_depth.622.a:0 "开放数处受约束的自由港"
 jxp_b_china_depth.622.b:0 "只给亲信商家特许"
 jxp_b_china_depth.623.t:0 "破局第三议：保护小国"
 jxp_b_china_depth.623.d:0 "若我们只把沿海小国视为跳板，所谓新秩序不过是另一种朝贡。保护其航权才能换来真正盟友。"
 jxp_b_china_depth.623.a:0 "担保小国与岛邦航权"
 jxp_b_china_depth.623.b:0 "迫其提供军港与水手"
 jxp_b_china_depth.624.t:0 "破局第四议：废弛海禁"
 jxp_b_china_depth.624.d:0 "取消旧海禁会动摇官商、关吏与地方豪族的利益，也会让沿海社会第一次在明面上呼吸。"
 jxp_b_china_depth.624.a:0 "公布新海法，容许民船远航"
 jxp_b_china_depth.624.b:0 "让旧禁令成为索贿工具"
 jxp_b_china_depth.625.t:0 "破局第五议：海岸同盟"
 jxp_b_china_depth.625.d:0 "船队、自由港与小国担保终于连成一体。公司、地方港市与国家水师将共同维持这套危险而开放的海洋秩序。"
 jxp_b_china_depth.625.a:0 "立海岸同盟，终结旧日海禁"

 jxp_b_113_governed_province:0 "战后治理区"
 jxp_b_113_governed_province_desc:0 "此地仍处于二十年战后治理期；期限届满或国家提前结束体制时，临时标记将随之撤销。"
 jxp_b_113_governance_twenty_year_term:0 "二十年战后治理期"
 jxp_b_113_governance_twenty_year_term_desc:0 "军政、贡市或直辖衙署仍属战后权宜之制，必须经过三次巡察并在二十年后重新议定。"
 jxp_b_113_governance_transition_lock:0 "治理体制尚未届期"
 jxp_b_113_governance_transition_lock_desc:0 "仓促改制会使新领无所适从；常规转轨须留待终期大议。"
 jxp_b_113_governance_local_officers:0 "地方吏员入署"
 jxp_b_113_governance_local_officers_desc:0 "熟悉旧例的地方吏员进入新衙署，以收入让步换取较低的民间摩擦。"
 jxp_b_113_governance_hard_discipline:0 "军府重申纪律"
 jxp_b_113_governance_hard_discipline_desc:0 "军府以更严训练维持秩序，却也使征发与驻军压力上升。"
 jxp_b_113_governance_open_accounts:0 "公开贡赋账册"
 jxp_b_113_governance_open_accounts_desc:0 "港税、贡赋和包税账册向巡察者公开，贪墨渐受遏制。"
 jxp_b_113_governance_local_assembly:0 "地方名望合议"
 jxp_b_113_governance_local_assembly_desc:0 "地方旧族、商人和乡绅获准就赋役与诉讼共同陈议。"
 jxp_b_113_governance_normalized:0 "战后体制归入常制"
 jxp_b_113_governance_normalized_desc:0 "临时军政已经撤销，新领按照全国通行的奉行与州县制度治理。"
 jxp_b_113_governance_autonomous_settlement:0 "地方自治和约"
 jxp_b_113_governance_autonomous_settlement_desc:0 "国家承认地方议事与旧例，以较少直接收入换取长久安定。"
 jxp_b_113_regional_council_recent:0 "近期举行海外议约"
 jxp_b_113_regional_council_recent_desc:0 "使节、通事与财政仍被上一轮议约占用，暂不宜另开大会。"
 jxp_b_113_ryukyu_compact:0 "琉球互保通商约"
 jxp_b_113_ryukyu_compact_desc:0 "首里王府在保有自身法统的前提下，与日本建立护航、通商和争端裁断之约。"
 jxp_b_113_tsushima_mediation:0 "对马海峡调停"
 jxp_b_113_tsushima_mediation_desc:0 "宗氏、朝鲜译官与日本奉行共同维持书契、倭馆和漂流民规程。"
 jxp_b_113_northern_compact:0 "北海互市盟约"
 jxp_b_113_northern_compact_desc:0 "北海诸首领的渔场、商路和议席得到承认，互市因而较为稳定。"
 jxp_b_113_northern_coercion_burden:0 "北海贡役之怨"
 jxp_b_113_northern_coercion_burden_desc:0 "强制债役带来更多货物，也让北海社会对国家与商家长期怀恨。"
 jxp_b_113_taiwan_compact:0 "台湾社港公约"
 jxp_b_113_taiwan_compact_desc:0 "社众、闽商与港市代表共同议定垦殖、税契、护航和诉讼。"
 jxp_b_113_taiwan_military_settlement:0 "台湾海防军镇"
 jxp_b_113_taiwan_military_settlement_desc:0 "台湾诸港由军镇统筹二十年，海防增强而地方负担随之加重。"
 jxp_b_113_china_long_program:0 "重构中国与海东秩序"
 jxp_b_113_china_long_program_desc:0 "新秩序尚在十年国策中逐项建立，终局成就必须等待五议完成。"
 jxp_b_113_china_tribute_offices:0 "四夷贡道与边务院"
 jxp_b_113_china_tribute_offices_desc:0 "贡道、馆驿、监察与边疆互市被纳入一套可持续的奉天制度。"
 jxp_b_113_china_rites_network:0 "海东礼仪公议"
 jxp_b_113_china_rites_network_desc:0 "诸邦以通事馆、护航和常设仲裁维系不依赖单一册封者的礼仪网络。"
 jxp_b_113_china_maritime_order:0 "海岸自由港同盟"
 jxp_b_113_china_maritime_order_desc:0 "远洋水师、受监管自由港与小国航权担保共同打破旧海禁秩序。"

