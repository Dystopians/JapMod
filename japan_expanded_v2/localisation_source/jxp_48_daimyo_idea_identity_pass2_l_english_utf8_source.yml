l_english:
 jxp_oda_tenka_fubu:0 "天下布武"
 jxp_oda_tenka_fubu_desc:0 "“天下布武”四字并非只为夺城掠地而书。它把尾张的朱印、军役、道路与城下法度一并推向畿内，使旧秩序在新旗帜下重新排列。"
 jxp_oda_kenchi_registers:0 "朱印检地草案"
 jxp_oda_kenchi_registers_desc:0 "安土的账册丈量田亩、登记军役，也丈量诸豪族尚能任性的余地。谷川水涨，案牍灯明，天下先在纸上渐成一统。"
 jxp_mri_oe_lineage:0 "大江谱牒"
 jxp_mri_oe_lineage_desc:0 "毛利家以大江广元之后自许，谱牒不只是门第装饰，也是向公家、寺社与国人众开口说话的凭据。"
 jxp_mri_kokujin_ikki:0 "国人连判"
 jxp_mri_kokujin_ikki_desc:0 "安艺国人习惯以连判、起请与合议约束彼此。若能令其各守本分，小领之兵便可聚为一国之力。"
 jxp_ask_shugo_system:0 "守护职重申"
 jxp_ask_shugo_system_desc:0 "足利家不能只靠旧名分立于京都。重申守护役责、调停诸国争讼，才可使衰微的幕府重新有可用之手。"
 jxp_ouc_baekje_lineage:0 "百济旧绪"
 jxp_ouc_baekje_lineage_desc:0 "大内氏追述百济王族之源，使山口的馆阁在对朝鲜、九州与京都说话时多一重古雅而有力的名分。"
 jxp_ouc_hakata_city:0 "博多町座"
 jxp_ouc_hakata_city_desc:0 "博多商人熟知海路、银价、勘合与异国规矩。掌握此城者，往往也掌握西国通商的话语。"
 jxp_soo_elementary_school:0 "译馆乡校"
 jxp_soo_elementary_school_desc:0 "对马的纸笔常在两种文字之间往还。乡校与译馆使通交不再只依赖少数口舌，而成为一套可传授的技艺。"
 OGS_ideas_bonus:0 "弓马礼法"
 jxp_ogs_ogasawara_ryu:0 "小笠原流"
 jxp_ogs_ogasawara_ryu_desc:0 "小笠原流教人如何引弓、控马、临阵、侍坐。礼法若能入军法，山国武士便有共同的姿态与节度。"
 jxp_ito_gods_landing:0 "神降日向"
 jxp_ito_gods_landing_desc:0 "日向山川连着神代传说。守护此地者，不只是据有南九州边郡，也承受高千穗、鹈户与海风带来的古老威望。"
 jxp_ito_anti_shugo:0 "反守护连署"
 jxp_ito_anti_shugo_desc:0 "旧守护失德时，地方武家便以整顿庄乡之名相互连署。伊东家的扩张常披着恢复日向秩序的外衣。"
 jxp_kno_yuzuki_castle:0 "汤筑城奉行"
 jxp_kno_yuzuki_castle_desc:0 "汤筑城不只是一座山城，也是伊予诸郡诉讼、年贡与水军调发的枢纽。城中奉行使海陆两边都有账可查。"
 jxp_tti_wise_opportunist:0 "大和权衡"
 jxp_tti_wise_opportunist_desc:0 "筒井家居于寺社、国众与强邻之间，少有任意横冲的时候。能审时度势，便能把夹缝化为可谈判的地位。"
 jxp_tti_kofukuji_temple:0 "兴福寺学侣"
 jxp_tti_kofukuji_temple_desc:0 "兴福寺的学侣、庄园与僧兵旧网仍深系大和政局。借其文书与法脉，筒井可把争夺写成裁断。"
 RFR_ideas_start:0 "北奥南部传统"
 HTK_ideas_start:0 "河内被官传统"
 jxp_htk_retainers:0 "国人被官"
 jxp_htk_retainers_desc:0 "畠山旧领散落在河内、能登与纪伊的记忆里。重新收束国人与被官，靠的不是豪语，而是可供调发的家臣名簿。"
 jxp_ike_domain_schools:0 "藩校文教"
 jxp_ike_domain_schools_desc:0 "读书声进入武家屋敷，账册与经义并置案头。池田家训练的不是清谈之士，而是能在城下町办事的家臣。"
 SBA_ideas_start:0 "武卫家声"
 jxp_sba_military_office:0 "武卫奉公"
 jxp_sba_military_office_desc:0 "斯波旧称武卫，家声虽衰，奉公之名仍能召回一批熟知军役与仪礼的旧臣。"
 jxp_sba_three_provinces:0 "三国管领"
 jxp_sba_three_provinces_desc:0 "尾张、越前、远江的旧权并不相连，却都留下斯波文书与代官痕迹。重理三国旧账，才能使名分重新落地。"
 jxp_akm_western_kinai_claims:0 "西畿旧望"
 jxp_akm_western_kinai_claims_desc:0 "赤松的野心不止于播磨。只要畿内仍乱，旧守护便能把西国门户说成进取京洛的凭据。"
 jxp_tki_three_rivers:0 "三川治水"
 jxp_tki_three_rivers_desc:0 "木曾、长良、揖斐三川滋养美浓，也常以洪水警告人心。治水既是民政，也是军粮与工役的根本。"
