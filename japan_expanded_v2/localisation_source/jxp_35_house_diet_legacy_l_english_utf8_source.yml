l_english:
 jxp_decision_integrate_house_diet_law_title:0 "编入天下法度"
 jxp_decision_integrate_house_diet_law_desc:0 "本家尚为一方大名时定下的家法，如今必须越过旧领边界，成为天下诸国都能读懂的国制。旧朱印若要成为新法度，便需在评定所中重新誊写。"
 jxp_house_diet_legacy.1.t:0 "家法入国制"
 jxp_house_diet_legacy.1.d:0 "昔日城下评定，原只是为一国一郡、一门一家定分止争。如今诸道归于同一旗帜，旧家法被奉行取出，置于新制案头。有人说，昔日纸墨不足以治天下；也有人说，天下之治正当从本家最熟悉的纸墨开始。"
 jxp_house_diet_legacy.1.warrior_muster:0 "将军役帐扩为诸国军制。"
 jxp_house_diet_legacy.1.warrior_captain:0 "保留旗头机断以励诸将。"
 jxp_house_diet_legacy.1.court_rank:0 "令官途旧谱统入新朝仪。"
 jxp_house_diet_legacy.1.court_domain:0 "以本国代官法整饬诸道。"
 jxp_house_diet_legacy.1.maritime_port:0 "将浦方法度推及天下港市。"
 jxp_house_diet_legacy.1.maritime_admiral:0 "令船籍海番成为海军根本。"
 jxp_house_diet_legacy.1.frontier_barrier:0 "以境目番所法守诸道关隘。"
 jxp_house_diet_legacy.1.frontier_market:0 "以市口取次法通边地往来。"
 jxp_house_diet_legacy.1.temple_privilege:0 "将社寺旧例安堵纳入国制。"
 jxp_house_diet_legacy.1.temple_accounting:0 "以町座公账整顿寺社与市町。"
 jxp_house_diet_legacy.1.fallback:0 "先以奉行公账整理旧例。"
 jxp_35_legacy_warrior_muster_law:0 "天下军役帐"
 jxp_35_legacy_warrior_muster_law_desc:0 "本家旧日军役帐被扩为诸国军制。知行、番役与出阵次第不再只是旧领之事，而成天下武备的根本账册。"
 jxp_35_legacy_warrior_captain_privileges:0 "旗头机断国制"
 jxp_35_legacy_warrior_captain_privileges_desc:0 "诸将仍以誓纸担保忠勤，国家也承认战场上临机裁断的必要。军令与勇断由此并行。"
 jxp_35_legacy_court_rank_law:0 "朝仪官途总目"
 jxp_35_legacy_court_rank_law_desc:0 "官途、旧谱与奉书被纳入统一后的朝仪总目。新国家借古礼成其名，也以新秩序约束古礼。"
 jxp_35_legacy_court_domain_law:0 "诸道代官法"
 jxp_35_legacy_court_domain_law_desc:0 "本国代官法被推广到诸道。米仓、夫役与城下事务有了共同格式，远国文书也能被同一套眼光审阅。"
 jxp_35_legacy_maritime_port_law:0 "天下浦方法度"
 jxp_35_legacy_maritime_port_law_desc:0 "旧日浦方通航符成为天下港市的制度根基。诸港因账册相连，潮水带来的消息也更容易抵达中枢。"
 jxp_35_legacy_maritime_admiral_rolls:0 "诸海船籍帐"
 jxp_35_legacy_maritime_admiral_rolls_desc:0 "水军、商船与浦方人夫被编入诸海船籍。国家不只从陆上看海，也从每一张船籍看向远潮。"
 jxp_35_legacy_frontier_barrier_law:0 "诸道番所法"
 jxp_35_legacy_frontier_barrier_law_desc:0 "境目番所法被移用于天下关隘。山口、渡口与边城由此有了统一而可查的守备规矩。"
 jxp_35_legacy_frontier_market_charter:0 "边市取次国制"
 jxp_35_legacy_frontier_market_charter_desc:0 "边地市口与取次众成为国家伸向远方的手。商旅、土豪与使者在往来中被纳入同一套秩序。"
 jxp_35_legacy_temple_privilege_law:0 "社寺安堵国制"
 jxp_35_legacy_temple_privilege_law_desc:0 "社寺香火与门前町旧例被写入统一后的安堵制度。钟声与朱印各居其位，地方人心因此更易安定。"
 jxp_35_legacy_temple_accounting_law:0 "公界町座总账"
 jxp_35_legacy_temple_accounting_law_desc:0 "町座、寺社地与祭礼支出被纳入统一公账。市声依旧喧闹，但奉行案头已有天下可用的格式。"
