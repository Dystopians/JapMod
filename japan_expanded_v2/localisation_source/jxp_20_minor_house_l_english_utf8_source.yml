l_english:
 jxp_decision_ama_gassan_toda_registers_title:0 "整修月山富田城账"
 jxp_decision_ama_gassan_toda_registers_desc:0 "出云山间的支城、银山与国人众都需写入同一套账册。尼子家若能使月山富田成为山阴秩序的心脏，便可在强邻之间稳住根基。"
 jxp_decision_hsk_sakai_kanrei_council_title:0 "召集堺町管领评议"
 jxp_decision_hsk_sakai_kanrei_council_desc:0 "细川家在堺町与京洛之间拥有旧职、商路与人脉。把町人账目和管领名分合为议席，便能使旧权威重新有了财货之声。"
 jxp_decision_shn_dazaifu_brokers_title:0 "任命大宰府通事"
 jxp_decision_shn_dazaifu_brokers_desc:0 "少贰家夹在筑前、肥前与对马往来之间。通事、僧侣与船主若能各守本分，九州北门便不会只听海风摆布。"
 jxp_decision_ogs_suwa_horse_masters_title:0 "编录诹访马奉行"
 jxp_decision_ogs_suwa_horse_masters_desc:0 "信浓山道、木曾马与弓马礼法是小笠原家少有的坚实凭借。将马奉行纳入家法，可以使山国军役不再散漫。"
 jxp_decision_ktb_ise_court_petition_title:0 "奉呈伊势王统请文"
 jxp_decision_ktb_ise_court_petition_desc:0 "北畠家守在伊势神宫与南朝旧闻之间。请文若能连起神国礼法与公家记忆，本家便不只是伊势一隅的武门。"
 jxp_decision_akt_ezochi_trade_brokers_title:0 "设立虾夷地互市代官"
 jxp_decision_akt_ezochi_trade_brokers_desc:0 "安东家面向北海、陆奥与虾夷交易。互市代官既要识得船货，也要知道边地何时应以礼物相交，何时必须示威。"
 jxp_decision_cba_katori_muster_title:0 "香取神前军役"
 jxp_decision_cba_katori_muster_desc:0 "千叶家以关东旧名和香取神宫维系武家声望。神前点兵使地方武士记得，刀枪也需共同见证。"
 jxp_decision_isk_tango_port_wardens_title:0 "任命丹后港奉行"
 jxp_decision_isk_tango_port_wardens_desc:0 "一色家守着丹后海岸与天桥立名胜。港奉行能把船手、仓屋与山路文书连起来，使窄小海国有更灵活的耳目。"
 jxp_decision_ito_hyuga_fort_network_title:0 "整饬日向四十八城"
 jxp_decision_ito_hyuga_fort_network_desc:0 "伊东家依靠山城、支砦与地方豪族守护日向。城网若能彼此呼应，偏远南国也能让敌人寸步难行。"
 jxp_decision_kno_inland_sea_pilots_title:0 "招募濑户内水先众"
 jxp_decision_kno_inland_sea_pilots_desc:0 "河野家离不开伊予港津、岛屿与熟悉潮汐的船手。水先众能使濑户内的狭海成为家中熟悉的战场。"
 jxp_decision_tti_yamato_temple_compact_title:0 "订立大和寺社约"
 jxp_decision_tti_yamato_temple_compact_desc:0 "筒井家身处兴福寺、春日社与奈良町之间。寺社约法并非退让，而是让大和诸势在同一张纸上承认秩序。"
 jxp_decision_rfr_mutsu_nine_gates_title:0 "修筑陆奥九户关门"
 jxp_decision_rfr_mutsu_nine_gates_desc:0 "南部家北地漫长，关门、牧场与山路支撑着奥州边防。若能修整九户诸关，雪国道路也会成为可用的国政。"

