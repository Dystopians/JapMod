 jxp_minor_house.1.t:0 "月山阴影"
 jxp_minor_house.1.d:0 "月山富田城俯视出云山路，银山、社寺与国人众都在它的阴影中议价。尼子家必须决定，是先把城砦账簿收束为山阴军法，还是把海岸商路纳入更宽阔的视野。"
 jxp_minor_house.1.a:0 "让月山诸城听命。"
 jxp_minor_house.1.b:0 "让山阴海路入账。"
 jxp_minor_house.2.t:0 "堺町评议"
 jxp_minor_house.2.d:0 "细川家旧为管领，堺町却提醒家臣：名分若无财货支撑，便只是空文。町人要求商路安全，旧臣要求恢复席次，两者未必不能同坐一处。"
 jxp_minor_house.2.a:0 "使堺町账目进入评议。"
 jxp_minor_house.2.b:0 "先以旧职摄服诸家。"
 jxp_minor_house.3.t:0 "大宰府来书"
 jxp_minor_house.3.d:0 "少贰家旧名连着大宰府，现实却连着港口、通事与朝鲜海路。书札抵达时带着盐味，提醒我们九州北门从不只面对陆上敌人。"
 jxp_minor_house.3.a:0 "任通事调停诸路。"
 jxp_minor_house.3.b:0 "使港船先探风向。"
 jxp_minor_house.4.t:0 "诹访马声"
 jxp_minor_house.4.d:0 "信浓山路传来马铃，诹访社的祭礼与小笠原弓马礼法交织在一起。山国兵力不多，却能因纪律和熟路而胜过轻慢之敌。"
 jxp_minor_house.4.a:0 "把马奉行写入家法。"
 jxp_minor_house.4.b:0 "以神社礼法稳住山国。"
 jxp_minor_house.5.t:0 "伊势请文"
 jxp_minor_house.5.d:0 "神宫近在伊势，南朝旧闻仍在家中被小心保存。北畠家既可借礼法为自己镀上王统色彩，也可先把神郡账册收为可用政务。"
 jxp_minor_house.5.a:0 "奉呈王统请文。"
 jxp_minor_house.5.b:0 "先整神郡本领。"
 jxp_minor_house.6.t:0 "北海互市"
 jxp_minor_house.6.d:0 "安东家的船只向北寻得鱼货、毛皮与异族消息。边境贸易既有利，也有危险，代官若太软则被轻视，太硬又会断绝道路。"
 jxp_minor_house.6.a:0 "以代官约束互市。"
 jxp_minor_house.6.b:0 "以亲族武威守北地。"
 jxp_minor_house.7.t:0 "香取誓刀"
 jxp_minor_house.7.d:0 "千叶家武士在香取神前陈列刀枪，关东旧名与武艺传统一同被唤醒。若能使誓刀成为军役之法，下总诸郡便不会各自为阵。"
 jxp_minor_house.7.a:0 "以神前军役召集诸士。"
 jxp_minor_house.7.b:0 "向关东旧家修书。"
 jxp_minor_house.8.t:0 "丹后海雾"
 jxp_minor_house.8.d:0 "丹后海岸雾气深重，港町、天桥立与山路关所相互依存。一色家若能任用港奉行，便可把小海国的消息织成细网。"
 jxp_minor_house.8.a:0 "令港奉行巡查泊地。"
 jxp_minor_house.8.b:0 "先整丹后道中账册。"
 jxp_minor_house.9.t:0 "日向四十八砦"
 jxp_minor_house.9.d:0 "日向山河纵横，伊东家的支城如锁链般横在敌路之前。地方豪族愿守城，却也要求本家尊重旧约与祭礼。"
 jxp_minor_house.9.a:0 "让支城彼此呼应。"
 jxp_minor_house.9.b:0 "以礼法安抚山中诸众。"
 jxp_minor_house.10.t:0 "濑户内潮路"
 jxp_minor_house.10.d:0 "河野家的船手熟悉伊予海岸与岛影潮汐。濑户内之海看似狭小，却足以容纳贸易、护航与突袭三种命运。"
 jxp_minor_house.10.a:0 "招募水先众。"
 jxp_minor_house.10.b:0 "先稳住岛屿诸族。"
 jxp_minor_house.11.t:0 "奈良寺钟"
 jxp_minor_house.11.d:0 "筒井家在大和行事，绕不开兴福寺、春日社与奈良町。寺钟响起时，武士、僧众与町人都在等待本家给出可遵循的约法。"
 jxp_minor_house.11.a:0 "订立寺社约法。"
 jxp_minor_house.11.b:0 "把诸寺账册纳入本领。"
 jxp_minor_house.12.t:0 "陆奥九户"
 jxp_minor_house.12.d:0 "南部家北地辽阔，九户诸关、牧场与雪中山路让军令传递格外艰难。若能修筑关门，边地就不再只是遥远的负担。"
 jxp_minor_house.12.a:0 "修整九户关门。"
 jxp_minor_house.12.b:0 "让北海商书通行。"

 jxp_minor_house.101.t:0 "尼子月山天下"
 jxp_minor_house.101.d:0 "由尼子家而成的日本记得月山富田之制。山城、银山与国人誓纸被纳入天下政务，山阴旧法成为守国之术。"
 jxp_minor_house.102.t:0 "细川堺町入政"
 jxp_minor_house.102.d:0 "细川家统一日本后，堺町商账与管领旧职同入国政。新朝学会让贸易声与礼法声在同一间评议所里相互节制。"
 jxp_minor_house.103.t:0 "少贰大宰府通交"
 jxp_minor_house.103.d:0 "少贰家把大宰府旧名、对马海路与九州港口写入天下秩序。北门通交从地方技艺变成国家制度。"
 jxp_minor_house.104.t:0 "小笠原山路弓马"
 jxp_minor_house.104.d:0 "小笠原家统一日本后，信浓山路与弓马礼法成为新朝训练武士、通达关路的范式。"
 jxp_minor_house.105.t:0 "北畠伊势王统"
 jxp_minor_house.105.d:0 "北畠家的伊势经验使新日本格外重视神宫、旧仪与王统叙事。礼法不再只是装饰，而是国家合法性的骨架。"
 jxp_minor_house.106.t:0 "安东北海互市"
 jxp_minor_house.106.d:0 "安东家统一日本后，北海互市被纳入国家视野。边地不再是尽头，而是通往毛皮、鱼货与远方消息的门户。"
 jxp_minor_house.107.t:0 "千叶香取武门"
 jxp_minor_house.107.d:0 "千叶家把香取神前的誓刀推广到天下武士。关东旧名与军役制度在新朝中合为一体。"
 jxp_minor_house.108.t:0 "一色丹后海道"
 jxp_minor_house.108.d:0 "一色家统一日本后，丹后港奉行的经验被用于整理诸海岸。小港、关所与山路文书皆成为国家耳目。"
 jxp_minor_house.109.t:0 "伊东日向城网"
 jxp_minor_house.109.d:0 "伊东家的日向城网成为新日本山地防务的样本。支城不再只是地方壁垒，而是国家纵深的一部分。"
 jxp_minor_house.110.t:0 "河野濑户内水军"
 jxp_minor_house.110.d:0 "河野家统一日本后，濑户内的潮汐知识被升格为国家水军制度。岛影与狭海从此皆可入图。"
 jxp_minor_house.111.t:0 "筒井大和寺社法"
 jxp_minor_house.111.d:0 "筒井家由大和寺社间学来的调停术，成为新朝处理寺门、町人和武家关系的细密法度。"
 jxp_minor_house.112.t:0 "南部陆奥关门"
 jxp_minor_house.112.d:0 "南部家把陆奥九户、牧场和雪路经验带入天下政务。北方关门从边地防线变成国家的长远眼界。"
 jxp_minor_house.legacy.a:0 "让小家旧法入天下。"
