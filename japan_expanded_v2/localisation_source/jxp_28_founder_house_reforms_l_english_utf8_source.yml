l_english:
 jxp_founder_house_constitution:0 "建国家门遗制"
 jxp_reform_founder_oda_azuchi_statutes:0 "安土开府令"
 jxp_reform_founder_oda_azuchi_statutes_desc:0 "安土的城郭虽化作灰烬，其令书、乐市札与检地草案仍可化为新日本的根本法。统一号令越过诸藩旧界，道路、市町与领主之权皆由中枢重新定分；所谓天下布武，至此也成为一套可以长久施行的国制。"
 jxp_reform_founder_tkg_mikawa_fudai_code:0 "三河谱代家法"
 jxp_reform_founder_tkg_mikawa_fudai_code_desc:0 "谱代、目付、奉行与宿驿被编入谨慎而耐久的家法之中。其道不尚奇锋，却能使大国在平日里安静运转，在风雨来时仍有旧臣守住中枢。"
 jxp_reform_founder_tkd_koshu_military_law:0 "甲州军法"
 jxp_reform_founder_tkd_koshu_military_law_desc:0 "山国旧法把马印、堤防、金山与军役写进同一册籍。赤备之名不只在阵前驰骋，也在边郡、关隘与山路之间维系严整的国制。"
 jxp_reform_founder_ues_kanto_justice:0 "关东义名裁断"
 jxp_reform_founder_ues_kanto_justice_desc:0 "越后旧臣以关东管领之名重申武家裁断。义名若能落到诉状、誓纸与军纪之中，便不只是清谈，而是足以使诸家低首的公道。"
 jxp_reform_founder_hjo_odawara_cadasters:0 "小田原评定检地"
 jxp_reform_founder_hjo_odawara_cadasters_desc:0 "北条式评定把郡中账册、德政条目与总构城防并置案前。民户知其所归，城砦知其所守，关东旧法由此成为统一国家的日用之术。"
 jxp_reform_founder_mri_setouchi_admiralty:0 "濑户内船奉行"
 jxp_reform_founder_mri_setouchi_admiralty_desc:0 "三矢之训被刻入船籍与港法，西国水军、商船与浦町同受奉行管辖。山盟与海路相互支撑，使濑户内潮声化作国家的脉搏。"
 jxp_reform_founder_smz_satsuma_gunnery:0 "萨摩铁炮奉行"
 jxp_reform_founder_smz_satsuma_gunnery_desc:0 "种子岛的火声、萨南的外学与武家严厉的军纪被收束于同一奉行所。远来器物须经本国号令重铸，方能由奇技变为国用。"
 jxp_reform_founder_otm_funai_arsenal:0 "府内国崩炮所"
 jxp_reform_founder_otm_funai_arsenal_desc:0 "府内旧商馆与国崩炮铸造簿一并交付军奉行。铸炮师、火药役、攻城头与随军通词按官样编籍，异国大筒遂不再是港町奇货，而成为围城、守备与军需调发的常备制度。"
 jxp_reform_founder_dte_oshu_cavalry_envoys:0 "奥州骑马与远使录"
 jxp_reform_founder_dte_oshu_cavalry_envoys_desc:0 "奥州马籍、黑胴具足与远征使录同入军府。骑马队既习山野驰突，也承担远境侦候与使节护送；独眼龙留下的不是一场奇行，而是一套令边军看见更远世界的军政传统。"
 jxp_reform_founder_ask_muromachi_office:0 "室町奉公众"
 jxp_reform_founder_ask_muromachi_office_desc:0 "奉公众名册、将军家礼法与东山旧仪被重新整理。奏者、奉行与近习各有职掌，地方诉请和宫廷往来不再尽系于君主一人；旧幕府的官职记忆由此化为新中枢的分工之法。"
 jxp_reform_founder_csk_tosa_ichiryo_gusoku:0 "土佐一领具足令"
 jxp_reform_founder_csk_tosa_ichiryo_gusoku_desc:0 "一领具足既耕田，也披甲；既守乡里，也奉军役。土佐旧制被写入新法后，田亩、仓廪与刀枪不再彼此分离。"
 jxp_reform_founder_ouc_yamaguchi_court:0 "山口西京通商府"
 jxp_reform_founder_ouc_yamaguchi_court_desc:0 "大内旧府曾容纳文人、博多商贾、佛寺与朝鲜使者。勘合、关税、馆舍与贡礼由同一厅堂核验，使西国的雅驯不止见于诗会，也落实在可计量、可守信的海陆商路上。"
 jxp_reform_founder_img_tokaido_lawbooks:0 "东海道假名目录"
 jxp_reform_founder_img_tokaido_lawbooks_desc:0 "桶狭间的败绩不能抹去今川治国文书的精密。假名目录把宿驿、诉讼、婚盟、家臣秩序与东海道诸城写成官吏可循的成文程式，使旧家法成为新官僚制的案头准绳。"
 jxp_reform_founder_soo_tsushima_wakan:0 "对马倭馆通商司"
 jxp_reform_founder_soo_tsushima_wakan_desc:0 "对马之长不在广土，而在狭海之间使言语、银货与商约不断。倭馆账册、通事名簿和渡海朱印皆归通商司核验，海峡遂成为一座随船帆往来的税关与交易所。"
 jxp_reform_founder_ama_gassan_toda_law:0 "月山富田国人法"
 jxp_reform_founder_ama_gassan_toda_law_desc:0 "尼子旧臣以月山富田为凭，重订山阴国人众的誓纸与城砦职责。山城、社领与津口相互牵连，遂成一张耐久的地方治理之网。"
 jxp_reform_founder_asa_ichijodani_council:0 "一乘谷评议"
 jxp_reform_founder_asa_ichijodani_council_desc:0 "一乘谷旧日文书、越前纸与城下町法被纳入常设评议。文治不必软弱；当账册、书状与奉行制度彼此扣合，国政便有了温和而坚韧的形状。"
 jxp_reform_founder_hsk_sakai_kanrei_compact:0 "堺町管领议政"
 jxp_reform_founder_hsk_sakai_kanrei_compact_desc:0 "细川管领旧名与堺町商人会议相互借力。朝廷、幕府旧职与町众财力若能坐在同一席上，便能把纷乱的畿内重新缝合为政务。"
 jxp_reform_founder_htk_wakae_retainer_law:0 "若江被官誓约"
 jxp_reform_founder_htk_wakae_retainer_law_desc:0 "畠山两流之争留下的教训，被写成约束被官、佣兵与河内城众的誓约。旧裂痕未必只能削弱国家，也能提醒中枢如何防止家门再度分崩。"
 jxp_reform_founder_ike_himeji_stewards:0 "姬路白城奉行"
 jxp_reform_founder_ike_himeji_stewards_desc:0 "池田旧臣整理姬路城下、濑户内账目与仓廪收支。白城不仅是威仪，也是丈量民户、整饬财用、安排道路与町割的可见核心。"
 jxp_reform_founder_mae_kaga_million_koku:0 "加贺百万石财用"
 jxp_reform_founder_mae_kaga_million_koku_desc:0 "加贺的米谷、金银、手工业与城下消费被汇入百万石财用。茶汤、能乐与学问仍受庇护，却不再只是豪奢；厚实仓廪所生的余裕，正是文治与长期统治的根基。"
 jxp_reform_founder_sba_buei_offices:0 "武卫旧职"
 jxp_reform_founder_sba_buei_offices_desc:0 "斯波武卫之名虽历经衰微，仍保存着北国道路、幕府官职与军役旧例。将诉讼、军役与地方奏报分交相应官署，旧名便不再只是门第装饰，而成为约束中枢职权的成文先例。"
 jxp_reform_founder_ymn_roku_bun_ichi_domain:0 "六分一殿诸国册"
 jxp_reform_founder_ymn_roku_bun_ichi_domain_desc:0 "山名旧望曾号称六分一殿，其盛衰皆与诸国守护、道路、城仓和誓纸相连。将分散在山阴山阳的郡县、军粮与代官关系重新入册，旧势族之网便可转化为中央治理远国的行政骨节。"
 jxp_reform_founder_rfr_mutsu_nine_gates:0 "陆奥九户关门"
 jxp_reform_founder_rfr_mutsu_nine_gates_desc:0 "南部北奥之治立于寒地、马牧、关门与粮仓之间。九户之名提醒中枢，遥远边郡也需要被看见、被供给、被纳入同一军政秩序。"
 jxp_reform_founder_ktb_ise_court_law:0 "伊势王统社法"
 jxp_reform_founder_ktb_ise_court_law_desc:0 "北畠旧臣以南朝余绪、伊势神宫与国司旧职为据，重修社领与王统礼法。神宫所在不只是信仰之地，也是一套使名分落地的古老制度。"
 jxp_reform_founder_akm_harima_castle_roads:0 "播磨赤松城路"
 jxp_reform_founder_akm_harima_castle_roads_desc:0 "赤松旧旗连接播磨城道、山阳要口与被官誓约。城砦若只为固守，终会孤立；若与道路、军粮和传令相连，便能成为国家筋骨。"
 jxp_reform_founder_akt_ezochi_brokers:0 "虾夷地互市奉行"
 jxp_reform_founder_akt_ezochi_brokers_desc:0 "安东旧商站把北奥、虾夷地与海峡贸易连成寒雾中的路线。边境不只是防线，也可能是通商、翻译与调停的前厅。"
 jxp_reform_founder_cba_katori_muster:0 "香取武门名簿"
 jxp_reform_founder_cba_katori_muster_desc:0 "千叶旧家以香取、下总与坂东武者名簿为凭。把神社誓约和武门军役合为一册，关东旧族便能在新日本中重新找到位置。"
 jxp_reform_founder_isk_tango_port_wardens:0 "丹后港津奉行"
 jxp_reform_founder_isk_tango_port_wardens_desc:0 "一色旧臣熟悉丹后海口、港税与山阴往来。港津奉行登记船手、核验商货、修备码头并转呈海上警讯，使小港不只是一处锚地，也成为国家经济网络中的正式关节。"
 jxp_reform_founder_ito_hyuga_fort_network:0 "日向四十八城"
 jxp_reform_founder_ito_hyuga_fort_network_desc:0 "伊东旧家以日向诸城、山路与社寺关系维系南九州一隅。城网若经新朝整理，便可使远方郡县不再只听见边境风声。"
 jxp_reform_founder_kkc_aso_rite_council:0 "火国阿苏礼议"
 jxp_reform_founder_kkc_aso_rite_council_desc:0 "菊池与阿苏的旧缘把九州武名、社家礼法与国人调停连在一起。火国诸社若能被温和纳入国制，便可减少地方信仰与新政之间的冲突。"
 jxp_reform_founder_kno_setouchi_pilot_law:0 "河野濑户内水先法"
 jxp_reform_founder_kno_setouchi_pilot_law_desc:0 "河野水军熟知潮汐、浦口与濑户内暗礁。水先人、船籍和海峡警讯被国家承认后，旧水军不再只是地方豪强，而是海路秩序的一部分。"
 jxp_reform_founder_ogs_suwa_horse_archery:0 "诹访弓马山路"
 jxp_reform_founder_ogs_suwa_horse_archery_desc:0 "小笠原礼法与诹访山路相互交织，弓马之术既是武艺，也是约束武家举止的礼。新日本借此让骑射、行军与礼仪同出一门。"
 jxp_reform_founder_shn_dazaifu_brokerage:0 "大宰府通交所"
 jxp_reform_founder_shn_dazaifu_brokerage_desc:0 "少贰旧臣熟悉九州门户、寺社人脉与对外通交。大宰府旧名被重新启用，使海西消息、商约和使节往来各有归处。"
 jxp_reform_founder_stk_hitachi_warrior_rolls:0 "常陆武士军役簿"
 jxp_reform_founder_stk_hitachi_warrior_rolls_desc:0 "佐竹旧家把常陆武士、鹿岛神名与东北门户连在一处。军役簿若能兼顾名分和实用，坂东武者便会成为新朝可靠的柱石。"
 jxp_reform_founder_tki_mino_river_offices:0 "美浓川并奉行"
 jxp_reform_founder_tki_mino_river_offices_desc:0 "土岐旧领的河川、纸业与关隘让美浓成为东国与畿内之间的要冲。川并奉行使水路、堤防和町场生产都进入同一套账目。"
 jxp_reform_founder_utn_nikko_barrier_guard:0 "日光关防使"
 jxp_reform_founder_utn_nikko_barrier_guard_desc:0 "宇都宫旧家以日光、关东北门与寺社守护为重。关防之法不仅守路，也守名分，使北关东的神佛与武家各安其位。"
 jxp_reform_founder_tti_yamato_temple_compact:0 "大和寺社公约"
 jxp_reform_founder_tti_yamato_temple_compact_desc:0 "筒井旧臣最懂大和寺社、城众与畿内文书之间的微妙平衡。寺社公约把旧特权化作可谈判的公法，使圣地附近少些私斗，多些章程。"
 jxp_reform_founder_generic_renovated_japan:0 "再造日本国制"
 jxp_reform_founder_generic_renovated_japan_desc:0 "若新日本并非由某一家门的旧法直接奠基，便须在君权与诸国共议之间重新编织制度。旧幕、朝廷、寺社、市町与武家各献一端，既承认统一中枢，也以成文章程限制恣意，共成再造之国。"
