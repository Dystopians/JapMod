l_english:
 jxp_b_92_decision_negotiate_south_seas_japan_town_title:0 "与南洋王权议定日本町"
 jxp_b_92_decision_negotiate_south_seas_japan_town_desc:0 "南洋诸港自有王法、商路与城中社群，并非任人插旗的空地。我们可以携朱印状、礼物与通事前往一位友好的当地君主之廷，请求在其法律保护下划出日本商民居住的港区；最终是否准许，仍由主人决定。"
 jxp_b_92_decision_establish_administered_japan_town_title:0 "设立奉行直辖日本町"
 jxp_b_92_decision_establish_administered_japan_town_desc:0 "我们已经通过购买、受让或战争取得南洋港口。若要让商人、通事、佣兵与家眷在此长久居住，便须把临时船宿改为有町规、会所和奉行的聚落，并明确它与周围社会的权利边界。"
 jxp_b_92_decision_convene_pacific_island_compact_title:0 "召集群岛盟誓"
 jxp_b_92_decision_convene_pacific_island_compact_desc:0 "岛屿不是海图上的淡水符号。航海者赖以穿越大洋的风名、礁路与季节知识，世代属于岛上诸社与王权。我们应当在已据有的岛港召开盟誓，决定移民、岛民、航海师与驻军如何共同治理。"
 jxp_b_92_decision_organize_north_pacific_exchange_title:0 "编成北洋互市"
 jxp_b_92_decision_organize_north_pacific_exchange_desc:0 "从虾夷、桦太到阿留申，海雾、严冬和漫长航季使永久占领远比账册上艰难。依靠阿伊努与北方诸族的中介、季节性渔猎据点和寒港救济，或以武家与水军严密统辖，将决定北洋边疆的形貌。俄罗斯及其他北方来船出现后，还须决定如何竞市。锁国之世也只能在既有受控窗口下维持有限互市。"
 jxp_b_92_decision_found_western_shore_machiya_title:0 "建立彼岸日町"
 jxp_b_92_decision_found_western_shore_machiya_desc:0 "跨过太平洋之后，码头并不能自行长成社会。我们必须为土地、町役、地方会议、殖民军役和与原住诸社的约书定下规矩。若海图由天意重新绘成，此举将改以任何已控制的新大陆海港为据，不会因旧地名消失而中断。"
 jxp_b_92_decision_bind_transpacific_settlement_arc_title:0 "联结北南殖民航路"
 jxp_b_92_decision_bind_transpacific_settlement_arc_desc:0 "孤立的寒港、日町和银船尚不足以构成太平洋国家。只有把北方航季、南方市场、船期、议事代表与救济仓连成一体，彼岸诸社才会意识到自己同属一条跨洋政治道路。随机新大陆中，则以三座以上的新大陆海港构成等价的航路骨架。"

 jxp_b_92_south_seas_treaty_request_tt:0 "一位与我国互信的东南亚君主将收到港区请约；对方可以批准，也可以拒绝。"
 jxp_b_92_administered_japan_town_tt:0 "在我国直接治理的南洋港口建立日本町，并由随后召开的评议决定其制度。"
 jxp_b_92_pacific_island_compact_tt:0 "在一座太平洋岛港确立岛民、移民与航海者的共同秩序，而非仅把它当作补给站。"
 jxp_b_92_north_pacific_exchange_tt:0 "把北方中介、季节据点与寒港航季编成长期制度，并召开一次北洋经略评议。"
 jxp_b_92_western_shore_machiya_tt:0 "在正常海图的加利福尼亚、卡斯卡迪亚或阿拉斯加，或在随机新大陆的任一受控海港建立彼岸日町。"
 jxp_b_92_transpacific_settlement_arc_tt:0 "把北方与南方殖民港编入共同船期；随机新大陆以至少三座新大陆海港作为替代条件。"
 jxp_b_92_host_grant_charter_tt:0 "港区仍服从本国法律和税制；日本商民将取得受保护的居住、祭祀与交易权。"
 jxp_b_92_host_refuse_charter_tt:0 "拒绝划出外国港区；来使只带回部分未用的交涉经费，五年内不得再次请约。"
 jxp_b_92_south_seas_merchant_model_tt:0 "商人头人与通事获得较大自治，聚落认同和地方合作增长，中央掌握相对减弱。"
 jxp_b_92_south_seas_magistrate_model_tt:0 "港务奉行掌握船籍、军役与税册，中央控制增强，但地方头人的信任有所下降。"
 jxp_b_92_south_seas_faith_model_tt:0 "寺院、教会、会众或施济所成为聚落核心，强化共同生活和地方盟约，同时保留较强自治。"
 jxp_b_92_island_council_model_tt:0 "承认岛上王权、婚姻网络与共同议事，换取可靠的地方合作和逐渐生长的群岛身份。"
 jxp_b_92_island_navigation_model_tt:0 "让岛民航海师与移民水手共同传授星路、风名和礁道，塑造独立于旧大陆的海洋经验。"
 jxp_b_92_island_faith_model_tt:0 "以寺院、教会或施济所连接岛社，尊重地方礼俗并形成跨岛教育与救济网络。"
 jxp_b_92_island_garrison_model_tt:0 "设置由国家供饷的水军屯驻地；防务和中央控制增强，岛社议事空间则相应缩小。"
 jxp_b_92_north_ainu_model_tt:0 "承认阿伊努及北方诸族的中介权，以公平秤量、季节约书和人质保护维持互市。"
 jxp_b_92_north_frontier_model_tt:0 "以边疆武士、土地军役与冬季堡仓守卫寒港；中央控制增强，但地方盟约承受压力。"
 jxp_b_92_north_free_harbor_model_tt:0 "让商社、船主与私帆自行承担寒海风险；边疆身份迅速成长，旧大陆更难逐船管束。"
 jxp_b_92_north_competition_model_tt:0 "设竞市奉行统筹毛皮价格、护航和情报，以有代价的国家干预应对俄罗斯及其他北方来船。"
 jxp_b_92_north_relief_model_tt:0 "由寺院、会众和施济所照料病员、遇难船员与饥荒聚落，以救济换取跨族群信任。"
 jxp_b_92_north_state_harbor_model_tt:0 "以奉行、水军和官仓经营寒港，确保船期与补给服从国家经略。"
 jxp_b_92_west_land_compact_model_tt:0 "同当地诸社重订土地与水源边界，并让町代表进入地方会议；彼岸共同体因而更稳固。"
 jxp_b_92_west_military_model_tt:0 "以军役换取土地，把移民编入边疆备队；中央掌握增强，却加深土地争端。"
 jxp_b_92_west_silver_model_tt:0 "让港商承接墨西哥白银、铜与生丝船期；跨洋身份和宗主税收增长，地方盟约受到商利挤压。"
 jxp_b_92_rnw_land_compact_model_tt:0 "不借用旧海图的地名，与新发现海岸上的诸社重订土地、水源和议事规则。"
 jxp_b_92_rnw_military_model_tt:0 "以军役地和堡仓固定新海岸据点；中央掌握增强，土地冲突也随之加剧。"
 jxp_b_92_rnw_trade_model_tt:0 "根据新海图重排船期与市场，让彼岸港市成为跨洋商路的一端。"
 jxp_b_92_arc_convoy_model_tt:0 "由宗主奉行统一船籍、护航和仓储分摊；跨洋身份与中央协调一同增强。"
 jxp_b_92_arc_delegate_model_tt:0 "让各港派代表共同制定船期、救济与土地规则；地方盟约增强，宗主直接控制相对减弱。"
 jxp_b_92_rnw_arc_convoy_model_tt:0 "在变动海图上由国家统一测绘、船籍与护航，使分散海港形成共同航路。"
 jxp_b_92_rnw_arc_delegate_model_tt:0 "由新大陆各港互派代表，以共同约书替代旧世界并不存在的地理名目。"

 jxp_b_regional_colonial.1.t:0 "来自日轮之国的港区请约"
 jxp_b_regional_colonial.1.d:0 "日本来使携朱印状、铜银礼物和数名通事抵达宫廷，请求在我国一座海港划出商民居住区。他们承诺缴纳港税、服从本国刑律，并在战争时关闭武器交易；作为交换，日本町希望保有自己的会所、祭祀与内部仲裁。批准此约能引来船货，也会在城中安置一个日渐壮大的外来社群。"
 jxp_b_regional_colonial.1.a:0 "准其立町，但港区仍在我国王法之下。"
 jxp_b_regional_colonial.1.b:0 "谢绝来使，不让外国会所在城中扎根。"
 jxp_b_regional_colonial.2.t:0 "港区由谁主持"
 jxp_b_regional_colonial.2.d:0 "仓库、町屋和翻译所已经沿港铺开。商人头人要求沿用航次推举的会所，奉行坚持把船籍和军役纳入官署，宗教团体则愿以学校、施济和祭所维系家眷。这个选择将决定日本町究竟是商路上的自治社群、国家前哨，还是信仰共同体。"
 jxp_b_regional_colonial.2.a:0 "由商人头人与通事组成会所。"
 jxp_b_regional_colonial.2.b:0 "设港务奉行，点验船籍与军役。"
 jxp_b_regional_colonial.2.c:0 "让寺院、教会或会众承担町中事务。"
 jxp_b_regional_colonial.3.t:0 "群岛不是空白海图"
 jxp_b_regional_colonial.3.d:0 "岛上首领带来祖传的礁路、风名和捕鱼界线，移民则要求耕地、码头与祭所。水军把这里看作舰队锚地，教团希望兴建学校和施济屋。若无一部能约束所有人的盟誓，所谓中继港只会在第一场旱季或争地中崩解。"
 jxp_b_regional_colonial.3.a:0 "以婚盟与议事承认岛社权利。"
 jxp_b_regional_colonial.3.b:0 "共建航海传习所，保存星路与风名。"
 jxp_b_regional_colonial.3.c:0 "以寺院、教会和施济屋连接诸岛。"
 jxp_b_regional_colonial.3.e:0 "筑官仓与炮台，编为水军屯驻地。"
 jxp_b_regional_colonial.4.t:0 "北海的中介者"
 jxp_b_regional_colonial.4.d:0 "冬雾封住海峡时，只有熟悉鲑汛、毛皮集市和避风湾的北方中介还能维持往来。阿伊努头人要求公平秤量和人质保护，边疆武士请求军役地，商社愿自行承担风险；俄罗斯及其他北方来船则在争购毛皮。宗教团体还看到冻伤者与饥民。北洋不会服从一纸命令；它将由我们选择依靠的人塑造。"
 jxp_b_regional_colonial.4.a:0 "以阿伊努中介和季节约书维持互市。"
 jxp_b_regional_colonial.4.b:0 "授边疆武士军役地，修筑冬堡。"
 jxp_b_regional_colonial.4.c:0 "把寒港交给商社与私帆经营。"
 jxp_b_regional_colonial.4.g:0 "设竞市奉行，应对俄罗斯与北方来船。"
 jxp_b_regional_colonial.4.e:0 "建立寺院、会众与施济仓网络。"
 jxp_b_regional_colonial.4.f:0 "由国家水军、奉行和官仓统辖。"
 jxp_b_regional_colonial.5.t:0 "金色海岸的土地与町"
 jxp_b_regional_colonial.5.d:0 "彼岸港口已能容纳越冬船队，随船而来的农户、浪人、工匠和第二代子弟却在追问更难的问题：谁有权划分土地，谁承担军役，地方议事是否要听从跨洋而来的奉行？附近诸社也带着水源与猎场的旧约前来。码头之外，真正的殖民社会正在形成。"
 jxp_b_regional_colonial.5.a:0 "重订土地约书，让町代表参与地方会议。"
 jxp_b_regional_colonial.5.b:0 "以军役换土地，编成彼岸备队。"
 jxp_b_regional_colonial.5.c:0 "让银船与港商支撑聚落扩张。"
 jxp_b_regional_colonial.6.t:0 "未名海岸上的第一部约书"
 jxp_b_regional_colonial.6.d:0 "旧世界的加利福尼亚与卡斯卡迪亚并不存在于这张新海图上，但海港、河口、当地诸社与越冬移民仍提出同样的问题。我们不能用一个消失的地名逃避土地、军役和议事之争；这座彼岸日町必须在新发现的海岸上写出自己的第一部约书。"
 jxp_b_regional_colonial.6.a:0 "按当地疆界重订土地与水源约书。"
 jxp_b_regional_colonial.6.b:0 "以军役地和堡仓固定新海岸。"
 jxp_b_regional_colonial.6.c:0 "依新海图重排船期与贸易。"
 jxp_b_regional_colonial.7.t:0 "从寒港到金色海岸"
 jxp_b_regional_colonial.7.d:0 "北方毛皮船、南方银船和岛屿补给船终于可以在共同船期中接续。问题在于谁来掌握这条道路：宗主奉行要求统一船籍与护航，彼岸各町则主张派代表共同议定仓储、救济和土地争讼。航路一旦成形，沿岸聚落也将开始把彼此视作同一个政治世界。"
 jxp_b_regional_colonial.7.a:0 "由宗主奉行统一船籍与护航。"
 jxp_b_regional_colonial.7.b:0 "召集彼岸诸港代表共同订约。"
 jxp_b_regional_colonial.8.t:0 "在变动海图上缝合航路"
 jxp_b_regional_colonial.8.d:0 "新大陆的形状从未出现在旧航海书中。三座以上的海港各自发展出不同风名、贸易伙伴与土地规则，现在必须靠测绘船和代表会议把它们缝成一条道路。我们要复制宗主国的航路官署，还是承认各港共同制定规则的权利？"
 jxp_b_regional_colonial.8.a:0 "统一测绘、船籍和护航章程。"
 jxp_b_regional_colonial.8.b:0 "由新大陆诸港代表共同编定航路。"
 jxp_b_regional_colonial.9.t:0 "南洋港区获准立町"
 jxp_b_regional_colonial.9.d:0 "当地君主已经在王法之下批准我们的港区请约。商民可以建立会所、町屋与祭所，却须缴纳当地港税、接受刑律并尊重城中旧有社群。这个日本町的根基不是征服宣言，而是一份随互信而存续的约书。"
 jxp_b_regional_colonial.9.a:0 "命通事逐条誊录双方权利。"
 jxp_b_regional_colonial.10.t:0 "南洋港区请约遭拒"
 jxp_b_regional_colonial.10.d:0 "当地宫廷收下礼节性文书，却拒绝让外国会所在港城获得常设权利。来使带回了未用完的部分交涉经费；若仍希望在此立足，只能等待关系改善、取得自己的港口，或在未来重新议约。"
 jxp_b_regional_colonial.10.a:0 "尊重主人的决定，暂且收回请约。"

 jxp_b_92_authorized_japan_town_port:0 "王权敕许日本町"
 jxp_b_92_authorized_japan_town_port_desc:0 "当地君主以王法保护日本商民的会所、町屋和祭所，同时保留港税与司法权。"
 jxp_b_92_administered_japan_town_port:0 "奉行直辖日本町"
 jxp_b_92_administered_japan_town_port_desc:0 "港务奉行登记船籍、町役和仓储，使临时船宿成为常住聚落。"
 jxp_b_92_island_compact_harbor:0 "群岛盟誓港"
 jxp_b_92_island_compact_harbor_desc:0 "岛民的礁路与风名、移民的町屋和共同议事构成一座能自我维系的岛港。"
 jxp_b_92_northern_exchange_port:0 "北洋季节互市港"
 jxp_b_92_northern_exchange_port_desc:0 "毛皮、鲑鱼与海獭贸易依靠北方中介、冬仓和严格航季维持。"
 jxp_b_92_new_world_machiya_port:0 "彼岸日町港"
 jxp_b_92_new_world_machiya_port_desc:0 "町屋、土地约书与地方议事使跨洋据点成长为常住社会。"
 jxp_b_92_south_seas_host_charter_rents:0 "南洋港区租税"
 jxp_b_92_south_seas_host_charter_rents_desc:0 "受王法保护的外国商民带来港税、通事与稳定船期。"
 jxp_b_92_south_seas_negotiation_rebuffed:0 "南洋请约受挫"
 jxp_b_92_south_seas_negotiation_rebuffed_desc:0 "外国港区的请求遭到拒绝，新的交涉必须等待彼此疑虑平息。"
 jxp_b_92_south_seas_japan_town_network:0 "南洋日本町网络"
 jxp_b_92_south_seas_japan_town_network_desc:0 "会所、通事和季风船期把海外日本町同旧大陆诸港相连。"
 jxp_b_92_south_seas_merchant_council:0 "商人头人会所"
 jxp_b_92_south_seas_merchant_council_desc:0 "各航次推举的商人头人与通事共同仲裁货单、债务和町中事务。"
 jxp_b_92_south_seas_port_magistracy:0 "南洋港务奉行"
 jxp_b_92_south_seas_port_magistracy_desc:0 "奉行直接点验船籍、军役和港税，使海外港区服从国家账册。"
 jxp_b_92_south_seas_faith_quarter:0 "南洋信仰町区"
 jxp_b_92_south_seas_faith_quarter_desc:0 "寺院、教会、会众或施济所承担教育、救济和町中调解。"
 jxp_b_92_pacific_island_network:0 "太平洋群岛网络"
 jxp_b_92_pacific_island_network_desc:0 "群岛之间共享风名、船期和避风港，不再只是孤立补给点。"
 jxp_b_92_island_council_compact:0 "岛社议事盟约"
 jxp_b_92_island_council_compact_desc:0 "岛上王权、婚姻网络与移民代表在共同议事中划定土地和港务。"
 jxp_b_92_island_navigation_houses:0 "群岛航海传习所"
 jxp_b_92_island_navigation_houses_desc:0 "岛民航海师与移民水手共同传授星路、季风、海流和礁道。"
 jxp_b_92_island_faith_houses:0 "群岛信仰与施济所"
 jxp_b_92_island_faith_houses_desc:0 "寺院、教会与施济屋尊重地方礼俗，并为跨岛社群提供教育和救济。"
 jxp_b_92_island_naval_garrison:0 "群岛水军屯驻地"
 jxp_b_92_island_naval_garrison_desc:0 "国家供饷的炮台、官仓和水军保障航路，也压缩岛社自治。"
 jxp_b_92_north_pacific_exchange_network:0 "北洋互市网络"
 jxp_b_92_north_pacific_exchange_network_desc:0 "季节性据点、寒港和中介人把虾夷以北的渔猎海域编入长期往来。"
 jxp_b_92_ainu_brokerage_compact:0 "阿伊努中介约书"
 jxp_b_92_ainu_brokerage_compact_desc:0 "公平秤量、人质保护和季节约书承认北方中介不可替代的地位。"
 jxp_b_92_northern_frontier_garrison:0 "北洋边疆军役地"
 jxp_b_92_northern_frontier_garrison_desc:0 "边疆武士以土地和冬仓为报偿，承担寒港守备与巡航。"
 jxp_b_92_northern_free_harbor:0 "北洋自由寒港"
 jxp_b_92_northern_free_harbor_desc:0 "商社与私帆自行承担冰海风险，也让中央更难掌握每一条航线。"
 jxp_b_92_northern_competition_office:0 "北洋竞市奉行"
 jxp_b_92_northern_competition_office_desc:0 "奉行统筹毛皮价格、护航和情报，以国家财力应对俄罗斯及其他北方来船。"
 jxp_b_92_northern_relief_network:0 "北洋施济网络"
 jxp_b_92_northern_relief_network_desc:0 "寺院、会众与施济仓照料遇难船员、病患和饥荒聚落。"
 jxp_b_92_state_cold_harbors:0 "官营北洋寒港"
 jxp_b_92_state_cold_harbors_desc:0 "水军、奉行和官仓把冬季补给与船期纳入国家经略。"
 jxp_b_92_west_coast_settlement_network:0 "美洲西岸聚落网"
 jxp_b_92_west_coast_settlement_network_desc:0 "加利福尼亚、卡斯卡迪亚与北方寒港之间逐渐形成常住日町和地方制度。"
 jxp_b_92_rnw_settlement_network:0 "未名新大陆聚落网"
 jxp_b_92_rnw_settlement_network_desc:0 "海图虽已改变，受控海港、土地约书和跨洋船期仍能支撑彼岸社会。"
 jxp_b_92_western_land_compact:0 "彼岸土地约书"
 jxp_b_92_western_land_compact_desc:0 "移民町与当地诸社共同确认水源、猎场、耕地和议事权。"
 jxp_b_92_western_military_allotments:0 "彼岸军役地"
 jxp_b_92_western_military_allotments_desc:0 "移民以守备和军役换取土地，形成纪律严密而矛盾重重的边疆。"
 jxp_b_92_western_silver_current:0 "太平洋银流港市"
 jxp_b_92_western_silver_current_desc:0 "新西班牙白银、亚洲生丝和日本铜货在彼岸港市交换。"
 jxp_b_92_transpacific_settlement_arc:0 "北南跨洋聚落弧"
 jxp_b_92_transpacific_settlement_arc_desc:0 "从北方寒港到金色海岸的船期、仓储和议事已经彼此接续。"
 jxp_b_92_rnw_transpacific_settlement_arc:0 "新海图跨洋聚落弧"
 jxp_b_92_rnw_transpacific_settlement_arc_desc:0 "测绘船和共同章程把随机海图上的新大陆港市编成稳定航路。"

