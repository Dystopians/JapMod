l_english:
 jxp_a_buddhist_nanto_garan_title:0 "南都伽蓝"
 jxp_a_buddhist_nanto_garan_desc:0 "以朝廷名义保护南都寺院，并把修复责任写入国家簿册。"
 jxp_a_buddhist_hieizan_guarantee_title:0 "比叡山安堵"
 jxp_a_buddhist_hieizan_guarantee_desc:0 "确认山门领地与护持义务，使大寺院的权利同时受到国家约束。"
 jxp_a_buddhist_koyasan_pilgrimage_title:0 "高野山参诣"
 jxp_a_buddhist_koyasan_pilgrimage_desc:0 "把参诣、宿坊与道路保护纳入公仪，使圣地不再依赖临时施舍。"
 jxp_a_buddhist_kyoto_temple_restoration_title:0 "京都诸寺修复"
 jxp_a_buddhist_kyoto_temple_restoration_desc:0 "以统一后的财赋修复京都诸寺，同时编定工程与寺领的责任边界。"
 jxp_a_buddhist_gozan_register_title:0 "五山名籍"
 jxp_a_buddhist_gozan_register_desc:0 "重订五山名籍与住持履历，让学问、外交和任官都可受国家稽核。"
 jxp_a_buddhist_shinbutsu_compact_title:0 "神佛习合之议"
 jxp_a_buddhist_shinbutsu_compact_desc:0 "以成文国制划定神祇礼仪与佛教寺院的共同空间，而非强迫全国一夜改宗。"
 jxp_a_buddhist_temple_magistrate_title:0 "寺社奉行"
 jxp_a_buddhist_temple_magistrate_desc:0 "设置专责奉行，审理寺社诉讼、住持任命与公仪命令。"
 jxp_a_buddhist_temple_land_survey_title:0 "寺领检地"
 jxp_a_buddhist_temple_land_survey_desc:0 "把寺领田畠、坊舍与佃户纳入统一检地，同时承认确有凭据的旧权利。"
 jxp_a_buddhist_tax_exempt_register_title:0 "免税地名簿"
 jxp_a_buddhist_tax_exempt_register_desc:0 "刊定免税地名簿，阻止寺院与武家借宗教名义隐匿新田。"
 jxp_a_buddhist_warrior_monk_service_title:0 "僧兵军役"
 jxp_a_buddhist_warrior_monk_service_desc:0 "把僧兵护院义务改为受限军役，不让寺院武力成为无主的私兵。"
 jxp_a_buddhist_kanjin_public_works_title:0 "勧进与普请"
 jxp_a_buddhist_kanjin_public_works_desc:0 "把勧进从临时募缘转为可核销的桥梁、堤防与寺院普请制度。"
 jxp_a_buddhist_royal_buddhist_law_title:0 "王法与佛法"
 jxp_a_buddhist_royal_buddhist_law_desc:0 "以王法统辖财政、军役和裁判，以佛法为护国与施济提供合法性。"
 jxp_a_buddhist_convene_sect_council_title:0 "召开诸宗评议"
 jxp_a_buddhist_convene_sect_council_desc:0 "召集五类宗派代表，先议职责与代价，再决定正式席位。"
 jxp_a_buddhist_tendai_shingon_seat_title:0 "天台真言席"
 jxp_a_buddhist_tendai_shingon_seat_desc:0 "审议天台、真言的护国仪礼与大寺院土地要求。"
 jxp_a_buddhist_zen_gozan_seat_title:0 "禅林五山席"
 jxp_a_buddhist_zen_gozan_seat_desc:0 "审议禅林五山的文书、顾问与海外僧侣网络，以及其精英化代价。"
 jxp_a_buddhist_jodo_shinshu_seat_title:0 "净土真宗席"
 jxp_a_buddhist_jodo_shinshu_seat_desc:0 "审议净土、净土真宗的讲众施济与乡村动员，同时处理自治和武装化风险。"
 jxp_a_buddhist_lotus_seat_title:0 "法华宗席"
 jxp_a_buddhist_lotus_seat_desc:0 "审议法华宗的町众、商业和民兵网络，并约束排他性冲突。"
 jxp_a_buddhist_nanto_old_seat_title:0 "南都旧宗席"
 jxp_a_buddhist_nanto_old_seat_desc:0 "审议南都旧宗的朝廷礼仪、学问与奈良经济，以及旧寺领特权。"
 jxp_a_buddhist_sectarian_accord_title:0 "诸宗和议"
 jxp_a_buddhist_sectarian_accord_desc:0 "三席既定后，以公开条款安排其余宗派的宽容、限制与申诉渠道。"
 jxp_a_buddhist_woodblocks_scriptures_title:0 "版木与经卷"
 jxp_a_buddhist_woodblocks_scriptures_desc:0 "组织版木、校勘与经卷流通，使寺院学问不再受单一山门垄断。"
 jxp_a_buddhist_monastic_schools_title:0 "学寮与寺子教育"
 jxp_a_buddhist_monastic_schools_desc:0 "以学寮培养僧侣文书官，并让寺子教育进入城镇与村落。"
 jxp_a_buddhist_medicine_halls_title:0 "施药院"
 jxp_a_buddhist_medicine_halls_desc:0 "把施药院、药材供给与行旅救护纳入寺社奉行的账册。"
 jxp_a_buddhist_charity_granaries_title:0 "义仓与饥馑救济"
 jxp_a_buddhist_charity_granaries_desc:0 "由国家、寺院和町众共同充实义仓，在饥馑时按簿册放粮。"
 jxp_a_buddhist_pilgrimage_roads_title:0 "参诣道路"
 jxp_a_buddhist_pilgrimage_roads_desc:0 "修复通往诸山的参诣道路，并以宿站保护僧侣、商旅和普通信众。"
 jxp_a_buddhist_clerical_scribes_title:0 "僧侣文书官"
 jxp_a_buddhist_clerical_scribes_desc:0 "以受训僧侣承担外交文书、地方档案与经卷翻译，同时接受公仪考成。"
 jxp_a_buddhist_town_temple_credit_title:0 "町众与寺院信用"
 jxp_a_buddhist_town_temple_credit_desc:0 "整顿寺院借贷与町众信用，限制借宗教权威规避债务的行为。"
 jxp_a_buddhist_korean_scriptures_title:0 "朝鲜经卷"
 jxp_a_buddhist_korean_scriptures_desc:0 "通过朝鲜寺院与使节取得经卷、印刷法和校勘传统。"
 jxp_a_buddhist_chinese_monks_title:0 "中华僧侣往来"
 jxp_a_buddhist_chinese_monks_desc:0 "恢复与中国寺院和僧侣的文书往来，以学问交流取代单纯朝贡模仿。"
 jxp_a_buddhist_ryukyu_dharma_lamp_title:0 "琉球法灯"
 jxp_a_buddhist_ryukyu_dharma_lamp_desc:0 "以琉球为海路节点，让法灯、经卷和医药知识跨越岛链。"
 jxp_a_buddhist_south_seas_temples_title:0 "南海佛寺网络"
 jxp_a_buddhist_south_seas_temples_desc:0 "为南海航路上的佛寺、商人和译僧建立互保文书。"
 jxp_a_buddhist_four_seas_dharma_title:0 "四海法灯"
 jxp_a_buddhist_four_seas_dharma_desc:0 "使朝鲜、中国、琉球与南海的佛教交往形成稳定而非征服性的外交网络。"
 jxp_a_buddhist_buddhist_constitution_title:0 "佛国之宪"
 jxp_a_buddhist_buddhist_constitution_desc:0 "在三席和议、王法佛法、施济教育与四海法灯之间选择国家的最终制度。"
 jxp_a_decision_prepare_shinbutsu_constitution_title:0 "议定神佛习合国制"
 jxp_a_decision_prepare_shinbutsu_constitution_desc:0 "在统一后的日本核定神社、寺院和朝廷礼仪的共同边界，为一条不要求全国瞬间改宗的佛教国制做准备。"
 jxp_a_decision_establish_buddhist_japan_title:0 "建立佛教日本国制"
 jxp_a_decision_establish_buddhist_japan_desc:0 "保持日本国号，以诸宗席位、寺社奉行、施济教育和佛法外交重组统一国家。该路线与既有日本终局路线互斥。"
 JXP_BUDDHIST_JAPAN_STRING:0 "佛教日本"
 jxp_path_buddhist:0 "佛教日本路线"
 jxp_iface_buddhist_diplomacy_ready:0 "佛法外交准备完成"
 jxp_buddhist_state.1.t:0 "护国与公议"
 jxp_buddhist_state.1.d:0 "统一日本如今必须决定，国家是先以奉行和法令整顿寺院，还是先让诸山代表共同议定责任。两者都承认佛教制度的政治力量，也都要求国家承担代价。"
 jxp_buddhist_state.1.a:0 "先确立公仪护持"
 jxp_buddhist_state.1.b:0 "先召开诸山公议"
 jxp_buddhist_state.2.t:0 "净土真宗在诸宗中的位置"
 jxp_buddhist_state.2.d:0 "净土真宗已是国教，但佛教日本并非一向门徒国家。我们必须决定，本愿寺与讲众是竞争正式席位、作为无席宗派受宽容，还是先受限制。"
 jxp_buddhist_state.2.a:0 "允许其竞争正式席位"
 jxp_buddhist_state.2.b:0 "宽容讲众，但暂不授席"
 jxp_buddhist_state.2.c:0 "先限制寺内町自治"
 jxp_buddhist_state.100.t:0 "天台／真言席"
 jxp_buddhist_state.100.d:0 "承认此席可获得护国仪礼、圣地网络与传教能力；代价是大寺院土地要求压低国家税收。正式席位总数不得超过三席。"
 jxp_buddhist_state.100.a:0 "正式承认天台／真言席"
 jxp_buddhist_state.100.b:0 "宽容其活动，但不授席"
 jxp_buddhist_state.100.c:0 "限制其政治与寺领要求"
 jxp_buddhist_state.101.t:0 "禅林／五山席"
 jxp_buddhist_state.101.d:0 "承认此席可获得顾问、文书、学术与东亚外交；代价是精英化使乡村人力动员减弱。正式席位总数不得超过三席。"
 jxp_buddhist_state.101.a:0 "正式承认禅林／五山席"
 jxp_buddhist_state.101.b:0 "宽容其活动，但不授席"
 jxp_buddhist_state.101.c:0 "限制其政治与寺领要求"
 jxp_buddhist_state.102.t:0 "净土／净土真宗席"
 jxp_buddhist_state.102.d:0 "承认此席可获得民众动员、施济与乡村稳定；代价是讲众自治削弱中央税收。正式席位总数不得超过三席。"
 jxp_buddhist_state.102.a:0 "正式承认净土／净土真宗席"
 jxp_buddhist_state.102.b:0 "宽容其活动，但不授席"
 jxp_buddhist_state.102.c:0 "限制其政治与寺领要求"
 jxp_buddhist_state.103.t:0 "法华宗席"
 jxp_buddhist_state.103.d:0 "承认此席可获得町众商业、热忱与民兵组织；代价是排他性降低对异端宗派的宽容。正式席位总数不得超过三席。"
 jxp_buddhist_state.103.a:0 "正式承认法华宗席"
 jxp_buddhist_state.103.b:0 "宽容其活动，但不授席"
 jxp_buddhist_state.103.c:0 "限制其政治与寺领要求"
 jxp_buddhist_state.104.t:0 "南都旧宗席"
 jxp_buddhist_state.104.d:0 "承认此席可获得朝廷礼仪、法统、学问与畿内经济；代价是保守寺领提高建设成本。正式席位总数不得超过三席。"
 jxp_buddhist_state.104.a:0 "正式承认南都旧宗席"
 jxp_buddhist_state.104.b:0 "宽容其活动，但不授席"
 jxp_buddhist_state.104.c:0 "限制其政治与寺领要求"
 jxp_buddhist_state.10.t:0 "寺领检地危机"
 jxp_buddhist_state.10.d:0 "检地役人要求丈量寺领，诸山则援引旧朱印与施主文书。"
 jxp_buddhist_state.10.a:0 "坚持逐笔检地"
 jxp_buddhist_state.10.b:0 "承认凭据并议定折衷"
 jxp_buddhist_state.11.t:0 "僧兵拒绝解散"
 jxp_buddhist_state.11.d:0 "部分僧兵拒绝交械，声称护院之责不能交给远方奉行。"
 jxp_buddhist_state.11.a:0 "编入受限护院军役"
 jxp_buddhist_state.11.b:0 "以寺领负担换取裁军"
 jxp_buddhist_state.12.t:0 "法华与净土冲突"
 jxp_buddhist_state.12.d:0 "町众讲席与乡村讲众争夺布教、救济和市场空间。"
 jxp_buddhist_state.12.a:0 "由诸宗评议调停"
 jxp_buddhist_state.12.b:0 "划定各自讲席范围"
 jxp_buddhist_state.13.t:0 "大寺院与地方坊舍竞争"
 jxp_buddhist_state.13.d:0 "名山本寺要求统辖地方坊舍，地方僧团则要求保留施济与会计自主。"
 jxp_buddhist_state.13.a:0 "保护地方坊舍申诉权"
 jxp_buddhist_state.13.b:0 "确认本寺层级责任"
 jxp_buddhist_state.14.t:0 "国家任命住持"
 jxp_buddhist_state.14.d:0 "寺社奉行提出审核住持任命，诸山担心法脉被政治恩赏取代。"
 jxp_buddhist_state.14.a:0 "保留推举、国家核准"
 jxp_buddhist_state.14.b:0 "由国家直接任命"
 jxp_buddhist_state.15.t:0 "经卷版本争议"
 jxp_buddhist_state.15.d:0 "各寺版木在章句和校勘上互不相让，学寮要求建立共同底本。"
 jxp_buddhist_state.15.a:0 "资助诸本对校"
 jxp_buddhist_state.15.b:0 "颁行公仪校本"
 jxp_buddhist_state.16.t:0 "神佛习合与排佛倾向"
 jxp_buddhist_state.16.d:0 "部分武家要求切断神社与寺院旧有联系，另一些人主张维持习合秩序。"
 jxp_buddhist_state.16.a:0 "维护成文习合国制"
 jxp_buddhist_state.16.b:0 "统一公仪礼次"
 jxp_buddhist_state.17.t:0 "净土真宗自治危机"
 jxp_buddhist_state.17.d:0 "讲众要求自行管理义仓与寺内町，奉行担心形成不受裁判的权力。"
 jxp_buddhist_state.17.a:0 "以章程承认有限自治"
 jxp_buddhist_state.17.b:0 "把义仓纳入奉行账册"
 jxp_buddhist_state.18.t:0 "町众支持某宗派"
 jxp_buddhist_state.18.d:0 "城镇会所公开资助一宗讲席，引发其他寺院对市场偏袒的控诉。"
 jxp_buddhist_state.18.a:0 "公开会计并允许多宗捐助"
 jxp_buddhist_state.18.b:0 "禁止宗派控制町会"
 jxp_buddhist_state.19.t:0 "寺院债务和德政"
 jxp_buddhist_state.19.d:0 "寺院债券、町众借款与饥年欠租交织，债务人要求施行德政。"
 jxp_buddhist_state.19.a:0 "由义仓分担并减记债务"
 jxp_buddhist_state.19.b:0 "维护契约并分期清偿"
 jxp_buddhist_state.200.t:0 "佛国之宪"
 jxp_buddhist_state.200.d:0 "诸宗席位、寺社奉行、施济教育与佛法外交已经成形。现在必须在国家护持、诸山公议与僧俗分治之间作出互斥的最终制度选择。"
 jxp_buddhist_state.200.a:0 "颁行王法佛法相依体制"
 jxp_buddhist_state.200.b:0 "颁行诸山公议国制"
 jxp_buddhist_state.200.c:0 "颁行僧俗分治法度"
 jxp_buddhist_state.900.t:0 "诸宗议事调度"
 jxp_buddhist_state.900.d:0 "诸宗年度议事正在调度。"
 jxp_buddhist_state.901.t:0 "佛教日本国制校验"
 jxp_buddhist_state.901.d:0 "佛教日本的互斥路线与任务状态正在校验。"
 jxp_a_buddhist_shinbutsu_preparation:0 "神佛习合国制准备"
 jxp_a_buddhist_shinbutsu_preparation_desc:0 "朝廷、神社与寺院正在核定礼仪和财赋边界。"
 jxp_a_buddhist_route_constitution:0 "佛教日本国制"
 jxp_a_buddhist_route_constitution_desc:0 "国家开始制度化诸宗、寺院、教育、施济与佛教外交。"
 jxp_a_buddhist_sanctuary_guarantees:0 "诸山安堵状"
 jxp_a_buddhist_sanctuary_guarantees_desc:0 "大寺院获得成文保护，也承担国家规定的责任。"
 jxp_a_buddhist_capital_temples:0 "京都诸寺普请"
 jxp_a_buddhist_capital_temples_desc:0 "京都寺院的修复成为首都建设的一部分。"
 jxp_a_buddhist_gozan_register:0 "五山名籍"
 jxp_a_buddhist_gozan_register_desc:0 "住持履历、文书能力与海外往来均受名籍管理。"
 jxp_a_buddhist_shinbutsu_compact:0 "神佛习合之议"
 jxp_a_buddhist_shinbutsu_compact_desc:0 "神祇礼仪与佛教制度在成文边界内共存。"
 jxp_a_buddhist_temple_magistracy:0 "寺社奉行制"
 jxp_a_buddhist_temple_magistracy_desc:0 "寺社诉讼、寺领与任官归入专责奉行。"
 jxp_a_buddhist_exemption_ledger:0 "免税地名簿"
 jxp_a_buddhist_exemption_ledger_desc:0 "免税权获得核定，但检地也引起地方反弹。"
 jxp_a_buddhist_public_works:0 "勧进普请账"
 jxp_a_buddhist_public_works_desc:0 "勧进款项被用于可核销的公共工程。"
 jxp_a_buddhist_royal_law:0 "王法与佛法"
 jxp_a_buddhist_royal_law_desc:0 "王法统辖政务，佛法为护国与施济提供合法性。"
 jxp_a_buddhist_three_seat_accord:0 "三席诸宗和议"
 jxp_a_buddhist_three_seat_accord_desc:0 "三宗正式入席，其余宗派获得明确的宽容或限制地位。"
 jxp_a_buddhist_printing_houses:0 "寺院版木所"
 jxp_a_buddhist_printing_houses_desc:0 "校勘和印刷网络加快经卷与学问传播。"
 jxp_a_buddhist_school_network:0 "学寮寺子网络"
 jxp_a_buddhist_school_network_desc:0 "寺院教育培养文书官并向城镇乡村扩展。"
 jxp_a_buddhist_relief_network:0 "施药义仓网络"
 jxp_a_buddhist_relief_network_desc:0 "施药院与义仓共同缓和饥馑和疾病。"
 jxp_a_buddhist_pilgrimage_circuit:0 "参诣道路网"
 jxp_a_buddhist_pilgrimage_circuit_desc:0 "参诣道路同时服务信众、商旅与国家交通。"
 jxp_a_buddhist_temple_credit:0 "寺院町众信用"
 jxp_a_buddhist_temple_credit_desc:0 "寺院借贷与町众信用受到公开账册约束。"
 jxp_a_buddhist_diplomatic_cloisters:0 "佛法外交僧院"
 jxp_a_buddhist_diplomatic_cloisters_desc:0 "译僧和寺院文书维系不以征服为目的的海外关系。"
