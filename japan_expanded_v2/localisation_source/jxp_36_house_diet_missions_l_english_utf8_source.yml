l_english:
 jxp_mission_house_diet_into_realm_title:0 "旧家法入国制"
 jxp_mission_house_diet_into_realm_desc:0 "昔日在一国城下写就的家法，如今已被重誊入天下法度。诸道奉行开始学习这些旧朱印背后的尺度，旧家名也因此成为新国制的一部分。"
 jxp_mission_house_law_local_offices_title:0 "家法行于诸司"
 jxp_mission_house_law_local_offices_desc:0 "家法若只藏于案牍，便只是旧日荣光；唯有能为诸司奉行、远国代官、港市取次与社寺年寄所用，才算真正进入天下日用。"
 jxp_mission_house_law_state_doctrine_title:0 "本家法度成宪"
 jxp_mission_house_law_state_doctrine_desc:0 "天下既定，旧家法也不再只是本家故事。它被解释、增删、重写，最后成为国家自述秩序的一种语言。"
 jxp_36_integrated_house_diet_records:0 "誊入国制的家法"
 jxp_36_integrated_house_diet_records_desc:0 "旧家法被整理为新国家的案牍格式。奉行在其中看见先例，也看见可供诸道引用的制度根基。"
 jxp_36_house_law_local_offices:0 "诸司家法施行"
 jxp_36_house_law_local_offices_desc:0 "地方诸司开始按家法遗产调整军役、代官、港市、关隘或社寺账册，旧法由此不再只是中央文书。"
 jxp_36_house_law_state_doctrine:0 "家法成宪"
 jxp_36_house_law_state_doctrine_desc:0 "本家旧法被提升为国家制度的自我解释。诸臣援引它，奉行修订它，后世也将借它理解国家的来路。"
