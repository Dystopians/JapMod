 jxp_a_socioeconomic_integration.109.t:0 "天下一统之法"
 jxp_a_socioeconomic_integration.109.d:0 "军锋上洛、奉敕讨不庭与会盟诸侯分别改变武家处分、公共信用、国有化和地方票号的政治代价。中央只保留一种来路；旧版的三种建国修正会迁入本制并撤去，避免双重叠加。"
