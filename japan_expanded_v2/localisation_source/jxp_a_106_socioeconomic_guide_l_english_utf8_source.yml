l_english:
 jxp_a_open_socioeconomic_gazetteer_title:0 "阅览国体图志"
 jxp_a_open_socioeconomic_gazetteer_desc:0 "召集奉行、阶层惣代与商事书役，查阅本国四阶层、商市阶段、会社章程及国内终局的现况。此举只打开说明，不改变任何国策。"
 jxp_a_socioeconomic_integration.100.t:0 "国体图志：邦内经世总览"
 jxp_a_socioeconomic_integration.100.d:0 "天下之财用，不独在仓廪金银，亦系于武家之奉公、寺社之公议、町众之信用与百姓之耕织。图志分录四阶层、商市成网、会社章程及终局国体；海外商馆、殖民与大陆经营仍由另册办理。"
 jxp_a_socioeconomic_integration.100.estates:0 "查看四阶层与权利"
 jxp_a_socioeconomic_integration.100.market:0 "查看商市与信用阶段"
 jxp_a_socioeconomic_integration.100.companies:0 "查看现行会社章程"
 jxp_a_socioeconomic_integration.100.routes:0 "查看国内终局与商业公议"
 jxp_a_socioeconomic_integration.101.t:0 "四阶层之议"
 jxp_a_socioeconomic_integration.101.d:0 "武家奉公众掌军役与知行，寺社宗门维持教化、施济与寺领，町众豪商经营市庭、信用与廻船，百姓惣村承担年贡、普请与乡村生产。各项特权皆有忠诚、影响力与领地代价；阶层势力失衡会引出家中割据、宗门公议崩溃、豪商专政或德政惣动。路线改易后，失去法理的特权由中央清册撤除。"
 jxp_a_socioeconomic_integration.102.t:0 "商市、信用、工场与会社"
 jxp_a_socioeconomic_integration.102.d:0 "商业化依次经历商市成网、信用成制、工场成业、会社成国。阶段平常只进不退，且须同时具备城市、生产、年代、技术及至少两项天下属性支持；破产与危机带来代价，却不会让普通改换路线重复领取阶段赏赐。"
 jxp_a_socioeconomic_integration.103.t:0 "会社章程录"
 jxp_a_socioeconomic_integration.103.d:0 "每家会社都须申请章程、募集本钱、选定董事、接受年度账目与到期审议。国小者至多一社，市场渐成可扩为二、三社；唯会社成国或商议日本可容四社，并承受豪商干政、武家反弹与破产风险。国内会社绝不自行取得海外领土；海外业务只发出接口请求。"
 jxp_a_socioeconomic_integration.104.t:0 "国内终局与商议之途"
 jxp_a_socioeconomic_integration.104.d:0 "十二种统一国体各有自己的财用法、阶层妥协、危机与唯一国内大成。商议日本则是明确的分歧历史：统一后的武家国家若已形成信用、工场、两家会社与强势而忠诚的町众，方可让奉行、城市、公司与四阶层共同议政。此路门槛严苛，选定后将排除其他极端国体，并可能爆发商本与武家俸禄危机。"
