 jxp_a_socioeconomic_integration.105.t:0 "会社董事席"
 jxp_a_socioeconomic_integration.105.d:0 "董事席不是虚衔。国家奉行重审计与官营，町众豪商重贸易与信用，武家奉公众重军需，寺社宗门重赈济与共同体，混合评议则以较小收益换取阶层均衡。下列条目显示当前至少一家会社采用的董事结构。"
 jxp_a_socioeconomic_integration.106.t:0 "海外会社接口簿"
 jxp_a_socioeconomic_integration.106.d:0 "国内会社无权自行取得海外领土；本册只显示已经递交给海外经略系统的请求。是否受理、成立何种殖民会社及其领土后果，均由海外经略册另行裁定。"
