 jxp_a_socioeconomic_integration.107.t:0 "国体图志：本国身份"
 jxp_a_socioeconomic_integration.107.d:0 "本页逐项显示当前实际生效的国内国体，而非只凭国号猜测。路线既定后，其阶层配置、经济制度、专属危机与国内大成各有自己的清理和迁移规则；商议日本在完成分支裁决前先由共同商议国制承接一级改革，随后才分为幕府监督、町众共和国或会社帝国。"
