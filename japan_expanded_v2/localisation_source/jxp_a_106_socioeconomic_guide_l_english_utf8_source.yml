 jxp_a_socioeconomic_integration.108.t:0 "创始家商业遗产"
 jxp_a_socioeconomic_integration.108.d:0 "统一之家的旧政并不再叠加一套通用永久数值；它改为影响最适合的会社、董事、审计与国用选择。五类只会保留其一，改换国号或殖民继承时由中央重新核定。"
