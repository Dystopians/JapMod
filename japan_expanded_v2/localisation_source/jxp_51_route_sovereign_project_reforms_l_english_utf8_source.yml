l_english:
 jxp_route_institution_sovereign_projects:0 "诸道建国纲领"
 jxp_reform_sakoku_kokudaka_cadaster_state:0 "石高检地国家"
 jxp_reform_sakoku_kokudaka_cadaster_state_desc:0 "将诸国田亩、山林、水利与町地悉数归入石高帐。诸藩仍有家名，而天下财赋之脉络皆通于中央。"
 jxp_reform_sakoku_kanei_sea_wall:0 "宽永海防垣"
 jxp_reform_sakoku_kanei_sea_wall_desc:0 "沿海远见番所、浦役人与水军奉行共同编织一张闭锁之网。外船可见灯火，却难窥国政。"
 jxp_reform_sakoku_domain_hostage_offices:0 "诸藩质馆政所"
 jxp_reform_sakoku_domain_hostage_offices_desc:0 "以城下屋敷、参勤路与近侍名册约束诸侯。刀枪虽仍归武门，归心却当系于江户之政。"
 jxp_reform_sakoku_inner_learning_license:0 "内学许可制"
 jxp_reform_sakoku_inner_learning_license_desc:0 "外书不必尽焚，机巧不必尽拒。译馆、天文方与医师座须受官印许可，使学问藏于国门之内。"
 jxp_reform_open_red_seal_company_state:0 "朱印会社国家"
 jxp_reform_open_red_seal_company_state_desc:0 "朱印状不再只是商船凭照，而成为海外交易、保险、仓储与市舶法的共同根本。"
 jxp_reform_open_pacific_settlement_ministry:0 "太平洋拓殖省"
 jxp_reform_open_pacific_settlement_ministry_desc:0 "从虾夷地到大洋彼岸，幕府任命移民奉行、海图役与港仓役，使新土不只属于冒险者。"
 jxp_reform_open_foreign_drill_commission:0 "洋式调练委员会"
 jxp_reform_open_foreign_drill_commission_desc:0 "火器、炮车、测距与队列不再零散传入，而由国家择师、译书、立场，化为军政常法。"
 jxp_reform_open_treaty_port_high_court:0 "通商港高等评定所"
 jxp_reform_open_treaty_port_high_court_desc:0 "港口不是割裂国法的裂缝，而是新秩序的试金石。番商、町人、武家与译官同入评定。"
 jxp_reform_kirishitan_sun_cross_curia:0 "日轮十字枢院"
 jxp_reform_kirishitan_sun_cross_curia_desc:0 "王权与教会各有其仪，而国中大事须在圣像与菊纹之前共同申明。"
 jxp_reform_kirishitan_domain_seminary_network:0 "诸藩修院学校"
 jxp_reform_kirishitan_domain_seminary_network_desc:0 "拉丁文、兵学、算学与神学不再只属于港町。诸藩子弟受训于修院，归国为新政所用。"
 jxp_reform_kirishitan_martyr_estates:0 "殉教士家产法"
 jxp_reform_kirishitan_martyr_estates_desc:0 "信仰以牺牲立名，国家以制度安其遗族。忠诚、慈善与军役由此互为表里。"
 jxp_reform_kirishitan_pacific_mission_admiralty:0 "太平洋布教海军"
 jxp_reform_kirishitan_pacific_mission_admiralty_desc:0 "传教士、舵手与船匠同领国命。远海不只是商道，也是通往新信众与新盟友的道路。"
 jxp_reform_confucian_great_rites_codex:0 "大礼律令"
 jxp_reform_confucian_great_rites_codex_desc:0 "以礼正名，以律定分。神祇、寺社、武家与百姓各有其位，天下遂可由名分而入治。"
 jxp_reform_confucian_kami_harmonization_academy:0 "神儒谐和学寮"
 jxp_reform_confucian_kami_harmonization_academy_desc:0 "神宫不废，社坛不毁；诸神之祭礼纳入王化之序，宋明理学因之得其本土形貌。"
 jxp_reform_confucian_tenka_granary_censorate:0 "天下义仓监察院"
 jxp_reform_confucian_tenka_granary_censorate_desc:0 "义仓、社仓与藩仓皆需入籍。饥岁之政不靠恩赏一时，而靠平日绳墨。"
 jxp_reform_confucian_east_asian_rite_mandate:0 "东亚礼命委员会"
 jxp_reform_confucian_east_asian_rite_mandate_desc:0 "朝鲜、琉球、明清与诸岛皆有礼文可循。新日本应以笔札、冠服与军令共同书写其东亚名分。"
 jxp_reform_imperial_daijokan_restoration_cabinet:0 "复古太政官内阁"
 jxp_reform_imperial_daijokan_restoration_cabinet_desc:0 "摄关旧名、武家新制与近世官僚并入太政官之下。复古并非倒退，而是重新命名国家。"
 jxp_reform_imperial_jingi_envoy_order:0 "神祇巡宣使"
 jxp_reform_imperial_jingi_envoy_order_desc:0 "奉币使与宣慰使巡行诸国，使山川社稷皆知朝廷复出，而边鄙亦闻京师之声。"
 jxp_reform_imperial_konoe_drill_colleges:0 "近卫调练学寮"
 jxp_reform_imperial_konoe_drill_colleges_desc:0 "天皇之兵不再只是典礼护卫。近卫学寮训练将校、炮手与旗本，使王政有可用之军。"
 jxp_reform_imperial_court_land_survey:0 "公田复籍检地"
 jxp_reform_imperial_court_land_survey_desc:0 "古代公田之名虽不可全复，国家却可借其义重整田籍。朝廷由礼仪之源重返赋役之本。"
 jxp_reform_reformed_consistory_state:0 "长老议会国家"
 jxp_reform_reformed_consistory_state_desc:0 "教会长老、港町代表与武家奉行共入会议。誓约不只是信仰文字，也成为国政约束。"
 jxp_reform_reformed_printed_common_law:0 "印行公法"
 jxp_reform_reformed_printed_common_law_desc:0 "法令、教理问答与地图以活字印行，传至诸城诸港。国家的声音不再只靠使者口传。"
 jxp_reform_reformed_burgher_militia_board:0 "市民军役局"
 jxp_reform_reformed_burgher_militia_board_desc:0 "町人不只纳税，亦可持械守城。市民军役使港町自由与国家防务相互担保。"
 jxp_reform_reformed_dutch_engineer_company:0 "荷兰工兵会社"
 jxp_reform_reformed_dutch_engineer_company_desc:0 "堤防、棱堡、炮台与测量术由雇佣技师传入，再由本国匠人改造。海风吹来的是另一种秩序。"
 jxp_reform_kaikyo_qadi_port_circuits:0 "港口卡迪巡回庭"
 jxp_reform_kaikyo_qadi_port_circuits_desc:0 "卡迪巡行港町，审断商约、婚姻、继承与海损。诸港因法而联结，而非只因风向。"
 jxp_reform_kaikyo_waqf_harbor_endowments:0 "瓦合甫港仓"
 jxp_reform_kaikyo_waqf_harbor_endowments_desc:0 "清真寺、仓库、船坞与慈善基金同受捐置。港口收益因此得以反哺航路与民生。"
 jxp_reform_kaikyo_monsoon_admiralty:0 "季风海军省"
 jxp_reform_kaikyo_monsoon_admiralty_desc:0 "观星、候风、舵法与炮术并入海军省。日本不再只看内海潮汐，也读印度洋季风。"
 jxp_reform_kaikyo_madrasa_foundry_cities:0 "经学院铸炮市"
 jxp_reform_kaikyo_madrasa_foundry_cities_desc:0 "经学院教读经文，也教授算学、冶金与测量。学问与火器同在城市炉火中成形。"
 jxp_reform_ikko_somon_commonwealth_diet:0 "惣村共和国议会"
 jxp_reform_ikko_somon_commonwealth_diet_desc:0 "门徒、地侍、百姓与商人以惣村旧约参政。所谓国家，先从村社誓纸上生长。"
 jxp_reform_ikko_equal_field_registers:0 "均田誓纸帐"
 jxp_reform_ikko_equal_field_registers_desc:0 "田地、年贡、军役与赈济写入共同誓纸。人人皆非同等，却须承认共同生计之理。"
 jxp_reform_ikko_monto_war_bells:0 "门徒战钟制"
 jxp_reform_ikko_monto_war_bells_desc:0 "寺内町钟声既召集法会，亦召集军阵。信众之兵不求华饰，只求共同守土。"
 jxp_reform_ikko_temple_market_law:0 "寺内町市法"
 jxp_reform_ikko_temple_market_law_desc:0 "门前市、寺内町与商人座获得成文保护。信仰共同体也必须懂得盐、米、纸与铁的流通。"
 jxp_reform_wokou_black_current_high_admiralty:0 "黑潮大提督府"
 jxp_reform_wokou_black_current_high_admiralty_desc:0 "岛主、船头与海商皆向大提督府登记。黑潮不再只是走私者的暗道，而是国家的水上边境。"
 jxp_reform_wokou_island_brokerage_courts:0 "诸岛仲介裁判所"
 jxp_reform_wokou_island_brokerage_courts_desc:0 "盐商、海盗、朝鲜译官、琉球船头与倭馆掮客皆可在岛上求断。海上秩序从交易纠纷中长出。"
 jxp_reform_wokou_red_seal_privateering_law:0 "朱印私掠法"
 jxp_reform_wokou_red_seal_privateering_law_desc:0 "未经印信者为贼，持有印信者为国用。掠夺、护航与征服之间，自有一纸朱印划界。"
 jxp_reform_wokou_sea_lord_federation:0 "海主连判同盟"
 jxp_reform_wokou_sea_lord_federation_desc:0 "各海主以连判状相结，约束水手、港仓与分赃。松散诸岛由此能奉一个日轮旗号。"
