l_english:
 jxp_72_decision_convene_sea_league_title:0 "会盟黑潮诸船"
 jxp_72_decision_convene_sea_league_desc:0 "岛浦船头、港町年寄与远海牙人各守一套誓纸。若要让零散的倭寇、护航与走私航路成为可支配的海上力量，国家必须承认他们的会盟，也必须承担会盟日后反噬岸上的风险。"
 jxp_72_decision_rotate_letters_of_mark_title:0 "轮发朱印私掠札"
 jxp_72_decision_rotate_letters_of_mark_desc:0 "旧札若任由船头世袭，私掠便会变成不受约束的海上领地。重新点验船籍并轮换朱印，可以催起新一季远航，却也会让获利的船团更难收束。"
 jxp_72_decision_endow_free_ports_title:0 "捐立浦港会所"
 jxp_72_decision_endow_free_ports_desc:0 "在远海航路经过的浦港设立共同仓、秤座与宿泊所，能把漂忽不定的船货引入可查账册。商人因此获益，地方代官却不得不让出一部分旧税权。"
 jxp_72_decision_fund_convoy_courts_title:0 "资助护航评定所"
 jxp_72_decision_fund_convoy_courts_desc:0 "船头间的俘获、分赃与航路纠纷若只凭刀剑裁断，海盟迟早会自相攻伐。由国家出资设立评定所，可以把争讼带回岸上，也会消耗本可用于扩张的财赋。"
 jxp_72_decision_charter_maritime_state_title:0 "改定海上奉行国"
 jxp_72_decision_charter_maritime_state_desc:0 "黑潮会盟已经大到不能再靠季节性誓约维系。将船团、港市与关税纳入奉行体系，可把海寇联盟转化为受法度约束的海上国家，但必须先偿清船头的旧权与港町的私约。"
 jxp_72_decision_stand_down_flotillas_title:0 "解散外海船团"
 jxp_72_decision_stand_down_flotillas_desc:0 "若海盟的压力已超过国家愿意承担的限度，可以收回朱印、封存分赃账册并遣散船团。沿海会暂时安定，海军与远海事业却也将经历一段空窗。"
 jxp_wak_loop.1.t:0 "黑潮分配之季"
 jxp_wak_loop.1.d:0 "季风转向，挂着不同家纹与朱印的船只陆续归港。船舱里有银锭、丝匹与缴获的帆具，岸上的官吏、牙人与船头都拿着彼此矛盾的账册。如何分配这一季的所得，将决定下一批船驶向何处。"
 jxp_wak_loop.1.a:0 "准许船头照旧分取红利"
 jxp_wak_loop.1.b:0 "先把船货送入浦港公仓"
 jxp_wak_loop.1.c:0 "停航一季，重编诸船名簿"
 jxp_wak_loop.2.t:0 "岛浦船头的争席"
 jxp_wak_loop.2.d:0 "几位船头同时声称自己应当主持下一次会盟。他们各自带来护航功绩、阵亡名册与港町借据，随从则在廊外以手按刀。若无法给出共同接受的裁断，争席很快会蔓延到海上。"
 jxp_wak_loop.2.a:0 "以公库赎回旧约，重排席次"
 jxp_wak_loop.2.b:0 "令水军奉行按军功裁断"
 jxp_wak_loop.2.c:0 "让船头自行议价"
 jxp_wak_loop.3.t:0 "黑潮会盟压岸"
 jxp_wak_loop.3.d:0 "海盟的船、债与誓纸已越过港市围墙。船头能决定货价，牙人替诸岛裁决争端，地方官甚至要借他们的护航才能传递文书。国家必须选择：把这股力量纳入法度，以武力折断它，或承认黑潮本身就是新的秩序。"
 jxp_wak_loop.3.a:0 "把会盟改为海上奉行国"
 jxp_wak_loop.3.b:0 "调兵查封私库与泊地"
 jxp_wak_loop.3.c:0 "让黑潮吞没旧法"
 jxp_72_wak_sea_league_charter:0 "黑潮海盟誓纸"
 jxp_72_wak_sea_league_charter_desc:0 "港市与船团以共同誓纸互认护航、分赃和补给规矩，零散的远海势力暂时能够协同行动。"
 jxp_72_wak_rotating_letters:0 "轮换朱印札"
 jxp_72_wak_rotating_letters_desc:0 "私掠许可按船籍定期轮换，使更多船团参与远航，却也损害了国家对外守约的名声。"
 jxp_72_wak_free_port_endowment:0 "浦港会所公仓"
 jxp_72_wak_free_port_endowment_desc:0 "共同仓与秤座吸引海货进入港市账册，代价是地方旧税权受到侵蚀。"
 jxp_72_wak_convoy_courts:0 "护航评定所"
 jxp_72_wak_convoy_courts_desc:0 "由奉行、牙人与船头共同裁断俘获和航路争端，船队因而更愿意服从统一调度。"
 jxp_72_wak_unlicensed_dividend:0 "未入册的海上红利"
 jxp_72_wak_unlicensed_dividend_desc:0 "不经官仓分配的缴获迅速流入港町，也让持械船众的声势压过岸上法度。"
 jxp_72_wak_federation_hearing:0 "岛浦会盟听讼"
 jxp_72_wak_federation_hearing_desc:0 "船头的争席被带到公开评定中，各港得以在下一轮远航前重申共同规则。"
 jxp_72_wak_repression_aftershock:0 "查封泊地余波"
 jxp_72_wak_repression_aftershock_desc:0 "被收回朱印和货物的船众流散各地，私掠暂时衰退，沿岸却仍因查封而不安。"
 jxp_72_wak_black_current_overreach:0 "黑潮越岸"
 jxp_72_wak_black_current_overreach_desc:0 "船头与牙人开始越过港市法庭自行定价、征债和裁断，远海财富反过来侵蚀国家信用。"
 jxp_72_wak_crisis_recess:0 "海盟危机休议"
 jxp_72_wak_crisis_recess_desc:0 "最近一次冲突留下的债务与仇怨尚未平息，海盟暂时不会再召开总议。"
 jxp_72_wak_chartered_maritime_state:0 "海上奉行国"
 jxp_72_wak_chartered_maritime_state_desc:0 "旧有船团被纳入港市关税、护航法庭与奉行名簿，远海事业由掠夺性的会盟转为受规制的海上国家。"
 jxp_72_wak_flotillas_disarmed:0 "船团封存期"
 jxp_72_wak_flotillas_disarmed_desc:0 "朱印已经收回，私库已经封存。沿岸秩序有所恢复，但能够立即出海的船与熟练水手也随之减少。"
 jxp_72_wak_pressure_starts_10_tt:0 "建立海盟，并把海盟压力设为§Y10§!。"
 jxp_72_wak_pressure_rises_5_tt:0 "海盟压力增加§R5§!。"
 jxp_72_wak_pressure_rises_10_tt:0 "海盟压力增加§R10§!。"
 jxp_72_wak_pressure_rises_15_tt:0 "海盟压力增加§R15§!。"
 jxp_72_wak_pressure_rises_20_tt:0 "海盟压力增加§R20§!。"
 jxp_72_wak_pressure_falls_10_tt:0 "海盟压力降低§G10§!。"
 jxp_72_wak_pressure_falls_15_tt:0 "海盟压力降低§G15§!。"
 jxp_72_wak_pressure_falls_20_tt:0 "海盟压力降低§G20§!。"
 jxp_72_wak_pressure_falls_40_tt:0 "海盟压力降低§G40§!。"
 jxp_72_wak_transform_tt:0 "结束当前海盟循环，把船团转化为受法度约束的海上奉行国。二十年后可重新召集海盟。"
 jxp_72_wak_stand_down_tt:0 "结束当前海盟循环，压力归零并封存船团十年。"
 jxp_debug_72_wak_start_cycle_title:0 "调试：建立黑潮海盟"
 jxp_debug_72_wak_start_cycle_desc:0 "在倭寇路线中立即建立海盟并初始化压力，不扣除正常决议花费。"
 jxp_debug_72_wak_add_pressure_title:0 "调试：增加海盟压力"
 jxp_debug_72_wak_add_pressure_desc:0 "为当前海盟增加一档压力，用于检查争席与危机阈值。"
 jxp_debug_72_wak_fire_dividend_title:0 "调试：触发黑潮分配"
 jxp_debug_72_wak_fire_dividend_desc:0 "立即打开黑潮分配事件，以检查收益、代价与AI选项结构。"
 jxp_debug_72_wak_fire_crisis_title:0 "调试：触发海盟危机"
 jxp_debug_72_wak_fire_crisis_desc:0 "把压力设到危机阈值并立即打开海盟危机事件。"
 jxp_debug_72_wak_reset_cycle_title:0 "调试：清理海盟循环"
 jxp_debug_72_wak_reset_cycle_desc:0 "清除海盟活动状态、压力变量及本系统所有有限期修正。"
