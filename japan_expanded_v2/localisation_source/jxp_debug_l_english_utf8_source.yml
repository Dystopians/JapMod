l_english:
 jxp_debug_enable_menu_title:0 "调试：开启日轮诸道调试菜单"
 jxp_debug_enable_menu_desc:0 "开启后会显示一批调试决议，用于初始化机制、切换路线、触发事件和检查任务状态。"
 jxp_debug_disable_menu_title:0 "调试：关闭日轮诸道调试菜单"
 jxp_debug_disable_menu_desc:0 "隐藏所有调试决议。已设置的路线、事件旗标和修正不会自动回滚。"
 jxp_debug_show_legacy_detail_decisions_title:0 "调试：显示旧制细目决议"
 jxp_debug_show_legacy_detail_decisions_desc:0 "仅在调试菜单中显示创始家议会、路线妥协、家中评定、理念遗产与统一前记忆等旧制细目决议。"
 jxp_debug_hide_legacy_detail_decisions_title:0 "调试：隐藏旧制细目决议"
 jxp_debug_hide_legacy_detail_decisions_desc:0 "收起旧制细目决议，不改变已经完成的旧制内容。"
 jxp_debug_initialize_polity_title:0 "调试：初始化/刷新日轮国体"
 jxp_debug_initialize_polity_desc:0 "初始化三项国体数值，添加政府机制载体，并弹出当前数值检查事件。"
 jxp_debug_unify_japan_title:0 "调试：一键统一日本区域"
 jxp_debug_unify_japan_desc:0 "将日本区域内所有已开发省份直接交给当前国家并添加核心，不改变当前国号、宗教或路线。适合从任意大名或路线 tag 快速进入统一后测试。"
 jxp_debug_unify_japan_tt:0 "日本区域内所有已开发省份都会成为当前国家的核心领土。"
 jxp_debug_grant_resources_title:0 "调试：注入测试资源"
 jxp_debug_grant_resources_desc:0 "给予大量君主点数、金钱、威望、正统和稳定，方便连续测试按钮、任务和事件。"
 jxp_debug_internal_effect_tt:0 "调试操作会在后台执行。"
 jxp_debug_show_cleanup_panel_title:0 "调试：展开清理工具"
 jxp_debug_show_cleanup_panel_desc:0 "只显示冷却、事件状态和路线基线相关的清理按钮。"
 jxp_debug_show_values_panel_title:0 "调试：展开数值档位"
 jxp_debug_show_values_panel_desc:0 "只显示天下秩序、天皇裁可和海门外学的测试档位按钮。"
 jxp_debug_show_routes_panel_title:0 "调试：展开路线工具"
 jxp_debug_show_routes_panel_desc:0 "只显示路线选择与强制路线切换按钮。"
 jxp_debug_show_seeds_panel_title:0 "调试：展开接触播种"
 jxp_debug_show_seeds_panel_desc:0 "只显示宗教接触、岛原压力等测试播种按钮。"
 jxp_debug_hide_core_panels_title:0 "调试：收起当前工具分组"
 jxp_debug_hide_core_panels_desc:0 "隐藏当前展开的清理、数值、路线或播种按钮，恢复精简调试菜单。"
 jxp_debug_clear_cooldowns_title:0 "调试：清除按钮冷却与投资"
 jxp_debug_clear_cooldowns_desc:0 "移除政府按钮冷却修正，并取消当前长期投资状态。"
 jxp_debug_clear_event_state_title:0 "调试：清除事件测试状态"
 jxp_debug_clear_event_state_desc:0 "清除常用事件旗标和事件修正，让同一批事件可以重新触发或重新点击测试。"
 jxp_debug_return_jap_baseline_title:0 "调试：回到日本基线"
 jxp_debug_return_jap_baseline_desc:0 "清除路线状态，将路线 tag 回到 JAP，恢复神道，并设置一组中等国体数值。"
 jxp_debug_values_low_title:0 "调试：数值档位：低秩序低开放"
 jxp_debug_values_low_desc:0 "设置天下秩序、天皇裁可、海门外学为低值，用于测试危机、惩罚和低门槛内容。"
 jxp_debug_values_balanced_title:0 "调试：数值档位：公武中道"
 jxp_debug_values_balanced_desc:0 "设置一组中等数值，用于测试常规任务、按钮和路线选择前状态。"
 jxp_debug_values_closed_title:0 "调试：数值档位：闭关高秩序"
 jxp_debug_values_closed_desc:0 "设置高天下秩序、高天皇裁可、低海门外学，用于测试锁国与停滞方向。"
 jxp_debug_values_open_title:0 "调试：数值档位：开国高外学"
 jxp_debug_values_open_desc:0 "设置高开放数值，用于测试南蛮、兰学、宗教接触和远洋路线。"
 jxp_debug_values_route_ready_title:0 "调试：数值档位：路线全解锁"
 jxp_debug_values_route_ready_desc:0 "设置高数值并添加主要接触旗标，让路线选择事件显示尽可能多的选项。"
 jxp_debug_open_route_chooser_title:0 "调试：打开天下定分路线选择"
 jxp_debug_open_route_chooser_desc:0 "准备路线测试条件，清除当前路线，并打开天下定分路线选择事件。"
 jxp_debug_force_sakoku_route_title:0 "调试：强制路线：锁国"
 jxp_debug_force_sakoku_route_desc:0 "直接设置锁国路线旗标、路线修正和闭关数值，用于检查锁国任务组。"
 jxp_debug_force_open_route_title:0 "调试：强制路线：开国"
 jxp_debug_force_open_route_desc:0 "直接设置开国贸易路线旗标、路线修正和开放数值，用于检查开国与兰学任务。"
 jxp_debug_force_kirishitan_route_title:0 "调试：强制路线：吉利支丹"
 jxp_debug_force_kirishitan_route_desc:0 "转为 KJP 与天主教，设置吉利支丹路线状态，用于检查基督路线内容。"
 jxp_debug_force_confucian_route_title:0 "调试：强制路线：朱子礼制"
 jxp_debug_force_confucian_route_desc:0 "转为 CJP 与儒教，设置朱子礼制路线状态，用于检查儒学路线内容。"
 jxp_debug_force_imperial_route_title:0 "调试：强制路线：王政复古"
 jxp_debug_force_imperial_route_desc:0 "转为 EJP，设置王政复古路线状态，用于检查朝廷路线内容。"
 jxp_debug_force_reformed_route_title:0 "调试：强制路线：改革宗"
 jxp_debug_force_reformed_route_desc:0 "转为 RFJ 与改革宗，设置改革宗路线状态，用于检查平户会议与改革宗任务。"
 jxp_debug_force_kaikyo_route_title:0 "调试：强制路线：海峡清真"
 jxp_debug_force_kaikyo_route_desc:0 "转为 SJP 与逊尼派，设置海峡清真路线状态，用于检查伊斯兰路线内容。"
 jxp_debug_force_ikko_route_title:0 "调试：强制路线：一向一揆"
 jxp_debug_force_ikko_route_desc:0 "转为 IJP 并设置一向宗路线状态，用于检查门徒、寺内町和一揆路线内容。"
 jxp_debug_force_wokou_route_title:0 "调试：强制路线：倭寇海商"
 jxp_debug_force_wokou_route_desc:0 "转为 WAK 并设置倭寇海商路线状态，用于检查海商、私贸和东海路线内容。"
 jxp_debug_seed_christian_contact_title:0 "调试：播种：基督接触"
 jxp_debug_seed_christian_contact_desc:0 "设置吉利支丹接触旗标，并尝试把一个日本港口改为天主教。"
 jxp_debug_seed_reformed_contact_title:0 "调试：播种：改革宗接触"
 jxp_debug_seed_reformed_contact_desc:0 "设置改革宗接触旗标，并尝试把一个日本港口改为改革宗。"
 jxp_debug_seed_kaikyo_contact_title:0 "调试：播种：清真接触"
 jxp_debug_seed_kaikyo_contact_desc:0 "设置海峡清真接触旗标，并尝试把一个日本港口改为逊尼派。"
 jxp_debug_seed_shimabara_pressure_title:0 "调试：播种：岛原压力"
 jxp_debug_seed_shimabara_pressure_desc:0 "清理旧状态，设置潜伏基督徒、闭关、禁教与危机压力，并把岛原之火进度推至临界；1620 年后且拥有相应九州范围时可立即验收。"
 jxp_debug_resolve_shimabara_title:0 "调试：结算：岛原之火"
 jxp_debug_resolve_shimabara_desc:0 "结束正在进行或由调试事件模拟的岛原危机，并保留已解决标记。"
 jxp_debug_cleanup_shimabara_title:0 "调试：清理：岛原之火"
 jxp_debug_cleanup_shimabara_desc:0 "结束岛原危机并清除其 active、resolved、调停与镇压状态，使其可重新验收。"
 jxp_debug_seed_ikko_pressure_title:0 "调试：播种：一向一揆压力"
 jxp_debug_seed_ikko_pressure_desc:0 "清除路线与旧状态，降低天下秩序并把一向一揆进度推至临界；1470 年后、八城且拥有近畿或语义心脏地带时可立即验收。"
 jxp_debug_resolve_ikko_title:0 "调试：结算：一向一揆"
 jxp_debug_resolve_ikko_desc:0 "结束正在进行或由调试事件模拟的一向一揆，并保留已解决标记。"
 jxp_debug_cleanup_ikko_title:0 "调试：清理：一向一揆"
 jxp_debug_cleanup_ikko_desc:0 "结束一向一揆并清除其 active、resolved、调停与镇压状态，使其可重新验收。"
 jxp_debug_seed_keian_pressure_title:0 "调试：播种：庆安浪人压力"
 jxp_debug_seed_keian_pressure_desc:0 "制造低稳定、战争疲劳与低人力，并把庆安浪人危机推至临界；1651 年后统一日本君主制、二十城且拥有江户时可立即验收。"
 jxp_debug_resolve_keian_title:0 "调试：结算：庆安浪人危机"
 jxp_debug_resolve_keian_desc:0 "结束正在进行或由调试事件模拟的庆安浪人危机，并保留已解决标记。"
 jxp_debug_cleanup_keian_title:0 "调试：清理：庆安浪人危机"
 jxp_debug_cleanup_keian_desc:0 "结束庆安浪人危机并清除其 active、resolved 与应对修正，使其可重新验收。"
 jxp_debug_seed_tenmei_pressure_title:0 "调试：播种：天明饥馑压力"
 jxp_debug_seed_tenmei_pressure_desc:0 "制造低稳定、战争疲劳与低人力，并把天明饥馑推至临界；1783 年后统一日本、二十五城且拥有江户时可立即验收。"
 jxp_debug_resolve_tenmei_title:0 "调试：结算：天明饥馑"
 jxp_debug_resolve_tenmei_desc:0 "结束正在进行或由调试事件模拟的天明饥馑，并保留已解决标记。"
 jxp_debug_cleanup_tenmei_title:0 "调试：清理：天明饥馑"
 jxp_debug_cleanup_tenmei_desc:0 "结束天明饥馑并清除其 active、resolved、赈济与配给状态，使其可重新验收。"
 jxp_debug_events_open_title:0 "调试：打开事件触发面板"
 jxp_debug_events_open_desc:0 "显示事件调试分类按钮。单个事件触发按钮默认收起，以免决议界面一次加载过多条目。"
 jxp_debug_events_close_title:0 "调试：关闭事件触发面板"
 jxp_debug_events_close_desc:0 "隐藏所有事件调试分类和单个事件触发按钮，保留核心调试决议。"
 jxp_debug_events_hide_categories_title:0 "调试：收起当前事件分类"
 jxp_debug_events_hide_categories_desc:0 "隐藏当前展开的单事件触发按钮，回到只显示事件分类按钮的状态。"
 jxp_debug_events_show_early_title:0 "调试：事件分类：战国与南蛮"
 jxp_debug_events_show_early_desc:0 "仅显示战国早期、南蛮接触、锁国与兰学入门相关事件的触发按钮。"
 jxp_debug_events_show_kirishitan_title:0 "调试：事件分类：吉利支丹"
 jxp_debug_events_show_kirishitan_desc:0 "仅显示吉利支丹接触、岛原之火和天主教路线相关事件的触发按钮。"
 jxp_debug_events_show_confucian_title:0 "调试：事件分类：朱子礼制"
 jxp_debug_events_show_confucian_desc:0 "仅显示儒学路线、神儒会通和礼制桥接相关事件的触发按钮。"
 jxp_debug_events_show_reformed_kaikyo_title:0 "调试：事件分类：改革宗与海峡"
 jxp_debug_events_show_reformed_kaikyo_desc:0 "仅显示改革宗路线和海峡清真路线相关事件的触发按钮。"
 jxp_debug_events_show_popular_maritime_title:0 "调试：事件分类：一向宗与倭寇"
 jxp_debug_events_show_popular_maritime_desc:0 "仅显示一向宗、寺内町、倭寇海商和东海路线相关事件的触发按钮。"
 jxp_debug_fire_sengoku_1_title:0 "调试：事件：花之御所的阴影"
 jxp_debug_fire_sengoku_1_desc:0 "直接触发战国早期的京都阴影事件。"
 jxp_debug_fire_sengoku_2_title:0 "调试：事件：国人众"
 jxp_debug_fire_sengoku_2_desc:0 "直接触发国人众相关事件，用于测试低天下秩序扩张压力。"
 jxp_debug_fire_sengoku_3_title:0 "调试：事件：上洛邀请"
 jxp_debug_fire_sengoku_3_desc:0 "直接触发京都与上洛相关事件，用于测试天皇裁可奖励和日本区域宣称。"
 jxp_debug_fire_sengoku_4_title:0 "调试：事件：本能寺之影"
 jxp_debug_fire_sengoku_4_desc:0 "直接触发本能寺风味事件，用于测试战国动荡分支。"
 jxp_debug_fire_namban_1_title:0 "调试：事件：种子岛铁炮"
 jxp_debug_fire_namban_1_desc:0 "直接触发火器接触事件。"
 jxp_debug_fire_namban_2_title:0 "调试：事件：南蛮船入港"
 jxp_debug_fire_namban_2_desc:0 "直接触发南蛮贸易与传教接触事件。"
 jxp_debug_fire_namban_3_title:0 "调试：事件：堺商人的请愿"
 jxp_debug_fire_namban_3_desc:0 "直接触发港口商人请愿事件。"
 jxp_debug_fire_namban_4_title:0 "调试：事件：兰书传闻"
 jxp_debug_fire_namban_4_desc:0 "直接触发兰学入门事件。"
 jxp_debug_fire_kirishitan_1_title:0 "调试：事件：传教士到来"
 jxp_debug_fire_kirishitan_1_desc:0 "直接触发吉利支丹初次接触事件。"
 jxp_debug_fire_kirishitan_2_title:0 "调试：事件：受洗大名"
 jxp_debug_fire_kirishitan_2_desc:0 "直接触发受洗大名事件。"
 jxp_debug_fire_kirishitan_3_title:0 "调试：事件：潜伏基督徒"
 jxp_debug_fire_kirishitan_3_desc:0 "直接触发潜伏基督徒事件。"
 jxp_debug_fire_shimabara_title:0 "调试：事件：岛原之火"
 jxp_debug_fire_shimabara_desc:0 "直接触发岛原灾难结局事件，用于检查镇压与和解分支。"
 jxp_debug_fire_kirishitan_5_title:0 "调试：事件：基督教会体制"
 jxp_debug_fire_kirishitan_5_desc:0 "强制进入吉利支丹路线并触发教会体制事件。"
 jxp_debug_fire_kirishitan_7_title:0 "调试：事件：诸岛归信完成"
 jxp_debug_fire_kirishitan_7_desc:0 "强制进入吉利支丹路线并触发归信完成事件。"
 jxp_debug_fire_kirishitan_8_title:0 "调试：事件：长崎主教座"
 jxp_debug_fire_kirishitan_8_desc:0 "强制进入吉利支丹路线并触发长崎主教座事件。"
 jxp_debug_fire_kirishitan_9_title:0 "调试：事件：罗马与京都"
 jxp_debug_fire_kirishitan_9_desc:0 "强制进入吉利支丹路线并触发罗马使节事件。"
 jxp_debug_fire_kirishitan_10_title:0 "调试：事件：海上骑士团"
 jxp_debug_fire_kirishitan_10_desc:0 "强制进入吉利支丹路线并触发远洋宗教军事事件。"
 jxp_debug_fire_sakoku_1_title:0 "调试：事件：锁国令之后"
 jxp_debug_fire_sakoku_1_desc:0 "强制进入锁国路线并触发锁国路线事件。"
 jxp_debug_fire_rangaku_1_title:0 "调试：事件：兰学局"
 jxp_debug_fire_rangaku_1_desc:0 "强制进入开国路线并触发兰学局事件。"
 jxp_debug_fire_confucian_1_title:0 "调试：事件：朱子学讲院"
 jxp_debug_fire_confucian_1_desc:0 "强制进入儒学路线并触发朱子学讲院事件。"
 jxp_debug_fire_confucian_2_title:0 "调试：事件：神儒合一"
 jxp_debug_fire_confucian_2_desc:0 "强制进入儒学路线并触发神儒合一事件。"
 jxp_debug_fire_confucian_4_title:0 "调试：事件：诸国礼教已定"
 jxp_debug_fire_confucian_4_desc:0 "强制进入儒学路线并触发礼教完成事件。"
 jxp_debug_fire_confucian_5_title:0 "调试：事件：宋明理学与神国之礼"
 jxp_debug_fire_confucian_5_desc:0 "强制进入儒学路线并触发思想分歧事件。"
 jxp_debug_fire_confucian_6_title:0 "调试：事件：城下町与町人礼法"
 jxp_debug_fire_confucian_6_desc:0 "强制进入儒学路线并触发城下町礼法事件。"
 jxp_debug_fire_confucian_7_title:0 "调试：事件：南蛮船与礼部咨文"
 jxp_debug_fire_confucian_7_desc:0 "强制进入儒学路线并触发儒学处理南蛮贸易事件。"
 jxp_debug_fire_confucian_shinto_1_title:0 "调试：事件：神儒会通"
 jxp_debug_fire_confucian_shinto_1_desc:0 "强制进入朱子礼制路线、同步神道融合，并触发神儒会通桥接事件。"
 jxp_debug_fire_confucian_shinto_10_title:0 "调试：事件：城下町之议"
 jxp_debug_fire_confucian_shinto_10_desc:0 "强制进入朱子礼制路线、同步神道融合，并触发城市化桥接事件。"
 jxp_debug_fire_confucian_shinto_20_title:0 "调试：事件：南蛮船与礼部咨文"
 jxp_debug_fire_confucian_shinto_20_desc:0 "强制进入朱子礼制路线、同步神道融合，并触发南蛮贸易桥接事件。"
 jxp_debug_fire_confucian_incident_1_title:0 "调试：神道遗绪：铁炮传来"
 jxp_debug_fire_confucian_incident_1_desc:0 "重置并触发儒教日本的铁炮传播桥接事件链。"
 jxp_debug_fire_confucian_incident_10_title:0 "调试：神道遗绪：基督教传播"
 jxp_debug_fire_confucian_incident_10_desc:0 "重置并触发儒教日本的基督教传播桥接事件链。"
 jxp_debug_fire_confucian_incident_20_title:0 "调试：神道遗绪：幕府权威"
 jxp_debug_fire_confucian_incident_20_desc:0 "重置并触发儒教日本的幕府权威桥接事件链。"
 jxp_debug_fire_confucian_incident_30_title:0 "调试：神道遗绪：一向一揆"
 jxp_debug_fire_confucian_incident_30_desc:0 "重置并触发儒教日本的一向一揆桥接事件链。"
