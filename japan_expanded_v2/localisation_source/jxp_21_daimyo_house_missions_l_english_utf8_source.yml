l_english:
 jxp_mission_house_warrior_muster_title:0 "点检旗本军役"
 jxp_mission_house_warrior_muster_desc:0 "乱世不缺勇名，缺的是能按名簿起身、按军令列阵的旗本与郎党。家中诸将须知，战功始于誓纸，也终于军役。"
 jxp_mission_house_warrior_castle_roads_title:0 "修整城道传马"
 jxp_mission_house_warrior_castle_roads_desc:0 "山路、河渡与城下传马相接，军势才能在急报抵达时先于流言动身。所谓强兵，常藏在路、仓与驿脚之中。"
 jxp_mission_house_warrior_banner_legacy_title:0 "立定武门家法"
 jxp_mission_house_warrior_banner_legacy_desc:0 "胜负一日，家法百年。将弓马、铁炮、赏罚和继嗣写入家法，武门之名才不至随一场败绩而散。"
 jxp_mission_house_court_genealogies_title:0 "校订家谱旧文"
 jxp_mission_house_court_genealogies_desc:0 "名门不止凭刀，也凭可被京都承认的谱牒与书札。旧纸经火色而黄，却仍能让诸国看见本家的来历。"
 jxp_mission_house_court_petitions_title:0 "奉呈御所请文"
 jxp_mission_house_court_petitions_desc:0 "兵戈之外尚有文书。向御所奉呈请文、礼物与调停之辞，可以让衰微的公仪再为本家发出一声回响。"
 jxp_mission_house_court_kanrei_memory_title:0 "重申管领余绪"
 jxp_mission_house_court_kanrei_memory_desc:0 "管领、守护与公方旧职或已残破，其余绪仍可化为调停家中、约束诸将的礼法。旧名分若能活用，便非徒然。"
 jxp_mission_house_sea_port_registers_title:0 "编录浦方船籍"
 jxp_mission_house_sea_port_registers_desc:0 "港浦之民逐潮而居，船主、网元与通事各有旧例。将船籍、课役与出入货物编录成册，海国才有可用之财。"
 jxp_mission_house_sea_shipwrights_title:0 "召集船匠水主"
 jxp_mission_house_sea_shipwrights_desc:0 "好船不是临战才有，水主也不是临时可募。船匠、橹手和港中商人若受家法约束，海路便会成为本家的长手。"
 jxp_mission_house_sea_strait_laws_title:0 "定立海峡法度"
 jxp_mission_house_sea_strait_laws_desc:0 "濑户、玄界、日向滩与外海诸路，各有风信和暗礁。以法度约束通行与停泊，海上的利益才不只属于浪人。"
 jxp_mission_house_frontier_passes_title:0 "固守山隘边口"
 jxp_mission_house_frontier_passes_desc:0 "边地的秩序常在雪路、峠口、马市与烽火之间。守住山隘，不只是拒敌，也是让消息与贡纳不致散失。"
 jxp_mission_house_frontier_markets_title:0 "设立边市代官"
 jxp_mission_house_frontier_markets_desc:0 "马、鱼、皮革、木材与盐货沿边路流动，不问京都法度是否周全。任命代官，使边市入账，边地才会成为国力。"
 jxp_mission_house_frontier_border_oaths_title:0 "约束境目诸众"
 jxp_mission_house_frontier_border_oaths_desc:0 "境目诸众最熟悉归附与背离的距离。以誓纸、赏罚和人质重新约束他们，边境便能由裂缝变为屏障。"
 jxp_mission_house_temple_ledgers_title:0 "整录社寺仓簿"
 jxp_mission_house_temple_ledgers_desc:0 "社寺、仓屋与商人账簿常比城中军议更耐久。将旧领、寄进和贡纳重加整理，家政便能在礼法中稳住根基。"
 jxp_mission_house_temple_market_towns_title:0 "修筑门前町市"
 jxp_mission_house_temple_market_towns_desc:0 "门前町、市座与工房不只供养香火，也供养兵粮。若能令商旅安心入市，寺社与城下便会同成一体。"
 jxp_mission_house_temple_public_law_title:0 "公布寺社家法"
 jxp_mission_house_temple_public_law_desc:0 "旧例若只藏在寺社文箱里，便难以约束国人。将社寺、町众与代官的权责明示于家法，可以让小领国拥有清楚的秩序。"
 jxp_21_warrior_muster_rolls:0 "旗本军役名簿"
 jxp_21_warrior_muster_rolls_desc:0 "旗本与郎党依名簿出阵，家中军役更容易在紧急时聚合。"
 jxp_21_warrior_castle_roads:0 "城道传马"
 jxp_21_warrior_castle_roads_desc:0 "城道、驿脚和仓屋连成一线，使防务和征发更为可靠。"
 jxp_21_warrior_banner_legacy:0 "武门家法"
 jxp_21_warrior_banner_legacy_desc:0 "本家的弓马、铁炮和赏罚被写入成文家法，武名因而更能传续。"
 jxp_21_court_genealogies:0 "家谱旧文"
 jxp_21_court_genealogies_desc:0 "经由谱牒和旧文书重申来历，本家在礼法上更具分量。"
 jxp_21_court_petitions:0 "御所请文"
 jxp_21_court_petitions_desc:0 "向御所奉呈的请文和礼物让衰微公仪仍能为本家提供名分。"
 jxp_21_court_kanrei_memory:0 "管领余绪"
 jxp_21_court_kanrei_memory_desc:0 "旧幕府职名被重新解释为家中调停和礼法秩序的工具。"
 jxp_21_sea_port_registers:0 "浦方船籍"
 jxp_21_sea_port_registers_desc:0 "港浦船籍、课役与货物出入被编入家中账册。"
 jxp_21_sea_shipwrights:0 "船匠水主"
 jxp_21_sea_shipwrights_desc:0 "船匠、水主和港商受家法约束，海上动员更为顺畅。"
 jxp_21_sea_strait_laws:0 "海峡法度"
 jxp_21_sea_strait_laws_desc:0 "通行、停泊和海上争端有了可循法度，海国秩序由此成形。"
 jxp_21_frontier_passes:0 "山隘边口"
 jxp_21_frontier_passes_desc:0 "峠口、烽火和边路仓屋被纳入守备，边地秩序更加稳固。"
 jxp_21_frontier_markets:0 "边市代官"
 jxp_21_frontier_markets_desc:0 "边地马市、鱼货和木材交易由代官记录，边境收益不再散逸。"
 jxp_21_frontier_border_oaths:0 "境目誓纸"
 jxp_21_frontier_border_oaths_desc:0 "境目诸众以誓纸、赏罚和人质维系忠诚，边境防线更成体系。"
 jxp_21_temple_ledgers:0 "社寺仓簿"
 jxp_21_temple_ledgers_desc:0 "社寺旧领、寄进和仓屋账簿经重整后成为家政的一部分。"
 jxp_21_temple_market_towns:0 "门前町市"
 jxp_21_temple_market_towns_desc:0 "寺社门前的市座和工房兴盛起来，为城下提供财货与人手。"
 jxp_21_temple_public_law:0 "寺社家法"
 jxp_21_temple_public_law_desc:0 "社寺、町众与代官权责被写成家法，小领国秩序更为清楚。"
