l_english:
 jxp_house_ordinance.1.t:0 "旗本名簿的重勘"
 jxp_house_ordinance.1.d:0 "武门天下法颁行之后，诸国旧旗本与国人众纷纷呈上名簿。有人主张按统一者旧家法严加重勘，也有人认为旧誓纸、旧知行与地方名望不可一概裁断。新日本的军役制度，正在纸页与刀痕之间成形。"
 jxp_house_ordinance.1.a:0 "重勘名簿，令军役归一。"
 jxp_house_ordinance.1.b:0 "承认旧誓，先安诸家之心。"
 jxp_house_ordinance.2.t:0 "京洛席次之争"
 jxp_house_ordinance.2.d:0 "重定京洛职名后，诸家使者开始争论谁应坐于御所阶下，谁又只配候于廊外。礼法能抚平刀兵余波，也会把旧怨重新写入席次。如何解释这些职名，将决定新政权的面目。"
 jxp_house_ordinance.2.a:0 "依旧典列定席次。"
 jxp_house_ordinance.2.b:0 "以实任职司压过虚名。"
 jxp_house_ordinance.3.t:0 "朱印船与私商"
 jxp_house_ordinance.3.d:0 "海门朱印既下，港町年寄、通事、船主与外来商人都试图把自己的航路写进官册。海国经验可以让日本望向远方，也可能让旧日私商换上新印继续逐利。"
 jxp_house_ordinance.3.a:0 "广给朱印，使海路自开。"
 jxp_house_ordinance.3.b:0 "严核港册，船路皆有籍。"
 jxp_house_ordinance.4.t:0 "边境代官的誓纸"
 jxp_house_ordinance.4.d:0 "北境关门安堵之后，境目诸众、马市商人和远地代官送来誓纸。若以军役与边防为先，远境将更像一道屏障；若以互市与通路为先，边地也能成为天下之外的门户。"
 jxp_house_ordinance.4.a:0 "令边防诸役重誓。"
 jxp_house_ordinance.4.b:0 "使互市代官入册。"
 jxp_house_ordinance.5.t:0 "社寺与市座的旧契"
 jxp_house_ordinance.5.d:0 "社寺市座法公布之后，门前町、座商、神官与寺僧各持旧契而来。旧权若尽废，则市声震动；旧权若尽留，则新法失色。统一者必须在香火、账簿与公法之间找出一条可行之路。"
 jxp_house_ordinance.5.a:0 "保留旧契，使礼法缓行。"
 jxp_house_ordinance.5.b:0 "重录账册，使公法先立。"
 jxp_23_warrior_reviewed_musters:0 "重勘旗本名簿"
 jxp_23_warrior_reviewed_musters_desc:0 "诸家军役名簿被重新核定，战时动员更能遵循统一后的制度。"
 jxp_23_warrior_local_oaths:0 "安堵旧誓纸"
 jxp_23_warrior_local_oaths_desc:0 "地方武家旧誓与旧知行得到承认，战后秩序暂时平稳。"
 jxp_23_court_rank_table:0 "京洛席次表"
 jxp_23_court_rank_table_desc:0 "诸家席次依旧典重新排列，礼法名分更有说服力。"
 jxp_23_court_service_offices:0 "实任奉行职司"
 jxp_23_court_service_offices_desc:0 "旧职名被转化为可实际运作的奉行职司，朝廷礼法与行政账册得以衔接。"
 jxp_23_maritime_open_registers:0 "宽给朱印船册"
 jxp_23_maritime_open_registers_desc:0 "更多船主和通事获准进入朱印船册，海路商机随之扩张。"
 jxp_23_maritime_tightened_ports:0 "严核港町船籍"
 jxp_23_maritime_tightened_ports_desc:0 "港町年寄与船主被纳入严密登记，海上财富更少流入私手。"
 jxp_23_frontier_warden_oaths:0 "边防诸役誓纸"
 jxp_23_frontier_warden_oaths_desc:0 "境目诸众与边防代官重新立誓，使远地军役更可依靠。"
 jxp_23_frontier_market_pacts:0 "互市代官账册"
 jxp_23_frontier_market_pacts_desc:0 "边地互市、马市与鱼货入册，远境逐渐成为可经营的门户。"
 jxp_23_temple_privilege_compact:0 "社寺旧契安堵"
 jxp_23_temple_privilege_compact_desc:0 "社寺与门前町的旧契被暂时承认，礼法与信仰免于骤然震动。"
 jxp_23_temple_public_registries:0 "市座公法账册"
 jxp_23_temple_public_registries_desc:0 "市座、仓屋与门前町账册被重录为公法，地方财货流动更可管理。"
