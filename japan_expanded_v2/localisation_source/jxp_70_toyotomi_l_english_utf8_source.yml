l_english:
 jxp_toyotomi_kampaku_taiko_reform:0 "关白·太阁政权"
 jxp_toyotomi_kampaku_taiko_reform_desc:0 "以朝廷授予的关白名分、太阁检地与丰臣奉行体系统摄天下。它既不是足利式幕府，也不是诸大名之一，而是以公家官位、统一田册和天下仕置维系正统的丰臣政权。"
 JXP_TOYOTOMI_KAMPAKU_GOVERNMENT:0 "关白·太阁政权"
 JXP_TOYOTOMI_RULER:0 "丰臣公"
 JXP_TOYOTOMI_CONSORT:0 "御台所"
 JXP_TOYOTOMI_HEIR:0 "丰臣继嗣"
 TOY:0 "丰臣"
 TOY_ADJ:0 "丰臣"

 TOY_ideas:0 "丰臣理念"
 TOY_ideas_start:0 "丰臣传统"
 TOY_ideas_bonus:0 "丰臣野心"
 jxp_toyotomi_osaka_fortress:0 "大坂巨城"
 jxp_toyotomi_osaka_fortress_desc:0 "石山旧址上兴起的不只是一座城。巨石、堀渠与城下町共同宣告：新的天下中枢已经离开安土。"
 jxp_toyotomi_taiko_cadaster:0 "太阁检地"
 jxp_toyotomi_taiko_cadaster_desc:0 "田畠按石高丈量，村界、年贡和军役一并写入统一格式。天下由此成为可以核算、征发与安抚的政体。"
 jxp_toyotomi_sword_hunt:0 "刀狩与兵农分离"
 jxp_toyotomi_sword_hunt_desc:0 "村落兵器被收缴，武士与百姓的役分逐渐分明。政权以秩序之名压低一揆再起的可能。"
 jxp_toyotomi_kampaku_court:0 "关白公议"
 jxp_toyotomi_kampaku_court_desc:0 "武家权力借关白官位进入朝廷礼序。勅使、口宣与诸大名起请文共同支撑新政权的名分。"
 jxp_toyotomi_five_regents:0 "五大老与五奉行"
 jxp_toyotomi_five_regents_desc:0 "重臣与奉行被分别纳入合议、诉讼和财政体系，使个人威望转化为可以延续的政务网络。"
 jxp_toyotomi_red_seal_network:0 "朱印船与诸港"
 jxp_toyotomi_red_seal_network_desc:0 "堺、长崎与濑户内港市由印判相连。海外货物与国内兵粮在同一套许可和账簿中流动。"
 jxp_toyotomi_momoyama_patronage:0 "桃山威仪"
 jxp_toyotomi_momoyama_patronage_desc:0 "金碧障壁、茶会与宏大城郭把权力化为可见的仪式。文化赞助也成为召集诸侯、衡量忠顺的手段。"

 jxp_mission_oda_rakuichi_network_title:0 "广行乐市"
 jxp_mission_oda_rakuichi_network_desc:0 "解除旧座束缚，把商人与工匠引向受本家保护的城下，军需和税源便能随道路一同扩展。"
 jxp_mission_oda_tenka_fubu_mainline_title:0 "天下布武"
 jxp_mission_oda_tenka_fubu_mainline_desc:0 "尾张一国的军旗必须化为号令天下的纲领。铁炮、印判和迅捷进军将为新秩序开路。"
 jxp_mission_oda_azuchi_statutes_mainline_title:0 "立安土法度"
 jxp_mission_oda_azuchi_statutes_mainline_desc:0 "湖畔高城既是军镇，也是政令中枢。把市场、道路和诸将职责写成法度，征服才不会止于一战。"
 jxp_mission_toyotomi_name_and_osaka_title:0 "受姓丰臣，筑城大坂"
 jxp_mission_toyotomi_name_and_osaka_desc:0 "关白之位与丰臣新姓标志着权力不再只是织田家臣团的延续。大坂城将承载一个新的天下政权。"
 jxp_mission_toyotomi_taiko_cadaster_title:0 "丈量天下石高"
 jxp_mission_toyotomi_taiko_cadaster_desc:0 "统一量制、田册与石高，把各地互不相通的旧账改写为中央能够征税、赈济与动员的尺度。"
 jxp_mission_toyotomi_realm_settlement_title:0 "定天下仕置"
 jxp_mission_toyotomi_realm_settlement_desc:0 "诸侯的领地、誓书和军役都要接受重新裁定。丰臣政权必须从个人胜利走向覆盖列岛的公共秩序。"

 jxp_mission_toyotomi_yamazaki_settlement_title:0 "山崎之后"
 jxp_mission_toyotomi_yamazaki_settlement_desc:0 "本能寺的烟尘尚未散尽，山崎的胜负也只解决了眼前之敌。清洲诸将、近畿寺社与京中公卿都在等候一个能够承接织田遗业的新裁断。"
 jxp_mission_toyotomi_kampaku_appointment_title:0 "位极关白"
 jxp_mission_toyotomi_kampaku_appointment_desc:0 "草履取出身的天下人不能只凭军功统御诸侯。摄关家的谱牒、禁里的口宣与丰臣之姓，将为刀兵所得之权披上朝廷礼法。"
 jxp_mission_toyotomi_cadaster_realm_title:0 "检地一统"
 jxp_mission_toyotomi_cadaster_realm_desc:0 "旧庄园的尺、村落的斗与大名的账各不相同。奉行必须踏遍田畠，把石高、年贡与军役写进天下共通的朱印账册。"
 jxp_mission_toyotomi_sword_hunt_realm_title:0 "收天下兵仗"
 jxp_mission_toyotomi_sword_hunt_realm_desc:0 "一揆的长枪、乡村的刀与浪人的铁炮都曾左右战国。令百姓归田、武士归役，方能使兵粮与武具只听命于公仪。"
 jxp_mission_toyotomi_sobuji_order_title:0 "惣无事之令"
 jxp_mission_toyotomi_sobuji_order_desc:0 "诸侯再不得以私怨擅启兵端。国界、继承与旧仇都应送到天下人的案前裁定，违令者便是与整个列岛为敌。"
 jxp_mission_toyotomi_five_commissions_title:0 "大老奉行之制"
 jxp_mission_toyotomi_five_commissions_desc:0 "强藩之势不可一纸抹去，庶政之繁也不能尽决于一人。以大老镇诸侯，以奉行理财赋、诉讼与寺社，使威望成为可以延续的制度。"
 jxp_mission_toyotomi_settle_succession_title:0 "定丰国之嗣"
 jxp_mission_toyotomi_settle_succession_desc:0 "天下曾因主君猝逝而崩解，丰臣家不可重蹈旧辙。继嗣、傅役与诸侯誓纸必须在太阁尚能裁决之时一一写定。"

 jxp_mission_toyotomi_osaka_castle_town_title:0 "筑大坂城下"
 jxp_mission_toyotomi_osaka_castle_town_desc:0 "石山旧址俯临濑户内与淀川水路。巨石高垣之内是本丸，壕渠之外则应汇集仓屋、船场和诸侯屋敷，成为天下真正的腹心。"
 jxp_mission_toyotomi_jurakudai_audiences_title:0 "聚乐第行幸"
 jxp_mission_toyotomi_jurakudai_audiences_desc:0 "黄金殿宇并非只为奢华。天皇行幸、诸侯列席与起请文奉呈，皆把新政权置于一场人人看得见的礼仪之中。"
 jxp_mission_toyotomi_sakai_magistrates_title:0 "置堺奉行"
 jxp_mission_toyotomi_sakai_magistrates_desc:0 "会合众的旧自治、纳屋众的财力与海外船舶的货单都不可任其自流。由奉行保护交易，也由奉行裁断港市。"
 jxp_mission_toyotomi_kuraire_ledgers_title:0 "厘定藏入地"
 jxp_mission_toyotomi_kuraire_ledgers_desc:0 "散布各国的直辖藏入地是大坂政权越过诸侯、直接触及兵粮与金银的根脉。代官账册必须与检地尺度彼此勘合。"
 jxp_mission_toyotomi_gold_silver_offices_title:0 "总领金银山"
 jxp_mission_toyotomi_gold_silver_offices_desc:0 "石见、生野与佐渡的矿脉不只是商贾之利。矿山奉行、吹屋与运上账若归于一制，金银便能支撑城普请、赈济与远征。"
 jxp_mission_toyotomi_momoyama_patronage_title:0 "桃山威仪"
 jxp_mission_toyotomi_momoyama_patronage_desc:0 "金碧障壁、能乐、茶汤与南蛮屏风共同描绘这个时代。天下人召集匠师与茶人，也借一盏茶、一幅画衡量诸侯的距离与忠顺。"
 jxp_mission_toyotomi_taiko_testament_title:0 "太阁遗制"
 jxp_mission_toyotomi_taiko_testament_desc:0 "个人的雄略终有尽时，法度与账簿却应长存。将大老、奉行、藏入地与继嗣誓书合为一体，丰臣天下才可能越过太阁一代。"

 jxp_mission_toyotomi_kyushu_settlement_title:0 "定九州仕置"
 jxp_mission_toyotomi_kyushu_settlement_desc:0 "九州诸家既通南蛮，又各负旧怨。战后的转封、寺社安堵与港口归属必须由中央重新裁断，方能使西国服从同一纸朱印。"
 jxp_mission_toyotomi_oshu_pacification_title:0 "奥州仕置"
 jxp_mission_toyotomi_oshu_pacification_desc:0 "白河关外的豪族惯以遥远为屏障。使者、检地奉行与军势须一同北上，让奥羽诸侯亲自到天下人面前陈列所领。"
 jxp_mission_toyotomi_ryukyu_letters_title:0 "通书琉球"
 jxp_mission_toyotomi_ryukyu_letters_desc:0 "琉球王府往来明、日与南海诸港，其使节所携的不仅是贡物，也是海路风信与东亚礼仪。大坂应以自己的名义回书。"
 jxp_mission_toyotomi_tsushima_channel_title:0 "裁对马海峡"
 jxp_mission_toyotomi_tsushima_channel_desc:0 "宗氏、倭馆与朝鲜通信使之间的旧例纷繁交错。把渡海文引、船数与使节仪注写定，海峡才不会成为诸家私斗之门。"
 jxp_mission_toyotomi_continental_preparations_title:0 "议渡海军役"
 jxp_mission_toyotomi_continental_preparations_desc:0 "若天下人的号令将越过玄界滩，诸侯船役、兵粮转运与沿海守备便须先列成账。海彼之志不可建立在仓促与虚报之上。"
 jxp_mission_toyotomi_east_asian_negotiations_title:0 "重订海东礼次"
 jxp_mission_toyotomi_east_asian_negotiations_desc:0 "明廷册封、朝鲜通信、琉球入贡与日本武家秩序各用一套名分。译官与僧使必须在这些互不相让的礼次之间找到可行之文。"
 jxp_mission_toyotomi_peace_beneath_heaven_title:0 "海内归于一统"
 jxp_mission_toyotomi_peace_beneath_heaven_desc:0 "从萨摩海岸到奥羽关隘，诸侯不再擅战，驿路可以通行，田册可以复核。所谓天下，至此才不只是军旗上的两个字。"

 jxp_decision_assume_toyotomi_name_title:0 "请受丰臣姓"
 jxp_decision_assume_toyotomi_name_desc:0 "织田旧主已逝，安土体制也不足以容纳今日的天下。借朝廷官位、丰臣新姓与大坂中枢，建立属于本家的政权。"
 jxp_establish_toyotomi_identity_tt:0 "国家将转为§Y丰臣§!，保留织田出身记忆，并同步丰臣理念、任务与政治改革。"

 jxp_reform_founder_toyotomi_five_regents:0 "丰臣五大老政务"
 jxp_reform_founder_toyotomi_five_regents_desc:0 "太阁检地、奉行诉讼与大老合议共同构成丰臣仕置。它既承认强大诸侯的分量，也要求天下政务通过统一账簿与誓书运转。"

 jxp_70_toyotomi_market_charters:0 "乐市朱印网"
 jxp_70_toyotomi_market_charters_desc:0 "城下市场以统一朱印和道路保护相连。"
 jxp_70_toyotomi_tenka_command:0 "天下布武军令"
 jxp_70_toyotomi_tenka_command_desc:0 "军令、铁炮与印判被编入同一扩张纲领。"
 jxp_70_toyotomi_azuchi_offices:0 "安土政务所"
 jxp_70_toyotomi_azuchi_offices_desc:0 "城下法度把地方账册汇入新的政务中枢。"
 jxp_70_toyotomi_osaka_works:0 "大坂普请"
 jxp_70_toyotomi_osaka_works_desc:0 "巨城与城下町的营建显示新政权的资源和号召力。"
 jxp_70_toyotomi_cadaster_office:0 "太阁检地奉行"
 jxp_70_toyotomi_cadaster_office_desc:0 "奉行依统一尺度丈量田畠、核算石高。"
 jxp_70_toyotomi_realm_settlement:0 "天下仕置"
 jxp_70_toyotomi_realm_settlement_desc:0 "诸侯领地与军役由中央重新裁定。"
 jxp_70_toyotomi_five_regents_policy:0 "大老合议"
 jxp_70_toyotomi_five_regents_policy_desc:0 "重臣在既定誓书和政务程序内共同议事。"
 jxp_70_toyotomi_cadaster_policy:0 "奉行检地"
 jxp_70_toyotomi_cadaster_policy_desc:0 "检地与诉讼文书继续深入各地。"
 jxp_70_toyotomi_yamazaki_settlement:0 "山崎清洲仕置"
 jxp_70_toyotomi_yamazaki_settlement_desc:0 "旧织田家臣团以新的安堵与誓纸重新排定。"
 jxp_70_toyotomi_kampaku_audiences:0 "关白朝仪"
 jxp_70_toyotomi_kampaku_audiences_desc:0 "朝廷官位与诸侯参礼共同支撑丰臣政权的名分。"
 jxp_70_toyotomi_sword_hunt_order:0 "兵农役分"
 jxp_70_toyotomi_sword_hunt_order_desc:0 "乡村武具与武家军役被纳入彼此分明的秩序。"
 jxp_70_toyotomi_sobuji_peace:0 "惣无事公仪"
 jxp_70_toyotomi_sobuji_peace_desc:0 "诸侯争端须由天下政权裁断，不得擅自诉诸兵戈。"
 jxp_70_toyotomi_osaka_granaries:0 "大坂船场仓"
 jxp_70_toyotomi_osaka_granaries_desc:0 "淀川与濑户内运来的米粮汇入大坂仓屋。"
 jxp_70_toyotomi_kuraire_domain:0 "藏入地代官账"
 jxp_70_toyotomi_kuraire_domain_desc:0 "丰臣直辖地的石高、运上与代官职责皆有账可稽。"
 jxp_70_toyotomi_gold_silver_offices:0 "金银山奉行"
 jxp_70_toyotomi_gold_silver_offices_desc:0 "矿山、吹屋与运上由专任奉行统一管理。"
 jxp_70_toyotomi_momoyama_court:0 "桃山公仪"
 jxp_70_toyotomi_momoyama_court_desc:0 "艺术赞助与宏大仪礼使天下秩序变得可见。"
 jxp_70_toyotomi_channel_embassies:0 "海峡通信仪注"
 jxp_70_toyotomi_channel_embassies_desc:0 "渡海文引、译官与使节礼序依统一成例运转。"
 jxp_70_toyotomi_continental_staff:0 "渡海兵站奉行"
 jxp_70_toyotomi_continental_staff_desc:0 "船役、兵粮与沿海守备由专门奉行预先核定。"
 jxp_70_toyotomi_taiko_testament:0 "太阁遗制"
 jxp_70_toyotomi_taiko_testament_desc:0 "继嗣誓书、大老合议与奉行账簿被合为长久制度。"

 jxp_toyotomi.2.t:0 "大老与奉行之间"
 jxp_toyotomi.2.d:0 "丰臣仕置既依赖大老的声望与兵力，也依赖奉行手中的田册、判物和诉讼程序。两者必须分出本轮政务的轻重。"
 jxp_toyotomi.2.a:0 "先令奉行整齐天下账册"
 jxp_toyotomi.2.b:0 "先以大老合议安定诸侯"
