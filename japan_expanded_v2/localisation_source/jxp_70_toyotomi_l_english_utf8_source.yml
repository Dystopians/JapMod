l_english:
 TOY:0 "丰臣"
 TOY_ADJ:0 "丰臣"

 TOY_ideas:0 "丰臣理念"
 TOY_ideas_start:0 "丰臣传统"
 TOY_ideas_bonus:0 "丰臣野心"
 jxp_toyotomi_osaka_fortress:0 "大坂巨城"
 jxp_toyotomi_osaka_fortress_desc:0 "石山旧址上兴起的不只是一座城。巨石、堀渠与城下町共同宣告：新的天下中枢已经离开安土。"
 jxp_toyotomi_taiko_cadaster:0 "太阁检地"
 jxp_toyotomi_taiko_cadaster_desc:0 "田畠按石高丈量，村界、年贡和军役一并写入统一格式。天下由此成为可以核算、征发与安抚的政体。"
 jxp_toyotomi_sword_hunt:0 "刀狩与兵农分离"
 jxp_toyotomi_sword_hunt_desc:0 "村落兵器被收缴，武士与百姓的役分逐渐分明。政权以秩序之名压低一揆再起的可能。"
 jxp_toyotomi_kampaku_court:0 "关白公议"
 jxp_toyotomi_kampaku_court_desc:0 "武家权力借关白官位进入朝廷礼序。勅使、口宣与诸大名起请文共同支撑新政权的名分。"
 jxp_toyotomi_five_regents:0 "五大老与五奉行"
 jxp_toyotomi_five_regents_desc:0 "重臣与奉行被分别纳入合议、诉讼和财政体系，使个人威望转化为可以延续的政务网络。"
 jxp_toyotomi_red_seal_network:0 "朱印船与诸港"
 jxp_toyotomi_red_seal_network_desc:0 "堺、长崎与濑户内港市由印判相连。海外货物与国内兵粮在同一套许可和账簿中流动。"
 jxp_toyotomi_momoyama_patronage:0 "桃山威仪"
 jxp_toyotomi_momoyama_patronage_desc:0 "金碧障壁、茶会与宏大城郭把权力化为可见的仪式。文化赞助也成为召集诸侯、衡量忠顺的手段。"

 jxp_mission_oda_rakuichi_network_title:0 "广行乐市"
 jxp_mission_oda_rakuichi_network_desc:0 "解除旧座束缚，把商人与工匠引向受本家保护的城下，军需和税源便能随道路一同扩展。"
 jxp_mission_oda_tenka_fubu_mainline_title:0 "天下布武"
 jxp_mission_oda_tenka_fubu_mainline_desc:0 "尾张一国的军旗必须化为号令天下的纲领。铁炮、印判和迅捷进军将为新秩序开路。"
 jxp_mission_oda_azuchi_statutes_mainline_title:0 "立安土法度"
 jxp_mission_oda_azuchi_statutes_mainline_desc:0 "湖畔高城既是军镇，也是政令中枢。把市场、道路和诸将职责写成法度，征服才不会止于一战。"
 jxp_mission_toyotomi_name_and_osaka_title:0 "受姓丰臣，筑城大坂"
 jxp_mission_toyotomi_name_and_osaka_desc:0 "关白之位与丰臣新姓标志着权力不再只是织田家臣团的延续。大坂城将承载一个新的天下政权。"
 jxp_mission_toyotomi_taiko_cadaster_title:0 "丈量天下石高"
 jxp_mission_toyotomi_taiko_cadaster_desc:0 "统一量制、田册与石高，把各地互不相通的旧账改写为中央能够征税、赈济与动员的尺度。"
 jxp_mission_toyotomi_realm_settlement_title:0 "定天下仕置"
 jxp_mission_toyotomi_realm_settlement_desc:0 "诸侯的领地、誓书和军役都要接受重新裁定。丰臣政权必须从个人胜利走向覆盖列岛的公共秩序。"

 jxp_decision_assume_toyotomi_name_title:0 "请受丰臣姓"
 jxp_decision_assume_toyotomi_name_desc:0 "织田旧主已逝，安土体制也不足以容纳今日的天下。借朝廷官位、丰臣新姓与大坂中枢，建立属于本家的政权。"
 jxp_establish_toyotomi_identity_tt:0 "国家将转为§Y丰臣§!，保留织田出身记忆，并同步丰臣理念、任务与政治改革。"

 jxp_reform_founder_toyotomi_five_regents:0 "丰臣五大老政务"
 jxp_reform_founder_toyotomi_five_regents_desc:0 "太阁检地、奉行诉讼与大老合议共同构成丰臣仕置。它既承认强大诸侯的分量，也要求天下政务通过统一账簿与誓书运转。"

 jxp_70_toyotomi_market_charters:0 "乐市朱印网"
 jxp_70_toyotomi_market_charters_desc:0 "城下市场以统一朱印和道路保护相连。"
 jxp_70_toyotomi_tenka_command:0 "天下布武军令"
 jxp_70_toyotomi_tenka_command_desc:0 "军令、铁炮与印判被编入同一扩张纲领。"
 jxp_70_toyotomi_azuchi_offices:0 "安土政务所"
 jxp_70_toyotomi_azuchi_offices_desc:0 "城下法度把地方账册汇入新的政务中枢。"
 jxp_70_toyotomi_osaka_works:0 "大坂普请"
 jxp_70_toyotomi_osaka_works_desc:0 "巨城与城下町的营建显示新政权的资源和号召力。"
 jxp_70_toyotomi_cadaster_office:0 "太阁检地奉行"
 jxp_70_toyotomi_cadaster_office_desc:0 "奉行依统一尺度丈量田畠、核算石高。"
 jxp_70_toyotomi_realm_settlement:0 "天下仕置"
 jxp_70_toyotomi_realm_settlement_desc:0 "诸侯领地与军役由中央重新裁定。"
 jxp_70_toyotomi_five_regents_policy:0 "大老合议"
 jxp_70_toyotomi_five_regents_policy_desc:0 "重臣在既定誓书和政务程序内共同议事。"
 jxp_70_toyotomi_cadaster_policy:0 "奉行检地"
 jxp_70_toyotomi_cadaster_policy_desc:0 "检地与诉讼文书继续深入各地。"

 jxp_toyotomi.2.t:0 "大老与奉行之间"
 jxp_toyotomi.2.d:0 "丰臣仕置既依赖大老的声望与兵力，也依赖奉行手中的田册、判物和诉讼程序。两者必须分出本轮政务的轻重。"
 jxp_toyotomi.2.a:0 "先令奉行整齐天下账册"
 jxp_toyotomi.2.b:0 "先以大老合议安定诸侯"
