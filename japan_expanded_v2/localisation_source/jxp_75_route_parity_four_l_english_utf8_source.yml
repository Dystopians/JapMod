l_english:
 jxp_decision_convene_kirishitan_visitation_title:0 "召集南蛮寺院巡察"
 jxp_decision_convene_kirishitan_visitation_desc:0 "神学校、慈悲会与长崎水师各自维系着信仰国度的一面。召集教士、町役与奉行，查明其章程是否仍与国政相合。"
 jxp_decision_convene_confucian_rite_code_council_title:0 "召开礼典律令议"
 jxp_decision_convene_confucian_rite_code_council_desc:0 "贡院名册、律令条文与三教仪注已经遍行诸国，却也在地方解释中生出歧义。召集儒臣与诸道官员，重定施行次序。"
 jxp_decision_convene_reformed_policy_consistory_title:0 "召集会堂国政会议"
 jxp_decision_convene_reformed_policy_consistory_desc:0 "印刷会堂、市民盟约与契约舰队都以成文誓约为根基。各地代表请求再次核订这些誓约如何约束国家与臣民。"
 jxp_decision_review_kaikyo_monsoon_diwan_title:0 "重议季风诸司"
 jxp_decision_review_kaikyo_monsoon_diwan_desc:0 "季风航期、慈善田账与香料护航把群岛连接到更远的海域。召集港务官、学者与商团，裁定下一轮国政重心。"

 jxp_75_has_kirishitan_policy_reform_trigger:0 "已采用至少一项吉利支丹路线改革"
 jxp_75_has_confucian_policy_reform_trigger:0 "已采用至少一项朱子礼制路线改革"
 jxp_75_has_reformed_policy_reform_trigger:0 "已采用至少一项改革宗路线改革"
 jxp_75_has_kaikyo_policy_reform_trigger:0 "已采用至少一项海教路线改革"

 jxp_route_parity_four.1.t:0 "南蛮寺院年度巡察"
 jxp_route_parity_four.1.d:0 "巡察使带回神学校课簿、慈悲会施药册与长崎水师的船员名录。三套制度都以信仰为名，却把国门、朝廷与地方秩序引向不同方向。"
 jxp_route_parity_four.1.a:0 "准神学校广译经义与西学"
 jxp_route_parity_four.1.b:0 "令慈悲会专理病坊与赈济"
 jxp_route_parity_four.1.c:0 "编教友通事入长崎水师"
 jxp_route_parity_four.2.t:0 "礼曹与诸道经筵"
 jxp_route_parity_four.2.d:0 "贡院考官、律学博士与三教议郎各执一卷成规。有人主张以名分整齐天下，有人则提醒过度齐一会阻断新知与地方调和。"
 jxp_route_parity_four.2.a:0 "统一诸道贡院名册"
 jxp_route_parity_four.2.b:0 "校订华制律令与地方条目"
 jxp_route_parity_four.2.c:0 "令三教议郎互释经典"
 jxp_route_parity_four.3.t:0 "会堂与市民盟约会议"
 jxp_route_parity_four.3.d:0 "印刷匠人携来各地讲章，町众代表陈列签押盟约，舰队承包人则要求确认海上章程。成文信约扩大了议论，也不断削弱旧有权威。"
 jxp_route_parity_four.3.a:0 "准会堂刊行校订讲章"
 jxp_route_parity_four.3.b:0 "重誓町众公约并公开账目"
 jxp_route_parity_four.3.c:0 "以成文条款续订舰队契约"
 jxp_route_parity_four.4.t:0 "季风航期与慈善田会议"
 jxp_route_parity_four.4.d:0 "港务官展开季风表，慈善田管事呈上仓簿，护航将领则指向香料航线。远海财富、内地安定与君主裁可无法同时毫无代价地扩张。"
 jxp_route_parity_four.4.a:0 "按季风重排诸港税期"
 jxp_route_parity_four.4.b:0 "以御前文书清查慈善田仓"
 jxp_route_parity_four.4.c:0 "合编香料护航与水师轮值"

 jxp_75_route_policy_recent:0 "路线议政施行中"
 jxp_75_route_policy_recent_desc:0 "本轮议政已交付诸司施行，须待地方簿册与使节回报齐备后再行总议。"
 jxp_75_kirishitan_seminary_visitation:0 "神学校巡察课簿"
 jxp_75_kirishitan_seminary_visitation_desc:0 "巡察后的神学校以统一课簿教授经义、语言与异国学问。"
 jxp_75_kirishitan_mercy_accounts:0 "慈悲会施药账"
 jxp_75_kirishitan_mercy_accounts_desc:0 "病坊、孤儿院与赈济所采用共同账册，地方救济不再全靠临时募捐。"
 jxp_75_kirishitan_harbor_chaplains:0 "长崎水师通事团"
 jxp_75_kirishitan_harbor_chaplains_desc:0 "熟悉教友社群与外语的通事随水师出航，使舰队更善于接引远方船只。"
 jxp_75_confucian_examination_rosters:0 "诸道贡院总录"
 jxp_75_confucian_examination_rosters_desc:0 "各地考生、考官与取士标准汇入总录，朝廷更易比较诸道人才。"
 jxp_75_confucian_code_commission:0 "华制律令校订局"
 jxp_75_confucian_code_commission_desc:0 "律学官把经典名分与地方旧例并列校订，减少政令抵牾。"
 jxp_75_confucian_three_teachings_concordance:0 "三教义例会通"
 jxp_75_confucian_three_teachings_concordance_desc:0 "儒释神三方学者编成对照义例，使不同传统能在同一礼制下相互解释。"
 jxp_75_reformed_printing_consistory:0 "会堂印刷审议院"
 jxp_75_reformed_printing_consistory_desc:0 "各地会堂共同校订印本，新的讲章与学说更快传入城镇。"
 jxp_75_reformed_civic_auditors:0 "市民盟约查账团"
 jxp_75_reformed_civic_auditors_desc:0 "受町众推举的查账员公开核对赋役与公产，成文盟约因而更可信。"
 jxp_75_reformed_fleet_articles:0 "契约舰队成文章程"
 jxp_75_reformed_fleet_articles_desc:0 "船主、舰长与水手的义务写入统一章程，远海舰队得以按约调度。"
 jxp_75_kaikyo_monsoon_accounts:0 "季风诸港会计"
 jxp_75_kaikyo_monsoon_accounts_desc:0 "诸港依航期统一申报货单与税账，跨海商路更易衔接。"
 jxp_75_kaikyo_endowment_granaries:0 "慈善田仓总簿"
 jxp_75_kaikyo_endowment_granaries_desc:0 "慈善田产与地方粮仓由御前文书确认，赈济来源因而更为稳固。"
 jxp_75_kaikyo_convoy_muster:0 "香料护航轮值"
 jxp_75_kaikyo_convoy_muster_desc:0 "商船与水师按季风合编轮值，远海船队更能抵御突袭与风浪。"

 jxp_debug_fire_route_parity_four_kirishitan_title:0 "调试：触发吉利支丹议政"
 jxp_debug_fire_route_parity_four_kirishitan_desc:0 "通过本切片的公共重置接口清除有限期状态，并直接打开吉利支丹路线议政。需先处于精确路线并采用对应改革。"
 jxp_debug_fire_route_parity_four_confucian_title:0 "调试：触发朱子礼制议政"
 jxp_debug_fire_route_parity_four_confucian_desc:0 "通过本切片的公共重置接口清除有限期状态，并直接打开朱子礼制路线议政。需先处于精确路线并采用对应改革。"
 jxp_debug_fire_route_parity_four_reformed_title:0 "调试：触发改革宗议政"
 jxp_debug_fire_route_parity_four_reformed_desc:0 "通过本切片的公共重置接口清除有限期状态，并直接打开改革宗路线议政。需先处于精确路线并采用对应改革。"
 jxp_debug_fire_route_parity_four_kaikyo_title:0 "调试：触发海教议政"
 jxp_debug_fire_route_parity_four_kaikyo_desc:0 "通过本切片的公共重置接口清除有限期状态，并直接打开海教路线议政。需先处于精确路线并采用对应改革。"
