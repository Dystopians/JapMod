l_english:
 jxp_hjo_kamakura_legacy:0 "镰仓旧威"
 jxp_hjo_kamakura_legacy_desc:0 "关东仍记得镰仓府与执权旧名。北条家借其余光，不只为自抬门第，也为调停关东诸豪时多一重可被承认的名分。"
 jxp_ask_court_defenders:0 "禁里守护"
 jxp_ask_court_defenders_desc:0 "将军家以护持朝仪自任。京都礼法虽弱，仍能使武威带上公仪之色；熟悉宫门内外耳目者，也更能预先察觉风向。"
 IMG_ideas_bonus:0 "东海道制衡"
 jxp_ama_gassan_toda_castle:0 "月山富田城"
 jxp_ama_gassan_toda_castle_desc:0 "月山富田城倚山控道，非徒高垒而已。银山、山道、粮仓与山阴国众的动向，都在此城阴影之下。"
 jxp_hsk_kanrei:0 "管领家"
 jxp_hsk_kanrei_desc:0 "细川之名久列幕府中枢。旧职不能代替兵马，却能把畿内纷争写入制度文书，使强权有可申说的名分。"
 jxp_isk_samurai_dokoro:0 "侍所旧职"
 jxp_isk_samurai_dokoro_desc:0 "侍所之名意味着巡察、纠举与武家秩序。若能复其条目，地方纷扰便不只是私斗，而可化作可裁断的案件。"
 jxp_tti_nara_city:0 "奈良町"
 jxp_tti_nara_city_desc:0 "奈良不只是旧都，也是寺社、町人、学侣和武士交会的复杂都市。懂得与诸方周旋，才可在大和立足。"
 jxp_rfr_rebellious_vassals:0 "镇抚分族"
 jxp_rfr_rebellious_vassals_desc:0 "北奥边地分族一旦坐大，便会威胁本家。南部政令必须兼具裁断与赦免，使旧怨不至于化作漫长内耗。"
 jxp_asa_seventeen_articles:0 "十七箇条家法"
 jxp_asa_seventeen_articles_desc:0 "家法把国人、奉行与家臣各置其位。法条不能令乱世无争，却能把争端压回案牍与裁许之中。"
 jxp_asa_keitai_legacy:0 "继体帝旧闻"
 jxp_asa_keitai_legacy_desc:0 "越前关于继体天皇的旧传，使朝仓家能把地方统治镶入更古老的王统叙事之中。此类旧闻若用得其宜，足以开宫廷之门。"
 jxp_htk_wakae_castle:0 "若江城"
 jxp_htk_wakae_castle_desc:0 "若江城控制河内要冲，城垒虽不夺目，却足以让畠山家在畿内争局中保有支点，并容纳一批可随时调发的守备。"
 jxp_htk_clan_unification:0 "两畠山归一"
 jxp_htk_clan_unification_desc:0 "分裂的畠山若能重归一门，旧臣与国人便可重新列入同一军役名簿。归一不是静默，而是让旧争有新的出口。"
 jxp_ike_terumasa_governance:0 "辉政治理"
 jxp_ike_terumasa_governance_desc:0 "池田辉政以城、町、账册与奉行统合播磨旧地。治理不只求一时安静，更在于让城下能长期供给国家。"
 jxp_mae_kanazawa_castle:0 "金泽城"
 jxp_mae_kanazawa_castle_desc:0 "金泽城是加贺百万石的中枢，城郭、町割与文化声望交织其间。它守护的不只是军仓，也是一国体面。"
 jxp_sba_kanrei_consolidation:0 "管领旧格"
 jxp_sba_kanrei_consolidation_desc:0 "斯波旧称管领，虽历衰败，仍可借旧格重整文书、代官与奉公秩序。名分若要有用，须落在行政之中。"
 jxp_sba_retainers:0 "武卫被官"
 jxp_sba_retainers_desc:0 "斯波旧臣散在尾张、越前与远江。重录被官、厘清军役，方能使旧家声转化为可负担的兵粮与役钱。"
 jxp_ymn_nitta_descent:0 "新田源氏之裔"
 jxp_ymn_nitta_descent_desc:0 "山名以新田源氏之后自许，名门血脉使其在西国诸守护之间保有可谈判的身位。门第不能胜战，却能开席。"
 jxp_ymn_isolated_heartland:0 "山阴屏障"
 jxp_ymn_isolated_heartland_desc:0 "山阴腹地多山多雪，远离畿内喧嚣。这样的孤绝既是迟滞，也是屏障，足以消磨贸然深入的敌军。"
 jxp_akm_castle_network:0 "播磨城砦网"
 jxp_akm_castle_network_desc:0 "赤松旧领遍布城砦、驿路与山隘。城郭彼此呼应，也使敌我使者、间者与兵粮行迹更难隐没。"
 jxp_stk_hitachi_genji:0 "常陆源氏"
 jxp_stk_hitachi_genji_desc:0 "佐竹家以源氏旧名自重，在关东诸豪之间保有古老声望。此名若与骑射武功相连，便不只是谱牒上的字迹。"
 jxp_stk_ikki_suppression:0 "一揆镇抚"
 jxp_stk_ikki_suppression_desc:0 "常陆的土豪、一揆与寺社势力不可只以刀兵对待。镇压之后仍须减轻战事余波，使田亩与军役能复旧。"
 jxp_stk_mito_castle:0 "水户城"
 jxp_stk_mito_castle_desc:0 "水户城控那珂川与常陆平野，既是军城，也是税粮与文书汇集之处。固守此地，方能让东国经营有根。"
 jxp_tki_inabayama_castle:0 "稻叶山城"
 jxp_tki_inabayama_castle_desc:0 "稻叶山俯瞰美浓要冲，城险之外，更倚赖山路、暗线与城下消息。守此城者，须先听见风声。"
 jxp_utn_fujiwara_descent:0 "藤原旧胄"
 jxp_utn_fujiwara_descent_desc:0 "宇都宫以藤原旧胄自居，又系日光山与关东诸门第。旧姓若能维系朝廷与寺社之缘，便可化作温和而持久的威望。"
 jxp_utn_shirakawa_barrier:0 "白河关"
 jxp_utn_shirakawa_barrier_desc:0 "白河关是奥羽与关东之间的古老门槛。守住关隘，不只为拒敌，也为掌握南北往来的节奏。"
