l_english:
 jxp_decision_compile_founder_idea_legacy_title:0 "编纂开府国策"
 jxp_decision_compile_founder_idea_legacy_desc:0 "开府大名旧日的军法、商约、社寺文书与城下账册，仍散在诸国官署之中。若将其编为国策，日本便不会在统一之后忘记自己从何处起身。"
 jxp_founder_idea_legacy.1.t:0 "武家国策的编纂"
 jxp_founder_idea_legacy.1.d:0 "创始家的国策多由军令、知行、城砦和家臣誓纸磨成。编纂者请求保留其锋利的家名特色；奉行则认为它应被整理成较平稳的武家学校与官署惯例。"
 jxp_founder_idea_legacy.1.a:0 "保留开府家名的锋芒。"
 jxp_founder_idea_legacy.1.b:0 "改编为武家学校。"
 jxp_founder_idea_legacy.2.t:0 "朝廷国策的编纂"
 jxp_founder_idea_legacy.2.d:0 "创始家的国策若来自奉书、官位、礼法或名门旧例，便不能只按军功衡量。学者与旧臣在案前争论：国策应铭记家名，还是成为全国官署可援引的成例。"
 jxp_founder_idea_legacy.2.a:0 "铭记开府家名的文书。"
 jxp_founder_idea_legacy.2.b:0 "化作诸官署成例。"
 jxp_founder_idea_legacy.3.t:0 "海路国策的编纂"
 jxp_founder_idea_legacy.3.d:0 "若开府家风曾从海港、商馆、水军或异国通事中得力，其国策便带着潮声。港町希望保存旧日商路，船将则要求把这些经验写进国家海政。"
 jxp_founder_idea_legacy.3.a:0 "保留开府海路的名号。"
 jxp_founder_idea_legacy.3.b:0 "改编为海政学校。"
 jxp_founder_idea_legacy.4.t:0 "边地国策的编纂"
 jxp_founder_idea_legacy.4.d:0 "边地大名留下的国策，往往懂得山路、关隘、外岛与远境人情。有人主张保存其开拓精神，有人主张将其化为边防与通事制度。"
 jxp_founder_idea_legacy.4.a:0 "保留开府边地旧法。"
 jxp_founder_idea_legacy.4.b:0 "改编为边境官学。"
 jxp_founder_idea_legacy.5.t:0 "寺社町市国策的编纂"
 jxp_founder_idea_legacy.5.d:0 "若创始家根植于寺社、町市、学问或账房，它的国策便介于香火与算盘之间。旧约可以被铭记为家名特色，也可以被整理成诸国町市皆可学习的常法。"
 jxp_founder_idea_legacy.5.a:0 "保留开府旧约的名号。"
 jxp_founder_idea_legacy.5.b:0 "改编为町社学校。"
 jxp_39_oda_idea_legacy:0 "织田国策遗产"
 jxp_39_oda_idea_legacy_desc:0 "乐市乐座、天下布武与安土法度被编成国策，使织田家的速度与锋芒留在统一后的政务中。"
