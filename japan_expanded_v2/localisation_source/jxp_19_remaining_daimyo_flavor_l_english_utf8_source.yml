l_english:
 jxp_decision_asa_ichijodani_council_title:0 "召集一乘谷评议"
 jxp_decision_asa_ichijodani_council_desc:0 "一乘谷的馆第、寺门与町屋足以容纳越前诸声。使书札与誓纸先于刀枪抵达，朝仓家便能把山谷经营为小京都。"
 jxp_decision_htk_wakae_retainer_oaths_title:0 "重订若江被官誓约"
 jxp_decision_htk_wakae_retainer_oaths_desc:0 "畠山诸支与被官若各持旧怨，河内之兵便难以合阵。若江城前的誓约应使家名重新压过私争。"
 jxp_decision_ike_himeji_accounts_title:0 "整编姬路城账目"
 jxp_decision_ike_himeji_accounts_desc:0 "白壁之城需要清楚账册支撑。池田家将仓廪、役夫与城普请重新归档，使新领不再只是转封后的陌生土地。"
 jxp_decision_mae_kanazawa_patronage_title:0 "兴办金泽文艺"
 jxp_decision_mae_kanazawa_patronage_desc:0 "茶、能、书画与学问并非闲饰。前田家若能使文事入城下，富庶便会化为令人敬畏的秩序。"
 jxp_decision_sba_buei_restoration_title:0 "宣示武卫旧职"
 jxp_decision_sba_buei_restoration_desc:0 "斯波之名曾与幕府军职相连。旧称号若再度被庄重宣示，便能使衰落家声重回诸家议席。"
 jxp_decision_ymn_sixth_share_registers_title:0 "重修六分一旧簿"
 jxp_decision_ymn_sixth_share_registers_desc:0 "山名旧领散见于文书与寺院记忆之中。把失落的账簿重新整理，便是把西军旧望从纸上唤回。"
 jxp_decision_akm_banshu_castle_chain_title:0 "修筑播州城链"
 jxp_decision_akm_banshu_castle_chain_desc:0 "播磨山道与支城相互呼应。赤松家不愿把命运寄于孤城，而要让敌军在每一处关隘前停步。"
 jxp_decision_kkc_aso_fire_rites_title:0 "整饬阿苏火祭"
 jxp_decision_kkc_aso_fire_rites_desc:0 "阿苏神社的祭礼可使肥后豪族与百姓同见一火。菊池家借神前秩序调停诸信与诸郡。"
 jxp_decision_stk_kashima_muster_title:0 "鹿岛神前点兵"
 jxp_decision_stk_kashima_muster_desc:0 "常陆武士在鹿岛神前立誓，刀枪因祭礼而得名分。佐竹家以神威与军纪一并整合东国士卒。"
 jxp_decision_tki_mino_river_works_title:0 "督修美浓三川"
 jxp_decision_tki_mino_river_works_desc:0 "木曾、长良、揖斐三川养田，也能毁田。土岐家若能驯水，便能使美浓的粮赋与城下同获安定。"
 jxp_decision_utn_nikko_barrier_guard_title:0 "委任日光关使"
 jxp_decision_utn_nikko_barrier_guard_desc:0 "日光山与白河关连接神佛、奥羽与关东。宇都宫家以关使守护道路，也守护家名的北方门户。"
 jxp_decision_soo_tsushima_brokers_title:0 "任命对马通交代官"
 jxp_decision_soo_tsushima_brokers_desc:0 "对马海峡不只通船，也通文书、礼物与猜疑。宗氏若能使译者、船头与代官各司其职，便可在两岸之间保全家名。"

