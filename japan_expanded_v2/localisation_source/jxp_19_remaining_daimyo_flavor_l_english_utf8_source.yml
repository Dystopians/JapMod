 jxp_remaining_daimyo.1.t:0 "谷中书札"
 jxp_remaining_daimyo.1.d:0 "越前雪深，山路难行，然而书札仍在一乘谷与京洛诸门之间往返。家臣劝我们趁诸国相疑之时，以礼书、婚议与寺社交涉重新编织朝仓家的声望；也有人主张先整饬谷内账簿，使政令足以抵达每一座支城。"
 jxp_remaining_daimyo.1.a:0 "先使书札入京。"
 jxp_remaining_daimyo.1.b:0 "先使谷内成法。"
 jxp_remaining_daimyo.2.t:0 "两畠山之议"
 jxp_remaining_daimyo.2.d:0 "畠山家名虽列三管领，诸支却久有龃龉。若江城中，重臣陈说旧誓，年轻武士则要求以兵威先压诸郡。旧名仍可使用，但它必须选择一种重新发声的方式。"
 jxp_remaining_daimyo.2.a:0 "重订被官誓约。"
 jxp_remaining_daimyo.2.b:0 "向京中重申旧职。"
 jxp_remaining_daimyo.3.t:0 "白壁之城"
 jxp_remaining_daimyo.3.d:0 "姬路城普请尚未完全散去烟尘，账房已堆满木材、米谷与役夫名册。池田家若要在新领立足，必须决定这座城首先是军镇，还是一套可复制的治理法度。"
 jxp_remaining_daimyo.3.a:0 "把城账整理成国法。"
 jxp_remaining_daimyo.3.b:0 "让白壁昭示威仪。"
 jxp_remaining_daimyo.4.t:0 "金泽茶声"
 jxp_remaining_daimyo.4.d:0 "北陆金谷与港町使前田家不乏财富。茶人、能役者与学僧相继入城，有人称这是武家雅兴，也有人看见其中更长远的统治术。"
 jxp_remaining_daimyo.4.a:0 "以文艺养家声。"
 jxp_remaining_daimyo.4.b:0 "以账册守富庶。"
 jxp_remaining_daimyo.5.t:0 "武卫之名"
 jxp_remaining_daimyo.5.d:0 "斯波旧称武卫，然而旧称号若无人维护，也会在尘封文书中枯萎。家中有人主张向朝廷与幕府旧臣发出庄重书状，也有人劝我们先把分散重臣重新收束。"
 jxp_remaining_daimyo.5.a:0 "宣示武卫旧职。"
 jxp_remaining_daimyo.5.b:0 "先收诸臣之心。"
 jxp_remaining_daimyo.6.t:0 "六分一旧梦"
 jxp_remaining_daimyo.6.d:0 "山名家旧号六分一殿，今日虽不复昔盛，寺院文书与诸支谱牒仍保存着广阔旧望。问题在于，我们应把这些记忆化作外交名分，还是化作重新动员的军令。"
 jxp_remaining_daimyo.6.a:0 "以旧簿会盟诸家。"
 jxp_remaining_daimyo.6.b:0 "以旧望召集兵众。"
 jxp_remaining_daimyo.7.t:0 "播州关砦"
 jxp_remaining_daimyo.7.d:0 "播磨山道穿过城砦与关所。赤松家臣指出，嘉吉之影仍使外人疑惧本家；若能把道路、支城与誓纸连成一体，播州之名便可再次稳固。"
 jxp_remaining_daimyo.7.a:0 "使城砦如链相连。"
 jxp_remaining_daimyo.7.b:0 "以礼书洗去旧疑。"
 jxp_remaining_daimyo.8.t:0 "阿苏火色"
 jxp_remaining_daimyo.8.d:0 "阿苏山下，祭火照见肥后诸姓。神社、佛寺与外来商旅在九州交会，菊池家必须决定是以祭礼调停诸信，还是以武威先镇诸郡。"
 jxp_remaining_daimyo.8.a:0 "使诸郡同见祭火。"
 jxp_remaining_daimyo.8.b:0 "使诸郡先听军令。"
 jxp_remaining_daimyo.9.t:0 "鹿岛誓刀"
 jxp_remaining_daimyo.9.d:0 "佐竹武士在鹿岛神前陈列刀枪，祈愿不只为胜利，也为常陆诸郡能听同一军令。有人要求立即点兵，有人则提醒我们应以旧名争取关东名分。"
 jxp_remaining_daimyo.9.a:0 "在神前点兵。"
 jxp_remaining_daimyo.9.b:0 "向关东诸家示礼。"
 jxp_remaining_daimyo.10.t:0 "三川水声"
 jxp_remaining_daimyo.10.d:0 "美浓三川既养田畴，也毁堤岸。土岐家臣呈上水利图册，町人又带来新作坊的请求。治水、工艺与商路纠缠在一起，正如美浓本身。"
 jxp_remaining_daimyo.10.a:0 "先修水政。"
 jxp_remaining_daimyo.10.b:0 "让工匠接通商路。"
 jxp_remaining_daimyo.11.t:0 "日光与白河"
 jxp_remaining_daimyo.11.d:0 "宇都宫的书札沿日光山与白河关往来。关东与奥羽之间没有真正安静的道路，只有被礼仪、关使与守兵暂时驯服的道路。"
 jxp_remaining_daimyo.11.a:0 "以关使护路。"
 jxp_remaining_daimyo.11.b:0 "以士卒守关。"
 jxp_major_daimyo.14.t:0 "对马海峡之书"
 jxp_major_daimyo.14.d:0 "宗氏的船只往来于日本与朝鲜之间，带回米、铜、书札与难以明言的传闻。海峡既是窄门，也是刀锋，若不谨慎周旋，潮水就会把贸易与祸端一并送来。"
 jxp_major_daimyo.14.a:0 "让译者与商船先行。"
 jxp_major_daimyo.14.b:0 "以礼书守住海峡名分。"

 jxp_remaining_daimyo.101.t:0 "一乘谷天下"
 jxp_remaining_daimyo.101.d:0 "由朝仓家而成的日本，记得山谷中书札与庭园并存的秩序。京洛不再只是远方名分，而是可以被细密政务重新连接的中心。"
 jxp_remaining_daimyo.102.t:0 "管领之家再临"
 jxp_remaining_daimyo.102.d:0 "畠山家统一日本后，三管领旧名不再是衰世遗音。诸将与被官在新朝中各就其位，武门旧职被重新铸成国家制度。"
 jxp_remaining_daimyo.103.t:0 "姬路制置"
 jxp_remaining_daimyo.103.d:0 "池田家把转封与筑城的经验带入天下政务。城、账、役与仓不再彼此分离，而成为新日本治理诸国的白壁法度。"
 jxp_remaining_daimyo.104.t:0 "百万石之仪"
 jxp_remaining_daimyo.104.d:0 "前田家统一日本后，富庶不再只意味着仓中米谷。茶席、学问与城下工艺被纳入国家威仪，使丰饶也有了可被模仿的形状。"
 jxp_remaining_daimyo.105.t:0 "武卫遗制"
 jxp_remaining_daimyo.105.d:0 "斯波家旧日武卫之名终于脱离尘封文书。新日本以复兴旧职之名整顿诸司，仿佛衰亡过的幕府制度被另一次命运重新修订。"
 jxp_remaining_daimyo.106.t:0 "西军旧望入朝"
 jxp_remaining_daimyo.106.d:0 "山名家的六分一旧梦，如今被写入天下政务。曾经分裂西国的记忆，反而成为新朝调停诸支、诸寺与诸家的凭据。"
 jxp_remaining_daimyo.107.t:0 "播磨关砦天下"
 jxp_remaining_daimyo.107.d:0 "赤松家以播州城链的经验理解日本：道路要有人守，关隘要有文书，疑惧要以制度慢慢消解。新朝因而格外重视边关与支城。"
 jxp_remaining_daimyo.108.t:0 "火国调停"
 jxp_remaining_daimyo.108.d:0 "菊池家统一日本后，肥后诸信并存的经验被带入国政。神社、佛寺与远来信仰都被要求在国家火光下寻找自己的位置。"
 jxp_remaining_daimyo.109.t:0 "常陆军役"
 jxp_remaining_daimyo.109.d:0 "佐竹家把鹿岛神前的誓刀推广至天下军役。常陆武士的沉稳风气，成为新日本整顿东国与北方兵源的范式。"
 jxp_remaining_daimyo.110.t:0 "美浓水政入天下"
 jxp_remaining_daimyo.110.d:0 "土岐家由三川治水而理解国政。堤岸、田亩、庄园文书与作坊账册共同证明：驯服水患，也是在驯服一个国家的日常。"
 jxp_remaining_daimyo.111.t:0 "日光关防"
 jxp_remaining_daimyo.111.d:0 "宇都宫家统一日本后，日光山与白河关的经验成为新朝北方秩序的核心。礼仪、关防与兵威在山路上并行。"
 jxp_remaining_daimyo.legacy.a:0 "使家名成为国制。"
