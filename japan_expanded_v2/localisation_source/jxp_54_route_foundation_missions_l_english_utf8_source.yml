l_english:
 jxp_mission_route_inherited_realm_title:0 "承接天下"
 jxp_mission_route_inherited_realm_desc:0 "旧日诸侯的盟誓、战场与奉公之仪，须被收入一座朝廷的文书。新国号若要长久，首先便要证明它承接的不是一时兵威，而是列岛之公议。"
 jxp_mission_route_province_registers_title:0 "国郡入籍"
 jxp_mission_route_province_registers_desc:0 "山川有界，田畴有册，守护与地头的旧权亦当逐条厘定。自京畿至远国，凡可征、可役、可诉之事，皆应有案可稽。"
 jxp_mission_route_archipelago_circuit_title:0 "巡察列岛"
 jxp_mission_route_archipelago_circuit_desc:0 "使者沿驿路而行，奉书越过海峡与山关。唯有让朝命抵达每一处城下与港津，天下一统才不只是绘在屏风上的愿景。"
 jxp_mission_route_two_capitals_title:0 "两京之制"
 jxp_mission_route_two_capitals_desc:0 "京都维系礼法与名分，武藏则承载新政与军府。使两地不再彼此猜忌，而能各守其职，方可兼得古典之重与东国之实。"
 jxp_mission_route_rice_and_silver_title:0 "米银会计"
 jxp_mission_route_rice_and_silver_desc:0 "天下财赋，一出于稻米，一出于金银。若仓廪、矿山与市舶各自为政，再富庶的国土也只会养出相争的权门。"
 jxp_mission_route_post_station_ledger_title:0 "驿路成册"
 jxp_mission_route_post_station_ledger_desc:0 "驿马、关所、宿场与渡船须依同一法度登记。诏令早一日抵达，地方豪族便少一日借山川之险自专。"
 jxp_mission_route_settle_new_constitution_title:0 "定新国宪"
 jxp_mission_route_settle_new_constitution_desc:0 "国体既变，旧例便不能只靠含混的先例维持。朝廷、武家、寺社与町众各居何位，应由一套可传之后世的制度加以裁定。"
 jxp_mission_route_laws_of_the_new_realm_title:0 "刊定新律"
 jxp_mission_route_laws_of_the_new_realm_desc:0 "法不可因人而异，令不可隔国而殊。汇集公家故实、武家法度与诸藩成例，删其相悖，存其可行，使诉讼与政令皆有所归。"
 jxp_mission_route_renewed_japan_title:0 "一统更新"
 jxp_mission_route_renewed_japan_desc:0 "兵燹之后的统一若只留下更大的军役，终将重蹈乱世。百姓所见应是道路复通、仓廪有备、讼狱得理；如此，新日本才真正立于旧天下之上。"
 jxp_mission_route_muster_rolls_title:0 "武家诸役"
 jxp_mission_route_muster_rolls_desc:0 "奉公不应只凭家名与旧功。将旗本、国众、足轻与水军分列军籍，明其番役与给地，方能使一国之兵如臂使指。"
 jxp_mission_route_firearm_offices_title:0 "火器诸局"
 jxp_mission_route_firearm_offices_desc:0 "铁炮已由奇物变为军阵常备。硝石、铅弹、铸筒与操练若仍散在商人和诸家的私库，战时便难免号令不一。"
 jxp_mission_route_rites_of_the_isles_title:0 "列岛祀典"
 jxp_mission_route_rites_of_the_isles_desc:0 "社寺、教会、讲堂与清真寺皆已进入国家秩序。新朝不必抹去地方信仰，却须为祭礼、教化与公共安宁划定共同的尺度。"
 jxp_mission_route_guard_the_sea_lanes_title:0 "镇护海道"
 jxp_mission_route_guard_the_sea_lanes_desc:0 "潮流连接诸岛，也引来商舶、使节与盗舟。整顿港役、灯台和巡船，使海道既为国门，亦不再是权力所不及之处。"
