l_english:
 jxp_74_decision_convene_somon_commonwealth_title:0 "召开惣门町众会盟"
 jxp_74_decision_convene_somon_commonwealth_desc:0 "寺院的讲席、寺内町的年寄与门徒村落各持自己的誓纸与账册。若要把这些共同体纳入一套长久国制，就必须承认其自治传统，也必须承担它们日益壮大后对国家秩序的压力。"
 jxp_74_decision_invest_temple_markets_title:0 "投资寺内町市场"
 jxp_74_decision_invest_temple_markets_desc:0 "扩建仓廒、借屋与共同秤座，可以让寺内町成为诸国货物流转的节点。町众会因此更愿意出资，却也会要求更大的裁判权与免税权。"
 jxp_74_decision_fund_mediation_circuits_title:0 "资助惣门调停巡回"
 jxp_74_decision_fund_mediation_circuits_desc:0 "由僧侣、年寄与国人共同组成巡回评议，把村界、债契与兵粮争议带到公开席上裁断。调停耗费财赋，却能阻止一纸誓约演变成武装一揆。"
 jxp_74_decision_enforce_war_bell_register_title:0 "整编战钟名簿"
 jxp_74_decision_enforce_war_bell_register_desc:0 "逐寺登记钟声所召集的门徒、兵具与粮秣，把私下动员改编为受国法约束的守备班次。强硬点验可以迅速压低失控风险，也会伤害寺社对共同体的信任。"
 jxp_74_decision_charter_temple_town_state_title:0 "成文化寺社町众国"
 jxp_74_decision_charter_temple_town_state_desc:0 "惣门会盟已经无法再靠临时誓纸维持。将寺院、町众、门徒村落与国府编入成文议席，可以把压力转化为稳定的共同体国家，但旧有的武士征发权必须为此让步。"
 jxp_74_decision_stand_down_armed_leagues_title:0 "解散武装门徒联盟"
 jxp_74_decision_stand_down_armed_leagues_desc:0 "收回战钟名簿、封存共同兵具并把争讼交还国府，可以结束这轮会盟。地方会暂时安定，国家也将失去一部分由门徒自发提供的兵力。"

 jxp_debug_74_ijp_start_cycle_title:0 "调试：启动一向共同体循环"
 jxp_debug_74_ijp_start_cycle_desc:0 "立即建立寺社町众循环并把压力设为初始值。"
 jxp_debug_74_ijp_add_pressure_title:0 "调试：增加一向共同体压力"
 jxp_debug_74_ijp_add_pressure_desc:0 "立即增加一向共同体压力并执行上限校正。"
 jxp_debug_74_ijp_fire_petition_title:0 "调试：触发寺内町请愿"
 jxp_debug_74_ijp_fire_petition_desc:0 "立即触发寺社町众循环的常规取舍事件。"
 jxp_debug_74_ijp_fire_crisis_title:0 "调试：触发惣门危机"
 jxp_debug_74_ijp_fire_crisis_desc:0 "把压力设到危机阈值并立即触发最终取舍事件。"
 jxp_debug_74_ijp_reset_cycle_title:0 "调试：重置一向共同体循环"
 jxp_debug_74_ijp_reset_cycle_desc:0 "清除循环旗标、压力、所有专属修正与待处理的次日路线校正。"

 jxp_ijp_loop.1.t:0 "寺内町分配之季"
 jxp_ijp_loop.1.d:0 "秋收与市租已经送入寺内町的共同仓。町众要求按出资分红，门徒村落主张先留兵粮，国府奉行则带来一份重新核税的名册。如何分配这一季的盈余，将决定会盟下一年的强弱。"
 jxp_ijp_loop.1.a:0 "准许町众照旧分取红利。"
 jxp_ijp_loop.1.b:0 "先充实共同仓与救济粮。"
 jxp_ijp_loop.1.c:0 "查封账册，重审市场特权。"
 jxp_ijp_loop.2.t:0 "惣门议席之争"
 jxp_ijp_loop.2.d:0 "寺院讲席、町众年寄与门徒头人都声称自己应主持下一次惣门评议。他们带来旧誓纸、借据与守城功劳，随从则在廊外低声争执。若席次不能得到共同承认，争议很快就会传到村落与军阵。"
 jxp_ijp_loop.2.a:0 "令三方公开对读誓纸与账册。"
 jxp_ijp_loop.2.b:0 "承认町众以财赋换取更大议席。"
 jxp_ijp_loop.2.c:0 "敲响战钟，以守备名簿裁定席次。"
 jxp_ijp_loop.3.t:0 "共同誓约的极限"
 jxp_ijp_loop.3.d:0 "各地的战钟、市场与惣门议席已经连成一张足以挑战国府命令的网络。旧办法只能暂缓冲突：国家必须把共同体写入法度、以武力拆散它，或接受地方誓约继续扩张。"
 jxp_ijp_loop.3.a:0 "把共同议席写入国家法度。"
 jxp_ijp_loop.3.b:0 "解除兵具，以强制整顿换取喘息。"
 jxp_ijp_loop.3.c:0 "承认地方誓约，让会盟自行扩张。"

 jxp_74_ijp_temple_market_charter:0 "寺社町众会盟"
 jxp_74_ijp_temple_market_charter_desc:0 "寺院、寺内町与门徒村落以共同誓纸协调财赋和守备；国家从中获得资源，也必须承受多重议席带来的行政负担。"
 jxp_74_ijp_machishu_investment:0 "町众市场投资"
 jxp_74_ijp_machishu_investment_desc:0 "共同仓与秤座促进生产和交易，但获利的町众要求更多自治权。"
 jxp_74_ijp_somon_mediation:0 "惣门调停巡回"
 jxp_74_ijp_somon_mediation_desc:0 "公开评议减少村町冲突，却需要持续减免与赈济。"
 jxp_74_ijp_war_bell_enforcement:0 "战钟名簿整编"
 jxp_74_ijp_war_bell_enforcement_desc:0 "门徒守备被编入统一名簿，军力更易恢复，寺内町生产则因点验而受损。"
 jxp_74_ijp_market_dividend:0 "寺内町季末红利"
 jxp_74_ijp_market_dividend_desc:0 "货物与市租被迅速分配，短期繁荣伴随着更高的共同体压力。"
 jxp_74_ijp_assembly_hearing:0 "惣门公开听议"
 jxp_74_ijp_assembly_hearing_desc:0 "各方在公开席上对读誓纸与账册，以财政让步换取稳定。"
 jxp_74_ijp_hardline_aftershock:0 "强硬整编余波"
 jxp_74_ijp_hardline_aftershock_desc:0 "武力点验压下眼前争议，却使村町对国府更加戒备。"
 jxp_74_ijp_covenant_overreach:0 "地方誓约越权"
 jxp_74_ijp_covenant_overreach_desc:0 "自治网络促进生产，却削弱中央声望并放大地方不安。"
 jxp_74_ijp_crisis_recess:0 "危机后的短暂休会"
 jxp_74_ijp_crisis_recess_desc:0 "惣门议席暂时散去，但未解决的誓约仍在地方积累。"
 jxp_74_ijp_chartered_commonwealth:0 "成文寺社町众国"
 jxp_74_ijp_chartered_commonwealth_desc:0 "共同议席被纳入国家法度，经济与对外信用得到改善，传统武士征发能力则有所收缩。"
 jxp_74_ijp_secular_settlement:0 "武装联盟解散令"
 jxp_74_ijp_secular_settlement_desc:0 "争讼回归国府后地方更加安定，但门徒自备兵役不再能随战钟迅速集结。"

 jxp_74_ijp_pressure_starts_15_tt:0 "一向共同体压力将从§Y15§!开始。"
 jxp_74_ijp_pressure_rises_10_tt:0 "一向共同体压力将增加§R10§!。"
 jxp_74_ijp_pressure_rises_15_tt:0 "一向共同体压力将增加§R15§!。"
 jxp_74_ijp_pressure_rises_20_tt:0 "一向共同体压力将增加§R20§!。"
 jxp_74_ijp_pressure_falls_10_tt:0 "一向共同体压力将降低§G10§!。"
 jxp_74_ijp_pressure_falls_15_tt:0 "一向共同体压力将降低§G15§!。"
 jxp_74_ijp_pressure_falls_20_tt:0 "一向共同体压力将降低§G20§!。"
 jxp_74_ijp_pressure_falls_40_tt:0 "一向共同体压力将降低§G40§!。"
 jxp_74_ijp_transform_tt:0 "结束本轮压力循环，并在二十年内实行成文寺社町众国。"
 jxp_74_ijp_stand_down_tt:0 "结束本轮压力循环，并在十年内承担解散武装联盟的代价。"
