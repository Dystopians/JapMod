l_english:
 jxp_route_institution_society:0 "日轮国制社稷"
 jxp_route_institution_arms:0 "日轮国制兵船"
 jxp_route_institution_horizon:0 "日轮国制天下观"
 jxp_reform_sakoku_five_household_registers:0 "五人组宗门帐"
 jxp_reform_sakoku_five_household_registers_desc:0 "邻保相察，寺社相验，村落小册与城下大帐彼此勾连。天下不必时时拔刀，只须人人知道自己的名在何处。"
 jxp_reform_sakoku_castle_town_sumptuary:0 "城下俭约令"
 jxp_reform_sakoku_castle_town_sumptuary_desc:0 "诸侯第宅、町人衣饰与祭礼开支皆有度数。俭约不是贫乏，而是令城下的财富循公仪所许之路流动。"
 jxp_reform_open_nagasaki_customs:0 "长崎会计关"
 jxp_reform_open_nagasaki_customs_desc:0 "译官、商馆头人与奉行共同核验来帆、银货与通词文书。海上之利，须先化为可查的账簿。"
 jxp_reform_open_machishu_investors:0 "町众合本制"
 jxp_reform_open_machishu_investors_desc:0 "堺、博多与京都的町众合股造船、修仓、兴市。国用不再只由田亩供给，也可由市声与契纸托举。"
 jxp_reform_kirishitan_confraternity_parishes:0 "信众兄弟会区"
 jxp_reform_kirishitan_confraternity_parishes_desc:0 "港町与城下设兄弟会，照看病者、孤儿、漂泊水手与新入教者。钟声所至，国家的秩序也随之伸展。"
 jxp_reform_kirishitan_latin_colleges:0 "拉丁学寮"
 jxp_reform_kirishitan_latin_colleges_desc:0 "青年武士与通词子弟习拉丁、算学、医术与神学。异邦之学不再只在船舱中低语，而在学寮中开卷。"
 jxp_reform_confucian_domain_examiners:0 "诸藩经义试官"
 jxp_reform_confucian_domain_examiners_desc:0 "藩校讲义与官学试问连成制度，武家子弟须知弓马，也须知格物与名分。"
 jxp_reform_confucian_shrine_registers:0 "社籍礼法帐"
 jxp_reform_confucian_shrine_registers_desc:0 "诸社祭礼、神职谱系与村落户籍合入礼法之册。神道不废其古仪，儒礼则为其定分。"
 jxp_reform_imperial_court_nobles:0 "堂上家政厅"
 jxp_reform_imperial_court_nobles_desc:0 "堂上诸家重入国政文书，位阶、诏敕与俸禄各得其所。朝廷不只是一座古殿，也是一台可以运转的机器。"
 jxp_reform_imperial_land_tax_revival:0 "班田遗制检地"
 jxp_reform_imperial_land_tax_revival_desc:0 "以古名重编新账，田亩、村役与国司文移相互校验。旧制之名借新法之手，再次触及泥土。"
 jxp_reform_reformed_synod_schools:0 "会院学校"
 jxp_reform_reformed_synod_schools_desc:0 "长老、译官与町人子弟共同讲读经义、航海、医方与火器图谱。信约若要长久，便须有人识字、会算、能辩。"
 jxp_reform_reformed_civic_oaths:0 "町会誓约录"
 jxp_reform_reformed_civic_oaths_desc:0 "港町以会众誓约约束商税、守备与济贫。法度未必只从殿上传来，也可由公开宣读的誓纸确立。"
 jxp_reform_kaikyo_qadi_registers:0 "卡迪户籍所"
 jxp_reform_kaikyo_qadi_registers_desc:0 "港奉行与卡迪共同登记婚姻、契约、遗产与商旅纠纷。习俗虽异，账册与证言却可以相通。"
 jxp_reform_kaikyo_port_waqf:0 "港町瓦合甫"
 jxp_reform_kaikyo_port_waqf_desc:0 "施舍、粮仓、灯塔与客舍以瓦合甫名义维持，远客有可投之门，地方有可恃之仓。"
 jxp_reform_ikko_somon_judges:0 "惣村裁断众"
 jxp_reform_ikko_somon_judges_desc:0 "村落、讲众与寺内町共同推举裁断众。钟声下的盟约若能断讼，便不只是信仰，而是国法。"
 jxp_reform_ikko_temple_market_communes:0 "寺内町公界座"
 jxp_reform_ikko_temple_market_communes_desc:0 "寺内町以公界名义收纳商座、仓储与工匠。市声与念佛同起，财富因共同体而不散。"
 jxp_reform_wokou_island_courts:0 "岛港浦裁许所"
 jxp_reform_wokou_island_courts_desc:0 "岛港与浦方自设裁许所，审分赃、泊船、债契与水手争端。海上的规矩，须让懂潮水的人来写。"
 jxp_reform_wokou_smuggler_brokers:0 "密贸取次众"
 jxp_reform_wokou_smuggler_brokers_desc:0 "取次众在阴影中调停货主、浪人与奉行。把无法根绝的私贸纳入账目，反倒能让国家摸到黑潮的脉搏。"
 jxp_reform_sakoku_offshore_patrols:0 "外浦远见番"
 jxp_reform_sakoku_offshore_patrols_desc:0 "渔村、浦役与水军轮番远望，记录帆影、潮汐与异船动向。闭国之门也需要看海的人。"
 jxp_reform_sakoku_inland_arsenals:0 "内地火器藏"
 jxp_reform_sakoku_inland_arsenals_desc:0 "铁炮、火药与铸炮工匠移入内地城下，既避海上耳目，也便于公仪检核。谨慎不是怯弱，而是把锋刃藏在袖中。"
 jxp_reform_open_blue_water_contracts:0 "远洋造船契约"
 jxp_reform_open_blue_water_contracts_desc:0 "船匠、豪商与奉行按契纸分担造船、修船与航海风险。国家不必亲手握每一支橹，却须握住每一份契约。"
 jxp_reform_open_foreign_drill_yards:0 "异式调练场"
 jxp_reform_open_foreign_drill_yards_desc:0 "炮术师、译官与足轻头在城下同场调练。异邦火器若要成为国力，便须先被号令与队列驯服。"
 jxp_reform_kirishitan_ordered_brotherhoods:0 "修会军役兄弟团"
 jxp_reform_kirishitan_ordered_brotherhoods_desc:0 "信众兄弟团按教区与城下分番，平日济贫守仓，战时持枪随军。祈祷与队列在同一钟声下集合。"
 jxp_reform_kirishitan_mission_fleet:0 "传教护航船队"
 jxp_reform_kirishitan_mission_fleet_desc:0 "传教士、通词与水军同行，护送书信、圣物与商货。海路既是信仰之路，也是国家之路。"
 jxp_reform_confucian_rite_army_inspectors:0 "礼兵巡察使"
 jxp_reform_confucian_rite_army_inspectors_desc:0 "巡察使检阅诸藩军册、军礼与赏罚。兵不知礼则乱，礼不知兵则虚。"
 jxp_reform_confucian_wanghua_magistrates:0 "王化郡县奉行"
 jxp_reform_confucian_wanghua_magistrates_desc:0 "新附之地以礼法、田册与学校并行抚治。王化不是一纸告示，而是日复一日的官箴与文移。"
 jxp_reform_imperial_guard_mandates:0 "王师军令状"
 jxp_reform_imperial_guard_mandates_desc:0 "诸藩精兵、禁里亲卫与新式足轻受同一军令约束。军旗所向，既是战场，也是诏命临处。"
 jxp_reform_imperial_fleet_of_the_sun:0 "日御座船手"
 jxp_reform_imperial_fleet_of_the_sun_desc:0 "护送敕使与巡海的船手归入朝命名册。日轮照海，海疆亦成王化所及之地。"
 jxp_reform_reformed_militia_musters:0 "会众火器名册"
 jxp_reform_reformed_militia_musters_desc:0 "城镇会众自备火器，按长老与奉行共同名册集合。平日守市，战时成军，纪律来自誓约。"
 jxp_reform_reformed_contract_admiralty:0 "契约海军院"
 jxp_reform_reformed_contract_admiralty_desc:0 "荷兰船主、日本水军与港町长老按契约分摊海军役费。船队因信约而可用，信约因海军而可信。"
 jxp_reform_kaikyo_monsoon_arsenals:0 "季风军械所"
 jxp_reform_kaikyo_monsoon_arsenals_desc:0 "南海铸炮、火药与船材随季风入港，军械所按航期储备。星盘所指之处，亦有铁与硫磺相随。"
 jxp_reform_kaikyo_gunfounder_madrasas:0 "炮匠经学院"
 jxp_reform_kaikyo_gunfounder_madrasas_desc:0 "经师、炮匠与算学家同在学院授业。信仰与技艺在炉火旁相遇，化作城墙上的雷声。"
 jxp_reform_ikko_monto_militias:0 "门徒番枪制"
 jxp_reform_ikko_monto_militias_desc:0 "讲中按村社分番操练，农闲习枪，战时守土。其勇气来自信念，也来自彼此熟知的田垄。"
 jxp_reform_ikko_fortified_terauchi:0 "寺内町惣构"
 jxp_reform_ikko_fortified_terauchi_desc:0 "寺内町筑壕立栅，仓门、钟楼与市口彼此呼应。信仰在此有墙，百姓在此有家。"
 jxp_reform_wokou_boarding_schools:0 "跳帮船手学舍"
 jxp_reform_wokou_boarding_schools_desc:0 "熟潮水、识船型、惯白刃的船手被收为教头。私帆上的凶悍，经名册与赏罚束缚后便成可用之兵。"
 jxp_reform_wokou_tidewater_arsenals:0 "潮汐船坞"
 jxp_reform_wokou_tidewater_arsenals_desc:0 "岛港船坞按潮汐修船、藏桨、补帆。黑潮虽急，船坞里的人却能让急流变成道路。"
 jxp_reform_sakoku_embassy_seals:0 "通信使朱印"
 jxp_reform_sakoku_embassy_seals_desc:0 "朝鲜、琉球与虾夷来往各有朱印、仪程与馈礼。闭国不等于无礼，门户少开时更须礼数分明。"
 jxp_reform_sakoku_inner_learning:0 "内证洋学"
 jxp_reform_sakoku_inner_learning_desc:0 "医师、历算家与炮术师密校洋书，不许妄传，却许求实。闭门并非闭眼，谨慎亦可生出学问。"
 jxp_reform_open_pacific_charters:0 "太平洋敕许状"
 jxp_reform_open_pacific_charters_desc:0 "船队以敕许状越过日本近海，向琉球、吕宋与更远的风带试航。海图空白处，也可以写下国名。"
 jxp_reform_open_silver_standard:0 "日银定准"
 jxp_reform_open_silver_standard_desc:0 "石见银、港税与海外账簿以统一成色折算。银若可信，海商便能把远方带入国库。"
 jxp_reform_kirishitan_embassy_to_rome:0 "遣欧使节常例"
 jxp_reform_kirishitan_embassy_to_rome_desc:0 "少年使节与老成通词远赴罗马、澳门与果阿。万里之外的钟声，借他们的书信回到京都。"
 jxp_reform_kirishitan_sacred_monarchy:0 "日轮圣王仪"
 jxp_reform_kirishitan_sacred_monarchy_desc:0 "王权在日轮与十字之间立誓，诸侯以教会礼仪见证忠诚。新的神圣性并非取代旧名，而是重铸其威。"
 jxp_reform_confucian_sinic_harmonizers:0 "神儒和同使"
 jxp_reform_confucian_sinic_harmonizers_desc:0 "和同使巡行诸国，辨神社旧仪、佛寺香火与儒家名分。诸教各守其位，天下方能同文。"
 jxp_reform_confucian_tribute_bureau:0 "朝贡礼仪局"
 jxp_reform_confucian_tribute_bureau_desc:0 "外邦来聘、商使通问与册礼文书皆由礼仪局裁定。日本不必自称中华，却可学会让四方按礼而来。"
 jxp_reform_imperial_envoys_of_tenno:0 "天皇敕使院"
 jxp_reform_imperial_envoys_of_tenno_desc:0 "敕使出入诸国，宣诏、册封、和议与问罪皆有常仪。王政复古的声音，须有人带到山海之外。"
 jxp_reform_imperial_subject_ranks:0 "诸侯位阶再编"
 jxp_reform_imperial_subject_ranks_desc:0 "诸侯、国司与旧家名号依朝廷位阶重定尊卑。名分若明，远国亦知自己立于何处。"
 jxp_reform_reformed_print_covenants:0 "印书信约"
 jxp_reform_reformed_print_covenants_desc:0 "誓约、教义、航海术与医方以活字广布。信仰不只靠讲坛，也靠每一页可重复校验的文字。"
 jxp_reform_reformed_dutch_factors:0 "和兰驻市商约"
 jxp_reform_reformed_dutch_factors_desc:0 "荷兰驻市商人与日本港奉行按公开契纸通商。商馆不是异邦孤岛，而是新日本账簿的一页。"
 jxp_reform_kaikyo_indian_ocean_diplomats:0 "印度洋遣使"
 jxp_reform_kaikyo_indian_ocean_diplomats_desc:0 "使节随季风往返马六甲、亚齐与古吉拉特。日本的海门若向西开，便会听见更辽阔的祈祷与算盘声。"
 jxp_reform_kaikyo_haramayn_patronage:0 "两圣地奉纳"
 jxp_reform_kaikyo_haramayn_patronage_desc:0 "朝觐者、商旅与学者将日本的奉纳送往远方圣地。遥远并不削弱虔敬，反使国名随航路传扬。"
 jxp_reform_ikko_public_granaries:0 "门徒公仓法"
 jxp_reform_ikko_public_granaries_desc:0 "公仓收纳米谷、盐铁与军需，平时赈济，战时供给。共同体的根不只在寺门，也在仓门。"
 jxp_reform_ikko_common_oath:0 "一味同心誓"
 jxp_reform_ikko_common_oath_desc:0 "村落、町人、僧侣与足轻同立誓纸。贵贱不必相同，却须在同一钟声下承担同一国法。"
 jxp_reform_wokou_sea_law:0 "海上掟裁判"
 jxp_reform_wokou_sea_law_desc:0 "海商、浪人与水军以掟法分赃、审债、决斗与仲裁。黑潮虽急，亦须有可读的规矩。"
 jxp_reform_wokou_black_current_charters:0 "黑潮敕许船"
 jxp_reform_wokou_black_current_charters_desc:0 "受许船队可越海通商、侦查与私掠。浪潮上的自由若被印信拴住，便会成为国家的远手。"
