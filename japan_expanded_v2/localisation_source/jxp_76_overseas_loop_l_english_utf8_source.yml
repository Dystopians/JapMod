l_english:
 jxp_76_decision_open_pacific_network_title:0 "开设太平洋诸航路网"
 jxp_76_decision_open_pacific_network_desc:0 "既有的远海敕许仍只是散落在账册上的权利。若把长崎、吕宋、北太平洋与新大陆港埠编成轮转航路，国家便能持续经营海上利益，也必须承担商社、移民与远洋军备共同积累的压力。"
 jxp_76_decision_fund_manila_nagasaki_convoys_title:0 "资助马尼拉—长崎船团"
 jxp_76_decision_fund_manila_nagasaki_convoys_desc:0 "以定期船团连接吕宋白银、长崎会所与日本商港，可以稳定季风贸易。航次越密，商社对护航、借贷与港务特权的要求也越高。"
 jxp_76_decision_build_alaska_survey_stations_title:0 "建设阿拉斯加测候所"
 jxp_76_decision_build_alaska_survey_stations_desc:0 "在北方海雾与群岛间设置补给、测候和修船站，可以延伸鲸场与殖民航线，却会把更多船员和财赋锁在漫长的北太平洋航季。"
 jxp_76_decision_charter_california_settlements_title:0 "敕许加利福尼亚聚落"
 jxp_76_decision_charter_california_settlements_desc:0 "让商人、浪人、工匠与教团共同承担新大陆聚落，可以迅速建立港市网络。彼岸共同体也将要求自治、土地与稳定的跨洋供给。"
 jxp_76_decision_convene_pacific_court_council_title:0 "召开太平洋朝议"
 jxp_76_decision_convene_pacific_court_council_desc:0 "以朝廷名册、礼制使节与奉行评议统筹海外航路，可以把私人敕许纳入国家秩序，并以持续的行政成本降低航路失控的压力。"
 jxp_76_decision_proclaim_pacific_compact_title:0 "颁布太平洋经略约章"
 jxp_76_decision_proclaim_pacific_compact_desc:0 "航路、聚落、教团与朝议已经形成共同制度。以成文约章明确各港权利与国家责任，可以结束这一轮扩张压力，并留下长期但有限的海洋国家遗产。"
 jxp_76_decision_stand_down_pacific_network_title:0 "收束太平洋航路网"
 jxp_76_decision_stand_down_pacific_network_desc:0 "撤销高风险敕许、缩减护航并结清海外账目，可以主动结束航路循环。贸易会暂时退潮，国家则重新取得调度余地。"

 jxp_debug_76_start_pacific_network_title:0 "调试：启动太平洋航路循环"
 jxp_debug_76_start_pacific_network_desc:0 "立即启动航路循环并设置初始压力。"
 jxp_debug_76_add_pacific_pressure_title:0 "调试：增加太平洋航路压力"
 jxp_debug_76_add_pacific_pressure_desc:0 "立即增加压力并执行上下限校正。"
 jxp_debug_76_fire_pacific_review_title:0 "调试：触发航路评议"
 jxp_debug_76_fire_pacific_review_desc:0 "立即触发一次按路线分化的海外评议事件。"
 jxp_debug_76_fire_pacific_crisis_title:0 "调试：触发太平洋危机"
 jxp_debug_76_fire_pacific_crisis_desc:0 "把压力提升至危机阈值并立即触发最终取舍。"
 jxp_debug_76_reset_pacific_network_title:0 "调试：重置太平洋航路循环"
 jxp_debug_76_reset_pacific_network_desc:0 "清除航路旗标、压力与全部专属修正。"

 jxp_overseas_loop.1.t:0 "四海账册的年度评议"
 jxp_overseas_loop.1.d:0 "从长崎会所、吕宋船团、北方测候所与新大陆聚落送来的账册堆满评议席。商人要求扩大分红，教团主张保护同道，朝臣则坚持先核定礼仪与权责。"
 jxp_overseas_loop.1.a:0 "让港商按航次分取红利。"
 jxp_overseas_loop.1.b:0 "由海外教团维持沿途救济与联络。"
 jxp_overseas_loop.1.c:0 "把航路登记纳入朝廷名册。"
 jxp_overseas_loop.1.d:0 "公开核对敕许与欠账。"
 jxp_overseas_loop.2.t:0 "跨洋敕许的争讼"
 jxp_overseas_loop.2.d:0 "船主、聚落代表与奉行互相指责对方隐匿货单、拖欠护航费或擅改土地契约。若不重订责任，争议将从会所蔓延到每一条航线。"
 jxp_overseas_loop.2.a:0 "设立联合仲裁席，逐项结清争议。"
 jxp_overseas_loop.2.b:0 "容许商社以新分红填补旧账。"
 jxp_overseas_loop.2.c:0 "派水军点验船籍与护航分摊。"
 jxp_overseas_loop.3.t:0 "太平洋经略的极限"
 jxp_overseas_loop.3.d:0 "海外航路已经庞大到无法继续依靠临时敕许。国家必须把商社、聚落与港务纳入稳定约章，主动收束网络，或以更严厉的军费与管制换取喘息。"
 jxp_overseas_loop.3.a:0 "把诸航路编入成文经略约章。"
 jxp_overseas_loop.3.b:0 "撤销高风险敕许，暂时退回近海。"
 jxp_overseas_loop.3.c:0 "加派水军与银两，强令网络休整。"

 jxp_76_pacific_network_charter:0 "太平洋诸航路敕许"
 jxp_76_pacific_network_charter_desc:0 "分散的海外航线被编入轮转船期，贸易与舰队容量随之增长。"
 jxp_76_manila_nagasaki_convoys:0 "马尼拉—长崎定期船团"
 jxp_76_manila_nagasaki_convoys_desc:0 "吕宋白银、长崎会所与日本港商通过受护航的季风船期相连。"
 jxp_76_alaska_survey_stations:0 "阿拉斯加测候所"
 jxp_76_alaska_survey_stations_desc:0 "北太平洋补给与测候站支撑殖民航程并培养远洋水手。"
 jxp_76_california_settlement_compacts:0 "加利福尼亚聚落契约"
 jxp_76_california_settlement_compacts_desc:0 "新大陆港市以土地、供给与自治契约吸引持续移民。"
 jxp_76_pacific_court_council:0 "太平洋朝议"
 jxp_76_pacific_court_council_desc:0 "朝廷与奉行共同登记航路，使海外敕许服从更稳定的国家秩序。"
 jxp_76_brokerage_dividend:0 "港商航次红利"
 jxp_76_brokerage_dividend_desc:0 "快速分红刺激贸易，也鼓励商社承担更高风险。"
 jxp_76_mission_house_network:0 "海外教团联络网"
 jxp_76_mission_house_network_desc:0 "教团、医院与会所为跨洋人员提供救济和外交联络。"
 jxp_76_court_route_register:0 "朝廷航路名册"
 jxp_76_court_route_register_desc:0 "礼制名册明确海外使节、船主与奉行的身份和责任。"
 jxp_76_public_network_hearing:0 "航路公开听议"
 jxp_76_public_network_hearing_desc:0 "公开评议改善各方信用，却暂时拖慢商路决策。"
 jxp_76_speculative_overreach:0 "跨洋投机过度"
 jxp_76_speculative_overreach_desc:0 "未经约束的借贷与敕许带来短期收益，也积累财政与社会风险。"
 jxp_76_arbitration_recent:0 "航路仲裁余波"
 jxp_76_arbitration_recent_desc:0 "争讼正在逐项结清，海外商务暂时承受额外审查。"
 jxp_76_crisis_recess:0 "太平洋危机休整"
 jxp_76_crisis_recess_desc:0 "强制缩减航次换来喘息，未解决的矛盾仍留在各港。"
 jxp_76_pacific_compact:0 "太平洋经略约章"
 jxp_76_pacific_compact_desc:0 "商社、聚落、教团与国家奉行被纳入共同而有限期的海洋制度。"
 jxp_76_pacific_retrenchment:0 "远海收束期"
 jxp_76_pacific_retrenchment_desc:0 "国家暂时退出高风险远洋敕许，以较低贸易活力换取秩序恢复。"

 jxp_76_pacific_pressure_starts_10_tt:0 "太平洋航路压力将从§Y10§!开始。"
 jxp_76_pacific_network_scope_tt:0 "这是太平洋敕许后的长期经营：马尼拉船团、阿拉斯加测候所、加利福尼亚聚落与太平洋朝议会依路线和实际据点分别开放。"
 jxp_76_pacific_pressure_rises_10_tt:0 "太平洋航路压力将增加§R10§!。"
 jxp_76_pacific_pressure_rises_15_tt:0 "太平洋航路压力将增加§R15§!。"
 jxp_76_pacific_pressure_rises_20_tt:0 "太平洋航路压力将增加§R20§!。"
 jxp_76_pacific_pressure_falls_10_tt:0 "太平洋航路压力将降低§G10§!。"
 jxp_76_pacific_pressure_falls_15_tt:0 "太平洋航路压力将降低§G15§!。"
 jxp_76_pacific_pressure_falls_20_tt:0 "太平洋航路压力将降低§G20§!。"
 jxp_76_pacific_pressure_falls_40_tt:0 "太平洋航路压力将降低§G40§!。"
 jxp_76_pacific_compact_tt:0 "结束本轮压力循环，并在二十年内实行太平洋经略约章。"
 jxp_76_pacific_stand_down_tt:0 "结束本轮压力循环，并在十年内承担远海收束的代价。"
