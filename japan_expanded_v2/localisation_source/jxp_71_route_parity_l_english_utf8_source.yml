l_english:
 jxp_decision_review_sakoku_council_title:0 "重议海门法度"
 jxp_decision_review_sakoku_council_desc:0 "锁国并非一纸禁令便可长久维系。驿路、沿海番所与密封译书房各有积弊，必须召集奉行与诸藩代表重新勘定施行次序。"
 jxp_decision_audit_open_trade_council_title:0 "查核朱印商馆"
 jxp_decision_audit_open_trade_council_desc:0 "白银、火炮与商馆特许把远海利益带入国中，也让层层转手与私约潜滋。召集海关、铸座和町年寄，重订一轮通商账目。"
 jxp_decision_convene_imperial_circuit_council_title:0 "召开国司巡察议"
 jxp_decision_convene_imperial_circuit_council_desc:0 "王政复古之后，禁里礼书、国司巡察与近卫军役仍须在诸国落地。召集公卿与地方官，决定下一轮奉行的重心。"
 jxp_71_has_sakoku_council_reform_trigger:0 "已采用至少一项锁国路线改革"
 jxp_71_has_open_trade_council_reform_trigger:0 "已采用至少一项开国通商路线改革"
 jxp_71_has_imperial_council_reform_trigger:0 "已采用至少一项王政复古路线改革"
 jxp_route_parity.1.t:0 "海门法度年议"
 jxp_route_parity.1.d:0 "驿使带来诸藩名簿，浦役呈上夜间船火的记录，译官则把密封书箱置于末席。锁国之法若要越过一代人的谨慎，必须决定哪一道门最先加固，又该为哪一扇窗留下缝隙。"
 jxp_route_parity.1.a:0 "核定驿路与诸藩名簿"
 jxp_route_parity.1.b:0 "重编沿海番所与浦触"
 jxp_route_parity.1.c:0 "密准译书所校勘异书"
 jxp_route_parity.2.t:0 "朱印与商馆会计"
 jxp_route_parity.2.d:0 "银锭成色、舶来火器与商馆契纸堆满案头。港町因远海而富，也因远海而多出无法追索的债与人情。诸奉行请求朝廷为下一轮通商定下清楚的尺度。"
 jxp_route_parity.2.a:0 "设银座会验诸港成色"
 jxp_route_parity.2.b:0 "令火炮奉行查验外国契约"
 jxp_route_parity.2.c:0 "重审商馆特许与转租"
 jxp_route_parity.3.t:0 "国司巡察与禁里评议"
 jxp_route_parity.3.d:0 "国学者、公卿、国司与近卫武官分列御阶。复古的名分已经昭告天下，如今更难的是让礼仪、地方文书与兵籍在同一套政令中彼此承认。"
 jxp_route_parity.3.a:0 "以国学礼书厘定百司"
 jxp_route_parity.3.b:0 "遣国司巡察诸国账册"
 jxp_route_parity.3.c:0 "校阅近卫与诸国军籍"
 jxp_71_route_council_recent:0 "路线议政方毕"
 jxp_71_route_council_recent_desc:0 "本轮路线议政已形成施行条目，诸奉行须待地方回报汇集后方能再次总议。"
 jxp_71_sakoku_post_road_registers:0 "驿路诸藩名簿"
 jxp_71_sakoku_post_road_registers_desc:0 "驿站往来与诸藩名簿彼此校验，使国中赋役和人员流动更易查明。"
 jxp_71_sakoku_coastal_musters:0 "沿海番所总点"
 jxp_71_sakoku_coastal_musters_desc:0 "浦触、烽火与番所轮值被统一登记，陌生船影更难悄然靠岸。"
 jxp_71_sakoku_sealed_translation_room:0 "密封译书房"
 jxp_71_sakoku_sealed_translation_room_desc:0 "少数奉行获准在严密看守下校勘异国书籍，使外学不必公开流入市井。"
 jxp_71_open_silver_assay_board:0 "诸港银座会验"
 jxp_71_open_silver_assay_board_desc:0 "来自不同海路的银锭按统一成色收验，商税账册因而更可信。"
 jxp_71_open_artillery_inspectors:0 "火炮契约查验"
 jxp_71_open_artillery_inspectors_desc:0 "火器匠、通事与军奉行共同核验舶来铸法，减少承包商在军需中蒙混的余地。"
 jxp_71_open_charter_auditors:0 "商馆特许查账"
 jxp_71_open_charter_auditors_desc:0 "港町特许、转租契纸与海外代理账目被逐项复核，国家对远海贸易的脉络看得更清。"
 jxp_71_imperial_rite_register:0 "禁里礼书总录"
 jxp_71_imperial_rite_register_desc:0 "朝仪、官途与诸国奉书汇为可查的总录，复古之政获得更稳定的名分。"
 jxp_71_imperial_kokushi_circuit:0 "国司巡察簿"
 jxp_71_imperial_kokushi_circuit_desc:0 "巡察国司把地方仓册、诉状与贡赋带回京师，朝廷得以越过旧有家臣网络了解诸国。"
 jxp_71_imperial_guard_muster:0 "近卫诸国军籍"
 jxp_71_imperial_guard_muster_desc:0 "近卫与诸国兵籍采用同一套点验格式，王政的军令更易传到地方。"
 jxp_debug_fire_route_parity_sakoku_title:0 "调试：触发锁国路线议政"
 jxp_debug_fire_route_parity_sakoku_desc:0 "清除本系统的有限期冷却与锁国结果修正，并直接打开锁国路线议政事件。需先处于锁国路线并采用至少一项对应改革。"
 jxp_debug_fire_route_parity_open_trade_title:0 "调试：触发开国路线议政"
 jxp_debug_fire_route_parity_open_trade_desc:0 "清除本系统的有限期冷却与开国结果修正，并直接打开开国通商路线议政事件。需先处于开国路线并采用至少一项对应改革。"
 jxp_debug_fire_route_parity_imperial_title:0 "调试：触发王政路线议政"
 jxp_debug_fire_route_parity_imperial_desc:0 "清除本系统的有限期冷却与王政结果修正，并直接打开王政复古路线议政事件。需先处于王政路线并采用至少一项对应改革。"
