l_english:
 jxp_decision_convene_founder_legacy_council_title:0 "追定开府遗策"
 jxp_decision_convene_founder_legacy_council_desc:0 "新日本虽已成形，开府之家的旧法仍在诸臣与诸国之间回响。召集旧臣、奉行与诸司，使他们把创立者的遗训写成可行之制。"
 jxp_founder_legacy.1.t:0 "安土旧令之取舍"
 jxp_founder_legacy.1.d:0 "织田旧臣呈上安土时代的令书、检地草案与乐市札。有人主张以「天下布武」之名继续压平诸国旧权，有人则称信长真正的锋芒在于使道路、座商与港町摆脱旧束缚。火中之城已毁，其遗策却仍能塑造新日本。"
 jxp_founder_legacy.1.a:0 "以安土令整饬诸国。"
 jxp_founder_legacy.1.b:0 "以乐市法开通市町。"
 jxp_founder_legacy.2.t:0 "东照家法的影子"
 jxp_founder_legacy.2.d:0 "德川旧臣与三河谱代诸家请求整理旧日家法。谨慎者希望把谱代、目付与诸奉行置于稳定秩序之中；务实者则提醒我们，关所、道路与密奏之网才是支撑长久统治的筋骨。"
 jxp_founder_legacy.2.a:0 "使谱代会议常设化。"
 jxp_founder_legacy.2.b:0 "重修关所与传奏之网。"
 jxp_founder_legacy.3.t:0 "甲州法度的余响"
 jxp_founder_legacy.3.d:0 "武田旧臣携来甲州法度、马印簿与山国堤防图。赤备与骑马武者仍令人心动，但甲斐的真正教训也许是：山川、堰堤、金山与人户都必须纳入一套严密法度。"
 jxp_founder_legacy.3.a:0 "重整甲州军役。"
 jxp_founder_legacy.3.b:0 "以山国法约束边郡。"
 jxp_founder_legacy.4.t:0 "越后义名与关东旧职"
 jxp_founder_legacy.4.d:0 "上杉旧臣争论谦信公遗风。有人说应继承关东管领之义，以礼法、裁断与名分安抚武家；有人说越后的强处终在军阵清肃、兵粮严整与雪国武士的誓约。"
 jxp_founder_legacy.4.a:0 "以关东义名裁断诸家。"
 jxp_founder_legacy.4.b:0 "以越后军法砺兵。"
 jxp_founder_legacy.5.t:0 "小田原评定再开"
 jxp_founder_legacy.5.d:0 "北条旧臣请求重开评定。检地、德政与郡中账册曾使关东之民知其所归；总构、支城与水陆防线也曾使小田原足以久拒天下兵。新的统治必须在民政与城防之间择其重心。"
 jxp_founder_legacy.5.a:0 "续修关东检地与评定。"
 jxp_founder_legacy.5.b:0 "保留总构与支城之法。"
 jxp_founder_legacy.6.t:0 "三矢之训与濑户内船手"
 jxp_founder_legacy.6.d:0 "毛利旧臣在御前重述三矢之训。濑户内船手希望得到朱印与船籍，国人众则要求旧盟约不被新朝轻废。若能善用二者，西国的海与山都可为新日本效力。"
 jxp_founder_legacy.6.a:0 "设濑户内船奉行。"
 jxp_founder_legacy.6.b:0 "重订国人盟约。"
 jxp_founder_legacy.7.t:0 "萨摩铁炮与外学"
 jxp_founder_legacy.7.d:0 "岛津旧臣带来种子岛铁炮、萨南书籍与琉球商路记录。有人愿把南九州的火器手艺推广于诸军，也有人认为萨摩真正的长处，是敢在海雾之外寻找新知。"
 jxp_founder_legacy.7.a:0 "扩建萨摩铁炮所。"
 jxp_founder_legacy.7.b:0 "整理萨南外学。"
 jxp_founder_legacy.8.t:0 "府内商馆与国崩炮"
 jxp_founder_legacy.8.d:0 "大友旧臣呈上府内旧商馆账目、南蛮来书与国崩炮铸造记录。港町和学问带来远方风气，重炮与城攻之术则证明外来器物也能归入武家秩序。"
 jxp_founder_legacy.8.a:0 "重开府内外商区。"
 jxp_founder_legacy.8.b:0 "设国崩炮奉行。"
 jxp_founder_legacy.9.t:0 "奥州骑马与庆长使节"
 jxp_founder_legacy.9.d:0 "伊达旧臣把奥州骑马帐、黑胴具足与远航使节的文书并置案头。有人说政宗公之业在于北地武威，有人则说他的真意在于使日本敢把目光越过海雾与边山。"
 jxp_founder_legacy.9.a:0 "整编奥州骑马众。"
 jxp_founder_legacy.9.b:0 "重录庆长使节文书。"
 jxp_founder_legacy.10.t:0 "奉公众与东山旧仪"
 jxp_founder_legacy.10.d:0 "足利旧臣请求追复奉公众名册与东山殿旧仪。以幕府旧制号令诸侯，能使天下记得将军家法；以文雅、茶会与书院之风安抚新贵，则可使武家学习如何在太平中自处。"
 jxp_founder_legacy.10.a:0 "重立奉公众秩序。"
 jxp_founder_legacy.10.b:0 "修明东山文雅。"
 jxp_founder_legacy.11.t:0 "土佐一领具足"
 jxp_founder_legacy.11.d:0 "长宗我部旧臣呈上土佐军役簿。一领具足既是农民，也是武士；既能耕作，也能出阵。另一些船手则提醒我们，四国不只有山田与城砦，也有浦户水路与南海潮声。"
 jxp_founder_legacy.11.a:0 "以一领具足编成诸军。"
 jxp_founder_legacy.11.b:0 "整饬土佐海法。"
 jxp_founder_legacy.12.t:0 "山口府第与勘合旧路"
 jxp_founder_legacy.12.d:0 "大内旧臣称山口曾有西京之誉，商馆、佛寺、文人和朝鲜使者都曾在此往来。新日本若继承这份遗产，可以选择重开商路，也可以选择重修通使礼法。"
 jxp_founder_legacy.12.a:0 "以山口商法开港。"
 jxp_founder_legacy.12.b:0 "修复朝鲜通使之仪。"
 jxp_founder_legacy.13.t:0 "东海道法书与三国同盟"
 jxp_founder_legacy.13.d:0 "今川旧臣带来假名目录、东海道宿驿簿与三国同盟誓纸。义元旧业虽败于桶狭间，其治国文书却仍精密；而同盟与婚姻之术，也曾让东海大名在强邻之间求得平衡。"
 jxp_founder_legacy.13.a:0 "以东海道法书治国。"
 jxp_founder_legacy.13.b:0 "追定三国同盟之法。"
 jxp_founder_legacy.14.t:0 "对马通事与海峡守备"
 jxp_founder_legacy.14.d:0 "宗氏旧臣呈上倭馆账册、通事名簿与海峡巡防录。对马的遗产并不在广土众民，而在狭海之间维系两国言语、商路与警讯的本领。"
 jxp_founder_legacy.14.a:0 "设倭馆通商所。"
 jxp_founder_legacy.14.b:0 "重修对马海峡守备。"
 jxp_founder_legacy.15.t:0 "月山富田与出云社领"
 jxp_founder_legacy.15.d:0 "尼子旧臣携来月山富田的城防簿、国人誓纸与出云社领文书。山阴之治向来不以广阔平原取胜，而在山城、社家、津口与国人众之间织出一张耐久的网。"
 jxp_founder_legacy.15.a:0 "以月山富田法整饬国人。"
 jxp_founder_legacy.15.b:0 "重录杵筑社领与祈祷。"
 jxp_founder_legacy.16.t:0 "一乘谷文书与越前纸"
 jxp_founder_legacy.16.d:0 "朝仓旧臣将一乘谷评议记录、越前纸账与城下町法呈上。有人称文书与奉行足以约束诸国，有人则说越前真正的遗产，在于让学问、纸业与政务互为凭据。"
 jxp_founder_legacy.16.a:0 "使一乘谷评议常设化。"
 jxp_founder_legacy.16.b:0 "设越前纸文书所。"
 jxp_founder_legacy.17.t:0 "管领席次与堺町"
 jxp_founder_legacy.17.d:0 "细川旧臣与堺町会合，争论新朝应继承何种畿内遗产。管领旧名仍可为朝幕礼法定序，堺商人的账簿和会合则提醒我们，天下财用也有自己的法度。"
 jxp_founder_legacy.17.a:0 "重定管领席次。"
 jxp_founder_legacy.17.b:0 "召堺町众入议。"
 jxp_founder_legacy.18.t:0 "两畠山与杂贺火声"
 jxp_founder_legacy.18.d:0 "畠山旧臣把河内若江誓纸、两流调停案与杂贺铁炮契约并置案上。破碎的家门经验既可警醒中枢防范内裂，也可把近畿佣兵与火器手艺纳入新法。"
 jxp_founder_legacy.18.a:0 "以两家誓约约束被官。"
 jxp_founder_legacy.18.b:0 "录用杂贺铁炮契约。"
 jxp_founder_legacy.19.t:0 "姬路白城与濑户内账目"
 jxp_founder_legacy.19.d:0 "池田旧臣呈上姬路城下町割、仓廪收支和濑户内商账。白城可以成为检地与收税的可见核心，亦可成为东连畿内、西望海路的账簿枢纽。"
 jxp_founder_legacy.19.a:0 "以姬路奉行整理诸仓。"
 jxp_founder_legacy.19.b:0 "把濑户内账目入官库。"
 jxp_founder_legacy.20.t:0 "加贺百万石与茶汤"
 jxp_founder_legacy.20.d:0 "前田旧臣带来金泽仓簿、能乐名册与茶会记录。加贺之富可以厚植兵粮，也可以温养文雅，使新日本在太平之世懂得如何安置士人与町人。"
 jxp_founder_legacy.20.a:0 "以百万石仓法厚植国用。"
 jxp_founder_legacy.20.b:0 "以茶汤能乐抚育士风。"
 jxp_founder_legacy.21.t:0 "武卫旧名与北国通路"
 jxp_founder_legacy.21.d:0 "斯波旧臣称武卫之名虽衰，其幕府旧职、北陆道路与军役文书仍可再用。旧名若不沉睡在谱牒中，便能重新成为新日本的行政语言。"
 jxp_founder_legacy.21.a:0 "重开武卫军事所。"
 jxp_founder_legacy.21.b:0 "整饬北陆道路与津口。"
 jxp_founder_legacy.22.t:0 "六分一殿与西军旧盟"
 jxp_founder_legacy.22.d:0 "山名旧臣把诸国守护账、誓纸与西军旧盟递上。昔日六分一殿的盛名已成历史，但分散诸国的关系仍可被新朝重新入册、裁断与利用。"
 jxp_founder_legacy.22.a:0 "清点六分一旧领册。"
 jxp_founder_legacy.22.b:0 "修补西军旧盟誓纸。"
 jxp_founder_legacy.23.t:0 "九户之主与北奥饥寒"
 jxp_founder_legacy.23.d:0 "南部旧臣陈述北奥马牧、九户关门与饥寒粮仓。遥远边郡若只被视为防线，终会离心；若被看作可供给、可通商、可动员之地，便能成为国家的北柱。"
 jxp_founder_legacy.23.a:0 "整编九户骑马与关门。"
 jxp_founder_legacy.23.b:0 "修筑盛冈仓廪。"
 jxp_founder_legacy.24.t:0 "伊势神宫与南朝余绪"
 jxp_founder_legacy.24.d:0 "北畠旧臣以伊势神宫、国司旧职与南朝余绪求见。有人主张以社领礼法重申名分，有人则提醒我们，伊势水路与九鬼船手同样是旧家不可轻弃的遗产。"
 jxp_founder_legacy.24.a:0 "以伊势社法定名分。"
 jxp_founder_legacy.24.b:0 "录用九鬼水军簿。"
 jxp_founder_legacy.25.t:0 "播磨城道与赤松旧旗"
 jxp_founder_legacy.25.d:0 "赤松旧臣呈上播磨城道图、山阳传令簿与被官誓约。城砦若只为固守，终会孤立；若与道路、军粮和家臣誓纸相连，便能重新成为国制之骨。"
 jxp_founder_legacy.25.a:0 "以播磨城路联络诸军。"
 jxp_founder_legacy.25.b:0 "重订赤松被官誓约。"
 jxp_founder_legacy.26.t:0 "虾夷地商站与北奥边备"
 jxp_founder_legacy.26.d:0 "安东旧臣带来虾夷地互市账、北奥船路与边境守备文书。北方寒雾之外既有贸易，也有警讯；新日本必须决定让这条边路更像市庭，还是更像边墙。"
 jxp_founder_legacy.26.a:0 "设虾夷地互市商站。"
 jxp_founder_legacy.26.b:0 "强化北奥边备。"
 jxp_founder_legacy.27.t:0 "香取武门与下总旧谱"
 jxp_founder_legacy.27.d:0 "千叶旧臣携香取神名、下总武士谱与坂东通路求见。关东旧族的价值不只在血脉，也在他们熟悉的军役名簿、社家誓约和朝廷往来。"
 jxp_founder_legacy.27.a:0 "重录香取武门名簿。"
 jxp_founder_legacy.27.b:0 "以下总旧路通达朝廷。"
 jxp_founder_legacy.28.t:0 "丹后津守与一色旧职"
 jxp_founder_legacy.28.d:0 "一色旧臣呈上海口巡防、丹后津守与守护家法。丹后虽小，面海而通山阴；若善用其旧职，小港亦可成为国家警讯和船籍的节点。"
 jxp_founder_legacy.28.a:0 "整饬丹后津守。"
 jxp_founder_legacy.28.b:0 "重修守护家法。"
 jxp_founder_legacy.29.t:0 "日向诸城与山路社寺"
 jxp_founder_legacy.29.d:0 "伊东旧臣把日向诸城图、山路账与社寺调停书置于案前。南九州的远郡不应只听见边风，也应在城网与礼法之间找到归属。"
 jxp_founder_legacy.29.a:0 "重整日向城网。"
 jxp_founder_legacy.29.b:0 "安抚山路社寺。"
 jxp_founder_legacy.30.t:0 "菊池忠名与阿苏火礼"
 jxp_founder_legacy.30.d:0 "菊池旧臣以南朝忠名、火国武士与阿苏社家礼仪相陈。忠义之名可用于砺兵，社家之礼可用于调停九州诸信仰，两者皆不可轻弃。"
 jxp_founder_legacy.30.a:0 "抄录菊池忠义军书。"
 jxp_founder_legacy.30.b:0 "尊重阿苏火礼。"
 jxp_founder_legacy.31.t:0 "河野水军与伊予港法"
 jxp_founder_legacy.31.d:0 "河野旧臣献上潮汐簿、浦口图与伊予港法。水军不只是战船，也是一群懂得暗礁、风向、船籍与海峡人情的旧手。"
 jxp_founder_legacy.31.a:0 "任用濑户内水先众。"
 jxp_founder_legacy.31.b:0 "重修伊予港法。"
 jxp_founder_legacy.32.t:0 "小笠原弓马与诹访山路"
 jxp_founder_legacy.32.d:0 "小笠原旧臣把弓马礼法、诹访山路与骑射名簿并置。武艺若无礼，只是强弓；山路若无守，只是险阻。二者合一，方能成为国家之教。"
 jxp_founder_legacy.32.a:0 "以弓马礼约束武家。"
 jxp_founder_legacy.32.b:0 "设诹访山路守。"
 jxp_founder_legacy.33.t:0 "大宰府余名与海西通交"
 jxp_founder_legacy.33.d:0 "少贰旧臣呈上大宰府旧名、九州商路与使节往来记录。海西门户多风浪，也多语言与商约；旧名若能复用，便可为通交立规。"
 jxp_founder_legacy.33.a:0 "设大宰府通交所。"
 jxp_founder_legacy.33.b:0 "修复九州朝贡礼仪。"
 jxp_founder_legacy.34.t:0 "常陆武门与鹿岛誓纸"
 jxp_founder_legacy.34.d:0 "佐竹旧臣把常陆武士军役簿与鹿岛誓纸献上。坂东武者的勇名需要被写进军制，神名与誓言也可使边境诸家更愿守约。"
 jxp_founder_legacy.34.a:0 "重编常陆军役簿。"
 jxp_founder_legacy.34.b:0 "以鹿岛誓纸砺武门。"
 jxp_founder_legacy.35.t:0 "美浓川并与土岐文雅"
 jxp_founder_legacy.35.d:0 "土岐旧臣陈列美浓河川、纸业、关隘与文书旧例。东国与畿内之间的要冲不只需武备，也需水政、生产和文雅相互牵引。"
 jxp_founder_legacy.35.a:0 "设美浓川并奉行。"
 jxp_founder_legacy.35.b:0 "收录土岐文书与纸业。"
 jxp_founder_legacy.36.t:0 "日光关防与下野军役"
 jxp_founder_legacy.36.d:0 "宇都宫旧臣以日光社寺、北关东道路与下野武士名簿求见。神佛所在需要守护，边关所在需要军役；二者若分离，北门便难安稳。"
 jxp_founder_legacy.36.a:0 "设日光关防使。"
 jxp_founder_legacy.36.b:0 "重编下野军役。"
 jxp_founder_legacy.37.t:0 "大和寺社与筒井城下"
 jxp_founder_legacy.37.d:0 "筒井旧臣呈上兴福寺公约、城众名册与大和町场账。畿内圣地附近最忌私斗，最需章程；寺社、公法与城下经营必须重新坐到同一案前。"
 jxp_founder_legacy.37.a:0 "追定大和寺社公约。"
 jxp_founder_legacy.37.b:0 "整顿兴福寺周边城町。"
 jxp_26_oda_azuchi_edicts:0 "安土开府令"
 jxp_26_oda_azuchi_edicts_desc:0 "安土旧令被整理为新日本的开府法，诸国旧权在统一令书前逐渐退让。"
 jxp_26_oda_market_law:0 "乐市乐座法"
 jxp_26_oda_market_law_desc:0 "市场、座商与城下町被重新纳入自由交易的法令，商路因而更少受旧势力羁绊。"
 jxp_26_tkg_fudai_council:0 "谱代常议"
 jxp_26_tkg_fudai_council_desc:0 "三河谱代与奉行众按家法常议政务，使新朝廷的日常统治更加稳固。"
 jxp_26_tkg_road_barriers:0 "关所传奏网"
 jxp_26_tkg_road_barriers_desc:0 "道路、关所、飞脚与密奏被合为一张谨慎的治理网络。"
 jxp_26_tkd_koshu_muster:0 "甲州军役"
