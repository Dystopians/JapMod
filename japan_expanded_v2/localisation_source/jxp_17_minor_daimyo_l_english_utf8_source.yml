l_english:
 jxp_decision_ama_ymn_sanin_kokujin_league_title:0 "缔结山阴国人盟"
 jxp_decision_ama_ymn_sanin_kokujin_league_desc:0 "出云、因幡与伯耆之间的山路并不总听从城主号令。若能以誓纸、婚姻和互市约束国人众，山阴小国也能聚成一股可用之力。"
 jxp_decision_hsk_sba_htk_kanrei_compact_title:0 "重申管领旧约"
 jxp_decision_hsk_sba_htk_kanrei_compact_desc:0 "细川、斯波与畠山诸家仍背负旧幕府名分。即便将军威权衰微，旧约与礼法仍可成为调停诸国、收束家中分裂的工具。"
 jxp_decision_shn_kkc_kyushu_shrine_registers_title:0 "整录九州社领"
 jxp_decision_shn_kkc_kyushu_shrine_registers_desc:0 "北九州的社寺、庄园与地侍盘根错节。将旧社领重新编册，既能安抚地方，也能让军役和贡纳不再散失。"
 jxp_decision_ogs_shinano_pass_wardens_title:0 "任命信浓峠奉行"
 jxp_decision_ogs_shinano_pass_wardens_desc:0 "信浓山道既是屏障，也是通路。小笠原家若能派奉行守住峠口、驿站和木曾谷的消息，便可在山国之间从容转圜。"
 jxp_decision_utn_cba_kanto_shrine_network_title:0 "修复关东神社网"
 jxp_decision_utn_cba_kanto_shrine_network_desc:0 "宇都宫与千叶诸家依托古社、名族和关东旧礼。修复神社往来与文书承认，能使地方武士重新看见共同的名分。"
 jxp_decision_tki_isk_mino_tango_workshops_title:0 "编管美浓丹后工房"
 jxp_decision_tki_isk_mino_tango_workshops_desc:0 "美浓纸、丹后港与近畿商路之间有许多不起眼的工房和职人。将其纳入家法，便能让小家格也拥有稳定的财货与新知。"
 jxp_decision_ktb_tti_ise_yamato_petition_title:0 "奉呈伊势大和请文"
 jxp_decision_ktb_tti_ise_yamato_petition_desc:0 "伊势与大和靠近神宫、寺社和朝廷旧仪。北畠与筒井若能以请文确认其守护名分，家中权威便更容易披上礼法外衣。"
 jxp_decision_akt_rfr_northern_trade_posts_title:0 "设立北奥交易所"
 jxp_decision_akt_rfr_northern_trade_posts_desc:0 "虾夷、陆奥与日本海北岸之间的毛皮、马匹和鱼货并不等待天下统一。安东与南部若能管住这些交易所，北方边地也会变成家政的一部分。"
 jxp_decision_akm_harima_castle_roads_title:0 "修筑播磨城道"
 jxp_decision_akm_harima_castle_roads_desc:0 "播磨夹在山阳要道与畿内争夺之间。赤松家若能修整城道、驿传和沿途仓屋，便可让小领国的军役更快抵达战场。"
 jxp_decision_ito_kno_southern_sea_envoys_title:0 "遣出南海使船"
 jxp_decision_ito_kno_southern_sea_envoys_desc:0 "日向与伊予面对不同海域，却同样离不开船主、渔村和渡海商人。派出受家法约束的使船，可以让南海消息先抵达本城。"
 jxp_decision_stk_hitachi_samurai_muster_title:0 "召集常陆武士团"
 jxp_decision_stk_hitachi_samurai_muster_desc:0 "常陆平野的武士团分居各郡，既骄矜又难以忽视。佐竹家若能以军役和赏罚重新召集他们，东国边缘便会有更结实的矛头。"
 jxp_decision_asa_ike_mae_storehouse_ledgers_title:0 "整顿诸仓账簿"
 jxp_decision_asa_ike_mae_storehouse_ledgers_desc:0 "无论本城在越前、摄津还是加贺，粮仓、商人和代官账簿都是小家格扩张的骨架。账册清明，才有余力面对更大的天下。"
 jxp_17_sanin_kokujin_league:0 "山阴国人盟"
 jxp_17_sanin_kokujin_league_desc:0 "地方国人以誓纸和互市维系共同防卫，山阴家中更易调和。"
 jxp_17_kanrei_compact:0 "管领旧约"
 jxp_17_kanrei_compact_desc:0 "旧幕府管领家格仍能为外交、调停和家中名分提供余荫。"
 jxp_17_kyushu_shrine_registers:0 "九州社领名簿"
 jxp_17_kyushu_shrine_registers_desc:0 "社寺庄园和地侍军役被重新编册，地方贡纳更可依凭。"
 jxp_17_shinano_pass_wardens:0 "信浓峠奉行"
 jxp_17_shinano_pass_wardens_desc:0 "山道奉行管理峠口、驿站和边境消息，使信浓防线更稳固。"
 jxp_17_kanto_shrine_network:0 "关东神社往来"
 jxp_17_kanto_shrine_network_desc:0 "古社与名族之间的文书往来为关东小大名提供共同礼法。"
 jxp_17_mino_tango_workshops:0 "美浓丹后工房"
 jxp_17_mino_tango_workshops_desc:0 "职人、纸坊和港口手工业被纳入家政，带来稳定产出与技艺流通。"
 jxp_17_ise_yamato_petition:0 "伊势大和请文"
 jxp_17_ise_yamato_petition_desc:0 "守护名分经由请文、神宫和寺社旧仪重新确认。"
 jxp_17_northern_trade_posts:0 "北奥交易所"
 jxp_17_northern_trade_posts_desc:0 "北方交易所汇集马匹、毛皮和鱼货，也让边地消息进入家中。"
 jxp_17_harima_castle_roads:0 "播磨城道"
 jxp_17_harima_castle_roads_desc:0 "修整后的城道和驿传让播磨兵粮与军役更加可靠。"
 jxp_17_southern_sea_envoys:0 "南海使船"
 jxp_17_southern_sea_envoys_desc:0 "受家法约束的使船往来南海港口，带回货物、消息和海上声望。"
 jxp_17_hitachi_samurai_muster:0 "常陆武士团"
 jxp_17_hitachi_samurai_muster_desc:0 "佐竹家重新召集郡中武士，以军役与赏罚稳固东国兵力。"
 jxp_17_storehouse_ledgers:0 "诸仓账簿"
 jxp_17_storehouse_ledgers_desc:0 "仓屋、商人和代官账簿被重新整理，小领国财政更有秩序。"
 jxp_minor_daimyo.1.t:0 "畿内旧家的书札"
 jxp_minor_daimyo.1.d:0 "细川、山名、赤松、斯波、畠山等旧家仍能从京都旧礼中找到名分。乱世已将管领与守护的光辉磨暗，但一纸书札有时仍胜过一队足轻。"
 jxp_minor_daimyo.1.a:0 "让旧礼重入家政。"
 jxp_minor_daimyo.1.b:0 "先把领内账册理清。"
 jxp_minor_daimyo.2.t:0 "西国海路的细帆"
 jxp_minor_daimyo.2.d:0 "出云、筑前、丹后与伊予的海路并不宽阔，却足以让盐、鱼、铁与消息抵达城下。小大名若能管住这些细帆，也就握住了比石高更灵活的力量。"
 jxp_minor_daimyo.2.a:0 "海路须有文书与规约。"
 jxp_minor_daimyo.2.b:0 "先稳住家中亲族。"
 jxp_minor_daimyo.3.t:0 "东国国人的誓纸"
 jxp_minor_daimyo.3.d:0 "关东诸小家夹在大势力之间，仰赖国人众、神社与山野城砦支撑家名。誓纸写得很轻，违背时却常要用血来偿。"
 jxp_minor_daimyo.3.a:0 "召集国人，整列军役。"
 jxp_minor_daimyo.3.b:0 "以旧礼安抚东国。"
 jxp_minor_daimyo.4.t:0 "北奥雪路"
 jxp_minor_daimyo.4.d:0 "北方道路漫长，雪、马市、渔村与异族交易交错在一起。安东与南部诸家懂得，边地秩序不能只靠京都文书。"
 jxp_minor_daimyo.4.a:0 "以亲族和马市稳住北路。"
 jxp_minor_daimyo.4.b:0 "让海路消息进入家中。"
 jxp_minor_daimyo.5.t:0 "关路与神郡"
 jxp_minor_daimyo.5.d:0 "美浓、伊势与大和的山路靠近京畿，也靠近神宫、寺社和商旅。守住这些道路的小家，往往能在大国之间保留一席之地。"
 jxp_minor_daimyo.5.a:0 "向旧仪寻求名分。"
 jxp_minor_daimyo.5.b:0 "修整城下与关路。"
 jxp_minor_daimyo.6.t:0 "九州山海之间"
 jxp_minor_daimyo.6.d:0 "日向、肥后与筑前的山海交错，寺社、港口和地侍各有旧例。小家若能在山中守约，在海边开眼，便仍有伸展之机。"
 jxp_minor_daimyo.6.a:0 "先使山中诸众归约。"
 jxp_minor_daimyo.6.b:0 "让海边商书入城。"
 jxp_minor_daimyo.7.t:0 "北陆旧席"
 jxp_minor_daimyo.7.d:0 "朝仓、池田、前田等家或起于奉公，或守着北陆与畿内的仓屋、寺社与通路。小家格不必自轻，只要账册与礼法还在，就能等待时机。"
 jxp_minor_daimyo.7.a:0 "以礼法修饰家格。"
 jxp_minor_daimyo.7.b:0 "以账册稳住本领。"
