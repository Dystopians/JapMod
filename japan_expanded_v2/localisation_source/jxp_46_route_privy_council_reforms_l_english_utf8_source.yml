l_english:
 jxp_route_institution_privy_councils:0 "诸道枢密院"
 jxp_reform_sakoku_three_houses_privy_council:0 "三家枢议"
 jxp_reform_sakoku_three_houses_privy_council_desc:0 "谱代重臣、禁里奏者与藩政奉行分席议事，凡参觐、国役、边防与寺请册籍，皆先经枢议而后下达。天下之静，不在一声号令，而在众门同锁。"
 jxp_reform_sakoku_coastal_quarantine_bureau:0 "海防检疫局"
 jxp_reform_sakoku_coastal_quarantine_bureau_desc:0 "沿海炮台、番船问改与疫病检断合为一署。海门未必永闭，但凡入港之帆，须先在国法与风向之间停泊。"
 jxp_reform_sakoku_inner_texts_observatory:0 "内典天文寮"
 jxp_reform_sakoku_inner_texts_observatory_desc:0 "禁令之下仍许医术、历算、炮书与天文图籍在官署中校勘。纸窗虽窄，亦可漏进星光；所谓锁国，不应锁住国中之智。"
 jxp_reform_open_oceanic_trade_cabinet:0 "外洋通商内阁"
 jxp_reform_open_oceanic_trade_cabinet_desc:0 "朱印船主、町众巨商与藩库奉行并席登记远航契券。潮声入账，银流入库，海路从豪商的胆识变成国家的制度。"
 jxp_reform_open_foreign_military_advisory_board:0 "外式军议所"
 jxp_reform_open_foreign_military_advisory_board_desc:0 "炮术师、船匠、铳手与译官被置于同一军议之下。异国之法不再只是码头传闻，而成为操场、炮台与军令中的新声。"
 jxp_reform_open_colonial_exchange_council:0 "海殖交易会"
 jxp_reform_open_colonial_exchange_council_desc:0 "远岛屯田、商馆置办与护航舰队共入一册。万里波涛之外仍有可丈量的土地，日轮所照之处，亦可立仓、立市、立约。"
 jxp_reform_kirishitan_apostolic_privy_council:0 "宗徒枢议院"
 jxp_reform_kirishitan_apostolic_privy_council_desc:0 "神父、修会、武家与国法官共同审定教团庇护。十字与日轮若要同照列岛，便须在礼拜钟声之外也听见国家的印信。"
 jxp_reform_kirishitan_misericordia_domain_network:0 "慈悲诸藩网"
 jxp_reform_kirishitan_misericordia_domain_network_desc:0 "港町兄弟会、医院、孤儿院与藩役救济相互连缀。信仰若能抚平街巷疾苦，国家便少一分暗火，多一分可用之心。"
 jxp_reform_kirishitan_romaji_chancery:0 "罗马字文书院"
 jxp_reform_kirishitan_romaji_chancery_desc:0 "以罗马字、假名、汉文并行校录外交、商约与教团文书。字母从海上来，终须在日本的案牍上学会臣服。"
 jxp_reform_confucian_rites_and_censorate_council:0 "礼法台谏院"
 jxp_reform_confucian_rites_and_censorate_council_desc:0 "礼官与监察官同署审定乡约、学校、祭祀与吏治。名分既明，法度方行；一纸奏疏，也可比一队铁骑更快抵达远国。"
 jxp_reform_confucian_shinto_ru_school_compact:0 "神儒学校盟"
 jxp_reform_confucian_shinto_ru_school_compact_desc:0 "诸社、藩校与儒官共释神祇之位，使神道祭礼不废，而列入王化礼序之中。神宫仍在风中，天下则渐入经筵。"
 jxp_reform_confucian_east_asian_law_commission:0 "东亚律令局"
 jxp_reform_confucian_east_asian_law_commission_desc:0 "以礼文、册封、军令与户籍合办东亚事务。开拓万里波涛，布国威于四方；诸邦若知朝仪之所向，兵锋便更少迟疑。"
 jxp_reform_imperial_daijokan_privy_board:0 "太政枢密局"
 jxp_reform_imperial_daijokan_privy_board_desc:0 "以太政官旧名收束诸藩奏议、禁里命令与新政府文书。复古不是倒行旧日，而是在旧名分中铸出新的国家骨架。"
 jxp_reform_imperial_shrine_envoy_network:0 "神祇使节网"
 jxp_reform_imperial_shrine_envoy_network_desc:0 "伊势、石清水、春日、贺茂等社入册，祭祀与使节往来皆有定仪。神路所至，朝威亦至；玉串与国书，皆可成为外交之器。"
 jxp_reform_imperial_guard_and_tax_office:0 "亲兵贡赋司"
 jxp_reform_imperial_guard_and_tax_office_desc:0 "将诸藩亲兵、贡赋、屯仓与军需归入王政名义。近卫不只守殿，也守仓；租税不只养兵，也养成新朝廷的威仪。"
 jxp_reform_reformed_synodic_privy_court:0 "长老枢法院"
 jxp_reform_reformed_synodic_privy_court_desc:0 "港口长老、町年寄与官吏同席裁断教团、学校与商馆争讼。会众可以有自己的讲坛，但讲坛不得高过国家的法案。"
 jxp_reform_reformed_print_and_map_office:0 "印经海图局"
 jxp_reform_reformed_print_and_map_office_desc:0 "铅字、译本、海图与炮书一并入局校勘。真理若要远行，先要成为可复制的文字；海路若要可靠，先要成为可审定的图卷。"
 jxp_reform_reformed_covenant_drill_board:0 "盟约操练局"
 jxp_reform_reformed_covenant_drill_board_desc:0 "以盟约约束城町民兵、港口炮手与武家军役。信仰的火不许任其蔓延，却可在操场上被锻成整齐的火绳。"
 jxp_reform_kaikyo_shura_privy_diwan:0 "协商枢密院"
 jxp_reform_kaikyo_shura_privy_diwan_desc:0 "商人、卡迪、船头与奉行共议港法。季风带来的不只是货物，也带来可被日本吸纳的协商之道。"
 jxp_reform_kaikyo_monsoon_customs_council:0 "季风关税会"
 jxp_reform_kaikyo_monsoon_customs_council_desc:0 "依季风航期登记船籍、货契、税额与护航责任。南海风信有时，国家文书也须赶上风向。"
 jxp_reform_kaikyo_madrasa_foundry_board:0 "经院铸炮局"
 jxp_reform_kaikyo_madrasa_foundry_board_desc:0 "几何、天文、经学与炮术并列授课。朝向麦加的星图，也能指引驶向外洋的舰队；铸炮炉火旁，学问不分远近。"
 jxp_reform_ikko_somon_privy_assembly:0 "惣村枢议所"
 jxp_reform_ikko_somon_privy_assembly_desc:0 "寺内町、惣村、门徒与武家代表入堂议事，国政从堂前草履声中获得新的根基。万人讲同一法，万人亦可担同一国。"
 jxp_reform_ikko_granary_and_temple_commission:0 "公仓寺社司"
 jxp_reform_ikko_granary_and_temple_commission_desc:0 "公仓、寺社、市座与救济役被合为一署。念佛声旁也有算盘，香烟之下也有粮册；民生若稳，军役自生。"
 jxp_reform_ikko_monto_guard_league:0 "门徒守备盟"
 jxp_reform_ikko_monto_guard_league_desc:0 "以讲盟组织乡兵、钟楼与警备，使门徒武装从一揆之势转为国家守备。草庵之钟若有节度，也能成为城防之声。"
 jxp_reform_wokou_black_current_privy_admiralty:0 "黑潮枢密水师"
 jxp_reform_wokou_black_current_privy_admiralty_desc:0 "熟悉黑潮的船头、私掠领袖与水师奉行同入一署。浪人旧术终于写上国名，海盗的胆气也须听见岸上的号令。"
 jxp_reform_wokou_island_custom_courts:0 "岛关牙行法庭"
 jxp_reform_wokou_island_custom_courts_desc:0 "岛港法庭调停货契、赎船、私贸与番商争讼。灰色海路不必尽被焚毁，也可被收进账册，化作国力。"
 jxp_reform_wokou_sea_lord_levy_contracts:0 "海主军役契"
 jxp_reform_wokou_sea_lord_levy_contracts_desc:0 "岛主、船头与港町豪商立约效忠，换取海上自治与国家承认。潮汐难以束缚，却可以约法导向远征之帆。"
