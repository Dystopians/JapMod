l_english:
 jxp_decision_oda_tenka_fubu_edicts_title:0 "颁行天下布武朱印"
 jxp_decision_oda_tenka_fubu_edicts_desc:0 "尾张的朱印不只是商路许可，也是一种宣言：兵农、市町、铁炮与城下秩序皆将归入同一面军旗之下。"
 jxp_decision_tkg_mikawa_fudai_registers_title:0 "整理三河谱代"
 jxp_decision_tkg_mikawa_fudai_registers_desc:0 "三河家臣的忠勤、知行与军役若能登记成册，松平一门便可在动荡天下中拥有更沉稳的根基。"
 jxp_decision_tkd_koshu_hatagashira_title:0 "编成甲州旗头"
 jxp_decision_tkd_koshu_hatagashira_desc:0 "甲斐山国的骑马武者与旗头众必须按法度出阵，使武田的军令像山风一样迅疾而不散。"
 jxp_decision_ues_kanto_kanrei_petition_title:0 "请任关东管领"
 jxp_decision_ues_kanto_kanrei_petition_desc:0 "越后之义名若要越过山岭，仍需朝廷与关东旧秩序的承认。以礼法加诸武名，便能让出阵成为匡正。"
 jxp_decision_hjo_odawara_sogamae_title:0 "营造小田原总构"
 jxp_decision_hjo_odawara_sogamae_desc:0 "城、町、堀、土垒与民户连成一体，小田原不再只是居城，而是北条家经营关东的坚固器皿。"
 jxp_decision_mri_setouchi_suigun_title:0 "统合濑户内水军"
 jxp_decision_mri_setouchi_suigun_desc:0 "岛屿、潮汐、村上水军与安芸商船皆可化为毛利的海上手臂，牵动濑户内每一处泊地。"
 jxp_decision_smz_satsuma_gunnery_title:0 "设立萨摩铁炮众"
 jxp_decision_smz_satsuma_gunnery_desc:0 "九州南端的港风带来火药、铅弹与外来工艺。若能由岛津家严加编组，铁炮便会成为萨摩武名的一部分。"
 jxp_decision_otm_funai_foreign_quarter_title:0 "开设府内外人町"
 jxp_decision_otm_funai_foreign_quarter_desc:0 "府内的港口可以容纳译者、医师、商人和远方来客。大友家若能管束这片街町，外来知识便会进入家法之内。"
 jxp_decision_dte_oshu_kibamusha_title:0 "整备奥州骑马武者"
 jxp_decision_dte_oshu_kibamusha_desc:0 "奥州广阔，山河之间需要能疾行、能屯驻、能临阵改道的骑马众。伊达家的北方野心，必须先有可用的马背军制。"
 jxp_decision_ask_reform_hokoshu_title:0 "再编奉公众"
 jxp_decision_ask_reform_hokoshu_desc:0 "御所的名分若只留在文书中，便会被诸国大名轻慢。重整奉公众与近侍武家，足利家仍可让京都之声传出宫门。"
 jxp_decision_csk_tosa_ichiryo_gusoku_title:0 "编录土佐一领具足"
 jxp_decision_csk_tosa_ichiryo_gusoku_desc:0 "半农半兵的土佐众穿上具足便可出阵，放下长枪又能归田。长宗我部家若能编录其役，山海小国亦能聚成强军。"
 jxp_decision_ouc_yamaguchi_kanhe_trade_title:0 "重开山口勘合商馆"
 jxp_decision_ouc_yamaguchi_kanhe_trade_desc:0 "山口的繁华来自礼书、勘合与海路商旅。大内家若能守住这套文雅而精密的贸易名分，西国诸港仍会向其汇流。"
 jxp_decision_img_tokaido_lawbooks_title:0 "修订东海道分国法"
 jxp_decision_img_tokaido_lawbooks_desc:0 "海道之国连通京都与关东，商旅、寺社与武家皆须知其分际。今川家法若能成文，便可在两都之间立稳门户。"
 jxp_15_oda_tenka_fubu_edicts:0 "天下布武朱印"
 jxp_15_oda_tenka_fubu_edicts_desc:0 "朱印、铁炮与城下法度共同支撑织田家的扩张秩序。"
 jxp_15_tkg_mikawa_fudai_registers:0 "三河谱代役账"
 jxp_15_tkg_mikawa_fudai_registers_desc:0 "谱代家臣的知行与军役被整理成册，形成稳固而忠勤的家中秩序。"
 jxp_15_tkd_koshu_hatagashira:0 "甲州旗头军制"
 jxp_15_tkd_koshu_hatagashira_desc:0 "旗头众与骑马武者按甲州法度集结，临阵调度更为迅疾。"
 jxp_15_ues_kanto_kanrei_petition:0 "关东管领名分"
 jxp_15_ues_kanto_kanrei_petition_desc:0 "越后武名与关东旧礼结合，使上杉家的出阵更具大义。"
 jxp_15_hjo_odawara_sogamae:0 "小田原总构"
 jxp_15_hjo_odawara_sogamae_desc:0 "城郭、町屋与土垒连成整体，北条家的防卫体系愈发稳固。"
 jxp_15_mri_setouchi_suigun:0 "濑户内水军奉行"
 jxp_15_mri_setouchi_suigun_desc:0 "毛利家把岛屿水军、港口商旅与潮汐知识纳入同一海上指挥。"
 jxp_15_smz_satsuma_gunnery:0 "萨摩铁炮众"
 jxp_15_smz_satsuma_gunnery_desc:0 "岛津家以九州港口工艺和家中军令编成精干火器众。"
 jxp_15_otm_funai_foreign_quarter:0 "府内外人町"
 jxp_15_otm_funai_foreign_quarter_desc:0 "译者、医师和远方商人被安置在受控街町，外来知识由此进入大友家政。"
 jxp_15_dte_oshu_kibamusha:0 "奥州骑马武者"
 jxp_15_dte_oshu_kibamusha_desc:0 "伊达家的骑马众熟悉北方地形，能够在长距离调动中保持战力。"
 jxp_15_ask_reform_hokoshu:0 "再编奉公众"
 jxp_15_ask_reform_hokoshu_desc:0 "足利家重新整理御所近侍与奉公众，使京都名分恢复部分实际力量。"
 jxp_15_csk_tosa_ichiryo_gusoku:0 "土佐一领具足"
 jxp_15_csk_tosa_ichiryo_gusoku_desc:0 "长宗我部家编录半农半兵的土佐众，使乡村武力更快集结成军。"
 jxp_15_ouc_yamaguchi_kanhe_trade:0 "山口勘合商馆"
 jxp_15_ouc_yamaguchi_kanhe_trade_desc:0 "大内家以文书礼法管理西国海贸，让山口继续吸纳海外货物与声望。"
 jxp_15_img_tokaido_lawbooks:0 "东海道分国法"
 jxp_15_img_tokaido_lawbooks_desc:0 "今川家法约束寺社、商旅与武家，使海道领国的财政和生产更有秩序。"
