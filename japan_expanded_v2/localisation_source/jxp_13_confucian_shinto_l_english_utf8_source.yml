l_english:
 jxp_confucian_bridge_shrine_registers:0 "神祇名籍"
 jxp_confucian_bridge_shrine_registers_desc:0 "神主、社家与讲官共同编订社格、祭次与乡约。诸神不再被置于国教之外，而是各安其位，列入礼书。"
 jxp_confucian_bridge_city_registers:0 "城下名籍"
 jxp_confucian_bridge_city_registers_desc:0 "町人、座商、寺社与武家屋敷被纳入更清楚的名籍和町触。市声不息，而法度渐成。"
 jxp_confucian_bridge_nanban_edicts:0 "南蛮条规"
 jxp_confucian_bridge_nanban_edicts_desc:0 "商馆、译官与礼部官署共同审定外来书货。海门既开，仍须以条规约束其流。"
 jxp_confucian_bridge_restricted_ports:0 "限定诸港"
 jxp_confucian_bridge_restricted_ports_desc:0 "异国船只只能在指定港町受验。通词记其货，奉行察其书，社家留意其教。"

 jxp_confucian_shinto.1.t:0 "神儒会通"
 jxp_confucian_shinto.1.d:0 "朱子之学既为国教，伊势与诸社却仍居万民记忆之中。讲官上言：礼者，敬而已矣；若以经义定祭次，以乡约正民俗，则神明不必与圣贤相争。社家亦愿入京陈述旧仪，求在新制中保其位分。"
 jxp_confucian_shinto.1.a:0 "编诸社名籍，使神祇各安其位。"
 jxp_confucian_shinto.1.b:0 "先召讲官入朝，以经义定国本。"
 jxp_confucian_shinto.2.t:0 "社家与讲官"
 jxp_confucian_shinto.2.d:0 "社家携旧牒而至，讲官持礼书相校。有人主张以神祇之祭维系皇统，有人则以藩校之教约束武士。灯火下的争论不在一社一寺，而在天下名分。"
 jxp_confucian_shinto.2.a:0 "使社祭入礼，礼不废神。"
 jxp_confucian_shinto.2.b:0 "广设学校，先正人心。"
 jxp_confucian_shinto.3.t:0 "诸神列于礼书"
 jxp_confucian_shinto.3.d:0 "新的礼书抄本传至诸国。乡村仍在鸟居下祈年，武士仍在讲席前读经；不同的是，祭礼、学规与官令已能在同一套名分中彼此照应。古事不废，新制始成。"
 jxp_confucian_shinto.3.a:0 "神道不亡，儒礼有归。"

 jxp_confucian_shinto.10.t:0 "城下町之议"
 jxp_confucian_shinto.10.d:0 "城下町日益繁盛，米、布、铁器与书籍在街市中往来。町人求扩街巷，寺社忧旧例渐坏，武家则愿以户籍与町触掌其出入。繁华既是国力，也是秩序的考验。"
 jxp_confucian_shinto.10.a:0 "准其扩建，以名籍约束。"
 jxp_confucian_shinto.10.b:0 "收束移住，使诸户有定。"
 jxp_confucian_shinto.11.t:0 "町人迁徙"
 jxp_confucian_shinto.11.d:0 "农闲之民、流寓匠人和港町商贾不断涌入城下。旧村里抱怨人丁散去，町年寄却说市井若无新民，仓廪亦难充实。奉行案上堆满了请愿与禁令。"
 jxp_confucian_shinto.11.a:0 "开市而立籍，使其有所归。"
 jxp_confucian_shinto.11.b:0 "以町触重订座与行会。"
 jxp_confucian_shinto.12.t:0 "市声入礼"
 jxp_confucian_shinto.12.d:0 "城下的钟声、木屐声与算盘声渐渐有了定规。有人说这是礼法驯服了市井，也有人说是市井迫使礼法学会通融。无论如何，城下町已成为新国家不可回避的根脉。"
 jxp_confucian_shinto.12.a:0 "让町人带来更远的海风。"
 jxp_confucian_shinto.12.b:0 "让繁华服从名分。"

 jxp_confucian_shinto.20.t:0 "南蛮船与礼部咨文"
 jxp_confucian_shinto.20.d:0 "南蛮船入港，货中有银、玻璃、火器、钟表与圣像。通词请开交易，社家忧其异端，讲官则请设条规：货可入账，书可翻检，教义不得越过奉行与学校。"
 jxp_confucian_shinto.20.a:0 "准其贸易，立商馆与通词。"
 jxp_confucian_shinto.20.b:0 "限定诸港，先验其书货。"
 jxp_confucian_shinto.21.t:0 "译书与异端"
 jxp_confucian_shinto.21.d:0 "译官呈上异国医方、炮术、天文与教理摘要。诸生争论不休：技艺可用，义理可疑；若全拒之，海门闭塞，若全纳之，民心动摇。"
 jxp_confucian_shinto.21.a:0 "设译书局，取其器术。"
 jxp_confucian_shinto.21.b:0 "以礼书批其义理。"
 jxp_confucian_shinto.22.t:0 "商馆规制"
 jxp_confucian_shinto.22.d:0 "商馆既立，船主索求更宽的停泊、仓储与传教余地。港町商人愿以白银作保，社家和奉行却要求更严的名籍、通词与居留令。"
 jxp_confucian_shinto.22.a:0 "许其货流，禁其越制。"
 jxp_confucian_shinto.22.b:0 "宁缓其利，不乱其礼。"
 jxp_confucian_shinto.23.t:0 "海门有度"
 jxp_confucian_shinto.23.d:0 "几年往来之后，商馆、译书局与港町奉行已形成惯例。海风仍带来奇技与异闻，但不再毫无名籍地涌入国中。开拓万里波涛，亦须先定一港之规。"
 jxp_confucian_shinto.23.a:0 "以海利养国。"
 jxp_confucian_shinto.23.b:0 "以法度驭海。"
