l_english:
 jxp_a_establish_kokujin_relation:0 "缔结寄亲—寄子关系"
 jxp_a_establish_kokujin_relation_title:0 "缔结寄亲—寄子关系"
 jxp_a_establish_kokujin_relation_desc:0 "是否以誓纸、安堵和人质约束§Y[From.GetName]§!，使其成为我家的陪臣大名？这不是新的引擎属国：[From.GetName]仍在法理上直属幕府，但会在军役、贡纳和保护上依附我家。"
 jxp_a_establish_kokujin_relation_tooltip:0 "在两家之间建立唯一、可重建的一层国众从属关系。基础容量为1，每100总发展度增加1，硬上限3，电脑上限2。"
 jxp_a_establish_kokujin_relation_alert_tooltip:0 "有人提议缔结寄亲—寄子关系"
 jxp_a_establish_kokujin_relation_dialog:0 "§Y[This.GetName]§!提议以安堵和军役契约将我家纳入其家中秩序。法理上我们仍是幕府直属大名，但将承担贡纳与军役义务。"

 jxp_a_release_kokujin_relation:0 "解除国众从属"
 jxp_a_release_kokujin_relation_title:0 "解除国众从属"
 jxp_a_release_kokujin_relation_desc:0 "解除与§Y[From.GetName]§!的寄亲—寄子契约，使其恢复完全的幕府直属地位。"
 jxp_a_release_kokujin_relation_tooltip:0 "清除双方关系标记并返还一格家中统辖容量。"

 jxp_a_request_kokujin_defection:0 "诱使陪臣倒戈"
 jxp_a_request_kokujin_defection_title:0 "诱使陪臣倒戈"
 jxp_a_request_kokujin_defection_desc:0 "是否劝诱§Y[From.GetName]§!撕毁旧誓、转投我家？这将耗费外交资源，并激怒其原寄亲和幕府。"
 jxp_a_request_kokujin_defection_tooltip:0 "若对方接受，其唯一寄亲会被替换；原寄亲获得报复名分，幕府也会谴责这次未经裁定的转付。"
 jxp_a_request_kokujin_defection_alert_tooltip:0 "有人试图诱使我家倒戈"
 jxp_a_request_kokujin_defection_dialog:0 "§Y[This.GetName]§!许诺新的安堵与保护，要求我们撕毁旧誓并转投其家中。原寄亲和幕府必将作出反应。"

 jxp_a_shogunal_adjudicate_kokujin:0 "幕府裁定从属"
 jxp_a_shogunal_adjudicate_kokujin_title:0 "幕府裁定从属"
 jxp_a_shogunal_adjudicate_kokujin_desc:0 "由幕府撤销§Y[From.GetName]§!的家中从属契约，将其恢复为直属大名。原寄亲会失去威望并不满于幕府裁定。"
 jxp_a_shogunal_adjudicate_kokujin_tooltip:0 "以外交点数解除这段从属关系，清除倒戈状态，并让双方缓存于下一次协调时重新收敛。"

 jxp_a_request_kokujin_military_service:0 "请求国众输送军役"
 jxp_a_request_kokujin_military_service_title:0 "请求国众输送军役"
 jxp_a_request_kokujin_military_service_desc:0 "要求§Y[From.GetName]§!输送兵员和粮饷。由于EU4无法安全地把脚本召集限定在一场战争，本行动只转移军役资源，§R不会§!令陪臣自动加入当前或今后的全部战争。"
 jxp_a_request_kokujin_military_service_tooltip:0 "获得短期兵员与动员加成；对方可以拒绝，并因此进入抗命状态。"
 jxp_a_request_kokujin_military_service_alert_tooltip:0 "寄亲要求输送军役"
 jxp_a_request_kokujin_military_service_dialog:0 "§Y[This.GetName]§!要求我们输送兵员和粮饷。这不是参战召集；接受只会移交部分人力。"

 jxp_a_nested_client_status:0 "陪臣大名"
 jxp_a_nested_client_status_desc:0 "我家在法理上仍直属幕府，但日常军役、保护和贡纳受寄亲约束，且不得再拥有自己的陪臣。"
 jxp_a_nested_patron_status:0 "寄亲统辖"
 jxp_a_nested_patron_status_desc:0 "至少一个小大名与我家缔结了寄亲—寄子契约，为家中提供有限军役。"
 jxp_a_nested_lord_defiance:0 "国众抗命"
 jxp_a_nested_lord_defiance_desc:0 "倒戈或拒绝军役使家中秩序动摇，也为原寄亲或幕府留下了追究名分。"
 jxp_a_nested_military_service:0 "国众军役输送"
 jxp_a_nested_military_service_desc:0 "陪臣大名输送了兵员和粮饷，但并未被脚本强制加入任何战争。"

 jxp_a_opinion_kokujin_patron:0 "寄亲关系标记"
 jxp_a_opinion_protected_kokujin:0 "寄子关系标记"
 jxp_a_opinion_nested_lord_released:0 "妥善解除从属"
 jxp_a_opinion_nested_lord_betrayal:0 "国众背誓"
 jxp_a_opinion_illegal_nested_transfer:0 "未经幕府裁定转付陪臣"
 jxp_a_opinion_shogunal_adjudication:0 "幕府撤销从属"

 cb_jxp_a_daimyo_border_dispute:0 "国境相论"
 cb_jxp_a_daimyo_border_dispute_desc:0 "以边境争议和普通宣称为依据，有限度地争夺日本境内的相邻领地。折扣不会作用于海外，也会留下地方整合压力。"
 cb_jxp_a_kokujin_subjugation:0 "国众处分"
 cb_jxp_a_kokujin_subjugation_desc:0 "追究抗命陪臣的背誓责任。该战争只能索取日本境内的普通领土条件，§R不会§!把脚本关系伪装成原生属国和平条款。"
 cb_jxp_a_shogunal_censure:0 "幕府追讨"
 cb_jxp_a_shogunal_censure_desc:0 "幕府针对倒戈与抗命大名发布追讨令。折扣严格限定于统一前的日本大名和日本境内省份。"

 jxp_a_daimyo_border_dispute:0 "国境相论"
 jxp_a_kokujin_subjugation:0 "国众处分"
 jxp_a_shogunal_censure:0 "幕府追讨"
 JXP_A_DAIMYO_BORDER_DISPUTE_COUNTRY_DESC:0 "国境相论仅能索取位于日本、属于日本大名且与我方相邻或已有普通宣称的省份。"
 JXP_A_DAIMYO_BORDER_DISPUTE_PROV_DESC:0 "此省必须位于日本、属于统一前日本大名，并与我方相邻或已有普通宣称。"
 JXP_A_DAIMYO_BORDER_DISPUTE_WAR_NAME:0 "$ORDER$$FIRST$—$SECOND$国境相论"
 JXP_A_KOKUJIN_SUBJUGATION_COUNTRY_DESC:0 "国众处分只能索取日本境内属于统一前日本大名的省份，不能以属国化条款伪造原生嵌套。"
 JXP_A_KOKUJIN_SUBJUGATION_PROV_DESC:0 "此省必须位于日本并属于统一前日本大名。"
 JXP_A_KOKUJIN_SUBJUGATION_WAR_NAME:0 "$ORDER$$FIRST$讨伐$SECOND$抗命国众之战"
 JXP_A_SHOGUNAL_CENSURE_COUNTRY_DESC:0 "幕府追讨只能处理日本境内的统一前日本大名领土。"
 JXP_A_SHOGUNAL_CENSURE_PROV_DESC:0 "此省必须位于日本并属于统一前日本大名。"
 JXP_A_SHOGUNAL_CENSURE_WAR_NAME:0 "$ORDER$$FIRST$对$SECOND$的幕府追讨"

 jxp_a_press_border_arbitration:0 "提出国境相论"
 jxp_a_press_border_arbitration_title:0 "提出国境相论"
 jxp_a_press_border_arbitration_desc:0 "整理旧券、检地帐和寺社文书，对§Y[From.GetName]§!的一处日本边境领地提出§Y普通宣称§!。宣称会按通常规则随时间消逝，绝非永久宣称。"
 jxp_a_press_border_arbitration_tooltip:0 "花费外交点数与威望，在相邻的日本省份中取得一个普通宣称；五年内不能再次提出。"

 jxp_a_border_arbitration_cooldown:0 "国境相论整理期"
 jxp_a_border_arbitration_cooldown_desc:0 "家臣正整理上一宗边境诉讼的文书与证人。"
 jxp_a_disputed_internal_integration:0 "旧主家臣与转封争议"
 jxp_a_disputed_internal_integration_desc:0 "日本内部兼并虽然比跨海征服更易获得承认，旧主家臣、寺社、町众与国人仍会反对新领主的检地和转封。"
