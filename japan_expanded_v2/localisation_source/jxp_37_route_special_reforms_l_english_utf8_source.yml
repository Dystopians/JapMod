l_english:
 jxp_route_institution_special_bureaus:0 "日轮国制别格政务"
 jxp_reform_sakoku_kokka_ritsuryo:0 "国法律令所"
 jxp_reform_sakoku_kokka_ritsuryo_desc:0 "国中诸令不再只由老中传达，而由专署校订成可查、可引、可奉行的律令。闭门之国若要长治，先须使门内万事有据。"
 jxp_reform_sakoku_hidden_arsenal_network:0 "隐砦铁炮网"
 jxp_reform_sakoku_hidden_arsenal_network_desc:0 "山城、浦番与铁炮匠被纳入一张不张扬的军械网。外帆未至时，炉火不息；号令未下时，弹药已入账册。"
 jxp_reform_sakoku_selective_dutch_window:0 "择译兰学窗"
 jxp_reform_sakoku_selective_dutch_window_desc:0 "出岛之窗不开给流言，却可开给医书、历法与炮术。译官逐字审定，奉行逐卷封存，使外学在谨慎中成为国用。"
 jxp_reform_open_port_guild_diet:0 "港町商座评议"
 jxp_reform_open_port_guild_diet_desc:0 "堺、博多、长崎诸商座同列评议，以汇兑、船契与税簿编织海路。海门既开，商人之声也须纳入国策。"
 jxp_reform_open_blue_water_navy_board:0 "远洋船手奉行"
 jxp_reform_open_blue_water_navy_board_desc:0 "船匠、舵工、炮手与通词由奉行署统辖，港中之船不再只为沿岸往还，而要能承受外海的浪与火。"
 jxp_reform_open_translator_bureau_cabinet:0 "译官参议局"
 jxp_reform_open_translator_bureau_cabinet_desc:0 "译官不只是口舌之役，也成为朝廷听懂世界的耳目。异国书信、契约与学问先入译局，再入政务。"
 jxp_reform_kirishitan_royal_baptismal_registers:0 "王权洗礼籍"
 jxp_reform_kirishitan_royal_baptismal_registers_desc:0 "城下町与港口教团以洗礼簿、户籍与誓纸相连。十字若要安居日轮之下，须先写进国家的册籍。"
 jxp_reform_kirishitan_confraternity_armories:0 "信友武库"
 jxp_reform_kirishitan_confraternity_armories_desc:0 "慈悲会、港町信众与武家家臣共同看守武库。祈祷不替代军令，却能使持枪之人知道自己为何列阵。"
 jxp_reform_kirishitan_pacific_mission_patronage:0 "太平洋布教护持"
 jxp_reform_kirishitan_pacific_mission_patronage_desc:0 "钟声随船帆越过大洋，传教士、商人和水军在远岛上寻找可安放日轮旗帜的港湾。"
 jxp_reform_confucian_ritual_provincial_examinations:0 "诸国礼学贡试"
 jxp_reform_confucian_ritual_provincial_examinations_desc:0 "诸藩士子以经义、礼仪与行政策论入试。名分若只在京都讲堂中回响，便不能深入远国的账册与公庭。"
 jxp_reform_confucian_kokugaku_shushi_synthesis:0 "国学朱子会通"
 jxp_reform_confucian_kokugaku_shushi_synthesis_desc:0 "社家旧仪、和歌古训与朱子义理相互辨析。礼制日本不以一书压倒诸道，而要使神国记忆归于王化秩序。"
 jxp_reform_confucian_tenka_censorate:0 "天下按察台"
 jxp_reform_confucian_tenka_censorate_desc:0 "按察使巡行诸国，察税簿、问乡约、纠豪强。笔墨虽轻，落到国中时也能重如刀背。"
 jxp_reform_imperial_great_council_of_state:0 "大政会议"
 jxp_reform_imperial_great_council_of_state_desc:0 "公卿、武家与新任诸卿同坐大政会议，诏书不再孤悬御所，而化为可执行的官署分掌。"
 jxp_reform_imperial_restoration_military_academy:0 "亲兵讲武寮"
 jxp_reform_imperial_restoration_military_academy_desc:0 "禁里亲兵、诸藩精锐与炮术教师入讲武寮合训。王政之兵既奉古名，也须习新阵。"
 jxp_reform_imperial_shrine_diplomacy:0 "神祇使节制"
 jxp_reform_imperial_shrine_diplomacy_desc:0 "伊势、石清水与诸大社的名分随使节传向四方。外交不只凭契纸，也凭能让远人理解的神圣秩序。"
 jxp_reform_reformed_printed_consistory_law:0 "刻印长老规约"
 jxp_reform_reformed_printed_consistory_law_desc:0 "长老会规约被刻印成册，送往港町、学校与地方教团。信约若能被反复阅读，便不易散为私语。"
 jxp_reform_reformed_dutch_drill_contracts:0 "荷兰操典契约"
 jxp_reform_reformed_dutch_drill_contracts_desc:0 "教团长老、荷兰教官与武家奉行议定操典。火器、队列与祈祷在契纸上相遇，形成冷静而克制的新军。"
 jxp_reform_reformed_maritime_elder_board:0 "海港长老理事会"
 jxp_reform_reformed_maritime_elder_board_desc:0 "诸港长老、商馆代表与水军头目共同议约，处理航路、税簿、争端与救济。海上信约由此有了可落座的公厅。"
 jxp_reform_kaikyo_sharia_port_charter:0 "港市沙里亚约章"
 jxp_reform_kaikyo_sharia_port_charter_desc:0 "卡迪、港奉行与商旅长老共同承认港市约章。不同礼俗在同一法庭前陈词，海峡之国才可久安。"
 jxp_reform_kaikyo_monsoon_fleet_diwan:0 "季风船队迪万"
 jxp_reform_kaikyo_monsoon_fleet_diwan_desc:0 "船主、译官、武士与南海商人按季风议定航期。日本的海门不再只朝东开，也随西南季风呼吸。"
 jxp_reform_kaikyo_madrasa_gunfounders:0 "铸炮经院"
 jxp_reform_kaikyo_madrasa_gunfounders_desc:0 "经院讲授法学，也安置数学、铸炮与测星之学。信仰与技艺不必相拒，火炮亦可从书案旁铸成。"
 jxp_reform_ikko_grand_somon_compact:0 "大惣中国约"
 jxp_reform_ikko_grand_somon_compact_desc:0 "寺内町、讲众、乡村与旧武家共同订立国约。钟声召来的不只是信徒，也是愿意承担国役的众人。"
 jxp_reform_ikko_monto_levy_bells:0 "门徒军役钟"
 jxp_reform_ikko_monto_levy_bells_desc:0 "各地讲中以钟声、誓纸与仓廪承担军役。百姓持枪不再只是乱世余响，而是被共同法度约束的守土之责。"
 jxp_reform_ikko_templeschool_communes:0 "寺子学舍惣"
 jxp_reform_ikko_templeschool_communes_desc:0 "寺子屋、讲中账房与町组公议相互扶持，使读写、算账和信仰都成为地方自治的根基。"
 jxp_reform_wokou_red_seal_corsair_law:0 "朱印私掠法"
 jxp_reform_wokou_red_seal_corsair_law_desc:0 "浪人、船主与岛港头目持朱印出海，分赃、俘获与侦探皆有章程。无羁之帆一旦系上国印，便成朝廷的锋刃。"
 jxp_reform_wokou_black_current_admiralty:0 "黑潮提督府"
 jxp_reform_wokou_black_current_admiralty_desc:0 "熟知黑潮的船将列入提督府，海战、侦查、补给与俘船皆归一署。潮水无常，军令须比潮汐更准。"
 jxp_reform_wokou_island_customs_federation:0 "岛港关市盟"
 jxp_reform_wokou_island_customs_federation_desc:0 "岛港按关市盟约验货、征税、修船与分利。海上诸地不再只是避风处，而是一串可治理的钥匙。"
