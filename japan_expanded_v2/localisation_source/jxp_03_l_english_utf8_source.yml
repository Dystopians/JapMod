l_english:
 jxp_mission_eastasia_ryukyu_gateway_title:0 "琉球门户"
 jxp_mission_eastasia_ryukyu_gateway_desc:0 "琉球处日本、明清与南海诸港之间，贡船、漂民与商人皆由此过。若要重入东亚海路，先须听懂琉球的潮声。"
 jxp_mission_eastasia_korea_embassy_title:0 "朝鲜通信使"
 jxp_mission_eastasia_korea_embassy_desc:0 "通信使越过对马与瀬户内海，携礼书、学者与谨慎的问候而来。海峡两岸的体面，往往比一场胜仗更难取得。"
 jxp_mission_eastasia_manchu_watch_title:0 "女真边闻"
 jxp_mission_eastasia_manchu_watch_desc:0 "辽东、女真与朝鲜之间风云变幻。北方消息若不能入京都与江户，日本便只能在他国书信中得知自己的命运。"
 jxp_mission_eastasia_ming_trade_title:0 "明船朱印"
 jxp_mission_eastasia_ming_trade_desc:0 "朱印、海防与商馆之间可以重建通往中国海岸的秩序。船有印信，货有账册，交涉便不只是私商的冒险。"
 jxp_mission_eastasia_tribute_registry_title:0 "贡贸名簿"
 jxp_mission_eastasia_tribute_registry_desc:0 "来使、商船、译官、僧侣与中介皆须入册。贡贸若不被国家看见，便只会在港口阴影中滋长。"
 jxp_mission_eastasia_nagasaki_interpreters_title:0 "长崎译官"
 jxp_mission_eastasia_nagasaki_interpreters_desc:0 "东亚外交不只靠刀剑，也靠能读懂礼书、契约与航海账册的人。译官一字之差，可能改变一条海路。"
 jxp_mission_eastasia_balance_mandate_title:0 "衡量天命"
 jxp_mission_eastasia_balance_mandate_desc:0 "中原天命并非遥不可及的观念。它既可成为东亚秩序的屋梁，也可能成为海上国家必须绕开的旧柱。"
 jxp_mission_eastasia_claim_mandate_title:0 "日轮问鼎"
 jxp_mission_eastasia_claim_mandate_desc:0 "当天命动摇、诸国观望，日本可以尝试用日轮之名提出新的天下叙事。皇天无亲，惟德是辅。"
 jxp_mission_eastasia_break_mandate_title:0 "破除旧命"
 jxp_mission_eastasia_break_mandate_desc:0 "若中原天命只是束缚海路的旧辞，日本便要让东亚诸国看见另一种秩序：不居紫禁，亦可控港通商。"
 jxp_mission_eastasia_hegemon_of_the_seas_title:0 "海上霸权"
 jxp_mission_eastasia_hegemon_of_the_seas_desc:0 "不取中原，也可控海路；不居紫禁，也可令诸港承认日轮旗。海上霸权以码头、船队与誓约书写。"
 jxp_mission_eastasia_liaodong_route_title:0 "辽东航线"
 jxp_mission_eastasia_liaodong_route_desc:0 "从对马、釜山到辽东的航线将半岛消息和北方货物带入日本。风向若变，先变的是水手的传闻。"
 jxp_mission_eastasia_celestial_diplomacy_title:0 "天朝外交"
 jxp_mission_eastasia_celestial_diplomacy_desc:0 "册封、互市、战争与体面之间并无固定答案。日本必须学会在旧礼制中取利，也必须知道何时离席。"
 jxp_mission_pacific_charter_title:0 "太平洋敕许"
 jxp_mission_pacific_charter_desc:0 "第一张敕许状送向外洋，商人、武士与传教士因同一枚印信而同行。荒海や佐渡によこたふ天河，远海之上亦有国法。"
 jxp_mission_pacific_ogasawara_anchor_title:0 "小笠原泊地"
 jxp_mission_pacific_ogasawara_anchor_desc:0 "远洋船队需要中继港、淡水、木材与能在风暴后修补船身的工匠。海图上的一点岛影，可能救回整支船队。"
 jxp_mission_pacific_guam_waystation_title:0 "关岛中站"
 jxp_mission_pacific_guam_waystation_desc:0 "通往马尼拉的中站使太平洋不再只是地图上的空白。补给、修船与译官让遥远航程变成可重复的制度。"
 jxp_mission_pacific_manila_link_title:0 "马尼拉连线"
 jxp_mission_pacific_manila_link_desc:0 "长崎、马尼拉与美洲白银在同一条航路上相遇。日本若能接住这股银流，便能在太平洋贸易中发出自己的声音。"
 jxp_mission_pacific_hawaii_soundings_title:0 "夏威夷测风"
 jxp_mission_pacific_hawaii_soundings_desc:0 "测定风向、海流与补给点，是跨越北太平洋前必须完成的功课。海上没有道路，只有被一再记住的风。"
 jxp_mission_pacific_alaska_posts_title:0 "阿拉斯加据点"
 jxp_mission_pacific_alaska_posts_desc:0 "北方寒港贫瘠而遥远，却有毛皮、渔场与通往新大陆的踏脚石。远洋事业常从最冷的岸边开始。"
 jxp_mission_pacific_california_harbors_title:0 "加州诸港"
 jxp_mission_pacific_california_harbors_desc:0 "在金色海岸立下码头、仓库与小教堂，日本的日轮便越过大洋。太平洋不再是边界，而是一条道路。"
 jxp_oceanic_sun_reform:0 "远洋日轮体制"
 jxp_oceanic_sun_reform_desc:0 "天皇裁可、武家行政与港口商馆共同支撑远洋扩张。对内守天下之序，对外以敕许、殖民与贡贸把日轮旗送向海天尽处。"
 jxp_decision_claim_mandate_japan_title:0 "日本宣称天命"
 jxp_decision_claim_mandate_japan_desc:0 "当中原王朝衰败、东亚秩序动摇时，日本可以宣称自身承继更高名分。此举不是单纯模仿中原，而是为日轮国家寻找可与诸国对话的礼制语言。"
 jxp_decision_break_mandate_title:0 "破除天命叙事"
 jxp_decision_break_mandate_desc:0 "我们不必接受中原天命定义东亚秩序。以海权、贸易与盟约取代旧礼制，日本将把自己的霸权写在港口与航路上。"
 jxp_decision_charter_pacific_title:0 "颁布太平洋敕许状"
 jxp_decision_charter_pacific_desc:0 "向获准的商社、家臣团与港口团体发出敕许，允许他们在太平洋建立补给港、商馆和殖民据点。每一枚印信都把私人冒险纳入国家事业。"
 jxp_eastasia.1.t:0 "朝鲜通信使抵达"
 jxp_eastasia.1.d:0 "来自朝鲜的使节穿过对马与瀬户内海，抵达我们的宫廷。他们带来礼书、学者、药材与谨慎的试探：日本究竟要做东亚礼制的参与者，还是只做持刀的邻国？"
 jxp_eastasia.1.a:0 "以厚礼接待，重开礼仪道路。"
 jxp_eastasia.1.b:0 "礼节可以有，边防更不可松。"
 jxp_eastasia.2.t:0 "中原天命动摇"
 jxp_eastasia.2.d:0 "渡海商人带来的消息彼此矛盾，却都指向同一件事：中原的权威正在开裂。有人劝我们趁机宣称更高名分，也有人说日本只需掌控海路，不该被旧辞束缚。"
 jxp_eastasia.2.a:0 "日轮亦可照临天下。"
 jxp_eastasia.2.b:0 "让旧天命在海风中散去。"
 jxp_eastasia.3.t:0 "满洲与朝鲜之间"
 jxp_eastasia.3.d:0 "辽东、女真与朝鲜之间的局势不断变化。若我们能掌握这条北方航线，商路、情报与外交筹码都会流向日本；若处置失当，半岛也会成为拖住我们的泥沼。"
 jxp_eastasia.3.a:0 "建立稳固的北方通道。"
 jxp_eastasia.3.b:0 "避免在大陆边事中陷得太深。"
 jxp_eastasia.4.t:0 "长崎的贡贸名簿"
 jxp_eastasia.4.d:0 "长崎奉行呈上新的名簿：商船、译官、来使、僧侣与可疑中介全被编入条目。有人抱怨手续繁琐，但正是这些手续让海贸能够被国家看见。"
 jxp_eastasia.4.a:0 "登记之后，海路才属于国家。"
 jxp_eastasia.4.b:0 "给港口商人留出更宽的余地。"
 jxp_colonial.1.t:0 "太平洋敕许状"
 jxp_colonial.1.d:0 "获准远航的船主、武士和商人聚集在港口，等待盖有朝廷与武家印信的敕许状。纸面上的几行字，将决定他们是私自冒险的浪人，还是日轮国家的前锋。"
 jxp_colonial.1.a:0 "以国家名义放船出洋。"
 jxp_colonial.1.b:0 "敕许必须严格限额。"
 jxp_colonial.2.t:0 "马尼拉与长崎之间"
 jxp_colonial.2.d:0 "马尼拉大帆船带来的白银、丝货与传闻在长崎码头交汇。若我们接入这条航路，日本将不再只是东亚边缘的岛国，而会成为太平洋银流的一处阀门。"
 jxp_colonial.2.a:0 "让长崎接住马尼拉的银流。"
 jxp_colonial.2.b:0 "这条航线必须置于严密监督下。"
 jxp_colonial.3.t:0 "北太平洋的寒港"
 jxp_colonial.3.d:0 "探险船带回北方海岸的消息：寒冷、漫长、物产稀薄，却有毛皮、渔场与通往新大陆的踏脚石。若日本要横跨大洋，寒港也有它的价值。"
 jxp_colonial.3.a:0 "建立阿拉斯加据点。"
 jxp_colonial.3.b:0 "先把补给线稳住。"
 jxp_colonial.4.t:0 "加州海岸的日轮旗"
 jxp_colonial.4.d:0 "越过漫长航程后，我们的船队终于在遥远东岸升起日轮旗。港湾、传教站、木材场与商馆还很脆弱，但它们已经证明：太平洋并非边界，而是一条道路。"
 jxp_colonial.4.a:0 "让这片海岸记住日本。"
 jxp_colonial.4.b:0 "殖民地必须先学会自给。"
 jxp_oceanic_sun_state:0 "远洋日轮国"
 jxp_oceanic_sun_state_desc:0 "国家已将海权、敕许殖民与东亚贡贸纳入同一套日轮秩序。朝仪在内，船帆在外，二者共同支撑新的日本。"
 jxp_pacific_charter:0 "太平洋敕许状"
 jxp_pacific_charter_desc:0 "获准的商社与家臣团可以在太平洋建立补给港、商馆与殖民据点。私人的胆量由国家印信加以约束。"
 jxp_mandate_fallback_hegemony:0 "日轮海上霸权"
 jxp_mandate_fallback_hegemony_desc:0 "日本拒绝被中原天命束缚，转而以海权、港口与盟约建立东亚影响力。旧礼制之外，仍有潮汐可凭。"
 jxp_manchu_korean_route:0 "满洲朝鲜航路"
 jxp_manchu_korean_route_desc:0 "对马、朝鲜与辽东之间的航路为日本带来北方贸易、外交情报与军事预警。"
 jxp_manila_nagasaki_route:0 "马尼拉长崎航路"
 jxp_manila_nagasaki_route_desc:0 "马尼拉白银、南海货物与日本港口网络被连成稳定航线。长崎码头开始听见太平洋的市声。"
 jxp_alaska_california_route:0 "阿拉斯加加州航路"
 jxp_alaska_california_route_desc:0 "北太平洋据点与加州港口共同支撑日本跨洋殖民。寒港与暖岸，都是同一面旗帜的停泊处。"
 jxp_eastasia_tribute_registry:0 "东亚贡贸名簿"
 jxp_eastasia_tribute_registry_desc:0 "来使、商船与译官被纳入国家登记。名簿上的每一行，都是海贸从私下走向国政的痕迹。"
 jxp_celestial_diplomacy:0 "天朝外交术"
 jxp_celestial_diplomacy_desc:0 "日本学会在册封礼仪、互市特权与武力威慑之间运用不同名分。旧礼可以是绳索，也可以是梯子。"
 jxp_pacific_waystations:0 "太平洋中继港"
 jxp_pacific_waystations_desc:0 "一串补给港让远航船队能够跨越更长的航程。木桶里的淡水与海图上的墨点同样重要。"
 jxp_colonial_sun_banner:0 "殖民日轮旗"
 jxp_colonial_sun_banner_desc:0 "远方殖民地以日轮旗确认自身仍属于日本的国家计划。海尽头的旗影，也能回照京都与江户。"
 jxp_mission_eastasia_tsushima_office_title:0 "对马海峡奉行"
 jxp_mission_eastasia_tsushima_office_desc:0 "对马不是边陲孤岛，而是朝鲜、辽东与日本之间的听风处。若能在此设官理船，海峡便会成为秩序的门槛。"
 jxp_mission_eastasia_ryukyu_registry_title:0 "琉球转运册"
 jxp_mission_eastasia_ryukyu_registry_desc:0 "琉球诸港熟悉南海风向，也熟悉中原礼仪。把转运、朝贡与私商纳入同一册簿，日本才能真正读懂南方海路。"
 jxp_mission_eastasia_taiwan_lanes_title:0 "台湾海路"
 jxp_mission_eastasia_taiwan_lanes_desc:0 "台湾横在中国海岸、琉球与吕宋之间。船队若能识得这片海域，南北贸易便会从零散传闻变成国家道路。"
 jxp_mission_eastasia_littoral_entrepots_title:0 "华岸商埠"
 jxp_mission_eastasia_littoral_entrepots_desc:0 "中国沿海的商埠不是单纯的战利品。仓库、译署、关卡与港规将证明，日本可以在岸线而非宫阙上书写权威。"
 jxp_mission_eastasia_rite_sphere_title:0 "东亚礼仪圈"
 jxp_mission_eastasia_rite_sphere_desc:0 "海路、册封、互市与武威终须归于一套可被诸国理解的名分。日本若要长久立于东亚，必须让礼仪服务于国政。"
 jxp_mission_pacific_admiralty_title:0 "远洋军船署"
 jxp_mission_pacific_admiralty_desc:0 "敕许状若没有军船、海图与补给法支撑，不过是一张漂亮纸。远洋事业需要能反复出航、修船与归档的官署。"
 jxp_mission_pacific_north_charts_title:0 "北洋海图"
 jxp_mission_pacific_north_charts_desc:0 "关岛、夏威夷与北太平洋的风向被逐渐记录。海图一旦成册，漫长航程就从奇迹变成制度。"
 jxp_mission_pacific_silver_current_title:0 "太平洋银流"
 jxp_mission_pacific_silver_current_desc:0 "马尼拉白银、长崎商馆与新大陆港口终于被连成同一条财货脉络。潮水带回的不只是银，也有世界价格。"
 jxp_mission_pacific_new_world_towns_title:0 "新大陆日町"
 jxp_mission_pacific_new_world_towns_desc:0 "远方町屋、仓库、寺社与教堂虽小，却让日本国家计划越过大洋生根。海尽头也能听见故国钟声。"
 jxp_mission_pacific_oceanic_sun_title:0 "大洋日轮"
 jxp_mission_pacific_oceanic_sun_desc:0 "北方寒港、南方银流、军船署与敕许殖民共同成形。至此，太平洋不再是国境之外，而是日轮照临的道路。"
 jxp_decision_establish_tsushima_office_title:0 "设对马海峡奉行"
 jxp_decision_establish_tsushima_office_desc:0 "在对马海峡设置专门奉行，约束往来船只、译官、使节与边商。海峡秩序越清楚，日本对半岛局势的判断便越可靠。"
 jxp_decision_register_ryukyu_tribute_title:0 "登记琉球贡贸"
 jxp_decision_register_ryukyu_tribute_desc:0 "把琉球转运、贡船礼单与南海私商登记入册。旧有朝贡名义可以成为日本经营海路的书面语言。"
 jxp_decision_create_pacific_admiralty_title:0 "设远洋军船署"
 jxp_decision_create_pacific_admiralty_desc:0 "敕许殖民需要可反复执行的海军行政。造船、修船、护航与海图归档，都应由国家正式掌握。"
 jxp_decision_codify_east_asian_rite_sphere_title:0 "编定东亚礼仪圈"
 jxp_decision_codify_east_asian_rite_sphere_desc:0 "将册封、互市、使节、港规与武力威慑写入同一套礼仪秩序。日本不必照搬旧天朝，却必须让诸国看懂我们的名分。"
 jxp_decision_proclaim_oceanic_sun_state_title:0 "宣告远洋日轮国"
 jxp_decision_proclaim_oceanic_sun_state_desc:0 "当太平洋敕许、军船署、银流与殖民町屋连成一体，日本便可正式宣告远洋国家体制。海路由此成为国政的一部分。"
 jxp_eastasia.5.t:0 "对马海峡奉行"
 jxp_eastasia.5.d:0 "对马奉行呈上新的海峡簿册：朝鲜使船、商船、僧侣、漂民与密探都被写入不同栏格。有人嫌其繁琐，但正是这些栏格让海峡不再只属于风浪。"
 jxp_eastasia.5.a:0 "让海峡成为国家的耳目。"
 jxp_eastasia.5.b:0 "仍以水师巡防为先。"
 jxp_eastasia.6.t:0 "琉球转运册"
 jxp_eastasia.6.d:0 "来自琉球的船主熟悉南海，也熟悉在不同礼仪之间周旋。若将这些人纳入登记，日本便能借旧有转运网络接住更远的货物与消息。"
 jxp_eastasia.6.a:0 "册簿之中自有海路。"
 jxp_eastasia.6.b:0 "先稳住礼仪名分。"
 jxp_eastasia.7.t:0 "华岸商埠"
 jxp_eastasia.7.d:0 "沿海港口的仓库与商馆逐渐立起。它们不像城池那样显眼，却足以让日本在中国海岸拥有可持续的凭依。"
 jxp_eastasia.7.a:0 "把商埠写进霸权。"
 jxp_eastasia.7.b:0 "让商人先把货流打开。"
 jxp_eastasia.8.t:0 "东亚礼仪圈"
 jxp_eastasia.8.d:0 "使节、港口、商馆、军船与朝仪被重新编排。日本没有必要完全成为旧天朝的影子；我们可以让日轮秩序用诸国听得懂的语言说话。"
 jxp_eastasia.8.a:0 "礼仪亦是国政。"
 jxp_eastasia.8.b:0 "海路比名分更可靠。"
 jxp_colonial.5.t:0 "远洋军船署"
 jxp_colonial.5.d:0 "敕许状送出了第一批船，但真正支撑远洋事业的是船坞、护航、修理账册与懂得风向的老水手。军船署的成立让海权终于有了官署形体。"
 jxp_colonial.5.a:0 "海军必须能远航，也能再出航。"
 jxp_colonial.5.b:0 "先把现有水师练得可靠。"
 jxp_colonial.6.t:0 "北洋海图"
 jxp_colonial.6.d:0 "测风者把关岛、夏威夷与北太平洋的航路连成一册。每一条墨线背后都有风暴、淡水、病痛与返航者的证言。"
 jxp_colonial.6.a:0 "让海图成为制度。"
 jxp_colonial.6.b:0 "让船队记住这些风。"
 jxp_colonial.7.t:0 "太平洋银流"
 jxp_colonial.7.d:0 "马尼拉白银、长崎商馆与新大陆港口终于在账册中互相照见。银流不是一条河，而是一套由船期、汇兑与仓库组成的世界秩序。"
 jxp_colonial.7.a:0 "接住银流，也接住价格。"
 jxp_colonial.7.b:0 "先让国库听见银声。"
 jxp_colonial.8.t:0 "新大陆日町"
 jxp_colonial.8.d:0 "远方海岸出现了日本町屋、仓库、祭礼与混杂语言的市场。它们尚且脆弱，却已经不再只是临时营地。"
 jxp_colonial.8.a:0 "让町屋在海尽头生根。"
 jxp_colonial.8.b:0 "让远方居民记住日轮旗。"
 jxp_solar_court_recognition:0 "日轮朝仪"
 jxp_solar_court_recognition_desc:0 "日本以自己的朝仪回应中原天命。它不必完全依附旧秩序，却足以让诸国在外交书信中承认新的名分。"
 jxp_tsushima_channel_office:0 "对马海峡奉行"
 jxp_tsushima_channel_office_desc:0 "海峡船只、译官、使节与边商被纳入奉行账册。对马由此成为日本观察半岛的耳目。"
 jxp_ryukyu_tribute_port:0 "琉球贡贸港"
 jxp_ryukyu_tribute_port_desc:0 "琉球旧有的贡船与转运网络被日本制度化利用。南海消息与货物因而更稳定地流入国中。"
 jxp_taiwan_sea_lanes:0 "台湾海路"
 jxp_taiwan_sea_lanes_desc:0 "台湾周边航线被纳入海图与港规。日本得以更稳固地连接中国海岸、琉球与吕宋。"
 jxp_china_coast_entrepots:0 "华岸商埠"
 jxp_china_coast_entrepots_desc:0 "沿海仓库、译署与商馆成为日本在中国海岸的制度凭依。"
 jxp_east_asian_rite_sphere:0 "东亚礼仪圈"
 jxp_east_asian_rite_sphere_desc:0 "使节、互市、港规与武力被编入同一套日轮名分。日本以自己的语言重写东亚秩序。"
 jxp_oceanic_admiralty:0 "远洋军船署"
 jxp_oceanic_admiralty_desc:0 "护航、造船、修船与海图归档被纳入同一官署。远洋事业开始拥有可重复的行政骨架。"
 jxp_north_pacific_charts:0 "北洋海图"
 jxp_north_pacific_charts_desc:0 "关岛、夏威夷与北太平洋航线被逐步测定。风向和补给点被写成可传承的制度。"
 jxp_pacific_silver_flow:0 "太平洋银流"
 jxp_pacific_silver_flow_desc:0 "长崎、马尼拉与新大陆港口被银流和货账连接起来。日本开始在太平洋价格中发声。"
 jxp_new_world_japan_towns:0 "新大陆日町"
 jxp_new_world_japan_towns_desc:0 "远方町屋、仓库与祭礼让殖民据点不再只是临时营地。海尽头也生出日本的日常。"
