l_english:
 jxp_mission_daimyo_province_code_title:0 "立分国家法"
 jxp_mission_daimyo_province_code_desc:0 "起请文只能约束一时，成文家法方可约束数代。将喧哗、逃散、军役、德政与寺社争讼一一写定，使本领不再只听强者临席断语。"
 jxp_mission_daimyo_land_measure_title:0 "绳量田畠"
 jxp_mission_daimyo_land_measure_desc:0 "奉行携绳、竿与旧名寄下乡，逐块校定田畠。土豪藏入山谷的隐田、寺领沿用的旧例，都须在新账册中留下可以争辩的一行。"
 jxp_mission_daimyo_household_council_title:0 "定家中评定"
 jxp_mission_daimyo_household_council_desc:0 "谱代、外样、一门与奉行各有所执。若让军议只随主君喜怒而转，本家便经不起一次幼主或败军；评定众必须成为家政长久的骨架。"
 jxp_mission_daimyo_market_roads_title:0 "通关津市庭"
 jxp_mission_daimyo_market_roads_desc:0 "山道上的关钱、渡口的船役与市庭的座席彼此相连。清理重叠课役，使盐、纸、铁与米能走到城下，领国才真正拥有一条可供养军势的血脉。"
 jxp_mission_daimyo_artisan_guilds_title:0 "聚锻冶诸座"
 jxp_mission_daimyo_artisan_guilds_desc:0 "铸物师、锻冶、木匠与漆工散居诸乡，各守秘传。以安堵状换取定额奉公，使工匠不再随战火流散，城下也就有了打造甲胄与农具的双手。"
 jxp_mission_daimyo_licensed_caravans_title:0 "发诸道过所"
 jxp_mission_daimyo_licensed_caravans_desc:0 "商旅持本家朱印穿过关津，沿途不得被重复盘剥。陆路与浦方由此接成一体，远国的货物、消息和技艺也会循着同一张过所进入本领。"
 jxp_mission_daimyo_shrine_village_compact_title:0 "结社乡安堵"
 jxp_mission_daimyo_shrine_village_compact_desc:0 "村落以宫座、惣村与水利结成共同体，武家若只知征发，必将逼出逃散与一揆。承认乡中旧约，再把军役与年贡写进安堵，方能使人心留在田畠。"
 jxp_mission_daimyo_irrigation_works_title:0 "普请堤渠"
 jxp_mission_daimyo_irrigation_works_desc:0 "春水漫堤，秋旱裂田；一国强弱常藏在无人歌咏的沟渠里。召集惣村与土木巧者，疏河、筑堤、分水，使兵粮不再只仰赖丰年的侥幸。"
 jxp_mission_daimyo_town_magistrates_title:0 "置町奉行"
 jxp_mission_daimyo_town_magistrates_desc:0 "城下聚集浪人、商家、寺院与工房，旧有乡法已不足裁断争端。町奉行须让度量衡、夜禁、火防和债契皆有可循之例。"
 jxp_mission_daimyo_domain_school_title:0 "开本国学寮"
 jxp_mission_daimyo_domain_school_desc:0 "读写不应只属于僧坊与公家。令近习、奉行子弟和有才町人同习文书、算用与兵法，日后临案者便不必在旧账前束手。"
 jxp_mission_daimyo_famine_reserves_title:0 "封常平之仓"
 jxp_mission_daimyo_famine_reserves_desc:0 "军仓若只为出阵而设，饥年便会变成乱年。留存陈米、检点仓印，并规定赈粜次序，使主君的威信在青黄不接时仍能被百姓看见。"
 jxp_mission_daimyo_people_of_the_domain_title:0 "一国为家"
 jxp_mission_daimyo_people_of_the_domain_desc:0 "武士、百姓、工匠与商人各司其业，却同受一国风雨。所谓领国，不只是地图上的界线，而是道路、仓廪、裁许与共同记忆结成的日用秩序。"
 jxp_mission_daimyo_raise_the_banner_title:0 "扬本家旗印"
 jxp_mission_daimyo_raise_the_banner_desc:0 "阵钟一响，旗印必须让远近郎党都知归处。点检具足、兵粮与马匹，让本家的名号不只绣在绢上，也能立于战场风中。"
 jxp_mission_daimyo_break_neighbor_title:0 "试锋邻国"
 jxp_mission_daimyo_break_neighbor_desc:0 "乱世的疆界写在胜负之后。一次有节制的出阵，胜过十封无人敬畏的恫吓书；但取城之后仍须懂得如何让新附国人低头。"
 jxp_mission_daimyo_command_home_region_title:0 "号令一方"
 jxp_mission_daimyo_command_home_region_desc:0 "从一城之主到一方之雄，差别不在家臣夸赞，而在邻国是否愿意避让道路、奉还逃人，并在会盟席上等候我们的发言。"
 jxp_mission_daimyo_tenka_strategy_title:0 "问策于天下"
 jxp_mission_daimyo_tenka_strategy_desc:0 "京都在前，诸侯在侧。军锋、敕命与会盟都能开出通向天下的道路，却会塑造不同的新秩序。今夜的评定，不只是商议下一场合战。"

 jxp_mission_house_warrior_war_council_title:0 "决旗头军议"
 jxp_mission_house_warrior_war_council_desc:0 "按军役簿整齐征发，抑或给宿将更多临阵裁量？两者皆可制胜，唯不可让命令在阵前互相抵牾。"
 jxp_mission_house_warrior_firearm_drill_title:0 "编铁炮足轻"
 jxp_mission_house_warrior_firearm_drill_desc:0 "铁炮并非一声雷鸣便能胜敌。药量、火绳、轮射、雨具与弹丸补给都要写进操典，足轻方能把异国器械化作本家军法。"
 jxp_mission_house_warrior_commanders_oath_title:0 "盟诸将于旗前"
 jxp_mission_house_warrior_commanders_oath_desc:0 "功名使人奋勇，也使人相争。诸将于旗前重申军令与赏罚，让先锋不擅进、后阵不迟疑，胜果也不被家中争执吞没。"
 jxp_mission_house_court_rank_and_office_title:0 "奏请官途"
 jxp_mission_house_court_rank_and_office_desc:0 "任官与偏讳仍能给刀剑披上礼法。使者携礼入京，请得官途、口宣与旧职，让本家的扩张不只被称作下克上。"
 jxp_mission_house_court_mediator_network_title:0 "联诸寺公卿"
 jxp_mission_house_court_mediator_network_desc:0 "公卿、门迹与有力寺院虽少兵，却握有书札、婚姻和调停的网络。懂得借用这张旧网，便能以一纸和议省下一季兵粮。"
 jxp_mission_house_court_kinri_escort_title:0 "奉护禁里"
 jxp_mission_house_court_kinri_escort_desc:0 "乱军不应踏入宫门。为禁里修缮垣墙、供奉粮秣并护送敕使，使本家在刀兵最盛之时仍被视为朝仪的守护者。"
 jxp_mission_house_sea_harbor_council_title:0 "集浦方年寄"
 jxp_mission_house_sea_harbor_council_desc:0 "船主求利，水军求役，渔村求安。召浦方年寄共议课役与护航，海国的军政才不会在每次风汛前重新争吵。"
 jxp_mission_house_sea_atakebune_title:0 "造安宅船阵"
 jxp_mission_house_sea_atakebune_desc:0 "厚舷高橹的安宅船既是浮城，也是昂贵的木料与绳索。统一船式、配属铁炮众，使水军不再只是临时拼凑的浦舟。"
 jxp_mission_house_sea_tide_brokers_title:0 "用潮路取次"
 jxp_mission_house_sea_tide_brokers_desc:0 "潮汐、暗礁与季风写不进京都官历，却被船头与通事牢记。让这些人进入奉行体系，海路便从秘闻变成可调度的国力。"
 jxp_mission_house_frontier_border_council_title:0 "议境目守备"
 jxp_mission_house_frontier_border_council_desc:0 "边境既是盾，也是市。关所武士、马借、山民与商贩必须在同一场评定中找到位置，否则烽火与走私会沿同一条山路而来。"
 jxp_mission_house_frontier_guides_title:0 "编乡导马廻"
 jxp_mission_house_frontier_guides_desc:0 "雪路、峠口和深山捷径只听熟路者讲述。将乡导与骑马武者编入常备名簿，远征便不再被一场雾雪截断。"
 jxp_mission_house_frontier_hostage_oaths_title:0 "纳境目人质"
 jxp_mission_house_frontier_hostage_oaths_desc:0 "边将的忠诚不能只靠昨日誓言。婚姻、人质、替地与定期参府交织起来，才能把易主如风的境目众变成本家的屏障。"
 jxp_mission_house_temple_market_council_title:0 "议寺社与町"
 jxp_mission_house_temple_market_council_desc:0 "香火、座商与仓贷同在门前町流转。寺社特权若不受约束会掏空家政，若尽数摧毁又会使市场失去信用，评定必须找到可久之法。"
 jxp_mission_house_temple_free_markets_title:0 "开门前乐市"
 jxp_mission_house_temple_free_markets_desc:0 "撤去层层座役，给新来商人与工匠一块立足之地。晨钟未歇，市声已起，门前町由此成为兵火之间仍愿聚人的所在。"
 jxp_mission_house_temple_debt_relief_title:0 "裁德政之诉"
 jxp_mission_house_temple_debt_relief_desc:0 "一纸德政可以救急，也能摧毁数十年信用。由奉行逐案裁许，赈恤真正困乏者，同时让仓贷与商契不至一夜成灰。"

 jxp_mission_uncommitted_reckon_warrior_houses_title:0 "校诸家名籍"
 jxp_mission_uncommitted_reckon_warrior_houses_desc:0 "天下虽归一统，旧大名的石高、家格与军役尚未归于同一尺度。先弄清谁应列座、谁应出兵，方能谈论新国制。"
 jxp_mission_uncommitted_balance_court_and_camp_title:0 "酌公武之分"
 jxp_mission_uncommitted_balance_court_and_camp_desc:0 "武家握兵，禁里握名。新日本若让一方吞没另一方，统一便只会换来下一场争夺；朝仪与军政必须各得其所。"
 jxp_mission_uncommitted_summon_realm_council_title:0 "召天下评定"
 jxp_mission_uncommitted_summon_realm_council_desc:0 "诸道奉行、旧家宿老、公卿、僧侣与港市代表齐聚一堂。天下要闭门、通海、奉教或崇礼，须在此刻给出能够传之后世的答案。"
 jxp_mission_uncommitted_watch_the_four_seas_title:0 "望四海风色"
 jxp_mission_uncommitted_watch_the_four_seas_desc:0 "北海有虾夷舟，西海有朝鲜通信船，南风又带来南蛮帆影。统一后的第一件海事，不是远征，而是学会辨认来者。"
 jxp_mission_uncommitted_register_border_ports_title:0 "录边港诸例"
 jxp_mission_uncommitted_register_border_ports_desc:0 "松前、对马、萨摩与九州诸港各守旧例。将交易、漂流民、贡使和违禁货物分门立册，海疆政策才有可以落笔的依据。"
 jxp_mission_uncommitted_choose_the_horizon_title:0 "定海门之议"
 jxp_mission_uncommitted_choose_the_horizon_desc:0 "海门全开则风浪俱入，尽闭则消息断绝。何处设窗、何人通译、何货可行，必须成为国家制度，而非港吏一时宽严。"

 jxp_mission_sakoku_coastal_magistrates_title:0 "置沿海奉行"
 jxp_mission_sakoku_coastal_magistrates_desc:0 "禁令若只停在江户案头，海边仍会按旧习行事。令沿海奉行巡察浦港、造船与漂着者，使闭关成为可执行的法度。"
 jxp_mission_sakoku_matsumae_compact_title:0 "定松前口岸"
 jxp_mission_sakoku_matsumae_compact_desc:0 "北方的鲑、昆布、鹰羽与异域消息皆经松前而来。承认边地交易的必要，同时把商路束在一处受控的关口。"
 jxp_mission_sakoku_tsushima_interpreters_title:0 "留对马取次"
 jxp_mission_sakoku_tsushima_interpreters_desc:0 "闭国不等于失语。宗氏旧有的倭馆、通词与通信使经验，可让日本在不广开海门的前提下仍与朝鲜半岛往还。"
 jxp_mission_sakoku_ryukyu_protocol_title:0 "定琉球来聘"
 jxp_mission_sakoku_ryukyu_protocol_desc:0 "琉球船带来南海货物，也带来数国消息。以礼仪规定其入港、献物与回赐，使南方通道既不失体面，也不越禁令。"
 jxp_mission_sakoku_beacon_coast_title:0 "列海岸远见番"
 jxp_mission_sakoku_beacon_coast_desc:0 "烽台、浦番与快船沿海相接，异国船影一现便可逐站传报。海禁不应是畏惧大海，而应是国家能够看清大海。"
 jxp_mission_sakoku_one_permitted_window_title:0 "守一线兰窗"
 jxp_mission_sakoku_one_permitted_window_desc:0 "医书、历法、测绘与炮术不必随传教一并拒绝。严审译书、限制往来，在紧闭的门扉上保留一线足以观世的窗。"
 jxp_mission_sakoku_four_seas_under_watch_title:0 "四海皆在目"
 jxp_mission_sakoku_four_seas_under_watch_desc:0 "古歌云：八隅知之。今日诸海有番所、有通词、有定例，外船虽不得擅入，天下却不再因闭门而无知。"

 jxp_mission_ikko_temple_granaries_title:0 "开门徒义仓"
 jxp_mission_ikko_temple_granaries_desc:0 "寺内町的仓廪既供养法会，也应救济饥民。由门徒共同检点出纳，使信心在荒年化为真正可分的一碗米。"
 jxp_mission_ikko_remit_war_debts_title:0 "裁兵乱宿债"
 jxp_mission_ikko_remit_war_debts_desc:0 "连年军役使乡村负债累积，粗暴德政又会断绝来年借贷。门徒评议逐案减免，将战乱留下的枷锁从新国家中卸下。"
 jxp_mission_ikko_pilgrim_post_roads_title:0 "连参诣宿驿"
 jxp_mission_ikko_pilgrim_post_roads_desc:0 "念佛同行沿道路相认，宿坊、渡口与门前町接成网络。消息、赈粮和军役都能循参诣之路抵达远方。"
 jxp_mission_ikko_commoner_schools_title:0 "设讲坊手习"
 jxp_mission_ikko_commoner_schools_desc:0 "假名经文使教义走出僧坊，算用与书札也应如此。让町人和百姓子弟在讲坊手习，新秩序便有自己的书记与奉行。"
 jxp_mission_ikko_guild_councils_title:0 "合诸座公议"
 jxp_mission_ikko_guild_councils_desc:0 "工匠、商人、船主与乡中代表共议税役，既不容旧座垄断，也不让武家一纸征发毁掉市信。"
 jxp_mission_ikko_communal_shipyards_title:0 "众力造渡海船"
 jxp_mission_ikko_communal_shipyards_desc:0 "木料来自山村，帆布来自町坊，水主来自浦方。共同船厂把分散的门徒财力汇成能够护航与渡海的舰队。"
 jxp_mission_ikko_realm_of_fellowship_title:0 "同朋之国"
 jxp_mission_ikko_realm_of_fellowship_desc:0 "蓬生麻中，不扶自直。武家旧序之外，一个由门徒、町众与乡村公议维系的国家已经站稳，并仍以护持禁里为天下名分。"

 jxp_daimyo.5.t:0 "通向天下的三策"
 jxp_daimyo.5.d:0 "夜雨落在军议所檐上，京都绘图铺满席前。宿老主张以军锋夺取畿内，奉行建议先请朝廷降旨，另有使者称诸侯会盟可少流血而定大势。三条道路都指向天下，却会留下不同的国法与记忆。"
 jxp_daimyo.5.a:0 "以军锋上洛。"
 jxp_daimyo.5.b:0 "奉敕而讨不庭。"
 jxp_daimyo.5.c:0 "会盟诸侯，共戴天下。"

 jxp_24_daimyo_province_code:0 "分国家法"
 jxp_24_daimyo_province_code_desc:0 "军役、争讼与贡纳已有成文尺度。"
 jxp_24_daimyo_land_measure:0 "绳量名寄"
 jxp_24_daimyo_land_measure_desc:0 "田畠、隐田与旧领被写入同一套账册。"
 jxp_24_daimyo_household_council:0 "家中评定众"
 jxp_24_daimyo_household_council_desc:0 "宿老与奉行以固定议程承办家政。"
 jxp_24_daimyo_market_roads:0 "关津通路"
 jxp_24_daimyo_market_roads_desc:0 "市庭、渡口与山道的重复课役得到清理。"
 jxp_24_daimyo_artisan_guilds:0 "城下诸座"
 jxp_24_daimyo_artisan_guilds_desc:0 "工匠以安堵与奉公留在城下。"
 jxp_24_daimyo_licensed_caravans:0 "诸道过所"
 jxp_24_daimyo_licensed_caravans_desc:0 "持朱印商旅得以安全穿过本家关津。"
 jxp_24_daimyo_shrine_village_compact:0 "社乡安堵"
 jxp_24_daimyo_shrine_village_compact_desc:0 "乡中旧约与家中课役达成可久的妥协。"
 jxp_24_daimyo_irrigation_works:0 "堤渠普请"
 jxp_24_daimyo_irrigation_works_desc:0 "水利工程使田畠较少受旱涝摆布。"
 jxp_24_daimyo_town_magistrates:0 "町奉行所"
 jxp_24_daimyo_town_magistrates_desc:0 "城下争讼、火防与度量衡皆有专官。"
 jxp_24_daimyo_domain_school:0 "本国学寮"
 jxp_24_daimyo_domain_school_desc:0 "文书、算用与兵法成为家臣的常课。"
 jxp_24_daimyo_famine_reserves:0 "常平备米"
 jxp_24_daimyo_famine_reserves_desc:0 "赈粜次序与仓印制度减轻荒年动荡。"
 jxp_24_daimyo_people_of_the_domain:0 "一国一体"
 jxp_24_daimyo_people_of_the_domain_desc:0 "武士与四民被纳入共同的领国秩序。"
 jxp_24_daimyo_raised_banner:0 "本家旗印"
 jxp_24_daimyo_raised_banner_desc:0 "军役与兵粮在旗印下迅速聚合。"
 jxp_24_daimyo_regional_command:0 "一方号令"
 jxp_24_daimyo_regional_command_desc:0 "邻国已把本家视作不可忽略的区域强权。"
 jxp_24_daimyo_road_to_kyoto:0 "上洛声势"
 jxp_24_daimyo_road_to_kyoto_desc:0 "军锋与名分共同为进取畿内铺路。"
 jxp_24_unification_blade:0 "军锋上洛"
 jxp_24_unification_blade_desc:0 "以迅疾战功摧破诸侯抵抗，直取天下中心。"
 jxp_24_unification_edict:0 "奉敕征讨"
 jxp_24_unification_edict_desc:0 "朝廷名分使本家的征服带有讨不庭之义。"
 jxp_24_unification_league:0 "诸侯会盟"
 jxp_24_unification_league_desc:0 "以盟誓、调停与推戴把诸家纳入新秩序。"
 jxp_24_foundation_blade:0 "军锋开国之记"
 jxp_24_foundation_blade_desc:0 "新日本记得自己由迅疾征讨与阵前决断奠基。"
 jxp_24_foundation_edict:0 "奉敕开国之记"
