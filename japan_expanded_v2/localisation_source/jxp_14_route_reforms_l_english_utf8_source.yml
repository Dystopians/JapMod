l_english:
 jxp_reform_sakoku_buke_laws:0 "武家诸法度"
 jxp_reform_sakoku_buke_laws_desc:0 "诸大名入觐有期，城郭修筑有禁，婚姻盟誓皆归公仪裁断。刀剑虽仍挂在腰间，天下之柄已握于法度之中。"
 jxp_reform_sakoku_terauke_registers:0 "寺请宗门改"
 jxp_reform_sakoku_terauke_registers_desc:0 "寺社登记户口，村役核验宗门，百姓生死婚嫁皆有册籍可稽。神佛之门从此亦成为公仪之眼。"
 jxp_reform_sakoku_dejima_inspectors:0 "出岛目付"
 jxp_reform_sakoku_dejima_inspectors_desc:0 "海外之风不必尽拒，然船舶、译词、铜钱与书札皆须经目付之手。海门半启，国法常在。"
 jxp_reform_open_red_seal_council:0 "朱印船评定众"
 jxp_reform_open_red_seal_council_desc:0 "朱印之书赐予可信商船，诸港奉行与豪商共议航路。万里波涛自此不只是险境，亦是国用之源。"
 jxp_reform_open_rangaku_bureaucracy:0 "兰学奉行所"
 jxp_reform_open_rangaku_bureaucracy_desc:0 "译官、医师、历算家与炮术师入于官署，异邦书卷由市井奇谈化为治国之术。"
 jxp_reform_open_chartered_harbors:0 "开港会所"
 jxp_reform_open_chartered_harbors_desc:0 "堺、长崎、博多诸港各设会所，量入为出，检船定税。商帆往来之间，新日本的海疆逐渐成形。"
 jxp_reform_kirishitan_church_court:0 "十字朝仪"
 jxp_reform_kirishitan_church_court_desc:0 "朝廷礼仪与教会典章并行不悖，诸侯在日轮与十字之下宣誓效忠。远方圣座的钟声，也在京都回响。"
 jxp_reform_kirishitan_port_congregations:0 "港町信众会"
 jxp_reform_kirishitan_port_congregations_desc:0 "信众在港町结成会众，照看商旅、孤儿与伤病水手。信仰沿着海路扎根，也沿着海路传播。"
 jxp_reform_kirishitan_cross_sun_guard:0 "日轮十字卫队"
 jxp_reform_kirishitan_cross_sun_guard_desc:0 "诸藩精锐被编入新式卫队，铁炮、长枪与祈祷同在一营。其旗帜所至，既是王命，亦是信约。"
 jxp_reform_confucian_shushi_academies:0 "朱子学寮"
 jxp_reform_confucian_shushi_academies_desc:0 "以《四书》定学统，以礼义训士人。山林书院与城下学寮相连，使武家之治渐有经筵之声。"
 jxp_reform_confucian_ritual_census:0 "礼籍户令"
 jxp_reform_confucian_ritual_census_desc:0 "户口、田亩、祭礼与职役并入一册。民知所从，官知所征，国知所养，礼制由庙堂落入村落。"
 jxp_reform_confucian_kami_rites:0 "神儒合祀令"
 jxp_reform_confucian_kami_rites_desc:0 "神宫之祭仍守旧仪，诸社则以礼学重释其名分。敬神不废，尊礼益明，日本之道遂有新的秩序。"
 jxp_reform_imperial_daijokan:0 "太政官再兴"
 jxp_reform_imperial_daijokan_desc:0 "古官名号重见朝堂，诏书、位阶与国政文移复归一体。所谓王政，并非怀古，而是以旧名铸新制。"
 jxp_reform_imperial_kinri_guard:0 "禁里亲卫"
 jxp_reform_imperial_kinri_guard_desc:0 "护卫禁阙的武士不再只是仪仗，他们受朝廷俸禄，持王命出征。御所之门后，已有甲胄之声。"
 jxp_reform_imperial_court_rites:0 "朝仪使节制"
 jxp_reform_imperial_court_rites_desc:0 "遣使、册命、馈礼皆依朝仪而行。外邦所见不只是武威，更是万世一系之国体。"
 jxp_reform_reformed_consistory_ports:0 "长老港务会"
 jxp_reform_reformed_consistory_ports_desc:0 "港町长老与奉行合署议事，账簿公开，契约严明。贸易因信约而稳固，信约又因贸易而远行。"
 jxp_reform_reformed_oranda_schools:0 "和兰书院"
 jxp_reform_reformed_oranda_schools_desc:0 "新教传道人、荷兰译官与日本学者共同校书。经义、航海、火器与医术在书院中交织成新的学问。"
 jxp_reform_reformed_elder_militias:0 "长老民兵约"
 jxp_reform_reformed_elder_militias_desc:0 "城镇会众自备火器，听命于长老与国法。平日守市，战时成军，信徒的纪律化为战列的坚忍。"
 jxp_reform_kaikyo_qadi_harbormasters:0 "卡迪港奉行"
 jxp_reform_kaikyo_qadi_harbormasters_desc:0 "海上商约由港奉行与卡迪共同裁断，习俗虽异而法度可通。日本诸港遂能容纳更辽阔的印度洋秩序。"
 jxp_reform_kaikyo_hajj_sea_lanes:0 "朝觐海路护持"
 jxp_reform_kaikyo_hajj_sea_lanes_desc:0 "护送朝觐与商旅的船队往返南海，星盘、季风与祈祷同为航路所依。"
 jxp_reform_kaikyo_halal_granaries:0 "清真仓廪"
 jxp_reform_kaikyo_halal_granaries_desc:0 "粮仓、屠宰、军需与港市供给依新礼整顿。军民各得其食，远客亦知此地有法可循。"
 jxp_reform_ikko_monto_covenant:0 "门徒惣约"
 jxp_reform_ikko_monto_covenant_desc:0 "村落、寺内町与讲众共同立约，僧俗相守，贵贱同盟。国法不再只从城郭下达，也从讲席与钟楼传出。"
 jxp_reform_ikko_terauchi_markets:0 "寺内町座法"
 jxp_reform_ikko_terauchi_markets_desc:0 "寺内町免于旧役，商座受约束而得庇护。市声与念佛同起，一向之国自民间聚财聚力。"
 jxp_reform_ikko_village_militias:0 "乡中持枪众"
 jxp_reform_ikko_village_militias_desc:0 "乡民按讲分番，农闲操练，战时持枪守土。其力不在武名，而在人人皆知为何而战。"
 jxp_reform_wokou_letters_of_mark:0 "朱札私掠令"
 jxp_reform_wokou_letters_of_mark_desc:0 "浪人、海商与水军在朱札之下出海，劫掠不再只是私斗，而成为国策阴影中的利刃。"
 jxp_reform_wokou_setouchi_pilotage:0 "濑户内水先众"
 jxp_reform_wokou_setouchi_pilotage_desc:0 "潮汐、暗礁、岛影与港火皆有水先众掌记。熟海者胜，熟风者生。"
 jxp_reform_wokou_free_harbor_codes:0 "自由港掟书"
 jxp_reform_wokou_free_harbor_codes_desc:0 "诸港以掟书约束泊船、仓储、分赃与仲裁。法度未必来自朝堂，有时也刻在码头的木牌上。"
