l_english:
 jxp_b_100_decision_choose_rites_sphere_title:0 "议定海上礼仪圈"
 jxp_b_100_decision_choose_rites_sphere_desc:0 "日本既可问鼎中原，也可另立海上名分。若以琉球、朝鲜、台湾诸港及往来使节为经纬，册书、互市与护航便能结成一套不以占据宫阙为前提的东亚秩序。"
 jxp_b_100_decision_complete_mandate_endgame_title:0 "奉受东亚天命"
 jxp_b_100_decision_complete_mandate_endgame_desc:0 "取得天命只是开端。朝廷必须支付整顿礼制、安抚贡国与维持远方驿路的代价，方能使日本的名分不止停留在一纸诏书之上。没有「天命」内容时，此举只建立受诸国承认的日轮朝仪，不会伪称日本已成为天朝皇帝。"
 jxp_b_100_decision_complete_rites_endgame_title:0 "定海国交之仪"
 jxp_b_100_decision_complete_rites_endgame_desc:0 "将港规、互市、使节席次与共同护航写入成例，使近海诸国即使不奉同一位天子，也能在日轮所主持的礼仪中各守其位。维持这一网络需要常年的船费、译官与沿岸官署。"
 jxp_b_100_decision_complete_break_endgame_title:0 "宣告海邦不奉旧命"
 jxp_b_100_decision_complete_break_endgame_desc:0 "日本将公开否认一国独占天下名分，以舰队、商贸联盟和对沿海小国的保护建立另一套秩序。此举会招致长期外交敌意，并把庞大的海军与港务开支留给后世。"

 jxp_b_china_endgames.10.t:0 "日轮承命"
 jxp_b_china_endgames.10.d:0 "受命之礼在京都与中原使节之间往返数度，贡道、驿传与裁判章程终于编成。诸臣提醒我们：天命并非一次胜仗的奖品，而是日日偿付的政治责任。"
 jxp_b_china_endgames.10.a:0 "奉其名，亦任其重。"
 jxp_b_china_endgames.11.t:0 "海上诸礼成典"
 jxp_b_china_endgames.11.d:0 "来自琉球、朝鲜、台湾与华岸诸港的文书被收入同一套簿册。商人不必先承认同一位天下之主，便可凭共同的港规、护航与使节礼仪往来。"
 jxp_b_china_endgames.11.a:0 "使潮路成为诸国共守之仪。"
 jxp_b_china_endgames.12.t:0 "海邦之外另有天下"
 jxp_b_china_endgames.12.d:0 "诏书否定了中原王朝垄断天下名分的主张，也把日本推到维护新秩序的最前列。每一个受保护的小国、每一处开放的港口，都将要求我们的舰队兑现今日之言。"
 jxp_b_china_endgames.12.a:0 "不居宫阙，自守海天。"

 jxp_b_100_china_path_mandate:0 "已择定问鼎天命之策"
 jxp_b_100_china_path_rites:0 "已择定海上礼仪圈之策"
 jxp_b_100_china_path_break:0 "已择定破除旧命之策"
 jxp_b_100_b99_direct_campaign_authorized:0 "大陆远征已转入破除天命战纲"
 jxp_b_100_china_endgame_mandate_complete:0 "东亚天命之制已经确立"
 jxp_b_100_china_endgame_rites_complete:0 "海上礼仪圈已经确立"
 jxp_b_100_china_endgame_break_complete:0 "海邦新秩序已经确立"
 jxp_b_100_mandate_endgame_fallback:0 "日轮朝仪获得诸国承认"

 jxp_b_100_mandate_proclamation:0 "问鼎之议"
 jxp_b_100_mandate_proclamation_desc:0 "朝廷已向诸国提出承继东亚名分的主张；使节往来因此更受重视，国内对礼制与正统的争论也更为尖锐。"
 jxp_b_100_rites_commitment:0 "海上礼仪议定"
 jxp_b_100_rites_commitment_desc:0 "译官、港吏与商人正在为一套跨国礼仪奔走，新的外交声望必须由持续的航运经费来支撑。"
 jxp_b_100_break_commitment:0 "破旧命之议"
 jxp_b_100_break_commitment_desc:0 "海权派主张以舰队和港口打破旧有天下观；此说振奋水师，也使周边王朝对日本愈发戒惧。"
 jxp_b_100_mandate_endgame:0 "日轮天朝的重担"
 jxp_b_100_mandate_endgame_desc:0 "贡道、裁判与远方驿路使日本得享天朝名分，也持续占用本可用于本土治理的官员与财赋。"
 jxp_b_100_mandate_fallback_endgame:0 "日轮朝仪之圈"
 jxp_b_100_mandate_fallback_endgame_desc:0 "在没有天朝制度可循的局面下，日本以外交承认维系自身朝仪；它提供声望，却不授予天命或天朝皇帝身份。"
 jxp_b_100_rites_endgame:0 "海上礼仪圈"
 jxp_b_100_rites_endgame_desc:0 "共同港规与使节礼仪扩展了日本的贸易和外交影响，也要求国家常年承担护航、译馆和远方官署的开支。"
 jxp_b_100_break_endgame:0 "海邦新秩序"
 jxp_b_100_break_endgame_desc:0 "日本以海军与商贸同盟保护沿海小国，换得可观海权；对旧秩序的公开否定则长期损害和解，并加重国家财政。"
 jxp_b_100_hakko_unintegrated_littoral:0 "远域未附"
 jxp_b_100_hakko_unintegrated_littoral_desc:0 "八纮一宇的诏旨无法替代地方认同。东亚异俗之地尚未获承认与安堵，驻军、转运和地方抵抗正在消耗国力。"

 cb_jxp_b_100_claim_mandate:0 "奉表问鼎"
 cb_jxp_b_100_claim_mandate_desc:0 "向现任天朝皇帝提出名分之争。此战争借口只能通过正式和约取得天命或要求释放、归还旧地，不能借机索取大片领土。"
 jxp_b_100_take_mandate_wargoal:0 "入都受命"
 jxp_b_100_take_mandate_wargoal_desc:0 "战争目标是攻取天朝都城。胜利方可以依正式和约取得天命，但不能凭此战争借口要求领土。"
 JXP_B_100_MANDATE_COUNTRY_DESC:0 "现任天朝皇帝"
 JXP_B_100_MANDATE_WAR_NAME:0 "$ORDER$$FIRST$-$SECOND$问鼎天命之战"

 cb_jxp_b_100_rites_sphere:0 "申明海上礼仪"
 cb_jxp_b_100_rites_sphere_desc:0 "迫使拒绝共同港规的沿海国家开放贸易、归还旧地或承认有限商埠。只有已有普通宣称的东亚港口能获得有限侵略扩张优惠，大规模吞并仍按通常代价计算。"
 jxp_b_100_rites_sphere_wargoal:0 "封锁违约诸港"
 jxp_b_100_rites_sphere_wargoal_desc:0 "战争目标是封锁敌国港口。贸易、释放国家和归还核心是主要和约；领土要求只对少数已有普通宣称的港口获得有限优惠，战争分数费用不降低。"
 JXP_B_100_RITES_COUNTRY_DESC:0 "拒绝海上章程的东亚沿海国家"
 JXP_B_100_LIMITED_PORT_DESC:0 "已有普通宣称的东亚港口"
 JXP_B_100_RITES_WAR_NAME:0 "$ORDER$$FIRST$-$SECOND$海上礼仪之战"

 cb_jxp_b_100_break_mandate:0 "破除天命海禁"
 cb_jxp_b_100_break_mandate_desc:0 "以海军优势迫使天朝或沿海强权释放受压制的国家、归还旧地并开放贸易。该战争借口不能夺取天命，也不提供广域低代价征服。"
 jxp_b_100_break_mandate_wargoal:0 "击破天朝海权"
 jxp_b_100_break_mandate_wargoal_desc:0 "战争目标是在海战中取得优势。释放国家、归还核心与贸易和约优先；只有少数已有普通宣称的港口享有有限侵略扩张优惠，战争分数费用保持通常水平。"
 JXP_B_100_BREAK_COUNTRY_DESC:0 "天朝与中国沿海强权"
 JXP_B_100_BREAK_WAR_NAME:0 "$ORDER$$FIRST$-$SECOND$破除旧命之战"
