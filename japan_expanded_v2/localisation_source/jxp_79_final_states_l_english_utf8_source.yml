l_english:
 jxp_uncommitted_realm_council_reform:0 "天下评议会体制"
 jxp_uncommitted_realm_council_reform_desc:0 "统一后的日本尚未把国策锁定于任何一条道路。朝廷、武家与诸藩代表共同议定法度，使未来的转向仍服从一套可问责的天下程序。"
 jxp_sakoku_bakuhan_council_reform:0 "幕藩国议体制"
 jxp_sakoku_bakuhan_council_reform_desc:0 "将军的海禁、诸藩的行政与朝廷的名分被写入同一部国议法。沿海戒备与参勤秩序由此不再依赖临时命令。"
 jxp_open_maritime_cabinet_reform:0 "海洋政务院体制"
 jxp_open_maritime_cabinet_reform_desc:0 "红印船主、译官、港奉行与谱代重臣组成常设政务院，以条约、航路和技术引进共同塑造开放日本的国家政策。"
 jxp_kirishitan_estates_general_reform:0 "吉利支丹三级会议"
 jxp_kirishitan_estates_general_reform_desc:0 "教会、武家与港市共同参加三级会议，在信仰章程之下分担税役、军务与海外交涉，约束王权也保护新共同体。"
 jxp_confucian_censorate_reform:0 "经世监察院体制"
 jxp_confucian_censorate_reform_desc:0 "儒臣、神官与地方官员由监察院考核，经典礼制与日本社法在同一套奏议制度中相互校正。"
 jxp_imperial_daijokan_reform:0 "太政官复兴体制"
 jxp_imperial_daijokan_reform_desc:0 "复兴的太政官把宫廷位阶、国司巡察与近代财政结合起来，使王政复古成为可运转的中央国家，而非一纸宣言。"

 jxp_mission_uncommitted_codify_realm_council_title:0 "编定天下评议法"
 jxp_mission_uncommitted_codify_realm_council_desc:0 "把诸家奏议、朝廷裁可与幕府行政写成一部公开程序，确保尚未定向的国家也有稳定的政治中枢。"
 jxp_mission_sakoku_bakuhan_constitution_title:0 "制定幕藩国宪"
 jxp_mission_sakoku_bakuhan_constitution_desc:0 "以海防责任、参勤次序和地方赋役为骨架，为封闭之国建立一部能够传承的幕藩宪章。"
 jxp_mission_open_maritime_cabinet_title:0 "召开海洋政务院"
 jxp_mission_open_maritime_cabinet_desc:0 "让港奉行、译官与商社代表进入常设内阁，使开放国策不再只是逐利港口的松散联盟。"
 jxp_mission_kjp_estates_concordat_title:0 "缔结三级会议协约"
 jxp_mission_kjp_estates_concordat_desc:0 "调和教会法、武家军役与市民特许权，为海洋教会国家确立一份能约束各等级的共同协约。"
 jxp_mission_cjp_censorate_charter_title:0 "颁行监察院章程"
 jxp_mission_cjp_censorate_charter_desc:0 "以经世实学考核官员，并为儒释神三教的公共职责划出清晰界线。"
 jxp_mission_ejp_daijokan_charter_title:0 "颁布太政官章程"
 jxp_mission_ejp_daijokan_charter_desc:0 "把恢复的宫廷官制转化为预算、巡察和任官程序，使帝国宪制真正深入各国。"
 jxp_mission_rfj_synodic_constitution_title:0 "确立总会宪章"
 jxp_mission_rfj_synodic_constitution_desc:0 "由长老会议、港市与诸藩共同批准国家宪章，让信仰纪律、商业自由与公共军役彼此制衡。"
 jxp_mission_sjp_diwan_constitution_title:0 "制定迪万国宪"
 jxp_mission_sjp_diwan_constitution_desc:0 "将卡迪法庭、港务迪万与日本旧制汇入成文国宪，为南海苏丹国确立持久的治理秩序。"
 jxp_mission_ijp_somon_constitution_title:0 "编定惣门国宪"
 jxp_mission_ijp_somon_constitution_desc:0 "让寺内町、门徒村社与共同军役各得其位，把信众盟约转化为可以治理天下的公共宪法。"
 jxp_mission_wak_admiralty_articles_title:0 "签署海军府约法"
 jxp_mission_wak_admiralty_articles_desc:0 "为岛主、船团与港市订立共同约法，使黑潮上的武力、贸易与司法都服从联邦海军府。"

