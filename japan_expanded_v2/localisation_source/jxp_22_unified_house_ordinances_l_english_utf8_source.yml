l_english:
 jxp_decision_codify_warrior_house_law_title:0 "编成武门天下法"
 jxp_decision_codify_warrior_house_law_desc:0 "统一后的国法不能只承袭京洛旧文，也须容纳起自战阵的家中法度。旗本、谱代、骑马众与城下诸役若能合入天下之制，武名便会化为国家的骨骼。"
 jxp_decision_restore_court_office_order_title:0 "重定京洛职名"
 jxp_decision_restore_court_office_order_desc:0 "旧幕府的职名、禁里文书与诸家席次虽曾蒙尘，却仍能为新政权提供可被诸国理解的名分。礼法若重新有序，兵威便不必时时拔刀证明自己。"
 jxp_decision_charter_maritime_house_routes_title:0 "颁给海门朱印"
 jxp_decision_charter_maritime_house_routes_desc:0 "濑户内、对马、丰后、萨摩与诸海道的商船曾在战国乱流中自寻航路。如今朝贡、互市、通事与船主皆应纳入朱印法度，使海门成为国家之眼。"
 jxp_decision_settle_frontier_house_wards_title:0 "安堵北境关门"
 jxp_decision_settle_frontier_house_wards_desc:0 "奥羽山路、虾夷互市、关东旧门与南九州边郡皆曾以各自誓约维系秩序。新日本若要越过旧畿内视野，就必须把边地经验写入天下经营。"
 jxp_decision_register_temple_market_law_title:0 "公布社寺市座法"
 jxp_decision_register_temple_market_law_desc:0 "社领、寺内町、座商、仓屋与门前市不只是旧时代的残余，它们也是连通礼法、财货与地方自治的细密经络。将其登记成法，天下方能在市声中安定。"
 jxp_22_warrior_house_codes:0 "武门天下法"
 jxp_22_warrior_house_codes_desc:0 "统一者将出身武家的军役名簿、旗帐席次与战阵赏罚纳入国家制度。"
 jxp_22_court_office_order:0 "京洛职名秩序"
 jxp_22_court_office_order_desc:0 "新政权重新解释公方、管领、守护与禁里文书，使旧名分服务于统一后的秩序。"
 jxp_22_maritime_house_routes:0 "海门朱印航路"
 jxp_22_maritime_house_routes_desc:0 "海国出身的统一者把船主、通事、港町年寄与外海商路登记为国家可用的航道。"
 jxp_22_frontier_house_wards:0 "北境关门安堵"
 jxp_22_frontier_house_wards_desc:0 "边地关门、马市、互市与境目诸众被纳入天下法度，远境不再只是朝廷文书中的空名。"
 jxp_22_temple_market_law:0 "社寺市座法"
 jxp_22_temple_market_law_desc:0 "社寺旧领、寺内町、市座与仓屋账册被整理为公法，使信仰、市声与家政得以相互安置。"
