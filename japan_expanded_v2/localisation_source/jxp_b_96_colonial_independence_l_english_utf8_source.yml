l_english:
 cb_jxp_b_colonial_independence:0 "殖民自治战争"
 cb_jxp_b_colonial_independence_desc:0 "海外议会在请愿、抵制与本土强制之间走到决裂边缘。这场战争以殖民地首府的存续为目标，胜利方可选择完整独立、自治约章或贸易自主，而不是借机吞并无关领土。"
 jxp_b_colonial_independence_wargoal:0 "保卫殖民首府"
 jxp_b_colonial_independence_wargoal_desc:0 "阻止宗主占领殖民首府，并维持足够长的自治战争。"
 JXP_B_COLONIAL_INDEPENDENCE_WAR_NAME:0 "$ORDER$$FIRST$殖民自治战争"
 po_jxp_b_colonial_compact:0 "承认自治殖民约章"
 po_jxp_b_colonial_compact_desc:0 "殖民地仍维持宗主关系，但拥有地方议会、任命与税役自治；宗主关税和直接控制显著下降。"
 po_jxp_b_trade_independence:0 "取消本土贸易垄断"
 po_jxp_b_trade_independence_desc:0 "殖民地自行缔结贸易并管理港税，仍保留较松散的宗主关系。"
 po_jxp_b_restore_metropole_control:0 "恢复本土控制"
 po_jxp_b_restore_metropole_control_desc:0 "解散武装组织并恢复任命与税役，但二十年的强制治理将持续激起不满。"

 jxp_colonial_independence.1.t:0 "请愿书越过太平洋"
 jxp_colonial_independence.1.d:0 "港町代表没有否认与日本的旧缘，却要求税役、土地和神职任命必须得到海外居民同意。若把请愿压回账箱，问题只会以别的形式出现。"
 jxp_colonial_independence.1.a:0 "在请愿上署名，要求正式答复。"
 jxp_colonial_independence.1.b:0 "仍以本土秩序为重，暂息议论。"
 jxp_colonial_independence.2.t:0 "殖民议席"
 jxp_colonial_independence.2.d:0 "商人、军屯、教团、当地盟友与海外出生者争论谁有资格代表这片社会。无论议席如何组成，它都将成为本土总管以外的新权力中心。"
 jxp_colonial_independence.2.a:0 "让各港和地方盟约推举代表。"
 jxp_colonial_independence.2.b:0 "议席必须由总管核准。"
 jxp_colonial_independence.3.t:0 "没有代表的税役"
 jxp_colonial_independence.3.d:0 "本土为大陆战争追加船税与军役，殖民议席却没有参与决定。仓库主人愿意出钱共同防御，却拒绝为海那一边的战争无限支取。"
 jxp_colonial_independence.3.a:0 "暂停缴纳未获议席同意的税。"
 jxp_colonial_independence.3.b:0 "先垫付一季，换取正式谈判。"
 jxp_colonial_independence.4.t:0 "港口抵制"
 jxp_colonial_independence.4.d:0 "本土专卖商船抵港时，脚夫、通事和船匠拒绝卸货。当地市场愿意维持生活贸易，却不再接受由远方垄断价格。"
 jxp_colonial_independence.4.a:0 "维持有纪律的港口抵制。"
 jxp_colonial_independence.4.b:0 "由双边仲裁席开放共同市场。"
 jxp_colonial_independence.5.t:0 "谁来守卫聚落"
 jxp_colonial_independence.5.d:0 "总管要求本土水军接管城门，地方议席则主张居民民兵才了解道路、粮仓和盟约边界。武装归属已成为政治问题。"
 jxp_colonial_independence.5.a:0 "登记殖民民兵，但由议席约束。"
 jxp_colonial_independence.5.b:0 "组织与当地盟友的共同防御队。"
 jxp_colonial_independence.6.t:0 "保皇派与独立派"
 jxp_colonial_independence.6.d:0 "一方仍把日本视为王统、信仰或家族的故乡，另一方认为海外居民已不能由未曾渡海者代言。继续沉默将使街巷先于议席作出决定。"
 jxp_colonial_independence.6.a:0 "把最后的和解方案送交宗主。"
 jxp_colonial_independence.6.b:0 "接受本土优先的忠诚方案。"
 jxp_colonial_independence.7.t:0 "解散令抵达"
 jxp_colonial_independence.7.d:0 "宗主命令议席交出印玺、税册与民兵名簿。服从可以避免眼前战争，抵抗则意味着本地制度必须靠自己存续。"
 jxp_colonial_independence.7.a:0 "交还印玺，保存尚能保存的秩序。"
 jxp_colonial_independence.7.b:0 "议席来自居民，不能由海上文书解散。"
 jxp_colonial_independence.8.t:0 "仓门前的第一场冲突"
 jxp_colonial_independence.8.d:0 "奉行卫队试图接管港税仓，民兵封住街口。双方仍可后退，但已有伤者倒在共同市场的石阶上。"
 jxp_colonial_independence.8.a:0 "为议席守住仓门。"
 jxp_colonial_independence.8.b:0 "提出最后一份自治停火约章。"
 jxp_colonial_independence.9.t:0 "独立宣言"
 jxp_colonial_independence.9.d:0 "代表们把多年争议写成一份公开宣言：旧有亲缘不等于无限征税，航路记忆也不等于永久服从。如今必须决定宣言是否只是谈判武器。"
 jxp_colonial_independence.9.a:0 "让宣言成为新的政治事实。"
 jxp_colonial_independence.9.b:0 "以贸易自主换取最后的和平。"
 jxp_colonial_independence.10.t:0 "宣言之后"
 jxp_colonial_independence.10.d:0 "宗主拒绝承认宣言。殖民地可以立即保卫首府，等待外国支持与更有利的时机，或在全面战争前撤回主张。"
 jxp_colonial_independence.10.a:0 "为殖民自治而战。"
 jxp_colonial_independence.10.b:0 "先寻找外国支持，战争理由不会消失。"
 jxp_colonial_independence.10.c:0 "撤回宣言，接受本土秩序。"
 jxp_colonial_independence.20.t:0 "殖民地的最后请愿"
 jxp_colonial_independence.20.d:0 "海外议席把税役、总管、贸易和民兵争议汇成一份最后请愿。我们可以承认自治约章、取消贸易垄断、强行解散议席，或让它和平离开。"
 jxp_colonial_independence.20.a:0 "承认自治殖民约章与地方议席。"
 jxp_colonial_independence.20.b:0 "取消专卖，让贸易维系旧缘。"
 jxp_colonial_independence.20.c:0 "解散议席，派军恢复任命与税役。"
 jxp_colonial_independence.20.independence:0 "承认它已成为独立国家。"

 jxp_b_96_independence_crisis_cooldown:0 "忠诚方案的喘息"
 jxp_b_96_independence_crisis_cooldown_desc:0 "殖民议席暂时接受了本土秩序；二十年内同一场争论不会立即重演。"
 jxp_b_96_tax_refusal_modifier:0 "殖民税收拒绝"
 jxp_b_96_tax_refusal_modifier_desc:0 "未获地方议席同意的税役遭到暂缓，财政和秩序同时承压。"
 jxp_b_96_port_boycott_modifier:0 "港口抵制"
 jxp_b_96_port_boycott_modifier_desc:0 "码头拒绝为垄断商船服务，贸易受损而自治组织增长。"
 jxp_b_96_colonial_militia_modifier:0 "殖民民兵名簿"
 jxp_b_96_colonial_militia_modifier_desc:0 "居民为共同防御登记服役，但长期动员增加财政负担。"
 jxp_b_96_foreign_support_search:0 "寻求外国支持"
 jxp_b_96_foreign_support_search_desc:0 "殖民议席向其他海权派遣使节；外交筹码增加，宗主也更加警觉。"
 jxp_b_96_loyalist_independent_split:0 "保皇派与独立派对立"
 jxp_b_96_loyalist_independent_split_desc:0 "两种未来在街巷、会所与军营中争夺人心。"
 jxp_b_96_autonomous_colonial_compact:0 "自治殖民约章"
 jxp_b_96_autonomous_colonial_compact_desc:0 "地方议席掌握内部税役和任命，宗主关系主要维持共同外交与海防。"
 jxp_b_96_trade_independence_compact:0 "贸易自主约章"
 jxp_b_96_trade_independence_compact_desc:0 "殖民地自行管理贸易、港税与商约，本土不再享有垄断关税。"
 jxp_b_96_restored_metropole_control:0 "恢复本土控制"
 jxp_b_96_restored_metropole_control_desc:0 "总管重新掌握税册和任命，却必须长期面对被解散议席的抵抗。"
 jxp_b_96_independence_cb_waits_tt:0 "§Y殖民自治战争§!理由继续有效；本选项不会自动开战或免费获得外国同盟。"
