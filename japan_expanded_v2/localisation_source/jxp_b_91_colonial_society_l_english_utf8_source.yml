l_english:
 jxp_b_decision_open_colonial_society_register_title:0 "开设海外聚落总簿"
 jxp_b_decision_open_colonial_society_register_desc:0 "远海的商馆、泊地与日本町已不再只是随季风聚散的旅居者。国家可以召集船主、通事、僧侣、移民家长与当地代表，登记土地约定、税役和港规，使海外社会进入一条可被追踪、协商也可能脱离本土的道路。"

 jxp_colonial_society.1.t:0 "海外聚落总簿"
 jxp_colonial_society.1.d:0 "来自各港的文书彼此矛盾：奉行称他们是暂居臣民，商人自称受敕许的同业，当地领主则坚持一切土地与市集仍源于双方约定。新的总簿将同时记录海外共同身份、本土任命与地方盟约，而不是假定海那一边仍可照旧治理。"
 jxp_colonial_society.1.a:0 "让每一份权利与义务都有据可查。"
 jxp_colonial_society.3.t:0 "海外诸町的定期评议"
 jxp_colonial_society.3.d:0 "远航归来的总管带回三套彼此竞争的账册：日本町按家庭和行会登记居民，本土奉行按税役和任命登记臣属，当地盟友则按条约、婚姻与共同防御登记权利。选择何者为先，将悄然改变海外社会的归属。"
 jxp_colonial_society.3.a:0 "承认日本町与当地会所共同编纂的名簿。"
 jxp_colonial_society.3.b:0 "由本土奉行统一复核任命与税役。"
 jxp_colonial_society.3.c:0 "让港町议席共同裁定三种账册。"

 jxp_b_colonial_identity:0 "海外共同身份"
 jxp_b_metropole_control:0 "本土控制"
 jxp_b_local_compact:0 "地方盟约"
 jxp_b_91_stage_anchorage:0 "泊地与日本町"
 jxp_b_91_stage_anchorage_desc:0 "船员、通事、商人和少数家属围绕仓库与许可形成季节性聚落，尚未产生独立于本土的公共生活。"
 jxp_b_91_stage_chartered_settlement:0 "敕许殖民地"
 jxp_b_91_stage_chartered_settlement_desc:0 "正式章程、港口法庭、家属移民与常驻总管把泊地变成可持续经营的殖民地。"
 jxp_b_91_stage_autonomous_society:0 "自治殖民社会"
 jxp_b_91_stage_autonomous_society_desc:0 "海外出生的一代、地方财政、民兵和议席已经形成，本土命令必须通过当地制度才能落实。"
 jxp_b_91_stage_colonial_state:0 "殖民国家政治"
 jxp_b_91_stage_colonial_state_desc:0 "海外共同体开始以自己的国家利益解释太平洋贸易、土地权利与对日本的关系。"
 jxp_b_91_recent_colonial_review:0 "聚落名簿复核"
 jxp_b_91_recent_colonial_review_desc:0 "港町、本土和当地盟友刚刚核对过税役、身份与条约，下一轮大争论尚需时日。"

 jxp_b_91_society_initialized_tt:0 "海外聚落将依据既有敕许、航路与新大陆据点建立初始社会状态；三项指标均保持在§Y0—100§!之间。"
 jxp_b_91_local_registers_tt:0 "共同名簿会增强§Y海外共同身份§!与§Y地方盟约§!，同时略微放松§Y本土控制§!。"
 jxp_b_91_metropole_registers_tt:0 "统一任命会显著加强§Y本土控制§!，但可能伤及§Y地方盟约§!。"
 jxp_b_91_town_councils_tt:0 "共同议席会增强§Y海外共同身份§!与§Y地方盟约§!，并使§Y本土控制§!下降。"
