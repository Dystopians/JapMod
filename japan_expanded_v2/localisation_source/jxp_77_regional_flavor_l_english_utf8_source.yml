l_english:
 jxp_77_commission_tsushima_channel_council_title:0 "召集对马海峡评定"
 jxp_77_commission_tsushima_channel_council_desc:0 "出资召集通词、浦众和海防奉行，重新议定对马海峡的航路规则。该评定每五年可举行一次。"
 jxp_77_commission_setouchi_pilot_circuit_title:0 "整编濑户内水先网络"
 jxp_77_commission_setouchi_pilot_circuit_desc:0 "出资整编岛屿水先人、泊税关与船盟，决定内海航路由谁来维持。该评定每五年可举行一次。"
 jxp_77_commission_ryukyu_tribute_gateway_title:0 "议定琉球贡舶门户"
 jxp_77_commission_ryukyu_tribute_gateway_desc:0 "召集使节与港务奉行，决定琉球门户应偏向贡使秩序还是自由转口。该评定每五年可举行一次。"

 jxp_77_debug_tsushima_channel_council_title:0 "[调试]对马海峡评定"
 jxp_77_debug_tsushima_channel_council_desc:0 "清除地域风味临时状态并直接触发对马海峡事件。"
 jxp_77_debug_setouchi_pilot_circuit_title:0 "[调试]濑户内水先网络"
 jxp_77_debug_setouchi_pilot_circuit_desc:0 "清除地域风味临时状态并直接触发濑户内事件。"
 jxp_77_debug_ryukyu_tribute_gateway_title:0 "[调试]琉球贡舶门户"
 jxp_77_debug_ryukyu_tribute_gateway_desc:0 "清除地域风味临时状态并直接触发琉球事件。"

 jxp_77.1.t:0 "两岸之间的通词与烽火"
 jxp_77.1.d:0 "朝鲜海峡上的船只依赖对马通词辨认文书与风信，也依赖沿岸烽火防备倭寇。商人要求扩充翻译公所，武臣则主张把银钱用在巡船与海防。两套制度都会加强海峡秩序，却会把国家推向不同方向。"
 jxp_77.1.a:0 "扩充通词公所，承认跨海商路"
 jxp_77.1.b:0 "整编沿岸巡船，优先守住海门"
 jxp_77.2.t:0 "濑户内的水先人与关津"
 jxp_77.2.d:0 "濑户内海潮汐复杂，熟悉暗礁与潮口的水先人不可或缺。商人希望获得跨港通行的统一札券，沿岸国人则要求保留部分泊税，以承担灯标、救难和治安。"
 jxp_77.2.a:0 "颁发统一水先札，削减旧关津"
 jxp_77.2.b:0 "承认地方泊税，换取共同维护"
 jxp_77.3.t:0 "琉球门户的贡使与商舶"
 jxp_77.3.d:0 "琉球使团带来的文书、礼物与转口货物，让南岛门户同时面对礼制与利润。礼官建议设贡舶奉行，商人则请求开放常设自由港。两者无法在同一套规章下得到完全满足。"
 jxp_77.3.a:0 "设贡舶奉行，维持使节秩序"
 jxp_77.3.b:0 "开放自由港，让商舶自行汇聚"

