l_english:
 jxp_balance.1.t:0 "诸藩请缓法度"
 jxp_balance.1.d:0 "连年法度既定，检地、刀狩与参勤之令层层入村入町。诸藩奉行递上连署，称国法若太密，民间便只能在缝隙中呼吸。幕府诸臣并非反对天下之治，只求为政令留一处回旋之门。"
 jxp_balance.1.a:0 "天下法度须有余地。"
 jxp_balance.1.b:0 "严令既下，不可朝更暮改。"
 jxp_balance.2.t:0 "村法相争"
 jxp_balance.2.d:0 "边郡传来讼牒：水口、山林、寺社旧约与武家新令彼此抵牾。奉行们在案前争论到夜半，终于明白，若不把散在各地的村法重新编入国法，所谓天下便只是一张挂在城中的地图。"
 jxp_balance.2.a:0 "听讼，立界，重书旧约。"
 jxp_balance.2.b:0 "让乡里暂依旧例自处。"
 jxp_balance.3.t:0 "禁里书札如雪"
 jxp_balance.3.d:0 "禁里使者来往不绝，宣旨、札命与谢表堆满案头。名分既隆，仪礼亦繁；若事事求裁，天皇之名便可能被日常政务磨损。公卿低声提醒：尊王之道，有时在于知所不烦。"
 jxp_balance.3.a:0 "让朝仪回归其重。"
 jxp_balance.3.b:0 "借此名分，速断国政。"
 jxp_balance.4.t:0 "冷落的御所"
 jxp_balance.4.d:0 "洛中旧墙仍在，然而车马渐稀，献纳渐薄。朝臣不言怨，史官却会记下沉默。若国家久不向京都致意，天下名分便会像秋草一样从根部枯黄。"
 jxp_balance.4.a:0 "遣使入京，修复礼数。"
 jxp_balance.4.b:0 "国事方急，朝仪暂后。"
 jxp_balance.5.t:0 "港口异语太盛"
 jxp_balance.5.d:0 "堺、长崎与诸港的译语声渐渐压过旧日钟鼓。商人逐利，通事争权，远方之书未经审定便在城下传阅。海门既开，亦须有门槛；否则风会把所有纸页一并吹乱。"
 jxp_balance.5.a:0 "清点译书与港规。"
 jxp_balance.5.b:0 "商路既通，勿以疑惧塞海。"
 jxp_balance.6.t:0 "漂着之书"
 jxp_balance.6.d:0 "风暴过后，海岸人拾得破船木箱，内有湿损海图、药书与几件奇器。奉行起初欲焚之，老通事却说：海若偶然送来一页文字，闭眼并不能使潮水退去。"
 jxp_balance.6.a:0 "收录其书，慎择可用者。"
 jxp_balance.6.b:0 "焚其箱，勿使浮言入国。"
