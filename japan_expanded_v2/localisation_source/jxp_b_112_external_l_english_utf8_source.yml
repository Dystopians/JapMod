l_english:
 jxp_b_112_found_south_seas_company_title:0 "创设南洋朱印会社"
 jxp_b_112_found_south_seas_company_desc:0 "以朱印状统合越南、吕宋、暹罗、马来与香料群岛的生丝、铜银、商馆和护航业务。会社只能依当地王权的许可经营，章程本身不授予领土主权。"
 jxp_b_112_found_north_sea_company_title:0 "创设北海互市会社"
 jxp_b_112_found_north_sea_company_desc:0 "把北海道、千岛、桦太、阿留申与北彼岸的毛皮、鲑鱼、鹰羽、海獭和寒港贸易纳入一份受监督的互市章程。"
 jxp_b_112_found_taiwan_fujian_company_title:0 "创设台湾闽海会社"
 jxp_b_112_found_taiwan_fujian_company_desc:0 "由闽海商人、通事、船主和奉行共同经营台湾据点与福建商埠。海禁、海盗与沿海王朝的更替都可能使这份章程失效。"
 jxp_b_112_found_oceanic_company_title:0 "创设大洋开拓会社"
 jxp_b_112_found_oceanic_company_desc:0 "为群岛泊地、淡水、粮食、移民船和修船场筹措共同资本。岛屿王统和在地社群保留拒绝征地的权利。"
 jxp_b_112_found_new_world_company_title:0 "创设新大陆会社"
 jxp_b_112_found_new_world_company_desc:0 "以太平洋航线连接北彼岸、南彼岸与日本诸港，经营土地契约、港口和本地制造。会社必须承担远航风险，不会凭章程免费获得殖民者或永久宣称。"
 jxp_b_112_review_south_seas_company_title:0 "评议南洋会社业务"
 jxp_b_112_review_south_seas_company_desc:0 "在香料、生丝、护航和日本町之间重新分配会社资本，也可扩大当地董事席位或有序撤出。"
 jxp_b_112_review_north_sea_company_title:0 "评议北海会社业务"
 jxp_b_112_review_north_sea_company_desc:0 "寒港、渔场和毛皮贸易需要持续补给；若债务与强制劳役失控，撤销章程比继续扩张更为稳妥。"
 jxp_b_112_review_taiwan_fujian_company_title:0 "评议闽海会社业务"
 jxp_b_112_review_taiwan_fujian_company_desc:0 "检讨海运、商埠、土地租约与海商法庭，并让当地商人对会社总管提出申诉。"
 jxp_b_112_review_oceanic_company_title:0 "评议大洋会社业务"
 jxp_b_112_review_oceanic_company_desc:0 "远洋泊地不能只在海图上存在。船队、淡水、粮仓与岛屿王权的约书都须重新核验。"
 jxp_b_112_review_new_world_company_title:0 "评议新大陆会社业务"
 jxp_b_112_review_new_world_company_desc:0 "土地条约、港税、本地制造与殖民地代表权彼此牵连；国家可投资、让权，或承认会社已经无力经营。"

 jxp_b_company.charter_negotiated:0 "以当地王权续约为根本"
 jxp_b_company.charter_state:0 "由国家奉行严加监督"
 jxp_b_company.charter_local:0 "让当地商人与社群进入董事会"
 jxp_b_company.host_accept:0 "准其设馆，法权仍归本国"
 jxp_b_company.host_refuse:0 "此章程不得越过我们的海岸"
 jxp_b_company.business_invest:0 "投入新资本与护航经费"
 jxp_b_company.business_local_board:0 "扩大当地董事与通事席位"
 jxp_b_company.business_exit:0 "有序结束这家会社"
 jxp_b_company.crisis_renew:0 "补足股本，续行五年"
 jxp_b_company.crisis_restructure:0 "承认亏损并重整债务"
 jxp_b_company.crisis_dissolve:0 "撤销章程，停止扩大损失"
 jxp_b_company.request_accept:0 "补足资本，交付海外经略册核准"
 jxp_b_company.request_withdraw:0 "撤回请求，结清接口簿"

 jxp_b_company.1.t:0 "南洋朱印会社章程"
 jxp_b_company.1.d:0 "生丝、香料、铜银、日本町与护航船队可由一家公司统筹，但南洋各王权不会把港口主权随一纸朱印状一并交出。评议必须先决定会社如何接受当地法律与监督。"
 jxp_b_company.2.t:0 "北海互市会社章程"
 jxp_b_company.2.d:0 "毛皮、鲑鱼、鹰羽与海獭吸引商人深入寒海，也把强制劳役、冬季损失和俄国竞争带到同一张账簿上。章程必须规定谁能约束公司总管。"
 jxp_b_company.3.t:0 "台湾闽海会社章程"
 jxp_b_company.3.d:0 "台湾港湾、福建海商与沿海船主愿意合资，但海禁与王朝更替使任何垄断都十分脆弱。只有被当地社会承认的商埠才能长久。"
 jxp_b_company.4.t:0 "大洋开拓会社章程"
 jxp_b_company.4.d:0 "群岛航路需要泊地、淡水、粮仓和船厂。当地王统与岛民并非海图上的空白，会社必须以约书而非无主地的假定取得使用权。"
 jxp_b_company.5.t:0 "新大陆会社章程"
 jxp_b_company.5.d:0 "横渡太平洋的资本将投入港口、土地契约与本地制造。若国家只索取税收而拒绝殖民社会发言，会社迟早会成为独立争议的火种。"

 jxp_b_company.81.t:0 "朱印海外商社请求"
 jxp_b_company.81.d:0 "国内会社已经缴纳首期资本，海外经略册建议把朱印船、日本町与南洋商馆统一交给南洋朱印会社。补足余款后，仍须依普通章程决定国家、当地董事与外国王权的权限。"
 jxp_b_company.82.t:0 "太平洋敕许会社请求"
 jxp_b_company.82.d:0 "国内会社已经承担首期船料。若要跨越大洋经营彼岸港口、土地契约与本地制造，还须补足新大陆会社的行政资本与远航准备。"
 jxp_b_company.83.t:0 "南洋会社请求"
 jxp_b_company.83.d:0 "国内商人请求把南方群岛的泊地、淡水、粮仓和船厂纳入共同资本。海外经略册将其归入大洋开拓会社，并要求补足长航线所需资金。"
 jxp_b_company.84.t:0 "北洋会社请求"
 jxp_b_company.84.d:0 "国内会社愿经营北海道、千岛、桦太、阿留申与北彼岸的寒港互市。补足行政经费后，北海互市会社仍须接受当地条约和冬季救济义务。"
 jxp_b_company.85.t:0 "大陆经略会社请求"
 jxp_b_company.85.d:0 "国内会社希望把大陆沿岸的通事、海商与港务编入一份章程。海外经略册将其归入台湾闽海会社，并要求补足商埠与护航资本。"

 jxp_b_company.21.t:0 "南洋王权审议朱印商馆"
 jxp_b_company.21.d:0 "日本会社请求设馆、仓储并组织护航。它愿意缴纳租税和接受本国法庭，但公司私兵与宗教纷争仍使朝廷有所戒备。"
 jxp_b_company.22.t:0 "北海诸首领审议互市章程"
 jxp_b_company.22.d:0 "会社愿以粮食、铁器和船具换取毛皮与海产。首领们要求写明劳动期限、渔场边界和冬季救济，以免互市沦为役使。"
 jxp_b_company.23.t:0 "闽海商人与官府审议商埠"
 jxp_b_company.23.d:0 "日本会社请求租用仓地并设共同账房。沿海官员担心海禁，商人则要求自己在法庭和董事会中拥有席位。"
 jxp_b_company.24.t:0 "岛屿王统审议泊地约书"
 jxp_b_company.24.d:0 "远航船队请求淡水、粮食和修船地。岛民要求会社不得圈占耕地，也不得把临时泊地解释为永久领土。"
 jxp_b_company.25.t:0 "彼岸社群审议会社土地契约"
 jxp_b_company.25.d:0 "会社愿修筑港口并购买粮食，但当地社群要求边界、税额和制造权写入双方都能援引的约书。"

 jxp_b_company.41.t:0 "南洋会社五年评议"
 jxp_b_company.41.d:0 "欧洲公司竞争、私兵、宗教冲突与通事家族的利益使账目愈发复杂。评议可扩充护航、让当地董事监督，或结束营业。"
 jxp_b_company.42.t:0 "北海会社五年评议"
 jxp_b_company.42.d:0 "冬季损失和长距离补给正在吞噬利润。公司若继续经营，必须在资本、当地中介和撤退之间作出选择。"
 jxp_b_company.43.t:0 "闽海会社五年评议"
 jxp_b_company.43.d:0 "海禁、海盗和土地争议使公司总管请求更多兵船；当地商人则要求扩大议席并限制垄断。"
 jxp_b_company.44.t:0 "大洋会社五年评议"
 jxp_b_company.44.d:0 "航路断裂、淡水短缺和失踪船队使若干泊地难以维持。继续经营必须付出新的资本或更多地方自治。"
 jxp_b_company.45.t:0 "新大陆会社五年评议"
 jxp_b_company.45.d:0 "土地税争、欧洲竞争与本地制造禁令激化了殖民社会的不满。公司若不改变治理方式，继续垄断只会加速离心。"

 jxp_b_company.61.t:0 "南洋会社的续资危机"
 jxp_b_company.61.d:0 "护航与商馆开支超过本期股本。国家可以补足资本、承认亏损后重整，或撤销章程。"
 jxp_b_company.62.t:0 "北海会社濒临破产"
 jxp_b_company.62.d:0 "寒港损失与毛皮价格下跌使会社无法按期偿债。继续经营必须公开承担代价。"
 jxp_b_company.63.t:0 "闽海会社债务到期"
 jxp_b_company.63.d:0 "封港、走私和护航损失使账房无力兑付。强行维持垄断只会把公司债务变成国家债务。"
 jxp_b_company.64.t:0 "大洋会社航路断裂"
 jxp_b_company.64.d:0 "数处泊地已经断粮，失踪船队也无法核销。国家须决定是否继续承担这条远海航路。"
 jxp_b_company.65.t:0 "新大陆会社财政崩裂"
 jxp_b_company.65.d:0 "横跨太平洋的船费、土地争议与殖民地税收抵抗一同压垮账簿。公司不能靠新的无偿特权掩盖亏损。"

 jxp_b_112_south_seas_company:0 "南洋朱印会社"
 jxp_b_112_south_seas_company_desc:0 "会社经营生丝、香料、铜银、日本町、商馆与护航，同时承担跨国法权冲突和船队成本。"
 jxp_b_112_north_sea_company:0 "北海互市会社"
 jxp_b_112_north_sea_company_desc:0 "会社维持寒港、渔场和毛皮互市，也必须面对冬季损失、先住民族条约与俄国竞争。"
 jxp_b_112_taiwan_fujian_company:0 "台湾闽海会社"
 jxp_b_112_taiwan_fujian_company_desc:0 "会社经营台湾据点、福建商埠和沿海海运，海禁与地方社会使其治理成本始终存在。"
 jxp_b_112_oceanic_company:0 "大洋开拓会社"
 jxp_b_112_oceanic_company_desc:0 "会社维护岛链泊地、淡水、移民船与船厂，航路越长，补给责任越重。"
 jxp_b_112_new_world_company:0 "新大陆会社"
 jxp_b_112_new_world_company_desc:0 "会社连接彼岸港口与日本市场，殖民增长伴随土地、自治和州务开支。"
 jxp_b_112_negotiated_charter:0 "协定会社章程"
 jxp_b_112_negotiated_charter_desc:0 "商馆权利来自双方约书，译官和使节负责处理争议。"
 jxp_b_112_state_charter:0 "国家监督章程"
 jxp_b_112_state_charter_desc:0 "奉行严格监督会社，国家取得更大商权，也承担更高治理压力。"
 jxp_b_112_local_board_charter:0 "当地董事章程"
 jxp_b_112_local_board_charter_desc:0 "当地商人和社群进入董事会，以较低直接收入换取更稳定的合作。"
 jxp_b_112_company_local_compact:0 "会社当地协约"
 jxp_b_112_company_local_compact_desc:0 "当地王权或社群已经同意一份受法律约束的商馆章程。"
 jxp_b_112_company_local_conflict:0 "会社当地冲突"
 jxp_b_112_company_local_conflict_desc:0 "章程遭到当地拒绝，继续经营正在损害贸易与外交。"
 jxp_b_112_company_business_review_recent:0 "会社业务评议方毕"
 jxp_b_112_company_business_review_recent_desc:0 "账册仍在整理，短期内不宜再次改动业务。"
 jxp_b_112_company_business_investment:0 "会社追加投资"
 jxp_b_112_company_business_investment_desc:0 "新资本用于仓储、护航和船队，但造船与保险成本也随之增加。"
 jxp_b_112_company_representative_board:0 "会社代表董事会"
 jxp_b_112_company_representative_board_desc:0 "当地董事获得发言权，国家让出部分直接收益以降低冲突。"
 jxp_b_112_company_restructuring:0 "会社债务重整"
 jxp_b_112_company_restructuring_desc:0 "亏损已公开列账，债权人与地方社会都要求国家承担后果。"
 jxp_b_112_company_orderly_withdrawal:0 "会社有序撤出"
 jxp_b_112_company_orderly_withdrawal_desc:0 "商馆结清账目并归还租地，短期损失换来较少的外交怨恨。"
 jxp_b_112_company_host_concession:0 "获准的外国商馆"
 jxp_b_112_company_host_concession_desc:0 "外国会社在本国法律下租用仓地并缴纳税费。"
 jxp_b_112_company_host_resistance:0 "抵制外国会社"
 jxp_b_112_company_host_resistance_desc:0 "商人和官员抵制未经充分同意的外国垄断。"
 jxp_b_112_opinion_company_compact:0 "会社协约"
 jxp_b_112_opinion_company_intrusion:0 "会社侵扰"
 jxp_b_112_opinion_orderly_company_exit:0 "有序撤出商馆"

