l_english:
 jxp_19_asa_valley_statutes:0 "一乘谷谷内法"
 jxp_19_asa_valley_statutes_desc:0 "朝仓家把谷内支城、寺社与町屋写入同一套细密法度，使山谷之政可以抵达每一道门前。"
 jxp_19_htk_kanrei_petitions:0 "畠山管领请文"
 jxp_19_htk_kanrei_petitions_desc:0 "畠山旧名重入京洛文书，以管领余威调停诸支，使衰落家声仍可成为政治资本。"
 jxp_19_ike_white_wall_prestige:0 "姬路白壁威仪"
 jxp_19_ike_white_wall_prestige_desc:0 "池田家以姬路白壁昭示新领秩序。城不只是防御之所，也是令邻国承认本家威仪的舞台。"
 jxp_19_mae_kaga_storehouse_books:0 "加贺藏账"
 jxp_19_mae_kaga_storehouse_books_desc:0 "前田家以仓账守富庶，把米谷、金工与城下町收入可长久运转的家政。"
 jxp_19_sba_house_compacts:0 "斯波诸臣连判"
 jxp_19_sba_house_compacts_desc:0 "斯波家重整分散重臣，以连判誓纸压住旧日龃龉，使武卫名分重新有了可用的骨架。"
 jxp_19_ymn_western_army_oaths:0 "山名西军誓纸"
 jxp_19_ymn_western_army_oaths_desc:0 "山名家将西军旧望化为诸支誓纸，召回曾经松散的武门网络。"
 jxp_19_akm_court_rehabilitation:0 "赤松复名礼书"
 jxp_19_akm_court_rehabilitation_desc:0 "赤松家以礼书洗去旧疑，让播磨关砦之外也有可以通行的名分道路。"
 jxp_19_kkc_kikuchi_muster:0 "菊池火国军役"
 jxp_19_kkc_kikuchi_muster_desc:0 "菊池家把肥后诸姓与火国祭礼纳入军役秩序，令山野豪族在同一面旗帜下动员。"
 jxp_19_stk_kanto_petitions:0 "佐竹关东礼书"
 jxp_19_stk_kanto_petitions_desc:0 "佐竹家向关东旧家修书，借源氏名望与鹿岛誓刀共同稳住常陆武门。"
 jxp_19_tki_workshop_routes:0 "土岐工匠商路"
 jxp_19_tki_workshop_routes_desc:0 "土岐家让美浓工匠与河港商路相接，治水图册之外另有纸、刃与货物流通。"
 jxp_19_utn_shimotsuke_guard:0 "宇都宫下野番衆"
 jxp_19_utn_shimotsuke_guard_desc:0 "宇都宫家以番衆守住日光、白河与下野诸路，使北关东道路不再只凭礼书维系。"
 jxp_20_ama_sanin_sea_ledgers:0 "尼子山阴海账"
 jxp_20_ama_sanin_sea_ledgers_desc:0 "尼子家把山阴海岸、银山与港口商书并入月山账册，让城砦阴影之外也有海路收益。"
 jxp_20_hsk_kanrei_petitions:0 "细川管领请文"
 jxp_20_hsk_kanrei_petitions_desc:0 "细川家以管领旧职摄服诸家，使堺町商声之外仍有京洛席次的余威。"
 jxp_20_shn_hakata_wind_books:0 "少贰博多风信"
 jxp_20_shn_hakata_wind_books_desc:0 "少贰家让博多、对马与朝鲜海路的风信入账，九州北门因而更早听见潮声。"
 jxp_20_ogs_suwa_rites:0 "小笠原诹访礼法"
 jxp_20_ogs_suwa_rites_desc:0 "小笠原家以诹访社礼法稳住山国，弓马之名不只属于战场，也属于祭仪与家法。"
 jxp_20_ktb_jingu_domain_accounts:0 "北畠神郡本领"
 jxp_20_ktb_jingu_domain_accounts_desc:0 "北畠家把伊势神郡账册纳入本领政务，使王统叙事有了粮赋与户籍支撑。"
 jxp_20_akt_northern_kin_guard:0 "安东北地亲族番"
 jxp_20_akt_northern_kin_guard_desc:0 "安东家以亲族番衆护持北地互市，软硬之间保住鱼货、毛皮与边境声望。"
 jxp_20_cba_kanto_letters:0 "千叶关东修书"
 jxp_20_cba_kanto_letters_desc:0 "千叶家把香取誓刀与关东旧名写入礼书，使下总武门在刀枪之外也有名分。"
 jxp_20_isk_tango_road_accounts:0 "一色丹后道账"
 jxp_20_isk_tango_road_accounts_desc:0 "一色家整理丹后海雾中的港口、山路与关所账目，令小海国的耳目更为灵便。"
 jxp_20_ito_mountain_rite_compacts:0 "伊东山中礼约"
 jxp_20_ito_mountain_rite_compacts_desc:0 "伊东家以礼约安抚日向山中诸众，支城锁链因地方豪族的承认而更稳固。"
 jxp_20_kno_island_oaths:0 "河野岛众誓约"
 jxp_20_kno_island_oaths_desc:0 "河野家让濑户内岛众立誓听命，潮汐知识和亲族义理一同服务于伊予海路。"
 jxp_20_tti_temple_ledgers:0 "筒井寺社账册"
 jxp_20_tti_temple_ledgers_desc:0 "筒井家把奈良诸寺、町人和武家往来写入账册，使大和寺社法度有了日常凭据。"
 jxp_20_rfr_northern_sea_posts:0 "南部北海番所"
 jxp_20_rfr_northern_sea_posts_desc:0 "南部家允许北海商书通行，并以番所收束雪路与港口，使陆奥边地不再闭塞。"
