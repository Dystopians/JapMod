l_english:
 jxp_decision_convene_route_house_compromise_title:0 "议定诸道家法"
 jxp_decision_convene_route_house_compromise_desc:0 "统一后的日本已经选择国体之路，但开府本家昔日的家法、谱系与国中旧例仍在诸臣心中回响。召集评议，将新路线与旧家风写成可奉行的成法。"
 jxp_route_house_compromise.1.t:0 "锁国法度与开府家风"
 jxp_route_house_compromise.1.d:0 "渡海之风被法度收束，浦港灯火渐次低伏。诸奉行呈上新令：一说当以锁国之纲统摄诸家，一说当让开府本家旧法调和禁海与国中生业。"
 jxp_route_house_compromise.1.a:0 "以祖法固守海门"
 jxp_route_house_compromise.1.b:0 "令开府家风调和禁令"
 jxp_route_house_compromise.2.t:0 "朱印海路与开府家风"
 jxp_route_house_compromise.2.d:0 "外海的帆影越过潮头，通事、船主与町年寄竞相递上账册。新政权可让通商之法压倒旧习，也可借开府本家的旧例为海路立下更熟悉的根。"
 jxp_route_house_compromise.2.a:0 "以朱印路重写天下"
 jxp_route_house_compromise.2.b:0 "令开府家风安置海商"
 jxp_route_house_compromise.3.t:0 "吉利支丹国体与开府家风"
 jxp_route_house_compromise.3.d:0 "钟声与诵经声在港町、城下与旧社寺之间相遇。受洗诸臣希望以新信仰立国，老臣则提醒我们：天下从不会只凭一纸教义安定。"
 jxp_route_house_compromise.3.a:0 "使圣教成为国法之骨"
 jxp_route_house_compromise.3.b:0 "令开府家风约束新仪"
 jxp_route_house_compromise.4.t:0 "朱子礼制与开府家风"
 jxp_route_house_compromise.4.d:0 "讲堂之上，礼经与神名并陈；城下奉行则等待可执行的条目。若国体尽归礼制，旧家法须为新秩序让位；若保留开府家风，礼制也将穿上本国的衣冠。"
 jxp_route_house_compromise.4.a:0 "以礼制厘定百司"
 jxp_route_house_compromise.4.b:0 "令开府家风入于礼经"
 jxp_route_house_compromise.5.t:0 "王政复古与开府家风"
 jxp_route_house_compromise.5.d:0 "禁里奉书重归政令之首，诸家在御阶之外等待新的席次。复古之政可洗去战国旧痕，也可承认开府本家曾以刀笔收拾天下。"
 jxp_route_house_compromise.5.a:0 "使王政统摄旧家"
 jxp_route_house_compromise.5.b:0 "令开府家风奉还于朝"
 jxp_route_house_compromise.6.t:0 "荷兰教会与开府家风"
 jxp_route_house_compromise.6.d:0 "港口长老带来新式账册与经文，火器匠人也在旁聆听。若新会众自成秩序，旧家法将被改写；若纳入开府家风，信约也会学会本国的谨慎。"
 jxp_route_house_compromise.6.a:0 "以会众契约整饬诸港"
 jxp_route_house_compromise.6.b:0 "令开府家风驯化新约"
 jxp_route_house_compromise.7.t:0 "海峡法与开府家风"
 jxp_route_house_compromise.7.d:0 "南海商舶、清真市肆与港口裁判同列一案。诸奉行必须决定：让海峡法成为国家的外向面孔，或让开府本家的旧例先为诸港定下尺度。"
 jxp_route_house_compromise.7.a:0 "以海峡法开诸港"
 jxp_route_house_compromise.7.b:0 "令开府家风安置异俗"
 jxp_route_house_compromise.8.t:0 "门徒公仪与开府家风"
 jxp_route_house_compromise.8.d:0 "寺内町的钟声、百姓的誓纸与城下米仓的钥匙摆在同一张案上。新国体可承认门徒公仪的力量，也可借开府家风使其不至脱离天下法度。"
 jxp_route_house_compromise.8.a:0 "以门徒誓约固结国中"
 jxp_route_house_compromise.8.b:0 "令开府家风安抚坊市"
 jxp_route_house_compromise.9.t:0 "海寇诸法与开府家风"
 jxp_route_house_compromise.9.d:0 "海上诸头目带着异国银钱、刀痕与盟书入见。若任其锋芒，国家将以潮汐为疆界；若收束于开府家风，海上胆气也会被写入可查的法。"
 jxp_route_house_compromise.9.a:0 "以海上盟书拓开边界"
 jxp_route_house_compromise.9.b:0 "令开府家风约束海众"
 jxp_29_sakoku_house_ordinance:0 "锁国开府法"
 jxp_29_sakoku_house_ordinance_desc:0 "海门被谨慎收束，开府以来的家政名目被写入禁海条目，诸藩更容易理解新法的边界。"
 jxp_29_open_house_ordinance:0 "朱印开府法"
 jxp_29_open_house_ordinance_desc:0 "通商凭证、港町账册与旧家奉行制度合为一体，海路利益被纳入国家可掌握的脉络。"
 jxp_29_kirishitan_house_ordinance:0 "圣教开府法"
 jxp_29_kirishitan_house_ordinance_desc:0 "受洗诸臣与旧家老臣共同修订礼仪、赋役与港町教区，使新信仰不致割裂国家。"
 jxp_29_confucian_house_ordinance:0 "礼制开府法"
 jxp_29_confucian_house_ordinance_desc:0 "朱子礼制吸纳开府家法的实际经验，讲堂之言得以进入奉行账册。"
 jxp_29_imperial_house_ordinance:0 "复古开府法"
 jxp_29_imperial_house_ordinance_desc:0 "开府本家的旧功被奉还于朝廷名分之下，禁里文书与武家制度暂得调和。"
 jxp_29_reformed_house_ordinance:0 "信约开府法"
 jxp_29_reformed_house_ordinance_desc:0 "会众契约与开府家法彼此校正，港町教会和武家奉行都获得可遵循的边界。"
 jxp_29_kaikyo_house_ordinance:0 "海峡开府法"
 jxp_29_kaikyo_house_ordinance_desc:0 "南海商法、清真市肆与本国旧例被并入港町条令，异俗贸易因而更可管理。"
 jxp_29_ikko_house_ordinance:0 "门徒开府法"
 jxp_29_ikko_house_ordinance_desc:0 "门徒誓约、寺内町与开府家政被写成共同法度，坊市与城下之间暂得安宁。"
 jxp_29_wokou_house_ordinance:0 "海众开府法"
 jxp_29_wokou_house_ordinance_desc:0 "海上盟书被国家承认并约束，船头、通事与武家奉行在同一张海图上立誓。"
 jxp_29_house_warrior_tempered_route:0 "武门调和国体"
 jxp_29_house_warrior_tempered_route_desc:0 "战阵名簿与旗头誓纸被纳入路线国体，使新政令仍保留开府本家的武门骨气。"
 jxp_29_house_court_tempered_route:0 "京洛调和国体"
 jxp_29_house_court_tempered_route_desc:0 "官途、谱系与禁里往来为新路线添上名分，使诸国更愿承认其法。"
 jxp_29_house_maritime_tempered_route:0 "海国调和国体"
 jxp_29_house_maritime_tempered_route_desc:0 "港町、水军与船主旧例为新路线提供海上经验，国家得以更从容地面对外海。"
 jxp_29_house_frontier_tempered_route:0 "境目调和国体"
 jxp_29_house_frontier_tempered_route_desc:0 "边地番所、马市与远境誓纸被纳入路线制度，使新国体不止停留在畿内文书之中。"
 jxp_29_house_temple_market_tempered_route:0 "社寺市座调和国体"
 jxp_29_house_temple_market_tempered_route_desc:0 "社寺旧契、市座账册与门前町秩序为新路线保存地方可理解的面貌。"
