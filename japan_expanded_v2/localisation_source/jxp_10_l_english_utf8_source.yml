l_english:
 IJP:0 "一向净土国"
 IJP_ADJ:0 "一向净土"
 WAK:0 "倭寇联盟"
 WAK_ADJ:0 "倭寇联盟"

 jxp_realm.1.j:0 "奉持本愿，立一向净土国。"
 jxp_realm.1.k:0 "收束黑潮，立海上奉行国。"

 jxp_ikko_commonwealth_reform:0 "护持禁里门徒国"
 jxp_ikko_commonwealth_reform_desc:0 "门徒国并非背弃京都之名分，而是以寺内町、惣村与本愿寺法脉护持禁里。武家法度仍在，然而其根基不再只系于刀与谱第，亦系于百姓、商町与念佛盟约。"
 jxp_wokou_admiralty_reform:0 "海上奉行国"
 jxp_wokou_admiralty_reform_desc:0 "倭寇联盟将海盗、通事、岛主与水军收束为奉行体系。它向京都奉表，向诸海立法，使黑潮上的私帆变成可役使、可约束、亦可震慑四邻的国家工具。"

 IJP_ideas:0 "一向净土理念"
 IJP_ideas_start:0 "一向传统"
 IJP_ideas_bonus:0 "净土盟约"
 ijp_terauchi_towns:0 "寺内町自治"
 ijp_terauchi_towns_desc:0 "寺内町在战火与年贡之间自筑沟垒、自开市座。钟声、仓廪与账册并置，使信仰共同体也能成为一座能呼吸的城。"
 ijp_monto_oaths:0 "门徒起请"
 ijp_monto_oaths_desc:0 "厌离秽土，欣求净土。门徒在佛前立誓，不只为寺社而战，也为村落的屋梁、田畦与祖灵而战。"
 ijp_saika_gunners:0 "杂贺火器众"
 ijp_saika_gunners_desc:0 "纪伊与河内的铁炮手懂得山径、潮声与火绳。门徒兵并非旧式僧兵，而是在铳声中学会纪律的乡党。"
 ijp_ishiyama_ramparts:0 "石山本愿寺"
 ijp_ishiyama_ramparts_desc:0 "石山临海，城堀与法灯相映。若京都是名分所在，石山便是门徒国的胸臆所在。"
 ijp_peasant_leagues:0 "百姓惣国"
 ijp_peasant_leagues_desc:0 "村与町不再只是被支配之地。惣中会议、纳所账簿与寺社誓约共同织成新秩序，使百姓得以在国法之内说话。"
 ijp_kinri_protectors:0 "禁里护法"
 ijp_kinri_protectors_desc:0 "门徒国向朝廷献上护持之誓。念佛之声不可夺天皇之名，正如武家之刀不可凌驾天下之分。"
 ijp_pure_land_covenant:0 "净土国约"
 ijp_pure_land_covenant_desc:0 "一国之内，佛法、国法与村法各守其位。此约不求将尘世变成净土，却求使乱世不再无端吞没人心。"

 WAK_ideas:0 "倭寇联盟理念"
 WAK_ideas_start:0 "黑潮传统"
 WAK_ideas_bonus:0 "东海诸侯"
 wak_tsushima_brokers:0 "对马通事"
 wak_tsushima_brokers_desc:0 "对马居日朝之间，懂得礼书、牙牌、贡路与私约。真正的海上权势，常从一封写得恰到好处的书状开始。"
 wak_setouchi_pilots:0 "濑户内水先"
 wak_setouchi_pilots_desc:0 "潮汐如阵图，岛影如城垒。濑户内水军熟知每一道狭门，也知道何时该战、何时该藏帆。"
 wak_ryukyu_sea_road:0 "琉球海路"
 wak_ryukyu_sea_road_desc:0 "琉球帆影连接九州、福建与南海。倭寇联盟若能掌其门户，便能听见万里波涛中的银声与谍语。"
 wak_ming_sea_smugglers:0 "明海私商"
 wak_ming_sea_smugglers_desc:0 "禁令之下，海仍有路。所谓私商，有时是罪人，有时是先知；国家所要学会的，是把黑市变成可度量的航线。"
 wak_black_tide_code:0 "黑潮法度"
 wak_black_tide_code_desc:0 "无约之盗终成祸乱，有约之帆则可为国用。黑潮法度以誓纸、赏罚与船籍约束诸海之人。"
 wak_red_seal_corsairs:0 "朱印私掠"
 wak_red_seal_corsairs_desc:0 "一纸朱印，使刀尖与船首有了可宣称的名分。海上奉行国不只放任风浪，也给风浪加上印鉴。"
 wak_eastern_sea_confederates:0 "东海盟主"
 wak_eastern_sea_confederates_desc:0 "从对马到琉球，从堺港到宁波外海，诸帆在同一套信号与盟誓下行驶。东海不再只是边缘，而成为国势所伸之庭。"

 jxp_route_ikko:0 "一向净土国"
 jxp_route_ikko_desc:0 "寺内町、门徒众与京都名分被纳入同一套秩序。此国以念佛起誓，却仍奉天皇为天下之本。"
 jxp_ikko_terauchi_town:0 "寺内町联盟"
 jxp_ikko_terauchi_town_desc:0 "沟垒、仓廪、市座与讲众围绕寺院组织起来。这里既是信仰之所，也是乱世中的自治城。"
 jxp_ikko_monto_militia:0 "门徒持枪"
 jxp_ikko_monto_militia_desc:0 "门徒兵以乡党为伍，以铁炮为证。旧日僧兵之影转化为更严密的地方武装。"
 jxp_ishiyama_fortress:0 "石山坚城"
 jxp_ishiyama_fortress_desc:0 "石山的沟堀、粮仓与法灯共同守护门徒之心。"
 jxp_kinri_protected_by_monto:0 "门徒护持禁里"
 jxp_kinri_protected_by_monto_desc:0 "一向众向京都奉上护持之誓，使朝廷名分不被兵火与俗议夺走。"
 jxp_peasant_commonwealth:0 "百姓之国"
 jxp_peasant_commonwealth_desc:0 "惣村、町众与寺社共同承担国法之责。田畦之人不再只是被征发者，也成为秩序的见证者。"
 jxp_pure_land_covenant:0 "净土盟约"
 jxp_pure_land_covenant_desc:0 "国法、佛法与村法以誓纸相连。人间未必成净土，乱世却可少一些无名之死。"
 jxp_ikko_disaster_modifier:0 "一向一揆"
 jxp_ikko_disaster_modifier_desc:0 "门徒、乡党与寺内町因低落的秩序而聚集，国中出现要求重新分配名分与负担的巨浪。"
 jxp_ikko_reconciled:0 "调停门徒"
 jxp_ikko_reconciled_desc:0 "寺社与奉行所达成调停，乡党怨望暂被纳入可说、可记、可裁的程序。"
 jxp_ikko_suppressed:0 "镇压一揆"
 jxp_ikko_suppressed_desc:0 "国法以武力恢复表面秩序，但乡里仍记得刀光掠过佛灯的夜晚。"
 jxp_route_wokou:0 "倭寇联盟"
 jxp_route_wokou_desc:0 "黑潮上的诸帆被纳入国家法度。倭寇不再只是海上之患，也成为东海秩序的粗砺边缘。"
 jxp_wokou_letters_of_mark:0 "海上朱印状"
 jxp_wokou_letters_of_mark_desc:0 "朱印状约束私帆，使劫掠、侦察与护航都能在国法名义下被清点。"
 jxp_setouchi_pilot_leagues:0 "濑户内水军盟"
 jxp_setouchi_pilot_leagues_desc:0 "濑户内诸岛的水先人与船头被编为同盟，潮汐与岛影成为国家的另一种城墙。"
 jxp_tsushima_brokers:0 "对马中介"
 jxp_tsushima_brokers_desc:0 "对马通事熟悉朝鲜礼书与海上私约，使海上奉行国能够在边境与外交之间来回转身。"
 jxp_ryukyu_sea_gate:0 "琉球海门"
 jxp_ryukyu_sea_gate_desc:0 "琉球航路是南海消息进入日本的门户，也是东海私帆通向更远海域的阶石。"
 jxp_ming_sea_smugglers:0 "明海走私网"
 jxp_ming_sea_smugglers_desc:0 "宁波外海、福建牙行与九州港口之间形成灰色网络。国家尚未完全承认它，却已离不开它。"
 jxp_wokou_admiralty:0 "海上奉行所"
 jxp_wokou_admiralty_desc:0 "奉行所登记船籍、颁发朱印、调停港口争讼。黑潮从此有了账簿。"
 jxp_black_tide_vanguard:0 "黑潮先锋"
 jxp_black_tide_vanguard_desc:0 "被收编的私帆先于官军抵达远海，既侦察，也震慑。"
 jxp_eastern_sea_lords:0 "东海诸侯"
 jxp_eastern_sea_lords_desc:0 "诸海之人不再各自为政。盟约、信号与航路把日本的海岸线向外推到潮水尽头。"

 jxp_decision_sponsor_terauchi_towns_title:0 "扶持寺内町"
 jxp_decision_sponsor_terauchi_towns_desc:0 "寺院、市座、仓廪与沟垒可在战国余烬中形成新的地方秩序。若让门徒有可守之町，也许能在武家之外看见另一条安民之路。"
 jxp_decision_fund_wokou_brokers_title:0 "资助倭寇中介"
 jxp_decision_fund_wokou_brokers_desc:0 "海上之人并非全无规矩。以朱印、赏罚与港口中介约束私帆，可以使黑潮上的传闻、白银与刀锋都转向国家可用之处。"
 jxp_decision_ikko_commonwealth_title:0 "建立一向门徒国"
 jxp_decision_ikko_commonwealth_desc:0 "本愿寺法脉、寺内町与惣村已经织成可统治的共同体。若以护持禁里为誓，门徒国便不只是反叛的名字，而是一种新的天下秩序。"
 jxp_decision_form_wokou_confederacy_title:0 "组建倭寇联盟"
 jxp_decision_form_wokou_confederacy_desc:0 "对马、濑户内与琉球诸路可以被置于同一海上法度。今日之倭寇若纳入国印，明日便可能成为东海诸侯。"

 jxp_ikko_rising:0 "一向一揆"
 jxp_ikko_rising_desc:0 "天下秩序低落、年贡沉重、寺内町自保而起时，门徒与乡党会把平日的诵经声变成战场上的号令。此危机若不能调停，便会逼迫国家重新回答一个问题：谁有资格为天下立法？"

 jxp_ikko.1.t:0 "奉持本愿"
 jxp_ikko.1.d:0 "门徒代表、寺内町年寄与京都使者同列一堂。有人诵起“厌离秽土，欣求净土”，亦有人提醒众人：天皇名分不可被佛灯遮蔽。于是新国体写下第一条誓文：护法，亦护禁里。"
 jxp_ikko.1.a:0 "以本愿护持天下。"
 jxp_ikko.2.t:0 "寺内町联盟"
 jxp_ikko.2.d:0 "城下町的墙外，又出现了另一种城。沟垒护着仓廪，仓廪养着讲众，讲众在钟声中议定市法。寺内町不是逃离国家的洞穴，而是国家尚未学会治理的心脏。"
 jxp_ikko.2.a:0 "让寺内町入国法。"
 jxp_ikko.3.t:0 "门徒持枪"
 jxp_ikko.3.d:0 "火绳枪传入后，门徒兵不再只凭竹枪与誓纸守城。杂贺、根来与诸乡的铳声在佛前回响，像夏草中忽然闪出的雷。"
 jxp_ikko.3.a:0 "铳声亦可护法。"
 jxp_ikko.4.t:0 "石山本愿寺"
 jxp_ikko.4.d:0 "石山之地临海控河，既可储粮，亦可守众。有人说这里不该只是寺院，而该是门徒国的城砦；有人则低声说，城砦若立，天下必将侧目。"
 jxp_ikko.4.a:0 "筑石山，燃法灯。"
 jxp_ikko.5.t:0 "护持禁里"
 jxp_ikko.5.d:0 "门徒使者入京奉表，言佛法不夺王法，惣村不轻禁里。朝臣虽仍疑惧，却也明白，在兵火之后，能护京都者便有资格被京都听见。"
 jxp_ikko.5.a:0 "以门徒守护御所。"
 jxp_ikko.6.t:0 "一向一揆蜂起"
 jxp_ikko.6.d:0 "乡里传来急报：寺内町鸣钟，门徒持枪，百姓以誓纸相聚。此刻只能先定下应对方针；真正的和议、平定或改写天下之约，都要等危机经历考验。"
 jxp_ikko.6.a:0 "先开寺内町与奉行所的谈判。"
 jxp_ikko.6.b:0 "先集结军势，守住国法。"
 jxp_ikko.7.t:0 "百姓之国"
 jxp_ikko.7.d:0 "惣村年寄、寺内町商人、门徒头人与武家奉行共同签押。旧秩序没有被一夜烧尽，却被迫让出席位。百姓之国并非无君之国，而是让田野也能进入政事之国。"
 jxp_ikko.7.a:0 "让田畦也有声音。"
 jxp_ikko.8.t:0 "净土盟约"
 jxp_ikko.8.d:0 "盟约在佛前与朝廷名分之下誊写成册。夜雨过后，寺檐滴水，像俳句中所谓“古池や、かわず飛びこむ水の音”那样短促而清明。乱世仍在，但国中已有可依之誓。"
 jxp_ikko.8.a:0 "愿此誓久照诸国。"

 jxp_wokou.1.t:0 "东海黑旗"
 jxp_wokou.1.d:0 "黑帆在对马海峡与濑户内之间往来。旧日奏报称其为寇，港口商人称其为路，水军头目则称其为饭碗。国家若不理解海上之人，便只能听见海上之祸。"
 jxp_wokou.1.a:0 "将黑潮纳入国印。"
 jxp_wokou.2.t:0 "海上朱印状"
 jxp_wokou.2.d:0 "奉行所拟定朱印状，列明船籍、旗号、分赃、护航与禁犯之事。无印之帆仍为盗，有印之帆则须为国家承担风险。"
 jxp_wokou.2.a:0 "给私帆以约束。"
 jxp_wokou.3.t:0 "对马中介"
 jxp_wokou.3.d:0 "对马人带来朝鲜礼书，也带来海上私语。通事说，边境不是一条线，而是一张网；懂得打结者，才能在风浪中保住国体。"
 jxp_wokou.3.a:0 "重用对马通事。"
 jxp_wokou.4.t:0 "濑户内水军"
 jxp_wokou.4.d:0 "潮急处，帆影如箭。村上、来岛、能岛诸水先人熟知每一道狭门，也熟知每一处可藏船的岛影。将他们编入同盟，便等于把海峡写进兵法。"
 jxp_wokou.4.a:0 "使诸岛为舰。"
 jxp_wokou.5.t:0 "琉球海门"
 jxp_wokou.5.d:0 "琉球船带来香料、明货与南海消息。它们在风帆间传递的并非只有货物，还有远方诸国对日本海权的衡量。"
 jxp_wokou.5.a:0 "开此海门。"
 jxp_wokou.6.t:0 "明海走私"
 jxp_wokou.6.d:0 "禁海并未使海安静，只使海更擅长低语。宁波外海的银、福建牙行的书信、九州港口的夜灯，共同组成一条不肯写在官牒上的航路。"
 jxp_wokou.6.a:0 "把暗潮记入账簿。"
 jxp_wokou.7.t:0 "海上奉行所"
 jxp_wokou.7.d:0 "奉行所设于港口，登记船籍，收录通事，颁发朱印，裁定海上争讼。风浪仍旧无常，但国家终于有了听懂风浪的耳朵。"
 jxp_wokou.7.a:0 "让海有法度。"
 jxp_wokou.8.t:0 "东海诸侯"
 jxp_wokou.8.d:0 "对马、琉球、濑户内与九州诸港的旗号被纳入同一套盟约。黑潮不再只是边陲之水，而成为国威通行之路。开拓万里波涛，布国威于四方。"
 jxp_wokou.8.a:0 "诸海皆闻日轮。"

 jxp_mission_terauchi_league_title:0 "寺内町联盟"
 jxp_mission_terauchi_league_desc:0 "扶持寺内町，使讲众、市座与仓廪成为门徒国的基层根系。"
 jxp_mission_monto_muskets_title:0 "门徒持枪"
 jxp_mission_monto_muskets_desc:0 "让门徒兵掌握新式火器，使信仰共同体不只依靠誓纸守城。"
 jxp_mission_ishiyama_honganji_title:0 "石山本愿寺"
 jxp_mission_ishiyama_honganji_desc:0 "巩固石山或京都附近的据点，使门徒国拥有可以承受围攻的心脏。"
 jxp_mission_break_warrior_country_title:0 "破武家之国"
 jxp_mission_break_warrior_country_desc:0 "武家仍有其位，但国家不能只由武家说话。让惣村、町众与寺内町进入新的国法。"
 jxp_mission_guard_the_kinri_title:0 "护持禁里"
 jxp_mission_guard_the_kinri_desc:0 "向京都证明，门徒国奉护天皇名分，而非以佛灯遮蔽日轮。"
 jxp_mission_peasant_commonwealth_title:0 "百姓之国"
 jxp_mission_peasant_commonwealth_desc:0 "在稳定的国法中确认乡里与城市的职责，使百姓共同体成为治国之器。"
 jxp_mission_pure_land_covenant_title:0 "净土盟约"
 jxp_mission_pure_land_covenant_desc:0 "将佛法、国法与村法写成久远之誓，使一向净土国不再只是一场乱世奇迹。"
 jxp_mission_fund_wokou_title:0 "资助倭寇"
 jxp_mission_fund_wokou_desc:0 "与海上中介和私帆头目建立联系，为日后的海上奉行国奠定粗砺根基。"
 jxp_mission_setouchi_suigun_title:0 "濑户内水军"
 jxp_mission_setouchi_suigun_desc:0 "收束濑户内诸岛水军，让狭门、潮汐与岛影成为国势的一部分。"
 jxp_mission_tsushima_brokers_title:0 "对马中介"
 jxp_mission_tsushima_brokers_desc:0 "重用对马通事，使日朝之间的礼书、贸易与海上情报都能为国家所用。"
 jxp_mission_ryukyu_sea_gate_title:0 "琉球海门"
 jxp_mission_ryukyu_sea_gate_desc:0 "掌握琉球航路，打开通往南海与明海的门户。"
 jxp_mission_ming_sea_smugglers_title:0 "明海走私"
 jxp_mission_ming_sea_smugglers_desc:0 "把暗潮中的银货、书信与私约纳入可度量的航线。"
 jxp_mission_wokou_admiralty_title:0 "海上奉行国"
 jxp_mission_wokou_admiralty_desc:0 "设立奉行所，以朱印、船籍与海法管束诸帆。"
 jxp_mission_lords_of_eastern_sea_title:0 "东海诸侯"
 jxp_mission_lords_of_eastern_sea_desc:0 "使对马、琉球、濑户内与九州诸港同听一套海上号令。"

 jxp_debug_force_ikko_route_title:0 "调试：强制路线：一向宗"
 jxp_debug_force_ikko_route_desc:0 "转为 IJP，设置一向宗路线状态，用于检查门徒国事件、任务与政府改革。"
