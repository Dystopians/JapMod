l_english:
 jxp_daimyo_legacy.a:0 "承认本家的天下遗产。"
 jxp_daimyo_legacy.10.t:0 "天下布武既成"
 jxp_daimyo_legacy.10.d:0 "尾张的朱印、铁炮与城下法度已经越过旧国境。如今诸岛归于一统，织田家的急进军令也被写入新国家的骨架。"
 jxp_daimyo_legacy.11.t:0 "三河谱代治天下"
 jxp_daimyo_legacy.11.d:0 "从三河家臣团到天下政务，德川家的谱代秩序证明忠勤、知行与军役可以成为太平之世的支柱。"
 jxp_daimyo_legacy.12.t:0 "甲州军法治天下"
 jxp_daimyo_legacy.12.d:0 "山国的旗头、骑马武者与军法曾支撑武田之威。统一之后，这套迅疾而严整的军令被纳入国家常制。"
 jxp_daimyo_legacy.13.t:0 "义名归于天下"
 jxp_daimyo_legacy.13.d:0 "越后的义名不再只是出阵前的誓词。上杉家的武名与礼法在统一国家中获得新的解释，成为天下秩序的一部分。"
 jxp_daimyo_legacy.14.t:0 "小田原法度入天下"
 jxp_daimyo_legacy.14.d:0 "小田原的城、町、堀与土垒曾把北条领国连成坚固之器。今日这份守成之术将为整个日本所用。"
 jxp_daimyo_legacy.15.t:0 "濑户内潮路成天下"
 jxp_daimyo_legacy.15.d:0 "毛利家以岛影、潮汐、水军和商船织成海上秩序。统一后的国家仍要借这条潮路理解西国与外海。"
 jxp_daimyo_legacy.16.t:0 "萨摩铁炮定天下"
 jxp_daimyo_legacy.16.d:0 "九州南端的港风带来火药与铅弹，岛津家则以家中军令塑其锋芒。统一后的军制记住了这股远海来的火光。"
 jxp_daimyo_legacy.17.t:0 "府内海门开天下"
 jxp_daimyo_legacy.17.d:0 "大友家的府内曾容纳译者、医师、商人和远方来客。如今海门已归国家掌握，外来知识可以在法度之内流入。"
 jxp_daimyo_legacy.18.t:0 "奥州马背入天下"
 jxp_daimyo_legacy.18.d:0 "北方山河辽远，伊达家的骑马众学会在长路、寒风与边境中保持战力。统一国家也需要这份机动与野心。"
 jxp_daimyo_legacy.19.t:0 "足利名分再临"
 jxp_daimyo_legacy.19.d:0 "御所的名分曾在乱世中被诸国轻慢。若足利一门重收天下，旧日公仪便能重新披上实际政务。"
 jxp_daimyo_legacy.20.t:0 "土佐具足列天下"
 jxp_daimyo_legacy.20.d:0 "长宗我部家将半农半兵的土佐众编录成军。统一之后，这份乡村动员之术仍能让国家快速聚兵。"
 jxp_daimyo_legacy.21.t:0 "山口礼贸归天下"
 jxp_daimyo_legacy.21.d:0 "大内家的山口以礼书、勘合与海路商旅而繁华。今日西国文雅而精密的贸易名分归入天下账册。"
 jxp_daimyo_legacy.22.t:0 "东海道法度治天下"
 jxp_daimyo_legacy.22.d:0 "今川家法曾约束海道之国的寺社、商旅与武家。两都之间的成文秩序，如今成为统一国家的可用遗产。"
 jxp_daimyo_legacy.23.t:0 "海峡取次入天下"
 jxp_daimyo_legacy.23.d:0 "对马宗氏长久往返于朝鲜、日本与海商之间。统一后的国家仍需要熟悉海峡语言、礼物与风向的人。"
 jxp_daimyo_legacy.30.t:0 "山阴旧族入天下"
 jxp_daimyo_legacy.30.d:0 "山名、尼子、赤松与一色诸家曾在山阴、播磨与丹后之间保存旧职、旧盟与旧怨。统一之后，这些曲折门第被重新纳入国家账册。"
 jxp_daimyo_legacy.31.t:0 "管领诸家入天下"
 jxp_daimyo_legacy.31.d:0 "细川、畠山、斯波与近畿诸家熟悉幕府文书、守护旧例与京都礼法。乱世使旧职失色，治世却仍需要懂得旧职的人。"
 jxp_daimyo_legacy.32.t:0 "关东支族入天下"
 jxp_daimyo_legacy.32.d:0 "千叶、佐竹、宇都宫与小笠原诸家守着关东的城、马场与乡党。新日本若要安定东国，就不能只靠京都的文书。"
 jxp_daimyo_legacy.33.t:0 "西国海路入天下"
 jxp_daimyo_legacy.33.d:0 "伊东、菊池、河野与少弐诸家分据九州、伊予与筑前水路。其家名虽不如霸者响亮，却熟知西海的潮声与港口。"
 jxp_daimyo_legacy.34.t:0 "北境诸家入天下"
 jxp_daimyo_legacy.34.d:0 "安东与南部诸家在北方风雪、马市与海路边境中立足。统一之后，北境经验成为国家伸向寒地的一只手。"
 jxp_daimyo_legacy.35.t:0 "近侍新兴诸家入天下"
 jxp_daimyo_legacy.35.d:0 "朝仓、池田与前田诸家或以奉公起身，或以北陆与畿内经营成名。天下既定，新兴家门的勤慎反而更适合承办新政。"
 jxp_daimyo_legacy_oda:0 "织田天下遗产"
 jxp_daimyo_legacy_oda_desc:0 "朱印、铁炮与城下法度共同塑成织田式的天下秩序。"
 jxp_daimyo_legacy_tkg:0 "德川天下遗产"
 jxp_daimyo_legacy_tkg_desc:0 "谱代家臣、知行役账与稳健法度支撑着新国家的太平。"
 jxp_daimyo_legacy_tkd:0 "武田天下遗产"
 jxp_daimyo_legacy_tkd_desc:0 "甲州旗头与骑马武者的军令被纳入统一后的常备军制。"
 jxp_daimyo_legacy_ues:0 "上杉天下遗产"
 jxp_daimyo_legacy_ues_desc:0 "越后的武名与关东旧礼结合，使国家出阵仍能声称大义。"
 jxp_daimyo_legacy_hjo:0 "北条天下遗产"
 jxp_daimyo_legacy_hjo_desc:0 "小田原的总构经验被推广为守土、筑城与城下经营之法。"
 jxp_daimyo_legacy_mri:0 "毛利天下遗产"
 jxp_daimyo_legacy_mri_desc:0 "濑户内水军、港口商旅与潮汐知识共同构成国家的海上手臂。"
 jxp_daimyo_legacy_smz:0 "岛津天下遗产"
 jxp_daimyo_legacy_smz_desc:0 "萨摩铁炮众的火器纪律成为统一军制中最锋利的部分。"
 jxp_daimyo_legacy_otm:0 "大友天下遗产"
 jxp_daimyo_legacy_otm_desc:0 "府内的译者、医师与外来商人让国家更早学会利用远方知识。"
 jxp_daimyo_legacy_dte:0 "伊达天下遗产"
 jxp_daimyo_legacy_dte_desc:0 "奥州骑马众把北方的长路与边境经验带入新国家的军政。"
 jxp_daimyo_legacy_ask:0 "足利天下遗产"
 jxp_daimyo_legacy_ask_desc:0 "旧日公仪、御所近侍与京都礼法重新成为实际政务的一部分。"
 jxp_daimyo_legacy_csk:0 "长宗我部天下遗产"
 jxp_daimyo_legacy_csk_desc:0 "土佐一领具足让乡村武力可以更快集结为国家之兵。"
 jxp_daimyo_legacy_ouc:0 "大内天下遗产"
 jxp_daimyo_legacy_ouc_desc:0 "山口勘合贸易与西国礼法为统一国家保留了通海的文雅名分。"
 jxp_daimyo_legacy_img:0 "今川天下遗产"
 jxp_daimyo_legacy_img_desc:0 "东海道分国法把寺社、商旅与武家纳入可征可治的成文秩序。"
 jxp_daimyo_legacy_soo:0 "宗氏天下遗产"
 jxp_daimyo_legacy_soo_desc:0 "对马取次、朝鲜通交与海峡商路为统一国家保留了一条穿过外海的熟路。"
 jxp_daimyo_legacy_sanin_houses:0 "山阴旧族遗产"
 jxp_daimyo_legacy_sanin_houses_desc:0 "山阴、播磨与丹后旧族的盟约、旧职与国人关系被重新整理，成为新国家的地方经验。"
 jxp_daimyo_legacy_kyoto_office_houses:0 "管领诸家遗产"
 jxp_daimyo_legacy_kyoto_office_houses_desc:0 "近畿与京都旧职诸家的文书经验，使统一后的政务更容易与旧礼法接榫。"
 jxp_daimyo_legacy_kanto_cadet_houses:0 "关东支族遗产"
 jxp_daimyo_legacy_kanto_cadet_houses_desc:0 "关东诸支族的城砦、乡党与马场传统被纳入天下军政。"
 jxp_daimyo_legacy_western_sea_houses:0 "西国海路遗产"
 jxp_daimyo_legacy_western_sea_houses_desc:0 "西海诸家的港口、岛屿与渡海经验，使新日本在外海与九州之间有了更稳的手腕。"
 jxp_daimyo_legacy_northern_frontier_houses:0 "北境诸家遗产"
 jxp_daimyo_legacy_northern_frontier_houses_desc:0 "北方诸家的寒地、马市与边境经验被纳入国家边防。"
 jxp_daimyo_legacy_service_houses:0 "近侍新兴诸家遗产"
 jxp_daimyo_legacy_service_houses_desc:0 "奉公、城下经营与新领治理的经验，使新兴家门成为天下新政的可用支柱。"
